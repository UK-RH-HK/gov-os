[package]
name = "gov-cli"
description = "gov: the Governance OS command-line control surface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gov"
path = "src/main.rs"

[dependencies]
gov-runtime = { path = "../runtime" }
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
anyhow.workspace = true

[dev-dependencies]
# TEST MATERIAL ONLY: the certification harness signs fixture metadata. The `gov` binary never signs — it has no
# signing entry point and no key material (SRR-R0-L4).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex.workspace = true

[[test]]
name = "certification"
path = "../tests/certification/main.rs"
