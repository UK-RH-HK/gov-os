id: API-0001
type: interface
title: Capability Plugin Protocol v1 (gov-capability/1)
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
updated: "2026-09-12"
governed_by: [D-0002, D-0005]
amended_by: [D-0005]
kind: protocol
version: "1.1"
history:
  - {version: "1", at: "2026-09-12", note: "initial contract; invariant 2 promised a silent built-in fallback for failing embed plugins"}
  - {version: "1.1", at: "2026-09-12", note: "D-0005: embed/rerank fail closed (no silent fallback); code_intel degrades with a recorded degradation; plugin governance (schema, registration, pin, authority) is part of the contract; capability signatures rewritten as valid YAML strings (the v1 flow mappings did not parse under strict loaders)"}
producers: [capabilities/python/govos_capabilities, capabilities/shell]
consumers: [runtime/src/capabilities]
contract:
  transport: "stdin/stdout, one JSON request object in, one JSON response object out, UTF-8, exit code 0 on protocol success"
  discovery: "plugin descriptor YAML under governance/project/plugins/*.yaml (or $GOV_PLUGINS_DIR), validated against the kernel schema plugin-descriptor (1.1.0): {plugin_id, capability, command: [...], version (required identity/version pin), languages?, approved_roles?, required_permission_classes?, permissions?, health_check?, pin: {sha256}?, provenance?}"
  governance: "a descriptor is not an authorisation: execution requires a schema-valid descriptor, a resolvable executable, the acting role at/above TOOL_POLICY.plugins.min_authority (or the descriptor's approved_roles for registered plugins), every required permission class held by the role, a presented+answered registration gate for elevated permissions, and a content pin that matches (declared sha256, or the hash first observed for the version); refusals are typed (AUTHORITY_DENIED, PLUGIN_DESCRIPTOR_INVALID, PLUGIN_NOT_AUTHORIZED, PLUGIN_NOT_APPROVED, PLUGIN_PIN_MISMATCH, PLUGIN_UNHEALTHY)"
  request:
    protocol: gov-capability/1
    capability: embed | rerank | code_intel | ecosystem | secret_scan
    request_id: string
    inputs: object (capability-specific)
  response:
    protocol: gov-capability/1
    ok: boolean
    provider: {id: string, version: string}
    outputs: object (capability-specific)
    error: "{code: string, message: string} (present when ok=false)"
  capabilities:
    embed: "inputs: {texts: [string], dimensions?: int}; outputs: {vectors: [[number]], dim: int}"
    rerank: "inputs: {query: string, candidates: [{id, text}]}; outputs: {scores: [{id, score}]}"
    code_intel: "inputs: {path: string, language: string, source: string}; outputs: {symbols: [{name, qualname, kind, lineno, end_lineno, parent, signature}], imports: [string], calls: [{from, name}], chunks: [{qualname, lineno, end_lineno}]}"
    ecosystem: "inputs: {root: string}; outputs: {ecosystems: [{id, manifest, build?, test?, lint?, format?}]}"
  invariants:
    - The core never imports or links a plugin; it only spawns the declared command.
    - "embed and rerank fail closed: a pinned plugin that is missing, invalid, unauthorised, unhealthy, mis-pinned or failing is a typed error (EMBEDDER_UNAVAILABLE / EMBEDDER_MISMATCH / EMBEDDER_BAD_OUTPUT / RERANKER_UNAVAILABLE / RERANKER_MISMATCH or the plugin governance codes); the core never substitutes the built-in embedder for a pinned plugin (D-0005 supersedes the v1 fallback statement)."
    - "code_intel degrades: a failing code-intelligence plugin falls back to the built-in extractor for that file and the degradation is recorded in capability memory; ecosystem tooling absence is a capability gap. Never a crash."
    - Provider id/version are pinned in index-manifest.json; changing them requires a re-index and regression run.
    - Plugins never receive secret-class content: the core filters by repository contract before invocation.
