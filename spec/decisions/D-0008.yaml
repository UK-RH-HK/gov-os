recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending fresh independent reviews and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, pipeline, cache, build environment or transport, and can be extended after ship. Revision 6 applies
  rule FD-1 over a complete decision register: every input that can select an effective fact has at least the authority
  and currency the fact confers, no signature counts for a fact its signer did not establish, and the one remainder no
  mechanism removes on a machine with no prior trust, the first-contact root, is stated with its computed minimum and its
  composition is an owner option (release/root-of-trust/4.1.6/29-FACT-DERIVATION-AND-SELECTION-AUTHORITY.md,
  32-FIRST-CONTACT-ROOT.md).

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary and named by its Trust Base Manifest v3: trust-root chain, purpose table and
         pairwise whitelist, Fact Threshold Check (including root threshold >= 2), decision register, statement schemas,
         floor vocabulary v3, precedence order and YAML profile, newest Trust Policy, Trust State, embedded kernel snapshot
         and its final, the binary's registered source identity and input manifest; genuine only for a binary admitted on
         the machine by an evaluator other than itself (admission-predicate/1);
    T1   authenticated material verified under the T0-rooted chain for its purpose;
    T1-R registered release: a release whose registration is referenced by the effective Trust State;
    T1-E eligible registered release (E1-E10; E7 against its own registration with the admission predicate's
         restrictors); only T1-E may be the policy root;
    LA   local machine authority: admission records in the protected verifier trust store, anchors, trust-gate
         confirmations and per-project records, operator pins in the system pin directory or, under the integrity
         predicate, the account configuration, and a human reading the first-contact sources now; valid only on this
         machine; never transferable through a repository;
    T2   OS-written project state; Git-tracked T2 records are requests for every trust decision;
    T3   derived state bound to content identity and effective-policy digest;
    T4   repository- or user-writable artefacts not currently verified, including the project overlay, journals,
         snapshots and adapter bodies;
    T5   caller-controlled input, environment variables, source paths and contents, descriptive manifests, CI-proposed
         registration content;
    T6   plugin- and model-controlled data.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, with
  every floor leaf of the Constitutional Surface joined with the effective Trust Policy; when that cannot be established
  the embedded baseline is substituted explicitly and mutating operations fail closed. (2) registered, approved, verified,
  eligible, certified, current, anchored, admitted, human_approved, authority, provenance are facts of T0/T1/T2 or local
  machine authority only; a lower-class field carrying such a name is a request. (3) A project layer may specialise or
  strengthen, never weaken; admitted project strengthening is removed only by a computed reduction accepted per project,
  and no refusal of a weakening discards an admitted strengthening. (4) Every refusal is typed and auditable.

  Proposed rules (5)-(27) (O1-O8 were the owner-required rules of revision 2; release/root-of-trust/4.1.6/15-D-0007-SUPERSESSION.md §5):
  (5) [O1] Authenticity cannot be derived from mutually consistent candidate files.
  (6) [O2] Authenticity does not imply eligibility, and floors are total and sound: every file and leaf of the
      Constitutional Surface has exactly one floor semantics from a closed compiled vocabulary; unclassified content is
      denied; registered content that is absent is refused or resolves to a registered value or a typed refusal; floors
      are joins; POLICY_PRECEDENCE must equal its registration exactly and the project layer's precedence comes only from
      registrations, applied as a directed join; non-join constitutional units are fixed per registered release by a
      registration whose content each custodian established first-hand: exactly one value per unit per release,
      append-only; eligibility and effective values use only the registration of the release judged; presence is
      release-scoped; for non-orderable units "down" means a later registration that restores a superseded value, removes a
      unit or narrows a member set, computed by the verifier over every registration the effective Trust State references
      (INCOMPLETE when one is not held) and refused when undeclared; every other change of a security-classified
      non-orderable unit is selected by the registration authority and listed in the per-project gate before
      security-relevant use; exceptions never relax floor-, pinned-, members- or precedence-class keys or compiled
      prefixes; values and admitted project strengthening move down only through a computed, cumulatively declared
      reduction accepted per project by a trust gate.
  (7) [O3] Trust state is monotonic, anchors are satisfied by inclusion, and currency needs a proof that names the
      selected Trust State; negative facts are sticky; absence is never positive; trust-state minimums come only from the
      trust-state lineage; equivocations and forks are refused; pins carry mandatory validity; no surface says current; on a
      machine with a verifier trust store every ingested non-future statement raises the clock high-water, and a statement
      refused as issued in the future makes clock-based proofs unusable.
  (8) [O4] The bytes verified are the bytes installed and enforced, in every unit of work of every process; a binary is
      installed from the buffer its evaluator measured.
  (9) [O5] Key purposes and statement types are domain-separated under a compiled pairwise whitelist and the Fact
      Threshold Check. A production binary is accepted only by admission-predicate/1: a release registration at root
      threshold or a root-granted quorum of at least two keys, referenced by the selected Trust State, fixing source
      identity, input manifest, build environments established first-hand, final, targets and verification records counted
      only for exactly the registered candidate and kernel; at least two first-person reproductions by distinct reproducer
      keys that hold no other purpose, under registered environments, confirmed first-hand and free of conflict, a conflict
      or REJECTED attestation removed only by the registration authority; publication in the selected Trust State; the
      negative set; a Trust Base Manifest resolving at or above the accepted-TBM high-water; and a currency proof naming the
      selected state. No purpose signs a fact its signer did not establish; release-artifact and build-attestation are
      withdrawn; currency is never signed by the trust-state purpose.
  (10) [O6] Protected trust paths (governance/trust, the occupation entries, the transaction area) are written only by the
      install transaction; RoT-1 commands refuse a working directory inside them, the transaction area included; the
      installation state is COMPLETE only when their closed entry sets hold; legacy litter in the transaction area is
      reported and inert.
  (11) [O7] Incoming releases never define the authority required to install themselves, nor the actor levels used to
      check it.
  (12) [O8] Pre-RoT binaries fail before any write on RoT-1 projects for invocations rooted at the project while the
      occupation layout is intact; for invocations rooted in a subdirectory, every write under governance/trust or the
      occupation directory leaves a state RoT-1 binaries treat as not COMPLETE, and every nested legacy install and stray
      governance/spec or governance/views/spec tree is reported; no binary interprets a format or layout it does not
      implement; once occupation entries are removed or pre-migration paths are restored by Git, RoT-1 binaries fail closed
      and report lost project strength where it was recorded.
  (13) Statement facts only; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure.
  (15) Flags, environment and repository files cannot add trust (no admissions, anchors, confirmations, keys, policies,
      registrations, state, certification or eligibility).
  (16) No self-validation: no binary evaluates its own acceptance, first acceptance, CI image acceptance and legacy
      migration included; no trust ceremony runs on a binary that an evaluator other than itself has not admitted on the
      machine; the evaluator of a first admission is selected by the code agreed across the owner's first-contact sources,
      never by one source.
  (17) Release authenticity, source selection, build-input and build-environment selection, constitutional-content
      selection, byte observation, verification result, certification state, publication, currency and eligibility are
      distinct facts with distinct selectors; release-final selects none of them.
  (18) Authorisation for trust decisions is never a repository record or a file the governed account can write: trust
      gates are answered only by local confirmations bound to the decision's digests (and, for C3 kinds, a typed state
      fingerprint) or by protected decision pins within their maximum validity; repository gate records are requests.
  (19) No trust ingress without an anchor and a currency proof naming the selected state; first admission of a binary
      uses the first-contact manifest bound by a code agreed across the sources of the owner's OP-13 answer as its only
      selector of lineage, state and evaluator, with a compiled source quorum; the first-contact root that remains is stated
      with its computed minimum; governed use without an anchor only as OP-7 allows.
  (20) Project-owned strength is recorded as requirements over the effective policy and overlay by every install
      transaction and gated overlay change; on a machine without a record the requirements are computed from the
      pre-transaction inputs; a weakening made outside a gated transaction, by any change, is reported and
      security-relevant mutation is refused until a trust gate accepts it; no remedy clears it; migrations write only
      root-registered Overlay Surface targets and their content is fixed by the release registration.
  (21) Repository- and plugin-supplied commands that gov runs are write-confined by an allow list away from pins, the
      verifier trust store, trust paths, PATH directories, the running executable and shell start-up files, and run only
      after the unit of work's trust decisions; code the account later runs unconfined is A3.
  (22) Fact derivation and selection authority (FD-1): every input of a trust decision is a selector, restrictor or
      carrier in a complete compiled decision register (release/root-of-trust/4.1.6/decision-register/DECISION_REGISTER.yaml);
      every selector has authority and currency at least those the decision confers and every selector substitution is a
      strategy of the derivation calculator; a signature counts only for a fact its signer established first-hand; the
      artefact judged is never a selector or its own evaluator; a shortfall fails closed or is a stated, labelled, tested
      residual; minimum capability sets and every consequence statement are generated by the calculator, never argued.
  (23) Independent admission: a RoT-1 binary without an admission record held in its protected verifier trust store naming
      its own digest runs C0 only; C3 and ceremonies need a protected executable and record (an effective uid of 0 is
      writable); only a first admission (no store, or no admission record ever written in it) starts a fresh verifier
      trust store, and re-admission keeps it; admissions are serialised; a genuine binary holding its own revocation
      restricts itself as OP-15 decides.
  (24) A release is registered once, with its content established first-hand by the registration authority; a
      registration that changes a registered release, gives one sequence two releases, or registers several values for one
      unit is malformed and refused.
  (25) First-contact root: on a machine with no prior trust, lineage, state, source quorum and evaluator are selected only
      through a first-contact manifest bound by a code agreed across the sources the owner's OP-13 answer names; the quorum
      is compiled and never read from the selected state; lineage comes from the typed value; the evaluator is bound to the
      selected state; the remainder is the first-contact root, stated with calculator-computed minima equal to executed
      results.
  (26) Build environment established first-hand: every byte-determining build input has a registered selector whose content
      is established first-hand (components against upstream signed checksums; environments by a first-hand reproduction
      quorum; reproducers re-assemble), or is the stated residual of the owner's OP-16 answer; the pipeline selects none.
  (27) Every root version has a root threshold of at least 2; a restrictor (a conflicting reproduction, a REJECTED
      attestation) is removed only by a revocation under the registration authority.
consequences_if_approved:
  - "Every release that ships a kernel, binaries or the admitter is registered once (source identity v2, input manifest v2, build environments, final, targets, verification records for exactly the candidate and kernel, constitutional unit map and kernel tree digest derived first-hand by each custodian) by the root threshold or a root-granted quorum (release/root-of-trust/4.1.6/30-RELEASE-REGISTRATION-AND-REPRODUCTION.md, 33-BUILD-ENVIRONMENT.md, 34-FIRST-HAND-CONSTITUTIONAL-CONTENT.md)."
  - "Build environments are pinned to upstream signed checksums and established by at least two first-hand environment reproductions; binary reproducers re-assemble them; the owner answers OP-16 for the common-mode environment residual."
  - "Production binaries are reproduced by at least two independent reproducers from the registered source in registered environments with inputs by digest, bit-for-bit under a normative build profile; the trust-state publisher references exactly one quorum digest per release and target and applies E7's restrictors before referencing a registration."
  - "The owner publishes a first-contact manifest and code for every Trust State through the sources of its OP-13 answer; every machine admits its first gov with gov-admit after the first-contact procedure, never executing the candidate and installing the measured bytes; re-admission keeps the verifier trust store; CI images do the same at image build with expiring records; legacy consumers never verify a RoT-1 binary with itself (release/root-of-trust/4.1.6/31-INDEPENDENT-ADMISSION.md, 32-FIRST-CONTACT-ROOT.md)."
  - "Eligibility (E7) applies the admission predicate's restrictors and verifier-side registration reductions; the coverage checker implements first-hand registration verification, verifier reductions and registration changes (release/root-of-trust/4.1.6/constitutional-surface/)."
  - "Anchors are satisfied only by inclusion; a currency proof names the Trust State it covers; pins and decision pins expire within maxima; a stateful clock high-water is raised by every ingested non-future statement; no surface says current; a user-writable installation reaches only the classes stated per OP-7 answer."
  - "Trust gates are local confirmations or protected decision pins within their maximum validity; repository gate records are requests; repository-supplied commands run under allow-list confinement; C3 needs a binary installed where the governed account cannot write."
  - "RoT-1 projects use the legacy-path-occupation layout with closed trust entry sets (including governance/trust/.gitattributes) and RoT-1 root discovery; pre-RoT binaries write nothing for root-anchored invocations."
  - "The decision register and the derivation calculator are part of the release: the binary compiles the register, and owner-option consequences are regenerated by the calculator whenever the release process changes."
  - "Private signing keys never exist in any repository, payload, CI log or consumer; release build refuses private key material."
  - "Only after approval: this record becomes ACTIVE (state_class AUTHORITATIVE, chosen_option recorded, human_approved true, supersedes [D-0007]); D-0007 becomes SUPERSEDED; ARCH-0002 becomes ACTIVE; owner answers to OP-1..OP-16 are recorded; the record schema gains a PROPOSED status (or active() excludes in_effect false)."
