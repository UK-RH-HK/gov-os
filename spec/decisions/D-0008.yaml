recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending fresh independent reviews and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, pipeline, cache, build environment, publication process or transport, and can be extended after ship.
  Revision 7 applies rule FD-1 over a register complete over every input value, to one concrete profile whose every parameter
  the owner selected, and states the unavoidable core honestly: a machine that has never received newer metadata cannot know
  it (release/root-of-trust/4.1.6/35-CERTIFIED-PROFILE.md §3, 24-FRESHNESS-ANCHORING-AND-MACHINE-BOOTSTRAP.md §10).

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary and named by its Trust Base Manifest v4: trust-root chain, purpose table and
         the three-pair whitelist, CP-1 shapes, profile identity, decision register, statement schemas, floor vocabulary v3,
         precedence order and YAML profile, newest Trust Policy, Trust State, embedded kernel snapshot and its final, the
         binary's registered source identity and input manifest; genuine only for a binary admitted on the machine by the
         compiled admitter (admission-predicate/1);
    T1   authenticated material verified under the T0-rooted chain for its purpose;
    T1-R registered release: a release whose 2-of-3 registration is referenced by the effective Trust State;
    T1-E eligible registered release (E1-E10; E7 against its own registration with the admission predicate's restrictors;
         at or above the computed security minimum); only T1-E may be the policy root;
    LA   local machine authority: admission records and floors in the protected admission store, anchors, trust-gate
         confirmations and per-project records in the account store, operator pins in the system pin directory, and a human
         reading both first-contact sources now; valid only on this machine; never transferable through a repository;
    T2   OS-written project state; Git-tracked T2 records are requests for every trust decision;
    T3   derived state bound to content identity and effective-policy digest;
    T4   repository- or user-writable artefacts not currently verified, including the project overlay, journals,
         snapshots and adapter bodies;
    T5   caller-controlled input, environment variables, source paths and contents, descriptive manifests, CI-proposed
         registration content, pipeline-supplied environment manifests;
    T6   plugin- and model-controlled data.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, with
  every floor leaf of the Constitutional Surface joined with the effective Trust Policy; when that cannot be established
  the embedded baseline is substituted explicitly and mutating operations fail closed. (2) registered, approved, verified,
  eligible, certified, current, anchored, admitted, human_approved, authority, provenance are facts of T0/T1/T2 or local
  machine authority only; a lower-class field carrying such a name is a request. (3) A project layer may specialise or
  strengthen, never weaken; admitted project strengthening is removed only by a computed reduction accepted per project,
  and no refusal of a weakening discards an admitted strengthening. (4) Every refusal is typed and auditable.

  Proposed rules (5)-(31) (O1-O8 were the owner-required rules of revision 2; release/root-of-trust/4.1.6/15-D-0007-SUPERSESSION.md §5):
  (5) [O1] Authenticity cannot be derived from mutually consistent candidate files.
  (6) [O2] Authenticity does not imply eligibility, and floors are total and sound: every file and leaf of the
      Constitutional Surface has exactly one floor semantics from a closed compiled vocabulary; unclassified content is
      denied; registered content that is absent is refused or resolves to a registered value or a typed refusal; floors
      are joins; POLICY_PRECEDENCE must equal its registration exactly and the project layer's precedence comes only from
      registrations, applied as a directed join; non-join constitutional units are fixed per registered release by a
      registration whose content each custodian established first-hand: exactly one value per unit per release,
      append-only; eligibility and effective values use only the registration of the release judged; presence is
      release-scoped; for non-orderable units "down" means a later registration that restores a superseded value, removes a
      unit or narrows a member set, computed by the verifier over every registration the effective Trust State references
      (INCOMPLETE when one is not held) and refused when undeclared; every other change of a security-classified
      non-orderable unit is selected by the registration authority, flagged security-relevant and listed in the per-project
      gate before security-relevant use; exceptions never relax floor-, pinned-, members- or precedence-class keys or
      compiled prefixes; values and admitted project strengthening move down only through a computed, cumulatively declared
      reduction accepted per project by a trust gate.
  (7) [O3] Trust state is monotonic, anchors are satisfied by inclusion within their validity (90 days workstation, 7 days
      CI), and currency for installation, update, rollback and ingress needs a proof of at most 24 hours that names the
      selected Trust State and is read from both first-contact sources; negative facts are sticky; absence is never positive;
      held negatives, anchors, floors and high-waters apply at every admission, re-admission included, and never move
      backwards; equivocations and forks are refused; no surface says current; a clock below the machine's recorded
      high-water leaves read-only diagnostics.
  (8) [O4] The bytes verified are the bytes installed and enforced, in every unit of work of every process; a binary is
      installed from the buffer its evaluator measured.
  (9) [O5] Key purposes and statement types are domain-separated under a compiled three-pair whitelist and exact CP-1
      shapes. A production binary is accepted only by admission-predicate/1: a 2-of-3 delegated release registration,
      referenced by the selected Trust State, fixing source identity, input manifest, the environment lock, environments
      derived from it and established by agreeing environment reproductions and the registration over their exact identity,
      two independent toolchain lineages, final, targets, binary digests and two verification records counted only for
      exactly the registered candidate, kernel and environments; at least two first-person reproductions by distinct
      single-purpose reproducer keys across two supplier classes and two toolchain lineages independent by provenance,
      confirmed first-hand, equal to the registered digest and free of conflict, a conflict or REJECTED attestation removed
      only by the registration authority; publication in the selected Trust State; the negative set; the computed security
      minimum; a Trust Base Manifest resolving at or above the accepted-TBM high-water; and a currency proof naming the
      selected state. No purpose signs a fact its signer did not establish; release-artifact, build-attestation and
      freshness-witness are not granted; currency is never signed by the trust-state purpose.
  (10) [O6] Protected trust paths (governance/trust, the occupation entries, the transaction area) are written only by the
      install transaction; RoT-1 commands refuse a working directory inside them; the installation state is COMPLETE only
      when their closed entry sets hold; a crash during the first-install layout migration recovers to the exact legacy
      layout or the completed install; RoT-1 init never runs over an existing overlay without evaluating its strength.
  (11) [O7] Incoming releases never define the authority required to install themselves, nor the actor levels used to
      check it.
  (12) [O8] Pre-RoT binaries fail before any write on RoT-1 projects for invocations rooted at the project while the
      occupation layout is intact; for invocations rooted in a subdirectory, every write under governance/trust or the
      occupation directory leaves a state RoT-1 binaries treat as not COMPLETE, and every nested legacy install and stray
      spec tree is reported; no binary interprets a format or layout it does not implement; once occupation entries are
      removed or pre-migration paths are restored by Git, RoT-1 binaries fail closed and report lost project strength
      where it was recorded.
  (13) Statement facts only; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure; a target that does not meet the certification criteria is not certified.
  (15) Flags, environment and repository files cannot add trust (no admissions, anchors, confirmations, keys, policies,
      registrations, state, certification, eligibility or designation of first-contact sources).
  (16) No self-validation: no binary evaluates its own acceptance, first acceptance, CI image acceptance and legacy
      migration included; no trust ceremony runs on a binary that the compiled admitter has not admitted on the machine;
      the evaluator of a first admission is selected through the First-Contact Authority record both sources show; no
      unadmitted binary or carrier supplies the source list or procedure steps.
  (17) Release authenticity, source selection, build-input, environment and toolchain selection, constitutional-content
      selection, byte observation, verification result, certification state, publication, currency and eligibility are
      distinct facts with distinct selectors; release-final selects none of them.
  (18) Authorisation for trust decisions is never a repository record or a file the governed account can write: trust
      gates are answered only by local confirmations bound to the decision's digests (and, for C3 kinds, both sources' state
      codes) or by protected decision pins within their maximum validity for the kinds they may approve; repository gate
      records are requests.
  (19) No trust ingress without an anchor and a currency proof of at most 24 hours naming the selected state; first
      admission of a binary selects lineage and evaluator only through the First-Contact Authority record at root threshold
      and the state only through the Trust State both sources publish first-hand, at most 24 hours old and never below held
      state; the first-contact root that remains is stated with its computed minimum; no governed use without a valid anchor.
  (20) Project-owned strength is recorded as requirements over the effective policy and overlay by every install
      transaction and gated overlay change; on a machine without a record the requirements are computed from the
      pre-transaction inputs; a weakening made outside a gated transaction, by any change, is reported and
      security-relevant mutation is refused until a trust gate accepts it; no remedy clears it or a pending gate; the
      per-project record is keyed by project identity and a locally recorded repository identity; migrations write only
      root-registered Overlay Surface targets and their content is fixed by the release registration.
  (21) Repository- and plugin-supplied commands that gov runs are write-confined by an allow list away from pins, both
      stores, trust paths, PATH directories, the running executable and shell start-up files, and run only after the unit of
      work's trust decisions; code the account later runs unconfined is A3.
  (22) Fact derivation and selection authority (FD-1): every input of a trust decision — every field of every statement,
      manifest and local record and every procedure input — is a selector, restrictor, binding, carrier, informational or
      excluded input in a complete compiled decision register
      (release/root-of-trust/4.1.6/decision-register/DECISION_REGISTER.yaml) naming its establishing party; every selector
      has authority and currency at least those the decision confers and every selector substitution is a strategy of the
      derivation calculator; a signature counts only for a fact its signer established first-hand; the artefact judged is
      never a selector or its own evaluator; a shortfall fails closed or is a stated, labelled, tested residual; minimum
      capability sets and every consequence statement are generated by the calculator with an injective renderer, never
      argued.
  (23) Independent admission: a RoT-1 binary without an admission record held in the protected admission store naming its
      own digest and a listed compiled admitter runs read-only diagnostics only; C3 and ceremonies need a protected
      executable and record (an effective uid of 0 is writable); only the protected store's marker decides a first
      admission, which moves the account store aside, and re-admission keeps and enforces both stores; admissions are
      serialised; every admission record expires; a genuine binary holding its own revocation runs read-only diagnostics.
  (24) A release is registered once, with its content established first-hand by the registration authority; a
      registration that changes a registered release, gives one sequence two releases, or registers several values for one
      unit is malformed and refused.
  (25) First-contact root: on a machine with no prior trust, lineage and evaluator are selected only by the First-Contact
      Authority record at root threshold and the state only by the Trust State whose code both sources publish after
      first-hand verification; the quorum and lineage are compiled; the remainder is the first-contact root (both sources,
      their designation, or one of them with an operator reading it twice), stated with calculator-computed minima equal to
      executed results; the trust-state publication process, carriers and unadmitted binaries are in no minimal set.
  (26) Build environment established first-hand: component selection and placement come only from the environment lock in
      registered source; environment manifests are derived by a fixed function, verified under supplier keys pinned at root
      threshold and authoritative only with agreeing environment reproductions and the 2-of-3 registration over their exact
      identity; supplier-class and toolchain-lineage independence are computed from root-registered provenance, never labels;
      the pipeline selects none of them.
  (27) Every root version has exactly the CP-1 shapes (root 3 keys at 2); a restrictor (a conflicting reproduction, a
      REJECTED attestation) is removed only by a revocation under the registration authority.
  (28) One certified production profile (governance-os.rot1/CP-1): every owner design requirement is applied exactly;
      every unselected mode (the exclusions of release/root-of-trust/4.1.6/profile/CP-1.yaml) is absent from the certified
      schemas, executable surface and calculator, or refused by a typed code; a later mode needs a separately governed,
      independently reviewed release with a new profile identity.
  (29) The first-contact trust base and admitter identity are approved at root threshold 2-of-3 after the admitter's
      registration, reproduction and two verification records; ordinary release, registration, revocation and trust-state
      keys cannot redefine the first-contact root.
  (30) A target is labelled CERTIFIED only when CC-1..CC-9 hold for gov and gov-admit on it; otherwise it has no production
      admission.
  (31) Owner trade-offs the architecture finds (OT-1 offline media versus 24-hour freshness; OT-2 feasibility of
      independently bootstrapped compiler agreement) are stated with options and consequences and never decided by the
      architecture; meanwhile the stricter reading applies.
