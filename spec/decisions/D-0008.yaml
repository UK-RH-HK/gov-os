question: >
  Eight consecutive rejections (4.1.3, 4.1.4, 4.1.5, RoT-1 revisions 1-5) share one class: a lower-trust input yielding a
  current, higher-trust fact. Revision 5's remaining instances were one first-contact channel page selecting the lineage, the
  channel quorum and the evaluator of a machine's first TCB; a build-image record with no assigned authority selecting the
  bytes of every production binary; the release pipeline with threshold-1 candidate and final keys selecting the constitutional
  content the registration signed; and consequence statements derived from an incomplete decision register. Which root of
  trust should govern every Governance OS kernel, release and binary ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2"}
  - {id: B, description: "Binary-embedded digest registry only - non-circular but cannot extend trust after the binary ships"}
  - {id: C, description: "RoT-1 revision 6: rule FD-1 over a complete decision register (every input of a trust decision is a selector, restrictor or carrier; selectors have the authority and currency the decision confers; signatures count only for facts their signers established; the artefact judged never evaluates itself; every selector substitution is a strategy of the derivation calculator and every consequence statement is generated by it); a release registered once, append-only, by the root threshold or a root-granted quorum of at least two keys, fixing source identity v2, input manifest, build environments established by first-hand environment reproduction from upstream-checked components, final, targets, verification records bound to exactly the registered candidate and kernel, and every non-join constitutional unit derived first-hand by each custodian; production binaries established by at least two first-person reproductions under registered environments, confirmed first-hand and free of conflict, restrictors removed only by the registration authority; one admission predicate evaluated by the independent executor gov-admit on first admission (a first-contact code agreed across the owner's designated sources binding lineage, state and admitter list; compiled source quorum; evaluator binding; measured bytes; install from buffer; store kept on re-admission) or by an admitted gov with a currency proof naming the selected state; the first-contact root stated with computed minima; genuine binaries refuse above C0 without an admission record in the protected store; a total Constitutional Surface with default deny, exact precedence registration, release-scoped presence, E7 with the admission predicate's restrictors and verifier-side registration reductions; monotonic trust state with inclusion anchors; local trust gates and allow-list confinement; verify-and-use; legacy-path occupation with closed trust entry sets including a line-ending attribute member, and RoT-1 root discovery"}
