  Root-of-trust architecture RoT-1 revision 5 for candidate 4.1.6, the escalation synthesis of two root-cause specialist
  alternatives, amending revision 4 (bca05a7) after review 97a5545 returned ROOT_OF_TRUST_ARCHITECTURE_REJECTED
