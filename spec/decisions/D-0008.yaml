  - {id: C, description: "RoT-1 revision 7, certified profile CP-1: rule FD-1 over a decision register complete over decisions, rules, every schema field and every procedure input with its establishing party; root 3 keys at 2-of-3 under three custodial roles; a 2-of-3 delegated release registration fixing source identity v2, input manifest v3, the environment lock of the registered source, environments derived by gov-envmanifest/1 and established by agreeing environment reproductions, two independent toolchain lineages, final, targets, two independent verification records bound to exactly the registered candidate, kernel and environments, first-hand constitutional content, binary digests from the custodians' own reproduction and the security-relevant-change flag; production binaries established by 2 of 3 reproducers across two supplier classes and two toolchain lineages independent by provenance; a First-Contact Authority record at root threshold (lineage, compiled admitter per certified target, two sources, procedure) published with the Trust State's code only after each source custodian's first-hand verification; a compiled gov-admit admitting under a 24-hour state age and the stores' floors; protected admission store and account store; all admission records expire; OP-7 (a) anchored-only use with 90-day and 7-day anchors, 24-hour currency and a clock high-water; always-gate local trust gates; a computed security minimum; C0-R for a revoked binary; certified targets only when CC-1..CC-9 hold; every excluded mode absent or refused"}
  - {id: D, description: "Keyless signing bound to an identity provider plus a transparency log as the root - provider-bound, online checks. Not a supported production alternative for the certified Governance OS profile (OWNER-DESIGN-REQUIREMENTS-0001)."}
