summary: >
  PROPOSED (revision 4) — PENDING FRESH INDEPENDENT REVIEWS AND OWNER APPROVAL. Not active, not approved, not in effect.
  Root-of-trust architecture RoT-1 revision 4 for candidate 4.1.6, amending revision 3 (ca77a43) after the independent
  review 79a09a1 returned ROOT_OF_TRUST_ARCHITECTURE_REJECTED (RV3-H1..RV3-H3). If and only if the owner approves it
  through a presented and answered Human Decision Gate, it supersedes D-0007 in full, restating D-0007 rules (1)-(4)
  amended. Until then D-0007 remains ACTIVE and unchanged. Full design, inventory, evidence, acceptance plan, class
  remainder analysis and response matrix: release/root-of-trust/4.1.6/.
question: >
  Six consecutive rejections (4.1.3, 4.1.4, 4.1.5, RoT-1 revisions 1, 2 and 3) share one class: a lower-trust input
  yielding a current, higher-trust fact. Revision 3's remaining instances were a kernel's precedence rules (or their
  absence) deciding the project's effective controls, an anchor satisfied by a sequence number the supplier chooses and
  treated as current indefinitely, and a threshold-1 final release naming the source of the trusted computing base.
  Which root of trust should govern every Governance OS kernel, release and binary ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2"}
  - {id: B, description: "Binary-embedded digest registry only - non-circular but cannot extend trust after the binary ships"}
  - {id: C, description: "RoT-1 revision 4: purpose-separated DSSE statements under a compiled trust root; one authentication boundary; a root-signed Trust Policy carrying a total Constitutional Surface Inventory with default deny, required presence, a single YAML profile, exact precedence registration, a two-directional strength order and an Overlay Surface with a migration whitelist; eligibility with the surface check, joins and a directed project join; project-owned strength evaluated over effective policy; monotonic trust state whose minimums come only from the trust-state lineage; anchors satisfied only by inclusion, pins with mandatory validity and an integrity predicate, and a currency proof for every trust ingress and binary acceptance; binary acceptance by release-artifact (threshold >= 2), independent build attestation, a source equal to the source an independent verification attested, a trust-state reference and a resolving Trust Base Manifest at or above the accepted-TBM high-water; trust decisions authorised only by local confirmations or protected expiring decision pins; repository-supplied commands confined; verify-and-use per unit of work; legacy-path-occupation layout"}
  - {id: D, description: "Keyless signing bound to an identity provider plus a transparency log as the root - provider-bound, online checks"}
  - {id: E, description: "Signed Git tags/commits as the root - authenticates commits, not delivered payload bytes"}
  - {id: F, description: "Full TUF deployment with online timestamp/snapshot roles - incompatible with offline verification; rotation, thresholds, role separation and snapshot-style state adopted inside C, with local anchors, currency proofs and an owner-optional freshness-witness purpose"}
# No option is chosen until the owner answers the approval gate; chosen_option is deliberately absent.
recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending fresh independent reviews and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, cache, environment or transport, and can be extended after ship. Every mechanism must be total over
  its class. Revision 4 adds that no lower-trust party may still make the choice a check is evaluated over: the kernel
  does not choose effective precedence, the supplier does not choose which statement satisfies an anchor, an aged anchor
  does not stand for currency, the threshold-1 final release does not choose a binary's source, and the governed account
  does not write the pins it is judged by (release/root-of-trust/4.1.6/28-CLASS-REMAINDER-ANALYSIS.md).

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary and named by its Trust Base Manifest: trust-root chain, purpose table (twelve
         purposes) and pairwise whitelist, statement schemas, floor vocabulary v3, the two-directional precedence order
         and YAML profile, newest Trust Policy (Constitutional Surface, historical releases, bootstrap rules), Trust State,
         embedded kernel snapshot and its statement, trust-format and layout readers, the binary's source; genuine only
         for a binary accepted by verify-artifact or built from attested source;
    T1   authenticated material verified under the T0-rooted chain for its purpose;
    T1-E eligible authenticated release (E1-E10 including the E7 surface check); only T1-E may be the policy root;
    LA   local machine authority: anchors, trust-gate confirmations and per-project records in this account's verifier
         trust store, and operator pins in the system pin directory or, under the integrity predicate, the account
         configuration; valid only on this machine; never transferable through a repository;
    T2   OS-written project state; Git-tracked T2 records are requests for every trust decision;
    T3   derived state bound to content identity and effective-policy digest;
    T4   repository- or user-writable artefacts not currently verified, including the project overlay, journals,
         snapshots and adapter bodies;
    T5   caller-controlled input, environment variables, source paths and contents, descriptive manifests;
    T6   plugin- and model-controlled data.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, with
  every leaf of the Constitutional Surface joined with the effective Trust Policy; when that cannot be established the
  embedded baseline is substituted explicitly and mutating operations fail closed. (2) registered, approved, verified,
  eligible, certified, current, anchored, human_approved, authority, provenance are facts of T0/T1/T2 or local machine
  authority only; a lower-class field carrying such a name is a request. (3) A project layer may specialise or
  strengthen, never weaken; admitted project strengthening is removed only by a computed reduction accepted per project,
  and no refusal of a weakening discards an admitted strengthening. (4) Every refusal is typed and auditable.

  Proposed rules (5)-(21) (O1-O8 were the owner-required rules of revision 2):
  (5) [O1] Authenticity cannot be derived from mutually consistent candidate files.
  (6) [O2] Authenticity does not imply eligibility, and floors are total and sound: every file and leaf of the
      Constitutional Surface has exactly one floor semantics from a closed compiled vocabulary; unclassified content is
      denied; registered content that is absent is refused or resolves to a registered value or a typed refusal; floors
      are joins; POLICY_PRECEDENCE must equal its registration exactly and the project layer's precedence comes only from
      registrations, applied as a directed join; the strength order comparing registrations is sound in both directions;
      exceptions never relax floor-, pinned-, members- or precedence-class keys or compiled prefixes; values and admitted
      project strengthening move down only through a computed, cumulatively declared reduction accepted per project by a
      trust gate.
  (7) [O3] Trust state is monotonic, anchors are satisfied by inclusion, and currency needs a proof: negative facts are
      sticky and are lifted only with certification, a trust-state reference and an attestation naming the negative;
      absence is never positive; trust-state minimums come only from the trust-state lineage and references elsewhere are
      release-local; equivocations and forks are refused and statements outside an anchored chain are never effective;
      pins carry mandatory validity; trust ingress and binary acceptance need a currency proof; no surface says current;
      time is used only for pin validity, the C3 window and owner-selected options, and only witnesses raise the clock
      high-water.
  (8) [O4] The bytes verified are the bytes installed and enforced, in every unit of work of every process.
  (9) [O5] Key purposes and statement types are domain-separated under a compiled pairwise whitelist, and binary
      authenticity is its own purpose: a production binary is accepted only with release-artifact at threshold >= 2, an
      independent build attestation, a trust-state reference, a Trust Base Manifest resolving at or above the machine's
      accepted-TBM high-water, and a source equal to the source an ACCEPTED independent verification attested for its
      candidate; a final names the same source as its candidate; currency is never signed by the trust-state purpose.
  (10) [O6] Protected trust paths (governance/trust, the occupation entries, the transaction area) are written only by the
      install transaction.
  (11) [O7] Incoming releases never define the authority required to install themselves, nor the actor levels used to
      check it.
  (12) [O8] Pre-RoT binaries fail before any write on RoT-1 projects while the occupation layout is intact; the layout
      occupies every authority path and every no-install write or restore root of pre-RoT binaries with entries of the
      wrong type; no binary interprets a format or layout it does not implement; once occupation entries are removed or
      pre-migration paths are restored by Git, RoT-1 binaries fail closed and report lost project strength where it was
      recorded.
  (13) Statement facts only; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure.
  (15) Flags, environment and repository files cannot add trust (no anchors, confirmations, keys, policies, state,
      certification or eligibility).
  (16) No self-validation.
  (17) Release authenticity, candidate identity, verification result, certification state, binary acceptance, binary
      source, currency and eligibility are distinct facts with distinct authorities.
  (18) Authorisation for trust decisions is never a repository record or a file the governed account can write: trust
      gates are answered only by local confirmations bound to the decision's digests (and, for C3 kinds, a typed state
      fingerprint) or by protected, expiring decision pins; repository gate records are requests.
  (19) No trust ingress without an anchor and a currency proof; governed use without an anchor only as OP-7 allows.
  (20) Project-owned strength is recorded as requirements over the effective policy and overlay by every install
      transaction and gated overlay change; a weakening made outside a gated transaction, by any change, is reported and
      security-relevant mutation is refused until a trust gate accepts it; no remedy clears it; migrations write only
      root-registered Overlay Surface targets.
  (21) Repository- and plugin-supplied commands that gov runs are write-confined away from pins, the verifier trust store
      and trust paths, and run only after the unit of work's trust decisions.
consequences_if_approved:
  - "Every constitutional file and leaf of the kernel is classified by the root-signed Constitutional Surface Inventory; unknown content is denied and registered content must be present; kernel POLICY_PRECEDENCE must equal its registration; gov release build and canonical CI run the coverage checker (release/root-of-trust/4.1.6/constitutional-surface/)."
  - "Effective policy is the eligible installed kernel or embedded snapshot with every floor leaf joined with the effective Trust Policy, pinned content only when registered, registered precedence (joined with the project's held registration until a reduction is accepted), and the project layer applied as a directed join; project-owned strength is checked over effective policy."
  - "Anchors are satisfied only by inclusion; pins expire and are honoured only when the governed account cannot write them; trust ingress and binary acceptance require a currency proof (anchoring event within a window, in-gate typed state fingerprint, or witnesses at threshold); no surface says current; OP-7 decides unanchored governed use."
  - "Production binaries are accepted only by gov trust verify-artifact: release-artifact threshold >= 2, independent build attestation, attested source equal across candidate, final, build attestation and Trust Base Manifest, trust-state reference, Trust Base Manifest resolution at or above the accepted-TBM high-water, and a currency proof; custodians run the same checks before signing."
  - "Trust gates are local confirmations recorded in the verifier trust store, or protected expiring decision pins; gov decide refuses them; repository gate records are requests; repository-supplied commands run confined."
  - "RoT-1 projects use the legacy-path-occupation layout with the ignore rule /.governance-runtime/* and !/.governance-runtime/migration; pre-RoT binaries 4.1.2-4.1.5 write nothing while the layout is intact; after removal or a Git restore RoT-1 fails closed (LR-2)."
  - "Every unit of work re-checks its snapshot generation; agents obtain kernel content from gov; the transaction area is outside Git and registered locally; trust records are unions; the 4.1.6 migration chain is re-issued without lock operations."
  - "Private signing keys never exist in any repository, payload, CI log or consumer; release build refuses private key material."
  - "Only after approval: this record becomes ACTIVE (state_class AUTHORITATIVE, chosen_option recorded, human_approved true, supersedes [D-0007]); D-0007 becomes SUPERSEDED; ARCH-0002 becomes ACTIVE; owner answers to OP-1..OP-7 are recorded; the record schema gains a PROPOSED status (or active() excludes in_effect false)."
