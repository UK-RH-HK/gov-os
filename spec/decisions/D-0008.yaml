question: >
  Seven consecutive rejections (4.1.3, 4.1.4, 4.1.5, RoT-1 revisions 1-4) share one class: a lower-trust input yielding a
  current, higher-trust fact. Revision 4's remaining instances were one threshold-1 attestation key plus release-pipeline
  input deciding which binary is the TCB, a first binary accepted outside the anchor, negative-set and currency rules by
  procedures the binary itself could satisfy, and a threshold-1 final choosing among registered non-orderable
  constitutional digests. Which root of trust should govern every Governance OS kernel, release and binary ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2"}
  - {id: B, description: "Binary-embedded digest registry only - non-circular but cannot extend trust after the binary ships"}
  - {id: C, description: "RoT-1 revision 5: rule FD-1 (every input of a trust decision is a selector, restrictor or carrier in a compiled decision register; selectors have the authority and currency the decision confers; signatures count only for facts their signers established; the artefact judged never evaluates itself; minimum capability sets are computed); a release registered once, append-only, by the root threshold or a root-granted quorum of at least two keys, fixing source identity (commit and canonical content digest), input manifest, final, targets, verification records and every non-join constitutional unit; production binaries established by at least two first-person reproductions confirmed first-hand and free of conflict; release-artifact and build-attestation withdrawn; one admission predicate evaluated by the independent executor gov-admit on first admission (typed state fingerprint, measured bytes, install from buffer, fresh verifier trust store) or by an admitted gov with a currency proof naming the selected state; genuine binaries refuse above C0 without an admission record; a total Constitutional Surface with default deny, exact precedence registration, release-scoped presence and a directed project join; monotonic trust state with inclusion anchors; local trust gates and allow-list confinement; verify-and-use; legacy-path occupation with closed trust entry sets and RoT-1 root discovery"}
  - {id: D, description: "Keyless signing bound to an identity provider plus a transparency log as the root - provider-bound, online checks"}
  - {id: E, description: "Signed Git tags/commits as the root - authenticates commits, not delivered payload bytes"}
  - {id: F, description: "Full TUF deployment with online timestamp/snapshot roles - incompatible with offline verification; rotation, thresholds, role separation and snapshot-style state adopted inside C, with local anchors, currency proofs and an owner-optional freshness-witness purpose"}
# No option is chosen until the owner answers the approval gate; chosen_option is deliberately absent. Revision 5 states no
# proposal and no default for any owner parameter (release/root-of-trust/4.1.6/21-OWNER-OPTIONS.md).
recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending fresh independent reviews and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, pipeline, cache, environment or transport, and can be extended after ship. Revision 5 makes that a
  rule about facts, not artefacts: every input that can select an effective fact has at least the authority and currency
  the fact confers, and no signature counts for a fact its signer did not establish
  (release/root-of-trust/4.1.6/29-FACT-DERIVATION-AND-SELECTION-AUTHORITY.md).

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary and named by its Trust Base Manifest v3: trust-root chain, purpose table
         (twelve purposes of revision 5) and pairwise whitelist, Fact Threshold Check, decision register, statement
         schemas, floor vocabulary v3, precedence order and YAML profile, newest Trust Policy, Trust State, embedded kernel
         snapshot and its final, the binary's registered source identity and input manifest; genuine only for a binary
         admitted on the machine by an evaluator other than itself (admission-predicate/1);
    T1   authenticated material verified under the T0-rooted chain for its purpose;
    T1-R registered release: a release whose registration is referenced by the effective Trust State;
    T1-E eligible registered release (E1-E10, E7 against its own registration); only T1-E may be the policy root;
    LA   local machine authority: admission records, anchors, trust-gate confirmations and per-project records in this
         account's verifier trust store, and operator pins in the system pin directory or, under the integrity predicate,
         the account configuration; valid only on this machine; never transferable through a repository;
    T2   OS-written project state; Git-tracked T2 records are requests for every trust decision;
    T3   derived state bound to content identity and effective-policy digest;
    T4   repository- or user-writable artefacts not currently verified, including the project overlay, journals,
         snapshots and adapter bodies;
    T5   caller-controlled input, environment variables, source paths and contents, descriptive manifests;
    T6   plugin- and model-controlled data.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, with
  every floor leaf of the Constitutional Surface joined with the effective Trust Policy; when that cannot be established
  the embedded baseline is substituted explicitly and mutating operations fail closed. (2) registered, approved, verified,
  eligible, certified, current, anchored, admitted, human_approved, authority, provenance are facts of T0/T1/T2 or local
  machine authority only; a lower-class field carrying such a name is a request. (3) A project layer may specialise or
  strengthen, never weaken; admitted project strengthening is removed only by a computed reduction accepted per project,
  and no refusal of a weakening discards an admitted strengthening. (4) Every refusal is typed and auditable.

  Proposed rules (5)-(24) (O1-O8 were the owner-required rules of revision 2):
  (5) [O1] Authenticity cannot be derived from mutually consistent candidate files.
  (6) [O2] Authenticity does not imply eligibility, and floors are total and sound: every file and leaf of the
      Constitutional Surface has exactly one floor semantics from a closed compiled vocabulary; unclassified content is
      denied; registered content that is absent is refused or resolves to a registered value or a typed refusal; floors
      are joins; POLICY_PRECEDENCE must equal its registration exactly and the project layer's precedence comes only from
      registrations, applied as a directed join; the strength order comparing registrations is sound in both directions;
      non-join constitutional units (pinned leaves and members, member-id sets, pinned and migration files, owner binding
      groups) are fixed per registered release: exactly one value per unit per release, append-only; eligibility and
      effective values use only the registration of the release judged; presence is release-scoped; a later registration
      that restores a superseded value, removes a unit or narrows a member set is a computed reduction; exceptions never
      relax floor-, pinned-, members- or precedence-class keys or compiled prefixes; values and admitted project
      strengthening move down only through a computed, cumulatively declared reduction accepted per project by a trust
      gate.
  (7) [O3] Trust state is monotonic, anchors are satisfied by inclusion, and currency needs a proof that names the
      selected Trust State (a pin or confirmation naming it within the window, a typed fingerprint, or witnesses at
      threshold): negative facts are sticky and are lifted only with certification, a trust-state reference and an
      attestation naming the negative; absence is never positive; trust-state minimums come only from the trust-state
      lineage; equivocations and forks are refused and statements outside an anchored chain are never effective; pins
      carry mandatory validity; no surface says current; on a machine with a verifier trust store every ingested
      non-future statement raises the clock high-water.
  (8) [O4] The bytes verified are the bytes installed and enforced, in every unit of work of every process; a binary is
      installed from the buffer its evaluator measured.
  (9) [O5] Key purposes and statement types are domain-separated under a compiled pairwise whitelist and the Fact
      Threshold Check. A production binary is accepted only by admission-predicate/1: a release registration at root
      threshold or a root-granted quorum of at least two keys, referenced by the selected Trust State, fixing source
      identity, input manifest, final, targets and verification records; at least two first-person reproductions by
      distinct reproducer keys that hold no other purpose, confirmed first-hand and free of conflict; publication in the
      selected Trust State; the negative set; a Trust Base Manifest resolving at or above the accepted-TBM high-water; and
      a currency proof naming the selected state. No purpose signs a fact its signer did not establish; release-artifact
      and build-attestation are withdrawn; currency is never signed by the trust-state purpose.
  (10) [O6] Protected trust paths (governance/trust, the occupation entries, the transaction area) are written only by the
      install transaction; RoT-1 commands refuse a working directory inside them; the installation state is COMPLETE only
      when their closed entry sets hold.
  (11) [O7] Incoming releases never define the authority required to install themselves, nor the actor levels used to
      check it.
  (12) [O8] Pre-RoT binaries fail before any write on RoT-1 projects for invocations rooted at the project while the
      occupation layout is intact; for invocations rooted in a subdirectory, every write under governance/ other than
      overlay content, and every nested legacy install, leaves a state RoT-1 binaries treat as PARTIAL or report; no
      binary interprets a format or layout it does not implement; once occupation entries are removed or pre-migration
      paths are restored by Git, RoT-1 binaries fail closed and report lost project strength where it was recorded.
  (13) Statement facts only; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure.
  (15) Flags, environment and repository files cannot add trust (no admissions, anchors, confirmations, keys, policies,
      registrations, state, certification or eligibility).
  (16) No self-validation: no binary evaluates its own acceptance, first acceptance, CI image acceptance and legacy
      migration included; no trust ceremony runs on a binary that an evaluator other than itself has not admitted on the
      machine.
  (17) Release authenticity, source selection, build-input selection, byte observation, verification result,
      certification state, publication, currency and eligibility are distinct facts with distinct selectors;
      release-final selects none of them.
  (18) Authorisation for trust decisions is never a repository record or a file the governed account can write: trust
      gates are answered only by local confirmations bound to the decision's digests (and, for C3 kinds, a typed state
      fingerprint) or by protected decision pins within their maximum validity; repository gate records are requests.
  (19) No trust ingress without an anchor and a currency proof naming the selected state; first admission of a binary
      uses a state fingerprint typed now from the independent channels as its only selector of state; governed use
      without an anchor only as OP-7 allows.
  (20) Project-owned strength is recorded as requirements over the effective policy and overlay by every install
      transaction and gated overlay change; on a machine without a record the requirements are computed from the
      pre-transaction inputs; a weakening made outside a gated transaction, by any change, is reported and
      security-relevant mutation is refused until a trust gate accepts it; no remedy clears it; migrations write only
      root-registered Overlay Surface targets and their content is fixed by the release registration.
  (21) Repository- and plugin-supplied commands that gov runs are write-confined by an allow list away from pins, the
      verifier trust store, trust paths, PATH directories, the running executable and shell start-up files, and run only
      after the unit of work's trust decisions; code the account later runs unconfined is A3.
  (22) Fact derivation and selection authority (FD-1): every input of a trust decision is a selector, restrictor or
      carrier in a compiled decision register; every selector has authority and currency at least those the decision
      confers; a signature counts only for a fact its signer established first-hand; the artefact judged is never a
      selector or its own evaluator; a shortfall fails closed or is a stated, labelled, tested residual; minimum capability
      sets are computed by the derivation calculator, never argued.
  (23) Independent admission: a RoT-1 binary without an admission record naming its own digest runs C0 only; C3 and
      ceremonies need a protected executable and record; the first admission starts a fresh verifier trust store; a
      genuine binary holding its own revocation restricts itself as OP-15 decides.
  (24) A release is registered once; a registration that changes a registered release, gives one sequence two releases,
      or registers several values for one unit is malformed and refused.
consequences_if_approved:
  - "Every release that ships a kernel, binaries or the admitter is registered once (source identity with canonical content digest, input manifest, final, targets, verification records, constitutional unit map and kernel tree digest) by the root threshold or a root-granted quorum; the ceremony checks first-hand verification records and upstream toolchain checksums (release/root-of-trust/4.1.6/30-RELEASE-REGISTRATION-AND-REPRODUCTION.md)."
  - "Production binaries are reproduced by at least two independent reproducers from the registered source with inputs by digest, bit-for-bit under a normative build profile; the production build has no VCS-state provenance fallback; the trust-state publisher references exactly one quorum digest per release and target."
  - "Every machine admits its first gov with gov-admit and a typed state fingerprint, never executing the candidate and installing the measured bytes; CI images do the same at image build with expiring records; legacy consumers never verify a RoT-1 binary with itself; genuine binaries refuse above C0 without an admission record (release/root-of-trust/4.1.6/31-INDEPENDENT-ADMISSION.md)."
  - "Eligibility (E7) and effective non-orderable values use only the registration of the release judged; the coverage checker implements release-scoped registration, single-valued and append-only lints and registration reductions (release/root-of-trust/4.1.6/constitutional-surface/)."
  - "Anchors are satisfied only by inclusion; a currency proof names the Trust State it covers; pins and decision pins expire within maxima; a stateful clock high-water is raised by every ingested non-future statement; no surface says current."
  - "Trust gates are local confirmations or protected decision pins within their maximum validity; repository gate records are requests; repository-supplied commands run under allow-list confinement; C3 needs a binary installed where the governed account cannot write."
  - "RoT-1 projects use the legacy-path-occupation layout with closed trust entry sets and RoT-1 root discovery; pre-RoT binaries write nothing for root-anchored invocations, and subdirectory-rooted writes leave PARTIAL or reported states."
  - "Private signing keys never exist in any repository, payload, CI log or consumer; release build refuses private key material."
  - "Only after approval: this record becomes ACTIVE (state_class AUTHORITATIVE, chosen_option recorded, human_approved true, supersedes [D-0007]); D-0007 becomes SUPERSEDED; ARCH-0002 becomes ACTIVE; owner answers to OP-1..OP-15 are recorded; the record schema gains a PROPOSED status (or active() excludes in_effect false)."
