summary: >
  PROPOSED (revision 3) — PENDING FRESH INDEPENDENT REVIEWS AND OWNER APPROVAL. Not active, not approved, not in effect.
  Root-of-trust architecture RoT-1 revision 3 for candidate 4.1.6, amending revision 2 after the independent review
  e5a6b8a returned ROOT_OF_TRUST_ARCHITECTURE_REJECTED (R2-H1..R2-H4). If and only if the owner approves it through a
  presented and answered Human Decision Gate, it supersedes D-0007 in full, restating D-0007 rules (1)-(4) amended.
  Until then D-0007 remains ACTIVE and unchanged. Full design, inventory, evidence, acceptance plan and response matrix:
  release/root-of-trust/4.1.6/.
question: >
  Five consecutive rejections (4.1.3, 4.1.4, 4.1.5, RoT-1 revisions 1 and 2) share one class: a lower-trust input yielding
  a current, higher-trust fact. Revision 2's remaining instances were registered floor keys taken as the whole
  constitution, repository or compiled knowledge taken as current state, a threshold-1 release key taken as binary
  authority, and a sentinel read after acting taken as a boundary against pre-RoT binaries. Which root of trust should
  govern every Governance OS kernel, release and binary ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2"}
  - {id: B, description: "Binary-embedded digest registry only - non-circular but cannot extend trust after the binary ships"}
  - {id: C, description: "RoT-1 revision 3: purpose-separated DSSE statements under a compiled trust root; one authentication boundary; a root-signed Trust Policy carrying a total Constitutional Surface Inventory with default deny, closed floor vocabulary and a per-key precedence lattice; eligibility with surface check and joins; monotonic trust state whose minimums come only from the trust-state lineage; freshness claimed only from local anchors (pin, human confirmation, or owner-selected witness) with no trust ingress unanchored; binary acceptance by release-artifact (threshold >= 2), independent build attestation, trust-state reference and a resolving Trust Base Manifest; trust decisions authorised only by local confirmations; verify-and-use per unit of work; legacy-path-occupation layout so pre-RoT binaries write nothing"}
  - {id: D, description: "Keyless signing bound to an identity provider plus a transparency log as the root - provider-bound, online checks"}
  - {id: E, description: "Signed Git tags/commits as the root - authenticates commits, not delivered payload bytes"}
  - {id: F, description: "Full TUF deployment with online timestamp/snapshot roles - incompatible with offline verification; rotation, thresholds, role separation and snapshot-style state adopted inside C"}
# No option is chosen until the owner answers the approval gate; chosen_option is deliberately absent.
recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending fresh independent reviews and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, cache, environment or transport, and can be extended after ship. Revision 3 adds that every
  mechanism must be total over its class: every constitutional leaf (not a registered subset), every machine (safety
  everywhere, currency only where anchored), every binary (authentication matching the authority it carries) and every
  pre-RoT command (occupied paths rather than markers read afterwards).

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary and named by its Trust Base Manifest: trust-root chain, purpose table and
         pairwise whitelist, statement schemas, floor vocabulary v2 and precedence lattice, newest Trust Policy
         (Constitutional Surface, historical releases, bootstrap rules), Trust State, embedded kernel snapshot and its
         statement, trust-format and layout readers; genuine only for a binary accepted by verify-artifact or built from
         verified source;
    T1   authenticated material verified under the T0-rooted chain for its purpose;
    T1-E eligible authenticated release (E1-E10 including the E7 surface check); only T1-E may be the policy root;
    LA   local machine authority: anchors, trust-gate confirmations and per-project records in this account's verifier
         trust store, and operator pins in its account configuration; valid only on this machine; never transferable
         through a repository;
    T2   OS-written project state; Git-tracked T2 records are requests for every trust decision;
    T3   derived state bound to content identity and effective-policy digest;
    T4   repository- or user-writable artefacts not currently verified, including the project overlay, journals,
         snapshots and adapter bodies;
    T5   caller-controlled input, environment variables, source paths and contents, descriptive manifests;
    T6   plugin- and model-controlled data.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, with
  every leaf of the Constitutional Surface joined with the effective Trust Policy; when that cannot be established the
  embedded baseline is substituted explicitly and mutating operations fail closed. (2) registered, approved, verified,
  eligible, certified, current, anchored, human_approved, authority, provenance are facts of T0/T1/T2 or local machine
  authority only; a lower-class field carrying such a name is a request. (3) A project layer may specialise or
  strengthen, never weaken. (4) Every refusal is typed and auditable.

  Proposed rules (5)-(20) (O1-O8 were the owner-required rules of revision 2):
  (5) [O1] Authenticity cannot be derived from mutually consistent candidate files.
  (6) [O2] Authenticity does not imply eligibility, and floors are total: every file and leaf of the Constitutional
      Surface has exactly one floor semantics from a closed compiled vocabulary; unclassified constitutional content is
      denied; floors are joins; POLICY_PRECEDENCE is floored per concrete key; exceptions never relax floor-class or
      compiled-prefix keys; values move down only through a computed, cumulatively declared lowering accepted per project
      by a trust gate.
  (7) [O3] Trust state is monotonic and freshness comes only from anchors: negative facts are sticky and are lifted only
      with certification, attestation and trust-state reference; absence is never positive; trust-state minimums come
      only from the trust-state lineage and references elsewhere are release-local; equivocations and forks are refused
      or orphaned under an anchor; time is used only for owner-selected freshness proofs.
  (8) [O4] The bytes verified are the bytes installed and enforced, in every unit of work of every process.
  (9) [O5] Key purposes and statement types are domain-separated under a compiled pairwise whitelist, and binary
      authenticity is its own purpose: a production binary is accepted only with release-artifact at threshold >= 2, an
      independent build attestation, a trust-state reference and a Trust Base Manifest whose components resolve to root-
      and trust-state-signed statements at or above the machine's high-water.
  (10) [O6] Protected trust paths (governance/trust, the occupation entries, the transaction area) are written only by the
      install transaction.
  (11) [O7] Incoming releases never define the authority required to install themselves, nor the actor levels used to
      check it.
  (12) [O8] Pre-RoT binaries fail before any write on RoT-1 projects: the layout occupies every authority path and every
      no-install write or restore root of pre-RoT binaries with entries of the wrong type; no binary interprets a format
      or layout it does not implement.
  (13) Statement facts only; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure.
  (15) Flags, environment and repository files cannot add trust (no anchors, confirmations, keys, policies, state,
      certification or eligibility).
  (16) No self-validation.
  (17) Release authenticity, candidate identity, verification result, certification state, binary acceptance, currency
      and eligibility are distinct facts with distinct authorities.
  (18) Authorisation for trust decisions is never a repository record: trust gates are answered only by local
      confirmations bound to the decision's digests; repository gate records are requests.
  (19) No trust ingress without an anchor; governed use without an anchor only as OP-7 allows; unanchored trust state is
      never presented as current.
  (20) Project-owned strengthening is recorded by every install transaction and gated overlay change; a weakening made
      outside a gated transaction is reported and security-relevant mutation is refused until a trust gate accepts it.
consequences_if_approved:
  - "Every constitutional file and leaf of the kernel is classified by the root-signed Constitutional Surface Inventory; unknown constitutional content is denied; gov release build and canonical CI run the coverage checker (release/root-of-trust/4.1.6/constitutional-surface/)."
  - "Effective policy is the eligible installed kernel or embedded snapshot with every floor leaf joined with the effective Trust Policy, pinned content only when registered, and precedence joined per key; exceptions apply after the join."
  - "Trust state is shown as current only when anchored by a state pin, a human confirmation of the published state fingerprint, or an owner-selected witness; trust ingress is refused unanchored; OP-7 decides unanchored governed use."
  - "Production binaries are accepted only by gov trust verify-artifact: release-artifact threshold >= 2, independent build attestation, trust-state reference, Trust Base Manifest resolution and high-water; historical releases are part of the root-signed Trust Policy."
  - "Trust gates are local confirmations recorded in the verifier trust store; gov decide refuses them; repository gate records are requests."
  - "RoT-1 projects use the legacy-path-occupation layout (governance/trust, governance/overlay, governance/views; governance/kernel, project and generated as files; governance/framework.lock as a directory; spec/audits/GOVERNANCE-ADOPTION and .governance-runtime/migration occupied); pre-RoT binaries 4.1.2-4.1.5 write nothing."
  - "Every unit of work re-checks its snapshot generation; agents obtain kernel content from gov; the transaction area is outside Git and registered locally; trust records are unions."
  - "Private signing keys never exist in any repository, payload, CI log or consumer; release build refuses private key material."
  - "Only after approval: this record becomes ACTIVE (state_class AUTHORITATIVE, chosen_option recorded, human_approved true, supersedes [D-0007]); D-0007 becomes SUPERSEDED; ARCH-0002 becomes ACTIVE; owner answers to OP-1..OP-7 are recorded; the record schema gains a PROPOSED status (or active() excludes in_effect false)."
