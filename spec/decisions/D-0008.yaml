question: >
  Nine consecutive rejections (4.1.3, 4.1.4, 4.1.5, RoT-1 revisions 1-6) share one class: a lower-trust input yielding a
  current, higher-trust fact. Revision 6's remaining instances were first-contact values composed by the trust-state publisher,
  designated by carriers or unadmitted binaries and submitted by a package submitter; stored first-contact values of unbounded
  age and re-admission ignoring the store; an environment manifest no party established; and a register complete over rule ids
  instead of inputs. The owner has selected every design parameter. Which concrete root of trust, with those selections and no
  option tree, should govern every Governance OS kernel, release and binary ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2. Not a supported production alternative for the certified Governance OS profile (OWNER-DESIGN-REQUIREMENTS-0001)."}
