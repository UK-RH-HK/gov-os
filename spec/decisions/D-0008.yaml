question: >
  Four consecutive candidates (4.1.3-4.1.5) were rejected for trust facts derived from artefacts controlled by the party
  seeking the trust. Revision 1 of this proposal closed authenticity at ingress, but the independent review of revision 1
  (release/root-of-trust/4.1.6-review/) showed four remaining gaps of the same class: authentic historical kernels became
  the current policy root with weaker floors (executed); signed certification, revocation and rotation facts could be
  omitted or replayed stale; the bytes verified were not the bytes enforced (executed); and a non-release key could confer
  kernel authenticity. Which root of trust should govern every Governance OS release/kernel ingress and use?
options:
  - {id: A, description: "Bounded repair: verify the source against its shipped manifest and declared release_hash - circular, fails E1/E2"}
  - {id: B, description: "Binary-embedded digest registry only - non-circular but cannot extend trust (new releases, certification, revocation, floors) after the binary ships"}
  - {id: C, description: "RoT-1 revision 2: purpose-separated DSSE statements (Ed25519 over RFC 8785 canonical payloads) under trust-root metadata compiled into the gov binary; one authentication boundary producing an in-memory AuthenticatedRelease; eligibility and non-downgradable security floors from a root-signed Trust Policy lineage; monotonic trust state published by a separate purpose; verify-and-use install transaction and in-memory kernel snapshot; protected trust paths written only by the transaction; trust-format boundary for pre-RoT binaries; framework.lock as a record only"}
  - {id: D, description: "Keyless signing bound to an identity provider plus a transparency log as the root - provider-bound, online checks"}
  - {id: E, description: "Signed Git tags/commits as the root - authenticates commits, not delivered payload bytes"}
  - {id: F, description: "Full TUF deployment with online timestamp/snapshot roles - incompatible with offline verification; rotation, thresholds, role separation and snapshot-style state adopted inside C"}
# No option is chosen until the owner answers the approval gate; chosen_option is deliberately absent.
recommended_option: C
rationale: |
  RECOMMENDATION ONLY — NOT A DECISION. Pending a fresh independent review and the owner's approval gate.

  Trust must originate from anchors that exist before the source is seen, cannot be produced by whoever controls the
  source, repository, cache, environment or transport, and can be extended after ship. Revision 2 adds that a genuine fact
  is not automatically a current fact: authenticity, currency (eligibility), freshness, byte binding and purpose are
  separate properties with separate mechanisms.

  Proposed trust classes (would replace D-0007's table on approval), highest first:
    T0   compiled into the running gov binary: trust-root chain, purpose table and separation constraints, statement
         schemas, floor operators, newest Trust Policy and Trust State with referenced statements, historical-identity
         registry, embedded kernel snapshot and its statement, trust-format readers;
    T1   authenticated material: statements verified under the T0-rooted root chain for their purpose, and content whose
         bytes equal a verified release statement's file map (AuthenticatedRelease at ingress, KernelSnapshot at use);
    T1-E eligible authenticated release: T1 release material satisfying the eligibility predicate; only T1-E may be the
         current policy root;
    T2   authoritative project state written by the OS; framework.lock is a T2 record of T1-E identity; Git-tracked T2
         records are requests, not facts, against a repository writer for currency, freshness or downgrade decisions;
    T3   derived state, bound to the content identity it was built from;
    T4   repository- or user-writable artefacts not currently verified (installed files before snapshot verification,
         lock fields, trust files before verification, verifier trust store files before verification, caches,
         snapshots, journals, transaction directories), project configuration, plugin descriptors;
    T5   caller-controlled input: CLI arguments, environment variables, source paths and contents, bundles before
         authentication, downloaded files, descriptive release manifests, report fields, worker returns;
    T6   plugin- and model-controlled data, including plugin-reported digests.

  Rules retained from D-0007: (1) an enforcement decision reads its floor from the highest eligible class only, joined
  with the Trust Policy floor; when that cannot be established the embedded baseline is substituted explicitly and
  mutating operations fail closed. (2) registered, approved, verified, eligible, certified, human_approved, authority,
  provenance are facts of T0/T1/T2 only; a lower-class field carrying such a name is a request, recorded and ignored.
  (3) A project layer may specialise or strengthen a higher layer, never weaken it. (4) Every refusal is typed and
  auditable.

  Proposed new rules (the eight owner-required rules are marked O1-O8):
  (5) [O1] Authenticity cannot be derived solely from mutually consistent files supplied by the candidate source; class
      membership is established only by a verification chain to T0.
  (6) [O2] Authenticity does not imply current-policy eligibility. Eligibility, security floors and install authority
      are rooted in T0 and the protected root-signed Trust Policy lineage, never in the kernel being judged. Floors are
      strengthen-only joins and move down only through an explicit root-signed lowering accepted per project.
  (7) [O3] Trust state is monotonic and freshness-protected: negative lifecycle facts are sticky; absence is never
      positive; a positive fact relaxes a control only with a freshness proof; trust metadata is accepted only
      monotonically and a signed regression is refused; time is used only for the optional freshness proof of OP-3
      mode B.
  (8) [O4] The bytes verified are the bytes installed and enforced: installation writes verified buffers, enforcement
      reads only the verified in-memory snapshot, and no mutable path is re-read after verification.
  (9) [O5] Key purposes and signed statement types are domain-separated: each statement type maps to one purpose fixed in
      the binary; a key acts only within purposes granted by root under compiled separation constraints; only release
      purposes confer kernel authenticity; historical identities are accepted only from T0.
  (10) [O6] Protected trust paths (governance/kernel, governance/trust, governance/framework.lock, governance/.tx) are
      written only by the install transaction; generic project mutation mechanisms cannot create, modify, move or
      delete them.
  (11) [O7] Incoming releases never define the authority required to install themselves; install-class authority is the
      maximum of the Trust Policy, the embedded kernel and the current eligible kernel.
  (12) [O8] New trust-format state is never interpretable as verified by pre-RoT binaries, and no binary interprets a
      trust format it does not implement.
  (13) Statement facts only: certification, revocation, identity, compatibility and update-impact facts come only from
      signed statements; signer-declared impact can add gates, never remove computed ones.
  (14) No fallback on failure: an authentication or eligibility failure never falls back to a lower acceptance path; the
      development path is explicit, labelled, never eligible, never certified, never a production policy root.
  (15) Flags and environment cannot add trust; they may select a source, opt into a lower labelled state, or narrow trust.
  (16) No self-validation: statement schemas, floor operators and the purpose table come from T0.
  (17) Release authenticity, release-candidate identity, independent verification result, certification state and
      current install eligibility are distinct facts with distinct authorities; eligibility is computed, not signed.
  (18) Git-tracked gate records, ledgers and registries are evidence, but never the basis of a currency, freshness or
      downgrade decision against a repository writer.
consequences_if_approved:
  - "Every ingress in release/root-of-trust/4.1.6/02-INGRESS-MAP.md (I-01..I-47) goes through authenticate -> eligibility -> authorisation -> install transaction; every runtime file mutation goes through GovernedFs, which refuses protected trust paths outside the transaction."
  - "Kernel content is enforced only from a verified in-memory KernelSnapshot (or the embedded snapshot); partial installs fail closed to the embedded baseline; no cache is on any trust path."
  - "Security floors come from a root-signed Trust Policy lineage joined with the eligible kernel; historical 4.1.2-4.1.5 kernels are recognised but never eligible; consumers on them are read-only until they update."
  - "Certification is visible only with a verification attestation, a certification statement and a trust-state reference; under the recommended OP-3 mode A it never removes a Human Decision Gate; negative lifecycle facts are sticky; stale trust state refuses ingress."
  - "Nine signing purposes with compiled separation constraints; historical identities accepted only from the binary."
  - "framework.lock 2.0.0 records the eligible identity and carries sentinels so pre-RoT binaries fail closed; governance/trust/FORMAT marks the trust format."
  - "Reference retrieval profiles use signed profile statements with host-side verification; no model becomes constitutional (D-0006) and embed/rerank still fail closed (D-0005)."
  - "Private signing keys never exist in any repository, payload, CI log or consumer; release build refuses private key material."
  - "Only after approval: this record becomes ACTIVE (state_class AUTHORITATIVE, chosen_option recorded, human_approved true, supersedes [D-0007]); D-0007 becomes SUPERSEDED (superseded_by D-0008); ARCH-0002 becomes ACTIVE; owner answers to OP-1..OP-6 are recorded; the record schema gains a PROPOSED status (or active() excludes in_effect false)."
