id: D-0003
type: decision
title: Every kernel policy key is executable or explicitly informational (policy enforcement coverage)
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
updated: "2026-09-12"
owner_role: orchestrator
supersedes: []
governed_by: [PRJ-0001]
affects: [ARCH-0001, TASK-0010]
question: >
  Independent verification (M12) found about twenty declared policy keys that no executable path ever read
  (budget thresholds, auto-simulation triggers, corroboration_min_sources, agent_resolvable_when, release_triggers,
  implementation-task prerequisites, ...). A policy that is data-only misleads adopters. How is this prevented from
  recurring?
options:
  - {id: A, description: Remove every unread key from the kernel policies}
  - {id: B, description: Enforce every key in code and keep a machine-checked map from policy key to enforcement point; keys that are deliberately informational are declared as such with a reason}
  - {id: C, description: Leave policies as documentation and describe enforcement in prose}
chosen_option: B
rationale: |
  The framework's policies are the contract adopters rely on. Keys that carry behaviour (thresholds, triggers,
  prerequisites, sensitivity classes) are now read at the enforcement point named in
  framework/policies/ENFORCEMENT_MAP.yaml; runtime/src/policy_coverage.rs walks every policy key, checks the map and
  verifies that each declared enforcing function exists in the core. The governance suite family
  policy_enforcement_coverage fails when a key is unmapped or its enforcer is missing, and a builder static test
  (tests/certification/repair.rs::policy_coverage_map_is_complete) fails the build on the same condition.
  Keys that are informational by nature (e.g. narrative descriptions, version strings) are listed in the map with
  kind: informational and a reason, so the classification is explicit and reviewable rather than silent.
consequences:
  - Adding a policy key without an enforcement-map entry breaks the builder test and the governance suite.
  - Removing an enforcing function without updating the map breaks the same checks.
  - The map is kernel data and ships with the release; adopters can audit which policy keys their installed core enforces.
approved_by: orchestrator (implementer session, within delegated authority; product owner may supersede)
