id: D-0005
type: decision
title: Capability plugin failure semantics are fail-closed for embed/rerank and degrading for code_intel; plugins are governed executables
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
updated: "2026-09-12"
owner_role: orchestrator
supersedes: []
governed_by: [PRJ-0001, D-0002]
affects: [API-0001, TASK-0011]
question: >
  API-0001 v1 promised that a failing or missing embed plugin "degrades to the built-in fallback", while the repaired
  implementation (C1, independently confirmed) deliberately fails closed. The authoritative interface record must state
  the intended behaviour, and the independent re-verification (H-N2) showed that plugin descriptors executed as
  arbitrary commands. What is the contract?
options:
  - {id: A, description: Restore the silent built-in fallback for embed plugins to match the v1 text}
  - {id: B, description: Amend API-0001 to the fail-closed embed/rerank semantics, keep degradation only for code_intel, and make plugin governance (schema, registration, pin, authority) part of the protocol contract}
chosen_option: B
rationale: |
  A silent fallback silently changes the semantic space of the index (verifier C1); the pinned implementation is a
  governed choice (framework §14.3) and its absence must surface as an error. Code intelligence is different: a
  degraded symbol extraction for one file is recoverable and is recorded as a degradation in capability memory.
  Executable capabilities are tools (framework §28-32): a descriptor is discovery, not authorisation. API-0001 is
  bumped to 1.1 with its history preserved; capabilities/PROTOCOL.md and the failure-injection fixture README follow.
consequences:
  - API-0001 invariant 2 rewritten (v1.1); history list records the superseded statement.
  - TOOL_POLICY.plugins, plugin-descriptor schema 1.1.0, authority classes execute_plugin/register_plugin, doctor D028 and suite family plugin_governance are the executable form of this decision.
  - Existing hand-declared descriptors keep working for roles at/above L2; lower roles need a registered plugin.
approved_by: orchestrator (implementer session, within delegated authority; product owner may supersede)
