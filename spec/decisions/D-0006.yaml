id: D-0006
type: decision
title: No paraphrase-capable embedding model ships in the kernel; adopters select one per repository through the governed benchmark
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
updated: "2026-09-12"
owner_role: orchestrator
supersedes: []
governed_by: [PRJ-0001, D-0002]
affects: [MEMORY_POLICY, TASK-0011]
question: >
  Independent re-verification (M-B1) accepted that HV-08b (token-overlap-free paraphrase retrieval with the baseline
  embedder) is not a blocker, because the benchmark/selection mechanism was proven end-to-end with an independently
  authored paraphrase-capable plugin. It asked the canonical repository to either ship/reference a credible candidate
  with a recorded benchmark or record why none is shipped and which candidate classes adopters should evaluate.
options:
  - {id: A, description: Ship a small local sentence-embedding model inside the kernel as the default embedder}
  - {id: B, description: Keep the dependency-free deterministic baseline as the kernel default; ship an optional, fail-closed sentence-transformers plugin template behind API-0001; record the candidate classes and the benchmark procedure; require every repository to pin its choice through gov memory benchmark / select}
chosen_option: B
rationale: |
  Framework §14.3 forbids hard-coding a model into the constitutional standard and requires per-repository benchmarks
  with pinned results. The kernel must remain buildable and operable offline with zero model dependencies (D-0002,
  INV: rebuildability, no Python to operate the core). A bundled model would also fix a vendor/licence choice for
  every adopter. The mechanism (benchmark -> research record -> decision with alternatives -> overlay pin -> full
  rebuild, fail-closed pins on every query path) is the deliverable; NV-06 measured paraphrase recall 0.5 -> 1.0 with
  a synonym-aware candidate and the builder benchmark on the brownfield fixture is recorded as RES-0001.
  Candidate classes adopters are expected to evaluate: (1) local sentence-embedding models via the shipped
  capabilities/python/govos_capabilities/embed_sentence_transformers.py template (any model id; fails closed when the
  library or model is absent); (2) a local inference server (llama.cpp / Ollama style) behind a thin stdin/stdout
  adapter; (3) a remote embedding API behind an adapter, only where SECURITY_POLICY/DATA_SENSITIVITY permit outbound
  content (restricted/secret content never reaches plugins). Rerankers follow the same route (capability rerank).
consequences:
  - MEMORY_POLICY keeps hashed-ngram as the kernel default; a repository that needs paraphrase recall must run gov memory benchmark with at least one candidate of class (1)-(3) and pin the winner (gov memory select).
  - Poor semantic quality cannot be reported green: regression.min_queries / thresholds make an unmeasured or failing held-out set UNMEASURED/FAIL.
  - The optional plugin template is not a kernel dependency; its descriptor must be registered like any plugin.
