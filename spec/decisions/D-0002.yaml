question: >
  In which language/runtime is the Governance OS's own deterministic control plane implemented, and how are specialised
  (AI/scientific/retrieval) capabilities integrated without coupling the OS to a governed project's language?
options:
  - {id: A, description: Python core throughout (D-0001)}
  - {id: B, description: Rust-first deterministic core + polyglot capability plugins behind governed language-neutral interfaces}
  - {id: C, description: Rust for everything including embeddings/AI capabilities}
chosen_option: B
rationale: |
  Product-owner decision (authority level L5), recorded verbatim in substance:
  1. Prefer Rust for the deterministic control-plane/core: gov CLI, governance state machine, repository inventory and
     scanning, repository/path-map machinery, migration/adoption engine, authority and policy enforcement, CIT-P/CIT-E
     transaction machinery, task/DAG machinery, checkpoint/recovery, Git integration, release/install/update mechanisms,
     framework.lock handling, hashing/manifests/provenance, tool/permission registry, process/tool execution, SQLite
     structured state access, concurrency/work coordination and security-sensitive boundaries. Desired deployment
     property: a self-contained `gov` executable per supported OS without requiring a Python environment.
  2. Do NOT impose Rust on governed projects. Repository intelligence and tooling are capability/plugin driven and
     resolve native tools per ecosystem (Cargo/rust-analyzer/Clippy for Rust; the equivalents for other languages).
     The Repository Contract and Tool Capability Registry determine required capabilities.
  3. Specialised AI/scientific/retrieval capabilities remain polyglot (Python, local model runtimes, external CLIs, MCP
     servers, APIs) behind stable language-neutral interfaces: MCP, JSON-RPC, HTTP, stdin/stdout structured JSON,
     stable CLI contracts or other governed IPC. The core must not be tightly coupled to a specific Python process or
     AI provider.
  4. The Development Knowledge Fabric architecture is implementation-neutral. The Rust core owns routing, metadata,
     SQLite/structured state, graph relationships, manifests and context compilation; embedding/reranking are
     interchangeable local/remote services behind stable interfaces. Embedding model, inference runtime, index store,
     reranker and generative model remain separate replaceable concerns.
  5. Preference, not ideology: do not rewrite a mature or superior component in Rust merely for uniformity.
     Decision rule: "Rust is preferred for the deterministic Governance OS control plane and portable core.
     Specialised capabilities use the language/runtime that provides the strongest maintainable implementation behind
     a governed interface."
consequences:
  - The deterministic core (runtime/ library crate + cli/ binary crate) is implemented in Rust; the kernel payload (framework/) is unchanged data.
  - The Python core scaffolding written under D-0001 is superseded (preserved in git history, commit d6744ed); only polyglot pieces survive as plugins under capabilities/python/.
  - A Capability Plugin Protocol (API-0001) defines stdin/stdout JSON contracts for embed, rerank, code_intel and ecosystem capabilities; the baseline hashed-ngram embedder is built into the core so the core runs standalone.
  - Ecosystem detection resolves native build/test/lint tooling (Cargo, pytest, npm, go, cmake) through the Tool Capability Registry; absence of a native tool is a capability gap, never a crash.
  - Architectural tests (TASK-0008) guard against coupling the core to a governed project's language and against hard-coded language assumptions in kernel policy.
  - Synthetic fixtures include a Rust governed project (greenfield, multi-machine) and a mixed Python/TypeScript project (brownfield, migration).
  - Message item 7 was truncated at "at least one governed project whose"; interpreted as "whose language is not the OS implementation language". Flagged for confirmation; low risk because fixtures already span Rust, Python and TypeScript.
