id: D-0011
type: decision
title: "A tool installation needs the Human Gate only when it expands authority (product owner, OD-P2-03)"
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-20"
updated: "2026-09-20"
owner_role: orchestrator
approved_by_role: human
supersedes: []
governed_by: [PRJ-0001, D-0002, D-0007, D-0010]
affects: [D-0007]
