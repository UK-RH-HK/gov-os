# The owner's own record of this decision, outside the product tree:
# release/orchestration/phase-2/GATES/OWNER-DECISION-P2-0003-TOOL-INSTALL-GATE.md (decision id OD-P2-03, option
# "gate only elevated installs", answering owner gate HG-P2-0002, raised by P2-AR-0053 as item R4-O1). This record
# carries that decision inside the governed record set, as CHANGE_POLICY.change_classes.tool_installation and
# TOOL_POLICY.installation_envelope carry it in policy.
question: >
  `gov tools install` writes `governance/project/tools/<id>.yaml`. Contract v3 K3 auto-triggers impact simulation for
  material security and governance/policy changes, and the product's kernel-floor materiality classifies that
  descriptor exactly as it classifies a plugin descriptor, so an installation is carried out by a change transaction
  (R4-O1). The shipped CHANGE_POLICY lists `governance_change` in `human_gate_triggers`, so that transaction would
  need a human gate. But IP-W7-1 / BC-P2-41, confirmed by WS-7 in round 3, lets an installation evidenced by a
  governed security review from an independent role proceed **without the owner's gate**, and TOOL_POLICY declares
  `auto_install_conditions` for exactly that case. All three cannot hold. Contract v3 F3 requires a
  "security/licence/maintenance/cost review" and "approval **when required**", leaving *when* to policy, and the
  product owner owns that policy. When does a tool installation require a Human Gate?
options:
  - id: A
    description: >-
      Every installation's change transaction needs the owner's gate, because a tool descriptor is a
      `governance_change` like any other (the narrowing P2-AR-0053 implemented at ab0a075 and returned for decision:
      IP-W7-1's "no gate raised" would mean "no gate for the installation subject", and a review-evidenced
      installation outside any claimed task would lose the autonomy IP-W7-1 gives it)
  - id: B
    description: >-
      **Gate only elevated installs.** An installation proceeds without a Human Gate when the tool is authenticated
      and pinned, independently governed-reviewed, registered, reversible, and operates entirely within the project's
      already-authorised permission and trust envelope. A Human Gate is required when the installation **expands
      authority**: privilege escalation; broader filesystem or project access; new secret or credential access;
      host-level authority; governance or security-policy mutation; or a new or unrestricted network trust boundary.
      Ordinary network use already authorised by project or tool policy (approved registries, allowlisted services)
      does not by itself count as elevated. Every installation is recorded with its security and CIT evidence,
      gated or not, and the recorded transaction states which branch applied and why
chosen_option: B
rationale: |
  The product owner decided this directly (2026-09-20), answering owner gate HG-P2-0002 with decision OD-P2-03,
  option "gate only elevated installs". It is the owner's policy call, not an orchestrator adjudication: Contract v3
  F3 leaves *when* approval is required to policy, and the owner owns that policy. This record carries the decision
  into the governed record set so that an auditor reading the product's decisions, and not only the Phase-2
  orchestration tree, finds it.

  What the decision does NOT relax: the installation is still a material governance and security change and still
  completes only through its own change transaction (Contract v3 K3); the transaction is still simulated, bound,
  snapshotted, verified and rolled back like any other; the installation's own approval rule (BC-P2-41) is
  unchanged, so an installation whose auto-install conditions do not all hold still needs a Human Decision Gate
  raised for exactly that installation subject; and the envelope is computed from trusted OS state, never from the
  descriptor's declarations (Contract v3 F4 "a descriptor cannot authorise itself"; BC-P2-39, whose defect was a
  declaration deciding whether approval was needed). Anything the OS cannot determine is an expansion and gates.
consequences:
  - >-
    `CHANGE_POLICY.change_classes.tool_installation` states the rule as governed data: the non-gated conditions
    (each mapped to the `TOOL_POLICY.auto_install_conditions` entry that decides it), the six authority-expansion
    triggers, the trusted envelope sources, and `fail_closed: true`. `gov policy effective CHANGE_POLICY` shows it.
    A condition `TOOL_POLICY.auto_install_conditions` does not declare was never evaluated and cannot hold, so the
    rule can never be satisfied by shortening that list; both keys are `immutable` under POLICY_PRECEDENCE, so no
    project overlay can weaken either.
  - >-
    `TOOL_POLICY.installation_envelope` supplies the authorised side of the comparison only: the host-authority,
    credential and network permission classes, the command-token floor for privilege and host authority, the
    approved registries and allowlisted services, the credential-name patterns and the policy paths. Its token
    lists are a kernel floor and never a safety proof — the OS cannot confine a spawned process — which is why the
    non-gated branch also requires the independent governed security review.
  - >-
    Executable form: `tools::installation_authority` computes the envelope comparison; `tools::installation_change_decision`
    decides the branch; `cit::simulate_inner` records it in the transaction's bound impact as `change_class`
    (branch, why, per-condition and per-trigger findings) and raises the transaction's gate only when it is
    required; `cit::approve_with` approves a pre-authorised transaction above `auto_approve_max_radius` only on
    that recorded, bound verdict; `tools::apply_installation` re-derives the verdict at CIT-E and refuses
    `TOOL_INSTALL_ELEVATED` if the installation now expands authority and no human gate approved the transaction.
  - >-
    Contract v3 F4 still binds: under this decision elevated permissions are exactly the gated class, so they
    reference an actual gate; a non-elevated installation's recorded change transaction references this record, the
    owner decision, the governed rule and the bound independent security review, so any installed tool traces to
    what allowed it.
  - >-
    Accepted by the owner: a tool that stays inside the project's existing authority can enter the trusted surface
    without the owner seeing it, on the strength of an independent review, pinning, registration and reversibility;
    authority expansion always stops for the owner. A verifier may still find this implementation insufficient
    against a Contract v3 requirement; that is a finding against the implementation, not a re-opening of the
    decision. The owner may override at any time.
