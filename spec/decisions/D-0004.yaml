id: D-0004
type: decision
title: Defer the MCP repository-intelligence server; lesson clustering produces Framework Change Proposals
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
updated: "2026-09-12"
owner_role: orchestrator
supersedes: []
governed_by: [PRJ-0001]
affects: [API-0002, TASK-0010]
question: >
  Independent verification (M14) noted that the MCP repository-intelligence server (MCP-REPO-001) and the lesson
  clustering / Framework Change Proposal (FCP) mechanism were absent without a recorded decision. What is shipped in
  4.1.3 and what is deferred?
options:
  - {id: A, description: Implement an MCP server transport now inside the core}
  - {id: B, description: Defer the MCP transport with an explicit record; ship lesson clustering + FCP records now; expose the same repository-intelligence operations through the gov CLI JSON contract (API-0002)}
chosen_option: B
rationale: |
  The core already exposes every repository-intelligence operation (query, graph, impact, freshness, verify,
  benchmark) through the machine-readable CLI contract, and the capability plugin protocol keeps the door open for an
  MCP transport as a capability rather than a core dependency (D-0002 item 3). The registry entry MCP-REPO-001 stays
  status: planned and doctor/readiness report it as a capability gap, not as a silent absence.
  Lesson clustering is deterministic core logic and ships now: gov lessons cluster groups PROVISIONAL/VALIDATED lessons
  by normalised category + shared tags and writes Framework Change Proposal records (schema
  framework-change-proposal) under spec/planning/change-proposals/, which upstream prepare can carry as FRAMEWORK
  candidates after sanitisation.
consequences:
  - MCP transport is a tracked capability gap (readiness dimension, registry status planned) until a dedicated decision funds it.
  - FCP records are first-class governed records with a schema, lifecycle and evidence links.
approved_by: orchestrator (implementer session, within delegated authority; product owner may supersede)
