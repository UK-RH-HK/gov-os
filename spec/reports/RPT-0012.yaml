discoveries:
- "Both HIGH findings were one mistake in two places (reading an assertion from the artefact whose privileges that assertion controls), so the repair defines trust classes (D-0007) rather than patching two call sites."
- "A fail-closed trust root must leave the human-decision channel open: gate present and gate answer are exempt from KERNEL_TAMPERED because they are how the override decision is recorded; everything a gate could unblock stays refused."
- "An override of an integrity failure must be bound to a fingerprint of the exact failing state, or it becomes a permanent bypass the next time the payload changes."
risks:
- "The acting role remains caller-declared; binding human answers to an authenticated channel is an adapter responsibility (documented boundary, V-L5)."
- "The plugin registry and framework.lock are repository files: their protection is that no forged content can lower the authority floor (read from the verified kernel) plus doctor/audit reporting. There is no cryptographic signature chain in this release."
- "Substituting the embedded baseline for a tampered kernel can mean newer floors than the installed version declared; this is deliberate (floors only strengthen) and every mutating operation is refused while it applies."
