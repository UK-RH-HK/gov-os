id: ARCH-0001
type: architecture
title: Governance OS implementation architecture (Rust core, polyglot capabilities, language-agnostic governance)
status: ACTIVE
state_class: AUTHORITATIVE
created: "2026-09-12"
governed_by: [D-0002]
summary: Layered architecture of the canonical Governance OS after D-0002.
body: |
  ## Layers
  1. Kernel payload (data, immutable per release): framework/{constitution,policies,schemas,skills,adapters,roles,taxonomy,commands,overlay-templates} + migrations/.
  2. Deterministic core (Rust): runtime/ (library crate gov-runtime) and cli/ (binary crate gov).
     Owns: kernel install/verify, framework.lock, overlay + policy enforcement, repository contract/path map, records,
     inventory/classification/migration planner+executor, runtime SQLite/FTS5 store, indexer, graph, retrieval routing
     and fusion, context compiler, tasks/DAG/claims/gates/control, checkpoints, CIT-P/CIT-E, doctor/audit,
     init/adopt/update/release/upstream/recovery, tool/permission/MCP registries, model routing, telemetry,
     capability plugin host, ecosystem detection.
  3. Capability ecosystem (polyglot): capabilities/ - plugins behind API-0001 (stdin/stdout JSON), stable CLI contracts,
     MCP or HTTP. Shipped: Python-AST code intelligence, reference hashed-ngram embedder (Python), bash echo-embedder
     (protocol proof). Built-in fallbacks in the core: hashed-ngram embedder, generic multi-language symbol extractor.
  4. Governed project (any language): described by REPOSITORY_CONTRACT.yaml; native tooling resolved by ecosystem
     detection + Tool Capability Registry (Cargo, pytest, npm, go, cmake, ...).

  ## Coupling rules
  - The core has no build- or run-time dependency on Python, Node or any governed-project toolchain.
  - The core invokes external processes only through registry-declared tool descriptors or plugin descriptors.
  - Kernel policies, skills, schemas and adapters contain no hard-coded language/toolchain requirement; ecosystem-specific
    knowledge lives in tools/registry (capability-tagged descriptors) and in ecosystem detection.
  - Embedding model, inference runtime, index store, reranker and generative model are separate, individually pinned in
    governance/generated/index-manifest.json.

  ## Logical-to-physical layout
  framework/ -> kernel payload; runtime/ -> Rust lib; cli/ -> Rust bin; capabilities/ -> plugins; tools/ -> registries;
  migrations/ -> declarative migrations; tests/ -> certification harness (Rust integration tests via cli [[test]] paths,
  Python plugin tests); fixtures/ -> synthetic projects; release/ -> manifests; lessons/inbox/, change-proposals/, docs/.
