body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Rule
  FD-1: every input of a trust decision is a selector, restrictor or carrier in the complete compiled decision register
  (decision-register/DECISION_REGISTER.yaml); selectors have at least the authority and currency the decision confers;
  signatures count only for facts their signers established; the artefact judged never evaluates itself; every selector
  substitution is a strategy of the derivation calculator, and minimum capability sets and consequence statements are
  generated by it (29).

  ## Chain
  first-contact sources of the owner's OP-13 answer (first-contact code per Trust State) -> first-contact manifest
     {lineage, state epoch, admitter digests} (32)
  -> release registration (root threshold or root-granted quorum >= 2; append-only): source identity v2 {commit, Git tree,
     length-prefixed content digest}, input manifest v2, build environments established by >= 2 first-hand environment
     reproductions from upstream-checked components (33), final, targets, verification records received first-hand for
     exactly the registered candidate and kernel, constitutional unit map, kernel tree digest and migrations derived
     first-hand by each custodian (34), (30)
  -> first-person reproductions (>= 2 distinct reproducer keys, inputs by digest, environments re-assembled, confirmed
     first-hand to the publisher, conflict refuses until a registration revocation) -> Trust State publishes the
     registration (E7 restrictors checked by the publisher) and exactly one quorum digest per release and target
  -> admission-predicate/1 over measured bytes (25 §5): first admission by gov-admit after the operator procedure FC-1..FC-3,
     enforcing the compiled first-contact quorum, lineage from the typed value, compiled lineage under OP-13 (c)/(d) and
     evaluator binding (FC-4..FC-8); later binaries by an admitted gov with inclusion anchors and a currency proof naming
     the selected state; install from the measured buffer; admission record in the protected store, serialised, store kept
     on re-admission; genuine-binary rule (31)
  -> knowledge set (T0, verifier trust store, project trust record, bundle, refresh; verified statements only; union;
     statements issued in the future refused and disabling clock-based proofs; stateful clock high-water from every ingested
     statement)
  -> effective root (Fact Threshold Check, root threshold >= 2); Trust Policy (computed reductions); Trust State (anchors by
     inclusion; registrations[] and published_binaries[] never dropped; trust-state revocations remove no restrictor);
     negative set
  -> authenticate(source) V0-V12 (V8 as restrictor) -> eligibility E1-E10 (E7 against the release's own registration with
     the admission predicate's restrictors and verifier-side registration reductions; release-scoped presence)
  -> local trust-gate confirmation (typed digest and, for C3 kinds, typed state fingerprint; or a protected decision pin
     within its maximum validity); registration_change gate for security-classified changes on recorded projects
  -> install transaction (trust-tx; stage from buffers; union state; closed trust entry sets including .gitattributes;
     occupation layout and ignore-rule surgery; strength vector over effective policy)
  -> every unit of work: RoT-1 root discovery (refuse inside the Protected Path Set and the transaction area) ->
     installation state (closed entry sets) -> admission record of the running binary in its store -> KernelSnapshot
     generation -> allow-list-confined children only after trust decisions
  -> effective policy = eligible installed kernel or embedded snapshot, floors joined with the effective Trust Policy,
     non-join units as registered for the policy-root release, registered precedence joined with the held registration,
     directed project join, registered-relaxable exceptions only
  -> operation class C0-C3 permitted by trust state x freshness x currency x OP-7 x installation location.

  ## Proposed modules (runtime/src/trust/)
  root (Fact Threshold Check), purposes, decision_register (Selected<T>; compiled from DECISION_REGISTER.yaml), tbm (Trust
  Base Manifest v3), jcs, dsse, statement, registration (release registration, environments, unit map, append-only,
  equivocation and verifier-side reduction checks, registration changes), reproduction (quorum, conflict, environment ids,
  restrictor revocation authority), environment (environment manifests, environment reproductions), admission
  (admission-predicate/1, admission records in the store, genuine-binary rule), state (knowledge set, admissibility,
  views), anchor (pins with validity and integrity predicate, confirmations, in-gate confirmation, witnesses, inclusion,
  currency proofs naming the state, stateful clock high-water), confine (allow list), surface (Constitutional Surface
  evaluator with release-scoped registration, E7 restrictors, presence, YAML profile, exact precedence, two-directional
  order, directed join, Overlay Surface, owner-domain binding groups, consumer register, strength vector), floor,
  eligibility, trust_gate, secure_fs, governed_fs, authenticate, authorise, install_tx, snapshot, layout (FORMAT,
  occupation entries typed by st_mode, closed trust entry sets including .gitattributes, root discovery, ignore-rule surgery,
  legacy detection), publish, draft_policy (derivation calculator, pack checks, unanswered-option refusal) and
  draft_registration (first-hand content verification) (producer); kernel_trust.rs v2; separate gov-test-profile binary
  crate; separate gov-admit program (OP-12) with the first-contact rules and the shared conformance vectors.

  ## Proposed signing purposes
  root (threshold >= 2), trust-policy (root keys, root threshold), release-registration (threshold >= 2; root keys at root
  threshold under OP-2 (a) or single-purpose keys under OP-2 (b); also signs registration revocations, the only removal of a
  restrictor), reproducer (single-purpose keys; one signature per statement; binary and environment reproductions; quorum
  >= 2), trust-state, release-final (restrictor), release-candidate (evaluation; the registered candidate is a restrictor),
  verification-attestation v4 (restrictor; counted only for the registered candidate and kernel), certification-status,
  revocation (never removes a restrictor), retrieval-profile, freshness-witness (OP-7 (c) only; single purpose; at least two
  keys under two custodians for C3). release-artifact and build-attestation are withdrawn. The compiled pairwise whitelist
  permits only root+trust-policy, root+release-registration and trust-policy+release-registration (OP-2 (a)),
  release-final+release-candidate (OP-4), revocation+certification-status, revocation+trust-state and
  retrieval-profile+release-final.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/trust (including registration.dsse.json and .gitattributes),
    the occupation entries and the transaction area; it accepts an AuthenticatedRelease that is a RegisteredRelease and an
    Authorisation built only from a consumed local trust-gate confirmation or a protected decision pin.
  - Only admission constructs an AdmittedBinary, and only from admission-predicate/1 run by an evaluator other than the
    candidate; in gov-admit a FirstContactManifest is constructible only from bytes whose digest equals a typed code that met
    the compiled quorum; a process without an admission record in its store for its own digest exposes C0 commands only.
  - An EligibleRelease is constructible only after the admission predicate's restrictors and verifier-side registration
    reductions hold; a CountedAttestation only for the registered candidate and kernel tree digest.
  - GovernedFs is the only file-mutation API; conformance proves no protected-path mutation outside install_tx.
  - Only kernel_trust and install_tx open governance/trust; every other module receives a KernelSnapshot.
  - The policy loader is the only producer of effective policy; non-join values come only from the registration of the
    policy-root release; a PrecedenceRule is constructible only from Trust Policy registrations.
  - Every selector is a Selected<T> constructible only from the source the compiled decision register names; a new
    decision input fails the build until registered.
  - An Anchor is constructible only from a protected valid pin, a verifier-trust-store human or in-gate record or
    verified witnesses; a CurrencyProof names the Trust State it covers and is required by every C3 entry point and by
    admission.
  - confine::spawn is the only way to run a repository- or plugin-supplied command (allow list), and cannot run while an
    Authorisation is being constructed.
  - No decision reads a release manifest, an occupation entry, a repository gate record's answer, lock hints, a value
    printed by a candidate binary, a CI-proposed registration content or a pipeline image record.
  - Statement, registration, registration-revocation, reproduction, environment-reproduction, input-manifest,
    environment-manifest, first-contact-manifest, admission-record, lock, FORMAT, Trust Base Manifest, state-pin,
    decision-pin, witness and confirmation schemas, the floor vocabulary, the purpose table and the decision register are
    compiled into the binary.
