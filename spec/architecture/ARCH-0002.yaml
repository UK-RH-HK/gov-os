body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Rule
  FD-1: every input of a trust decision is a selector, restrictor or carrier in a compiled decision register; selectors
  have at least the authority and currency the decision confers; signatures count only for facts their signers
  established; the artefact judged never evaluates itself; minimum capability sets are computed by the derivation
  calculator (29).

  ## Chain
  independent channels (trust-root id, state fingerprint of every Trust State, admitter digest)
  -> release registration (root threshold or root-granted quorum >= 2; append-only): source identity {commit, canonical
     content digest}, input manifest, final, targets, verification records received first-hand, constitutional unit map
     and kernel tree digest, migrations (30)
  -> first-person reproductions (>= 2 distinct reproducer keys, inputs by digest, confirmed first-hand to the publisher,
     conflict refuses) -> Trust State publishes the registration and exactly one quorum digest per release and target
  -> admission-predicate/1 over measured bytes (25 §5): first admission by gov-admit with a typed state fingerprint;
     later binaries by an admitted gov with inclusion anchors and a currency proof naming the selected state; install from
     the measured buffer; admission record; genuine-binary rule (31)
  -> knowledge set (T0, verifier trust store, project trust record, bundle, refresh; verified statements only; union;
     statements issued in the future refused; stateful clock high-water from every ingested statement)
  -> effective root (Fact Threshold Check); Trust Policy (computed reductions); Trust State (anchors by inclusion;
     registrations[] and published_binaries[] never dropped); negative set
  -> authenticate(source) V0-V12 (V8 as restrictor) -> eligibility E1-E10 (E7 against the release's own registration:
     exact units and kernel tree digest; release-scoped presence)
  -> local trust-gate confirmation (typed digest and, for C3 kinds, typed state fingerprint; or a protected decision pin
     within its maximum validity)
  -> install transaction (trust-tx; stage from buffers; union state; closed trust entry sets; occupation layout and
     ignore-rule surgery; strength vector over effective policy, computed from pre-transaction inputs without a record)
  -> every unit of work: RoT-1 root discovery (refuse inside the Protected Path Set) -> installation state (closed entry
     sets) -> admission record of the running binary -> KernelSnapshot generation -> allow-list-confined children only
     after trust decisions
  -> effective policy = eligible installed kernel or embedded snapshot, floors joined with the effective Trust Policy,
     non-join units as registered for the policy-root release, registered precedence joined with the held registration,
     directed project join, registered-relaxable exceptions only
  -> operation class C0-C3 permitted by trust state x freshness x currency x OP-7.

  ## Proposed modules (runtime/src/trust/)
  root (Fact Threshold Check), purposes, decision_register (Selected<T>), tbm (Trust Base Manifest v3), jcs, dsse,
  statement, registration (release registration, unit map, append-only and equivocation checks), reproduction (quorum,
  conflict), admission (admission-predicate/1, admission records, genuine-binary rule), state (knowledge set,
  admissibility, views), anchor (pins with validity and integrity predicate, confirmations, in-gate confirmation,
  witnesses, inclusion, currency proofs naming the state, stateful clock high-water), confine (allow list), surface
  (Constitutional Surface evaluator with release-scoped registration, presence, YAML profile, exact precedence,
  two-directional order, directed join, Overlay Surface, owner-domain binding groups, consumer register, strength
  vector), floor, eligibility, trust_gate, secure_fs, governed_fs, authenticate, authorise, install_tx, snapshot,
  layout (FORMAT, occupation entries typed by st_mode, closed trust entry sets, root discovery, ignore-rule surgery,
  legacy detection), publish, draft_policy (derivation calculator) and draft_registration (producer); kernel_trust.rs v2;
  separate gov-test-profile binary crate; separate gov-admit program (OP-12) sharing conformance vectors only.

  ## Proposed signing purposes
  root, trust-policy (root keys, root threshold), release-registration (threshold >= 2; root keys at root threshold under
  OP-2 (a) or single-purpose keys under OP-2 (b)), reproducer (single-purpose keys; one signature per statement; quorum
  >= 2), trust-state, release-final (restrictor), release-candidate (evaluation only), verification-attestation
  (restrictor; counted records), certification-status, revocation, retrieval-profile, freshness-witness (OP-7 (c) only;
  single purpose; at least two keys under two custodians for C3). release-artifact and build-attestation are withdrawn.
  The compiled pairwise whitelist permits only root+trust-policy, root+release-registration and
  trust-policy+release-registration (OP-2 (a)), release-final+release-candidate (OP-4), revocation+certification-status,
  revocation+trust-state and retrieval-profile+release-final.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/trust (including registration.dsse.json), the occupation
    entries and the transaction area; it accepts an AuthenticatedRelease that is a RegisteredRelease and an Authorisation
    built only from a consumed local trust-gate confirmation or a protected decision pin.
  - Only admission constructs an AdmittedBinary, and only from admission-predicate/1 run by an evaluator other than the
    candidate; a process without an admission record for its own digest exposes C0 commands only.
  - GovernedFs is the only file-mutation API; conformance proves no protected-path mutation outside install_tx.
  - Only kernel_trust and install_tx open governance/trust; every other module receives a KernelSnapshot.
  - The policy loader is the only producer of effective policy; non-join values come only from the registration of the
    policy-root release; a PrecedenceRule is constructible only from Trust Policy registrations.
  - Every selector is a Selected<T> constructible only from the source the compiled decision register names; a new
    decision input fails the build until registered.
  - An Anchor is constructible only from a protected valid pin, a verifier-trust-store human or in-gate record or
    verified witnesses; a CurrencyProof names the Trust State it covers and is required by every C3 entry point and by
    admission.
  - confine::spawn is the only way to run a repository- or plugin-supplied command (allow list), and cannot run while an
    Authorisation is being constructed.
  - No decision reads a release manifest, an occupation entry, a repository gate record's answer, lock hints or a value
    printed by a candidate binary.
  - Statement, registration, reproduction, input-manifest, admission-record, lock, FORMAT, Trust Base Manifest,
    state-pin, decision-pin, witness and confirmation schemas, the floor vocabulary, the purpose table and the decision
    register are compiled into the binary.
