body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Chain
  independent channels (trust-root id, state fingerprint of every Trust State) -> OP-6 lineage confirmation and a local
  anchor (state pin, human confirm-state, or witness under OP-7 c)
  -> gov binary accepted by verify-artifact (release-artifact >= 2, independent build attestation, trust-state
     reference, Trust Base Manifest resolving to root- and trust-state-signed statements at or above the VTS high-water)
  -> knowledge set (T0, verifier trust store, project trust record, bundle, refresh; verified statements only; union)
  -> effective root; Trust Policy (prior_policies, computed lowering); Trust State (resolution, anchored orphans,
     equivocation, admissibility with cumulative prior_states); negative set; trust_state and freshness axes
  -> authenticate(source) V0-V12 with the V11s Constitutional Surface evaluation
  -> eligibility E1-E10 (E7 surface: every file and leaf classified, pinned registered, floors vs the named policy,
     precedence per key; E8 trust state KNOWN and freshness ANCHORED/WITNESSED)
  -> local trust-gate confirmation (terminal challenge or operator decision pin; never a repository record)
  -> install transaction (.governance-runtime/trust-tx registered in the VTS; stage from buffers; read-back and link
     counts; exchange governance/trust with union state; lock last inside trust; legacy-path occupation; strength vector)
  -> every unit of work: installation state (including occupation) -> KernelSnapshot generation check
  -> effective policy = eligible installed kernel or embedded snapshot with every floor leaf joined with the effective
     Trust Policy, pinned leaves only if registered, precedence joined per concrete key, exceptions after the join
  -> operation class C0-C3 permitted by trust state x freshness x OP-7; consumers and agents read snapshot bytes.

  ## Proposed modules (runtime/src/trust/)
  root, purposes, tbm (Trust Base Manifest), jcs, dsse, statement, state (knowledge set, admissibility, views), anchor
  (pins, confirmations, witnesses, freshness), surface (Constitutional Surface evaluator, precedence lattice, consumer
  register), floor, eligibility, trust_gate (local confirmations, decision pins), artifact (verify-artifact), secure_fs,
  governed_fs, authenticate, authorise, install_tx (journal, VTS registry, union, exchange, recovery), snapshot
  (KernelSnapshot generation, EmbeddedSnapshot, installation state), layout (FORMAT, occupation entries, legacy detection,
  layout migration), publish and draft_policy (producer); kernel_trust.rs v2; separate gov-test-profile binary crate.

  ## Proposed signing purposes
  root, trust-policy (root keys, root threshold), trust-state, release-final, release-candidate, release-artifact
  (threshold >= 2, shares with no other purpose), build-attestation (independent rebuilder), verification-attestation,
  certification-status, revocation, retrieval-profile. A compiled pairwise whitelist permits only root+trust-policy,
  release-final+release-candidate (OP-4 no), revocation+certification-status, revocation+trust-state and
  retrieval-profile+release-final; every other pair is forbidden. Historical releases are part of the root-signed Trust
  Policy; the historical-identity statement is withdrawn.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/trust, the occupation entries (governance/kernel,
    governance/project, governance/generated as files; governance/framework.lock as a directory;
    spec/audits/GOVERNANCE-ADOPTION; .governance-runtime/migration) and the transaction area; it accepts an
    AuthenticatedRelease and an Authorisation built only from a consumed local trust-gate confirmation.
  - GovernedFs is the only file-mutation API; conformance proves no protected-path mutation outside install_tx for every
    command (builder interception; verifier OS-level tracing).
  - Only kernel_trust and install_tx open governance/trust; every other module receives a KernelSnapshot; every unit of
    work compares its snapshot generation with installed identity and trust state.
  - The policy loader is the only producer of effective policy; security decision points accept only floor, pinned,
    members or precedence leaves; every consumed key is in a compiled consumer register classified by the compiled Trust
    Policy.
  - No decision reads a release manifest, an occupation entry, a repository gate record's answer, or lock hints.
  - Statement, lock, FORMAT, Trust Base Manifest, pin and confirmation schemas, the floor vocabulary and the purpose table
    are compiled into the binary.
  - Anchors and trust-gate confirmations are constructible only from the account database or verified witnesses; C3
    entry points require an anchor.
  - Environment variables select sources only; the verifier trust store and pins are located through the OS account
    database.
