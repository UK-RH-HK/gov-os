body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Chain
  trust-root metadata compiled into gov (T0) -> DSSE-signed release statement (Ed25519 over RFC 8785 canonical payload)
  -> identity + complete kernel file map + component and migration digests -> authenticate(source) in quarantine
  (V0-V14) -> AuthenticatedRelease -> authorisation (certification, gates bound to statement digest, downgrade, authority)
  -> journaled install transaction (prepared, staged, swapped, migrated, committed, verified) -> governance/trust/ +
  framework.lock (record) -> kernel_trust v2 on every use (installed files == statement, statement verifies under T0,
  not revoked, lock consistent) -> TrustedKernel read handle.

  ## Proposed modules (runtime/src/trust/)
  root, jcs, dsse, statement, quarantine, authenticate, authorise, revocation, install_tx, kernel_fs; kernel_trust.rs v2.

  ## Proposed key roles
  root (k-of-n offline), release, certification, profile; disjoint key sets; test lineage compiled only with feature
  trust-profile-test; production binaries refuse test material.

  ## Proposed coupling rules
  - Only install_tx writes governance/kernel, governance/trust, governance/framework.lock; it accepts AuthenticatedRelease.
  - Only kernel_trust resolves paths to kernel content; everything else receives a TrustedKernel.
  - No decision reads a release manifest.json/yaml or a source KERNEL_MANIFEST.json.
  - Statement and lock schemas are compiled into the binary.
  - Environment variables select sources only.
  - The pure-Rust signature dependency keeps D-0002's self-contained binary; algorithm choice is recorded in the trust
    root and replaceable.
