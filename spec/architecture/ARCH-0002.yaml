body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Chain
  independent channels (trust-root id, state fingerprint of every Trust State) -> OP-6 lineage confirmation and a local
  anchor (protected state pin with valid_until, human confirm-state, or in-gate typed state fingerprint)
  -> gov binary accepted by verify-artifact (release-artifact >= 2; independent build attestation; source equal to the
     source an ACCEPTED independent verification attested, equal across candidate, final, build attestation and Trust
     Base Manifest; trust-state reference; Trust Base Manifest resolving at or above the accepted-TBM high-water; currency
     proof)
  -> knowledge set (T0, verifier trust store, project trust record, bundle, refresh; verified statements only; union;
     statements issued in the future refused)
  -> effective root; Trust Policy (prior_policies, computed reductions in both directions); Trust State (resolution,
     anchors satisfied by inclusion, orphans and unchained statements never effective, equivocation, admissibility with
     cumulative prior_states); negative set (lift needs an attestation naming the negative); trust_state, freshness and
     currency axes
  -> authenticate(source) V0-V12 (V8 source equality; V11s surface: presence, YAML profile, exact precedence, migration
     whitelist)
  -> eligibility E1-E10 (E7 surface; E8 trust state KNOWN, freshness ANCHORED/WITNESSED and a currency proof)
  -> local trust-gate confirmation (terminal challenge with typed digest and, for C3 kinds, typed state fingerprint; or a
     protected expiring decision pin; never a repository record)
  -> install transaction (.governance-runtime/trust-tx registered in the VTS; stage from buffers; read-back and link
     counts; exchange governance/trust with union state; lock last inside trust; legacy-path occupation and ignore rule;
     migration whitelist; strength vector over effective policy)
  -> every unit of work: installation state (including occupation) -> KernelSnapshot generation check -> confined
     children only after trust decisions
  -> effective policy = eligible installed kernel or embedded snapshot with every floor leaf joined with the effective
     Trust Policy, pinned leaves only if registered (else registered embedded value or SURFACE_VALUE_UNAVAILABLE),
     registered precedence joined with the project's held registration, project layer applied as a directed join,
     exceptions registered-relaxable only
  -> operation class C0-C3 permitted by trust state x freshness x currency x OP-7; consumers and agents read snapshot
     bytes.

  ## Proposed modules (runtime/src/trust/)
  root, purposes, tbm (Trust Base Manifest v2 with binary.source), jcs, dsse, statement, state (knowledge set,
  admissibility, views), anchor (pins with validity and integrity predicate, confirmations, in-gate confirmation,
  witnesses, inclusion satisfaction, currency proofs), confine (the only spawner of repository- and plugin-supplied
  commands; OS write confinement), surface (Constitutional Surface evaluator: presence, YAML profile, exact precedence,
  two-directional order, directed join, Overlay Surface, owner-domain slots, consumer register, strength vector), floor,
  eligibility, trust_gate (local confirmations, decision pins), artifact (verify-artifact with attested source and custodial
  stages), secure_fs, governed_fs, authenticate, authorise, install_tx (journal, VTS registry, union, exchange, recovery),
  snapshot (KernelSnapshot generation, EmbeddedSnapshot, installation state), layout (FORMAT, occupation entries typed by
  st_mode, ignore rule, legacy detection, layout migration), publish and draft_policy (producer); kernel_trust.rs v2;
  separate gov-test-profile binary crate.

  ## Proposed signing purposes
  root, trust-policy (root keys, root threshold), trust-state, release-final, release-candidate, release-artifact
  (threshold >= 2, shares with no other purpose), build-attestation (independent rebuilder), verification-attestation
  (attests the source), certification-status, revocation, retrieval-profile, freshness-witness (OP-7 (c) only; shares with
  no other purpose; at least two keys for C3). A compiled pairwise whitelist permits only root+trust-policy,
  release-final+release-candidate (OP-4 no), revocation+certification-status, revocation+trust-state and
  retrieval-profile+release-final; every other pair is forbidden. Historical releases, production sources (OP-2 S1),
  bootstrap parameters and clock reset are part of the root-signed Trust Policy.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/trust, the occupation entries (governance/kernel,
    governance/project, governance/generated as files; governance/framework.lock as a directory;
    spec/audits/GOVERNANCE-ADOPTION; .governance-runtime/migration) and the transaction area; it accepts an
    AuthenticatedRelease and an Authorisation built only from a consumed local trust-gate confirmation or a protected
    decision pin.
  - GovernedFs is the only file-mutation API; conformance proves no protected-path mutation outside install_tx for every
    command (builder interception; verifier OS-level tracing).
  - Only kernel_trust and install_tx open governance/trust; every other module receives a KernelSnapshot; every unit of
    work compares its snapshot generation with installed identity and trust state.
  - The policy loader is the only producer of effective policy; a PrecedenceRule is constructible only from Trust Policy
    registrations; the kernel's POLICY_PRECEDENCE is parsed only to compare it with the registration; security decision
    points accept only floor, pinned, members or precedence leaves; every consumed key is in a compiled consumer register
    classified by the compiled Trust Policy.
  - An Anchor is constructible only from a protected valid pin, a VTS human or in-gate record or verified witnesses, and is
    satisfied only by inclusion; a CurrencyProof is required by every C3 entry point and by verify-artifact.
  - confine::spawn is the only way to run a repository- or plugin-supplied command, and cannot run while an Authorisation
    is being constructed.
  - No decision reads a release manifest, an occupation entry, a repository gate record's answer, or lock hints; reinstall
    identity comes from the VTS per-project record.
  - Statement, lock, FORMAT, Trust Base Manifest, state-pin, decision-pin, witness and confirmation schemas, the floor
    vocabulary and the purpose table are compiled into the binary.
  - Environment variables select sources only; the verifier trust store is located through the OS account database and
    pins through the system pin directory or the account location under the integrity predicate.
