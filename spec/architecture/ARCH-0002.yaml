body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect. Owner selections are binding design inputs
  (OWNER-DESIGN-REQUIREMENTS-0001), not approval.

  ## Profile
  One certified production profile CP-1 (governance-os.rot1/CP-1; release/root-of-trust/4.1.6/35-CERTIFIED-PROFILE.md,
  profile/CP-1.yaml): OP-1..OP-16 as selected; first-contact composer/signer at root threshold; derived environment manifests;
  exclusions EX-01..EX-24 absent or refused; certified targets only when CC-1..CC-9 hold (initial set x86_64 and aarch64
  linux-musl, both not certified pending criteria); owner trade-offs OT-1 and OT-2 stated, not decided.

  ## Rule
  FD-1: every input of a trust decision — every schema field and procedure input — is a selector, restrictor, binding,
  carrier, informational or excluded input in the complete compiled decision register (decision-register/DECISION_REGISTER.yaml)
  naming its establishing party; selectors have at least the authority and currency the decision confers; signatures count
  only for facts their signers established; the artefact judged never evaluates itself; every selector substitution is a
  strategy of the derivation calculator, and consequence statements are generated by it with an injective renderer (29).

  ## Chain
  root ceremony (3 keys, 2-of-3, three custodial roles) -> Trust Policy (always gate, admission ceilings, supplier and
     toolchain provenance registries, certified targets) and the First-Contact Authority record {lineage, compiled admitter
     per certified target after its registration, reproduction and two verification records, two sources, procedure} (32)
  -> two first-contact sources under separate custody publish the trust code and each Trust State's state code only after
     first-hand verification, byte-identical (32 R-FCS)
  -> release registration (2-of-3 delegated; append-only): source identity v2, input manifest v3, environment lock in
     registered source, environments derived by gov-envmanifest/1 and established by agreeing environment reproductions with
     the registration over their exact identity, two independent toolchain lineages, final (2 signatures), targets, two
     independent verification records bound to the candidate, kernel and environments, constitutional content derived
     first-hand, binary digests from the custodians' own reproduction, security-relevant-change flag (30, 33, 34)
  -> first-person reproductions (2 of 3 reproducer roles, inputs by digest, environments re-assembled, two supplier classes
     and two toolchain lineages independent by provenance, equal to the registered digest, confirmed first-hand; conflict
     refuses until a registration revocation) -> Trust State (2-of-3) publishes the registration (E7 restrictors checked by
     the publisher) and exactly one digest per release and target, referencing the FCA in force
  -> admission-predicate/1 over measured bytes (25 §5): first admission and re-admission by gov-admit after FC-1′..FC-3′,
     enforcing FC-4′..FC-10 (compiled quorum and lineage, FCA at root threshold, target certification, evaluator binding,
     24-hour state age, state binding) and AP-R1..AP-R6 (store floors); later binaries by an admitted gov with inclusion
     anchors within validity and a currency proof of at most 24 hours naming the selected state; install from the measured
     buffer; admission record (expiring) in the protected admission store, serialised; first admission decided only by the
     protected store; genuine-binary rule with R-CLK-1 and R-ART-2 (31)
  -> knowledge set (T0, both stores, project trust record, bundle, refresh; verified statements only; union; statements
     issued in the future refused; clock high-water from every ingested statement and admission)
  -> effective root (CP-1 shapes); Trust Policy (computed reductions); Trust State (anchors by inclusion; registrations[] and
     published_binaries[] never dropped; trust-state revocations remove no restrictor); negative set
  -> authenticate(source) V0-V12 (V8 as restrictor) -> eligibility E1-E10 (E7 against the release's own registration with
     the admission predicate's restrictors, the computed security minimum and verifier-side registration reductions)
  -> local trust-gate confirmation (typed digest and, for C3 kinds, both sources' state codes; or a protected decision pin
     within 7 days for the kinds it may approve); registration_change gate for security-classified changes
  -> install transaction (trust-tx; stage from buffers; union state; closed trust entry sets; journaled layout migration;
     occupation layout and ignore-rule surgery; strength vector over effective policy)
  -> every unit of work: RoT-1 root discovery (refuse inside the Protected Path Set and the transaction area) ->
     installation state (closed entry sets) -> admission record of the running binary in the protected store ->
     KernelSnapshot generation -> allow-list-confined children only after trust decisions
  -> effective policy = eligible installed kernel or embedded snapshot, floors joined with the effective Trust Policy,
     non-join units as registered for the policy-root release, registered precedence joined with the held registration,
     directed project join, registered-relaxable exceptions only
  -> operation class C0-R/C0/C1/C2/C3 permitted by trust state x anchor validity x currency x clock x installation location.

  ## Proposed modules (runtime/src/trust/)
  root (CP-1 shapes, Fact Threshold Check), purposes, profile (compiled CP-1 constants; exclusion refusals), decision_register
  (Selected<T>; compiled from DECISION_REGISTER.yaml), tbm (Trust Base Manifest v4), jcs, dsse, statement, first_contact
  (First-Contact Authority record, trust and state codes), registration (release registration, environments, toolchains,
  unit map, append-only, equivocation and verifier-side reduction checks, registration changes, security minimum),
  reproduction (quorum, conflict, supplier and toolchain independence by provenance, restrictor revocation authority),
  environment (environment lock, gov-envmanifest/1, gov-envassemble/1, environment reproductions), admission
  (admission-predicate/1, protected admission store, account store, records, floors, genuine-binary rule), state (knowledge
  set, admissibility, views), anchor (pins with validity and integrity predicate, confirmations with both state codes,
  in-gate state codes, inclusion, currency proofs naming the state, clock high-water), confine (allow list), surface
  (Constitutional Surface evaluator with release-scoped registration, E7 restrictors, presence, YAML profile, exact
  precedence, two-directional order, directed join, Overlay Surface, owner-domain binding groups, consumer register,
  strength vector), floor, eligibility, trust_gate, secure_fs, governed_fs, authenticate, authorise, install_tx, snapshot,
  layout (FORMAT, occupation entries typed by st_mode, closed trust entry sets, journaled first-install migration, root
  discovery, ignore-rule surgery, legacy detection), publish, draft_policy (CP-1 conformance, derivation calculator, pack
  checks) and draft_registration (first-hand content, environment and toolchain verification) (producer); kernel_trust.rs v2;
  separate gov-test-profile binary crate; separate compiled gov-admit program (OP-12 (a)) with the first-contact rules and
  the shared conformance vectors.

  ## Proposed signing purposes (exact CP-1 shapes)
  root (3 keys, 2), trust-policy (root keys, root threshold), first-contact-authority (root keys, root threshold),
  release-registration (3 single-purpose keys, 2; also signs registration revocations, the only removal of a restrictor),
  reproducer (3 single-purpose keys; one signature per statement; binary and environment reproductions; quorum 2),
  trust-state (3 single-purpose keys, 2), release-final (>= 2 keys, >= 2; restrictor), release-candidate (one separate key;
  evaluation only), verification-attestation v5 (restrictor; two independent records), certification-status (>= 2 keys,
  >= 2; negatives only), revocation (3 keys, 2; root-threshold emergency; never removes a restrictor), retrieval-profile
  (single purpose). release-artifact, build-attestation and freshness-witness are never granted. The compiled whitelist
  permits only root+trust-policy, root+first-contact-authority and trust-policy+first-contact-authority.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/trust (including registration.dsse.json and .gitattributes),
    the occupation entries and the transaction area; it accepts an AuthenticatedRelease that is a RegisteredRelease and an
    Authorisation built only from a consumed local trust-gate confirmation or a protected decision pin.
  - Only admission constructs an AdmittedBinary, and only from admission-predicate/1 run by gov-admit or an admitted gov; in
    gov-admit a FirstContactAuthority is constructible only from bytes whose digest equals two identical typed trust codes
    and that verify at root threshold under the compiled lineage, and a SelectedState only from two identical state codes
    naming a Trust State at threshold, at most 24 hours old and not below the stores' floors; only the protected admission
    store decides a first admission; a process without an honoured record exposes read-only diagnostics only.
  - An EligibleRelease is constructible only after the admission predicate's restrictors, the computed security minimum and
    verifier-side registration reductions hold; a CountedAttestation only for the registered candidate, kernel tree digest
    and environments, from a distinct key, execution and report.
  - An EnvironmentIdentity is constructible only from a manifest derived by gov-envmanifest/1 from the registered lock and
    pinned supplier keys; an IndependentClass or IndependentLineage only from root-registered provenance.
  - GovernedFs is the only file-mutation API; conformance proves no protected-path mutation outside install_tx.
  - Only kernel_trust and install_tx open governance/trust; every other module receives a KernelSnapshot.
  - The policy loader is the only producer of effective policy; non-join values come only from the registration of the
    policy-root release; a PrecedenceRule is constructible only from Trust Policy registrations.
  - Every selector is a Selected<T> constructible only from the source the compiled decision register names; a new
    decision input or schema field fails the build until registered with a role.
  - An Anchor is constructible only from a protected valid pin or a store record of a confirmation carrying both sources'
    state codes; a CurrencyProof names the Trust State it covers, is at most 24 hours old, and is required by every C3 entry
    point and by admission.
  - confine::spawn is the only way to run a repository- or plugin-supplied command (allow list), and cannot run while an
    Authorisation is being constructed.
  - No decision reads a release manifest, an occupation entry, a repository gate record's answer, lock hints, a value
    printed by a candidate or unadmitted binary, a CI-proposed registration content, a pipeline environment manifest or
    image record, or a supplier or toolchain label.
  - Statement, registration, registration-revocation, reproduction, environment-reproduction, input-manifest,
    environment-lock, environment-manifest, first-contact-authority, admission-record, lock, FORMAT, Trust Base Manifest,
    state-pin, decision-pin and confirmation schemas, the floor vocabulary, the purpose table, the certified profile and the
    decision register are compiled into the binary.
