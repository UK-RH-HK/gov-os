body: |
  STATUS: PROPOSED / PENDING. Nothing below is in effect.

  ## Chain
  compiled T0 (root chain, purposes and separation constraints, schemas, floor operators, Trust Policy, Trust State,
  historical-identity registry, embedded kernel snapshot)
  -> knowledge set (T0, verifier trust store, project trust record, bundle, refresh; verified statements only)
  -> effective root, policy, admissible trust state, negative set, staleness
  -> authenticate(source): secure read-once into verified buffers, purpose-bound signatures, identity/lineage/promotion,
     content digests, migration chain, compatibility (V0-V12)
  -> AuthenticatedRelease in memory (content identity = statement digest + tree digest)
  -> eligibility (E1-E10), trust-state requirement, Human Decision Gates (OP-3), install-authority floor, computed
     overlay weakenings, downgrade policy
  -> install transaction (stage from buffers, read-back re-digest, atomic exchange, migrations from buffers, lock last,
     post-commit snapshot equality)
  -> every process: installation state machine -> KernelSnapshot (read once, verified, eligible) or embedded snapshot
  -> effective floor = Trust Policy joined with the policy root and overlay strengthening
  -> consumers read snapshot bytes only; derived artefacts bound to the content identity.

  ## Proposed modules (runtime/src/trust/)
  root, purposes, jcs, dsse, statement, state (knowledge set, admissibility, views), floor, eligibility, secure_fs
  (SecureDir, VerifiedBlob), governed_fs (Protected Path Set guard), authenticate, authorise, install_tx (journal,
  exchange, uninstall, recovery), snapshot (KernelSnapshot, EmbeddedSnapshot, installation state), format (FORMAT,
  sentinels, tombstone), publish (draft-policy, publish); kernel_trust.rs v2; separate gov-test-profile binary crate.

  ## Proposed signing purposes
  root, trust-policy (root keys, root threshold), trust-state, release-final, release-candidate,
  verification-attestation, certification-status, revocation, retrieval-profile. Mandatory separation: root keys only
  root/trust-policy; release-final disjoint from certification-status and verification-attestation;
  certification-status disjoint from verification-attestation; release-candidate disjoint from both. Historical
  identities are release-final statements accepted only from the compiled copy.

  ## Proposed coupling rules
  - Only install_tx holds InstallTxToken and writes governance/kernel, governance/trust, governance/framework.lock and
    governance/.tx; it accepts an AuthenticatedRelease and an Authorisation, never a path.
  - GovernedFs is the only file-mutation API; std::fs mutation outside it fails an architecture test; conformance proves
    no protected-path mutation outside install_tx for every command by filesystem interception.
  - Only kernel_trust and install_tx open kernel or trust paths; every other module receives a KernelSnapshot.
  - No decision reads a release manifest.json/yaml, a source KERNEL_MANIFEST.json or the installed tombstone.
  - Statement, lock and FORMAT schemas, floor operators and the purpose table are compiled into the binary.
  - Eligibility, floors and install authority are computed from T0 and the Trust Policy lineage, never from the
    candidate kernel.
  - Environment variables select sources only; the verifier trust store is located through the OS account database.
  - The pure-Rust Ed25519 dependency keeps D-0002's self-contained binary; production-profile operation requires the
    platform secure-open, atomic-exchange and locking primitives.
