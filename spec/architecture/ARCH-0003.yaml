summary: >
  New architecture lineage, separate from RoT-1/CP-1. A trusted platform or administrator installs a small verifier and
  public root metadata; standard signed root/delegation and release/targets metadata authenticate every privileged
  lifecycle ingress; verified bytes move through private staging into an atomic install with protected monotonic
  high-water; installed-kernel integrity remains a separate D-0007 control. This record is owner-directed but not yet
  R0-accepted, active or implemented.
body: |
  ## 1. Mission and support envelope

  This architecture protects, and does not replace, the Governance OS defined by ARCH-0001 and Contract v3. Phase 1 is
  private, locally hosted and operated by the product owner on controlled machines and private repositories. R0 assumes
  the local OS, administrator, bootstrap installation boundary and local time source are uncompromised. The local clock
  is declared inside the trusted local boundary, on the same side of the line as the OS and administrator and not on
  the untrusted network side; no signed, attested, monotonic or network-supplied time is assumed, required or provided.

  It does not claim protection from a hostile administrator/OS, public multi-tenant isolation, absolute compiler
  correctness or knowledge of revocations that an offline machine has never received, and it claims no knowledge of
  future revocations that do not yet exist. It does not claim correct expiry, staleness or currency determinations when
  the local clock is materially wrong: expiry, staleness and currency are evaluated by comparing signed expiry fields
  to that clock, so a clock set behind may accept expired metadata as unexpired and report currency as current when it
  is not, and a clock set ahead may treat current metadata as expired and refuse trust-changing operations the profile
  would otherwise permit. Neither case lowers a signed floor, admits an unauthorised release or breaks the
  verified-byte binding; the failure is confined to freshness.

  ## 2. Trust domains

  Release authenticity, local installation authority, post-install integrity, build provenance, release certification,
  project policy, plugins/retrieval profiles and organizational custody are separate domains. Evidence may connect
  domains by digest, but no domain silently substitutes for another.

  ## 3. Trust chain

  1. An already trusted OS/admin boundary installs the bootstrap package.
  2. The bootstrap package contains the verifier, public root metadata and publisher/product identity; no private key.
  3. Root metadata defines trusted public keys, thresholds, roles, version and expiry.
  4. Root delegates standard release/targets, snapshot and timestamp roles.
  5. Release/targets metadata binds the exact release identity and payloads.
  6. One verifier evaluates the same policy for init, adopt, update, reinstall, rollback and recovery.
  7. Verified bytes are held in private staging and installed atomically from the measured representation.
  8. Protected local state records the highest valid metadata and minimum secure release observed.
  9. Post-install D-0007 integrity checks verify the installed kernel separately from source authenticity.

  ## 4. Metadata and identity

  Use a mature TUF-style metadata model and reviewed cryptographic library. R0 fixes the semantics, not a particular
  library version, algorithm or expiry duration; those are selected and qualified at R1/R2.

  Signed release/targets metadata binds at minimum product/repository identity, release version and monotonic sequence,
  supported platform/architecture, exact kernel/CLI/payload digests, schema and migration identities, minimum secure
  release, metadata version/expiry and optional digest references to provenance, SBOM, verification and certification
  evidence. Snapshot metadata binds one consistent metadata set. Timestamp metadata supplies short-lived freshness for
  trust-changing operations. Root metadata authorises delegation, threshold, rotation and revocation.

  The distribution-root target retains three offline root keys at 2-of-3. Standard delegated release/targets threshold
  signing replaces the bespoke registration protocol. Snapshot and timestamp keys are restricted to their standard
  purposes and cannot authorise new target bytes. Exact production custody and signing services are R2 matters.

  ## 5. Bootstrap

  Bootstrap authenticity comes from the pre-existing controlled platform/admin installation boundary. It is not derived
  from the candidate source, its manifest, its lock, its Git repository or mutually consistent files delivered with it.
  Alternative enterprise/MDM/manual-fingerprint/high-assurance profiles may be added later; their absence does not block
  this private/local R0 profile.

  ## 6. Uniform ingress and verified-byte transaction

  Every privileged lifecycle adapter must call one verification policy and receive a typed authenticated-release value,
  never a raw source directory. Project records and CLI/environment claims are inputs or requests, never authority.

  The future installer must open/read into private staging, verify the exact staged representation, install from that
  representation, commit atomically, verify the committed bytes and durably update high-water/journal state. Failure or
  crash must produce the old valid installation or the complete new valid installation, never a trusted mixed state.
  Detailed filesystem mechanisms and tests belong to R1; the invariant is R0-normative.

  ## 7. Ingress floors, freshness and revocation

  Clients persist the highest valid root/metadata versions and minimum secure release they have observed. Those floors
  are a property of the machine, not of one operation: no privileged lifecycle ingress — init, adopt, update, reinstall,
  rollback or recovery — may place the machine on a release below its protected local high-water or below the signed
  minimum secure release. The rule is scoped over the ingress set; `rollback` is the name of one governed ingress, not
  the name of the rule, and the floor check is part of the one verification policy of section 3 that every ingress
  calls. Root has long expiry; release/targets moderate expiry; snapshot shorter expiry; timestamp short
  refresh/expiry appropriate to trust-changing operations. Durations are profile parameters, not constitutional values.

  The recovery ingress admits two objects and they establish different things. An authenticated recovery target is
  established by signed release/targets metadata. An installed local recovery path is established as *intact* by the
  separate D-0007 installed-integrity records — an installed payload matching `KERNEL_MANIFEST.json` and a manifest
  matching `framework.lock.kernel_manifest_hash`. Those records establish only that the local copy is unmodified. They
  do not establish that it is authentic, and they do not establish that it is admissible. Where no current metadata is
  reachable, the authenticity of an installed local recovery path derives from this machine's own protected record of
  the release identity it previously verified and installed, never from the manifest, the lock, the repository or
  mutually consistent files delivered with the copy; this preserves OWNER-DIRECTIVE-0004's rule that the manifest and
  lock are not a first-install authenticity root. Admissibility remains the floor check above, which recovery performs
  like every other ingress.

  ## 7.1 Below-floor break-glass recovery

  A machine whose only complete local state is below its own floor is the one case the floor rule cannot silently
  decide. OWNER-DECISION-0006 selects break-glass, authorised and recorded. Below-floor recovery is therefore refused by
  default and is admissible only as an explicit owner-authorised emergency recovery mode with all of the following
  architectural properties.

  The restored release must still be an authentic Governance OS release. Break-glass relaxes the floor check only; it
  never relaxes the authenticity check and never admits arbitrary or unsigned code. The authority to enter break-glass
  must come from an owner-controlled local or out-of-band recovery mechanism and must not be manufacturable by
  repository content, environment variables, caller fields, plugins or model output — the D-0007 trust direction of
  section 8 applied to this mode. Network or repository-hosting reachability is not that authority and is not a
  precondition of it: recovery must remain possible with no network or code-hosting access. Entry must be durably
  recorded with, where available, the machine identity, the current signed security floor and protected high-water, the
  recovery release identity, the reason and a timestamp/evidence reference. While below floor the machine must be
  explicitly marked `DEGRADED — RECOVERY ONLY` and must report that state rather than presenting the below-floor
  release as current or fully trusted.

  In that state the permitted activities are inspection, backup/export, diagnosis, repair, uninstall/reinstall and
  restoration of an authenticated Governance OS release. Normal privileged Governance OS operation, creation or approval
  of Human Gates, release certification, trust-policy mutation and privileged plugin/profile acquisition are refused.
  The signed security floor and the protected high-water are never lowered, reset or forgotten by break-glass: the mode
  records that the machine is knowingly operating beneath them, it does not move them. Normal governed operation
  resumes only once an authenticated release at or above the signed minimum secure release is installed and verified,
  at which point the marking is cleared.

  The mechanism of the break-glass authority — its storage format, its operator surface, its identifiers and its
  tests — is an R1 matter and is deliberately not fixed here. The properties above are R0-normative.

  ## 7.2 Expiry, revocation and currency

  Expired/stale metadata blocks trust-changing lifecycle operations according to policy. It does not automatically brick
  an already authenticated installed Governance OS. A known revoked binary is limited to inspection, export, diagnosis,
  repair, uninstall and participation in restoring an admissible release, and cannot perform privileged governance work.
  That recovery allowance is a path back to an admissible state, not an authority to re-establish the revoked release
  itself: a revoked or below-floor release is not an admissible recovery object under the floor check, and placing the
  machine back onto one requires the break-glass authorisation of section 7.1, which a revoked binary cannot issue to
  itself and which leaves the machine marked `DEGRADED — RECOVERY ONLY` with privileged governance work withheld.

  Given an authentic bootstrap verifier/root set, an uncompromised local OS/admin boundary and a local time source
  inside that boundary as declared in section 1, offline clients report currency stale/unknown and never claim
  knowledge of unseen revocations. Expiry, staleness and currency are determined against that declared local clock; the
  honesty claim holds while the clock is materially correct, and section 1 states what is and is not promised when it is
  not.

  ## 8. Local authority, CI and multiple machines

  Interactive trust changes use local administrator/Human Gate authority. Repository gate records remain requests.
  Headless CI and additional machines are provisioned outside the project repository with the verifier, public root
  metadata and protected machine/workload policy. Ephemeral runners verify their pinned release and obtain current
  metadata before privileged lifecycle work. Persistent machines maintain protected local high-water. Environment
  variables, repository files and caller/model/plugin claims cannot manufacture trust or approval.

  ## 9. Project, plugin and retrieval boundaries

  A project may pin the authenticated release identity it requires and may strengthen protected policy floors. It cannot
  establish or weaken the distribution root. Plugins and retrieval profiles remain governed executables: their bytes and
  descriptor identity are bound through kernel-owned registration/policy and may additionally be distributed through
  delegated signed targets. Descriptors cannot self-authorise. Gate W, G0-G6 and the Development Knowledge Fabric are
  unchanged product capabilities.

  ## 10. Assurance separation

  R0 accepts this architecture and its stated assumptions. R1 tests an exact implementation candidate. R2 certifies an
  exact standard release. R3 optionally evaluates reproducible-build quorum, DDC/diverse bootstrap, multiple first-contact
  sources, supplier independence and enhanced ceremonies. Build provenance and certification evidence inform release
  eligibility but do not replace release signatures as the client distribution root.

  ## 11. D-0007 and CP-1 transition

  D-0007 remains ACTIVE through R0 and transition. Its trust-direction, policy-precedence, Human Gate, plugin/exception,
  post-install integrity and typed-refusal rules are preserved. Its manifest/lock cannot establish first-install
  authenticity. D-0008, ARCH-0002 and RoT-1 revisions 1-7 are retained unchanged as historical/high-assurance research,
  not incorporated by reference as Phase-1 requirements.

  ## 12. R0 review object

  The R0 reviewer evaluates this record together with D-0009 and the frozen acceptance boundary in
  release/root-of-trust/signed-release-root-v1/. R0 acceptance does not activate implementation. A blocking finding must
  trace to a matching R0 normative source and lifecycle; stronger assurance proposals are non-blocking until owner-adopted.

  ## 13. Non-goals

  No RoT-1 Revision 8; no universal mutable Trust State; no bespoke first-install admitter; no C0-C3 calculus; no complete
  selector/establishing-party register; no R0 DDC, supplier-diversity or reproduction quorum; no public/cloud hostile-admin
  assurance; no redesign of unrelated Governance OS capabilities.
