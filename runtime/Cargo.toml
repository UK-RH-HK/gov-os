[package]
name = "gov-runtime"
description = "Governance OS deterministic core: kernel, lock, policies, repository contract, Development Knowledge Fabric, orchestration, CIT, adoption/migration/update, release and upstream export gate"
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[lib]
name = "gov_runtime"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
rusqlite.workspace = true
sha2.workspace = true
regex.workspace = true
walkdir.workspace = true
chrono.workspace = true
uuid.workspace = true
jsonschema.workspace = true
thiserror.workspace = true
anyhow.workspace = true
libc = "0.2"
ed25519-dalek.workspace = true
hex.workspace = true

[dev-dependencies]
# TEST MATERIAL ONLY: signing capability for unit-test fixtures. `gov` itself never signs.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
