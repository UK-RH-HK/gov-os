[workspace]
members = ["runtime", "cli"]
resolver = "2"

[workspace.package]
version = "4.1.6"
edition = "2021"
license = "Proprietary"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
walkdir = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Signed Release Root v1 (ARCH-0003): mature, reviewed cryptographic implementation. Verification only in `gov`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
hex = "0.4"

[profile.release]
opt-level = 2
debug = false
strip = true

# IP-W7R3-10 (WS-7 round 3, optional; P2-AR-0043): debug builds hash every bound plugin file, T2 seal, manifest and
# pin with unoptimised sha2, about 20x slower than optimised. Optimising this one dependency in the dev profile changes
# no behaviour (the release profile is unchanged) and keeps the debug `gov` the certification suite drives usable.
[profile.dev.package.sha2]
opt-level = 3
