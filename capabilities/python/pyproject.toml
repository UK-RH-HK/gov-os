[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govos-capabilities"
version = "4.1.3"
description = "Polyglot capability plugins for the Governance OS (gov-capability/1 protocol): Python-AST code intelligence and reference embedder"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
govcap-python-ast = "govos_capabilities.code_intel_python_ast:main"
govcap-embed-hashed-ngram = "govos_capabilities.embedder_hashed_ngram:main"

[tool.setuptools]
packages = ["govos_capabilities"]
