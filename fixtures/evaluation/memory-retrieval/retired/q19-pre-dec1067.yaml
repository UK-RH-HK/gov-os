question: May an engineer write acceptance tests?
gold_answer: >-
  No. By MR-3 the builder never writes its own acceptance tests: a separate, freshly spawned independent test designer
  writes them from the KPIs before implementation, and the guard refuses an engineer tests/acceptance/**.
