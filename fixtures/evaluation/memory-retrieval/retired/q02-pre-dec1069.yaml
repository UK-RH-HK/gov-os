id: Q02
category: decision
commit: 23079f92a6fa
question: Which decision lets a read command write the query-vector cache?
gold_answer: >-
  DEC-782: a read command may write the query-vector cache (.gov-runtime/query-vectors.db), and only that file,
  under limits; DEC-379's "a read writes nothing" is amended for that one file.
