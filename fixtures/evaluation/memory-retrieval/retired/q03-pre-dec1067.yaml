# which DEC-1033 replaced on 2026-11-02 (commit 75f18d1118c7), so it rewarded a replaced decision. Lens B's original
# and its past scores are kept in ../retired/ (q03-lens-b.yaml, README.md); the measure never reads that folder.
# The three sources state the same rule, so they are alternatives of one entry, as the original's were: the
# register's DEC-1033 entry (the rule and why), semantic.py's docstring lines on the question's vector (the rule, its
# reason, the chunks on the shared runner; query_vector and _device carry it out) and ollama.py's on the two daemons
# (the query daemon started with the GPU visible; ensure_query_available carries it out). Category kept: the answer
# is a decision.
id: Q03
category: decision
commit: acfea6d9d4ef
question: Where are query embeddings computed now, on which device, and why?
gold_answer: >-
  By gov's own query embedder, the Ollama daemon at GOV_QUERY_OLLAMA_HOST (127.0.0.1:11435 by default), which embeds
  the questions and nothing else; the shared runner at OLLAMA_HOST still builds the index. Since DEC-1033 (2026-11-02,
  replacing DEC-798's CPU-only rule) that daemon is started with the GPU visible (no CUDA_VISIBLE_DEVICES=-1), and a
  question's vector is used from whichever device computed it, CPU or GPU, provided the embedder reports the model
  loaded after computing it and the vectors are well-formed; the query-vector cache keys by that device. Why: the
  CPU-only rule dropped a question's vector unless the query server was wholly on the CPU (the W2-123 lead's finding,
  so ACT-QUERY-GPU-1 was not applied) and the machine had no room for the fixes; the owner accepted the GPU's drift
  (a vector that can depend on the prompt computed just before it, DEC-773) on the evidence that it changed no answer
  of the standing memory measure.
