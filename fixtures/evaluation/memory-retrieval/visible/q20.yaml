id: Q20
category: policy
commit: 23079f92a6fa
question: How does a session resume after compaction?
gold_answer: >-
  From its structured checkpoint (CAP-37): the PreCompact hook writes a current checkpoint, and on compact, clear and
  resume the SessionStart hook injects the context packet's brief and the checkpoint's resume brief (its next action
  and inputs), and for the orchestrator the prompt path and the RESUME HERE section, within its size cap.
