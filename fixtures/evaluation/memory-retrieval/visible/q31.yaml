question: "What must a question for the owner contain, and how many can I send at once?"
gold_answer: >-
  A decision package in the active chat with MR-6's eight fields: question, why now, options, impact, reversibility,
  cost, recommendation and confidence (the template carries ten). Packages are ranked P1 to P3 and sent at most five
  at a time; a P1 may bypass the cap (MR-6 in the Charter and the Contract; DEC-093).
