id: Q04
category: contract
commit: cc9c94d42a54
question: What is the token ceiling of a context packet?
gold_answer: >-
  About 6,000 tokens: by the Contract (CAP-15, and its envelope's "Context packet ≤ ~6k tokens") the packet stays
  under the configured ceiling, default ~6k tokens, and is delivered as a file path plus a summary of at most ~2.5k
  tokens; the code's default is DEFAULT_BUDGET = 6000.
