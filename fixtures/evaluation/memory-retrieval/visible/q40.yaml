commit: cc9c94d42a54
question: "Can a Gov OS release version be built again from a different commit?"
gold_answer: >-
  No. A release is immutable (CAP-43): gov release never builds again a version the repository already knows, from a
  record in the tree, any ref's history or a tag, build metadata aside.
