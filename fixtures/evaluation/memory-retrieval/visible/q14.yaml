ticket: DAEO-ym8a
radius: 1
question: Before W2-03 could close, what did it have to show about how decisions get hashed, including when one is edited?
gold_answer: >-
  Each `### DEC-nnn` entry of the register is loaded as a record by itself, with a sha256 taken over that entry's
  span only, so no two decisions ever have the same hash; and editing one entry changes that entry's hash and no
  other (the same failure line also requires a duplicate DEC id to be refused, naming both places).
