question: "By default, how long may a store rebuild run before it counts as slow, and how often is its record rewritten after that?"
gold_answer: >-
  1800 seconds by default (slow_after_s, which the tree's governance/project/rebuild.yaml may set); past it the
  watchdog flags the rebuild slow and writes its record at once, then at least every 30 seconds
  (src/gov/rebuild/watch.py: SLOW_AFTER_S = 1800, EVERY_S = 30.0).
