# Lens B's Q18 (Table 2): "DEC-444; precompact.py; record.py". My reading: two pieces. (1) Where automatic
# checkpoints go: DEC-444 or record.py's SCRATCH_CHECKPOINTS_REL, alternatives. (2) That the PreCompact hook writes an
# automatic one: precompact.py's call with dest="automatic".
id: Q18
category: policy
commit: 23079f92a6fa
question: Where does the PreCompact hook write its automatic checkpoint?
gold_answer: >-
  Under .gov-runtime/scratch/checkpoints/<ticket>/CP-<ticket>-<number>.md, the ignored scratch folder (DEC-444): the
  hook calls gov.checkpoint.record.write with trigger "compaction" and dest="automatic".
