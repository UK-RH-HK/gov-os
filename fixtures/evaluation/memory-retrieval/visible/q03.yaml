# unchanged in ../retired/ (q03-pre-dec1067.yaml, README.md), as lens B's original is (q03-lens-b.yaml); the measure
# never reads that folder.
# Why: the gold answer said a question's vector is used from whichever device computed it, CPU or GPU (DEC-1033 (2)
# (b), "accepted from any device"). DEC-1065 (1) (2026-11-03, no CPU fallback for embeddings, anywhere), carried out
# by W2-32 S10 and merged at b32e8504, makes the GPU the only device: a vector computed on the CPU is refused, never
# cached or stored, and gov never starts an embedder for a search. So the answer was wrong today, and DEC-1033's
# entry, which states "any device", is no longer gold. The question is kept: it is answerable as asked.
# Split into two entries by the owner's DEC-1069 (3) (2026-11-04; the audit's R7-PARTIAL-ALTERNATIVE), checked
# blind at the commit by a session independent of the retrieval work. The label had one entry of four alternatives,
# but no single one held all three asked facts: DEC-1065's entry names no host, and W2-32's S10 line gives neither
# where nor why. So a hit on either was scored as full evidence for an answer it cannot give. The question and the
# gold answer are kept. (1) Where: ollama.py's docstring (the query daemon at GOV_QUERY_OLLAMA_HOST, which embeds the
# questions and nothing else; the shared one builds the index) or semantic.py's lines on the question's vector (the
# query embedder at ollama.query_host()). (2) The device and why: DEC-1065's entry (no CPU fallback, anywhere; its
# basis: a private CPU embedder skews the measures and loads the machine), the governing source, or semantic.py's
# lines (the GPU only, the drift accepted and why). S10's line is left out: it states the device part without the why,
# so it is not a whole entry. It is not needed as a third, because the governing entry holds the rule. The label before
# is in ../retired/q03-pre-dec1069.yaml. Category kept: the answer is a decision.
id: Q03
category: decision
commit: cc9c94d42a54
question: Where are query embeddings computed now, on which device, and why?
gold_answer: >-
  By gov's own query embedder, the Ollama daemon at GOV_QUERY_OLLAMA_HOST (127.0.0.1:11435 by default), which embeds
  the questions and nothing else; the shared runner at OLLAMA_HOST builds the index. On the GPU only: since DEC-1065
  (1) (2026-11-03, no CPU fallback for embeddings, anywhere; W2-32 S10), which replaced DEC-1033's "any device", a
  question's vector is used only when the embedder reports the model loaded on the GPU after computing it and the
  vectors are well-formed; a vector computed on the CPU is refused (EMBEDDER_ON_CPU), never cached or stored, and the
  query-vector cache keys by the device. gov never starts an embedder for a search: when the shared GPU embedders
  cannot be reached (the launch sandbox included) the semantic part is reported unavailable (EMBEDDER_UNAVAILABLE)
  and the search answers by keywords; only an explicit restart of the shared servers starts the query daemon, with
  the GPU visible. Why: DEC-1033 (2026-11-02) had replaced DEC-798's CPU-only rule, which dropped a question's
  vector unless the query server was wholly on the CPU, and the owner accepted the GPU's drift (a vector can depend
  on the prompt computed just before it, DEC-773) on the evidence that it changed no answer of the standing memory
  measure; DEC-1065 then ruled the CPU out, because a private CPU embedder skews the measures and loads the machine.
