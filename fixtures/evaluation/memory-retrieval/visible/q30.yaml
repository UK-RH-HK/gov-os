category: ticket
commit: cc9c94d42a54
question: "Which ticket made a rebuild remember gitleaks' clean verdicts, and where is that record kept?"
gold_answer: >-
  W2-107 (DAEO-kiar), "Rebuild speed: gitleaks results remembered by content hash, so a rebuild scans only new or
  changed files". The record is one machine-wide cache outside every repository, ~/.cache/gov-os/secrets-scan.sqlite,
  shared by worktrees, close clones and the nightly, keyed by the sha256 of the bytes scanned, the kind and the
  engine's fingerprint.
