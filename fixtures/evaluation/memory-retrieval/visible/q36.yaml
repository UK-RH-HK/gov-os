question: "When the orchestrator's review finds a case my acceptance tests miss, how does it reach me and what do I do with it?"
gold_answer: >-
  As a described behaviour, never as code (DEC-136): the test designer decides from the specification whether it
  becomes an acceptance test, and reports a finding that reveals a specification gap to the orchestrator, so the
  specification can be amended.
