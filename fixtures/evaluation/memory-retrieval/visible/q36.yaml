question: "A reviewer found a behaviour that no acceptance test covers. How is it handed to the test designer, and what do I decide about it?"
gold_answer: >-
  It goes to the next test design batch as a described behaviour, never as code (CAP-38.e, DEC-136): the test designer
  decides from the specification whether it becomes an acceptance test, and reports a finding that reveals a
  specification gap.
