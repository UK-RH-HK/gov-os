question: "What did the Phase 2 rule against review-repair snowballs require before code changed for a finding?"
gold_answer: >-
  The finding went through whole-system retrieval or a context pack, then a fresh architecture or root-cause synthesis
  that classified the response as exactly one of six dispositions: REPAIR EXISTING MECHANISM, REUSE EXISTING
  PRIMITIVE, DELETE MECHANISM, NARROW REQUIREMENT, DEFER TO LATER LIFECYCLE or OWNER DECISION; only after one
  disposition was chosen could Phase 2's product code change (L-0077, the anti-snowball rule). The rule is still in
  force as the Contract's CAP-59.c: a finding goes through whole-system context to one disposition before code.
