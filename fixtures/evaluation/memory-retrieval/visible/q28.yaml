question: "In the Wave 2 triage, what is the difference between a row named in a ticket's KPIs and one that fits its paths and KPIs?"
gold_answer: >-
  "Named in W2-xx's KPIs" means the ticket card cites the row; "fits W2-xx's paths and KPIs" means the row lies inside
  that ticket's allowed paths and subject, so its builder takes it in the same round and the test designer may cite it
  (WAVE_2_TRIAGE.md, "How to read it").
