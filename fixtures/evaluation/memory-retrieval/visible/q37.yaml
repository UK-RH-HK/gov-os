question: "A finding contradicts a closed specification: what do I put to the owner?"
gold_answer: >-
  A CIT-P whose impact assessment gives three costed options, apply now, defer or re-baseline; the owner chooses,
  CIT-E records what was done, and every version of the specification is kept (CAP-33.e, DEC-105).
