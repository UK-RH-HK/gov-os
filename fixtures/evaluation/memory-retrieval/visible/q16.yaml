id: Q16
category: decision
commit: 03df21248e36
question: How much free memory must the resource gate see before it launches a new lead?
gold_answer: >-
  No fixed figure any more: DEC-798's MemAvailable of 4 GiB plus 2.4 GB is superseded (DEC-942 replaced its fixed
  figures with a measured gate; DEC-1033 replaced DEC-798). The gate opens on memory while MemAvailable plus what the
  running leads already hold is at least the floor (3 GiB, DEC-947 item 5; put back to 6.4 GiB at once if available
  memory falls below 2 GiB or an out-of-memory kill appears) plus each running lead at what it uses (at least its
  measured working size) plus a working size for the new one; nothing is set aside for a full test run that has not
  started (DEC-961 item 1: a full run checks the gate for its own measured peak when it starts).
sources:
  - - path: docs/DECISION_REGISTER.md
      heading: "  1. **No memory is set aside for a full test run** (the 7.4 GiB verification peak). The gate counts the floor, each running lead at what it uses (at least its working size) and the newcomer. A full run (a close's, the nightly's, a lead's) gets its place like anything else: it checks the gate before it starts (`gate_check.py --full-run`, room for its own measured peak) and waits until there is room. The floor and the out-of-memory trip-wire stay as they are."
