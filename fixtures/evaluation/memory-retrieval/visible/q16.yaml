id: Q16
category: decision
commit: 23079f92a6fa
question: How much free memory must the resource gate see before a heavy run?
gold_answer: >-
  MemAvailable of at least 4 GiB plus 2.4 GB while the CPU embedder is not loaded: DEC-798 item 4 counts the CPU
  embedder's 2.4 GB as standing memory on top of DEC-742's 4 GiB.
sources:
