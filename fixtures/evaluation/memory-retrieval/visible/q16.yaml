# Why: its one source was DEC-798 item 4 (MemAvailable of at least 4 GiB plus 2.4 GB), and DEC-798 is SUPERSEDED by
# DEC-1033. Its fixed gate figures had already been replaced by DEC-942 item 2's measured gate, and the CPU embedder
# whose 2.4 GB it counted no longer exists in that form. A superseded decision is never the gold. The old question
# ("before a heavy run") is not answerable as asked today: a heavy job (a test run, a rebuild) takes one of the
