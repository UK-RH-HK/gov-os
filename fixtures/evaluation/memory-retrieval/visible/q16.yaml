# (DEC-942 lists it as the launch gate's "fixed gate figures"). So the question names that gate's admission of a new
# lead, as q03 named DEC-1033's rule.
# Two pieces: the rule is DEC-961 item 1 (the governing source; it replaced DEC-947's reserved verification peak and
# DEC-960), restated for the product's gate by W2-20's KPI line, so the two are alternatives of one entry; the floor's
# figure is DEC-947 item 5, which DEC-961 keeps ("the floor and the out-of-memory trip-wire stay as they are").
# Left out: DEC-942 and DEC-947's items 1-2 and "How it is applied" (they reserve the verification peak, changed by
# DEC-961), DEC-960 (superseded), the w2 prompt's resource-gate line (a working copy; it still gives the 6,710,886 kB
# floor DEC-947 item 5 replaced) and the CTO's dispatcher README (a tool's document: its Load Balancer forecast, row
