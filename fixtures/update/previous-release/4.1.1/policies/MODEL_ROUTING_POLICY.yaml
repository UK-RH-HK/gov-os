policy: MODEL_ROUTING_POLICY
version: 1.0.0
tiers:
  T0: {name: deterministic, description: "no LLM: SQL, graph, AST, parsing, validation, tests, generation"}
  T1: {name: lightweight, description: "classification, extraction, formatting, routine small edits"}
  T2: {name: strong-engineering, description: "normal implementation, debugging, integration, substantial test work"}
  T3: {name: frontier, description: "orchestration, major architecture, difficult R&D, high-impact refactor, critical security, governance evolution, independent final audit"}
reasoning_levels: [low, medium, high, extra_high]
task_class_minimum_tier:
  discovery: T2
  research: T2
  experiment: T2
  specification: T2
  decision-preparation: T3
  data: T1
  architecture: T3
  implementation: T2
  integration: T2
  test-design: T2
  test-execution: T1
  security: T3
  devops: T2
  performance: T2
  validation: T1
  refactor: T2
  repair: T2
  documentation: T1
  release: T2
  tooling: T2
  memory: T3
  governance: T3
  migration: T3
radius_minimum_tier: {R0: T1, R1: T1, R2: T2, R3: T2, R4: T3, R5: T3}
record_evidence: [model, provider, task_class, reasoning_effort, cost, latency, pass_fail, repair_count, reviewer_findings]
