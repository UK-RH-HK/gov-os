id: SKL-RESEARCH-BENCHMARK
name: Research benchmark
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [research-agent]
task_classes: [research, experiment]
purpose: "Turn a research question into measured evidence with recorded uncertainty and confidence."
required_permissions: [READ_REPO, NETWORK_READ]
required_tools: [TOOL-FS-001]
inputs: [question]
outputs: [research record with measurements]
method:
  - {step: frame, description: Record question, reason and method before measuring.}
  - {step: measure, description: Collect measurements with provenance.}
  - {step: conclude, description: Record conclusion, uncertainty, confidence and influenced decisions/tasks.}
validation_scenarios:
  - {id: V1, given: research record without method, expect: schema validation fails}
