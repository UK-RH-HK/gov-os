id: SKL-TOOL-INSTALL
name: Tool installation
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [tooling-engineer]
task_classes: [tooling]
purpose: "Resolve a missing capability by installing and registering a tool only when all TOOL_POLICY conditions hold."
required_permissions: [READ_REPO, PACKAGE_INSTALL]
required_tools: [TOOL-FS-001]
inputs: [capability request]
outputs: [registered tool, health result, capability memory update]
method:
  - {step: search, description: Search approved capabilities first.}
  - {step: evaluate, description: Evaluate security, licence, maintenance and cost; choose a reversible option.}
  - {step: conditions, description: Check all auto-install conditions; otherwise raise a Human Decision Gate.}
  - {step: register, description: Pin version, register tool, run health check, update capability memory.}
validation_scenarios:
  - {id: V1, given: unapproved licence, expect: human gate raised and no install}
