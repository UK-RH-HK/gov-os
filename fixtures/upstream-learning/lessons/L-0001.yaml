id: L-0001
type: lesson
title: Task close must fail when the index is stale
status: ACTIVE
state_class: EVIDENCE
created: "2026-09-01"
scope: FRAMEWORK
lifecycle: corroborated
category: memory-freshness
problem_statement: Agents closed tasks while the derived index lagged the repository, so the next agent retrieved outdated evidence.
generic_failure_mode: Index freshness was advisory rather than enforced at task-close time.
impact: Retrieval cited superseded artefacts in two consecutive sessions.
evidence_strength: high
suggested_change: Make MEMORY_POLICY.freshness.on_stale_close default to fail and surface stale artefacts in the error.
sources: [RPT-0003, RPT-0005]
synthetic_reproducer:
  synthetic: true
  description: Minimal repository where a record changes after indexing and a close is attempted.
  files:
    scenario.yaml: |
      steps:
        - gov rebuild-memory
        - edit spec/tasks/TASK-0001.yaml
        - gov task close TASK-0001 --report report.json   # expect INDEX_STALE
