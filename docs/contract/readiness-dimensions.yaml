# Readiness dimensions — the definition Wave 1's OpenSpec feature-readiness schema implements.
id: READINESS-DIMENSIONS
version: 1
status: PROPOSED
source: Framework v4.1.2 §37 (names verbatim, order kept)
decisions:
- DEC-064
- DEC-065
- DEC-085
cell_states:
- state: PRESENT
  meaning: settled; cites its evidence (decision id or document section)
  satisfies: true
- state: MISSING
  meaning: no answer yet
  satisfies: false
- state: PROVISIONAL
  meaning: an answer exists but rests on an unaccepted source
  satisfies: false
- state: BLOCKED
  meaning: cannot be answered until a named dependency resolves
  satisfies: false
- state: N/A_WITH_REASON
  meaning: does not apply; the reason is written by an agent and must be non-empty
  satisfies: true
  requires:
  - reason
rules:
  silent_na: invalid — a cell may not be empty, and N/A is only N/A_WITH_REASON with a non-empty reason (MR-1)
  defaulted_na: forbidden — no cell is filled automatically (DEC-085)
  evidence: every PRESENT cell cites at least one decision id or document section
  not_required_rows: a row a profile does not require may stay MISSING without blocking closure
  spine: a spine specification always closes at FULL, whatever the profile of the change that opens it (DEC-085)
  closed: a specification is closed when every row its profile requires is PRESENT or N/A_WITH_REASON (MR-1)
  ready_gate: no production ticket is READY while its specification is not closed (MR-2)
  gap_tickets: every required open row has a linked gap ticket (discovery, data, research or test-design); gov check fails
    an unlinked one (DEC-089)
  audit_on_close: closing a spine, STANDARD or FULL feature specification creates an audit ticket for a fresh Independent
    Auditor; LITE feature specifications are audited at the wave exit (DEC-088)
