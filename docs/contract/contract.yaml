envelope:
  scale_envelope:
    decision: DEC-078
    statement: Tested up to ≈ 80k nodes / 270k edges of code graph at ≈ 2.2 GB peak RSS for codebase-memory-mcp; larger graphs
      are measured before adoption. Memory scales with graph edges, not file count. Each project in a multi-project folder
      gets its own index.
  ram_budget:
    decision: DEC-078
    statement: Worst case ≈ 12.5 GB of the 15.5 GiB host (IDE + local models + a full index run), leaving ≈ 2.5 GiB spare;
      incremental updates are far smaller. The stack runs with one on-demand daemon (Ollama, 5-min idle unload), no Docker,
      VRAM peak ≈ 5.2 of 16 GiB.
  token_budget:
    decision:
    - DEC-004
    - DEC-086
    statement: Governance tokens ≤ 10–15 % of a ticket's fresh input + output tokens (the Wave 1 exit bound is 15 %). Governance
      tokens = text the Gov OS injects or returns (instruction files, SessionStart packet, hook output, `gov` output, governance
      MCP tool definitions, checkpoint and close records), counted by `gov`; the denominator comes from ccusage. Cache reads
      are reported separately. Context packet ≤ ~6k tokens; SessionStart injection ≤ ~2.5k tokens plus a file path; AGENTS.md
      ≤ ~1.5k tokens. A breach is a health finding, never a silent cost.
  boundary:
    decision:
    - DEC-039
    - DEC-075
    - DEC-087
    - DEC-152
    - DEC-156
    - DEC-161
    statement: 'Hooks are guardrails. The boundary is git history, the lefthook pre-push gate G3 on the owner''s machine,
      GitHub Actions CI G4–G5 as an advisory result on every push (deterministic checks only; model-dependent tests run at
      G3 and leave an evidence record bound to the head commit that CI checks), and the rule that only the owner merges, and
      only on green. `main` is not protected; enabling protection later changes no other decision. Containment has two guardrail
      layers, neither of them a security boundary: in a worker session started by the launcher the OS sandbox is the outer
      wall for everything a Bash command does (writes outside the repository, installs, network, reads of hidden paths), and
      the guard with the permission rules is the wall for the file tools (Read, Edit, Write), which run outside the sandbox;
      the orchestrator''s own session is not sandboxed and runs under the guard alone (DEC-152, DEC-156, DEC-161).'
  loop_budget:
    decision:
    - DEC-044
    - DEC-096
    statement: 'Any loop that runs until convergence (review→repair, audit→repair, test→fix, verification) continues until
      it converges or until three consecutive iterations fail to converge; the third failure produces an escalation package
      for the owner (each iteration''s outcome, why it is not converging, options: fix differently, narrow, split, defer,
      delete, continue), and the owner decides. The iteration count and budget are held by the orchestrator or gov and never
      disclosed to the sessions inside the loop. Retrieval stopping rules are unchanged (DEC-034, DEC-080).'
  tool_installs:
    decision:
    - DEC-083
    - DEC-157
    - DEC-163
    statement: 'The orchestrator installs a tool only after the owner approves a decision package in chat (tool, exact version,
      source and checksum, need, disk and RAM, uninstall command), and records it in the tool registry; install commands are
      `ask` for the orchestrator and denied for every other role; `sudo` stays with the owner. Worker roles never install system-wide. The research role is the one exception to the denial: it may install only into a venv or local prefix inside its own experiment folder, within its ticket''s `allowed_paths`, and the sandbox''s write fence enforces this (DEC-157, DEC-158, DEC-163).'
