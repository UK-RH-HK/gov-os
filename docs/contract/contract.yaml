envelope:
  scale_envelope:
    decision: DEC-078
    statement: Tested up to ≈ 80k nodes / 270k edges of code graph at ≈ 2.2 GB peak RSS for codebase-memory-mcp; larger graphs
      are measured before adoption. Memory scales with graph edges, not file count. Each project in a multi-project folder
      gets its own index.
  ram_budget:
    decision:
    - DEC-078
    - DEC-1065
    - DEC-1211
    statement: Worst case ≈ 12.5 GB of the 15.5 GiB host (IDE + local models + a full index run), leaving ≈ 2.5 GiB spare;
      incremental updates are far smaller. The stack runs with one on-demand daemon (Ollama, 5-min idle unload), no Docker,
      VRAM peak ≈ 5.2 of 16 GiB. Embedders and rerankers stay resident on the GPU and never spill to the CPU (RT-4); there
      is no CPU fallback (DEC-1065). Slots come from the CPU, RAM and GPU the run-time tool detects at start, with no machine-specific
      constant (RT-3).
  token_budget:
    decision:
    - DEC-004
    - DEC-086
    - DEC-1211
    - DEC-1214
    statement: 'Governance tokens ≤ 15 % of a ticket''s fresh input + output tokens, reported weekly with its baseline (56
      % before EMERGENCY-2) by P1''s method until `gov telemetry` measures it (EMERGENCY-2 §10.2, A-7). Governance tokens
      = text the Gov OS injects or returns (instruction files, the brief, hook output, `gov` output, governance MCP tool definitions,
      checkpoint and close records), counted by `gov`; the denominator comes from ccusage. Cache reads are reported separately.
      AGENTS.md ≤ ~1.5k tokens. There is no context packet and no packet ceiling anywhere: `gov context` is retired (DEC-1214
      M1), and the brief carries the ticket''s retrieval uncut. A breach is a health finding, never a silent cost.'
  boundary:
    decision:
    - DEC-039
    - DEC-075
    - DEC-087
    - DEC-848
    - DEC-1211
    statement: No guard, no sandbox, no box and no permission prompts (EMERGENCY-2 §2). Agents have full permission in the
      repository, the worktree and the run folder they work in; sessions stay apart by where each starts, the folders it is
      given and its brief, and nothing enforces it. Mistakes are caught and corrected at the landing and by the transcript
      scan, not prevented. The hard boundary is git history; the owner's own `git push` and release from his own terminal;
      two settings deny lines, `git push` and `sudo`, which hold in every permission mode; and an hourly `git bundle` of each
      repository, kept outside the tree. The landing merges into integration and only the owner pushes. The lefthook pre-push
      gate G3 on the owner's machine and GitHub Actions CI G4–G5 stay as an advisory result on every push (deterministic checks
      only; model-dependent tests run at G3 and leave an evidence record bound to the head commit that CI checks). `main`
      is not protected; enabling protection later changes no other decision.
  loop_budget:
    decision:
    - DEC-044
    - DEC-096
    - DEC-1204
    - DEC-1211
    statement: 'Any loop that runs until convergence (review→repair, audit→repair, test→fix, verification) runs at most two
      rounds; if the second does not converge there is one escalation package for the owner (each round''s outcome, why it
      is not converging, options: fix differently, narrow, split, defer, delete, continue), and the owner decides once. READY
      is computed by code from the reviewers'' verdict blocks. The round count and budget are held by the orchestrator or
      gov and never disclosed to the sessions inside the loop. Retrieval stopping rules are unchanged (DEC-034, DEC-080).'
  tool_installs:
    decision:
    - DEC-083
    - DEC-157
    - DEC-163
    - DEC-1214
    statement: The CTO approves and records every install in the tool registry (tool, exact version, source and checksum,
      need, disk and RAM, uninstall command), so that nothing out of the work's scope or beyond the machine's capacity is
      installed; there is no permission prompt, and `sudo` stays with the owner (DEC-1214 G7 (c)). Worker roles never install
      system-wide.
