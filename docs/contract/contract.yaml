# Contract v4 — machine-readable. Same content as CONTRACT_v4.md.
id: CONTRACT-v4
status: PROPOSED
date: '2026-09-30'
supersedes: Governance_OS_Capability_Acceptance_Contract_v3 (kept unchanged as provenance, DEC-058)
precedence: Charter v5 → Contract v4 → ADRs → everything else; ADRs supersede the originals where they conflict
waves:
  W1: Integrate
  W2: Strengthen
  W3: Complete
  NONE: dropped (non-goal)
dispositions:
  KEPT: delivered in full
  LITE: delivered in the stated lite form (DEC-074 Q11, DEC-083)
  DROP: non-goal, with its decision
envelope:
  scale_envelope:
    decision: DEC-078
    statement: Tested up to ≈ 80k nodes / 270k edges of code graph at ≈ 2.2 GB peak RSS for codebase-memory-mcp; larger graphs
      are measured before adoption. Memory scales with graph edges, not file count. Each project in a multi-project folder
      gets its own index.
  ram_budget:
    decision: DEC-078
    statement: Worst case ≈ 12.5 GB of the 15.5 GiB host (IDE + local models + a full index run), leaving ≈ 2.5 GiB spare;
      incremental updates are far smaller. The stack runs with one on-demand daemon (Ollama, 5-min idle unload), no Docker,
      VRAM peak ≈ 5.2 of 16 GiB.
  token_budget:
    decision:
    - DEC-004
    - DEC-086
    statement: Governance tokens ≤ 10–15 % of a ticket's fresh input + output tokens (the Wave 1 exit bound is 15 %). Governance
      tokens = text the Gov OS injects or returns (instruction files, SessionStart packet, hook output, `gov` output, governance
      MCP tool definitions, checkpoint and close records), counted by `gov`; the denominator comes from ccusage. Cache reads
      are reported separately. Context packet ≤ ~6k tokens; SessionStart injection ≤ ~2.5k tokens plus a file path; AGENTS.md
      ≤ ~1.5k tokens. A breach is a health finding, never a silent cost.
  boundary:
    decision:
    - DEC-039
    - DEC-075
    - DEC-087
    statement: Hooks are guardrails. The boundary is git history, the lefthook pre-push gate G3 on the owner's machine, GitHub
      Actions CI G4–G5 as an advisory result on every push (deterministic checks only; model-dependent tests run at G3 and
      leave an evidence record bound to the head commit that CI checks), and the rule that only the owner merges, and only
      on green. `main` is not protected; enabling protection later changes no other decision.
  loop_budget:
    decision: DEC-044
    statement: At most two review→repair rounds per surface; then DELETE, NARROW or DEFER unless an owner ADR says otherwise.
  tool_installs:
    decision: DEC-083
    statement: The orchestrator installs a tool only after the owner approves a decision package in chat (tool, exact version,
      source and checksum, need, disk and RAM, uninstall command), and records it in the tool registry; install commands are
      `ask` for the orchestrator and denied for every other role; `sudo` stays with the owner.
