  title: Specification comes first
  text_source: architecture v0.3 §1A (verbatim in Charter v5 §4)
  acceptance: 'A production ticket whose specification has a required readiness cell open for its profile (FULL for a spine)
    cannot reach READY: `tk ready` does not list it and `gov readiness` names the open cells; an N/A without a reason is rejected.'
  provider:
  - W1-12
