  text_source: architecture v0.3 §1A (verbatim in Charter v5 §4)
  acceptance: A closed specification produces tickets with class, role, depends_on, allowed_paths, KPIs and profile, and `gov
    check` fails a ticket missing any of them; from W2 every required open cell yields a ticket.
