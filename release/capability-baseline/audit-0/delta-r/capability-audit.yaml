    - evidence/N3-N4-W9-watchdog-handoff.out N3.b1.5 FAIL (after 40 mutating gov commands the watchdog with no caller counters does not fire)
    gap: The watchdog runs only when invoked and trusts caller-supplied counters; nothing observes execution boundaries itself (A0-N3-01).
  - bullet: Can mark checkpoint stale when material state changed.
    source_line: 741
    status: ABSENT
    implementation_evidence:
