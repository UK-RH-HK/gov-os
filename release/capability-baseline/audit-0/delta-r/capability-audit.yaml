    weakening' through project policy (Contract v3 line 140); the overlay weakening of tier floors is neither refused nor reported (gov policy
    overrides shows nothing refused; suite silent), so that injected fault would pass undetected. The missing T0 route alone would not undermine
    qualification (cost only).
