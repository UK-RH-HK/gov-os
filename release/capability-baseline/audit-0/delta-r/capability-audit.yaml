- capability: L3
  title: Gate presentation
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:674
  governing_document_refs:
  - 'DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md Part XIV §52 Human questions must appear in the active chat (hard invariant:
    a gate that exists only in a file is not presented)'
  - spec/decisions/D-0007.yaml rule (2) (human_approved is a T1/T2 fact; a T5 field carrying it is a request)
  - spec/architecture/ARCH-0003.yaml §8 (repository gate records remain requests; caller/model claims cannot manufacture approval)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: 'Presented != answered is enforced (b3). The CIT path refuses declined, revoked, re-answered and other-CIT gates through
    the CLI. Everything else fails under attack: a human approval is recorded by any caller that omits --role (default orchestrator) or claims
    --role human / GOV_ROLE=human (b5, ABSENT); forged gate+decision files approve and execute a CIT, workers'' edits to those files are invisible
    to task mutation scope, and the suite does not notice; approvals are not bound to the transaction''s content or impact and can be re-bound
    to another CIT by editing the gate; task-blocking gates unblock on decline, withdrawal, revocation or a missing gate, and a task blocked by
    a PENDING gate can be closed DONE; presentation is self-attested by any L1 caller including --json and gov continue side effects (A0-L3-01..05).'
  na_reason_normative_text: null
  partial_qualification_impact: 'COULD_UNDERMINE — every qualification scenario that relies on a Human Decision Gate (V4 ''human-gate correctness'';
    CIT approvals; destructive migration and update gates) can be satisfied by the agent under test itself: the default CLI invocation records
    a human approval (L3.b5.1 and L3.b5.1x -> COMMITTED). No qualification result involving a human gate would be trustworthy.'
  bullets:
  - bullet: Gate in a file only is NOT presented.
    source_line: 675
    status: PARTIAL
    implementation_evidence:
    - runtime/src/orchestration/gates.rs:178-220 (present marks presented_in_chat=true for any L1+ caller, in --json too)
    - runtime/src/status.rs:114-123 (continue presents the top pending gate as a side effect)
    - 'runtime/src/orchestration/gates.rs:270-419 (answer: presentation check 297-304; kind ''human'' whenever --by is not a kernel agent role
      and the acting role is L3+ 345-351; unblock tasks for any option 400-415)'
    - 'runtime/src/orchestration/gates.rs:423-483 (revoke: does not re-block tasks)'
