    repo_b_challenge: 'Brownfield: legacy research notes adopted as spec/research records with conflicting benchmark numbers and no provenance;
      the oracle expects them to remain reference-only (framework §45 last line) until transformed, and expects every decision citing them to
      be traced.'
    hidden_oracle_fault_class: unsupported-research-conclusion; research-without-influence-trace; decision-before-evidence
    chaos_scale_soak: 'not relevant: research governance is record-level; scale does not change the defect class'
    retrieval_challenge: Unsupported research outranking a supported one in semantic retrieval for the decision's question; oracle expects the
      supported record (with measurements) to be preferred and the unsupported one flagged.
    not_challengeable: null
  adoption_obligation: gov init/adopt must classify existing research/benchmark notes as research records and report which lack the J1 fields;
