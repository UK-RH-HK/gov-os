  statement: 'Family-duty result: nothing marks a checkpoint stale — after the requirement a task checkpoint relied on is changed by a committed
    CIT and a new gate is raised, the checkpoint, gov status and gov doctor show no staleness. There is no checkpoint-freshness policy: a handoff
