  - capability: N3
    title: "Provider-independent checkpoint watchdog"
    source_ref: "Governance_OS_Capability_Acceptance_Contract_v3.md:739"
    governing_document_refs: ["framework Part XVI §60"]
    requirement_class: ORIGINAL
    status: PARTIAL
    status_justification: >-
      N3b1 (provider-independent) is fully met: the watchdog uses context_utilisation and operations_since_last
      thresholds from CHECKPOINT_POLICY, not proprietary hooks. Exercised with gov checkpoint watchdog.
      N3b2 (mark checkpoint stale) is partially met: checkpoints record index_manifest_hash for comparison,
      but there is no code path that explicitly marks an existing checkpoint as stale — staleness is implicit
      (new checkpoint supersedes old). N3b3 (block/degrade handoff/session close on stale checkpoints) is
      partially met: before_handoff creates a new checkpoint but does not check freshness of the prior one;
      session close blocking on stale checkpoints is not implemented in the runtime.
    na_reason_normative_text: null
    partial_qualification_impact: "CANNOT_UNDERMINE — the watchdog proactively creates fresh checkpoints at the right moments (utilisation/ops thresholds), and mandatory triggers (before_handoff) auto-create checkpoints; the gap is that stale checkpoints are not explicitly marked or checked, but the functional effect (fresh checkpoint before handoff) is present"
