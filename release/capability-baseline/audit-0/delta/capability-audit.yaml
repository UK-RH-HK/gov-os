      (2) Must surface in active human interface — present() marks presented_in_chat:true and renders
      the decision package text. (3) Presented != answered — gate moves to PRESENTED status, answer
      requires a separate decide command. (4) Declined/revoked/stale/other-CIT gates cannot authorise
      — authoritative_gate() validates gate belongs to the CIT, is ANSWERED with option A, is presented,
      and has an ACTIVE decision record; execution revalidates at use time. (5) Human approval cannot be
      fabricated by agent — agent_resolvable_when restricts agent answers to low-radius/high-confidence/
      reversible; approve() validates method vs by_kind; APPROVAL_METHOD_MISMATCH blocks --method human
      when answered by agent. All attacks exercised: unpresented gate blocked (GATE_NOT_PRESENTED);
      declined gate sets CIT to REJECTED; revoked gate returns CIT to SIMULATED; agent self-approval
      of high-radius gate refused (AUTHORITY_DENIED/UNKNOWN_ROLE).
