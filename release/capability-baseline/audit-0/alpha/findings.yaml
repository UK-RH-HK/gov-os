schema: governance-os.phase-2.findings
schema_version: 1
run_id: P2-AR-0001
findings:
  - id: A0-B2-01
    capability: [B2]
    bullet_source_lines: [192]
    severity: MEDIUM
    title: "Target action RENAME, SPLIT, MERGE not implemented in migration planner"
    statement: >
      B2 bullet 2 requires target actions KEEP/MOVE/RENAME/SPLIT/MERGE/EXTRACT/RETIRE/DELETE_FROM_ACTIVE_TREE.
      The migration planner (runtime/src/migrations/planner.rs) implements KEEP, MOVE, EXTRACT, RETIRE, and
      DELETE_FROM_ACTIVE_TREE but does not implement RENAME, SPLIT, or MERGE. Grep for these three tokens in
      planner.rs returns zero matches.
    normative_source: "Governance_OS_Capability_Acceptance_Contract_v3.md:192 'Target action supports KEEP/MOVE/RENAME/SPLIT/MERGE/EXTRACT/RETIRE/DELETE_FROM_ACTIVE_TREE'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: [AC-2, AC-3]
    blocking: false
    evidence: [evidence/B-repository-contract.out]
    reproduction: "grep -oE 'KEEP|MOVE|RENAME|SPLIT|MERGE|EXTRACT|RETIRE|DELETE_FROM_ACTIVE_TREE' runtime/src/migrations/planner.rs | sort | uniq"
    repair_direction: >
      The migration planner must support RENAME, SPLIT, and MERGE target actions, or the contract must be amended
      to remove them if they are not meaningfully applicable.
    owner_decision_required: true
    owner_decision_reason: >
      Whether RENAME/SPLIT/MERGE are genuinely required for the brownfield adoption scenario or whether MOVE +
      DELETE_FROM_ACTIVE_TREE are sufficient substitutes is a product-scope decision.

  - id: A0-T1-01
    capability: [T1]
    bullet_source_lines: [957]
    severity: LOW
    title: "No dedicated 'recovery agent' role in ROLES.yaml"
    statement: >
      T1 requires role separation for a 'recovery agent'. ROLES.yaml defines 27 roles but does not include a
      dedicated 'recovery-agent' role. Recovery operations (gov recover) are performed by the orchestrator (L4)
      or human (L5) roles. The functional capability is present but the role is not separately identified; the
      orchestrator subsumes the recovery function.
    normative_source: "Governance_OS_Capability_Acceptance_Contract_v3.md:957 '- [ ] recovery agent'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    evidence: [evidence/T-roles.out]
    reproduction: "grep -i 'recovery.agent' framework/roles/ROLES.yaml  # returns nothing"
    repair_direction: >
      Either add a dedicated 'recovery-agent' role to ROLES.yaml with appropriate authority level and
      session/context requirements, or clarify in the contract that recovery is a function of the orchestrator
      role rather than a separately identified role.
    owner_decision_required: false
    owner_decision_reason: null

  - id: A0-T1-02
    capability: [T1]
    bullet_source_lines: [958]
    severity: LOW
    title: "No dedicated 'adoption auditor/planner' role in ROLES.yaml"
    statement: >
      T1 requires role separation for an 'adoption auditor/planner'. ROLES.yaml does not include a dedicated
      role with this name. Adoption planning is performed by any session with sufficient authority (typically
      orchestrator). The adoption audit function (A11) is performed by the 'independent-auditor' role.
      The functional capability is present (A0-A4 are the planner stages, A11 is the audit stage) but the
      planner/auditor distinction is enforced via session separation rather than a named role.
    normative_source: "Governance_OS_Capability_Acceptance_Contract_v3.md:958 '- [ ] adoption auditor/planner'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    evidence: [evidence/T-roles.out]
    reproduction: "grep 'id:' framework/roles/ROLES.yaml  # no adoption-auditor or adoption-planner"
    repair_direction: >
      Optionally add dedicated adoption-planner and adoption-auditor role IDs, or document that these functions
      are performed by the orchestrator and independent-auditor roles respectively with session independence
      enforced between them.
    owner_decision_required: false
    owner_decision_reason: null

  - id: A0-A5-01
    capability: [A5]
    bullet_source_lines: [176]
    severity: INFO
    title: "ROLLBACK_TRANSACTION is not a first-class emergency command"
    statement: >
      A5 lists ROLLBACK_TRANSACTION as an emergency control. The product does not expose a standalone
      'gov rollback-transaction' emergency command. Instead, rollback is available via 'gov update --rollback'
      (framework update rollback) and CIT rollback (crate::cit::rollback). These are context-specific rollback
      mechanisms rather than a generic emergency transaction rollback command. The functional capability exists
      but the command surface differs from the bullet's naming.
    normative_source: "Governance_OS_Capability_Acceptance_Contract_v3.md:176 '- [ ] ROLLBACK_TRANSACTION'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    evidence: [evidence/A5-emergency-controls.out]
    reproduction: "target/release/gov --help  # no rollback-transaction subcommand; rollback is via update --rollback and cit rollback"
    repair_direction: >
      Either add a standalone emergency rollback-transaction command, or clarify that ROLLBACK_TRANSACTION is
      fulfilled by the existing context-specific rollback mechanisms.
    owner_decision_required: false
    owner_decision_reason: null
