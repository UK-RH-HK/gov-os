  - capability: A2
    title: "Authentic root of trust [POST-VERIFICATION HARDENING]"
    source_ref: "Governance_OS_Capability_Acceptance_Contract_v3.md:142"
    governing_document_refs: ["Framework v4.1.2 §§72-74", "ARCH-0003", "Release Protocol §§1-8"]
    requirement_class: POST_VERIFICATION_HARDENING
    status: PRESENT_AND_SUBSTANTIAL
    status_justification: >
      All ten bullets executably evidenced. R1 acceptance (AR-0033, ROT_PHASE1_CANDIDATE_ACCEPTED_R1) established
      the Signed Release Root architecture. Every lifecycle ingress (init, adopt, update, reinstall, recovery,
      rollback) passes through the single SRR verifier (crate::srr::admit). install_kernel takes the
      AuthenticatedRelease typed value (Rust type safety). Integrity and authenticity are separate controls.
      Kernel tampering is detected (demonstrated by modifying CONSTITUTION.md). framework.lock records identity
      without inventing it. SRR metadata supports root succession with versioned roles and threshold signatures.
      All verification is local.
    na_reason_normative_text: null
    partial_qualification_impact: null
    bullets:
      - bullet: "Release/source authenticity is established before any privileged kernel material is staged or installed."
        source_line: 143
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/init.rs:237 (srr::admit before install_kernel)", "runtime/src/adopt.rs (srr::admit before kernel install)", "runtime/src/update.rs:234 (srr::admit before install)"]
        automated_evidence: ["cargo test --test certification (srr family)"]
        independent_evidence: ["evidence/A2-root-of-trust.out: init output shows release_authenticity with ingress=init"]
        gap: null
      - bullet: "Integrity and authenticity are treated as separate properties."
        source_line: 144
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/srr/mod.rs (three predicates table: intact/authentic/admissible)", "runtime/src/kernel_trust.rs (integrity only)"]
        automated_evidence: ["cargo test --test certification"]
        independent_evidence: ["evidence/A2-root-of-trust.out: gov trust status shows separation: authentic/intact/admissible"]
        gap: null
      - bullet: "Init/adopt/update/reinstall/recovery/rollback ingress paths share a non-circular trust root."
        source_line: 145
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/srr/verifier.rs (single admit function for all ingresses)", "runtime/src/srr/state.rs (MachineState)"]
        automated_evidence: ["cargo test --test certification"]
