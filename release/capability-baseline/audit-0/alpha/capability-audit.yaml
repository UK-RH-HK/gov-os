      All six bullets executably evidenced. Constitution and hard invariants are machine-readable YAML/Markdown
      in governance/kernel/constitution/. POLICY_PRECEDENCE.yaml enforces floor, additive, immutable, ceiling,
      strengthen_only_bool, shrink_only and overridable modes. The audit suite's policy_precedence family detects
      and refuses weakening attempts (demonstrated: security classes and authority floors). Default mode is
      'immutable' (deny by default). Precedence layers are explicitly ordered from constitution down to
      retrieved/inferred context.
    na_reason_normative_text: null
    partial_qualification_impact: null
    bullets:
