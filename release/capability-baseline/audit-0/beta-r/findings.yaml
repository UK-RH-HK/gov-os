  title: Derived contract views carry none of the 123 beta checklist bullets and map no evidence owner
  statement: 'The compiled executable form (framework/contracts/governance-capability-acceptance.yaml, self-described as ''mechanically derived from the approved source headings'') carries only id/title/requirement_class/source_reference/family/status
    for C1–C10, D1–D6 and R1–R3; none of the 123 owner-source checklist bullets (Contract v3 lines 211–890) is represented. The evidence map lists all 19 capabilities as evidence_class NOT_YET_MAPPED with
    automated_checks: [], and the generated view carries no checklist items. `gov contract verify` nevertheless reports CONTRACT_SOURCE_BOUND. The runtime therefore cannot evaluate bullet-level acceptance
    for this family, and no suite-to-contract evidence owner is declared for any beta capability even though governance families (index_freshness, graph_integrity, memory_retrieval_regression, recovery_rebuild,
    fresh_agent_reconstruction, context_reproducibility, concurrency_claims) exercise parts of them. This is a derived-view finding; it records no gap in product behaviour for any single bullet.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:47 'Any semantic difference between source and compiled representation is a hard failure.'; :53-73 required fields per capability (evidence
    classes, automated check/test IDs, freshness triggers, G0–G6 tiers, challenge IDs); frozen gate contract AC-10, AC-13.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-10
  - AC-13
  blocking: true
  evidence:
  - evidence/DERIVED-views-reconciliation.out
  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 DERIVED-views-reconciliation.py
  repair_direction: The compiled form, evidence map and generated view must carry every owner-source checklist item of C1–C10, D1–D6, R1–R3 with the Contract v3:53-73 fields (evidence classes, check IDs,
    freshness triggers, tiers), and `gov contract verify` must fail while they do not.
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-C2-01
