  severity: HIGH
  title: CIT-E refreshes and verifies the index with the pre-mutation cached policy/path map
  statement: 'cit::execute applies the mutation manifest and then runs the index refresh and the index_freshness/graph_integrity verification with the same Project value whose policies/contract were cached
    (OnceCell) before the mutation; it never calls invalidate() (runtime/src/cit/mod.rs:813-1040; project.rs:30-36, 237-243). `gov memory select` does invalidate (benchmark.rs:183-185). Demonstrated: (a)
    a CIT pinning an unavailable embedder is COMMITTED with verification ok, after which freshness reports a pin mismatch, semantic retrieval fails EMBEDDER_MISMATCH and the next CIT cannot be proposed;
    (b) a CIT reclassifying docs/** as historical is COMMITTED while the index keeps the old classification and returns the archived runbook as current. K2 is owned by another family; the D1 side (index
    refresh/invalidation inside a governed change) is graded here.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:309, and K2 bullets :634-636 'memory/index refresh; verification; commit or rollback/block atomically'; framework §47.2; frozen gate
    contract AC-16 'K2 ↔ D1 ↔ W6'.
  provenance_class: ORIGINAL-NORMATIVE
