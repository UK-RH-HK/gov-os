  severity: MEDIUM
  title: Claims and emergency-control state live in the directory the product classifies as derived
  statement: claims.db, control.json (FREEZE_WRITES/PAUSE) and CIT rollback snapshots live in .governance-runtime/, which the product's own REPOSITORY_CONTRACT classifies `derived` and whose documentation
    states 'Everything in `.governance-runtime/` is derived and rebuildable' (docs/ARCHITECTURE.md:76). Deleting that directory and rebuilding lost the active claim (another session then claimed the task)
    and lifted FREEZE_WRITES. `gov rebuild-memory` itself preserves them.
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:352 'Fresh rebuild preserves authoritative structured state and claims where required.'; framework §19, §81; :356 'deleted indexes'.
