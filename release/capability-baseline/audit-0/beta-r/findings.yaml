- id: A0-D5-02
  capability:
  - D5
  bullet_source_lines:
  - 348
  severity: HIGH
  title: Profile changes are not bound to evidence, regression or the radius-appropriate gate
  statement: '`gov memory select` pinned an unbenchmarked candidate (builtin:8, no research record) and wrote an AUTHORITATIVE decision whose rationale reads ''selected on held-out evidence'' with derived_from
    []; the switch runs and records no held-out regression; select writes governance/project/PROJECT_POLICY.yaml directly under an R3 decision with no human gate and no CIT (a CIT touching governance paths
    is R5 with a human gate; CHANGE_POLICY.auto_approve_max_radius is R1); a pin edited directly in the overlay (no decision) is accepted after a rebuild and gov audit raises nothing. Reindex is enforced
    (EMBEDDER_MISMATCH until a full rebuild) and select is L3-gated.'
  normative_source: framework §14.3 'may be changed only through a measured migration with re-indexing and regression testing'; Governance_OS_Capability_Acceptance_Contract_v3.md:348; framework/policies/CHANGE_POLICY.yaml
    auto_approve_max_radius / radius_rules.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-7
