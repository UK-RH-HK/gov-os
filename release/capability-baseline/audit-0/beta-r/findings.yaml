- id: A0-D5-01
  capability:
  - D5
  - D1
  bullet_source_lines:
  - 347
  - 312
  severity: HIGH
  title: Pinned embedder/reranker revisions are strings not bound to what executes
  statement: The embedder resolves its plugin by id only (runtime/src/memory/embedder.rs:125), so a descriptor at version 2 silently serves a pin of version 1; the reranker's recorded revision is MEMORY_POLICY.reranker.version
    ('0'), not the plugin's (1); select hard-codes version '1' for plugin candidates (benchmark.rs:30); a registered plugin invoked as `python3 -m module` (the form the shipped templates document) records
    implementation_files [] and implementation_sha256 null.
  normative_source: framework §14.3 pinned versions; Governance_OS_Capability_Acceptance_Contract_v3.md:347 'selected embedder/reranker revisions are pinned'; frozen gate contract §9.1.
  provenance_class: ORIGINAL-NORMATIVE
