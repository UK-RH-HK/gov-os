- id: A0-D2-03
  capability:
  - D2
  bullet_source_lines:
  - 319
  severity: MEDIUM
  title: Graph-route answers are buried by fusion; code-impact questions never reach the graph
  statement: Impact questions reach the graph route only when they contain a record-ID token and a fixed trigger word; the router always adds lexical+semantic for questions of 4+ words and fuses with equal-weight
    RRF. For 'what depends on REQ-0001' the first graph hit is rank 28 of 30 (27 kernel-schema lexical/semantic hits first) and the dependant F-0001 is absent from the top 30, while --route graph alone
    returns it. 'What breaks if compute_total changes' never reaches the graph route.
  normative_source: framework §14 'dependency/impact? → graph traversal'; Governance_OS_Capability_Acceptance_Contract_v3.md:319.
