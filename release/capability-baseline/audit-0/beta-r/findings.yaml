  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 FRESH-evidence-invalidation.py
  repair_direction: Green evidence for the memory/index families must go stale when relevant sources, authoritative specs or the index manifest change.
