  title: The embedding runtime/model artefact is neither separately identified nor bound; weight changes go undetected
  statement: 'The index manifest records EmbedSpec {id, version, dimensions, source} taken from policy, and plugin registration binds only the resolvable command files. Demonstrated: changing the weights
    file behind a registered embed plugin (same id, version and adapter bytes) is invisible — freshness fresh, D025/D028 ok, semantic queries run against vectors produced with the old weights, and an incremental
    rebuild does not re-embed.'
  normative_source: 'framework §14.2 ''The framework must distinguish: embedding model; inference runtime; ...''; §14.3 ''The chosen embedding and reranker versions are pinned in the memory/index manifest'';
    Governance_OS_Capability_Acceptance_Contract_v3.md:331, :312; frozen gate contract §9.1 ''pluggable, separately identifiable embedder/reranker/runtime components (D4)''.'
