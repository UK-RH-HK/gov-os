  title: No durable record of ad-hoc retrieval misses or tool failures
  statement: An ad-hoc retrieval miss leaves only retrieval_log rows in the derived state.db (wiped by the next full rebuild); held-out misses survive only as failed IDs inside an audit record's family
    detail (no memory-quality event, root cause or link to a new held-out test). A code_intel adapter crash is recorded only in the rebuild report and runtime meta (overwritten to [] by the next rebuild);
