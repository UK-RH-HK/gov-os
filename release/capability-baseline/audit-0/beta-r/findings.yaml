- id: A0-C5-02
  capability:
  - C5
  bullet_source_lines:
  - 252
  - 258
  severity: MEDIUM
  title: AST-equivalent fidelity only for Python; test-coverage edges only when imports happen to resolve
  statement: Only Python has an AST adapter (optional plugin); all other languages use line-regex heuristics that produce false symbols (a class declared inside a docstring was extracted) and no LSP/SCIP
    adapter ships (rust-analyzer is registered 'proposed'). TESTS edges are derived only when a test file's import resolves; resolution tries the file's ancestors, the product root and relative paths, so
    a tests/ file importing a src/-layout package (and Rust integration tests importing the crate) gets no TESTS edge (runtime/src/memory/indexer.rs:85-212, 653-657).
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:252 'AST/LSP/SCIP or equivalent', :258 'test-coverage relationships'; framework §11.5.
