  - C2
  bullet_source_lines:
  - 231
  severity: MEDIUM
  title: Graph integrity only counts orphans and cannot see stale or reversed relationships
  statement: 'graph_integrity/D015 flag dangling targets and schema_invariants rejects unknown relation types, but: orphan records are only counted (D015 ok=true, severity info, no audit finding); an edge
    to a SUPERSEDED record (F-0202 GOVERNED_BY D-0101) produces no finding; reversed-direction relationships (a requirement that IMPLEMENTS an architecture record, a requirement that TESTS a test obligation)
    are accepted without any endpoint-type/direction validation. Cyclic supersession is caught only indirectly as a superseded-but-ACTIVE authority conflict.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:231 'Graph integrity checks detect orphan/stale/reversed/invalid relationships.'; :356 advanced challenge 'graph edges stale'.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  blocking: true
  evidence:
  - evidence/C2-relationship-graph.out
  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 C2-relationship-graph.py
  repair_direction: Integrity checks must raise (not merely count) orphan relationships, detect relationships whose target is no longer current (superseded/retired/historical), and validate relationship
    direction and endpoint types per relation type.
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-C3-01
  capability:
  - C3
  bullet_source_lines:
  - 241
  severity: HIGH
  title: Authority/namespace filters run after candidate truncation and after the reranker plugin sees the candidates
  statement: 'retrieve() truncates each route to max(4k,20) candidates, fuses them, sends up to 24 fused candidates'' text to a pinned reranker plugin, and only then applies the authority (status/superseded_by/default_retrieval)
    and namespace-role filters (runtime/src/retrieval/mod.rs:235-548). Demonstrated: with 40 superseded near-duplicates of an ACTIVE decision the ACTIVE decision is returned at no k (hits=[] at k=3,5,8;
    excluded_by_authority=20/32); a product-spec-agent query sent 10 product-namespace chunks (source code outside its namespace) to the reranker plugin before they were filtered out.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:241 'Semantic namespace/authority filters apply before or during retrieval.'; framework §14 complex flow 'query ↓ authority + namespace
    filter ↓ lexical + vector + graph/code candidates'; Contract v3:356 challenges 'wrong authority namespace', 'archive indexed as current', 'stale chunks'.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  blocking: true
  evidence:
  - evidence/C3-semantic-memory.out
  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 C3-semantic-memory.py
  repair_direction: Authority and namespace filters must be applied before candidate truncation and before any plugin receives candidate text, so excluded material can neither exhaust the candidate pool
    nor cross a plugin boundary.
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-C3-02
  capability:
  - C3
  - C4
  - C7
  bullet_source_lines:
  - 239
  - 249
  - 274
  severity: HIGH
  title: List-valued and nested record content never enters lexical or semantic memory
  statement: 'Record chunks are built from the title, top-level string fields of >=40 chars and the body (runtime/src/records.rs:214-226; indexer.rs:516-522). List-valued and nested fields are never chunked,
    FTS-indexed or embedded: scenario given/when/then, requirement acceptance_criteria, decision options/consequences, report discoveries/risks/lessons, and everything a worker returns (nested under a handoff''s
    `return`). Record::text() (records.rs:153-212), which would include several of these, has no caller. Demonstrated: SCN-0001 has a single chunk (its title); an acceptance-criterion phrase and a scenario
    step are not found by the lexical store; a semantic query made of the scenario''s own steps misses SCN-0001; a failed worker''s discoveries/risks are in no chunk and an exact query for them returns
    nothing.'
  normative_source: framework §11.3 (semantic memory for requirements, specifications, failures), §11.4 (literal phrases); Governance_OS_Capability_Acceptance_Contract_v3.md:239, :249, :274; V3 'expected
    retrieval results' (:1045).
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  - AC-7
  blocking: true
  evidence:
  - evidence/C3-semantic-memory.out
  - evidence/C4-lexical-memory.out
  - evidence/C7-episodic-memory.out
  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 C3-semantic-memory.py && python3 C4-lexical-memory.py && python3 C7-episodic-memory.py
  repair_direction: All governed record content, including list-valued and nested fields, must be represented in lexical and semantic memory with section-level provenance.
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-C4-01
  capability:
  - C4
  - D3
  bullet_source_lines:
  - 247
  - 248
  - 249
  - 325
  severity: HIGH
  title: Code outside recognised units (after the 15-line head) is never indexed
  statement: 'chunk_code emits a document chunk with the first 15 lines, a header chunk with the lines before the first recognised unit, and one section per top-level unit (runtime/src/memory/chunking.rs:191-266).
    Lines between units and after the last unit are in no chunk, hence absent from FTS and vectors. Demonstrated: 7 non-empty lines of a 40-line Flask module (route decorators between functions, a module
    constant, the __main__ block) and 5 non-empty lines of a 24-line express module (router.get route registration, export) are in no chunk; tokens that occur only there (''SENTINEL'', ''8088'', ''/api/orders/:id'')
    are unfindable by the router and by the lexical store.'
  normative_source: framework §11.4 lexical memory for 'exact terms; identifiers; ... error strings; API names; configuration keys; literal phrases'; Governance_OS_Capability_Acceptance_Contract_v3.md:244-249;
    :356 'deliberately missing index coverage'.
