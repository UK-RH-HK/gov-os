  severity: MEDIUM
  title: Incremental builds leave stale edges owned by unchanged files
  statement: Incremental indexing re-derives facts only for changed files; CALLS/TESTS edges and call references owned by unchanged files are not re-evaluated. After compute_total was renamed in models.py,
