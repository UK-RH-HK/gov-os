  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 D2-retrieval-router.py
  repair_direction: The router must deliver graph-route answers for dependency/impact questions (including code entities) instead of letting fused lexical/semantic noise displace them.
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-D3-01
  capability:
  - D3
  bullet_source_lines:
  - 325
  severity: MEDIUM
  title: Methods inside classes are not chunk units; symbol lookups return the file header
  statement: Code chunks are one section per top-level unit (generic.rs:284-286 keeps units only for parent-less symbols; chunking.rs:238-264) with size-based children; methods are never their own chunk.
    chunk_for falls back to the first chunk when no chunk carries the qualname (retrieval/mod.rs:192-207), so a symbol lookup for SettlementPipeline.reconcile_quarantine returns the file's 15-line header.
  normative_source: framework §14.1 'For code, prefer structural units such as module/class/function/symbol/reference over arbitrary token windows'; Governance_OS_Capability_Acceptance_Contract_v3.md:325
    'code file → module/class → function/symbol'.
  provenance_class: ORIGINAL-NORMATIVE
