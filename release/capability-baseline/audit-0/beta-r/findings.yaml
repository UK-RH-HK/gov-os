  title: Green memory/index evidence is not invalidated by source, spec or index-manifest changes
  statement: 'Evidence currency for the governance-suite families that own beta evidence is keyed by verification::inputs_hash over governance/kernel, governance/project, governance/tests, spec/decisions
    and governance/framework.lock only (runtime/src/verification/mod.rs:54-73). Demonstrated: deleting a source file that two held-out queries expect (recall 1.0 -> 0.905, HQ-008/HQ-011 fail on re-run),
    rewriting a requirement, or changing the index manifest leaves the green audit record current. Retrieval-profile, path-map and held-out-set changes do invalidate it. (O4 is owned by another family;
    the currency of beta capability evidence is recorded here.)'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:97-111 ('relevant source files', 'authoritative spec/decision', 'relevant index manifest'); frozen gate contract AC-10 'Changing a
    relevant implementation/policy/spec/tool/model/index/path-map input is shown to invalidate prior green evidence rather than leave it green.'
