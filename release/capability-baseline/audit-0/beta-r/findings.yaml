  reproduction: cd release/capability-baseline/audit-0/beta-r/evidence && PROBE_TMP=$(mktemp -d) python3 C5-code-structural-memory.py
  repair_direction: Structural extraction for each in-scope language must be AST/LSP/SCIP-equivalent (no symbols from comments/strings), and test→code relationships must be derived for standard layouts
