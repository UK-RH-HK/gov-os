  repair_direction: Changing a retrieval profile must require benchmark evidence for the chosen candidate, run and record the held-out regression after re-indexing, pass the change-control gate for its
    radius, and detect ungoverned pin changes; decision records must not assert evidence that was not supplied.
  owner_decision_required: false
  owner_decision_reason: null
