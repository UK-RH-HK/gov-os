    stale (superseded-target) or reversed-direction relationships.
  na_reason_normative_text: null
  partial_qualification_impact: COULD_UNDERMINE — Gate D's advanced challenge list names 'graph edges stale' (Contract v3:356) and the hidden memory oracle includes 'expected graph relationships' (V3, Contract
