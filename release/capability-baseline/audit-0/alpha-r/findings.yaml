  - id: A0-S5-02
    capability: [S5, A2]
    bullet_source_lines: [944]
    severity: MEDIUM
    title: A refused kernel reinstall leaves a half-installed kernel, and on a provisioned machine the update rollback path cannot run
    statement: >-
      After an authenticated update, `gov update --rollback` is refused SRR_RELEASE_UNVERIFIED with or without
      --break-glass. The snapshot carries no signed metadata, and the protected installed record vouches only for the
      current release, not the one it previously verified (A2-02 [P9]; A2-05 [K6b]). `gov kernel reinstall
      --break-glass` with an authentic older release and a valid owner token installs the older payload and enters
      DEGRADED — RECOVERY ONLY. It then fails KERNEL_MISMATCH (cli/src/main.rs:945, after install_kernel). The machine
      is left with the older kernel, the newer framework.lock and an installed record for the newer payload, and
      every mutation is refused KERNEL_TAMPERED until an at-floor reinstall (A2-05 [K6a]). The same ordering hurts the
      ordinary case with no break-glass: reinstalling from an authentic, above-floor release of a different version
      (4.1.6 onto 4.1.5) is refused KERNEL_MISMATCH only after the 4.1.6 payload has been committed. The refused
      command leaves kernel 4.1.6 under a 4.1.5 lock, trust.verified=false, and ordinary mutations refused
      KERNEL_TAMPERED until the locked release is reinstalled (A2-08-reinstall-version-change.out [V1]-[V3]). Both
      cases fail closed and can be recovered. The working below-floor restoration path is `gov init --force
      --break-glass` with the older signed release ([K6c]). The floor rule itself is owner-decided
      (OWNER-DECISION-0006/0007) and is not questioned here.
