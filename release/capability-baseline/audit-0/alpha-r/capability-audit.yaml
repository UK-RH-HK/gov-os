notes: >-
  Evidence paths are relative to release/capability-baseline/audit-0/alpha-r/. A citation of the form
  "evidence/X.out [TAG]" names the output lines carrying the marker [TAG] (each probe prints one marker per check).
  Every probe is re-runnable: PROBE_TMP=<scratch dir> python3 evidence/<probe>.py (it needs target/release/gov and
  isolates HOME/XDG_* so no real machine state is touched). "No G-tier scheduler" below means: no G0-G6 identifier or
  scheduler exists anywhere in runtime/src, cli/src or framework/ (searched); checks run as per-command guards
  (G0-equivalent), on-demand doctor/audit and the post-install doctor+audit inside init/update/adopt (G5-equivalent).
  Finding A0-A1-02 (derived views omit every bullet; evidence map declares zero owners) and A0-B3-01 (freshness) are
  capability-level findings about contract binding and evidence currency; they are listed on the capabilities they
  concern but do not by themselves create a bullet gap.
