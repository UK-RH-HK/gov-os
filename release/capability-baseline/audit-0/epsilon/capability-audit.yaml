  - capability: O5
    title: Governance Health Scheduler
    source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:791
    governing_document_refs: [framework Part XVII §64]
    requirement_class: EXECUTION_REFINEMENT
    status: PARTIAL
    status_justification: >
      The G0-G6 tiered checks are present as emergent behaviour rather than an explicit
      scheduler. G0 guard_write runs on every mutating command. The governance suite (G5)
      runs all 20 families. The --family flag enables impacted-test selection. RED/YELLOW/GREEN
      equivalent exists as UNHEALTHY/DEGRADED/HEALTHY. Hard-block vs warning semantics are
      explicit (critical/high vs medium). Health result provenance is recorded (audit record
      with session, role, inputs_hash, run_at). Remediation is provided by doctor checks.
      However: independent checks run sequentially (not in parallel), no isolated
      worktrees/processes exist for check isolation, cache reuse across runs is not
      explicit, and the G0-G6 tier model is not an explicit scheduler dispatch.
