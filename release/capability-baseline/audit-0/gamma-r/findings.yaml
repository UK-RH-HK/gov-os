conventions:
  reproduction_prefix: "cd release/capability-baseline/audit-0/gamma-r/evidence && PROBES=<scratch dir> bash <probe>.sh > <probe>.out  (requires target/release/gov built in the worktree; lib.sh documents the environment)"
  new_vs_residual: "every finding is BASELINE (iteration-0 blocker-class inventory, frozen contract §8)"
  falsifies_vs_blocking: "falsifies_or_proposes records whether a Phase-2 checklist requirement is shown unmet on this candidate; blocking is decided only by whether an AC is left unmet (frozen contract §6 'only if'; P2-HO-0009), so a justified PARTIAL gap can falsify a bullet without blocking"
