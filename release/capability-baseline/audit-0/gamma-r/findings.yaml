  repair_direction: "A skill version must identify its content and there must be an executable way to run a skill's validation scenarios and record the result against that version (Contract v3 line 401; framework §27). Executing scenarios with agents is naturally Phase-4 work; the binding and the harness hook are Phase 2. Non-blocking: CANNOT_UNDERMINE argued."
