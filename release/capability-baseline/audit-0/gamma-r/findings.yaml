- id: A0-E4-01
  capability: [E4]
  bullet_source_lines: [389]
  severity: HIGH
  blocker_class: BC-E4-CLAIM-RACE
  title: "Concurrent claims of one task all succeed (non-atomic check-then-insert)"
  statement: >-
    ClaimsStore::claim (memory/claims.rs:56-72) reads the current holder and then does INSERT OR REPLACE without a
    transaction or conditional insert. In 15 of 15 trials, three sessions launched simultaneously were each told they
    hold the claim (TASK_CLAIMED never returned); only the last writer remains in the store. The parallel-agent budget
    check (tasks.rs:142-161) is subject to the same race.
  normative_source: "Contract v3:389 'Claim collision is detected.'; framework §63 governance test family 'concurrency/session claims'"
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: [AC-3]
  blocking: true
  evidence: ["evidence/E4-claims.out:19-35"]
  reproduction: "bash E4-claims.sh (E4.b2.race; TRIALS env var sets the trial count)."
  repair_direction: "A claim must be granted to exactly one session under concurrent attempts, and every other attempt must receive TASK_CLAIMED (Contract v3 line 389)."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-E4-02
  capability: [E4, H3]
  bullet_source_lines: [392, 522]
  severity: HIGH
  blocker_class: BC-E4-CLAIM-IGNORES-DAG
  title: "`task claim` accepts any task whose stored status is READY; dependency- and readiness-blocked tasks are claimed and closed"
  statement: >-
    tasks.rs:136-141 checks only the stored task_status. READY is caller-settable (task status, L2; task create --status
    READY) and is corrected only when someone runs replan. Demonstrated: a task whose dependency is still READY was claimed
    and closed DONE; an implementation task whose feature lacks pre-implementation cells was set READY by an L2 role and
    claimed by an implementer, and `task create --status READY` on the unready feature was accepted. `gov continue` alone
    respects the DAG.
  normative_source: "Contract v3:392 'Parallel work is allowed only where dependency/mutation constraints permit.'; :522 'Production implementation does not become READY before required prerequisite cells satisfy policy.'; framework §38"
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: [AC-3]
  blocking: true
  evidence: ["evidence/E4-claims.out:68-78", "evidence/H2H3-readiness.out:95-107"]
  reproduction: "bash E4-claims.sh (E4.b5); bash H2H3-readiness.sh (H3.b5)."
  repair_direction: "A task must not become claimable, and must not be stored READY, while the DAG blocks it (dependencies, readiness policy, TEST_POLICY, gates) (Contract v3 lines 392, 522)."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-E4-03
  capability: [E4]
  bullet_source_lines: [388, 392]
  severity: MEDIUM
  blocker_class: BC-E4-NO-WORKTREE-NO-MUTATION-CONSTRAINT
  title: "Claims record no worktree identity and parallel claims ignore mutation overlap"
  statement: >-
    The claims table holds task, session, role and lease only; two tasks with the same allowed_paths were claimed
    concurrently by two sessions and the overlap surfaced only at close, where each session was refused because of the
    other's change (mutual MUTATION_SCOPE_VIOLATION).
  normative_source: "Contract v3:388 'Sessions/worktrees/tasks can be claimed.'; :392 'Parallel work is allowed only where dependency/mutation constraints permit.'"
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: [AC-3]
  blocking: true
  evidence: ["evidence/E4-claims.out:7-8", "evidence/E4-claims.out:79-84"]
  reproduction: "bash E4-claims.sh (E4.b1, E4.b5 mutation overlap)."
  repair_direction: "Parallelism must be refused or serialised when mutation scopes overlap, and the unit of isolation (session or worktree) must be recorded in the claim (Contract v3 lines 388, 392)."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-E4-04
  capability: [I4, E4]
  bullet_source_lines: [590, 392]
  severity: MEDIUM
  blocker_class: BC-I4-CONTINUE-OFFERS-CLAIMED
  title: "`gov continue` offers tasks already in progress under another session; a second agent's continue --claim fails instead of taking independent work"
  statement: >-
    dag::compute puts IN_PROGRESS tasks without blocking reasons in `runnable` (dag.rs:163-168) and status::continue_work
    picks the first candidate on the longest chain (status.rs:124-127); after S-w1 claimed TASK-A3, S-w2's continue
