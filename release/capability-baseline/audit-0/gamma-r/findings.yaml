  normative_source: "Contract v3:590 'independent branches continue while one branch waits for human input'; framework §44"
  provenance_class: NECESSARY-DERIVED
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: []
  blocking: false
  evidence: ["evidence/I4-parallel.out:25-30", "evidence/E4-claims.out:77-78"]
  reproduction: "bash I4-parallel.sh (I4.b5)."
  repair_direction: "Next-work selection must exclude work held by another live claim so that each agent is offered independent runnable work (Contract v3 line 590). Non-blocking: CANNOT_UNDERMINE argued (parallel_runnable + task claim)."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-F1-01
