    return erased the first return's unresolved items from governed state.
  normative_source: "Contract v3:385 'persist beyond conversation lifetime'; framework §25 'All material outputs return to project state rather than remaining only in inter-agent chat.'"
  provenance_class: NECESSARY-DERIVED
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
