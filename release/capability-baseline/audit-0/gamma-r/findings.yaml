  evidence: ["evidence/DV-derived-views.out"]
  reproduction: "python3 release/capability-baseline/audit-0/gamma-r/evidence/DV-derived-views.py (from the worktree root)"
  repair_direction: "The compiled form and evidence map must represent each gamma capability's checklist and the Contract v3 lines 53-73 fields (at least evidence classes, automated check IDs and scheduler tiers) without semantic change. Whether a headings-only compiled form is a 'semantic difference' under AC-13 is for the synthesis auditor; recorded non-blocking at family level."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-E2-01
  capability: [E2]
  bullet_source_lines: [375]
  severity: MEDIUM
  blocker_class: BC-E2-NO-PROJECT-ROLE-EXTENSION
  title: "No governed extension point for project-specific roles"
  statement: >-
    Every role lookup reads only the trusted kernel ROLES.yaml (authority.rs:9-35, handoffs.rs:21-40, routing.rs:73-78,
    verification authority_role_limits); any other role is UNKNOWN_ROLE for authority-checked operations, whether
    undeclared, declared in the overlay TOOL_PERMISSIONS (flagged by the suite) or placed in a project ROLES.yaml, and
    cannot receive a handoff.
  normative_source: "Contract v3:375 'project-specific roles through governed extension'; framework §24 (roles are capability contracts), §40 (a project may extend the taxonomy through a governed change)"
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: []
  blocking: false
  evidence: ["evidence/E2-roles.out:126-148"]
  reproduction: "bash E2-roles.sh (E2.b7)."
  repair_direction: "A project must be able to define a role through a governed change that binds it to a level no higher than policy allows, a routing tier and permission classes, with D-0007 rule 3 (a lower layer may specialise, never weaken) applied (Contract v3 line 375). Non-blocking: CANNOT_UNDERMINE argued in capability-audit.yaml."
  owner_decision_required: false
  owner_decision_reason: null

- id: A0-E3-01
  capability: [E3]
  bullet_source_lines: [385]
  severity: MEDIUM
  blocker_class: BC-E3-RETURN-UNBOUND-OVERWRITE
  title: "A handoff return is not bound to the recipient and a later return silently overwrites the earlier one"
  statement: >-
    handoffs.rs:112-162 accepts a return from any L1+ session regardless of the handoff's to_role and regardless of
