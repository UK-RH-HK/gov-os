  reproduction: "bash E3-handoffs.sh (E3.5)."
  repair_direction: "A returned handoff's content must remain in governed state (no silent replacement) and a return must come from the addressed recipient or be explicitly re-assigned (Contract v3 line 385). Non-blocking: CANNOT_UNDERMINE argued."
