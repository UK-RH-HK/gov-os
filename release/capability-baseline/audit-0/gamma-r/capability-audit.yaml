  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: >-
    `readiness plan` generates one task per unsatisfied cell with the mapped class (data, performance, security,
    test-design...), links implementation tasks to the pre-implementation gap tasks and computes them BLOCKED. But READY is
    a stored, caller-settable status: an L2 role or a creator can store READY on an unready implementation task and any L1
    session can then claim it (A0-E4-02); the project overlay can switch the rule off outside policy precedence
    (A0-H3-01); and the generated 'independent' test-design task is not bound to an independent author (A0-E1-05).
