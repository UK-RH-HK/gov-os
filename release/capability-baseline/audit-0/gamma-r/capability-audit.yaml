- capability: F4
  title: Plugin trust boundary
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:425
  governing_document_refs:
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md Part VIII §28-32
    - spec/decisions/D-0005.yaml; spec/decisions/D-0007.yaml; spec/interfaces/API-0001.yaml (v1.1 governance clause)
    - spec/architecture/ARCH-0003.yaml §9 ("Descriptors cannot self-authorise"); SRR-R0-L6
    - release/verification/4.1.6-r1-4/00-VERIFICATION-REPORT.md §8 items 9 and 11
  requirement_class: POST_VERIFICATION_HARDENING
  status: PARTIAL
  status_justification: >-
    The Phase-1 controls hold on this candidate: descriptor claims (approved_roles, provenance, status, security_review)
    are ignored or rejected, registration strips provenance and binds descriptor and implementation hashes, tampering of a
    registered plugin fails closed, elevated permissions require a presented answered-A gate and revocation withdraws it,
    privileged remotely-acquired capabilities are refused (SRR-R0-L6), and the R1-4 held-out suite passes unedited.
    But: any answered-A gate on any subject authorises an elevated registration (A0-F4-01); the registry is a plain
    repository file under an OS-managed prefix that a lower-trust writer can forge undetected (A0-F4-02); elevation is
    self-declared, so an under-declaring plugin runs arbitrary effects with no gate (A0-F4-03); unregistered plugins are
    bound only by machine-local trust-on-first-use (A0-F4-04); and a tool's security review may point at any record
    (A0-F4-05).
  na_reason_normative_text: null
  partial_qualification_impact: >-
    COULD_UNDERMINE. Contract v3 A3's qualification challenge seeds 'malicious plugin descriptors'; with unbound gates,
    forgeable registration and self-declared elevation, a malicious plugin reaches elevated execution without a genuine
    approval, so the plugin trust boundary cannot be qualified. AC-4 requires F4 incorporated.
