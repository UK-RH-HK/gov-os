family_level_findings: [A0-E1-06]   # derived views (compiled form, evidence map) carry headings only for all 19 gamma capabilities; not a behavioural bullet gap
cross_capability_interactions:
  - interaction: "AC-16 L3 <-> E1 (gate presentation respects authority) — E1 side"
    exercised: true
    evidence: ["evidence/E1-authority.out:199-215", "evidence/E1-authority.out:102-130", "evidence/E1-authority.out:132-173"]
    result: >-
      Through the CLI the interaction holds: presenting needs L1 (L0 refused), answering needs presentation first and L3 to
      relay a human answer (L1/L2 refused), agent resolution needs an L3 acting role and the gate within
      agent_resolvable_when, revocation needs L4 and withdraws the derived decision. It fails outside the CLI: a worker's
      forged ANSWERED/presented gate record bypasses presentation and authority entirely and is honoured by `cit approve`
      and the DAG (A0-E1-02); and the acting role is caller-declared (A0-E1-04).
  - interaction: "AC-4 F4 <-> Phase-1 R1 acceptance"
    exercised: true
    evidence: ["evidence/F4-AC4-r1-heldout-rerun.out", "evidence/F4-plugins.out"]
    result: >-
      R1 acceptance remains valid for this candidate (product_code_digest identical to srr1-r1-accepted; the R1-4 held-out
      suite hv_a/hv_b/hv_c/hv_d passes 31/31 unedited here), but F4 is not fully incorporated: A0-F4-01, A0-F4-02,
      A0-F4-03 and A0-F4-05 are above-floor plugin-trust defects outside what R1 examined.
