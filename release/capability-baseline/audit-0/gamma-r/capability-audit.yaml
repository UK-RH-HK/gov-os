        - "evidence/E4-claims.out:19-35 — 15 trials x 3 sessions launched simultaneously: 3/3 sessions told OK in every trial (SUMMARY line 35); only one holder remains in the store"
      gap: "Check-then-insert without a transaction or conditional insert: concurrent claims all succeed (A0-E4-01)."
    - bullet: Claims survive derived-memory rebuild.
      source_line: 390
      status: PRESENT_AND_SUBSTANTIAL
