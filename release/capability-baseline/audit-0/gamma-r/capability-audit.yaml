      automated_evidence: [certification repair3::plugin_descriptors_can_never_authorise_themselves, certification srr::a_privileged_capability_acquired_from_outside_needs_a_delegated_signed_target, certification section6::both_capability_acquisition_primitives_ask_section_6_without_consulting_the_descriptor, doctor D028, suite family plugin_governance, R1-4 held-out hv_d::d4 (evidence/F4-AC4-r1-heldout-rerun.out:38-47, d4 at line 42)]
      independent_evidence:
        - "evidence/F4-plugins.out:3-12 — a descriptor claiming approved_roles [all], provenance, status active and a registration_gate is refused for L1 and runs only at the kernel L2 floor with its claims ignored (D028 high); an unregistered descriptor declaring network: true is PLUGIN_NOT_APPROVED even for L4; a descriptor carrying security_review is schema-invalid"
        - "evidence/F4-plugins.out:13-15 — UNDER-declaration: a hand-declared plugin that writes a file but declares no elevated permission runs for an L2 role with no registration and no gate; the side-effect file exists"
        - "evidence/F4-plugins.out:61-67 — a descriptor naming an unrelated answered gate as registration_gate is registered with elevated permission"
        - "evidence/F2F3-tools.out:125-130 — the descriptor's own provenance claim is reported as approval in the generated registry"
      gap: "Whether an approval is needed at all is decided by the descriptor's self-declared permissions (A0-F4-03); the descriptor chooses the approving gate (A0-F4-01); self-claims leak into the registry view (A0-F2-02)."
    - bullet: Registration/provenance live in trusted OS state.
      source_line: 427
      status: PARTIAL
      implementation_evidence: [runtime/src/capabilities/registry.rs:24-134, runtime/src/orchestration/tasks.rs:199-218, runtime/src/verification/mod.rs:55-73]
      automated_evidence: [certification repair3::plugin_descriptors_can_never_authorise_themselves]
