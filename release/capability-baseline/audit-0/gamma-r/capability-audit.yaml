- capability: E2
  title: Representative roles
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:368
  governing_document_refs:
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md Part VI §24 (roles are capability contracts)
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md §40 (governed extension of the taxonomy)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: >-
    Every named representative role exists in the verified kernel catalogue and behaves as a capability contract (level,
    routing tier/reasoning, permission classes, skill resolution). A project cannot add a role through any governed
    extension: every role lookup reads only the kernel ROLES.yaml and any other role is UNKNOWN_ROLE (A0-E2-01).
  na_reason_normative_text: null
  partial_qualification_impact: >-
    CANNOT_UNDERMINE. The Contract v3 challenges and V1-V4 oracle do not require project-defined roles; the 28 kernel roles
    cover every role a synthetic repository needs (engineering, data, security, release, verification), so qualification can
    be run and scored with kernel roles only. The gap is a missing extension point, not a safety property.
  bullets:
    - bullet: Orchestrator/CTO
      source_line: 369
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:14, runtime/src/orchestration/handoffs.rs:41-48, runtime/src/routing.rs:43-100]
      automated_evidence: [certification greenfield::greenfield_end_to_end (orchestrator drives the lifecycle), suite family authority_role_limits (INV-014)]
      independent_evidence:
        - "evidence/E2-roles.out:4 — orchestrator L4 routes T3/high"
        - "evidence/E2-roles.out:33-40 — orchestrator-only resume succeeds; a handoff that hands the orchestrator role to a worker is refused INV_014 unless explicitly assigned"
      gap: null
    - bullet: architecture/research/data/implementation roles as needed
      source_line: 370
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:16-27, framework/skills/SKL-IMPACT-ANALYSIS.yaml, framework/skills/SKL-RESEARCH-BENCHMARK.yaml, framework/skills/SKL-BACKEND-IMPL.yaml]
      automated_evidence: [certification greenfield::greenfield_end_to_end (skills resolve SKL-BACKEND-IMPL for backend-engineer)]
      independent_evidence:
        - "evidence/E2-roles.out:42-69 — architecture-agent (L2,T3), research-agent (L1), data-engineer/data-author (L1), backend-engineer (L1) each route, resolve tools by their own permission classes, and resolve their class/role skills (SKL-API-CONTRACT-REVIEW/SKL-IMPACT-ANALYSIS, SKL-RESEARCH-BENCHMARK, SKL-BACKEND-IMPL)"
        - "evidence/E2-roles.out:70-73 — bounded: backend-engineer cannot create tasks; architecture-agent can but cannot execute a CIT"
      gap: null
    - bullet: memory engineer
      source_line: 371
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:32, framework/policies/AUTHORITY_POLICY.yaml:47-48, framework/skills/SKL-MEMORY-RECONSTRUCTION.yaml]
      automated_evidence: [certification repair::benchmark_records_evidence_and_selection_pins_through_decision]
      independent_evidence: ["evidence/E2-roles.out:75-82 — memory-engineer L2/T3 resolves SKL-MEMORY-RECONSTRUCTION and may run memory benchmark (L2); backend-engineer (L1) is refused"]
      gap: null
    - bullet: independent test author
      source_line: 372
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:28, framework/skills/SKL-TEST-DESIGN.yaml]
      automated_evidence: [certification greenfield::greenfield_end_to_end]
      independent_evidence: ["evidence/E2-roles.out:84-90 — independent-test-designer exists (L1), resolves SKL-TEST-DESIGN whose roles are [independent-test-designer] and classes [test-design]"]
      gap: null
    - bullet: independent verifier/auditor
      source_line: 373
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:34, framework/roles/ROLES.yaml:38-40]
      automated_evidence: [certification brownfield::brownfield_adoption_end_to_end (reviewer/verifier sessions)]
      independent_evidence: ["evidence/E2-roles.out:91-107 — independent-auditor, migration-verifier, memory-verifier are L0/T3; they run the suite and are refused state mutation"]
      gap: null
    - bullet: security/release roles
      source_line: 374
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:25, framework/roles/ROLES.yaml:35, framework/overlay-templates/TOOL_PERMISSIONS.yaml:3-18]
      automated_evidence: [suite family authority_role_limits]
      independent_evidence: ["evidence/E2-roles.out:109-125 — security-engineer L2/T3 holds SECRET_READ and resolves SKL-THREAT-MODEL; release-agent L2 exists with its own permission classes; backend-engineer lacks SECRET_READ"]
      gap: null
    - bullet: project-specific roles through governed extension
      source_line: 375
      status: ABSENT
      implementation_evidence: [runtime/src/authority.rs:9-35, runtime/src/orchestration/handoffs.rs:21-40, runtime/src/verification/mod.rs:330-356]
      automated_evidence: []
      independent_evidence:
        - "evidence/E2-roles.out:126-136 — a 'data-scientist' role is UNKNOWN_ROLE for any authority-checked operation, whether undeclared, declared in the overlay TOOL_PERMISSIONS (the suite then reports it as not a kernel role), or placed in a project ROLES.yaml; a handoff to it is refused"
        - "evidence/E2-roles.out:137-148 — every ROLES.yaml consumer reads the trusted kernel file only"
      gap: "No governed extension point for project roles exists; the only route is a framework release (A0-E2-01)."
  health_scheduler_tiers: [G0, G5]
  evidence_owners: [G0, G5, independent-heldout]
  evidence_owner_actually_runs: "true for kernel roles — G0 level_of/require on every authority-checked command; G5 authority_role_limits flags non-kernel roles in the overlay. No tier observes project-role extension (it does not exist)."
  freshness:
    state: FRESH_FOR_CANDIDATE
    invalidation_inputs: [runtime/kernel implementation (ROLES.yaml), governing contract/policy (TOOL_PERMISSIONS overlay, MODEL_ROUTING_POLICY)]
    invalidation_demonstrated: true
    invalidation_evidence: "evidence/FRESH-invalidation.out:33-39 (ROLES.yaml edit -> KERNEL_TAMPERED; roles read from the embedded baseline); :7-10 (overlay change -> suite stale)"
  qualification_coverage:
    repo_a_challenge: "Greenfield product needing a domain role (e.g. ML evaluation): the orchestrator must obtain it through a governed extension, not by impersonating a kernel role."
    repo_b_challenge: "Brownfield repository whose legacy governance defines custom roles: adoption must map them to kernel roles or governed project roles with explicit levels."
    hidden_oracle_fault_class: "role confusion — a task routed to a role lacking the tier/permissions its class needs; expected detection: routing tier raised, permission gap reported."
    chaos_scale_soak: "not relevant: role catalogue is static per release."
    retrieval_challenge: "not relevant."
    not_challengeable: null
  adoption_obligation: "gov adopt must map legacy roles onto kernel roles (or governed project roles once they exist) and record the mapping; post-adoption acceptance checks no TOOL_PERMISSIONS role is non-kernel."
  residual_risk: "Projects needing a role outside the kernel will impersonate the nearest kernel role, blurring authority and routing."
  findings: [A0-E2-01]

