        - "evidence/F4-plugins.out:74-87 — an L1 worker writes a registry entry for the unapproved network plugin into governance/generated/plugin-registry.json, closes its src/** task successfully, and the plugin then runs for tooling-engineer and orchestrator; D028 and plugin_governance report nothing about it"
