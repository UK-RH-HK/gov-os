    - {bullet: unresolved items, source_line: 383, status: PRESENT_AND_SUBSTANTIAL, implementation_evidence: [framework/schemas/worker-return.schema.json], automated_evidence: [], independent_evidence: ["evidence/E3-handoffs.out:26 — omission refused", "evidence/E3-handoffs.out:44 — persisted"], gap: null}
    - {bullet: next action, source_line: 384, status: PRESENT_AND_SUBSTANTIAL, implementation_evidence: [framework/schemas/worker-return.schema.json], automated_evidence: [], independent_evidence: ["evidence/E3-handoffs.out:27 — omission of recommended_next_action refused", "evidence/E3-handoffs.out:45 — persisted"], gap: null}
    - bullet: "persist beyond conversation lifetime (qualifier applying to the seven elements)"
      source_line: 385
      status: PARTIAL
      implementation_evidence: [runtime/src/records.rs:56, runtime/src/orchestration/handoffs.rs:112-162]
