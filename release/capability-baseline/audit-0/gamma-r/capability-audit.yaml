    - {bullet: files changed, source_line: 379, status: PRESENT_AND_SUBSTANTIAL, implementation_evidence: [framework/schemas/worker-return.schema.json, runtime/src/orchestration/handoffs.rs:121-162], automated_evidence: [suite family mutation_scope], independent_evidence: ["evidence/E3-handoffs.out:19 — omission refused", "evidence/E3-handoffs.out:37 — persisted", "evidence/E3-handoffs.out:53-58 — files outside the handoff authority refused MUTATION_SCOPE_VIOLATION, recorded as authority_violations and reported by the suite"], gap: null}
    - {bullet: evidence/tests, source_line: 380, status: PRESENT_AND_SUBSTANTIAL, implementation_evidence: [framework/schemas/worker-return.schema.json], automated_evidence: [], independent_evidence: ["evidence/E3-handoffs.out:20-21 — omission of evidence or tests refused", "evidence/E3-handoffs.out:38-39 — persisted"], gap: null}
