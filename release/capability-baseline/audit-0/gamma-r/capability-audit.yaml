- capability: E3
  title: Typed A2A handoffs
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:377
  governing_document_refs:
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md Part VI §25 (typed handoffs; outputs return to project state)
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md §61 (spawned-agent return contract)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: >-
    The handoff and the worker return are typed: all seven return elements are required by the kernel worker-return schema
    (each omission is refused SCHEMA_INVALID), persisted in a governed record under spec/planning, readable by a fresh
    process, unaffected by a derived-memory rebuild and present in a fresh clone. The persistence qualifier is only partly
    met: a return is not bound to the recipient role/session and a second return silently overwrites the first (A0-E3-01).
  na_reason_normative_text: null
  partial_qualification_impact: >-
    CANNOT_UNDERMINE. Contract v3 qualification faults are injected into repository state (V1), not into agent returns;
    handoff continuity (W9, N) is scored on checkpoints and input manifests. An overwrite requires a second deliberate
    return, and committed earlier returns remain in Git history, so qualification remains scoreable.
