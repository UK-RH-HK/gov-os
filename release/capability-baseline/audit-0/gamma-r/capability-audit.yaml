# =====================================================================================================================
- capability: E1
  title: Authority levels
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:362
  governing_document_refs:
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md Part VI §23
    - spec/decisions/D-0007.yaml (trust classes; T5 caller input; rule 2)
    - spec/architecture/ARCH-0003.yaml §8 (repository files and caller claims cannot manufacture trust or approval)
    - spec/interfaces/API-0002.yaml (global --role flag)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: >-
    L0-L5 are executable and enforced on 38 of the 44 mutating CLI paths censused (bullet 1 and most of bullet 2 hold), and
    lower roles are refused every CLI route to a higher-trust fact. But (a) `gov init` and every `gov adopt`/`gov migrate`
    stage ignore the acting role given with --role and check authority against GOV_ROLE or the default 'orchestrator'
    (A0-E1-01); (b) `task replan` and `memory heldout-starter --force` mutate governed state with no authority class
    (A0-E1-03); (c) an L1 worker can write gate answers and decision records directly into OS-managed paths, task close
    exempts those paths, and the forged human answer then authorises a human-method CIT approval and execution and unblocks
    a gated task (A0-E1-02); (d) task role designation and tester independence are not enforced (A0-E1-05). The acting role
    is caller-declared by design (A0-E1-04, owner decision).
  na_reason_normative_text: null
  partial_qualification_impact: >-
    COULD_UNDERMINE. Repo B (brownfield) qualification runs the whole adoption pipeline; with --role ignored by adopt, no
    authority property of adoption can be measured. The forged-T2-record path (A0-E1-02) makes human-gate correctness (V4)
    and authority challenges (A1/A3 challenge lines 140, 164) unmeasurable, since any worker-injected record is honoured.
  bullets:
    - bullet: L0-L5 or equivalent are executable.
      source_line: 363
      status: PRESENT_AND_SUBSTANTIAL
      implementation_evidence: [runtime/src/authority.rs:25-56, framework/roles/ROLES.yaml:2-41, framework/policies/AUTHORITY_POLICY.yaml:44-91, cli/src/main.rs:760-771]
      automated_evidence: [certification repair::authority_levels_are_enforced_on_executable_paths, suite family authority_role_limits]
      independent_evidence:
        - "evidence/E1-authority.out:5-18 — one role per level (L0 independent-auditor .. L5 human) x 7 operations with required levels L1..L4; the allow/deny matrix matches AUTHORITY_POLICY exactly (L0 denied all; L1 claim only; L2 +create/gate/cit; L3 +pause/decide; L4/L5 all)"
        - "evidence/E1-authority.out:20-22 — unknown role and case variant 'Human' refused UNKNOWN_ROLE"
      gap: null
    - bullet: Role authority is checked on every privileged/mutating path.
      source_line: 364
      status: PARTIAL
      implementation_evidence: [runtime/src/authority.rs:48-56, runtime/src/init.rs:227-232, runtime/src/init.rs:257-260, runtime/src/adopt.rs:590-597, runtime/src/adopt.rs:981-987, runtime/src/adopt.rs:1143-1149, cli/src/main.rs:782-787, cli/src/main.rs:800-812, runtime/src/orchestration/dag.rs:272-316, cli/src/main.rs:913]
      automated_evidence: [certification repair::authority_levels_are_enforced_on_executable_paths (uses --role; adopt tests pass --role migration-executor which adopt ignores)]
      independent_evidence:
        - "evidence/E1-authority.out:24-66 — census of 40 mutating commands run as L0 with a before/after file snapshot: 33 refused AUTHORITY_DENIED (or GATE_NOT_PRESENTED) with no file change; `task replan` (line 31) rewrote spec/tasks/TASK-C2.yaml and `memory heldout-starter --force` (line 55) overwrote governance/tests/memory/heldout.yaml with no authority class; adapters generate / tools registry / rebuild-memory / audit write only derived or evidence state"
        - "evidence/E1-authority.out:67-77 — fresh `gov init` as --role independent-auditor succeeds (line 68); the same with GOV_ROLE=independent-auditor is refused install_kernel L4 (line 73)"
        - "evidence/E1-authority.out:78-100 — installed project: --role backend-engineer init --force succeeds (80); GOV_ROLE=backend-engineer refused (82); a full brownfield adoption A0..A6 driven as --role independent-auditor succeeds including `adopt migrate` twice (84-98); GOV_ROLE=independent-auditor refused migrate_execute L3 (100)"
      gap: "init and all adopt/migrate stages evaluate authority against GOV_ROLE or the default 'orchestrator', never the CLI --role (A0-E1-01); task replan and memory heldout-starter mutate governed state without any authority class (A0-E1-03)."
    - bullet: Lower roles cannot manufacture higher-trust facts.
      source_line: 365
      status: PARTIAL
      implementation_evidence: [runtime/src/orchestration/gates.rs:270-351, runtime/src/orchestration/tasks.rs:199-218, runtime/src/orchestration/tasks.rs:274-337, runtime/src/cit/mod.rs:372-457, runtime/src/orchestration/dag.rs:75-83]
      automated_evidence: [certification repair3::lower_trust_inputs_cannot_manufacture_higher_trust_facts, certification repair2::cit_approval_derives_only_from_an_answered_gate]
      independent_evidence:
        - "evidence/E1-authority.out:102-110 — CLI routes refused: L1/L2 cannot record a human answer, L3 cannot agent-resolve an R3/irreversible gate, L1 cannot approve a CIT by the human method"
        - "evidence/E1-authority.out:112-124 — relay by design: an L3 acting role records a human answer (human_approved: true, acting_role recorded)"
        - "evidence/E1-authority.out:126-130 — caller-declared role: --role human or GOV_ROLE=human records answered_by_kind human (documented D-0007/ARCHITECTURE 4.8 boundary; A0-E1-04)"
        - "evidence/E1-authority.out:132-169 — an L1 worker (backend-engineer, session S-W) claims its src/** task, writes forged ANSWERED gate records and human_approved decision records into spec/decisions, closes its task successfully (143) while git shows the forged files (144-156); the forged answer unblocks a WAITING_HUMAN task (157-158) and a change-controller's `cit approve --method human` succeeds with human_approved: true derived from the forgery (159-160), execution commits and rewrites REQ-0002 (161-166); the suite reports nothing about the forged records (167-169; its only high finding is the census fixture's deliberately missing dependency)"
        - "evidence/E1-authority.out:170-172 — contrast: the same worker's write to a non-OS-managed spec file is refused MUTATION_SCOPE_VIOLATION"
      gap: "T2 records under OS-managed prefixes (spec/decisions/HDG-, D-, CIT-, governance/generated/) are accepted as OS-written without any binding to an OS write, and task close explicitly exempts those prefixes from observed-mutation checks (A0-E1-02). The acting role itself is caller-declared (A0-E1-04, owner decision)."
    - bullet: Independent auditors/testers are appropriately constrained.
      source_line: 366
      status: PARTIAL
      implementation_evidence: [framework/roles/ROLES.yaml:34-40, runtime/src/orchestration/tasks.rs:128-166, runtime/src/orchestration/dag.rs:137-154]
      automated_evidence: [suite family authority_role_limits, certification greenfield::greenfield_end_to_end (independent_of_implementer flag)]
      independent_evidence:
        - "evidence/E1-authority.out:174-183 — independent-auditor, migration-verifier, memory-verifier, migration-reviewer (L0) are refused task create, cit propose, gate create, handoff create, checkpoint create; they can still run status, doctor, audit and memory query (exit 3 on audit is the verdict, not a refusal)"
        - "evidence/E1-authority.out:185-186 — side effect: an L0 auditor cannot run `gov continue` while a gate is pending (continue presents the gate: present_gate L1)"
        - "evidence/E1-authority.out:188-197 — the implementer role claims and closes the task designated role independent-test-designer, then claims the implementation task (189-194); an implementer-authored test obligation declaring independent_of_implementer: true unblocks the implementation task (196) — independence is a self-declared boolean"
      gap: "Verifier/auditor roles are constrained to read/verify; tester independence is not: a task's designated role is never enforced at claim/close and test-obligation independence is self-attested (A0-E1-05)."
  health_scheduler_tiers: [G0, G2, G5]
  evidence_owners: [G0, G2, G5, independent-heldout, human-gate]
  evidence_owner_actually_runs: >-
    partial — G0: authority::require + control::guard_write run inside each mutating command (not for init/adopt under
    --role, not for replan/heldout-starter); G2: task close observed-mutation scope (exempts OS-managed prefixes); G5: suite
    family authority_role_limits checks TOOL_PERMISSIONS roles, INV-014 handoffs and INV-007 allowed_paths only. No explicit
    G0-G6 scheduler exists in the product; the checks are embedded in commands and the suite.
  freshness:
    state: FRESH_FOR_CANDIDATE
    invalidation_inputs: [governing contract/policy (AUTHORITY_POLICY), runtime/kernel implementation (authority.rs, ROLES.yaml), authoritative spec/decision (spec/decisions), security/sensitivity policy (TOOL_PERMISSIONS overlay)]
    invalidation_demonstrated: true
    invalidation_evidence: "evidence/FRESH-invalidation.out:7-10 (overlay TOOL_PERMISSIONS change after a green record -> GOVERNANCE_SUITE_STALE), :17-20 (decision record added -> stale), :33-39 (kernel ROLES.yaml / AUTHORITY_POLICY.yaml edits -> KERNEL_TAMPERED on every mutation; floors read from the embedded baseline)"
  qualification_coverage:
    repo_a_challenge: "Greenfield: agents dispatched with L1/L2 roles attempt privileged operations through the CLI with --role (must be refused), and write gate/decision records directly into spec/decisions under their task (must be detected at close and never honoured)."
    repo_b_challenge: "Brownfield: run adopt A0-A11 with the executor, reviewer and verifier dispatched under their proper roles and under a lower role via --role; every privileged stage must refuse the lower role."
    hidden_oracle_fault_class: "authority escalation — seeded forged ANSWERED gate / human_approved decision / registry entry written by a worker; seeded lower-role invocation of privileged lifecycle commands; expected detection: refusal + finding, forbidden outcome: approval derived from the forged record."
    chaos_scale_soak: "concurrent sessions of different roles interleaving privileged and unprivileged operations; soak with role churn across sessions."
    retrieval_challenge: "not relevant: authority decisions never consult retrieval (D-0007 T6)."
    not_challengeable: null
  adoption_obligation: "gov init / adopt / update must verify that the acting role supplied by the adapter is the one authority is checked against (currently not so for init/adopt), that no T2 record in the adopted repository was written outside an OS operation, and post-adoption acceptance must re-run the authority census."
  residual_risk: "Until A0-E1-01/02 are closed, authority is advisory for adoption and for any agent with filesystem write access; A0-E1-04 leaves identity binding to the adapter."
  findings: [A0-E1-01, A0-E1-02, A0-E1-03, A0-E1-04, A0-E1-05]

