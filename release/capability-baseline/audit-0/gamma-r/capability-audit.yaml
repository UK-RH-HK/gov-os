- capability: E4
  title: Concurrency/task claims
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:387
  governing_document_refs:
    - DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md §11.1 (claims are deterministic memory), §44, §63 (concurrency/session claims)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: >-
    Claims survive rebuild and stale claims have governed recovery. Collision detection holds only sequentially: under true
    concurrency every one of three simultaneous sessions was told it holds the same claim in 15/15 trials (A0-E4-01).
    Parallelism is not constrained by the DAG at claim time: a dependency-blocked task was claimed and closed DONE before
    its dependency (A0-E4-02); claims carry no worktree identity and mutation overlap is never considered (A0-E4-03).
  na_reason_normative_text: null
  partial_qualification_impact: >-
    COULD_UNDERMINE. Chaos/scale/soak qualification runs multiple agents in parallel; with non-atomic claims and claim-time
    DAG bypass, duplicate work and out-of-order completion occur nondeterministically, making every concurrency, readiness
    and task-correctness measurement (V4 task/readiness correctness) unreliable.
