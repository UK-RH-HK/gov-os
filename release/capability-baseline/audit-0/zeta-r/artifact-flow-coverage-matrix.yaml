cell_status_legend:
  EVIDENCED: an executed probe observation on the exact candidate proves the cell
  PARTIAL: executed evidence proves the stated part; the rest is a gap (note)
  GAP: no behaviour, or executed evidence shows the behaviour is absent
rows_cover: 'one row per W1-named governed output type (Contract v3 line 1080): specifications (requirement, feature), scenarios, decisions, datasets, experiments,
  architecture records, interfaces, test designs, migration plans, audit findings, benchmark results, and equivalents (research records, execution reports)'
ac8_determination:
  criterion: 'AC-8 (frozen gate contract §3): Gate W has executable evidence and dedicated advanced-qualification challenges, shown by this matrix. Fails if semantic
    retrieval is relied on to rediscover mandatory inputs, if stale versions can silently satisfy downstream work, or if completion cannot be traced to upstream evidence.'
  determination: NOT_MET
  rejection_conditions:
  - condition: semantic retrieval is relied on to rediscover mandatory inputs
    triggered: true
    evidence:
    - evidence/W04b-input-class-delivery.out W4b-delivered-deterministically:experiment(derived_from) FAIL, :research(derived_from) FAIL, :interface(task.interfaces)
      FAIL (each 'reachable only via retrieved block=True'); :dataset(required_data) FAIL (not delivered at all)
    - evidence/W10-hard-invariant-attacks.out W10-a4-* FAIL (deterministic delivery depends on retrieval availability)
    scope: Not triggered for requirements, decisions, scenarios, feature-level interfaces and architecture, which are resolved from governed records independently
      of the index (W10-a1-*, W10-a2-*, W3-r4 PASS).
  - condition: stale versions can silently satisfy downstream work
    triggered: true
    evidence:
    - evidence/W03-task-input-manifest.out W3-r2-superseded-input-not-silent FAIL
    - evidence/W12-scheduler-integration.out AC16-W12xO5-health-state-reflects-superseded-consumption FAIL (DONE on SUPERSEDED input, audit HEALTHY)
    - evidence/W06-staleness-propagation.out AC16-W6xD1-rebuild-does-not-license-stale-consumption FAIL, W6-s6-* FAIL, W6-s7-retest-flag-not-cleared-by-close FAIL
    - evidence/W09-session-handoff-continuity.out W9-c6-handoff-stale-inputs-blocked-or-degraded FAIL
  - condition: completion cannot be traced to upstream evidence
    triggered: true
    evidence:
    - evidence/W05-consumption-receipt.out W5-c1-refuses-missing-traceability FAIL, W5-r3r4-fabricated-trace-refused FAIL, W5-c3-* FAIL
    - evidence/W08-lineage.out W8-l1-forward-reaches:file:src/lib.rs FAIL, W8-l2-reverse-impact(*)->implementation FAIL, ->evidence FAIL
  dedicated_challenges: 'Every row carries a dedicated advanced-qualification challenge id (W-QC-*) proposed here; the Gate W challenge of Contract v3 line 1194 is
    covered as: omit current specs from index (W-QC-REQ, W10), superseded specs with higher similarity (W-QC-REQ, W10), change specs after implementation (W-QC-REQ/SCN/ARCH/API),
    move files keeping ids (W1 challenge), omit task dependency declarations (W3 challenge), code without consumption receipts (W5 challenge, W-QC-RPT), contradictory
    mandatory inputs (W-QC-DEC), context pressure (W4/W10), model/session switch (W9), orphan authoritative outputs (W-QC-RES, W7). Hidden-fault generation remains
    Phase 4 (frozen contract §7).'
  cell_counts:
    EVIDENCED: 24
    PARTIAL: 55
    GAP: 61
