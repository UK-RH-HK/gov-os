  - evidence/W01b-migration-plan-identity.out (W1-b1/b2/b4/b6/b7/b8/b9-migplan-* FAIL, W1-b8-migplan-replan-keeps-history FAIL)
  reproduction: 'from the worktree root: ~/.cargo/bin/cargo build --release; then cd release/capability-baseline/audit-0/zeta-r/evidence && python3 W01-artefact-identity.py  (or
    ./run-all.sh for every probe)'
  repair_direction: Every W1-named governed output type, including migration plans and audit findings, must carry a stable id, type, version/hash, producer and supersession
    lineage that survive re-generation, and records outside their type's canonical location must be reported (Contract v3 lines 1069-1080).
  owner_decision_required: false
  owner_decision_reason: null
- id: A0-W2-01
  capability:
  - W2
  - W1
  - W6
  bullet_source_lines:
  - 1078
  - 1090
  - 1133
  severity: MEDIUM
  title: Relation fields consumers/producers/task produce inverted edges; required_data/influences produce none
  statement: 'RELATION_FIELDS maps `X.consumers: [T]` to the edge `X CONSUMES T`, `X.producers: [P]` to `X PRODUCES P` and `report.task: T` to `report PRODUCES T`,
    i.e. the reverse of their meaning; impact from a producer therefore never reaches its declared consumers while a change to the consumer propagates to the producer.
    `required_data` and `influences` create no edge, so a dataset change reaches none of the tasks that declare it; `acceptance_tests` yields ''<task> VALIDATED_BY
    <test>'', which impact does not follow from the test back to the task, and tasks have no edge to the architecture records delivered to them, so changes to an
    acceptance-test obligation or an architecture record reach no task through impact traversal.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:1090 'Relationships such as EVIDENCE_FOR, CONSTRAINS, IMPLEMENTS, TESTS, GENERATES, VALIDATES,
    SUPERSEDES or equivalent are machine-usable'; Governance_OS_Capability_Acceptance_Contract_v3.md:1133 'graph/CIT computes impacted downstream nodes'
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  - AC-8
  blocking: true
  blocker_class: W2/relation-edge-semantics
  new_vs_residual: BASELINE
  evidence:
  - evidence/W02-typed-contracts.out (W2-b8-consumes-direction-not-inverted FAIL)
  - evidence/W06-staleness-propagation.out (W6-s4-graph-impact(dataset consumed via task.required_data) FAIL)
  - evidence/W05-consumption-receipt.out (W5-c3-report-task-edge-direction FAIL)
  - evidence/W04b-input-class-delivery.out (W4b-impact-reaches-declaring-task:DATA-0001 FAIL, :TST-0002 FAIL, :ARCH-0001 FAIL; :EXP-0001/:RES-0001/:API-0009 PASS)
  reproduction: 'from the worktree root: ~/.cargo/bin/cargo build --release; then cd release/capability-baseline/audit-0/zeta-r/evidence && python3 W02-typed-contracts.py  (or
    ./run-all.sh for every probe)'
  repair_direction: Every relation field must yield an edge whose direction matches its meaning, and every declared upstream-input field of a task (including required_data)
    must yield an edge that impact traversal follows from the producer to the consumer (Contract v3 lines 1090, 1133).
  owner_decision_required: false
  owner_decision_reason: null
