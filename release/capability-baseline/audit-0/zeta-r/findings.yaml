  title: Stable identity missing for migration plans and audit findings; no provenance on authored records; misplaced records undetected
  statement: The adoption migration plan (spec/audits/GOVERNANCE-ADOPTION/05-plan.yaml) has no id, type, status, version, producer or supersession lineage and is
    rewritten in place when A4 is re-run; audit findings receive positional ids (GF-nnnn) that change when another finding precedes them on the next run; requirement/feature/scenario/decision/data/experiment/architecture/interface/test-obligation
    records and tasks created by `gov task create` carry no producer/provenance; a requirement stored under spec/scenarios/ is loaded and delivered with no finding.
  normative_source: 'Governance_OS_Capability_Acceptance_Contract_v3.md:1069-1080 ''Every material output that may feed downstream work has: stable artefact ID ...
    artefact type ... canonical path ... producer/provenance ... supersedes/superseded-by lineage'' and ''Applies to ... migration plans, audit findings ...'''
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  - AC-8
  blocking: true
  blocker_class: W1/identity-incomplete-for-listed-types
  new_vs_residual: BASELINE
  evidence:
