  severity: MEDIUM
  title: No required/optional distinction; authority class dropped on entry to the authority block; no schema-defined consumption rules
  statement: A task cannot mark an upstream input required or optional, and the compiler silently discards declared inputs that are absent or of an unexpected type
    (a research record or scenario listed under requirements vanishes). The deterministic authority block omits state_class, so a NARRATIVE-class record listed as
    a requirement is presented as governing authority. No output schema states what downstream stages may consume; consumption is decided by hard-coded type filters.
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:1084 'Required vs optional dependency is explicit.'; Governance_OS_Capability_Acceptance_Contract_v3.md:1085
    'Authority semantics are preserved across stages.'; Governance_OS_Capability_Acceptance_Contract_v3.md:1089 'Output schemas define what downstream stages may
    consume.'
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
