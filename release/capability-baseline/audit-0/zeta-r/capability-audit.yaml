    - evidence/W04b-input-class-delivery.out W4b-benchmark-result-consumed-by-decision PASS
    gap: null
  - bullet: Lessons cannot silently become authoritative policy.
    source_line: 1087
    status: PRESENT_AND_SUBSTANTIAL
    implementation_evidence:
    - runtime/src/policy.rs (policies from kernel + overlay only)
