- capability: W2
  title: Typed output → input contracts
  source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:1082
  governing_document_refs:
  - framework §2 (authority precedence)
  - framework §15.1/15.2 (deterministic vs retrieved)
  - framework §45 (research must become evidence)
  - framework §68 (decision versus lesson)
  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: 'Relationships are explicit typed edges and are used by impact traversal; research cannot become a decision and lessons cannot become policy.
    Not met: no required/optional marker exists (declared inputs of an unexpected type, or absent ones, are dropped silently); a NARRATIVE-class record is placed
    unmarked in the deterministic authority block; superseded/historical requirements reached through a structured reference replace/accompany current ones unflagged;
    no output schema defines what downstream stages may consume; consumers/producers/report.task produce inverted edges and required_data/influences produce none.'
  na_reason_normative_text: null
  partial_qualification_impact: 'COULD_UNDERMINE: the oracle ''defines the correct required input/version and expected downstream propagation'' (Contract v3 line
    1194); inverted/missing edges give wrong propagation (evidence/W06-staleness-propagation.out W6-s4-graph-impact(dataset...) FAIL) and stale structured references
    deliver superseded inputs (evidence/W02-typed-contracts.out W2-b6-stale-requirement-cannot-replace-current FAIL).'
  bullets:
  - bullet: Upstream/downstream relationship type is explicit.
    source_line: 1083
    status: PRESENT_AND_SUBSTANTIAL
    implementation_evidence:
    - runtime/src/records.rs:9-39 (RELATION_FIELDS)
    - runtime/src/records.rs:227-267 (relations())
    - runtime/src/graph/mod.rs:7-28 (EDGE_TYPES)
    automated_evidence:
    - cargo test --lib records::tests::parse_yaml_and_markdown_records (ok)
    independent_evidence:
    - evidence/W02-typed-contracts.out W2-b1-typed-edges PASS
    gap: null
  - bullet: Required vs optional dependency is explicit.
    source_line: 1084
    status: ABSENT
    implementation_evidence:
    - framework/schemas/task.schema.json (no required/optional marker)
    - runtime/src/context/mod.rs:132-138 (collect() silently filters wrong-type/absent ids)
    automated_evidence: []
    independent_evidence:
    - evidence/W02-typed-contracts.out W2-b2-required-optional-marker FAIL, W2-b2-declared-input-drop-is-explicit FAIL
    gap: No field or behaviour distinguishes a required from an optional upstream dependency; every declared input is silently optional.
  - bullet: Authority semantics are preserved across stages.
    source_line: 1085
    status: PARTIAL
    implementation_evidence:
    - runtime/src/context/mod.rs:10-34 (brief omits state_class)
    - runtime/src/context/mod.rs:62-92 (superseded decision flag)
    automated_evidence:
    - cargo test --test certification repair::context_packet_layers_and_contradiction_flags (ok)
    independent_evidence:
