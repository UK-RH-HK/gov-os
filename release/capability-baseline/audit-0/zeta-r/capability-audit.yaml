  - bullet: Relationships such as `EVIDENCE_FOR`, `CONSTRAINS`, `IMPLEMENTS`, `TESTS`, `GENERATES`, `VALIDATES`, `SUPERSEDES` or equivalent are machine-usable.
    source_line: 1090
