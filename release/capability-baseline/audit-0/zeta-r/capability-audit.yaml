  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: 'A task declares required input ids (requirements, decisions, scenarios, interfaces, dependencies) and they are resolved deterministically,
    independent of the index. Not met: no way to declare required authority/lifecycle state, version/hash constraints, per-dependency reason or supplementary context;
    a task becomes READY (create, status, replan) and is claimable with absent mandatory inputs (only task->task dependencies block in replan, and direct promotion
    bypasses even that); superseded inputs satisfy the task silently; conflicting mandatory inputs are flagged in the packet/audit but trigger no handling.'
  na_reason_normative_text: null
