    gap: null
  - bullet: Historical/retrieved material cannot replace current authoritative input.
    source_line: 1088
    status: PARTIAL
    implementation_evidence:
    - runtime/src/retrieval/mod.rs:499-512 (retrieval excludes superseded/historical)
    - runtime/src/context/mod.rs:47-50,132-138 (requirements collected without status check)
    automated_evidence:
