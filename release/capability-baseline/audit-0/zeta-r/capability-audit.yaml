  requirement_class: ORIGINAL
  status: PARTIAL
  status_justification: 'Governed YAML/Markdown records (requirements, features, scenarios, decisions, data, experiments, architecture, interfaces, test obligations,
    tasks, research) carry a stable id, type, status and state_class, get a content hash in the tracked index manifest, keep their id across a git mv, and record
    supersession lineage. Not met for every W1-named type: the adoption migration plan (05-plan.yaml) has no id/type/status/version/provenance/lineage and is overwritten
    in place; audit findings get positional GF-nnnn ids that change between runs; hand-authored spec records and `gov task create` tasks carry no producer/provenance;
    a record stored in another type''s canonical directory is not detected; expected consumers are recordable but become inverted CONSUMES edges.'
  na_reason_normative_text: null
  partial_qualification_impact: 'COULD_UNDERMINE: the Gate W challenge''s hidden oracle ''defines ... expected downstream propagation'' (Contract v3 line 1194); a
    producer''s declared consumers are stored as ''<producer> CONSUMES <consumer>'' so impact from the producer never reaches them (evidence/W02-typed-contracts.out
    W2-b8-consumes-direction-not-inverted), and Repo B (brownfield) qualification runs through migration plans that have no stable identity or version lineage (evidence/W01b-migration-plan-identity.out).'
