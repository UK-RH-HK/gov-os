    - evidence/W02-typed-contracts.out W2-b3-provisional-decision-marked PASS
    - evidence/W02-typed-contracts.out W2-b6-stale-decision-flagged PASS
    gap: state_class is dropped when a record enters the deterministic authority block, so non-authoritative records are presented as authority.
  - bullet: Research evidence cannot silently become a decision.
    source_line: 1086
    status: PRESENT_AND_SUBSTANTIAL
    implementation_evidence:
    - runtime/src/context/mod.rs:70-74 (only type=decision enters decisions)
    - runtime/src/memory/benchmark.rs:147-183 (research -> decision only through a new decision record)
    automated_evidence: []
    independent_evidence:
