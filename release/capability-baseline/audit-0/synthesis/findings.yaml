- id: S0-W5-01
  capability:
  - W5
  - N4
  - E3
  severity: MEDIUM
  blocker_class:
  - BC-P2-20
  title: A worker return that satisfies the worker-return schema cannot be used as the task-close receipt
  statement: 'worker-return.schema.json requires status in {success, partial, failed, blocked}; task close persists the report as a record whose status must be a lifecycle status. Passing
    a schema-valid worker return (accepted by `gov handoff return`) to `gov task close --report` fails SCHEMA_INVALID (''/status: "success" is not one of ["ACTIVE", ...]''). The structured
    result survives (N4 holds), but the worker''s return cannot be the consumption receipt, so discoveries/unresolved/deviations recorded in it never reach close (beta-r OBS-3, reproduced).'
  normative_source: Contract v3:1115-1126 (W5 'Worker/task return records ... Task close refuses missing mandatory traceability'); :385 (E3 typed handoffs persist); :745 (N4).
  provenance_class: NECESSARY-DERIVED
  blocking: true
  evidence:
  - evidence/AC16-X2-authority-gate-chain.out [X2-N4xW5-worker-return-usable-at-close]
  reproduction: SYNTH_SCRATCH=$(mktemp -d) python3 release/capability-baseline/audit-0/synthesis/evidence/AC16-X2-authority-gate-chain.py
  repair_direction: The worker return and the task-close receipt must be one consumable contract (or a lossless, validated mapping), so the receipt W5 requires is the worker's own structured
    return (Contract v3:1115-1126).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-8
  - AC-3
  owner_decision_required: false
  owner_decision_reason: null
