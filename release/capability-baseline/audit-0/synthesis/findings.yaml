findings:
- id: S0-AC13-01
  capability:
  - all 101 (contract binding chain)
  severity: MEDIUM
  blocker_class:
  - BC-P2-01
  title: '`gov contract verify` cannot detect semantic divergence; the compiled-form schema cannot represent Gate U'
  statement: contracts::verify (runtime/src/contracts.rs:167-245) checks the canonical import's digest and byte identity, the lock's source digests, and that the compiled YAML equals
    a fresh run of the same headings-only compiler; it never reads the evidence map or the generated view, and it has no reference to the owner source's checklist, fields or labels,
    so a compiled form with 0 of 344 substantive bullets, no Gate U and misclassified O5/V1-V4 verifies CONTRACT_SOURCE_BOUND. The compiled-form schema's id pattern ^[A-Z]+[0-9]+$ rejects
    'U', so the present schema cannot carry the full owner universe.
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:43 'valid only when contract-source.lock proves that it was compiled/validated from the exact approved source';
    :47 'Any semantic difference between source and compiled representation is a hard failure.'; frozen gate contract AC-13.
  provenance_class: ORIGINAL-NORMATIVE
  blocking: true
  evidence:
  - evidence/AC01-09-13-14-universe-identity-binding.py
  - evidence/AC01-09-13-14-universe-identity-binding.out ([AC-13] lines)
  reproduction: python3 release/capability-baseline/audit-0/synthesis/evidence/AC01-09-13-14-universe-identity-binding.py
  repair_direction: Verification of the binding chain must fail whenever the compiled form, the evidence map or the generated view differs semantically from the owner source (every capability
    section including Gate U, every checklist bullet, every Contract v3:53-73 field, every requirement-class label), not only when it differs from the compiler's own output (Contract
    v3:43, :47).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-13
  owner_decision_required: false
  owner_decision_reason: null
  new_vs_residual: BASELINE
- id: S0-B1B3-01
  capability:
  - B1
  - B3
  - D6
  - C1
  severity: MEDIUM
  blocker_class:
  - BC-P2-31
  title: The product classifies the stores of claims, emergency-control state and the OS plugin registry as derived/generated
  statement: REPOSITORY_CONTRACT (framework/overlay-templates/REPOSITORY_CONTRACT.yaml:140) classifies `.governance-runtime/**` as `derived`, which holds claims.db (C1 lists 'claims'
    as current truth) and control.json (FREEZE_WRITES/PAUSE); `governance/generated/**` (`generated`) holds plugin-registry.json, which D-0007 names T2 authoritative OS-written state.
    docs/ARCHITECTURE.md:76 says everything in .governance-runtime/ is derived and rebuildable while :119-120 says claims and control state are not touched by rebuild. beta-r's D6 probe
    (re-run identical) shows deleting what the product declares derived loses the claim and lifts FREEZE_WRITES. B1:188 and B3:202 were recorded PRESENT_AND_SUBSTANTIAL by alpha-r; both
    are corrected to PARTIAL.
  normative_source: Contract v3:188 'Generated/runtime state is distinguished from authoritative tracked state.'; :202 'Deleting derived state cannot delete project truth.'; :213-227
    (C1 claims); :352 'Fresh rebuild preserves authoritative structured state and claims where required.'; spec/decisions/D-0007.yaml T2.
  provenance_class: ORIGINAL-NORMATIVE
  blocking: true
  evidence:
  - evidence/AC16-X2-authority-gate-chain.out [X2-B1B3-nonrebuildable-state-not-classified-derived]
  - release/capability-baseline/audit-0/beta-r/evidence/D6-rebuild-guarantee.out (re-run identical)
  reproduction: SYNTH_SCRATCH=$(mktemp -d) python3 release/capability-baseline/audit-0/synthesis/evidence/AC16-X2-authority-gate-chain.py
  repair_direction: Non-rebuildable authoritative state (claims, emergency-control state, OS plugin registration) must be stored and classified as authoritative (or protected) state
    that survives deletion of every path the product classifies derived or generated, and the product's own documentation and repository contract must agree (Contract v3:188, :202, :352).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  owner_decision_required: false
  owner_decision_reason: null
  new_vs_residual: BASELINE
- id: S0-I4-01
  capability:
  - I4
  - U
  severity: MEDIUM
  blocker_class:
  - BC-P2-16
  title: A task whose status is BLOCKED is in the runnable set and is offered by `gov continue`
  statement: 'After `gov task status TASK-B BLOCKED`, `gov task dag` lists TASK-B in runnable and `gov continue` returns NEXT_WORK TASK-B (task_status BLOCKED). delta-r observed this
    (L4-non-global-blocking OBSERVE L4.b2.3a, re-run identical) and passed it on; gamma-r recorded I4 bullet 587 ''runnable/blocked sets'' PRESENT_AND_SUBSTANTIAL. I4 is corrected: bullet
    587 PARTIAL, qualification impact COULD_UNDERMINE (V4 ''task/readiness correctness'' and the U HEALTHY condition ''task runnable/blocked state correct'' score it).'
  normative_source: Contract v3:587 'runnable/blocked sets'; :1003 'task runnable/blocked state correct'; :1060 'task/readiness correctness'.
  provenance_class: ORIGINAL-NORMATIVE
  blocking: true
  evidence:
  - evidence/AC16-X2-authority-gate-chain.out [X2-I4-blocked-not-runnable], [X2-I4-continue-does-not-offer-blocked]
  reproduction: SYNTH_SCRATCH=$(mktemp -d) python3 release/capability-baseline/audit-0/synthesis/evidence/AC16-X2-authority-gate-chain.py
  repair_direction: A task in a blocked state must be excluded from the runnable set and from next-work selection until the state that blocks it is resolved (Contract v3:587).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  owner_decision_required: false
  owner_decision_reason: null
  new_vs_residual: BASELINE
- id: S0-E1-01
  capability:
  - E1
  - L3
  severity: HIGH
  blocker_class:
  - BC-P2-08
  title: An invocation that declares no role acts as the L4 orchestrator
  statement: 'Every command''s --role defaults to $GOV_ROLE or ''orchestrator'' (project.rs:40-49; CLI help ''Acting role (default: $GOV_ROLE or orchestrator)''); a process that declares
    nothing performs L4-only operations (gate revoke succeeded with no role) and, combined with `gov decide`''s --by default ''human'', records human approval.'
  normative_source: DYNAMIC_AGENTIC_SOFTWARE_ENGINEERING_OPERATING_FRAMEWORK_v4.1.2.md §23 'No spawned worker behaves as an orchestrator unless explicitly assigned that role.'; Contract
    v3:364 'Role authority is checked on every privileged/mutating path.'
  provenance_class: ORIGINAL-NORMATIVE
  blocking: true
  evidence:
  - evidence/AC16-X2-authority-gate-chain.out [X2-E1-undeclared-role-is-not-orchestrator], [X2-L3-fabrication-default]
  reproduction: SYNTH_SCRATCH=$(mktemp -d) python3 release/capability-baseline/audit-0/synthesis/evidence/AC16-X2-authority-gate-chain.py
  repair_direction: An invocation without an explicitly assigned role must not receive orchestrator (or any privileged) authority, and no default may yield a human answer (framework
    §23; Contract v3:364, :679).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  owner_decision_required: false
  owner_decision_reason: null
  new_vs_residual: BASELINE
- id: S0-F4-01
  capability:
  - F4
  - D5
  severity: HIGH
  blocker_class:
  - BC-P2-40
  title: A registered, gate-approved, elevated plugin in module form has no implementation pin; post-approval code swaps run undetected
  statement: 'An embed plugin with command [python3, -m, synthplug], permissions network true and required_permission_classes [NETWORK_READ] was registered through a presented, human-answered
    registration gate; its registry entry has implementation_files [] and implementation_sha256 null. After its module source was replaced, `gov capabilities invoke` ran the new code
    (it wrote SWAPPED_IMPLEMENTATION_RAN.txt) with no PLUGIN_PIN_MISMATCH, and doctor D028 reported ''no plugin problems''. Cause: capabilities/governance.rs:79-122 hashes only command
    arguments that resolve to local files, and the registered-implementation check is skipped when the registered hash is null. The `python3 -m` form is the one the shipped capability
    templates document (beta-r OBS-1).'
  normative_source: Contract v3:428 'Descriptor/implementation bytes are hash-bound.'; :429 'Drift/tampering fails closed.'; ARCH-0003 §9 'their bytes and descriptor identity are bound
    through kernel-owned registration/policy'.
  provenance_class: OWNER-ADDED-NORMATIVE
  blocking: true
  evidence:
  - evidence/LEAD-X4-registered-module-plugin-unpinned.py
  - evidence/LEAD-X4-registered-module-plugin-unpinned.out
  reproduction: SYNTH_SCRATCH=$(mktemp -d) python3 release/capability-baseline/audit-0/synthesis/evidence/LEAD-X4-registered-module-plugin-unpinned.py
  repair_direction: Every executable plugin's implementation bytes (including module-form and interpreter-only commands) must be bound in the registration, and any change must fail closed
    at execution and be reported by health checks (Contract v3:428-429).
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-4
  - AC-3
  owner_decision_required: false
  owner_decision_reason: null
  new_vs_residual: BASELINE
