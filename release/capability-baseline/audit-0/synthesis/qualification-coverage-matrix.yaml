    the active one
  chaos_scale_soak: 'not relevant: policy precedence is a deterministic per-load evaluation'
  retrieval_challenge: a superseded decision with higher semantic similarity must never displace the active decision in the deterministic authority block
  not_challengeable: null
  proposed_by: P2-AR-0013
  complete: true
