run_id: P2-AR-0007
note: Pre-qualification coverage plan (frozen contract AC-11). Challenges were proposed by the owning family audits of record and checked here for completeness and for a not-challengeable
  route where a synthetic repository cannot exercise the capability. No hidden fault is generated in Phase 2.
determination:
  capabilities: 101
  incomplete: []
  AC-11: HOLDS
capabilities:
