findings:

  - id: A0-F5-01
    capability: F5
    bullet: "No layer silently substitutes for another."
    severity: LOW
    blocking: false
    owner_decision_required: false
    title: "MCP/A2A/Knowledge Fabric separation is architectural, not runtime-invariant"
    description: >-
      F5 requires that MCP (action), A2A (communication) and Knowledge Fabric (knowing) are
      explicitly separated with no silent substitution. The implementation separates tools
      (kernel_tools, project_tools, plugin_tools, mcp_servers) from A2A handoffs
      (orchestration/handoffs.rs) and knowledge retrieval (memory/, retrieval/) into distinct
      code paths, modules and registries. However, the assertion that no layer silently
      substitutes for another is enforced by code structure (separate modules, separate
      registries, separate CLI surfaces) rather than a runtime invariant or fail-closed check.
      A future code path could route an A2A communication through a tool call without triggering
      an explicit violation.
    partial_qualification_impact: CANNOT_UNDERMINE
    partial_qualification_justification: >-
      The actual code paths are separate today, and no existing path crosses the boundary.
      The gap is a missing runtime guard for future-proofing, not a live bypass. The
      qualification criteria require the layers to be separated, and they are; the absence
      of a dedicated invariant check does not undermine the current separation.
    evidence_refs:
      - evidence/F5-separation.out
    recommendation: >-
      Add a runtime type tag (e.g. InvocationType::Tool | InvocationType::A2A |
      InvocationType::Retrieval) to all dispatch paths, with an assertion that a request
      tagged as one type cannot be routed through another type's handler.

  - id: A0-H4-01
    capability: H4
    bullet: "FEATURE -> SCENARIOS -> DATA -> TEST DATA -> SUCCESS/FAILURE -> INDEPENDENT TESTS."
    severity: LOW
    blocking: false
    owner_decision_required: false
    title: "test_data/success_criteria/failure_criteria are readiness dimensions, not schema fields"
    description: >-
      H4 requires the full traceability chain: FEATURE -> SCENARIOS -> DATA -> TEST DATA ->
      SUCCESS/FAILURE -> INDEPENDENT TESTS. The feature schema has `scenarios` and
      `acceptance_tests` fields, and the DAG enforces TEST_POLICY requirements
      (scenarios_present, acceptance_tests_declared, independent_test_author_required_for).
      However, `test_data`, `success_criteria` and `failure_criteria` are not dedicated
      fields in the feature schema (feature.schema.json). They are captured as readiness
      dimensions in READINESS_DIMENSIONS.yaml and enforced through the H2 readiness contract
      rather than as explicit schema-level fields in the feature record.
    partial_qualification_impact: CANNOT_UNDERMINE
    partial_qualification_justification: >-
      The traceability chain is enforced through the readiness contract (H2), which rejects
      silent N/A and blocks implementation when pre-implementation dimensions are MISSING.
      The chain is functionally present; it uses dimension-level enforcement rather than
      schema-level fields, which is a design choice rather than a live gap.
    evidence_refs:
      - evidence/H4-scenarios.out
    recommendation: >-
      Consider adding `test_data`, `success_criteria` and `failure_criteria` as optional
      fields in feature.schema.json to make the traceability chain explicit at the schema
      level, even though it is already enforced through readiness dimensions.

  - id: A0-I3-01
    capability: I3
    bullet: "retrieval failures / security findings / performance regressions"
    severity: LOW
    blocking: false
    owner_decision_required: false
    title: "3 of 11 generation sources produce findings, not governed tasks"
    description: >-
      I3 lists 11 generation sources that should dynamically produce work. Of these, 8 are
      executably evidenced as automatic task/record generators (readiness gaps, CIT effects,
      lessons, missing tools/skills, human decisions, failed tests, audit findings via doctor
      remediation, research discoveries). Three sources -- retrieval failures, security
      findings, and performance regressions -- produce detection/findings/degraded-status
      rather than automatically creating governed tasks. Specifically:
      (1) Retrieval failures are detected by verification/mod.rs as retrieval regressions
      but produce verification findings rather than governed tasks.
      (2) Security findings are detected by doctor.rs which produces findings with a
      remediation field but does not automatically create governed tasks.
      (3) Performance regressions have no automatic detection/generation path.
    partial_qualification_impact: CANNOT_UNDERMINE
    partial_qualification_justification: >-
      The detection mechanisms exist for 2 of the 3 sources, and the doctor's remediation
      field provides guidance. The gap is between detection and automatic task creation: a
      human or orchestrator can create tasks from the findings. This is a maturity gap
      (detection without automation) rather than a missing capability. It cannot undermine
      qualification because the work can still be generated manually from the findings.
    evidence_refs:
      - evidence/I3-dynamic-generation.out
    recommendation: >-
      For retrieval failures and security findings, add automatic task generation from the
      detection output (similar to how readiness gaps create gap tasks). For performance
      regressions, add a performance check to the doctor or CIT pipeline that creates
      governed tasks when regression is detected.
