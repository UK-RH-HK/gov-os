  - evidence/U-slos-and-healthy.out (SLO-2)
  - evidence/O5-scheduler-requirements.out (S6)
  reproduction: 'From the worktree root after `~/.cargo/bin/cargo build --release`: bash release/capability-baseline/audit-0/epsilon-r/evidence/O1-product-families.sh'
  repair_direction: Per-family product-test results must be recorded as governed, freshness-bound evidence; a failing family must change the health state and block task close for work it covers; test outcome
    at close must be verified from recorded evidence, not self-attested; a failed suite must not be reported as a successful command (Contract v3 O1, U; framework §62, §76 item 9).
