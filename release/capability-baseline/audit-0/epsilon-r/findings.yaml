  title: 'G0 guard incomplete: mutating commands run under FREEZE_WRITES/PAUSE and outside the caller''s authority; `init --force` by an L0 role reinstalls the kernel and wipes project policy'
  statement: 'Across 49 commands, 15 change state while FREEZE_WRITES is active and 14 while PAUSED (excluding the control commands themselves). Governed writes among them: audit/verify governance (spec/audits),
    memory heldout-starter --force (governance/tests), adapters generate/tools registry (governance/generated), adopt baseline, init --force (kernel, framework.lock, PROJECT_POLICY), route --record (mints
    a human gate), gate present, task release, upstream prepare. `init` evaluates authority on a Project opened without the caller''s --role (init.rs:227-231, 259), so independent-auditor (L0) runs `init
    --force` (install_kernel requires L4), which rewrote framework.lock and the kernel manifest and reset a project policy override to {}; L0 also regenerated the held-out test set, deleting a verifier-authored
    query, and ran `adopt baseline` while frozen (a0_baseline has neither guard nor authority check). By code, the CLI passes no role to any adopt stage: A6/A8/A9 honour FREEZE but evaluate authority for
    $GOV_ROLE or the default orchestrator (adopt.rs:594-595, 984-985, 1146-1147; project.rs:40-50) — not exercised as L0 in this run.'
