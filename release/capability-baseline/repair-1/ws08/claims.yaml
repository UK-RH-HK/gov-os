claims:
  - class: BC-P2-35
    title: Post-install integrity detects consistent rewrites against this machine's protected record
    status: REPAIRED_CLAIMED
    scope_note: >-
      Enforced on machines holding a trust anchor. On an unprovisioned machine the record is itself unauthenticated;
      that sub-case is OD-P2-02 (with the owner) and is reported (DIVERGED_NOT_ENFORCED), not enforced.
    files:
      - runtime/src/srr/installation.rs
      - runtime/src/kernel_trust.rs
      - runtime/src/kernel.rs
      - runtime/src/srr/state.rs
      - runtime/src/srr/mod.rs
    product_checks:
      - kernel_trust::guard (every governed mutation via control::guard_write) — KERNEL_TAMPERED on an enforced divergence, KERNEL_UNANCHORED when no record of a verification binds the kernel on a provisioned machine
      - kernel_trust::trusted_root (every policy read) — embedded baseline substituted while untrusted
      - kernel::verify_kernel — enforced divergence folded into ok/modified; feeds doctor D003, audit mutation_scope, update --rollback kernel_ok, adopt checks
      - doctor D029 (existing, via kernel_trust)
      - kernel::install_kernel — pending/current per-project record around the atomic swap; KERNEL_PIN_REWRITTEN before the swap
      - srr::installation::anchor_for / divergence (digest-level, ARCH-0003 §2)
    tests:
      - tests/certification/ws08.rs::a_consistent_post_install_rewrite_is_detected_against_the_protected_record
      - tests/certification/ws08.rs::a_machine_that_did_not_install_the_project_verifies_the_pinned_release_first
      - runtime/src/srr/installation.rs tests (6 of 8)
    probes_rerun:
      - probe: alpha-r A2-03-post-install-tamper [T2]
        before: "kernel verify ok=True trust.verified=True; task create ok; doctor DEGRADED (D003 intact); audit mutation_scope HEALTHY"
        after: "kernel verify ok=False modified=[SECURITY_POLICY.yaml] trust.verified=False substituted; task create KERNEL_TAMPERED; doctor UNHEALTHY; audit UNHEALTHY"
        evidence: evidence/probes-after-63f82ba/A2-03.out
      - probe: AC16-X3 X3c-A2:146-consistent-rewrite-detected
        before: FAIL
        after: PASS
        evidence: evidence/probes-after-63f82ba/AC16-X3.out
      - probe: AC16-X3 X3d-A2xE1xL3-rewrite-cannot-lower-gate-authority
        before: FAIL
        after: "not graded — probe TypeError: its gate is created after the rewrite and gate creation is itself refused (KERNEL_TAMPERED); property measured by WS08-P1 [R1c] PASS"
        evidence: evidence/probes-after-63f82ba/AC16-X3.out; evidence/ws08-probes-after-63f82ba.out
      - probe: WS08-P1-post-install-integrity (supplementary)
        before: "1/15 PASS on the base binary"
        after: "15/15 PASS"
        evidence: evidence/ws08-probes-after-63f82ba.out; evidence/ws08-probes-negative-control-base-c6b60bc.out
    integration_points: [IP-5]
    owner_decision_required: false
    owner_decision_note: "unprovisioned sub-case follows OD-P2-02 (already with the owner); enforcement switch is `enforced: provisioned` in anchor_posture/divergence_posture"
  - class: BC-P2-36
    title: No unauthenticated installation presented as current or verified (presentation and disclosure part only)
    status: REPAIRED_CLAIMED
    scope_note: >-
      Presentation/disclosure only, per P2-HO-0017. Admission on unprovisioned machines is unchanged (OD-P2-02).
      Doctor's verdict and audit findings require checks in WS-2's files (IP-1, IP-2); the API they call is delivered
      and unit-tested here. AC16-X3 X3a-A2:150xU-no-masquerade passes its presentation half now and its doctor half
      once IP-1 is wired.
    files:
      - runtime/src/srr/present.rs
      - runtime/src/srr/installation.rs
      - runtime/src/srr/verifier.rs
      - runtime/src/srr/mod.rs
    product_checks:
      - srr::present::presentation — every command-result envelope, doctor payload, update --check, context packet (PRESENTED_UNAUTHENTICATED + disclosure)
      - srr::present::attach — rewrites a "nothing to do" recommendation for an unauthenticated installation
      - srr::verifier::record_installed — the machine-level verified record is written only for an authenticated install (gov status shows no verified_release for UNKNOWN)
      - srr::status — installations listed with their authenticity
      - srr::installation::doctor_check / posture_of (API for IP-1 / IP-2 / IP-4)
    tests:
      - tests/certification/ws08.rs::an_unauthenticated_installation_is_never_presented_as_current
      - runtime/src/srr/installation.rs::tests::the_doctor_check_is_in_doctor_shape_and_fails_when_authenticity_is_not_established
      - runtime/src/srr/present.rs::tests (updated)
    probes_rerun:
      - probe: alpha-r A2-01-unprovisioned-posture [U2]
        before: "envelope presented_as CURRENT; gov status verified_release 4.1.5; doctor release_trust CURRENT without disclosure"
        after: "envelope presented_as UNAUTHENTICATED; gov status verified_release null; doctor release_trust UNAUTHENTICATED with disclosure"
        evidence: evidence/probes-after-63f82ba/A2-01.out
      - probe: alpha-r A2-01 [U3]
        before: "embedded init UNKNOWN"
        after: "embedded init UNKNOWN (admission unchanged, OD-P2-02); presented UNAUTHENTICATED (WS08-P2 P1f)"
        evidence: evidence/probes-after-63f82ba/A2-01.out
      - probe: alpha-r A2-01 [U4]
        before: "self-identified source built with --certification CERTIFIED installs UNKNOWN"
        after: "probe KeyError: the CERTIFIED build is refused (BC-P2-37); C7 in WS08-P3 shows the unsigned self-identified source is still refused on a provisioned machine"
        evidence: evidence/probes-after-63f82ba/A2-01.out
      - probe: AC16-X3 X3a-A2:150xU-no-masquerade
        before: "FAIL (presented_as CURRENT, doctor HEALTHY)"
        after: "FAIL on the doctor half only (presented_as UNAUTHENTICATED, doctor HEALTHY) — PASS requires IP-1"
        evidence: evidence/probes-after-63f82ba/AC16-X3.out
      - probe: AC16-X3 X3a-S3xA2-unprovisioned-refuses-unauthenticated
        before: FAIL
        after: "FAIL — admission part is OD-P2-02, deliberately unchanged"
        evidence: evidence/probes-after-63f82ba/AC16-X3.out
      - probe: WS08-P2-presentation (supplementary)
        before: "2/8 PASS on the base binary (P2a, P3a are controls)"
        after: "8/8 PASS"
        evidence: evidence/ws08-probes-after-63f82ba.out
    integration_points: [IP-1, IP-2, IP-4, IP-5]
    owner_decision_required: false
    owner_decision_note: admission part is OD-P2-02 (already with the owner); not touched
  - class: BC-P2-37
    title: No trust decision from unauthenticated release fields; lock records verified identity and its basis
    status: REPAIRED_CLAIMED
    files:
      - runtime/src/update.rs
      - runtime/src/release.rs
      - runtime/src/lock.rs
      - runtime/src/kernel.rs
      - runtime/src/srr/verifier.rs
      - framework/schemas/framework-lock.schema.json
    product_checks:
      - update::check — certification only from srr::verifier::certification_of (signed evidence.certification under the release role); identity/compatibility from the payload KERNEL.yaml
      - update::bind_decision_to_admitted — UPDATE_TARGET_CHANGED / UPDATE_CERTIFICATION_NOT_BOUND / UPDATE_GATE_CHANGED
      - release::build — RELEASE_CERTIFICATION_REQUIRES_SIGNED_METADATA before any write
      - release::verify — effective_status authenticated or UNCERTIFIED
      - lock::write_lock / release_identity — authenticity, sequence, channel, release_metadata_sha256, identity_basis; release_commit signed › embedded constant › unverified; source decided by content
      - kernel::embedded_payload_hash / is_embedded_dir — path-independent embedded identity
    tests:
      - tests/certification/ws08.rs::certification_is_taken_only_from_the_trust_root
      - tests/certification/ws08.rs::framework_lock_records_the_verified_identity_and_its_basis
      - tests/certification/repair2.rs (two lock-identity assertions updated; see report §5)
      - runtime/src/kernel.rs::tests::the_embedded_payload_digest_is_what_staging_measures
      - runtime/src/update.rs::tests::certification_claims_are_recognised_in_every_spelling
    probes_rerun:
      - probe: alpha-r A2-04 [L1]
        before: "framework.lock.release_commit = f00dface… (forged unsigned value)"
        after: "forged value not recorded; authenticity/sequence/channel/metadata digest recorded with identity_basis"
        evidence: evidence/probes-after-63f82ba/A2-04.out
      - probe: alpha-r A2-04 [L2]
        before: "unsigned CERTIFIED waives the gate; update applied with no gate; L1 mints CERTIFIED"
        after: "UNCERTIFIED, human_gate_required True, HUMAN_GATE_REQUIRED; minting refused"
        evidence: evidence/probes-after-63f82ba/A2-04.out
      - probe: alpha-r A2-04 [L3]
        before: "lock carries authenticity/sequence/channel/metadata digest: False"
        after: "True"
        evidence: evidence/probes-after-63f82ba/A2-04.out
      - probe: alpha-r A2-04 [L4a-c]
        before: "identity varies with XDG_CACHE_HOME (embedded / source+unknown / consumer HEAD)"
        after: "identical embedded:…@4.1.5 + binary commit in all three"
        evidence: evidence/probes-after-63f82ba/A2-04.out
      - probe: alpha-r S6-cross-machine [X3]
        before: "XDG_CACHE_HOME without .cache: identity differs from A"
        after: "identity equal to A"
        evidence: evidence/probes-after-63f82ba/S6-cross-machine.out
      - probe: alpha-r 00-regression-variant-xdg-cache
        before: "certification 78/79 (repair2::framework_lock_is_release_identifying_and_portable fails)"
        after: "certification 86/86"
        evidence: evidence/regression-before-base-c6b60bc.out; evidence/regression-after-63f82ba.out
      - probe: WS08-P3-certification-and-lock-identity (supplementary)
        before: "2/11 PASS on the base binary"
        after: "11/11 PASS"
        evidence: evidence/ws08-probes-after-63f82ba.out
    integration_points: [IP-5, IP-6]
    owner_decision_required: false
  - class: BC-P2-38
    title: Provisioned-machine rollback and failure atomicity
    status: REPAIRED_CLAIMED
    scope_note: >-
      Floors, break-glass and the exit policy are unchanged. Residual until IP-3: on the reinstall path the verifier
      enters break-glass (marking + nonce) before it learns the project's pin; the refused reinstall leaves the
      installation unchanged but the machine marked until an at-floor reinstall clears it.
    files:
      - runtime/src/srr/verifier.rs
      - runtime/src/srr/installation.rs
      - runtime/src/kernel.rs
      - runtime/src/update.rs
      - runtime/src/srr/state.rs
    product_checks:
      - srr::verifier::admit offline path — authenticity from the verified-release ledger (records of verifications only), then the floor check / break-glass as before
      - kernel::pinned_release_check — KERNEL_MISMATCH / KERNEL_PIN_REWRITTEN before the swap, staging abandoned
      - srr::verifier::AdmissionRequest::with_pinned_payload — pin refusal ahead of break-glass (for IP-3)
      - update::apply_update_opts — snapshot removed on refused admission; protected record restored on transaction abort
      - update::rollback_internal — verified kernel committed first
    tests:
      - tests/certification/ws08.rs::a_provisioned_machine_rolls_back_to_a_release_it_verified
      - tests/certification/ws08.rs::refused_lifecycle_commands_leave_the_installation_as_they_found_it
      - runtime/src/srr/installation.rs::tests::{the_ledger_keeps_the_highest_signed_sequence_for_the_same_bytes, an_unknown_installed_record_vouches_for_nothing}
    probes_rerun:
      - probe: alpha-r A2-02 [P9] update --rollback after an authentic update
        before: SRR_RELEASE_UNVERIFIED
        after: "SRR_BELOW_FLOOR (authenticated from the ledger; the owner's floor refuses)"
        evidence: evidence/probes-after-63f82ba/A2-02.out
      - probe: alpha-r A2-08 [V1]-[V3]
        before: "refused after commit: kernel 4.1.6 under lock 4.1.5, trust.verified False, mutations KERNEL_TAMPERED"
        after: "refused before the swap: kernel 4.1.5 = lock, verified, mutations ok"
        evidence: evidence/probes-after-63f82ba/A2-08.out
      - probe: alpha-r A2-05 [K6a]
        before: "mixed installation (older kernel, newer lock), KERNEL_TAMPERED"
        after: "kernel = lock = newer, verified; machine marked DEGRADED (residual, IP-3); exit reinstall clears it"
        evidence: evidence/probes-after-63f82ba/A2-05.out
      - probe: alpha-r A2-05 [K6b]
        before: "update applied via unsigned CERTIFIED gate waiver; rollback SRR_RELEASE_UNVERIFIED"
        after: "probe's update now stops at its gate (BC-P2-37) so rollback finds SNAPSHOT_MISSING; re-established with the gate walked in WS08-P4 [K1]: restored 4.1.5 PREVIOUSLY_VERIFIED_BY_THIS_MACHINE, DEGRADED, high-water unchanged"
        evidence: evidence/probes-after-63f82ba/A2-05.out; evidence/ws08-probes-after-63f82ba.out
      - probe: WS08-P4-rollback-and-atomicity (supplementary)
        before: "4/11 PASS on the base binary"
        after: "11/11 PASS"
        evidence: evidence/ws08-probes-after-63f82ba.out
    integration_points: [IP-3, IP-5]
    owner_decision_required: false
