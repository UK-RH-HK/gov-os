    status: REPAIRED_CLAIMED
    note: G5 full suite replaces the four-family post-install audit (refuse UNHEALTHY/RED/critical, rolled back); entry guard not taken because it refuses the update that remedies kernel/overlay blocks (D006 on 4.1.1) — IP-R2-WS08-5; abort-path record ordering fixed
    files: [runtime/src/update.rs]
    tests: [tests/certification/ws08_r2.rs::an_update_over_a_defect_the_full_suite_detects_is_refused_and_rolled_back, tests/certification/ws08_r2.rs::below_floor_restoration_by_update_still_completes_with_the_g5_post_install_suite]
  - id: IP-WS02-13
    status: REPAIRED_CLAIMED
    note: G0 guard + G5 when the canonical root is a governed installation; otherwise the absence is recorded, never claimed
    files: [runtime/src/release.rs]
    tests: [tests/certification/ws08_r2.rs::a_release_is_built_only_from_a_contract_bound_tree_and_verified_as_written]
  - id: IP-WS02-14
    status: REPAIRED_CLAIMED
    note: init advances the floors before its conformance run; WS-2 may add the installed records to machine_trust (IP-R2-WS08-4)
    files: [runtime/src/init.rs]
  - id: IP-WS02-15
    status: REPAIRED_CLAIMED
    note: embedded kernel cache verified against the listing before re-use; per-call private staging; atomic publish
    files: [runtime/src/kernel.rs]
    tests: [runtime/src/kernel.rs::tests::a_kernel_cache_is_reused_only_when_it_is_exactly_the_embedded_listing, tests/certification/ws08_r2.rs::a_corrupt_or_racing_embedded_kernel_cache_is_never_installed]
    probes_rerun: [{probe: integration cold_cache_scheduler.py, after: 17/17, evidence: evidence/concurrency/cold_cache_scheduler.after-cf13dee.out}]
  - id: IP-WS02-16
    status: NOT_REPAIRED
    reason: the scenario-check file carries a planted AKIA secret literal that the kernel's own scanner flags once installed (7 certification tests failed), and KERNEL.yaml of 4.1.5 is pinned by release/releases/4.1.5; routed as IP-R2-WS08-6
  - id: IP-2
    status: REPAIRED_CLAIMED
    note: a present capability-contract chain that does not verify refuses the release build; a tree without the chain is recorded INCOMPLETE_IN_THIS_TREE (not bound, not evidence-eligible) because the payload ships no contract view and release tooling builds from payload-only trees; built release verified as written
    files: [runtime/src/release.rs]
    tests: [tests/certification/ws08_r2.rs::a_release_is_built_only_from_a_contract_bound_tree_and_verified_as_written]
  - id: IP-7
    status: REPAIRED_CLAIMED
    note: update honours its gate only through gates::verified_answer (a verified declining answer declines); init checks authority at the ingress with the embedded-kernel resolution
    files: [runtime/src/update.rs, runtime/src/init.rs]
    tests: [tests/certification/ws08_r2.rs::update_applies_only_on_a_verified_authorising_answer]
  - id: IP-16
    status: NOT_REPAIRED
    reason: a product-release governed record needs a record type/relations (WS-4) and a classified CLI command (WS-3); release.rs builds Governance OS kernel releases, which belong to no governed project; routed as IP-R2-WS08-7
