note: >-
  Builder claims only (Contract v3 O3). REPAIRED_CLAIMED means the builder believes the stated requirement is met by the
  listed product checks, with the listed evidence; acceptance is decided by fresh independent verifiers. Evidence paths
  are relative to release/capability-baseline/repair-1/r2-ws08/.
claims:
  - class: BC-P2-36
    part: admission (OWNER-DECISION-P2-0002 requirements 1 and 2)
    title: No external-source kernel ingress on an unprovisioned machine; the embedded payload only as marked bootstrap
    status: REPAIRED_CLAIMED
    files:
      - runtime/src/srr/verifier.rs
      - runtime/src/srr/installation.rs
      - runtime/src/srr/mod.rs
      - runtime/src/kernel.rs
      - runtime/src/lock.rs
      - runtime/src/update.rs
      - framework/schemas/framework-lock.schema.json
    product_checks:
      - srr::verifier::admit (unprovisioned branch) at every privileged ingress — SRR_UNPROVISIONED_EXTERNAL_SOURCE_REFUSED unless the staged payload digest is kernel::embedded_payload_hash(); otherwise bootstrap admission with kernel::binary_identity()
      - srr::verifier::refuse_external_source_if_unprovisioned — update --apply before its Human Decision Gate; update --check `admission`
      - srr::installation::{posture_of, presentation_disclosures} via srr::present::presentation — BOOTSTRAP / NOT ADMITTED disclosures on every envelope, doctor payload, update --check, context packet
      - lock::release_identity — framework.lock `admission`
      - srr::status — `admission_policy`, installations' `admission`
    probes_rerun:
      - probe: synthesis AC16-X3 X3a-S3xA2-unprovisioned-refuses-unauthenticated
        before: FAIL (init_ok true, authenticity UNKNOWN)
        after: PASS (refused SRR_UNPROVISIONED_EXTERNAL_SOURCE_REFUSED)
        evidence: evidence/COMPARE-probes-before-base-843d79c-vs-after-cf13dee.out
      - probe: alpha-r A2-01 [U2] / [U3]
        before: "[U2] tampered release admitted UNKNOWN, never_index_classes []; [U3] embedded ok UNKNOWN"
        after: "[U2] refused typed before staging; [U3] embedded ok UNKNOWN (bootstrap admission)"
        evidence: evidence/probes-after-cf13dee/A2-01.out
      - probe: alpha-r A2-04 [L3]
        before: unknown-install established_by 'installed on a machine with no ... anchor'
        after: admission BOOTSTRAP_EMBEDDED_PAYLOAD, established_by 'a BOOTSTRAP installation ...'; authentic row SIGNED_RELEASE_METADATA
        evidence: evidence/probes-after-cf13dee/A2-04.out
      - probe: round-1 WS08-P2 (presentation)
        before: 8/8
        after: 8/8
        evidence: evidence/ws08-round1-probes-after-cf13dee/WS08-P2.out
    tests:
      - tests/certification/ws08_r2.rs::an_unprovisioned_machine_refuses_external_source_kernel_ingress_at_every_ingress
      - tests/certification/ws08_r2.rs::the_bootstrap_installation_is_marked_tied_to_the_binary_and_never_presented_as_current
      - tests/certification/ws08_r2.rs::a_provisioned_machine_never_installs_in_bootstrap_mode
    integration_points: [IP-R2-WS08-2, IP-R2-WS08-3, IP-R2-WS08-10, IP-R2-WS08-11]
    owner_decision_required: false
  - class: BC-P2-35
    part: unprovisioned sub-case (OWNER-DECISION-P2-0002 Effect paragraph)
    title: Post-install integrity on an unprovisioned machine is held to the bootstrap record / the binary's payload
    status: REPAIRED_CLAIMED
    scope_note: >-
      Confirmed that no external-source install remains possible on an unprovisioned machine. The residual report-only
      cases of round 1 (a consistent rewrite of an installation this machine made; kernel material it never admitted)
      are now enforced (DIVERGED / UNADMITTED), because leaving them report-only would let external kernel material act
      as T1 without passing an ingress. Provisioned decisions unchanged.
    files:
      - runtime/src/srr/installation.rs
      - runtime/src/kernel_trust.rs
      - runtime/src/kernel.rs
    product_checks:
      - srr::installation::anchor_posture / divergence_posture — MATCHED (bootstrap record or embedded payload), DIVERGED enforced, UNADMITTED
      - kernel_trust::guard — KERNEL_TAMPERED (divergence), KERNEL_UNANCHORED with OWNER-DECISION-P2-0002 remediation (UNADMITTED)
      - kernel_trust::trusted_root — embedded baseline substituted while untrusted
    probes_rerun:
      - probe: synthesis AC16-X3 X3c-* (provisioned consistent rewrite)
        before: PASS
        after: PASS
        evidence: evidence/probes-after-cf13dee/AC16-X3.out
      - probe: round-1 WS08-P1 R2a
        before: PASS (round-1 report-only behaviour)
        after: FAIL by design (divergence now enforced on an unprovisioned machine)
        evidence: evidence/ws08-round1-probes-after-cf13dee/WS08-P1.out
    tests:
      - tests/certification/ws08_r2.rs::a_consistent_rewrite_of_a_bootstrap_installation_fails_closed
      - tests/certification/ws08_r2.rs::an_unprovisioned_machine_does_not_trust_kernel_material_it_never_admitted
      - runtime/src/srr/installation.rs::tests::an_unprovisioned_divergence_is_enforced_since_owner_decision_p2_0002
      - runtime/src/srr/installation.rs::tests::an_unprovisioned_machine_admits_only_a_bootstrap_installation_or_the_embedded_payload
    integration_points: [IP-R2-WS08-11]
    owner_decision_required: false
  - class: OWNER-DECISION-P2-0002-R3
    title: Harness, fixtures and documentation provision a throw-away root ("provision, then install")
    status: PARTIAL
    scope_note: >-
      Harness (tests/certification/common.rs, every certification test's setup) and fixture READMEs done. The
      documentation outside fixtures/ (README.md, docs/COMMANDS.md, docs/FIXTURES.md, docs/ARCHITECTURE.md) is owned by no
      workstream in this round and was not edited; the exact text is IP-R2-WS08-1.
    files:
      - tests/certification/common.rs
      - tests/certification/{arch,brownfield,failure_injection,greenfield,migration,multi_machine,repair,repair2,repair3,update,upstream,ws03}.rs (calls to the helpers)
      - fixtures/*/README.md
    product_checks: []
    probes_rerun: []
    tests:
      - "cargo test --test certification: 110/110 default and xdgcache (evidence/regression-after-cf13dee-*-cert-{a,b}.out)"
    integration_points: [IP-R2-WS08-1, IP-R2-WS08-12]
    owner_decision_required: false
  - class: OWNER-DECISION-P2-0002-R4
    title: Release-relevant evidence runs on provisioned machines
    status: PARTIAL
    scope_note: release build records the building machine's posture and eligibility; the qualification (G6) entry is WS-2's (IP-R2-WS08-8)
    files: [runtime/src/release.rs]
    product_checks: [release::build — PRE_RELEASE_CHECKS.json machine_posture / release_evidence_eligible]
    probes_rerun: []
    tests: [tests/certification/ws08_r2.rs::a_release_is_built_only_from_a_contract_bound_tree_and_verified_as_written]
    integration_points: [IP-R2-WS08-8]
    owner_decision_required: false
integration_points_routed_to_ws08:
