  # ---------------------------------------------------------------- P2-HO-0048 item 1 (R4-O1)
  - item: R4-O1
    source: P2-AR-0053
    status: OWNER_DECISION_REQUIRED
    what: >-
      The adjacent path P2-AR-0043 recorded and was checking when it stopped. A probe on the unchanged base confirms
      the gap: `gov tools install` writes `governance/project/tools/<id>.yaml`, and an installation made inside a
      claimed task is refused at the close with `MATERIAL_CHANGE_REQUIRES_CIT` (`governance_change`), exactly as the
      plugin descriptor was in INT3-O1 — refused, never let through unattributed. The INT3-O1 mechanism is extended
      to it (`install_tool` manifest operation, `cit::propose_installation`, `tools::apply_installation` as the CIT-E
      side, `tools::install_write` as the one writer asking the §6 sink at its write), and the close then accepts the
      installation on the transaction's recorded writes.
    owner_decision_required: >-
      Adopting it narrows an accepted requirement. Under the shipped CHANGE_POLICY a `governance_change` needs a
      human gate, so a review-evidenced installation — which IP-W7-1 / BC-P2-41 recorded as completing with "no gate
      raised" — now completes through its change transaction's own gate. No accepted source resolves K3 ("impact
      simulation auto-triggers for material governance/security changes") against IP-W7-1 ("a governed security
      review satisfies the condition without the owner's gate") for this path, so P2-AR-0053 states the choice and
      does not take it. The two answers are: (a) accept the narrowing — IP-W7-1 means no gate for the INSTALLATION
      subject, and the change gate stands as for any governance change (what the branch implements); or (b) keep
      IP-W7-1 literally, which needs a rule no source states — a pre-authorisation of this change class in
      CHANGE_POLICY, or tool descriptors ceasing to be a material governance change.
    evidence_in: 01-CONTINUATION-REPORT.md §2; evidence/r4-o1/
