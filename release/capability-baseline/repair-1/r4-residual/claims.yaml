  # ---------------------------------------------------------------- P2-HO-0048 item 1 (R4-O1)
  - item: R4-O1
    source: P2-AR-0053
    status: OWNER_DECISION_REQUIRED
    answered_by: >-
      OD-P2-03 (product owner, 2026-09-20; owner gate HG-P2-0002). The owner chose neither (a) nor (b) as stated
      below but a third reading: gate only ELEVATED installs. See the OD-P2-03 claim at the end of this file
      (source P2-AR-0055). This entry is left as P2-AR-0053 recorded it.
    what: >-
      The adjacent path P2-AR-0043 recorded and was checking when it stopped. A probe on the unchanged base confirms
      the gap: `gov tools install` writes `governance/project/tools/<id>.yaml`, and an installation made inside a
      claimed task is refused at the close with `MATERIAL_CHANGE_REQUIRES_CIT` (`governance_change`), exactly as the
      plugin descriptor was in INT3-O1 — refused, never let through unattributed. The INT3-O1 mechanism is extended
      to it (`install_tool` manifest operation, `cit::propose_installation`, `tools::apply_installation` as the CIT-E
      side, `tools::install_write` as the one writer asking the §6 sink at its write), and the close then accepts the
      installation on the transaction's recorded writes.
    owner_decision_required: >-
      Adopting it narrows an accepted requirement. Under the shipped CHANGE_POLICY a `governance_change` needs a
      human gate, so a review-evidenced installation — which IP-W7-1 / BC-P2-41 recorded as completing with "no gate
      raised" — now completes through its change transaction's own gate. No accepted source resolves K3 ("impact
      simulation auto-triggers for material governance/security changes") against IP-W7-1 ("a governed security
      review satisfies the condition without the owner's gate") for this path, so P2-AR-0053 states the choice and
      does not take it. The two answers are: (a) accept the narrowing — IP-W7-1 means no gate for the INSTALLATION
      subject, and the change gate stands as for any governance change (what the branch implements); or (b) keep
      IP-W7-1 literally, which needs a rule no source states — a pre-authorisation of this change class in
      CHANGE_POLICY, or tool descriptors ceasing to be a material governance change.
    evidence_in: 01-CONTINUATION-REPORT.md §2; evidence/r4-o1/

  # ---------------------------------------------------------------- P2-HO-0050 (owner decision OD-P2-03)
  - item: OD-P2-03
    source: P2-AR-0055
    answers: R4-O1
    supersedes: "the unconditional gating of ab0a075 (its change-control machinery is kept)"
    status: REPAIRED_CLAIMED
    what: >-
      A tool installation's change transaction needs a Human Gate only when the installation EXPANDS AUTHORITY, as
      the product owner decided (OD-P2-03, governed record spec/decisions/D-0011.yaml). The rule is governed data,
      not code: CHANGE_POLICY.change_classes.tool_installation names the change class, the five non-gated conditions
      - each mapped to the TOOL_POLICY.auto_install_conditions entry that decides it, so shortening that list can
      never satisfy the rule - the six authority-expansion triggers, the trusted envelope sources and
      fail_closed: true; TOOL_POLICY.installation_envelope supplies the authorised envelope, with the approved
      registries and allowlisted services in the kernel tool registry (tools/registry/TOOLS.yaml network_allowlist)
      because registry hostnames are ecosystem knowledge that INV-005 keeps out of kernel policy; ENFORCEMENT_MAP
      names what enforces both policy keys; both are immutable under the unchanged POLICY_PRECEDENCE catch-alls,
      and the registry is verified kernel payload. The envelope is
      computed by tools::installation_authority from trusted OS state alone (TOOL_PERMISSIONS, AUTHORITY_POLICY,
      DATA_SENSITIVITY/SECURITY_POLICY, the path map, the tool policy's lists) and what the installation WOULD hold
      is derived from the request AND from what the OS can observe of its own commands, so nothing a descriptor
      declares authorises it (Contract v3 F4, BC-P2-39). Anything that cannot be evaluated is an expansion and
      gates. cit::simulate_inner records the verdict - which branch applied and why - in the transaction's BOUND
      impact (binding::impact_of now covers it) and raises the transaction's gate only when it is required;
      cit::approve_with approves a pre-authorised transaction above auto_approve_max_radius only on that bound
      verdict and names the rule and the owner decision in the auto-approval decision record; the installed
      descriptor's approval.authorised_by carries the owner decision, the governed record, the branch, the bound
      independent review and the transaction; tools::apply_installation derives the verdict again at CIT-E and
      refuses TOOL_INSTALL_ELEVATED, rolling back, if the installation would now expand authority and no gate
      approved the transaction. BC-P2-41's own installation gate, TOOL_POLICY's conditions, the plugins block and
      the policy-precedence rules are unchanged.
    tests: >-
      ws07::a_governed_security_review_by_another_role_lets_the_installation_proceed returns to asserting that no
      gate is raised, with its tool inside the envelope, and now also asserts what the transaction recorded. New:
      r4_residual::a_tool_installation_is_gated_for_each_way_it_expands_authority (each of the six triggers, one
      cause each, plus the non-elevated control),
      r4_residual::ordinary_allowlisted_network_use_does_not_gate_but_a_new_boundary_does (the owner's own control,
      in three states), r4_residual::an_installation_whose_envelope_changed_after_simulation_is_refused_at_the_write
      (fail closed at the instant of the write), and lib
      tools::tests::the_os_reads_an_installations_own_commands_for_what_it_would_hold.
    evidence_in: 02-OD-P2-03-REPORT.md; evidence/regression-0055/; evidence/r1-heldout-0055/; evidence/identity-and-scope-0055.out
