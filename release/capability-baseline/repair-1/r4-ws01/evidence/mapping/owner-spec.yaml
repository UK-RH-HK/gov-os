# Frozen AC-10, second sentence: for each Contract v3:97-109 freshness trigger in use, the owners that prove changing
# that input makes prior green evidence stale (BC-P2-03's mechanism, built in rounds 1-3), with what each proves.
freshness_invalidation:
  - trigger: "governing contract/policy"
    owners: ["test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class", "test:certification:repair::embedder_pin_change_escalates_to_full_rebuild_without_mixed_index"]
    proves: "kernel and project policy files are their own currency classes of the green-evidence key (unit), and a project-policy pin change invalidates the index and blocks task close (end to end)"
  - trigger: "runtime/kernel implementation"
    owners: ["test:certification:ws08_r2::an_update_over_a_defect_the_full_suite_detects_is_refused_and_rolled_back", "test:lib:verification::currency::tests::non_file_classes_are_keyed_and_never_file_classes"]
    proves: "a kernel change (update) re-runs the G5 full suite fresh instead of trusting prior green results; the runtime identity is a keyed class"
  - trigger: "schema"
    owners: ["test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class", "test:lib:verification::currency::tests::snapshot_attributes_changes_to_classes_and_ignores_its_own_outputs"]
    proves: "kernel schemas are their own class; any change of a class's files changes the key and is attributed to that class (unit; the attribution is shown for four classes)"
  - trigger: "migration"
    owners: ["test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class", "test:lib:verification::currency::tests::snapshot_attributes_changes_to_classes_and_ignores_its_own_outputs"]
    proves: "kernel migrations are their own class; a class change changes the key (unit)"
  - trigger: "tool/plugin"
    owners: ["test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class", "test:certification:ws07::every_byte_a_plugin_executes_is_bound"]
    proves: "plugin descriptors and the tool registry are their own class (unit); a changed plugin byte fails closed until re-approved (end to end)"
  - trigger: "model/retrieval profile"
    owners: ["test:certification:repair::embedder_pin_change_escalates_to_full_rebuild_without_mixed_index", "test:certification:ws06::embedder_components_are_identified_bound_and_fail_closed_on_change"]
    proves: "a changed embedder pin or model artefact makes the index stale, blocks task close and forces a full re-embed"
  - trigger: "project path map"
    owners: ["test:certification:ws06r3::freshness_judges_exactly_what_the_indexer_indexes", "test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class"]
    proves: "lifting a path-map exclusion makes index freshness stale; the repository contract is its own class"
  - trigger: "authoritative spec/decision"
    owners: ["test:certification:ws05r3::stale_inputs_are_seen_propagated_at_claim_and_cleared_only_by_retest_evidence", "test:certification:ws04r2::upstream_change_reaches_completed_work", "test:lib:verification::currency::tests::snapshot_attributes_changes_to_classes_and_ignores_its_own_outputs"]
    proves: "a changed authoritative input makes dependent work and its evidence stale until re-test evidence clears it"
  - trigger: "relevant source files"
    owners: ["test:lib:verification::currency::tests::snapshot_attributes_changes_to_classes_and_ignores_its_own_outputs", "test:certification:failure_injection::injected_failures_are_detected_and_recovered"]
    proves: "a source change changes the key (attributed to `source`); a file edited after indexing blocks close INDEX_STALE"
  - trigger: "relevant index manifest"
    owners: ["test:lib:verification::currency::tests::manifest_normalisation_drops_volatile_fields_only", "test:certification:failure_injection::injected_failures_are_detected_and_recovered"]
    proves: "an embedder or content change in the index manifest changes its digest while volatile fields do not; a stale index blocks close"
  - trigger: "security/sensitivity policy"
    owners: ["test:lib:verification::currency::tests::every_contract_input_class_has_an_owner_class", "test:lib:verification::currency::tests::snapshot_attributes_changes_to_classes_and_ignores_its_own_outputs"]
    proves: "DATA_SENSITIVITY is its own class; a class change changes the key (unit)"
