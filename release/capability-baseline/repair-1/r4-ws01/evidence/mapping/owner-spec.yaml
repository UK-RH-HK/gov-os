# P2-AR-0042 (BC-P2-02) — the governed evidence-owner mapping, as authored by the round-4 WS-1 builder.
#
# This file is the builder's input, not a derived view: `apply_owner_spec.py` writes it into the governed fields of
# tests/governance/capability-evidence-map.yaml (automated_checks, independent_verification, per-item automated_checks,
# freshness_invalidation) and `gov contract compile` then resolves every owner against the product, derives what the
# owners determine (evidence_class, health_scheduler_tiers, freshness_triggers, adoption/operational-audit obligations,
# remediation_rule) and binds the result in the source lock. Tiers of check/doctor owners are copied from the scheduler
# catalogue by the applier and re-checked by `gov contract verify`.
#
# Per owner: id (<kind>:<reference>), items (checklist item numbers of the capability it exercises), ex (what it
# exercises), optional class (defaults: check/doctor -> governance health check; g0 -> automated invariant/guard;
# test -> unit/integration/system test; human-gate -> human-gate evidence; release -> clean-clone/release evidence;
# heldout -> independent held-out test; obligation AC-14 -> independent held-out test, other ACs -> independent audit
# evidence), record (human-gate/release) and tests (heldout).
#
# Rule followed: an owner is named only where it exercises the capability (its duty, its assertions or its named
# scenario), never because it merely touches a file. A checklist item no owner exercises is left with no owner.

