note: >-
  Builder claims only (Contract v3 O3: builder evidence is regression evidence). Nothing here is acceptance.
  "REPAIRED_CLAIMED" means the WS-5 side of the class is implemented; each class lists the audit probe lines that
  still depend on another workstream's round-2 integration, so no reader should take the claim as "every Accept
  line passes today".
claims:
  - class: BC-P2-15
    title: Claim atomicity and claim scope
    status: REPAIRED_CLAIMED
    requirement: >-
      A claim is granted to exactly one session under concurrent attempts; the unit of isolation (session/worktree)
      is recorded; parallel claims are refused or serialised when mutation scopes overlap (Contract v3:388-392;
      repair-delta BC-P2-15; findings A0-E4-01, A0-E4-03).
    files:
      - runtime/src/memory/claims.rs
      - runtime/src/orchestration/claims.rs
      - runtime/src/orchestration/tasks.rs
      - runtime/src/status.rs
    product_checks:
      - "runtime/src/memory/claims.rs ClaimsStore::claim_exclusive — one BEGIN IMMEDIATE transaction decides TASK_CLAIMED, CLAIM_WORKTREE_MISMATCH, BUDGET_EXCEEDED and CLAIM_SCOPE_CONFLICT and writes the claim + its isolation record (runs on every `gov task claim` / `gov continue --claim`)"
      - "runtime/src/memory/claims.rs ClaimsStore::release_row / sweep_expired — conditional, transactional (a re-granted claim is never deleted by a stale holder or a sweep)"
      - "runtime/src/memory/claims.rs shared_runtime_dir — linked git worktrees share the main worktree's claims store"
      - "runtime/src/orchestration/claims.rs scopes_overlap — sound, conservative glob-intersection; unrestricted (no allowed_paths) overlaps everything"
      - "runtime/src/orchestration/tasks.rs close — CLAIM_REQUIRED / TASK_CLAIMED / CLAIM_WORKTREE_MISMATCH (L3 --force records overrides); observe() attributes concurrent claims' and in-window closes' changes"
      - "runtime/src/status.rs partition_for_session — gov continue offers only work the session can claim, with deferred reasons"
      - "unit tests (cargo test --lib): memory::claims::tests::{concurrent_processes_claiming_one_task_grant_exactly_one, concurrent_claims_of_one_task_grant_exactly_one, overlapping_scopes_of_other_sessions_are_refused_and_disjoint_ones_granted, budget_is_decided_in_the_same_transaction, a_claim_is_bound_to_its_worktree_and_renewal_keeps_claimed_at, release_and_sweep_only_touch_the_rows_they_decided_on, legacy_store_is_migrated, linked_worktrees_share_the_main_worktree_store}; orchestration::claims::tests::{disjoint_directories_do_not_overlap, nested_equal_and_wildcard_scopes_overlap, overlap_is_sound_against_glob_match, unrestricted_scope_is_described_and_contains_everything}"
    probes_rerun:
      - probe: gamma-r E4-claims.sh E4.b2.race
        before: "SUMMARY: trials=15 more-than-one-session-told-it-holds-the-claim=12 exactly-one=3 none=0"
        after: "SUMMARY: trials=15 more-than-one-session-told-it-holds-the-claim=0 exactly-one=15 none=0 (TRIALS=50: 0 / 50 / 0)"
        evidence: [evidence/probe-reruns/gamma-r/E4-claims.pre-repair.out, evidence/probe-reruns/gamma-r/E4-claims.repaired.out, evidence/probe-reruns/gamma-r/E4-claims.TRIALS50.repaired.out]
      - probe: gamma-r E4-claims.sh E4.b5 mutation overlap
        before: "second session's claim of TASK-M2 (src/**) while TASK-M1 (src/**) is held -> exit=0 ok=true"
        after: "-> exit=1 code=CLAIM_SCOPE_CONFLICT (TASK-M1, session S-m1, scope [\"src/**\"])"
        evidence: [evidence/probe-reruns/gamma-r/E4-claims.repaired.out]
      - probe: gamma-r E4-claims.sh E4.b1 schema line
        before: "CREATE TABLE claims (task_id, session_id, role, claimed_at, expires_at)"
        after: "unchanged by design: the five-column claims table is kept so positional writers keep working (epsilon-r O2 fault injection); the isolation unit and scope are in claim_isolation and shown by `gov claims list` / the claim result (supplementary WS5-A4)"
      - probe: ws05_supplementary.py WS5-A1..A9
        before: "pre-repair binary: 9 of the 10 claim checks FAIL (A9 is a control)"
        after: "all PASS"
        evidence: [evidence/supplementary/ws05-supplementary.pre-repair.out, evidence/supplementary/ws05-supplementary.repaired.out]
    integration_points:
      - "WS-1 (tests/governance/capability-evidence-map.yaml): map E4 'claim collision'/'parallel work' to the unit tests above and to evidence/probes/ws05_supplementary.py"
      - "WS-2 (runtime/src/doctor.rs D017 text): the store path of a linked worktree is the main worktree's .governance-runtime/claims.db (D026 already prints ClaimsStore.path)"
      - "WS-3 (BC-P2-08, A0-A5-01): `control::guard_write(p, \"task release\")?` at the top of tasks::release — not added here (R1/§6 allow-list semantics are WS-3's)"
      - "WS-5 round 3 (BC-P2-16): tasks::claim should consult dag::compute so dependency/blocks/required-input gates also bind the claim"
    residuals_and_limits:
      - "A task that declares no allowed_paths has an unrestricted scope and overlaps every other claim: such tasks run one session at a time (conservative reading of Contract v3:392). Audit fixtures built on unscoped tasks change accordingly (E4.b4 TASK-D, I4.b5 second agent, alpha-r A4 [B2], alpha-r A5 [E2], delta-r L3 abort at L3.b5.9) — see 00-REPAIR-REPORT.md §4."
      - "Claims are machine-local (one store per repository per machine); clones on different machines do not share claims (unchanged design, E4.b3)."
      - "Session and role identity are caller-declared (BC-P2-08 / OD-P2-01)."
    owner_decision_required: []

  - class: BC-P2-14
    title: Task-contract fields and path scope enforced
    status: REPAIRED_CLAIMED
    requirement: >-
      blocks orders work; required data and tools gate readiness; production merge is refused where not permitted
      (experiments); a mutation outside a task's allowed paths is accepted only when a CIT governing that specific
      change covers it (Contract v3:563-569, :614; repair-delta BC-P2-14; findings A0-I2-01, A0-I2-02); the task's
      designated role is enforced (handoff P2-HO-0015).
    files:
      - runtime/src/orchestration/dag.rs
      - runtime/src/orchestration/tasks.rs
      - runtime/src/status.rs
      - tests/certification/greenfield.rs
    product_checks:
      - "runtime/src/orchestration/dag.rs compute — `A.blocks = [B]` is the edge B->A (blocked reason, replan BLOCKED, cycles, longest chain; dangling_blocks); InputResolver gates required_data (governed record in a current lifecycle status, or a repository path/glob inside the repo), required_tools (registered and active: kernel/project registry, MCP registry, capability plugins) and required_skills"
      - "runtime/src/orchestration/tasks.rs close — PRODUCTION_MERGE_NOT_ALLOWED when a task with production_merge_allowed false (every experiment task, whatever its record says) closes with observed mutations in the production tree (is_production_path)"
      - "runtime/src/orchestration/tasks.rs cit_window_paths / scope_violations — a CIT covers an out-of-scope path only if it was committed after this task's claim baseline (bound exactly by the baseline's list of already-committed CITs)"
      - "runtime/src/orchestration/tasks.rs establish_baseline / carry_forward — renewal keeps the baseline; release and takeover carry the window's mutations into the next baseline (no laundering by re-claiming)"
      - "runtime/src/orchestration/tasks.rs reserved_scope — the close is held to the scope the claim reserved (a task record widened after the claim cannot widen it)"
      - "runtime/src/orchestration/tasks.rs designated_role_refusal / create — ROLE_NOT_DESIGNATED at claim and close (L3 --force records the override); UNKNOWN_ROLE at create"
      - "runtime/src/status.rs partition_for_session — continue does not offer a task designated for another role"
    probes_rerun:
      - probe: gamma-r I1I2-tasks.sh I2.b3 (blocks)
        before: "TASK-BLOCKED-BY-FULL runnable: True"
        after: "TASK-BLOCKED-BY-FULL runnable: False"
      - probe: gamma-r I1I2-tasks.sh I2.b6 (required tools/skills)
        before: "TASK-FULL runnable despite TOOL-DOES-NOT-EXIST and SKL-DOES-NOT-EXIST: True"
        after: "... : False"
      - probe: gamma-r I1I2-tasks.sh I2.b8.x
        before: "exit=0 ok=true (src/**-only task rewrote REQ-0001 and closed)"
        after: "exit=1 code=CLAIM_REQUIRED — in this fixture TASK-LATER's claim is refused (TASK-FULL, src/**, is still claimed by another session), so the close is refused before the scope rule is reached; the scope rule itself is shown by supplementary WS5-B8 (MUTATION_SCOPE_VIOLATION naming REQ-0001) with WS5-B8b as control"
      - probe: gamma-r I1I2-tasks.sh I2.b9 (experiment into production)
        before: "exit=0 ok=true"
        after: "exit=1 code=CLAIM_REQUIRED (same fixture effect as I2.b8.x); the merge rule is shown by delta-r J2.merge.enforced and supplementary WS5-B6/B6b"
      - probe: delta-r J1-J2-research-experiments.py J2.merge.enforced
        before: FAIL
        after: "PASS (PRODUCTION_MERGE_NOT_ALLOWED naming product/gateway_async.py)"
      - probe: delta-r J1-J2-research-experiments.py J2.merge.detected
        before: FAIL
        after: "FAIL — needs a governance-suite finding (WS-2 verification/**); API provided: tasks::production_merge_findings"
      - probe: gamma-r I1I2-tasks.sh I2.b4 required_data in the context packet / I2.b9 production merge in the packet
        before: "False / False"
        after: "False / False — the context packet is WS-4's runtime/src/context/**; API provided: tasks::contract_enforcement"
      - probe: gamma-r E1-authority.sh E1.b4.b (designated role)
        before: "backend-engineer claims and closes the independent-test-designer task: exit=0 / exit=0"
        after: "claim ROLE_NOT_DESIGNATED; close CLAIM_REQUIRED"
      - probe: gamma-r F2F3-tools.sh (h)
        before: "TASK-NEEDS-TOOL runnable: True"
        after: "TASK-NEEDS-TOOL runnable: False"
      - probe: ws05_supplementary.py WS5-B1..B11
        before: "pre-repair binary: every non-control check FAIL"
        after: "all PASS"
        evidence: [evidence/supplementary/ws05-supplementary.pre-repair.out, evidence/supplementary/ws05-supplementary.repaired.out]
    integration_points:
      - "WS-4 (runtime/src/context/mod.rs, deterministic authority block): add `\"task_contract\": crate::orchestration::tasks::contract_enforcement(p, &store, task)` — makes required_data / required_tools resolution, blocked_by, designated role and production_merge_allowed visible to the worker (gamma-r I2.b4, I2.b9)"
      - "WS-2 (runtime/src/verification/mod.rs): one high finding per entry of `crate::orchestration::tasks::production_merge_findings(p, &store)` (delta-r J2.merge.detected: experimental output committed into the production tree after its close was refused); optionally a finding per `dag.dangling_blocks` entry"
      - "WS-4 (round-2 receipt validation into tasks.rs): CIT execution records the content it wrote per path; tasks::observe / scope_violations then accept an out-of-scope path only when its current hash equals the in-window CIT's recorded after-hash (content binding of 'that specific change')"
      - "WS-3 (round-2 T2 primitive into tasks.rs): the attribution rules trust OS-managed records (CIT records, close reports, task records) exactly as the pre-existing CIT exemption did; forging them is BC-P2-09"
      - "WS-1: evidence-map entries for I2 (blocks, required inputs, production merge, path scope, designated role) -> evidence/probes/ws05_supplementary.py and the product checks above"
      - "WS-5 round 3 (BC-P2-16): the claim itself should refuse a DAG-blocked task (blocks / required inputs currently gate the DAG, replan and continue, not a direct `task claim`)"
    residuals_and_limits:
      - "Content binding of CIT coverage is not closed in round 1: a worker that modifies a path again after an in-window CIT touched it is covered by that CIT until the WS-4 receipt integration lands."
      - "A worker able to forge OS-managed records (spec/tasks, spec/reports, spec/decisions/CIT-*) can still defeat the scope checks — pre-existing BC-P2-09 mechanism."
      - "The production tree is everything outside the repository contract's spec/, archive/ and governance/ roots and outside the evidence, narrative, historical, generated, derived and runtime-data classes; root-level files (README.md, Cargo.toml) count as production."
      - "required_tools checks registration and active status, not binary availability or per-role approval; required_data checks existence/lifecycle, not version or hash constraints (BC-P2-17)."
    owner_decision_required: []
