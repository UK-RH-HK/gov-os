claim_semantics: >-
  Builder claims only (Contract v3 O3: builder evidence is regression evidence). REPAIRED_CLAIMED means the class is
  implemented generally and its named probe lines were re-run unedited (or through a labelled derived copy whose
  header lists every change); acceptance is decided by fresh independent verification. PARTIAL names the part left and
  its owner. An IP is DONE when its stated purpose is implemented (by the recipe or another way, said so).
availability_api:
  catalogue: "scheduler::catalogue::{BlockRule{min_severity, operations, scope, remedies}, BlockScope{Global, CoveredPaths, Subjects}, ops::{COMMITTING, UPDATE_SUBJECTS}, WORK_REMEDIES, ALL_REMEDIES}"
  host: "scheduler::{Request{operation, subjects}, Admission{remedy_for, reevaluated, observed}, admit(p,&Request), confirm_remedy(p,&Admission) -> HEALTH_REMEDY_INCOMPLETE, guard(p, op, paths) -> HEALTH_HARD_BLOCK (details.remedy_admissible), subjects_reach}"
  semantics: >-
    A hard-block refuses the listed operations within its scope (global, covered paths, or the subjects its finding
    names); an operation listed as a remedy whose subjects reach the block's subjects stays available, and if it
    commits (task close, CIT-E, release, update, migration) it commits only once the block is cleared (confirm_remedy
    or CIT-E repair mode); every refusal is typed (exit 4) and names each block with its check, scope, subjects,
    operations and remedies. Blocks whose check inputs changed are re-evaluated before they refuse.
classes:
  - class: availability-rule (P2-HO-0031, scheduler side)
    status: REPAIRED_CLAIMED
    requirement: "a hard-block refuses the operations whose reliance it protects, scoped to what the failing check governs; remedies and independent work stay available; a remedy that does not clear its block does not commit; every refusal typed and naming block and scope (Contract v3 L4, O5)"
    files: [runtime/src/scheduler/catalogue.rs, runtime/src/scheduler/mod.rs, runtime/src/verification/mod.rs, runtime/src/verification/currency.rs, runtime/src/verification/lineage.rs, runtime/src/error.rs]
