    class: BC-P2-29 (incremental equals full) / Contract v3 D1
    status: REPAIRED_CLAIMED
    requirement: "A file the indexer skips (too large, not UTF-8, unreadable, duplicate record id, secret content) never reads as unindexed to freshness, and no recorded exclusion hides a file the index should hold; incremental equals full for the occurrence of a duplicated id"
    files:
      - runtime/src/memory/indexer.rs
      - runtime/src/memory/manifest.rs
      - runtime/src/security/secrets.rs
      - framework/schemas/index-manifest.schema.json
      - tests/certification/ws06r3.rs
    product_checks:
      - {check: "memory::indexer::admit shared by the indexer and memory::manifest::freshness", tier: "every build; task close G2, CIT-E index_freshness verification, status, doctor D010/D025"}
      - {check: "content-level exclusions bound to content hash + derivation key (incl. secret-scanning rules)", tier: every build / freshness}
      - {check: "duplicate-id holder ranked over the tree by the record store's rule", tier: every build}
    probes_rerun:
      - {probe: "SUPP-ws06-r3 S1-S3", before: "1/5 (only S3.incremental-equals-full, which passes on both)", after: "5/5"}
      - {probe: "beta-r D1-incremental-freshness (unedited)", before: "5/5 PASS lines (stops at D1-b5, WS-7 registration)", after: "identical"}
      - {probe: "zeta-r FR-freshness-invalidation (unedited)", before: "2/2", after: "2/2"}
    tests: [ws06r3::freshness_judges_exactly_what_the_indexer_indexes, ws06r3::a_change_transaction_commits_while_the_tree_holds_files_the_indexer_skips, memory::indexer::tests::admission_decides_every_skip_reason_from_the_file, memory::indexer::tests::record_rank_follows_the_record_store_and_changes_count_content_only]
    integration_points: [IP-R3-WS06-6]
    owner_decision_required: null
