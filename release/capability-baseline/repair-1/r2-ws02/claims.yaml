claim_semantics: >-
  Builder claims only (Contract v3 O3: builder evidence is regression evidence). REPAIRED_CLAIMED means the class is
  implemented generally and its named probe lines were re-run unedited; acceptance is decided by fresh independent
  verification. An IP is DONE when its stated purpose is implemented (by the recipe or another way, said so), OBSOLETE
  when its purpose no longer stands.
