claims:
  - class: BC-P2-24
    title: Governed work generated from events
    status: REPAIRED_CLAIMED
    requirement: >-
      Each Contract v3:572-583 source (failed tests, audit findings, research discoveries, human decisions, CIT effects,
      lessons, missing tools/skills, retrieval failures, security findings, performance regressions) and each health
      failure generates governed, linked work in the same DAG when it occurs (Contract v3:571-583; AC-5).
    files:
      - runtime/src/orchestration/generation.rs (new)
      - framework/taxonomy/WORK_GENERATION.yaml (new)
      - runtime/src/orchestration/tasks.rs
      - runtime/src/orchestration/dag.rs
      - runtime/src/status.rs
      - framework/schemas/task.schema.json
      - cli/src/main.rs (additive; IP R3-WS5-1)
      - runtime/src/orchestration/control.rs (additive; IP R3-WS5-2)
      - runtime/src/orchestration/mod.rs (additive; IP R3-WS5-3)
    product_checks:
      - "generation::reconcile — after every governed write command (CLI post-command site), in task close, continue and task replan, and `gov task generate [--dry-run]`"
      - "generation::reevaluate_stale_failures — stale failing health results re-evaluated before generation (as the guard does for stale blocks)"
      - "generation::decide — idempotence: one task per occurrence key, one open task per subject; cancelled declines; recurrence only on newer evidence"
      - "unit tests orchestration::generation::tests::{generation_is_idempotent_per_occurrence_and_subject, missing_capability_work_is_augmented_not_duplicated, the_taxonomy_declares_every_source, a_condition_no_project_role_can_remedy_is_reported_not_generated}"
      - "certification ws05r3::{every_event_source_generates_linked_governed_work_once, a_red_result_made_stale_by_the_events_own_records_is_reevaluated_not_dropped, a_security_finding_generates_remediation_that_stays_available_under_its_block, a_cit_effect_on_completed_work_generates_one_linked_revalidation_task, a_failing_product_test_family_generates_repair_work}"
    probes_rerun:
      - probe: gamma-r I3-generation.sh (adapter)
        before: "generated per event: readiness 2, security 1 (W7); every other source 0"
        after: "readiness 6; failed tests 1 (<- AUD-0002); audit finding 1 (<- AUD-0003); discoveries/unresolved/proposed decision/lesson 4 (<- HND-0001, L-0001); human decisions 1+1 (<- D-0001, D-0002); missing tool+skill 2 (blocks TASK-NEED); retrieval failure 1 (FAIL-0001 follow_up); security 1 (<- AUD-0004) + W7 adopted; performance regression 1 (<- FAIL-0002). CIT effects 0 on both binaries: the probe's cit propose yields no id (cit execute USAGE); covered by the certification test"
        evidence: [evidence/audit-probes/base-shim/gamma-r.I3-generation.out, evidence/audit-probes/after-shim/gamma-r.I3-generation.out, evidence/audit-probes/COMPARE.out]
      - probe: epsilon-r O5-scheduler-requirements.sh S8 (adapter)
        before: "task records before/after doctor+audit+continue+replan: 0 / 0"
        after: "0 / 2 (security remediation remedying D011 + path_map_compliance; audit finding adapter_portability)"
        evidence: [evidence/audit-probes/base-shim/epsilon-r.O5-scheduler-requirements.out, evidence/audit-probes/after-shim/epsilon-r.O5-scheduler-requirements.out]
      - probe: zeta-r W03-task-input-manifest.py (adapter; unedited and derived ids copy)
        before: "unedited 40/40"
        after: "unedited W3-m4/-m5 FAIL: `task create --id TASK-0103/0104` DUPLICATE_ID (ids taken by generated retrieval-miss follow-ups); derived copy with the three explicit ids renamed: identical to base (40/40)"
        evidence: [evidence/audit-probes/after-shim/zeta-r.W03-task-input-manifest.out, evidence/audit-probes/derived/W03-task-input-manifest.ids.P2-AR-0036.py, evidence/audit-probes/after-shim/derived.W03-task-input-manifest.ids.P2-AR-0036.out]
    integration_points: [R3-WS5-1, R3-WS5-2, R3-WS5-3, R3-WS5-7, R3-WS5-10, R3-WS5-11]
    owner_decision_required: false

  - class: BC-P2-13
    title: Material changes cannot escape change control — in-task hook (WS-4 r2 R2-4; round-1 WS-5 IP-3; WS-4 IP-R3-6)
    status: REPAIRED_CLAIMED
    requirement: >-
      Materiality is determined from what a change changes, and material changes cannot complete outside CIT-P/CIT-E,
      including edits made inside ordinary tasks (Contract v3:446, :638-647; framework §47-48). WS-5 side: task close.
    files:
      - runtime/src/orchestration/tasks.rs
    product_checks:
      - "tasks::close step 10a material_changes — cit::materiality::classify_paths from the claim commit; MATERIAL_CHANGE_REQUIRES_CIT naming each finding, unless a CIT committed inside the claim window wrote exactly that content"
      - "tasks::cit_window_writes — CIT coverage bound to content via cit::binding::verified_writes (also for out-of-scope paths at step 9)"
      - "certification ws05r3::{material_changes_inside_a_task_complete_only_through_change_control, cit_coverage_is_bound_to_the_content_the_cit_wrote}"
    probes_rerun:
      - probe: delta-r K3-auto-impact-simulation.py (adapter)
        before: "K3.outside.2 FAIL; K3.b1-b8.mislabel, K3.outside.1/.3 PASS"
        after: "all 10 PASS (K3.outside.2 FAIL -> PASS)"
        evidence: [evidence/audit-probes/base-shim/delta-r.K3-auto-impact-simulation.out, evidence/audit-probes/after-shim/delta-r.K3-auto-impact-simulation.out]
      - probe: gamma-r G1G2-command-surface.sh G1.b3 (c) (adapter)
        before: "close refused only GOVERNANCE_SUITE_STALE (evidence currency)"
        after: "close refused MATERIAL_CHANGE_REQUIRES_CIT: acceptance_criteria_change REQ-0001"
        evidence: [evidence/audit-probes/base-shim/gamma-r.G1G2-command-surface.out, evidence/audit-probes/after-shim/gamma-r.G1G2-command-surface.out]
      - probe: gamma-r FRESH-invalidation.sh (adapter)
        before: "TASK-GOV1 closes; GOV2-6 refused GOVERNANCE_SUITE_STALE"
        after: "TASK-GOV1..6 refused MATERIAL_CHANGE_REQUIRES_CIT (governance_change)"
        evidence: [evidence/audit-probes/after-shim/gamma-r.FRESH-invalidation.out]
    integration_points: [R3-WS5-8]
    owner_decision_required: false

