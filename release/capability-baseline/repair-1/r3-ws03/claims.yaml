items:
  - item: P2-ADJ-0002
    status: REPAIRED_CLAIMED
    scope: "WS-3 side (t2 mechanism, CLI, G0, docs); WS-8 harness convention routed as IP-R3-WS03-1"
    requirement: "OS-written T2 facts honoured on every machine provisioned for the owner/project after clone/pull; hand-written, unprovisioned, unauthorised, foreign or modified records refused typed and observable; no secret in any repository; no new external dependency class (P2-ADJ-0002; Contract v3 S6; D-0007; ARCH-0003 §8; OWNER-DECISION-P2-0002)"
    mechanism: "owner-authorised symmetric T2 binding authority delegated through the provisioned root (role t2-binding): 32-byte key + owner-signed t2-binding-authority installed from the administrator domain into protected machine state (0600); seals hmac-sha256/t2-v2 bind authority, sealing machine, operation, time and canonical content; honoured only where the key is held AND this machine's current trusted root authorises the authority (re-verified at use); machine scope t2-v1 remains the fallback"
    why_this_design: "per-machine signing keys would make gov sign (SRR-R0-L4; R1 f2/d6/d7 census); per-machine symmetric keys need the same shared keyring; P2-ADJ-0002 names a per-owner authority delegated through the provisioned root as conforming"
    residual: "an operator-privileged process on one of the owner's machines can read the key (detection-grade, as round 1) and forge records honoured on the owner's other machines holding that authority; inherent to the requirement; human answers stay bound to the owner's signature"
    files: [runtime/src/t2.rs, cli/src/main.rs, runtime/src/orchestration/control.rs, framework/policies/AUTHORITY_POLICY.yaml, docs/ARCHITECTURE.md, docs/COMMANDS.md, README.md, docs/FIXTURES.md]
    product_checks:
      - {check: "t2::verify_value / verify_portable (VERIFIED scope provisioned | FOREIGN | UNAUTHORISED | BROKEN | UNSEALED)", tier: T2}
      - {check: "t2::provision_authority (guard_effect TrustPolicyMutation; T2_AUTHORITY_FROM_REPOSITORY_REFUSED, _UNPROVISIONED, _ROLE_NOT_DELEGATED, _UNAUTHORISED, _EXPIRED, _KEY_MISMATCH, _INVALID)", tier: "G0/T2"}
      - {check: "t2::reseal (L4 reseal_t2_bindings; T2_AUTHORITY_UNAVAILABLE)", tier: G0}
      - {check: "t2::binding_status / gov trust t2-binding", tier: observability}
      - {check: "every existing T2 consumer (gates, decisions, CIT os_state, plugin registration, governed evidence, os_binding_integrity, D033)", tier: T2}
    probes_rerun:
      - {line: "ADJ2.a-ADJ2.p, RESEAL.a, G0.a", before: FAIL, after: PASS, evidence: probes/R3-WS03-probes.final-a0cb4e3.out}
    tests:
      - ws03_r3::os_written_facts_are_honoured_on_the_owners_other_provisioned_machines_and_nowhere_else
      - ws03_r3::a_t2_binding_authority_is_admitted_only_from_the_administrator_domain_under_this_machines_root
      - ws03_r3::root_succession_that_drops_the_binding_role_revokes_its_records_and_sealing_falls_back
      - ws03_r3::reseal_makes_what_this_machine_sealed_while_provisioned_portable_and_nothing_else
      - "unit t2::tests::a_portable_seal_is_honoured_where_the_authority_is_held_and_authorised_and_nowhere_else"
      - "unit t2::tests::the_sealing_authority_is_authorised_unexpired_and_the_latest_issued"
      - "unit t2::tests::reseal_moves_only_post_provisioning_local_seals_and_keeps_enclosing_seals_valid"
    behaviour_change: "a machine-scope seal verified on a machine without its own key is now FOREIGN (was KEY_UNAVAILABLE)"
    integration_points: [IP-R3-WS03-1, IP-R3-WS03-6, IP-R3-WS03-7, IP-R3-WS03-8]
    owner_decision_required: null
