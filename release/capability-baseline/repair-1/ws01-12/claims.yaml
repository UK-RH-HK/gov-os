integration_points:
  - id: IP-1
    workstream: WS-2
    file: 'runtime/src/verification/mod.rs or runtime/src/doctor.rs'
    call: 'gov_runtime::contracts::verify(&canonical_root) when the canonical OS tree is present; any CONTRACT_* error -> HIGH finding with details.differences'
    why: 'BC-P2-01''s check must run at a G-tier (G5 full suite / doctor), repair-delta 0.2c'
  - id: IP-2
    workstream: WS-8
    file: 'runtime/src/release.rs (release::build)'
    call: 'refuse unless gov_runtime::contracts::verify(canonical_root) returns verdict CONTRACT_SOURCE_BOUND'
    why: 'a release must not ship derived contract views that diverge from the owner source'
  - id: IP-3
    workstream: WS-1 (later round, BC-P2-02)
    file: 'tests/governance/capability-evidence-map.yaml (governed fields), then `gov contract compile`'
    call: 'populate evidence_class (Contract v3:83-91), automated_checks per capability and per checklist item, health_scheduler_tiers (G0-G6), freshness_triggers (:99-109), others; regeneration preserves them and verify enforces the vocabularies'
    why: 'AC-10 evidence owners'
  - id: IP-4
    workstream: WS-2 (G6 entry point, BC-P2-07)
    file: 'new scheduler / G6 module'
    call: 'gov_runtime::qualification_oracle::validate_file(oracle, &ValidateOptions{public_suites, repositories, ..}) and validate_file(report, &ValidateOptions{oracle: Some(oracle), ..}) (or validate_value / cross_check in-process); refuse to record health for a non-conforming, unbound or non-separate run'
    why: 'V1-V4 are the hidden oracle a G6 qualification run is scored against'
  - id: IP-5
    workstream: WS-2
    file: 'runtime/src/verification/mod.rs (schema_invariants or a new family)'
    call: 'qualification_oracle::is_hidden_oracle_material(&record.data) per record, or qualification_oracle::scan_for_hidden_oracle_material(&p.root); HIGH finding'
    why: 'Contract v3:1014/1062 — a governed repository under qualification must hold no hidden-oracle material (epsilon-r V section B)'
  - id: IP-6
    workstream: orchestrator / oracle-format reviewer
    file: 'release/orchestration/phase-2/GATES/GATE-REGISTER.yaml (GATE-P2-ORACLE-FORMAT)'
    call: 'record the reviewed format_sha256 f89a3e2ff882e116f4593d0f7b8fd9725c7ba491090aedadc3a942c66f4316fd'
    why: 'documents are valid only against the exact format version they name'
  - id: IP-7
    workstream: WS-3
    file: 'cli/src/main.rs'
    call: 'additive Cmd::Oracle / OracleCmd block and command_name arm "oracle" (read-only; no role semantics); for a BC-P2-08 authority census, `oracle *` and `contract verify` are read-only, `contract compile` writes framework/contracts/**, tests/governance/**, docs/generated/**'
    why: 'shared hot spot, additions only (+42/-0)'
