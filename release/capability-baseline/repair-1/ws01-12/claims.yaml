  - class: BC-P2-51
    status: REPAIRED_CLAIMED
    requirement: >-
      A machine-checkable Qualification Oracle format covering every V1-V4 element exists, is kept separate from the
      public qualification suite, validates a well-formed sample and rejects samples missing each V1-V4 field; it is
      accepted by a fresh independent reviewer before any hidden fault is generated (Contract v3:1012-1062, :1206; AC-6).
    acceptance_note: this claim covers the format and validator only; QUALIFICATION_ORACLE_FORMAT_ACCEPTED is the AC-6 reviewer's
    files:
      - framework/qualification-oracle/qualification-oracle.schema.json
      - runtime/src/qualification_oracle.rs
      - runtime/src/lib.rs (pub mod line)
      - cli/src/main.rs (additive `gov oracle format|validate` block)
    format:
      id: governance-os.qualification-oracle
      version: 1
      format_sha256: f89a3e2ff882e116f4593d0f7b8fd9725c7ba491090aedadc3a942c66f4316fd
      kinds: [qualification-oracle, qualification-score-report]
      crosswalk_entries: 44
      crosswalk_fields: 50
      status: PROPOSED
    product_checks:
      - check: gov oracle validate / qualification_oracle::{validate_file, validate_value, cross_check}
        tier: on demand; natural G6 check (IP-4)
        typed_errors: [ORACLE_RECORD_INVALID, ORACLE_SCORE_BINDING_MISMATCH, ORACLE_SEPARATION_VIOLATED, ORACLE_RECORD_UNREADABLE, ORACLE_FORMAT_INCOMPLETE]
      - check: gov oracle format (crosswalk verified against the approved source bytes)
        tier: on demand
      - check: cargo test --lib qualification_oracle::tests (9 tests)
        tier: builder regression
    probes_rerun:
