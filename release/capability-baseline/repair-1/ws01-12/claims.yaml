      - probe: release/capability-baseline/audit-0/epsilon-r/evidence/V-oracle-format-and-contract-views.sh (sections A-C)
        before: "A: no identifiers; B: gov oracle unrecognized, fault-manifest governed record -> HEALTHY"
        after: "A: identifiers in the format and validator; B: gov oracle recognised; a fault-manifest *governed project record* under schema_invariants still HEALTHY (governance suite is WS-2's: IP-5); the same record given to gov oracle validate -> ORACLE_RECORD_INVALID"
