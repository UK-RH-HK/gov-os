  - id: V1-F5-02
    capability: ["F5", "E3"]
    bullet_source_lines: [435]
    severity: MEDIUM
    title: "A handoff's authority envelope is caller-declared and may exceed the task's own allowed paths"
    statement: >-
      `gov handoff create --fields '{\"authority\":{\"allowed\":[\"**\"],\"prohibited\":[]}}'` is recorded verbatim on
      a handoff whose task declares `allowed_paths: [product/narrow/**]`, so the A2A layer carries an authority
      statement wider than the task contract it serves. The practical blast radius is limited — the task close still
      enforces the task's own scope (MUTATION_SCOPE_VIOLATION, verified in the same run) — but the handoff's own
      return check is performed against the wider, self-declared envelope, so a worker can be told it may write
      anywhere and only discover otherwise at close.
    normative_source: "Contract v3:435 'A2A = communication'; :437 'No layer silently substitutes for another.'; D-0007 rule 2"
    provenance_class: VERIFIER-HARDENING
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as the second half of iteration-0 finding A0-F5-01 ("a handoff may declare
      authority broader than its task"), recorded non-blocking and therefore not inventoried as a blocker class.
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out", "heldout/PRIOR-FINDINGS-recheck.sh"]
    reproduction: "create a task with a narrow allowed path, then `gov handoff create --fields '{\"authority\":{\"allowed\":[\"**\"]}}'` and read the recorded handoff"
