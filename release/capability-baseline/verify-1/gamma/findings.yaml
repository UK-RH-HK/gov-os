  - id: V1-G1-01
    capability: ["G1"]
    bullet_source_lines: [445]
    severity: MEDIUM
    title: "Deterministic intent routing inverts negation: 'do not approve this change' routes to APPROVE"
    statement: >-
      `intents::route` scores each declared pattern by substring containment over the lowercased input and takes the
      longest match (runtime/src/orchestration/intents.rs:16-40). The REJECT patterns are literal ("reject",
      "don't do", "do not do", "decline"), so a negated form of another intent matches the affirmative pattern it
      contains: "do not approve this change" contains "approve" and routes to APPROVE, proposing `gov gate present`,
      `gov trust human-channel` and `gov decide`. The routing is deterministic, as the bullet requires, but it maps a
      refusal onto the approval operation.
    normative_source: "Contract v3:445 'Intent maps deterministically to governed operations.'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-G1-01 ("Deterministic intent routing covers control
      phrases only, inverts negations, names non-operations and is not wired into adapters"), recorded non-blocking
      and not inventoried as a blocker class. The "names non-operations" half is now closed — every routed command
      is a governed operation the command contract declares — and the negation half is not.
    evidence: ["evidence/G1-G2-I1-I4-command-work.out", "heldout/G1-G2-I1-I4-command-work.sh"]
    reproduction: "`gov intent \"do not approve this change\"` -> intent APPROVE"
    repair_direction: >-
      A routed intent must not be the affirmative of what the human said. Whatever mechanism is chosen, the property
      is that a negated or refusing phrase never routes to the operation it negates; where the router cannot tell,
      UNKNOWN with a suggestion is the safe answer it already has.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-H4-01
    capability: ["H4", "E1"]
    bullet_source_lines: [526]
    severity: LOW
    title: "A test obligation's own author_role and independent_of_implementer are author-written; the product reports them as declared, not established"
    statement: >-
      `gov scenario trace` returns a test obligation's author as
      `{source: declared, established: false, note: "author fields written by the author; the product did not record
      this authorship"}`, while a data record's authorship is OS-recorded with a VERIFIED T2 binding. The product is
      therefore honest about the difference — it does not present the declared flag as evidence — but the chain's
      independence checks (DATA_AUTHOR_IS_TEST_AUTHOR, DATA_AUTHOR_NOT_INDEPENDENT) compare against that declared
      author_role, so a hand-authored test obligation can state an author role it did not have.
    normative_source: "Contract v3:526 'Test-data author independence is supported.'; blocker class BC-P2-34"
    provenance_class: VERIFIER-HARDENING
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-34
    label_reason: >-
      Same mechanism as BC-P2-34 ("Independence of test, review and verification authorship is self-attested"), on
      the H4 capability BC-P2-34 already names. It is a residual and not a blocker for gamma because the product no
      longer HONOURS the declaration as established: it labels it `declared` with `established: false`, and the data
      side — where the OS is the writer — is fully bound. BC-P2-34 is led by alpha (O3/T1-T3); I record gamma's H4
      slice of it here.
    evidence: ["evidence/H1-H4-spec-readiness.out"]
    reproduction: "`gov scenario trace SCN-0001` — the tests[].author block"
    repair_direction: "A test obligation's authorship should be OS-recorded at the operation that creates it, as a data record's already is, so the independence comparison rests on recorded authorship rather than on a declared field."
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-E3-01
    capability: ["E3"]
    bullet_source_lines: [385]
    severity: MEDIUM
    title: "A handoff return is not bound to the role the handoff names, and a later return silently overwrites the earlier one"
    statement: >-
      `handoffs::return_result` checks the returned files against the handoff's authority envelope and re-seals the
      record, but never compares the returning role with the handoff's `to_role`
      (runtime/src/orchestration/handoffs.rs:338-444). A handoff created for backend-engineer was returned by
      backend-engineer and then returned again by frontend-engineer; the second return was ACCEPTED and replaced the
      first in the record, so the governed record of who did the work and what they reported is the last writer's.
      The typed elements themselves are all present and persist (E3's bullets hold); what is missing is the binding
      between a handoff and the role it was addressed to.
    normative_source: "Contract v3:377-385 (typed A2A handoffs that persist beyond conversation lifetime); D-0007 rule 2 (a caller-supplied role is a request)"
    provenance_class: VERIFIER-HARDENING
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-E3-01 ("A handoff return is not bound to the recipient
