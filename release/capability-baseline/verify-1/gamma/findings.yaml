findings:

  - id: V1-F4-01
    capability: ["F4", "F3"]
    bullet_source_lines: [426, 430, 416]
    severity: HIGH
    title: "A tool installation's authority expansion is derived by reading argv tokens, so an interpreter-wrapped command installs ungated — and a command the OS cannot read is not treated as undetermined"
    statement: >-
      `tools::installation_authority` derives what an installation would hold by scanning each element of
      install_command / uninstall_command / health_check.command for privilege tokens, host-authority tokens, host
      scope flags, credential names and paths (runtime/src/tools.rs:903-1226). The scan is per-argv-element and
      literal, so wrapping the same effects in one string argument hides them: with tool id, version, licence, pin,
      reversibility and the governed security review all unchanged, the descriptors
      `install_command: ["sh","-c","sudo apt-get install -y x"]`,
      `["bash","-lc","cp /etc/shadow ./x"]`,
      `["python3","-c","import os;os.system(\"sudo id\")"]` and `["make","install"]`
      are each recorded `expands_authority: false`, `triggers_fired: []`, `undetermined: []`, branch `not_gated`,
      and install with no Human Gate. Executed, this is not theoretical, and `--execute` is not the boundary.
      (a) With `--execute`, a descriptor whose install command was
      `["sh","-c","printf ... > <absolute path outside the project root>"]` installed on the non-gated branch with
      `expands_authority: false, triggers_fired: [], undetermined: []` and its command RAN, writing that file.
      (b) WITHOUT `--execute`, the same wrapping in `health_check.command` — which runs on every installation —
      wrote outside the project root just the same. Both are "broader filesystem or project access", an OD-P2-03
      authority-expansion trigger, with no gate. The absolute path is invisible to the scan because `leaves_project`
      asks whether the TOKEN starts with `/`, and the token here is the whole shell string. The function's own documentation
      states the opposite rule ("Anything that cannot be evaluated - no envelope in policy, no role permissions, a
      command the OS cannot read - is an expansion and gates"), but the implementation records `undetermined` only
      when the descriptor carries NO command at all (runtime/src/tools.rs:974-977).
    normative_source: >-
      GATES/OWNER-DECISION-P2-0003-TOOL-INSTALL-GATE.md requirement 3: "Fail closed and fail gated. If the envelope
      cannot be determined, a condition cannot be evaluated, ... the Human Gate is required and the installation does
      not proceed."; requirement 2: the comparison is "the permissions, filesystem/project scope, secret access, host
      authority, policy-mutation capability and network trust boundary the tool WOULD HOLD"; Contract v3:426
      "Descriptor cannot authorise itself"; Contract v3:430 "Elevated permissions reference authoritative gate/decision".
    provenance_class: OWNER-ADDED-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: ["AC-4", "AC-3"]
    blocking: true
    new_vs_residual: MATERIALLY_NEW
    inventoried_class: null
    label_reason: >-
      The capability (F4/F3) is inventoried, but this defect MECHANISM is absent from the iteration-0 inventory.
      BC-P2-39's mechanism is "elevation decided by the descriptor's own required_permission_classes/permissions";
      this candidate deliberately no longer does that — it derives the demand itself — and the new defect is that the
      derivation is a literal token scan that an interpreter wrapper defeats, plus a fail-closed rule that never
      fires for a command the OS cannot read. `installation_authority`, `change_decision`, OD-P2-03 and
      CHANGE_POLICY.change_classes.tool_installation did not exist at iteration 0, so no inventoried class describes
      this. It is adjacent to BC-P2-39 and I record that adjacency rather than claiming distance from it.
    evidence: ["evidence/F3-F4-tool-install-gate.out", "evidence/V1-F4-01-executed-proof.out", "heldout/F3-F4-tool-install-gate.sh", "heldout/V1-F4-01-executed-proof.sh"]
    reproduction: >-
      GAMMA_WT=<worktree> bash release/capability-baseline/verify-1/gamma/heldout/F3-F4-tool-install-gate.sh
      — see the four "OD-P2-03 req 3" lines; and heldout/V1-F4-01-executed-proof.sh for the executed proof. Minimal form: install a non-elevated reviewed tool (branch not_gated),
      then re-install the same tool id and version with
      `install_command: ["sh","-c","sudo apt-get install -y x"]` and read `change_class.authority_envelope`.
    repair_direction: >-
      The branch must be decided on what the installation WOULD DO, not on what its argv happens to spell. An
      installation whose effects the OS cannot determine — any command that interposes a shell or an interpreter
      over a string it does not parse, any opaque build target, any command form outside a declared readable set —
      must be recorded as `undetermined` and gated, as OD-P2-03 requirement 3 already states and as this function's
      own documentation already claims. Whatever readable form is adopted, the property to hold is: no descriptor may
      reach the non-gated branch by choosing how to spell its command.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-F3-01
    capability: ["F3", "F4"]
    bullet_source_lines: [416, 431, 430]
    severity: HIGH
    title: "The governed security review is bound to a tool id and version, not to the installation it authorises, so a reviewed tool's command can be swapped and installed ungated"
    statement: >-
      `tools::review_verdict` (runtime/src/tools.rs:415-495) accepts a governed review when it is a T2-verified
      ACTIVE report closing a `security`-class task, written by neither the installing session nor the installing
      role, whose `security_review` block names this tool_id and this version with verdict `passed`. It never
      compares the review to the installation subject (`installation_subject`, the SHA-256 over the descriptor as
      given, runtime/src/tools.rs:394-404) that the installation actually writes. The review therefore authorises
      any descriptor sharing that id and version. Demonstrated: one review of TL-JQ 1.7.1 satisfied
      `licence_and_security_satisfied` for six different descriptors with six different install commands, and the
      last of them — whose command was replaced AFTER the review with one that wrote a file outside the project —
      installed on the non-gated branch and executed. Under OD-P2-03 the independent governed review is what carries
      everything the OS cannot observe about a non-gated installation, so an unbound review empties the non-gated
      branch of its evidence.
    normative_source: >-
      Contract v3:431 "Security review cannot be self-attested" read with :430 "Elevated permissions reference
      authoritative gate/decision"; GATES/OWNER-DECISION-P2-0003-TOOL-INSTALL-GATE.md requirement 1 (non-gated
      conditions include "independently governed-reviewed") and requirement 3 (a review "not bound to this exact
      installation (BC-P2-41)" requires the Human Gate); blocker class BC-P2-41.
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: ["AC-4", "AC-3"]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-41
    label_reason: >-
      Same capability (F3/F4) and same mechanism as the inventoried class BC-P2-41, "Tool acquisition: review
      evidence and approval not bound to the tool installation — a tool's security review is satisfied by naming any
      existing record". The repair narrowed "any existing record" to "a governed review of this tool id and version
      by another role and session", which is a real improvement, but it did not bind the review to the installation.
      This is an incompletely fixed inventoried class, which §8 defines as a residual. OD-P2-03 requirement 3 names
      exactly this binding ("not bound to this exact installation (BC-P2-41)") as a gating condition, so the owner
      decision expects it and the implementation does not provide it.
    evidence: ["evidence/F3-F4-tool-install-gate.out", "heldout/F3-F4-tool-install-gate.sh"]
    reproduction: >-
      GAMMA_WT=<worktree> bash release/capability-baseline/verify-1/gamma/heldout/F3-F4-tool-install-gate.sh
      — the "F4:431 / BC-P2-41" line. Minimal form: obtain a governed review of <id> <version>, install once
      (not_gated), then change only `install_command` and install again with --execute.
    repair_direction: >-
      A governed security review must bind the installation it authorises — the installation subject digest, not
      only the tool id and version — and an installation whose subject no review covers must take the gated branch.
      Equivalently: the descriptor content a reviewer saw and the descriptor content that is installed must be the
      same bytes, and the OS must check that, as it already does for a plugin registration
      (`registration_subject_sha256`).
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-F4-02
    capability: ["F4", "F3", "E1"]
    bullet_source_lines: [426, 430, 365]
    severity: HIGH
    title: "The authorised side of the tool-installation trust envelope is an unprotected project overlay file: a hand edit enlarges it with no change transaction, no gate and no report"
    statement: >-
      OD-P2-03 requirement 2 says the authorised envelope is "computed from trusted OS state". The implementation
      reads the role's permission classes from `governance/project/TOOL_PERMISSIONS.yaml` through
      `tools::role_permissions`, which reads `p.overlay()` directly (runtime/src/tools.rs:66-79). That file is an
      ordinary repository file: it is not OS-written, carries no T2 seal, and — unlike PROJECT_POLICY.yaml and
      MODEL_ROUTING_OVERRIDES.yaml — is not evaluated through `policy_precedence::evaluate_overlay`
      (runtime/src/policy.rs:285-352), and POLICY_PRECEDENCE declares no rule for it. Appending one permission class
      to the acting role, with no `gov` command, no change transaction and no gate, turns the same installation from
      `expands_authority: true, triggers_fired: [privilege_escalation]` into
      `expands_authority: false, triggers_fired: []` — inside the authorised envelope. `gov audit` afterwards reports
      no finding mentioning TOOL_PERMISSIONS. The same exposure applies to the other named envelope sources that are
      project overlay documents (REPOSITORY_CONTRACT.yaml, which decides "broader filesystem access", and
      DATA_SENSITIVITY.yaml, which decides "new secret access").
    normative_source: >-
      GATES/OWNER-DECISION-P2-0003-TOOL-INSTALL-GATE.md requirement 2: "The authorised envelope is computed from
      trusted OS state, never from the descriptor's own declarations"; Contract v3:365 "Lower roles cannot
      manufacture higher-trust facts"; D-0007 rule 2; blocker class BC-P2-45.
    provenance_class: OWNER-ADDED-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: ["AC-4", "AC-3"]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-45
    label_reason: >-
      Same mechanism as BC-P2-45, "Project overlay files bypass POLICY_PRECEDENCE ... read directly by <module> ...
      neither refused nor reported". The round-3 repair brought PROJECT_POLICY.yaml and MODEL_ROUTING_OVERRIDES.yaml
      under `policy_precedence::evaluate_overlay` but left the other overlay documents read directly, and OD-P2-03
      has since made TOOL_PERMISSIONS.yaml the authorised side of a security decision, so the same unrepaired
      mechanism now decides whether an installation gates. The capability set changes (F4/F3/E1 rather than
      A1/M1/M2/M3/H3) but the mechanism is the inventoried one, so I label it residual rather than materially new.
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out", "heldout/F1-F2-F5-skills-tools-layers.sh"]
    reproduction: >-
      GAMMA_WT=<worktree> bash release/capability-baseline/verify-1/gamma/heldout/F1-F2-F5-skills-tools-layers.sh
      — the two "OD-P2-03 req 2" lines and the "envelope verdict before=... after=..." line.
    repair_direction: >-
      What the project has already authorised must be trusted state: either the envelope sources are OS-written /
      integrity-bound so that an out-of-band edit is detected and refused, or an unverified edit to an envelope
      source makes the envelope undeterminable and every installation gates until it is re-established. Either way
      an edit to an envelope source must be a governed, change-controlled and reported event, and the suite must
      report one it did not authorise.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-E2-01
    capability: ["E2"]
    bullet_source_lines: [375]
    severity: MEDIUM
    title: "No governed extension point for project-specific roles"
    statement: >-
      `authority::level_in` resolves a role only against the verified kernel `ROLES.yaml` and returns UNKNOWN_ROLE
      for anything else (runtime/src/authority.rs:150-170). ROLES.yaml declares no project_roles or extension key and
      no overlay document adds roles, so a project cannot declare a role of its own through any governed route. The
      behaviour fails closed — an unknown role is refused, never silently promoted — but the capability the contract
      lists is absent.
    normative_source: "Contract v3:375 'project-specific roles through governed extension'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and same mechanism as iteration-0 finding A0-E2-01 ("No governed extension point for
      project-specific roles"), which was recorded non-blocking and therefore was not inventoried as a blocker class.
      There is no BC-P2-NN to name; labelling it MATERIALLY_NEW would overstate its novelty, so I record it as a
      residual of a non-blocking iteration-0 finding and state the absence of a class explicitly.
    evidence: ["evidence/E1-E2-authority.out", "heldout/E1-E2-authority.sh"]
    reproduction: "`gov --role my-project-role task create --class documentation --objective x` -> UNKNOWN_ROLE; ROLES.yaml has no extension key"
    repair_direction: "A project must be able to declare a role through a governed, precedence-bound extension whose authority level cannot exceed what the kernel allows for a project-declared role."
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-F1-01
    capability: ["F1"]
    bullet_source_lines: [402]
    severity: MEDIUM
    title: "A lesson from ordinary work cannot propose a skill update through governed promotion"
    statement: >-
      The only governed promotion route is the canonical repository's lesson inbox (`gov lessons cluster` ->
      framework-change-proposal). A lesson produced by ordinary governed work is PROJECT-scoped and `gov upstream
      prepare` refuses it UPSTREAM_SCOPE ("only [\"FRAMEWORK\"] lessons may be exported", framework §75E); no
      operation promotes a lesson from PROJECT to FRAMEWORK scope; and the framework-change-proposal schema has no
      field naming a skill, so even a framework lesson's proposal cannot target one. Skills are therefore changed
      only by changing the kernel or by hand-authoring a project skill.
    normative_source: "Contract v3:402 'Lessons can propose skill updates through governed promotion.'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-F1-03 ("No skill-specific governed promotion;
      project-scoped lessons cannot propose skill updates"), recorded non-blocking and so not inventoried as a
      blocker class. Recorded as a residual of that finding, with the absence of a class stated.
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out", "heldout/F1-F2-F5-skills-tools-layers.sh"]
    reproduction: "produce a lesson through a worker return, then `gov upstream prepare <L-id>` -> UPSTREAM_SCOPE; inspect framework-change-proposal.schema.json for a skill target"
    repair_direction: "A governed route must exist from a recorded lesson to a proposed skill change, with the proposal naming the skill and its version, and the skill change itself remaining change-controlled."
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-F2-01
    capability: ["F2"]
    bullet_source_lines: [408]
    severity: MEDIUM
    title: "The Tool Capability Registry scopes tools to roles and permission classes but not to task classes"
    statement: >-
      `tools::resolve` filters by capability, active status, approved_roles, required permission classes and project
      languages (runtime/src/tools.rs:306-360); the tool schema has no `task_classes` property and the generated
      registry's role_exposure is keyed by role alone. `TOOL_POLICY.mcp.scope: role_and_task` declares task scoping
      and nothing implements it for tools or MCP servers, so a tool approved for a role is available to that role in
      every task class.
    normative_source: "Contract v3:408 'allowed roles/task classes'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-F2-01 ("Tool registry lacks task-class scoping,
      sensitivity classification, tool hash pins and approval status"); the hash-pin and approval-status halves of
      that finding are now closed, the task-class half is not. A0-F2-01 was non-blocking and is not an inventoried
      blocker class, so no BC-P2-NN can be named.
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out"]
    reproduction: "`gov tools registry` — no entry carries task_classes; the tool schema has no such property; `gov tools resolve` takes no task class"
    repair_direction: "A tool's registry entry must state the task classes it may serve, and resolution must refuse a tool outside the claiming task's class."
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-F2-02
    capability: ["F2"]
    bullet_source_lines: [409]
    severity: LOW
    title: "A tool's filesystem scope is a single repo_write boolean; no path scope is recorded"
    statement: >-
      The tool schema records `permissions.repo_write`, `permissions.network` and `credential_scope`, but no path
      scope, so the registry cannot state which paths a tool may touch, and nothing compares a tool's filesystem
      reach with the path map the way an installation's commands are compared.
    normative_source: "Contract v3:409 'sensitivity/network/filesystem scope'"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: "Same capability and mechanism as iteration-0 finding A0-F2-01 (sensitivity/scope half); non-blocking in iteration 0 and therefore not an inventoried blocker class."
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out"]
    reproduction: "inspect framework/schemas/tool.schema.json: no filesystem_scope or path_scope property"
    repair_direction: "A tool's registry entry must record the filesystem scope it is authorised for, expressed against the path map, so that scope can be compared rather than assumed."
    owner_decision_required: false
    owner_decision_reason: null

