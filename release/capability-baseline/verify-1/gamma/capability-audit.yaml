        independent_evidence: ["evidence/F4-plugin-boundary.out: a descriptor declaring approved_roles all, signed provenance, a passed security review and status active runs nothing, and the OS records all three claims as ignored (plugin side: met). evidence/F3-F4-tool-install-gate.out: on the installation side the descriptor's own command formatting decides the branch — `sh -c \"sudo apt-get install -y x\"` is recorded expands_authority false and installs ungated"]
        gap: "On the tool-installation path a descriptor can put itself on the non-gated branch by writing its command in a form the OS cannot read; the effect is real with --execute (install_command) and without it (health_check.command, which runs on every installation)."
      - bullet: "Registration/provenance live in trusted OS state."
        source_line: 427
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/capabilities/registry.rs (governance/registry/plugin-registry.json, T2-sealed)", "runtime/src/t2.rs", "framework/policies/TOOL_POLICY.yaml plugins.registry_path"]
        automated_evidence: ["cargo test --lib"]
        independent_evidence: ["evidence/F4-plugin-boundary.out: the registry is OS state at governance/registry/plugin-registry.json; a hand-written entry is refused PLUGIN_REGISTRATION_UNBOUND"]
        gap: null
      - bullet: "Descriptor/implementation bytes are hash-bound."
        source_line: 428
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/capabilities/binding.rs:592-744 resolve", "runtime/src/capabilities/binding.rs:763-800 registration_subject", "runtime/src/capabilities/binding.rs:415-546 (python module-form derivation)"]
        automated_evidence: ["cargo test --lib"]
        independent_evidence: ["evidence/F4-plugin-boundary.out: the registration binds descriptor_sha256, implementation_sha256, registration_subject_sha256 and registration_gate; a module-form plugin (`python3 -m plugmod`) is pinned, closing the BC-P2-40 / S0-F4-01 case"]
        gap: null
      - bullet: "Drift/tampering fails closed."
        source_line: 429
        status: PRESENT_AND_SUBSTANTIAL
        implementation_evidence: ["runtime/src/capabilities/governance.rs:487-520 (pin and registered-implementation checks; drift refused whatever the policy says)"]
        automated_evidence: ["cargo test --lib"]
        independent_evidence: ["evidence/F4-plugin-boundary.out: one changed implementation byte -> PLUGIN_PIN_MISMATCH; an edited descriptor -> PLUGIN_REGISTRY_MISMATCH"]
        gap: null
      - bullet: "Elevated permissions reference authoritative gate/decision."
        source_line: 430
        status: PARTIAL
        implementation_evidence: ["runtime/src/capabilities/governance.rs:520-556 (registration approval bound to the gate and subject)", "runtime/src/tools.rs:1226-1310 change_decision", "runtime/src/tools.rs:1316-1333 authorised_by", "framework/policies/CHANGE_POLICY.yaml change_classes.tool_installation"]
        automated_evidence: ["cargo test --lib"]
        independent_evidence: ["evidence/F4-plugin-boundary.out: a plugin runs only while the gate raised for exactly its registration subject authorises it. evidence/F3-F4-tool-install-gate.out: every installation records OD-P2-03, D-0011, the rule, the branch, why, the bound review and the change transaction — but an installation that IS elevated in fact and is not detected records the non-gated decision instead of a gate"]
        gap: "An installation whose elevation the OS fails to detect (V1-F4-01) or whose envelope was widened out of band (V1-F4-02) references the owner decision rather than an actual gate."
      - bullet: "Security review cannot be self-attested."
        source_line: 431
