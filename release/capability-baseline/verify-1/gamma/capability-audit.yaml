  - capability: F4
    title: Plugin trust boundary
    source_ref: Governance_OS_Capability_Acceptance_Contract_v3.md:425
    governing_document_refs: ["framework v4.1.2 Part VII §28-32", "spec/architecture/ARCH-0003 §9", "spec/decisions/D-0007", "spec/decisions/D-0010", "release/orchestration/phase-2/GATES/OWNER-DECISION-P2-0003-TOOL-INSTALL-GATE.md"]
    requirement_class: POST_VERIFICATION_HARDENING
    status: PARTIAL
    status_justification: >-
      The PLUGIN side of this boundary is fully met and executably evidenced on this candidate (probe
      F4-plugin-boundary.sh, 12/12): a hand-declared descriptor authorises nothing, registration and provenance live
      in T2-sealed OS state, descriptor and implementation bytes are bound (including the module-form case that was
      BC-P2-40), drift fails closed, an executable registration needs a presented owner-answered gate bound to its
      subject, and the descriptor's own provenance / security-review claim is recorded as ignored. The TOOL
      INSTALLATION side, which OD-P2-03 brought inside this boundary, is not: whether an installation is elevated is
      decided by reading argv tokens, which an interpreter-wrapped command evades (V1-F4-01), the authorised side of
      the envelope is an unprotected project overlay file (V1-F4-02), and the governed review is not bound to the
      installation (V1-F3-01).
    na_reason_normative_text: null
    partial_qualification_impact: >-
      COULD_UNDERMINE, and AC-4 is therefore not met. F4 is the POST_VERIFICATION_HARDENING capability AC-4 names.
      On this candidate an install-authority role can place an arbitrary command on the trusted surface and run it
      with no Human Gate, and can enlarge its own authorised envelope by editing a repository file. An adversarial
      tooling fault class in Phase 4 would be scored against a boundary that does not hold.
    bullets:
      - bullet: "Descriptor cannot authorise itself."
        source_line: 426
        status: PARTIAL
        implementation_evidence: ["runtime/src/capabilities/governance.rs:168-183 self_authorising_claims", "runtime/src/capabilities/governance.rs:372-556 authorize", "runtime/src/tools.rs:903-1226 installation_authority"]
