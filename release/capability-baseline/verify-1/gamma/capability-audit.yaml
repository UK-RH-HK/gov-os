    governing_document_refs: ["framework v4.1.2 Part IX §33", "framework §47-48", "framework/commands/COMMAND_CONTRACT.yaml"]
    requirement_class: ORIGINAL
    status: PARTIAL
    status_justification: >-
      b1 and b3 are met and executably evidenced — a human states intent in ordinary words, and a consequential
      change is classified material by the OS from the change itself and cannot complete outside change control
      (MATERIAL_CHANGE_REQUIRES_CIT at task close), which is the BC-P2-13 repair. b2 is not fully met: the mapping is
      deterministic but semantically wrong for a negated intent — "do not approve this change" routes to APPROVE.
    na_reason_normative_text: null
    partial_qualification_impact: >-
      CANNOT_UNDERMINE the advanced-qualification scenario as Phase 4 scopes it. The router only PROPOSES commands
      and never executes one; it never proposes a command that asserts a human identity; and an APPROVE proposal
      still ends at `gov gate present` plus an owner-signed answer that the OS verifies — so a mis-routed negation
      cannot approve anything, and the synthetic repositories are driven by agents through governed operations, not
      through this router. It is a real unmet bullet and should be repaired, and I record one coverage limit that
      follows from it: a Phase-4 fault class that specifically scores operator-intent handling could not be run
      against this router without scoring the negation case wrong.
