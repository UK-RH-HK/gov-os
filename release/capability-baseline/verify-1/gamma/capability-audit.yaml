        automated_evidence: ["cargo test --lib"]
        independent_evidence: ["evidence/F3-F4-tool-install-gate.out: a descriptor's own security_review claim is never evidence; a governed review by another role and session is required. evidence/F4-plugin-boundary.out: the plugin descriptor's provenance.security_review is recorded as ignored"]
        gap: null
    health_scheduler_tiers: ["G0", "G1", "G5"]
