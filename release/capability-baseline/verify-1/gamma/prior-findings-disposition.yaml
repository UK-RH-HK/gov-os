schema: governance-os.phase-2.prior-findings-disposition
schema_version: 1
run_id: P2-AR-0048
family: gamma
candidate: cap2-candidate-1
candidate_commit: 0bad524d836f179964ffbac31972856ea6434682
inputs:
  - release/capability-baseline/audit-0/gamma-r/findings.yaml       # 36 findings, the gamma audit of record
  - release/capability-baseline/audit-0/synthesis/findings.yaml     # 4 of its findings name a gamma capability
  - release/capability-baseline/audit-0/synthesis/blocker-classes.yaml
method: >-
  Every iteration-0 finding whose `capability` list names a gamma capability (E1-E4, F1-F5, G1-G2, H1-H4, I1-I4) is
  disposed of below. No iteration-0 status was adopted: each disposition rests on this run's own held-out evidence on
  cap2-candidate-1, recorded in evidence/ and reproducible through heldout/RUN-ALL.
dispositions:

  - id: A0-E1-01
    capability: ["E1"]
    title: "`gov init` and every `gov adopt`/`gov migrate` stage ignore the CLI acting role"
    disposition: CLOSED
    evidence: ["evidence/E1-E2-authority.out"]
    reason: >-
      The acting role is now resolved once per invocation (--role, then GOV_ROLE, then `undeclared`) and installed
      process-wide, and every Project opened in the process reads it (runtime/src/authority.rs:83-140). `gov init`
      run as --role orchestrator installs; an invocation declaring no role is refused ROLE_UNDECLARED on every
      mutating path tested. The adopt/migrate STAGES themselves are alpha's scope (S4/S5); what gamma can establish —
      that the resolution is single, shared and never defaults to orchestrator — holds.

  - id: A0-E1-02
    capability: ["E1", "I2"]
    title: "A lower-role worker can write gate answers and decision records directly; task close exempts those paths"
    disposition: CLOSED
    evidence: ["evidence/E1-E2-authority.out", "evidence/OD-P2-01-human-approval.out"]
    reason: >-
      A hand-edited gate answer reads `t2.binding: BROKEN`, `authorisation.state: UNVERIFIED`, `answer.verified:
      false` with code T2_UNBOUND, and is refused as a request. A hand-written decision asserting `human_approved:
      true` authorises no change. Nine separate agent-supplied routes to a human approval (--role human, --by human,
      --by <any label>, GOV_ROLE=human, GOV_HUMAN_GATE_APPROVED, a forged signed document, agent resolution outside
      the policy envelope) are each refused with a typed error.

  - id: A0-E1-03
    capability: ["E1"]
    title: "`task replan` and `memory heldout-starter --force` mutate governed state with no authority class"
    disposition: CLOSED
    evidence: ["evidence/E1-E2-authority.out"]
    reason: >-
      Both commands appear in the probe's mutating-command sweep, each mapped to the AUTHORITY_POLICY operation that
      must guard it, and neither succeeded for an L0 role; the sweep's unguarded count was 0.

  - id: A0-E1-04
    capability: ["E1"]
    title: "The acting role is caller-declared: any process can declare --role human and record human-approved decisions"
    disposition: CLOSED
    evidence: ["evidence/E1-E2-authority.out", "evidence/OD-P2-01-human-approval.out"]
    reason: >-
      `authority::level_of` gives a declared L5 role L0 authority, and both --role human and GOV_ROLE=human are
      refused with cause HUMAN_ROLE_CLAIM. A human answer now requires an owner-signed document verified against the
      machine's provisioned anchor; the owner's signature worked in the probe and re-verifies at use time.
      OD-P2-01 leaves AGENT role identity adapter-declared by owner decision; this finding concerned the HUMAN claim,
      which is closed.

  - id: A0-E1-05
    capability: ["E1", "H3"]
    title: "Task role designation is never enforced and tester independence is a self-declared boolean"
    disposition: RESIDUAL
    residual_finding: V1-H4-01
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out", "evidence/H1-H4-spec-readiness.out"]
    reason: >-
      The designation half is CLOSED: a readiness gap task carries its dimension's designated role and a
      backend-engineer claiming the independent-test gap task is refused ROLE_NOT_DESIGNATED while the
      independent-test-designer is allowed. The tester-independence half is a residual: a test obligation's own
      author_role and independent_of_implementer are author-written and reported `source: declared, established:
      false`. The product no longer honours them as established, and test-DATA authorship is OS-recorded and
      enforced, so this is non-blocking (finding V1-H4-01, BC-P2-34).

  - id: A0-E1-06
    capability: ["E1","E2","E3","E4","F1","F2","F3","F4","F5","G1","G2","H1","H2","H3","H4","I1","I2","I3","I4"]
    title: "Derived views for the gamma capabilities carry headings only; the evidence map maps no check for any of the 19"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out", "evidence/contract-verify.out"]
    reason: >-
      On this candidate the compiled contract view carries checklist bullets for E1, and all 19 gamma capabilities
      have an evidence class and at least one automated check in tests/governance/capability-evidence-map.yaml
      (0 of 19 unmapped). `gov contract verify` in this worktree reports verdict CONTRACT_SOURCE_BOUND over a
      compiled form it describes as "semantically identical to the owner source (universe incl. Gate U, checklist
      items, statements, challenges, labels, Contract v3:53-73 fields)" — 101 capabilities, 23 gates, 713 checklist
      items, canonical import byte-identical. Whether the WHOLE chain is semantically faithful (AC-13) and whether every capability in
      the product has an evidence owner (AC-10) are the synthesis verifier's; for gamma's 19 the defect is closed.

  - id: A0-E2-01
    capability: ["E2"]
    title: "No governed extension point for project-specific roles"
    disposition: RESIDUAL
    residual_finding: V1-E2-01
    evidence: ["evidence/E1-E2-authority.out"]
    reason: "Unchanged: a role id outside the verified kernel ROLES.yaml is refused UNKNOWN_ROLE and no extension key or overlay adds roles."

  - id: A0-E3-01
    capability: ["E3"]
    title: "A handoff return is not bound to the recipient and a later return silently overwrites the earlier one"
    disposition: RESIDUAL
    residual_finding: V1-E3-01
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "Reproduced unchanged: a handoff addressed to backend-engineer was returned by frontend-engineer, accepted, and the record now holds only the second return."

  - id: A0-E4-01
    capability: ["E4"]
    title: "Concurrent claims of one task all succeed (non-atomic check-then-insert)"
    disposition: CLOSED
    evidence: ["evidence/E3-E4-handoff-claims.out"]
    reason: "Eight concurrent OS processes claimed one fresh task; exactly one succeeded. The claim decision now runs inside one BEGIN IMMEDIATE transaction."

  - id: A0-E4-02
    capability: ["E4", "H3"]
    title: "`task claim` accepts any task whose stored status is READY; dependency- and readiness-blocked tasks are claimed and closed"
    disposition: CLOSED
    evidence: ["evidence/E3-E4-handoff-claims.out", "evidence/H1-H4-spec-readiness.out"]
    reason: >-
      Claimability is derived from the DAG: a DRAFT task is BLOCKED and refused TASK_NOT_RUNNABLE with its reasons;
      a task whose stored status is READY but whose dependency is open is refused; an implementation task whose
      pre-implementation readiness cells are unsatisfied is not in the runnable set.

  - id: A0-E4-03
    capability: ["E4"]
    title: "Claims record no worktree identity and parallel claims ignore mutation overlap"
    disposition: CLOSED
    evidence: ["evidence/E3-E4-handoff-claims.out"]
    reason: "A claim records session_id, worktree, git_dir, branch, head and scope; a disjoint scope is claimable in parallel and an overlapping one is refused CLAIM_SCOPE_CONFLICT."

  - id: A0-E4-04
    capability: ["I4", "E4"]
    title: "`gov continue` offers tasks already in progress under another session"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "With session A holding a task, `gov continue` in session B did not offer it."

  - id: A0-F1-01
    capability: ["F1"]
    title: "Skill regression is a static schema/presence check; nothing runs validation scenarios and project-skill versions are not bound to content"
    disposition: CLOSED
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out"]
    reason: >-
      `gov health skills` executes validation scenarios with per-step transcripts (7 of 14 executed here; every
      deferred one states why it is deferred and to which tier) and records content_sha256 for each skill, binding
      version to content.

  - id: A0-F1-02
    capability: ["F1"]
    title: "Skill evidence is not a defined element; inputs/outputs are optional and never consumed"
    disposition: RESIDUAL
    residual_finding: V1-F1-02
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: >-
      The evidence half is CLOSED: validation_scenarios are a defined element and are executed. The inputs/outputs
      half is unchanged: every kernel skill declares them, and `gov skills resolve` returns id, version, source and
      content hash only, so no caller consumes them.

  - id: A0-F1-03
    capability: ["F1"]
    title: "No skill-specific governed promotion; project-scoped lessons cannot propose skill updates"
    disposition: RESIDUAL
    residual_finding: V1-F1-01
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out"]
    reason: "Unchanged: a lesson from ordinary work is PROJECT-scoped and refused UPSTREAM_SCOPE; the framework-change-proposal record cannot name a skill."

  - id: A0-F2-01
    capability: ["F2"]
    title: "Tool registry lacks task-class scoping, sensitivity classification, tool hash pins and approval status"
    disposition: RESIDUAL
    residual_finding: V1-F2-01
    also: V1-F2-02
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out", "evidence/F3-F4-tool-install-gate.out"]
    reason: >-
      Two of the four halves are CLOSED: an installed tool records installation_sha256 and its version pin, and it
      records an explicit approval block (mode, gate where one was needed, the owner decision, the governed rule, the
      branch, why, the bound review and the change transaction). Task-class scoping is unchanged (V1-F2-01) and the
      filesystem-scope half is unchanged (V1-F2-02); a credential_scope field carries the sensitivity half.

  - id: A0-F2-02
    capability: ["F2", "F4"]
    title: "The generated tool registry reports a hand-declared plugin's own provenance claim as registration/approval for all roles"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      A descriptor declaring approved_roles [all], signed provenance, a passed security review and status active is
      reported `unregistered` in the registry view, and the OS records all three declarations in
      descriptor_claims_ignored.

  - id: A0-F3-01
    capability: ["F3"]
    title: "An install gate answered A by the human never leads to installation"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: >-
      An elevated installation raised two gates (its own installation gate and its change transaction's gate), each
      naming the other; after the owner answered both through the authenticated human channel, repeating the same
      `gov tools install` installed the tool (installed=True) without raising a new gate for the same subject.

  - id: A0-F3-02
    capability: ["F3"]
    title: "No maintenance review, no candidate surfacing, unhealthy tools stay active, tool gaps are not linked to tasks"
    disposition: RESIDUAL
    residual_finding: null
    evidence: ["evidence/G1-G2-I1-I4-command-work.out", "evidence/F1-F2-F5-skills-tools-layers.out", "evidence/F3-F4-tool-install-gate.out"]
    reason: >-
      Two halves are CLOSED: a tool gap is now linked work (an unresolved required tool generates a tooling task,
      class tooling, role tooling-engineer, naming the tasks it unblocks), and a failing tool health check writes a
      durable failure record that generates follow-up work. Two halves remain: TOOL_POLICY.auto_install_conditions
      declares no maintenance review, and nothing surfaces candidate tools (the governed route is a tooling task for
      an agent to do that work). Both are recorded as the F3 b1/b2 gaps in capability-audit.yaml rather than as
      separate findings; neither blocks an acceptance criterion.

  - id: A0-F4-01
    capability: ["F4"]
    title: "Any presented, answered-A gate on any subject authorises elevated plugin registration and execution"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      A registration binds registration_subject_sha256 and registration_gate, and execution re-verifies that the
      gate's answer is bound to exactly that subject (APPROVAL_STALE when the descriptor or implementation changes).
      Registering a plugin raised a gate for exactly that registration and only that answer let it run.

  - id: A0-F4-02
    capability: ["F4"]
    title: "The plugin registry is a forgeable repository file under an exempt OS-managed prefix; a forged entry runs an unapproved elevated plugin"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      The registry is OS state at governance/registry/plugin-registry.json with a T2 seal; a hand-written entry is
      refused PLUGIN_REGISTRATION_UNBOUND ("a hand-written, edited, legacy or foreign registration is a request,
      recorded and ignored").

  - id: A0-F4-03
    capability: ["F4"]
    title: "Whether a plugin needs an elevated-permission gate is decided by the descriptor's own declarations"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      For plugins this is closed by construction: EVERY executable plugin needs an OS-written registration and an
      owner-answered gate whatever it declares, and declared elevation is shown to the approver with
      "declared_elevation_decides_nothing: true". The analogous question for a TOOL INSTALLATION is decided by the
      OS reading the installation's commands — and that derivation is defeated by an interpreter wrapper, which is
      recorded as the materially-new finding V1-F4-01, not as a residual of this one.

  - id: A0-F4-04
    capability: ["F4"]
    title: "Unregistered plugins are bound only by machine-local trust-on-first-use; interpreter-only commands are not pinned"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      An unregistered executable plugin does not run at all (PLUGIN_NOT_APPROVED), so there is no TOFU path left, and
      a module-form command (`python3 -m plugmod`) is pinned: the registration carries a non-null
      implementation_sha256 derived by the OS.

  - id: A0-F4-05
    capability: ["F4", "F3"]
    title: "A tool's security review is satisfied by naming ANY existing governed record"
    disposition: RESIDUAL
    residual_finding: V1-F3-01
    evidence: ["evidence/F3-F4-tool-install-gate.out"]
    reason: >-
      Narrowed but not closed. The review must now be a T2-verified ACTIVE report closing a security-class task,
      written by neither the installing session nor the installing role, naming this tool id and version with verdict
      passed — a substantial repair. It is still not bound to the installation subject, so one review authorised six
      different descriptors and a post-review command swap installed and executed on the non-gated branch.

  - id: A0-F5-01
    capability: ["F5"]
    title: "The deferred MCP layer is not reported as a capability gap by doctor/readiness; a handoff may declare authority broader than its task"
    disposition: RESIDUAL
    residual_finding: V1-F5-01
    also: V1-F5-02
    evidence: ["evidence/F1-F2-F5-skills-tools-layers.out", "evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "Both halves reproduce unchanged: `gov doctor` does not mention the MCP layer, and a handoff records a caller-supplied authority envelope of ** over a task scoped to product/narrow/**."

  - id: A0-G1-01
    capability: ["G1"]
    title: "Deterministic intent routing covers control phrases only, inverts negations, names non-operations and is not wired into adapters"
    disposition: RESIDUAL
    residual_finding: V1-G1-01
    evidence: ["evidence/G1-G2-I1-I4-command-work.out"]
    reason: >-
      The "names non-operations" half is CLOSED: every command the router proposes is a governed operation the kernel
      command contract declares, and it never proposes one that asserts a human identity. The negation half is
      unchanged: "do not approve this change" routes to APPROVE.

  - id: A0-G1-02
    capability: ["G1"]
    title: "Consequential spec changes made inside ordinary tasks close with no impact simulation or gate"
    disposition: CLOSED
    evidence: ["evidence/G1-G2-I1-I4-command-work.out"]
    reason: >-
      An interface contract edited inside an ordinary documentation task is classified material by the OS from the
      change itself (derived_classes [interface_change], label_understates true) and the task close is refused
      MATERIAL_CHANGE_REQUIRES_CIT. No operator typed /impact.

  - id: A0-H3-01
    capability: ["H3"]
    title: "The project overlay can switch off pre-implementation readiness gating outside policy precedence"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "With PROJECT_POLICY.readiness.enforce_pre_implementation_cells set to false in the overlay, the implementation task remained blocked."

  - id: A0-H4-01
    capability: ["H4"]
    title: "SCENARIO → DATA → TEST DATA links carried by the product's own fields produce no graph edges; success/failure criteria are not required"
    disposition: CLOSED
    evidence: ["evidence/H1-H4-spec-readiness.out"]
    reason: >-
      `gov scenario trace` returns the whole chain over governed relations (data requirements resolved to their test
      datasets, datasets to their provenance and authorship, tests to their data), and success_criteria and
      failure_criteria are computed readiness chain cells whose absence generates work and degrades health.

  - id: A0-H4-02
    capability: ["H4"]
    title: "Test-data author independence is neither recorded nor checked"
    disposition: CLOSED
    evidence: ["evidence/H1-H4-spec-readiness.out"]
    reason: >-
      A registered dataset's authorship is OS-recorded with a VERIFIED T2 binding, and registering a dataset as the
      scenario's own end-to-end test author is refused DATA_AUTHOR_NOT_INDEPENDENT (only an owner-approved
      independence_waiver lifts it); `gov scenario check` reports DATA_AUTHOR_IS_TEST_AUTHOR.

  - id: A0-H4-03
    capability: ["H4"]
    title: "Data provenance is an optional field that nothing requires or reads"
    disposition: CLOSED
    evidence: ["evidence/H1-H4-spec-readiness.out"]
    reason: >-
      Provenance is required (DATA_PROVENANCE_REQUIRED without a source_kind and origin), it is bound to content that
      must exist (DATA_LOCATION_MISSING otherwise, and content_sha256 is written), and approved-real data needs a
      verified human-approved decision.

  - id: A0-I2-01
    capability: ["I2"]
    title: "'blocks', 'required_data', 'required_tools' and production_merge_allowed are recorded but never enforced"
    disposition: CLOSED
    evidence: ["evidence/G1-G2-I1-I4-command-work.out"]
    reason: >-
      Each field now has an enforcing consumer: an open dependency or an absent required tool/data makes the task
      TASK_NOT_RUNNABLE at claim, allowed/forbidden paths are enforced at close, and production_merge_allowed is
      carried on the task contract into the close decision.

  - id: A0-I2-02
    capability: ["I2", "G1"]
    title: "Any path once touched by a committed CIT is permanently in scope for every later task"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "A task scoped to product/scoped/** that wrote spec/decisions/D-7001.yaml — a path earlier transactions had touched — was refused MUTATION_SCOPE_VIOLATION at close."

  - id: A0-I2-03
    capability: ["I2"]
    title: "Close without a claim baseline truncates the first dirty path by one character"
    disposition: NOT_APPLICABLE
    evidence: ["evidence/E3-E4-handoff-claims.out", "evidence/G1-G2-I1-I4-command-work.out"]
    reason: >-
      The precondition no longer arises in the way the finding describes: a close without the closing session's own
      claim is refused (CLAIM_REQUIRED / TASK_CLAIMED) before any path list is formed, as this run's probes hit
      repeatedly. Every path list observed in this run (MUTATION_SCOPE_VIOLATION details, close receipts, CIT
      manifests) carried whole paths. I did not construct the exact original reproduction, so I record this as not
      applicable on the observed behaviour rather than as verified closed.

  - id: A0-I3-01
    capability: ["I3"]
    title: "Tasks are generated only from readiness gaps; nine of eleven sources generate no work"
    disposition: CLOSED
    evidence: ["evidence/G1-G2-I1-I4-command-work.out"]
    reason: >-
      All eleven contract sources are declared in the verified kernel WORK_GENERATION taxonomy and implemented in
      runtime/src/orchestration/generation.rs; generation was exercised end to end (audit findings and a missing tool
      generated real linked tasks; a lesson from a worker return generated work linked to the causing record); every
      generated task records source, subject, dedup key and evidence; generation is idempotent.

  - id: A0-I4-01
    capability: ["I4"]
    title: "The per-feature view is a grouping in record order, not an end-to-end path"
    disposition: CLOSED
    evidence: ["evidence/PRIOR-FINDINGS-recheck.out"]
    reason: "The per-feature view respects dependency order: no task in a feature's list appears before one it depends on."

  - id: S0-E1-01
    capability: ["E1", "L3"]
    title: "An invocation that declares no role acts as the L4 orchestrator"
    disposition: CLOSED
    evidence: ["evidence/E1-E2-authority.out"]
    reason: "An invocation with neither --role nor GOV_ROLE is refused with cause ROLE_UNDECLARED and carries L0; the orchestrator default is gone."

  - id: S0-F4-01
    capability: ["F4", "D5"]
    title: "A registered, gate-approved, elevated plugin in module form has no implementation pin; post-approval code swaps run undetected"
    disposition: CLOSED
    evidence: ["evidence/F4-plugin-boundary.out"]
    reason: >-
      A module-form plugin (`python3 -m plugmod`) registers with a non-null implementation_sha256 the OS derives, and
      one changed byte of a registered implementation is refused PLUGIN_PIN_MISMATCH. (The D5 retrieval-profile side
      of this finding is delta's/beta's.)

  - id: S0-I4-01
    capability: ["I4", "U"]
    title: "A task whose status is BLOCKED is in the runnable set and is offered by `gov continue`"
    disposition: CLOSED
    evidence: ["evidence/G1-G2-I1-I4-command-work.out", "evidence/E3-E4-handoff-claims.out"]
    reason: "The DAG derives runnability: a BLOCKED task is in the blocked set with its reasons, is refused at claim (TASK_NOT_RUNNABLE) and is not what `gov continue` offers. (The Gate-U side is epsilon's.)"

  - id: S0-W5-01
    capability: ["W5", "N4", "E3"]
    title: "A worker return that satisfies the worker-return schema cannot be used as the task-close receipt"
    disposition: CLOSED
    evidence: ["evidence/E3-E4-handoff-claims.out"]
    reason: >-
      The same schema-valid worker return, with the packet hash and the receipt fields filled, was accepted as the
      task-close receipt (`report_from_worker_return` maps status to outcome). Gamma's stake is the E3 side; W5/N4
      are zeta's and delta's.
summary:
  in_scope_total: 40
  closed: 29
  residual: 10
  not_applicable: 1
  blocking_residuals: ["A0-F4-05 (-> V1-F3-01)"]
  note: >-
    Of the 10 residuals only one carries a blocking finding (A0-F4-05 -> V1-F3-01). The other two blocking findings
    this run raises are V1-F4-02, a residual of BC-P2-45 whose iteration-0 findings sat in other families' capability
    sets, and V1-F4-01, which I label materially new.
