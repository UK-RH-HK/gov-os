findings:
  - id: V1-K4-01
    capability: [K4]
    bullet_source_lines: [650]
    severity: MEDIUM
    title: The impact radius does not determine the agents a change needs, nor differentiate its rollback
    statement: >-
      Contract v3:650 requires the impact radius to affect "traversal/test scope/model tier/agents/human approval/rollback".
      Four of the six hold on this candidate and are demonstrated: traversal depth (0 hops at R0, 5 at R5), semantic
      breadth (0 vs 24 candidates), whether human approval is required (false at R0, true at R5), and the model tier
      through MODEL_ROUTING_POLICY.radius_minimum_tier (T1 T1 T2 T2 T3 T3 across R0..R5); the test set is the tests inside
      the traversed radius. Two do not. (1) Nothing in the CIT's impact, its consequences or the generated work names the
      specialist agents or reviewers the change needs; there is no such output at any radius. (2) The rollback consequence
      the OS states is byte-identical at R0 and at R5 ("rollback: snapshot of every touched file is taken before execution;
      `gov cit rollback` restores it"), and no rollback attribute varies with the radius. Separately, a CIT's own
      `minimum_model_tier` is T3 at every radius, because CIT-P routes the class `governance` (T3) and the radius rule can
      only raise; that is saturation rather than a defect, and is recorded here for the reader.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:650 — "R0-R5 or equivalent affects traversal/test scope/model
      tier/agents/human approval/rollback."
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    prior_finding: A0-K4-01
    label_reason: >-
      Same capability (K4), same bullet and the same two mechanisms as iteration-0 finding A0-K4-01 ("Impact radius does
      not affect model tier, number of specialist agents or the rollback plan"), which the iteration-0 synthesis recorded
      as MEDIUM and non-blocking and therefore did not raise into the BC-P2 blocker-class inventory. It is a residual of
      that finding, not materially new: nothing about the capability or the mechanism is absent from iteration 0. It
      carries no BC-P2 class because the inventory covers blocking classes only. (The model-tier part of A0-K4-01 is
      closed: the radius does map to a tier floor; see evidence/K34-materiality-and-radius.out K4.5.)
    evidence:
      - evidence/K34-materiality-and-radius.out (K4.1-K4.7)
      - heldout/K34-materiality-and-radius.sh
    reproduction: >-
      cd release/capability-baseline/verify-1/delta/heldout && DELTA_RUN=k4 bash K34-materiality-and-radius.sh
      — see the two lines "NOTE rollback consequence at R0/R5" and the K4.6/K4.7 results.
    repair_direction: >-
      Contract v3:650 requires the radius to affect the agents a change needs and its rollback. Closing it requires that
      a simulated change of radius R produce (a) the roles/reviewers the change requires at that radius, as governed
      output an orchestrator and an auditor can read, and (b) a rollback consequence that is a function of the radius
      (for example, what must be re-verified after a restore at R4/R5 versus R0/R1), not a constant string. Both must be
      derived from OS state, not declared by the proposer.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-M1-01
    capability: [M1]
    bullet_source_lines: [690]
    severity: MEDIUM
    title: No routing outcome resolves to the declared T0 (deterministic / no-LLM) tier
    statement: >-
      MODEL_ROUTING_POLICY declares four tiers, T0 "deterministic — no LLM: SQL, graph, AST, parsing, validation, tests,
      generation" through T3, and the router ranks T0. No routing outcome reaches it. Routing every task class the kernel
      declares, at `routine-documentation` (the lowest-floor engineering role), returns only T1, T2 and T3; the kernel's
      lowest `task_class_minimum_tier` is T1, `DEFAULT_CLASS_TIER` for an undeclared class is T2, every kernel role's
      `minimum_tier` is >= T1 except `human` (which is `none` and raises nothing), and every overlay and task declaration
      may only raise the requirement (POLICY_PRECEDENCE floors, `routing::route`). A deterministic requirement therefore
      cannot be expressed as a routing decision: it is expressible only as policy text. The deterministic work the T0
      description lists is in fact performed by the OS itself — graph traversal, schema validation, the governance suite,
      generation — outside the router, and every governance decision in this verification was produced with no model at
      all; what is missing is the tier as a *routing outcome*.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:689-690 — "M1. T0-T3 or equivalent capability tiers /
      deterministic/no-LLM route".
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    prior_finding: A0-M1-01
    label_reason: >-
      Same capability (M1), same bullet and the same mechanism as iteration-0 finding A0-M1-01 ("There is no
      deterministic/no-LLM route"), recorded MEDIUM and non-blocking in iteration 0 and so not raised into the BC-P2
      inventory. Unchanged on this candidate, therefore residual and not materially new. BC-P2-45 (the other inventoried
      M1/M2/M3 class, "project overlay files bypass POLICY_PRECEDENCE") is a different mechanism and is CLOSED — see
      prior-findings-disposition.yaml.
    evidence:
      - evidence/M-model-routing.out (M1.2, and M1.1/M1.3-M1.5 for the tiers that are reachable)
      - heldout/M-model-routing.sh
    reproduction: >-
      cd release/capability-baseline/verify-1/delta/heldout && DELTA_RUN=m bash M-model-routing.sh
      — see "every declared task class routes to one of: T1 T2 T3".
    repair_direction: >-
      Contract v3:690 requires a deterministic / no-LLM route to exist as one of the tiers the OS routes to. Closing it
      requires that at least one governed unit of work resolve to T0 and that the resolution be observable — for example,
      a kernel task class whose minimum tier is T0, or an explicit deterministic execution route the router returns for
      work the OS performs itself — without allowing any project input to lower another class to T0 (POLICY_PRECEDENCE
      floors must continue to hold).
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-M4-01
    capability: [M4]
    bullet_source_lines: [706, 711]
    severity: MEDIUM
    title: The routing comparison cannot separate reasoning effort and reports no reviewer findings
    statement: >-
      Contract v3:703-711 requires telemetry to compare eight dimensions. Six are comparable on the product's comparison
      surface. The other two are required at record time — `gov route --record` refuses a run missing any
      MODEL_ROUTING_POLICY.record_evidence field, demonstrated — and are kept per run in
      `.governance-runtime/routing/evidence.jsonl`, but neither `gov route --report` nor the `model_routing` block of
      `gov telemetry summary` can group by or report them: `routing::report` keys on `provider|model|task_class` and
      aggregates runs, pass, cost, latency and repairs only. Two runs of one model at `extra_high` and at `low` are
      therefore merged into a single row (runs 2, pass_rate 0.5), and reviewer findings (0 versus 7) appear in no column.
      An offline analysis of the raw evidence can still recover both, which is why this is not blocking.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:702-711 — "M4. Empirical routing / Telemetry can compare:
      model/provider; task class; reasoning effort; cost; latency; pass/fail; repair count; reviewer findings."
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    prior_finding: A0-M4-01
    label_reason: >-
      Same capability (M4), the same two bullets and the same mechanism as iteration-0 finding A0-M4-01 ("Telemetry cannot
      compare reasoning effort or reviewer findings"), recorded MEDIUM and non-blocking in iteration 0 and so not raised
      into the BC-P2 inventory. Unchanged on this candidate, therefore residual and not materially new.
    evidence:
      - evidence/M-model-routing.out (M4.1/M4.2 for record-time enforcement; M4.5-M4.7 for the comparison surface)
      - heldout/M-model-routing.sh
    reproduction: >-
      cd release/capability-baseline/verify-1/delta/heldout && DELTA_RUN=m bash M-model-routing.sh
      — see the printed `gov route --report` rows and the report columns.
    repair_direction: >-
      Contract v3:706 and :711 require the comparison to cover reasoning effort and reviewer findings. Closing it requires
      that the product's own routing comparison distinguish runs by reasoning effort and report a reviewer-findings figure,
      so that a routing decision taken from the product's report cannot silently merge populations that differ in either.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-DELTA-01
    capability: [K1, K2, K3, N1, N2]
    bullet_source_lines: [624, 633, 645, 647, 722, 723, 725, 726, 732]
    severity: LOW
    title: Nine checklist bullets in family delta's scope declare no automated check in the evidence map
    statement: >-
      The derived contract views now reconcile with the owner source bullet for bullet for all 18 family-delta
      capabilities (compiled form, evidence map and generated view all carry the same 93 bullets, verbatim), and every
      capability declares an `evidence_class` and an `independent_verification` obligation, so no capability has zero
      evidence owners. Nine individual bullets, however, carry an empty `automated_checks` list: K1.2
      (semantic/lexical/code candidates supplement impact), K2.5 (derived-view regeneration), K3.6 (infrastructure cost),
      K3.8 (data migration), N1.4 (pending decisions/questions), N1.5 (open transactions), N1.7 (test status), N1.8
      (context packet hash) and N2.3 (accepted CIT). All nine are behaviours this verification exercised and found
      present, so the evidence exists — but at bullet level it rests on independent held-out verification alone, with no
      automated owner that would catch a regression between verifications.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:81-91 (each item maps to one or more evidence classes) and the
      frozen gate contract AC-10 (suite-to-contract matrix; "No required capability has zero evidence owners").
    provenance_class: NECESSARY-DERIVED
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-02
    label_reason: >-
      Same mechanism as the inventoried class BC-P2-02 ("Evidence map declares no evidence owner for any capability";
      iteration 0: all 101 rows `NOT_YET_MAPPED` with `automated_checks: []`), now incompletely fixed rather than absent:
      84 of family delta's 93 bullets carry automated checks and 9 do not. Frozen gate contract §8 counts an incomplete
      fix of an inventoried class as a residual.
    evidence:
      - evidence/derived-view-reconciliation.out
    reproduction: >-
      python3 -c "import yaml; m=yaml.safe_load(open('tests/governance/capability-evidence-map.yaml'));
      print([x['id'] for r in m['capabilities'] if r['capability'] in ('J1','J2','K1','K2','K3','K4','L1','L2','L3','L4','M1','M2','M3','M4','N1','N2','N3','N4')
      for x in (r.get('checklist') or []) if not x.get('automated_checks')])"
    repair_direction: >-
      Every checklist bullet should name at least one automated owner (a guard, a test id or a governance-suite check) or
      state explicitly that its only owner is independent held-out verification, so that a reader of the suite-to-contract
      matrix can tell an unmapped bullet from a deliberately independent one.
    owner_decision_required: false
    owner_decision_reason: null
