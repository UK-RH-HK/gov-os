  - id: V1-S4-02
    capability: [S4]
    bullet_source_lines: [923]
    severity: LOW
    title: The A0 safety baseline creates no adoption branch or worktree and takes no snapshot
    statement: >-
      `gov adopt baseline` pins the baseline commit, counts dirty files, runs the baseline tests,
      detects interrupted work and emits freeze advice, but the git branch is unchanged after it, the
      result carries no `branch`, `worktree` or `snapshot` reference, and no restorable snapshot of
      the tree is written. The rollback route for a migration batch is the per-batch rollback point,
      not a whole-tree baseline snapshot.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:923 "A0 safety baseline";
      GOVERNANCE_OS_ADOPTION_MIGRATION_AND_INDEPENDENT_AUDIT_PROTOCOL_v3.0.md §4 (inspect
      branch/worktree; roll back the current atomic mutation; write a recovery checkpoint).
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: Same capability and mechanism as iteration-0 finding A0-S4-01 (non-blocking, no class).
    evidence:
      - evidence/t07-prior-findings.out
      - "heldout/t07_prior_findings.py :: A0-S4-01-A0-creates-an-adoption-branch-or-worktree, A0-S4-01-A0-takes-a-restorable-snapshot-of-the-tree"
    reproduction: "./heldout/RUN-ALL t07"
    repair_direction: >-
      A0 should leave the adoption with a named, restorable starting point — an adoption branch or
      worktree and a snapshot reference — so that "safety baseline" is a state the operator can
      return to and not only a set of observations.
    owner_decision_required: false
    owner_decision_reason: null
    ac3_argument: >-
      CANNOT_UNDERMINE: every destructive batch carries its own rollback point and
      `gov adopt rollback --batch` exists, and A0 does record the baseline commit, so a return path
      exists even without a dedicated branch.

