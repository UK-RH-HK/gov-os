findings:

  # ================================================================= blocking
  - id: V1-S4-01
    capability: [S4]
    bullet_source_lines: [929]
    severity: HIGH
    title: >-
      On a brownfield tree carrying a secret-bearing source file, `gov adopt migrate` (A6) is
      hard-blocked for every batch because A2's SECRET classification is not propagated into the
      project's sensitivity overlay
    statement: >-
      `gov adopt classify` (A2) classifies `src/app/config.py` and `memory/chat_history.sql` of the
      product's own brownfield fixture as class SECRET with sensitivity `secret` (02-CLASSIFICATION.jsonl,
      confidence 0.99, reason "secret path pattern or secret content pattern"). Nothing writes that
      classification into `governance/project/DATA_SENSITIVITY.yaml`, so the health checks `D011`
      (critical, scope global, "2 file(s) contain secret patterns but are not secret-class") and
      `path_map_compliance` (critical, per file) stay active and hard-block `adopt.migrate`. Their
      `remedies` list is `cit.propose, cit.approve, cit.execute, task.create, task.claim,
      handoff.create, update.apply` — no adoption stage. A6..A11 are therefore unreachable on that
      tree through the documented A0..A11 sequence; they become reachable only after a hand edit of
      `DATA_SENSITIVITY.yaml` that classifies the files the OS itself already classified. With that
      edit applied, every batch and every remaining stage runs (batches 1-7 ok, A7/A8/A9/A10 ok).
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:929 "A6 controlled migration" (stages are
      executable/evidenced); :921 "`gov adopt` Stages are executable/evidenced"; the A3
      advanced-qualification challenge (:164) explicitly seeds secrets, and the B2 Repo-B challenge
      (:197) is a tree of exactly this shape. Contract v3 L4 / O5 availability rule as restated in
      P2-HO-0031: "a block refuses only what it protects; its listed remedy stays available".
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: [AC-3]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-33
    label_reason: >-
      Same capability (S4) and the same defect mechanism as the inventoried class: a secret-bearing
      legacy store makes adoption unable to proceed because two parts of the OS disagree about it.
      In iteration 0 the disagreement was planner vs test scaffold; here it is A2's classification vs
      the health checks. The class is not closed, and this is an incomplete fix, not a new mechanism.
    evidence:
      - evidence/t04-adopt-roles.out
      - "heldout/t04_adopt_roles.py :: S4-A6-is-not-hard-blocked-on-a-brownfield-tree-A2-already-classified"
    reproduction: >-
      ./heldout/RUN-ALL t04 ; or: copy fixtures/brownfield/project to a scratch tree, `gov init
      --source <signed release>`, run adopt baseline/inventory/classify/map/plan/test-design as the
      planner, add reviewer tests to 06-migration-tests.yaml and `gov adopt review --verdict
      MIGRATION_PLAN_APPROVED --reviewer-role migration-reviewer` in a fresh session, then
      `gov adopt migrate --batch 1` as migration-executor.
    repair_direction: >-
      An adoption whose own classification stage identifies a secret-bearing artefact must be able to
      complete: either the classification A2 records must become the sensitivity fact the health
      checks read, or the adoption stage that would move/classify those artefacts must be a declared
      remedy of the blocks its own inputs raise, so that no block refuses the work that resolves it.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-S5-01
    capability: [S5, A2]
    bullet_source_lines: [938, 937]
    severity: MEDIUM
    title: >-
      `gov update` decides "already up to date" from the candidate's self-declared version without
      authenticating the source, so a tampered, foreign-signed or below-floor release is reported
      `ok: true`
    statement: >-
      `update::check` reads the candidate's identity with `candidate_identity(&src)` — the
      unauthenticated `KERNEL.yaml`/`KERNEL_MANIFEST.json` of the source directory — and
      `apply_update_opts` returns `{"applied": false, "reason": "already up to date"}` with `ok:
      true` whenever that declared version is not newer than the installed one, before the single
      verification policy runs. On a provisioned machine, a source whose payload has been modified
      (and whose manifest was rewritten to match), a source signed by a different owner's root, and a
      correctly signed source at a sequence below the machine's floor are all reported this way.
      Nothing is installed in any of these cases, and framework.lock is unchanged; the defect is the
      affirmative report, not an admission. The same `ok: true` envelope carries the genuine
      refusals of this ingress (`applied: false, "human gate not presented/answered (INV-008)"`), so
      a caller or an oracle keying on `ok` cannot tell "there was nothing to do" from "the source was
      never authenticated" or from "the operation was stopped".
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:938 "authenticated source" (S5); :143
      "Release/source authenticity is established before any privileged kernel material is staged or
      installed" and :150 "Bootstrap/dev/test trust modes cannot masquerade as certified production"
      (A2); D-0007 rule 2 (a T4/T6 field that names a fact is a request, recorded and ignored).
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: [AC-3]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-37
    label_reason: >-
      Same capabilities (S5, A2) and the same mechanism as the inventoried class — an update decision
      taken from an unauthenticated field of the candidate release. The class's certification-field
      instance is closed (A0-A2-04 is CLOSED above); its version-field instance is not, so this is an
      incomplete fix rather than a new mechanism.
    evidence:
      - evidence/t05-release-init-update.out
      - "heldout/t05_release_init_update.py :: S5-b2-a-tampered-source-declaring-the-installed-version-is-not-reported-as-up-to-date"
    reproduction: >-
      ./heldout/RUN-ALL t05 ; or: install a signed 4.1.6, copy the release, append a comment to
      `kernel/policies/SECURITY_POLICY.yaml`, rewrite KERNEL_MANIFEST.json to match, delete the
      metadata directory, then `gov update --apply --source <that kernel>`.
    repair_direction: >-
      Every `gov update` outcome that reports on a source must rest on the one verification policy's
      verdict for that source: an unauthenticated candidate may not be reported as "already up to
      date" (or as anything else about its identity). Either authenticate before comparing versions,
      or report the comparison as a claim of an unverified source and refuse with a typed result.
    owner_decision_required: false
    owner_decision_reason: null

  # ================================================================= non-blocking
  - id: V1-A5-01
    capability: [A5]
    bullet_source_lines: [174, 173]
    severity: MEDIUM
    title: >-
      `gov rebuild-memory` and `gov memory rebuild` change tracked OS-managed state while
      FREEZE_WRITES or PAUSE is in force
    statement: >-
      With `gov freeze-writes` (and separately with `gov pause`) in force, a sweep of twelve mutating
      commands found ten correctly refused with FROZEN/PAUSED (task.create, gate.create, cit.propose,
      adopt.baseline, audit, adapters.generate, continue, recover, route --record, release record)
      and two that succeed and leave the working tree dirty: `gov rebuild-memory` and `gov memory
      rebuild` rewrite `governance/generated/index-manifest.json` (and, under PAUSE,
      `governance/generated/memory-manifest.json`). Both files are tracked and lie under
      `governance/generated/`, which `t2::OS_MANAGED_PREFIXES` lists as OS-written.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:174 "`FREEZE_WRITES`" and :173 "`PAUSE`".
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-08
    label_reason: >-
      Same capability (A5) and the same mechanism as the inventoried class — a mutating command that
      changes governed files while an emergency control is in force. Most of the class's instances are
      closed; these two are not.
    evidence:
      - evidence/t03-gate-a.out
      - "heldout/t03_gate_a.py :: A5-FREEZE_WRITES-no-command-changes-tracked-governed-state, A5-PAUSE-no-command-changes-tracked-governed-state"
    reproduction: >-
      ./heldout/RUN-ALL t03 ; or: `gov init`, commit, `gov freeze-writes --reason x`,
      `gov rebuild-memory`, `git status --porcelain`.
    repair_direction: >-
      While FREEZE_WRITES or PAUSE is in force no command may change tracked state under an
      OS-managed prefix; a derived rebuild must either refuse with the control's typed error or
      complete entirely inside the derived runtime directory without rewriting the tracked manifests.
    owner_decision_required: false
    owner_decision_reason: null
    ac3_argument: >-
      A5 is PARTIAL on this bullet and the gap CANNOT_UNDERMINE advanced qualification: the two
      commands regenerate derived index manifests deterministically from authoritative truth and
      create or alter no governed fact, decision, gate, claim or lifecycle state; every
      record-writing and lifecycle command is refused, so the control still stops the class of work
      it exists to stop.

  - id: V1-A5-02
    capability: [A5]
    bullet_source_lines: [178]
    severity: LOW
    title: Recovery from an emergency control leaves no durable, reasoned record
    statement: >-
      `gov resume` accepts no reason, and `control::set` overwrites one current-state file: after a
      resume `.governance-state/control.json` reads {mode: RUNNING, writes_frozen: false,
      agents_cancelled: false, reason: null} with no history of the entry reason, the entry time or
      who lifted it. The only trace is `.governance-runtime/telemetry/events.jsonl`, which is derived,
      untracked and deletable; no tracked record names the control episode.
    normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:178 "Recovery from emergency controls is auditable."
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-A5-03, which the synthesis recorded as
      non-blocking and placed in no blocker class; it is unchanged on this candidate.
    evidence:
      - evidence/t03-gate-a.out
      - "heldout/t03_gate_a.py :: A5-b6-the-control-record-retains-the-entry-and-exit-history, A5-b6-recovery-leaves-a-durable-reasoned-record"
    reproduction: "./heldout/RUN-ALL t03"
    repair_direction: >-
      Entering and leaving an emergency control must leave a durable record, in tracked state, of the
      mode, the reason, the acting role and the time for both transitions.
    owner_decision_required: false
    owner_decision_reason: null
    ac3_argument: >-
      CANNOT_UNDERMINE: the control itself is enforced and observable while in force; only the
      after-the-fact audit trail is thin, and the telemetry stream still records both transitions.

