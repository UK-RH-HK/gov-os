  - id: V1-A4-01
    capability: [A4]
    bullet_source_lines: [168]
    severity: MEDIUM
    title: The network-call budget is observed but not enforced
    statement: >-
      With `BUDGET_POLICY.defaults.max_network_calls_per_task` tightened to 1 through
      `PROJECT_POLICY.policy_overrides`, three `network.call` telemetry events for one task are
      recorded and `gov telemetry summary` reports
      `over_budget: [{"task": …, "network_calls": 3, "budget": 1}]`; a fourth is still accepted. The
      model/API spend budget and the parallel-agent budget are enforced — an over-budget routing
      record is stopped and raises HDG-0001, and a claim beyond max_parallel_agents is refused
      BUDGET_EXCEEDED with a gate — so the gap is confined to the network-call class.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:168 "Delegated thresholds are executable,
      not merely declared." (BUDGET_POLICY.governed lists `network_calls`.)
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Same capability and mechanism as iteration-0 finding A0-A4-01 (non-blocking, no class);
      partially repaired, since spend to date is now observable.
    evidence:
      - evidence/t03-gate-a.out
      - "heldout/t03_gate_a.py :: A4-b2-network-call-budget-is-enforced-not-only-reported, A4-b4-network-spend-to-date-is-observable"
    reproduction: "./heldout/RUN-ALL t03"
    repair_direction: >-
      A governed budget class must stop the work that exceeds it, through the same
      `on_threshold_exceeded: human_decision_gate` route the spend budgets take, or the class must be
      declared observational in BUDGET_POLICY so that "governed" is not overclaimed.
    owner_decision_required: false
    owner_decision_reason: null
    ac3_argument: >-
      CANNOT_UNDERMINE: the enforced budgets cover the cost classes that can run away
      (model/API spend, parallel agents, tool-install cost), the network overrun is reported in
      telemetry and observable to the scheduler, and Phase-4 qualification runs offline against
      synthetic repositories where network spend is not a fault class.

