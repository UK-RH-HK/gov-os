later_lifecycle_notes:
  - >-
    R2: the throw-away root, binding authority and human-gate keys this verification used are drawn
    per run; production key custody, a key ceremony, rotation/revocation drills and private-remote
    publication remain R2 work and were not assessed.
  - >-
    R2/R3: the T2 binding key is symmetric and shared by the owner's machines, so a process running
    with the operator's OS privileges on one provisioned machine can seal as the owner on all of
    them. The product states this plainly in `runtime/src/t2.rs`; human answers are additionally
    bound to an owner signature the machines do not hold. Any per-machine, non-repudiable variant
    needs `gov` to sign, which SRR-R0-L4 forbids at this lifecycle.
  - >-
    P4: the qualification repositories should include a Repo-B tree whose secret-bearing legacy files
    exercise V1-S4-01, and an update fault class whose tampered source declares the installed version
    (V1-S5-01).
