rows:

  - artefact_type: specification — requirement
    owner_source: Contract v3:1080 "specifications"
    producer_artefact: 'authored under spec/requirements/, or minted by governed work; `gov artefact show REQ-0001` returns the nine W1 attributes [w01_identity W1-01]'
    stable_id_version: 'record id + declared `version` + SHA-256 of the record bytes; id and hash survive a file move and the misplacement is reported [W1-01, W1-03, W1-04]; the packet''s recorded hash equals the file''s SHA-256 [w04_delivery W4-04b]'
    relationship_type: 'typed, directed edges: TASK -CONSUMES-> REQ, REQ -REALISES-> FEATURE; no inverted edge [w02_contracts W2-01]; SUPERSEDES both ways [W1-08]'
    downstream_consumer_task: 'declared `consumers` and derived actual consumers are both reported; a declared consumer that does not exist is named [W1-09, W1-10]'
    mandatory_or_optional: 'per-entry `required` true/false in the manifest; `optional_inputs` and `supplementary_context` are separate [w02_contracts W2-02, W2-02b]'
    task_input_manifest: '`gov context manifest` names it with its slot, reason source, constraints and resolution [w03_manifest W3-01, W3-02, W3-03, W3-03b]'
    context_packet_evidence: 'delivered in `deterministic_authority.governing_requirements` with its normative content, version and content hash; deterministic across recompiles [w04_delivery W4-01, W4-04]'
    consumption_receipt: '`inputs_consumed: ID@<hash>` is required and validated; a wrong hash or a fabricated id is refused [w05_receipt W5-01, W5-07, W5-07b, W5-07c]'
    output_traceability: 'report -IMPLEMENTS-> REQ and task -PRODUCES-> file edges; the requirement reaches the produced code, the report reaches the requirement [w05_receipt W5-09, W5-09b; w08_lineage W8-01, W8-02]'
    invalidation_trigger: 'content change -> task retest_required, report stale, packet invalidated, revalidation task generated, green record obsolete [w06_staleness W6-01..W6-08]; claim and close refused [W6-09, W6-09c]'
    qualification_challenge: 'Repo A: current spec absent from the semantic index [w10 W10-01]; superseded near-duplicate outranking it [W10-02]; version/hash pin violated [W3-03/-03b]; Repo B: spec moved while keeping its id [W1-03]'
    status: COVERED

  - artefact_type: specification — feature
    owner_source: Contract v3:1080 "specifications"
    producer_artefact: 'spec/features/; nine W1 attributes [w01_identity W1-01]'
    stable_id_version: 'id + version + content hash [W1-01]'
    relationship_type: 'FEATURE -GOVERNED_BY-> REQ, -VALIDATED_BY-> SCN/TO; task -REALISES-> feature [w02 W2-08, w08 W8-01]'
