    consumption_receipt: '`features_implemented` in the receipt contract''s trace [w05 W5-01, W5-02]'
    output_traceability: 'feature -> scenario -> requirement -> task -> code -> test walk [w08 W8-01]'
    invalidation_trigger: 'readiness regression refuses close (G2); a requirement change marks the feature impacted [w12 W12-G4; w06 W6-10]'
    qualification_challenge: 'omit scenarios/acceptance tests so the chain is incomplete (health DEGRADED, work generated); readiness asserted but not evidenced'
    status: COVERED

