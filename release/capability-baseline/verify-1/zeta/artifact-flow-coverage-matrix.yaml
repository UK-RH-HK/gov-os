# --------------------------------------------------------------------------------------------
# AC-8 determination against its three rejection conditions (frozen gate contract line 73)
# --------------------------------------------------------------------------------------------
ac8_determination:
  verdict: MET
  conditions:
    - condition: 'semantic retrieval is relied on to rediscover mandatory inputs'
      holds: false
      evidence:
        - 'the required-input resolution is byte-identical with the index database removed [w03_manifest W3-09]'
        - 'a current spec deleted from the semantic index is still delivered as a mandatory input, with its content [w10 W10-01]'
        - 'with the index removed or corrupt, the packet stays COMPLETE with identical input hashes and only the supplementary block is DEGRADED, with reason and remedy [w10 W10-04-remove, W10-04-corrupt]'
        - 'the retrieved block is separately hashed and never enters the deterministic authority block [w04 W4-02; w03 W3-05]'
      note: 'the one retrieval dependency observed is in the *supplementary* block only.'
    - condition: 'stale versions can silently satisfy downstream work'
      holds: false
      evidence:
        - 'a superseded input makes the manifest BLOCKED, is delivered flagged with its successor, and the task is not claimable [w03 W3-07; w10 W10-02b]'
        - 'a HISTORICAL record cannot satisfy a current authoritative slot and is delivered in conflicting_decisions [w02 W2-06]'
        - 'a declared version or content-hash constraint the input violates blocks the manifest [w03 W3-03, W3-03b]'
        - 'a receipt acknowledging an input at a stale hash is refused (STALE_CONSUMPTION) [w05 W5-07c]'
        - 'after a direct upstream change the work cannot be re-claimed or closed on the stale evidence [w06 W6-09, W6-09c]'
        - 'a superseded, more semantically similar spec never replaces the current required one [w10 W10-02]'
    - condition: 'completion cannot be traced to upstream evidence'
      holds: false
      evidence:
        - 'task close refuses a completion with no consumption receipt, and names every missing field [w05 W5-07]'
        - 'a fabricated requirement id and a missing acceptance evidence entry are refused by name [w05 W5-07b, W5-05]'
        - 'implementation present in the tree but absent from the receipt is refused by path [w05 W5-08]'
        - 'the persisted receipt records inputs consumed, outputs, what was implemented, what was applied, test evidence, deviations and unknowns [w05 W5-02]'
        - 'the close report traces up to the requirement, scenario and decision it names; the requirement reaches the produced code [w05 W5-09, W5-09b]'
        - 'forward and reverse lineage walk feature -> scenario -> requirement -> decision -> architecture -> task -> code -> test -> evidence -> release [w08 W8-01, W8-01b, W8-02]'
  gaps_recorded:
