      - release/capability-baseline/verify-1/zeta/evidence/A1-W-01-contract-verify.out
      - release/capability-baseline/verify-1/zeta/evidence/RUN-ALL.out (W2-05, W4-03, W8-05, W9-03, W9-04, W9-05, W10-03, W10-04-remove, W10-04-corrupt, W12-G6)
    reproduction: >
      python3 -c "import yaml;d=yaml.safe_load(open('tests/governance/capability-evidence-map.yaml'));
      print([(c['capability'],[b['id'] for b in c['checklist'] if not b['automated_checks']])
