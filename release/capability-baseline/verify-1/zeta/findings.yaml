      bullets with evidence classes, health-scheduler tiers, freshness triggers, adoption and
      operational-audit obligations, allowed statuses, N/A requirements and remediation rules.
      Two gaps remain in the Gate-W rows. (a) Nine bullets have `automated_checks: []` — W2.5
