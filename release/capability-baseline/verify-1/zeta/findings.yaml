findings:

  - id: A1-W3-01
    capability: [W3]
    bullet_source_lines: [1097]
    severity: MEDIUM
    title: A task's mandatory inputs carry no reason when they are declared through the typed list fields, and nothing reports the omission
    statement: >
      Contract v3:1097 requires a governed task that depends on upstream artefacts to declare the
      reason for each dependency. The manifest resolver does carry a reason for an input declared in
      object form (`required_inputs`/`optional_inputs` with `reason`, or `relations[].note`), but for
      the typed list fields — `requirements`, `decisions`, `scenarios`, `acceptance_tests`,
      `interfaces`, `architecture`, `required_data`, `derived_from`, `dependencies` — it passes
      `reason = None` (runtime/src/context/manifest.rs:838-890), and the entry is recorded with
      `"reason": null`. A reason appears on such an entry only incidentally, when another rule
      supplies one (feature inheritance, a decision's `affects`, the implicit-architecture rule). A
      task with no feature that declares all of its inputs through those fields therefore resolves a
      manifest in which EVERY required input has `reason: null`, the manifest is `COMPLETE`, and the
      task is READY, claimable and dispatchable. No surface (`gov context manifest`, `gov task dag`,
      `gov artefact check`, the `task_contract_integrity`, `context_reproducibility` or
      `graph_integrity` health families, `gov audit`, and a suite run at G2, G4 and G5) reports the
      omission at any severity.
      `gov task create`, the product's own authoring command, writes the typed list form, so the
      product itself produces manifests with no reasons.
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:1092-1097 — "## W3. Mandatory task-input
      manifest / Every governed task that depends on upstream artefacts declares: … - [ ] reason for
      each dependency".
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
      The bullet is unmet, so W3 is PARTIAL and AC-3 applies; the AC-3 argument
      (CANNOT_UNDERMINE) is recorded in capability-audit.yaml under W3. None of AC-8's three
      rejection conditions is touched: the reason is prose beside a dependency, not the dependency,
      its version or its delivery. AC-2 is satisfied (PARTIAL, not ABSENT/UNCLEAR).
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-17
    label_reason: >
      Same capability (W3) and same mechanism as the inventoried class BC-P2-17 "Mandatory task-input
      manifest semantics — … the manifest cannot declare required state, version/hash constraints,
      reasons or supplementary context" (iteration-0 finding A0-W3-03). Three of those four elements
      are now implemented and independently evidenced (W3-02, W3-03, W3-03b, W3-05); the reason
      element is implemented only for the object declaration forms and is neither produced by the
      product's own authoring path nor reported when absent. This is an incomplete fix within an
      inventoried class, which §8 of the frozen gate contract defines as RESIDUAL.
    evidence:
      - release/capability-baseline/verify-1/zeta/evidence/RUN-ALL.out (check W3-04)
      - release/capability-baseline/verify-1/zeta/evidence/A1-W3-01-no-reason.out
      - release/capability-baseline/verify-1/zeta/heldout/w03_manifest.py
    reproduction: >
      ZETA_WORK=<scratch> release/capability-baseline/verify-1/zeta/heldout/RUN-ALL, check W3-04;
      or directly: build the seed of heldout/lib.py `seed_green`, author a task with no `feature`
      that declares `requirements: [REQ-0001]`, `scenarios: [SCN-0001]`,
      `acceptance_tests: [TO-0001]`, `interfaces: [IFC-0001]`, `required_data: [DATA-0002]`,
      `dependencies: [TASK-0100]`, then
      `gov --json context manifest TASK-0020` — every entry has `"reason": null`,
      `delivery_state` is `COMPLETE` and `advisories` is empty.
    repair_direction: >
      Contract v3:1097 must hold for every declared dependency, whichever form declares it: the
      resolved manifest must carry a reason for each required input, and the product must either
      supply one for the rules it applies itself (as it already does for feature inheritance, the
      `affects` rule and the implicit-architecture rule) or report the omission through a governed
      surface so a reviewer can see which dependencies are unexplained. The product's own authoring
      command must not produce a manifest the contract does not accept.
    owner_decision_required: false
    owner_decision_reason: null
    secondary_observation: >
      The derived evidence map maps W3.4 to
      `test:lib:context::manifest::tests::a_complete_manifest_is_satisfied_and_names_every_input`.
      That test asserts a reason on exactly one entry — the one declared in object form with an
      explicit `reason` — while the same fixture's `required_data` and `derived_from` entries carry
      none. The mapped automated check therefore does not establish the bullet it is mapped to.

  - id: A1-W-01
    capability: [W2, W4, W8, W9, W10, W12]
    bullet_source_lines: [1087, 1109, 1152, 1157, 1158, 1159, 1169, 1170, 1192]
    severity: LOW
    title: Nine Gate-W bullets carry no automated check in the evidence map, and `severity` is unpopulated for every W capability
    statement: >
      The derived views now carry Gate W's checklist semantics: `gov contract verify` reports
      `CONTRACT_SOURCE_BOUND` with a byte-identical canonical import, the compiled contract carries
      all 86 Gate W bullets with their source lines, the W10 hard-invariant text (line 1164) and the
