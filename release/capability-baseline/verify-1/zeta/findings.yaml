  - id: A1-W12-01
    capability: [W12, W5]
    bullet_source_lines: [1188]
    severity: LOW
    title: '`gov health close-check` reports a close admissible that `gov task close` refuses for an invalid consumption receipt'
    statement: >
      `gov health close-check <task> --report <file>` is documented as "the task-close health gate
      for a task and report, without closing it". Given a report whose consumption receipt omits
      `inputs_consumed`, `requirements_implemented` and `acceptance_evidence`, it returns
      `ok: true` with `allowed: true`; `gov task close` given the same task, the same working tree
      and the same report refuses with `RECEIPT_INVALID`
      (`RECEIPT_FIELDS_MISSING, INPUT_NOT_ACKNOWLEDGED, TRACE_INCOMPLETE, TEST_EVIDENCE_MISSING`).
      The two were compared in a repository whose only variable was the receipt. The enforcing gate
      is correct — W12:1188 and W5:1124 are met — but the surface offered for previewing it omits
      the receipt validation (`verification::close_gate` runs the G0 guard, the G2 re-check,
      currency and product evidence; `require_receipt` is called by `tasks::close`, after it).
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:1188 "G2 verifies task
      input/consumption/traceability before task close."; :1124 "refuses missing mandatory
      traceability where required".
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
      The contract's obligation is on the gate, and the gate refuses (independently evidenced,
      check W12-G2). Nothing can be closed on an invalid receipt. The defect is that an operator or
      an agent asking the product whether a close will be admitted is told yes when it will be
      refused — a usability and trust-in-the-preview defect, not an artefact-flow one.
    new_vs_residual: MATERIALLY_NEW
    inventoried_class: null
    label_reason: >
      The surface `gov health close-check` did not exist in cap2-candidate-0; it is a repair-round-2
      addition. The mechanism — a preview surface reporting admissible what its own gate refuses —
      appears in no iteration-0 blocker class: BC-P2-20 concerns the close ACCEPTING an absent or
      fabricated receipt (which it no longer does), not a preview diverging from the gate. Under
      frozen gate contract §8 a mechanism absent from the inventory is MATERIALLY_NEW, so it is
      labelled MATERIALLY_NEW even though it is non-blocking and therefore adds no materially new
      *blocker* class to the convergence count.
    evidence:
      - release/capability-baseline/verify-1/zeta/evidence/RUN-ALL.out (check W12-G2b; the enforcing gate is W12-G2)
      - release/capability-baseline/verify-1/zeta/evidence/A1-W12-01-close-check.out
      - release/capability-baseline/verify-1/zeta/heldout/w12_tiers.py
    reproduction: >
      Build the `seed_green` baseline, claim TASK-0001, write src/export.rs, `gov rebuild-memory
      --incremental`, `gov verify product`, build a valid receipt from the packet's
      `receipt_contract`, then delete `inputs_consumed`, `requirements_implemented` and
      `acceptance_evidence` from it and run
      `gov --json health close-check TASK-0001 --report <file>` (ok: true, allowed: true) and
      `gov --json task close TASK-0001 --report <file>` (RECEIPT_INVALID). Check W12-G2b.
    repair_direction: >
      A surface that previews a gate must apply the same refusals as that gate, or must say in its
      result which of the gate's checks it did not run, so that `allowed: true` cannot be read as
      "this close will be admitted".
    owner_decision_required: false
    owner_decision_reason: null

  - id: A1-W5-01
    capability: [W9, W5]
    bullet_source_lines: [1156]
    severity: LOW
    title: The first uncommitted path is still truncated, and is now silently dropped from `gov recover`'s uncommitted-governance report
    statement: >
      `Project::git` trims the whole of git's stdout (runtime/src/project.rs:265-278) and
      `Project::git_dirty_files` then slices each line at `l[3..]` (:298-307). The first line of
      `git status --porcelain` for a modified tracked file is `" M path"`; after the global trim it
      is `"M path"`, so the slice yields `path` minus its first character. Observed on this
      candidate: with seven dirty paths of which the first is
      `governance/generated/index-manifest.json`, `gov recover` lists six of them under
      `uncommitted_governance_changes` — the first is transformed into
      `overnance/generated/index-manifest.json`, fails the `starts_with("governance/")` filter and
      disappears. The defect no longer reaches the surfaces iteration 0 found it on: task close now
      compares against the sealed claim baseline (`observe_against`), not `git_dirty_files`, and
      checkpoints record `files_changed` from the report, so no W5 or W9 checklist bullet is unmet
      (W5-08, W9-02 and W12-G3b all pass). The remaining consumers are `gov recover`'s
      interrupted-state report, `gov adopt baseline`'s interrupted-state detection and the
      scheduler's provenance count.
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:1156 "Checkpoint records input
      IDs/versions/hashes or equivalent state reference." — read with the framework's §§59-61
      recovery/continuity obligations that `gov recover` implements; the report that names which
      governed files are uncommitted is part of the state a resuming agent is given.
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
      No Gate-W checklist bullet is unmet: the checkpoint's own input record is correct and
      complete (W9-02), the close path does not use this function (W5-08), and the omission is one
      entry in an advisory recovery list. Recorded so that the underlying string handling is
      repaired rather than left to resurface on a future consumer.
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >
      This is the same defect as iteration-0 finding A0-W5-03 (W5, W9) — the same two lines of
      `runtime/src/project.rs`, unchanged on this candidate — with a narrower consequence. It is
      labelled RESIDUAL because the capability and the mechanism are identical to an iteration-0
      finding. `inventoried_class` is null because A0-W5-03 was recorded non-blocking and the
      iteration-0 class inventory contains only the 134 blocking findings, so no `BC-P2-NN` class
      names it. It adds no materially new blocker class.
    evidence:
      - release/capability-baseline/verify-1/zeta/evidence/A1-W5-01-dirty-path-truncation.out
    reproduction: >
      In a governed repository, commit everything, then modify two tracked governed files so that
      `git status --porcelain` begins with `" M governance/…"`, and run `gov --json recover`:
      the `uncommitted_governance_changes` item omits the first path. Compare with the raw
      `git status --porcelain` output.
    repair_direction: >
      Git's porcelain output must be parsed without trimming the stream (trim per line, or read the
      status codes by position after splitting), so that every uncommitted path is reported whole
      wherever it is reported.
    owner_decision_required: false
    owner_decision_reason: null

  - id: A1-W8-01
    capability: [W8]
    bullet_source_lines: [1152]
    severity: LOW
    title: Cross-language and cross-repository relationships are not established (W8.5, conditioned on "where in scope")
    statement: >
      The code graph captures relationships in more than one language in the same repository: with
      a Rust crate and a Python package both under a code-indexed path, `symbols` carries both
      languages and `symbol_refs`/`edges` carry Python `IMPORTS`/`CALLS` edges and Rust
      `IMPORTS`/`CALLS` edges. What was not established is a single relationship that SPANS two
      languages (a Python caller resolved to a Rust definition, i.e. an FFI boundary), and any
      cross-repository relationship: the repository contract governs one repository and declares no
      cross-language or cross-repository convention, and the built-in extractor resolves names
      within the index (same file, then imports, then repository). The iteration-0 statement of
      this gap ("a TypeScript consumer and a Python producer of the same interface are not
      connected") is therefore not disproved on this candidate.
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:1152 "cross-language/cross-repository
      relationships where in scope".
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
      The bullet is conditioned on "where in scope". Nothing in the accepted sources places a
      cross-language or cross-repository relationship in scope for this product at Phase 2, and the
      Gate W advanced-qualification challenge (line 1194) names no such fault. W8 is recorded
      PARTIAL with an argued CANNOT_UNDERMINE statement rather than PRESENT_AND_SUBSTANTIAL,
      because the bullet is not demonstrated, not because a required behaviour is missing.
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-20
    label_reason: >
      Same capability (W8) and same mechanism as the inventoried class BC-P2-20, whose iteration-0
      finding A0-W8-01 states "Lineage stops before implementation, evidence and release; stale
      links and cross-language links not captured". The first three elements are now closed and
      independently evidenced (W8-01, W8-01b, W8-02, W8-03, W8-04); the cross-language element is
      partially closed (multi-language within one repository) and not closed for a relationship
      spanning languages or repositories. An incomplete fix within an inventoried class is RESIDUAL.
    evidence:
      - release/capability-baseline/verify-1/zeta/evidence/RUN-ALL.out (checks W8-05, W8-05b)
      - release/capability-baseline/verify-1/zeta/heldout/w08_lineage.py
    reproduction: >
      Check W8-05 shows `symbols_by_language: {python: 5, rust: 15}` with `python_code_edges: 2`
      and `rust_code_edges: 2` in one repository; no edge connects a Python symbol to a Rust one.
    repair_direction: >
      Either an accepted source must place a cross-language or cross-repository relationship in
      scope (naming the convention by which such a relationship is declared — an FFI/interface
      binding, or a second governed repository in the repository contract), after which the code
      graph must resolve it; or the product must record, in the evidence map, that the bullet is
      not applicable at this lifecycle with the text that places it outside — the contract's own
      rule that a silent N/A is invalid applies.
    owner_decision_required: true
    owner_decision_reason: >
      Placing cross-repository relationships in scope adds a product requirement (a second governed
      repository, its trust and path-map boundary, and how identity and impact cross it) that the
      accepted sources do not make. An agent cannot legitimately decide whether Phase 2 requires it.

  - id: A1-W4-01
    capability: [W4]
    bullet_source_lines: [1109]
    severity: INFO
    title: An over-budget mandatory block is delivered and dispatched with a warning, with `delivery_state` still COMPLETE
    statement: >
      When the mandatory blocks alone exceed `CONTEXT_POLICY.max_packet_chars`, the packet is
      delivered whole — no mandatory input is dropped or truncated (independently evidenced: with
      the budget at 2000 characters against 21418 characters of mandatory content, `input_hashes`
      and every delivered input block are byte-identical to the unconstrained packet) — and the
      condition is disclosed in `budget.over_budget: true` plus a `warning` that says to split the
      task. `delivery_state` remains `COMPLETE` and `ensure_dispatchable` admits the packet, so
      `gov continue` will dispatch a packet that cannot fit the model's context.
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:1109 "Required inputs cannot be displaced
      by context-ranking/token pressure without an explicit governed failure/degradation."
    provenance_class: VERIFIER-HARDENING
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
      The bullet forbids DISPLACEMENT of required inputs under token pressure. No displacement
      occurs — supplementary slices are dropped first and the mandatory block survives intact — so
      W4.3 is met and W4 is PRESENT_AND_SUBSTANTIAL. Recorded for later hardening only.
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >
      Identical to iteration-0 finding A0-W4-05 (same capability, same mechanism, same conclusion
      that the bullet is met). `inventoried_class` is null because A0-W4-05 was recorded INFO and
      non-blocking, and the iteration-0 class inventory contains only blocking findings.
    evidence:
      - release/capability-baseline/verify-1/zeta/evidence/RUN-ALL.out (checks W4-03, W4-03b, W4-03c)
    reproduction: >
      Set `policy_overrides: {"CONTEXT_POLICY.max_packet_chars": 2000}` in
      governance/project/PROJECT_POLICY.yaml and `gov --json context compile TASK-0001`:
      `budget.over_budget` is true, `warning` is set, `delivery_state` is `COMPLETE`.
    repair_direction: >
      A packet whose mandatory blocks alone exceed the budget should be an explicit governed
      degradation state (a `delivery_state` or supplementary-state value dispatch recognises), so
      that a worker is never handed a packet the product itself has measured as unfittable.
    owner_decision_required: false
    owner_decision_reason: null
