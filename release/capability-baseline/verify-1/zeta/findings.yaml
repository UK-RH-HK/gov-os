      (b) `severity` is `null` for all twelve W capabilities (and for all 101 capabilities),
      although Contract v3:61 lists "severity if violated" among the required contract fields per
      capability and the evidence map declares the field.
    normative_source: >
      Governance_OS_Capability_Acceptance_Contract_v3.md:55-73 "Every capability item should carry,
      where applicable: … severity if violated; … automated check/test IDs"; frozen gate contract
      AC-10 (every required capability has at least one evidence owner).
    provenance_class: NECESSARY-DERIVED
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    blocking_argument: >
