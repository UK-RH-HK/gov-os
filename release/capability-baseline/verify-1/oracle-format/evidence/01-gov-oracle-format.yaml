schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  $id: https://schemas.agentic-engineering-os/qualification-oracle/qualification-oracle.schema.json
  title: 'Governance OS Qualification Oracle format (Contract v3 Gate V: V1-V4)'
  description: 'Machine-checkable format of the verifier-owned hidden oracle of a sophisticated qualification repository (Contract v3:1012-1062) and of the quantitative qualification score report computed against it. Two document kinds: ''qualification-oracle'' carries V1 (fault manifest), V2 (hidden path-map oracle, required for a brownfield repository) and V3 (hidden memory oracle) for exactly one qualification repository at one commit; ''qualification-score-report'' carries V4 (quantitative scoring) for one candidate run, bound to the oracle by its canonical digest (SHA-256 of the canonical JSON of the whole oracle document: keys sorted, no insignificant whitespace, UTF-8). This file is a FORMAT: it contains no fault, no oracle content and no qualification repository. It is kept separate from the permanent public qualification suite (Contract v3:1062): oracle documents are stored by the fresh verifier outside the public suite and outside the qualification repository, and `gov oracle validate` refuses an oracle stored inside either or any trace of it found in either. Every document names the digest of the format definition it was authored against (format_sha256), so a hidden fault can only be written against a format version whose acceptance (Contract v3:1206; frozen gate contract AC-6) can be checked. Validation = this JSON Schema plus the semantic rules `gov oracle validate` enforces (unique ids; capability ids, challenge ids and G-tiers drawn from the owner source; path-map action/target consistency; contradiction-free memory oracle; V2/V3 consistency; score arithmetic and oracle binding).'
  x-format: governance-os.qualification-oracle
  x-format-version: 1
  x-format-status: PROPOSED — no hidden fault may be generated against this format until a fresh independent oracle-format reviewer issues QUALIFICATION_ORACLE_FORMAT_ACCEPTED for this format_sha256 (Contract v3:1206; frozen gate contract AC-6, section 9.2).
