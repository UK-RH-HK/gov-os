        my_evidence: >-
          framework/qualification-oracle/qualification-oracle.schema.json (format_sha256
          f89a3e2ff882e116f4593d0f7b8fd9725c7ba491090aedadc3a942c66f4316fd) with two document kinds, the
          validator runtime/src/qualification_oracle.rs, and the commands `gov oracle format` /
          `gov oracle validate`. My own extraction of Gate V from the owner-source bytes finds all 35
          checklist bullets and 5 prose statements mapped to existing, required, typed fields, with 0
          problems (evidence/02-coverage-crosswalk-check.out).
      - limb: '"a fault-manifest record lacking every V1 field is accepted"'
        disposition: CLOSED
        my_evidence: >-
          Exactly that record planted in a freshly `gov init`-ed governed project is refused by the
          governance suite as `high | FM-0001 (fault-manifest) is hidden Qualification Oracle material
          inside the governed repository`, and the finding disappears when the record is moved aside
          (evidence/12-governed-repo-record.out). Separately, 90 invalid samples - one per V1-V4 bullet for
          missing fields, plus wrong types, semantic contradictions, arithmetic and binding attacks - are
          each refused with a typed error naming the Contract v3 element
          (evidence/05-RUN-ALL-samples.out: 93 samples, 93 as expected, 0 unexpected).
      - limb: '"GATE-P2-ORACLE-FORMAT is NOT_SATISFIED"'
        disposition: CLOSED
        my_evidence: >-
          This review is the fresh independent acceptance that frozen gate contract AC-6 and section 9.2
          require, issued before any hidden fault exists: verdict ORACLE_FORMAT_ACCEPTED for
          format_sha256 f89a3e2ff882e116f4593d0f7b8fd9725c7ba491090aedadc3a942c66f4316fd.
      - limb: '"V1-V4 have zero evidence owners" (the AC-10 limb)'
        disposition: CLOSED
        my_evidence: >-
          All 35 Gate V bullets now carry at least one evidence owner in
          tests/governance/capability-evidence-map.yaml; 0 bullets have zero owners
          (evidence/11-evidence-owners-v1-v4.out). V1-V3 carry an empty health_scheduler_tiers list, which
          AC-10 does not require to be non-empty; recorded as my finding V1-OF-06 (INFO), not as a residue.
    residual_risk: >-
      The format is accepted; two MEDIUM findings I raise (V1-OF-01 leak-scan blind spots, V1-OF-02 V4 metrics not
