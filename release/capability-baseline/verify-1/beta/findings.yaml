  - id: V1-BETA-03
    capability: [D5, C3]
    bullet_source_lines: [345, 346, 348]
    severity: MEDIUM
    title: >-
      The held-out set the product generates leaves its semantic queries pending, so a governed profile selection can
      rest on evidence that cannot discriminate the component being selected
    statement: >-
      `gov init` generates the starter held-out set with its `semantic_paraphrase` queries marked pending
      ("paraphrase placeholders are pending"), so `gov memory verify` and `gov memory benchmark` measure only
      exact_id, exact_path, symbol, lexical_literal and graph_impact queries — none of which depends on the embedder.
      Every embedder candidate therefore measures identically: this verifier measured `current` (512-d) and
      `builtin:64` at recall@k 0.9333 / MRR 0.9333, and `builtin:8` at the same values, on the generated set. The
      gate the product raises for a profile change then reports "the candidate is not worse than the current profile
      on every held-out measure", which is true and says nothing about semantic retrieval. Nothing refuses or flags a
      selection made on such evidence: the pending count is reported and the change is applied. That the mechanism
      itself is sound was confirmed by authoring three real paraphrase queries, after which the same benchmark
      separated the candidates (semantic recall 0.667 / 0.667 / 0.333 for current, builtin:64, builtin:8) and a
      measurably worse candidate was rolled back by its regression.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:342-348 "## D5. Evidence-driven retrieval model selection —
      golden/held-out retrieval queries exist ... changing them requires governed migration/reindex/regression"; and
      PHASE-2-FROZEN-GATE-CONTRACT.md §9.1, item 7's stated purpose "so sophisticated qualification is not run on
      intentionally inadequate semantic retrieval".
    provenance_class: NECESSARY-DERIVED
    lifecycle: P3
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-30
    label_reason: >-
      Same capability (D5) and the same mechanism as the inventoried class — "profile changes are not bound to
      benchmark evidence". They are now bound; what the binding does not yet require is that the evidence measure the
      component being changed, so the binding can be satisfied vacuously. An incomplete fix of the same mechanism,
      not a new one. It is recorded as P3 because AC-7 as interpreted in §9.1 asks for an executable, evidenced PATH,
      which exists and was exercised end to end; the inadequacy would bite when Phase 3 selects the profile.
    evidence:
      - release/capability-baseline/verify-1/beta/heldout/t-D4-D5-AC7-retrieval-profile.sh
      - release/capability-baseline/verify-1/beta/evidence/heldout/t-D4-D5-AC7-retrieval-profile.sh.out
      - release/capability-baseline/verify-1/beta/evidence/ac7/discrimination.out
    reproduction: >-
      BETA_WT=<worktree> release/capability-baseline/verify-1/beta/heldout/t-D4-D5-AC7-retrieval-profile.sh — check
      D5-heldout-discriminates fails and prints the measured categories and the pending count.
    repair_direction: >-
      A profile selection must not be applied on held-out evidence that contains no measured query of the class the
      changed component serves: either the generated set must contain real semantic queries, or `gov memory select`
      must refuse (or, at minimum, state on the gate package) that the evidence contains no measured semantic query
      and therefore says nothing about the embedder being selected. Phase 3 must not earn
      PROVISIONAL_RETRIEVAL_PROFILE_READY on such evidence.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-BETA-04
    capability: [D1, C7]
    bullet_source_lines: [313]
    severity: MEDIUM
    title: >-
      The governance suite and the task-close check write into their own currency input classes, so the first close of
      governance-affecting work is always refused as stale and the named remedy must be run twice
    statement: >-
      Green governance evidence is current only while the suite's input snapshot is unchanged. Two writes inside that
      snapshot are made by the checks themselves. (a) A `gov audit` run on a settled tree changes `index_manifest`
      and `spec_tasks` after taking its snapshot, so the green record the FIRST run writes is already obsolete: two
      consecutive audits on an untouched provisioned corpus produced inputs_hash 65ffd464c2 then 40a119281d, with
      those two classes differing; a third and fourth run agree, so it converges after two. (b) `gov task close`
      runs its G2 health check before evaluating currency, and that run records the held-out set's misses as
      memory-quality records under spec/reports/memory-quality/, which is the `evidence_records` class of the same
      key — so the close refuses itself with GOVERNANCE_SUITE_STALE naming `evidence_records`, on a tree where
      nothing else changed. The refusal names `gov health run` / `gov audit` as the remedy; running it once does not
      clear the block, running it again does. The held-out suite has to call its `establish_green` helper (which
      iterates until two runs agree) and then retry the close, and that retry is the evidence for this finding.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:111 "Stale evidence must trigger the appropriate G0-G5
      re-check before work is allowed to rely on it"; :951-953 (L4 availability: a block's listed remedy stays
      available); PHASE-2-FROZEN-GATE-CONTRACT.md AC-5 ("stale evidence", "hard-block vs warning semantics").
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-03
    label_reason: >-
      Same mechanism family as the inventoried class — the composition and enforcement of the green-evidence currency
      key. Iteration 0's defect was that the key omitted input classes; the repair added them, and among the classes
      it added are two that the suite and the close check write to themselves. An incomplete fix of the same
      mechanism, not a new one. Non-blocking because the remedy does converge (a second run clears it) and no
      acceptance criterion is left unmet, but it makes every first close of governance-affecting work fail with a
      message that misdescribes the cause.
    evidence:
      - release/capability-baseline/verify-1/beta/evidence/currency/first-audit-not-current.out
      - release/capability-baseline/verify-1/beta/evidence/heldout/t-C6-C7-C10-temporal-episodic-capability.sh.out
    reproduction: >-
      On a provisioned corpus (heldout/corpus.sh build_corpus_provisioned): `gov audit` twice and compare
      `result.inputs`; then claim a specification task, write its output, `gov audit` once and `gov task close` —
      the close refuses GOVERNANCE_SUITE_STALE naming evidence_records although nothing but the audit ran.
    repair_direction: >-
      A check's own output must not invalidate the record that check writes: the currency snapshot must be taken
      after the run's own writes (or those writes must be excluded from the key), and the close's G2 run must not
      record into an input class of the currency key it is about to evaluate. The refusal must also name the class
      that changed in a way that distinguishes "your work changed it" from "this check changed it".
    owner_decision_required: false
    owner_decision_reason: null

