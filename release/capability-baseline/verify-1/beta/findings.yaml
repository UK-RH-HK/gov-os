    title: Capability memory holds no A2A agent inventory, no resolved dependencies and no observed tool versions
    statement: >-
      Contract v3 C10 requires capability memory to hold tools, MCP servers, A2A agents, packages/dependencies, model
      providers, permission/credential status and environment/tool versions. Tools, MCP servers, model providers and
      permission/credential status are held and resolved per role, and this verifier exercised each. Three are not:
      (a) there is no inventory of the A2A agents a handoff may address — `gov handoff` addresses a ROLE, and nothing
      records which agents exist, their contract or their availability; (b) ecosystem detection records the metadata
      COMMAND of each detected ecosystem and whether its binary is present, and never runs it, so no package or
      dependency set is resolved (runtime/src/capabilities/ecosystems.rs:200-240); (c) `gov tools health` records
      availability and exit status only — of fourteen tools checked, none carried an observed version, and the
      registry's `version` is a declared string such as "system" or "builtin". Capability memory therefore answers
