    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-BETA-08
    capability: [D5, D2]
    bullet_source_lines: [345, 346]
    severity: MEDIUM
    title: >-
      The generated held-out set's two graph queries expect the seed itself, so they can never pass and every project
      carries a permanently failing regression baseline
    statement: >-
      The starter generator emits, for two records, the query "what depends on <id>" with `expected_refs: [<id>]`
      (runtime/src/memory/heldout.rs:43). The graph route correctly returns the DEPENDANTS of the seed and never the
      seed, so these two queries score recall 0 on every project, for ever. Observed on the greenfield corpus
      (HQ-029 "what depends on API-0001" expected [API-0001], got [F-0001, REL-0001, REQ-0001, SCN-0001, TST-0001];
      HQ-030 likewise) and on the adopted brownfield project (HQ-027, HQ-028). Two consequences follow. (a) Every
      project's recall@k baseline is permanently 0.93 rather than 1.0, and any later regression must be judged
      against a baseline that is wrong for a reason unrelated to retrieval quality. (b) Each suite run records those
      two misses as memory-quality failure records under spec/reports/memory-quality/, which is an input class of
      the green-evidence currency key — this is one of the writes behind V1-BETA-04.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:345 "golden/held-out retrieval queries exist"; :346
      "Recall@K/MRR/precision/stale-hit/latency/resource metrics exist"
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: MATERIALLY_NEW
    inventoried_class: null
    label_reason: >-
      The mechanism — a generated held-out query whose stated expectation contradicts the route it declares, so that
      it can never pass — is in no iteration-0 blocker class. The nearest class, BC-P2-26, concerns routing and
      de-duplication in the retrieval pipeline, and the routing itself is correct here: it is the generated
      EXPECTATION that is wrong. The starter generator's graph category was added by a repair round, so this is a
      defect a repair introduced, which §8 labels materially new. It is recorded non-blocking because the regression
      family still passes its thresholds and no acceptance criterion is left unmet.
    evidence:
      - release/capability-baseline/verify-1/beta/evidence/heldout/t-D4-D5-AC7-retrieval-profile.sh.out
      - release/capability-baseline/verify-1/beta/evidence/prior/A10-verify-memory.json
    reproduction: >-
      `gov init` any project, then `gov memory verify`: the `failed` list contains the two graph_impact queries, and
      `governance/tests/memory/heldout.yaml` shows each one's `expected_refs` is the id named in its own query.
    repair_direction: >-
      A generated graph query must expect what the graph route returns: the dependants of the seed (which the
      generator already has, since it selected the seed from the edge table), not the seed itself. Alternatively the
      category must be generated as pending, like the paraphrase placeholders, so that an unauthored expectation
      never counts against the baseline.
    owner_decision_required: false
    owner_decision_reason: null

