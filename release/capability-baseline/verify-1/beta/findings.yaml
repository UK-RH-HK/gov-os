  - id: V1-BETA-06
    capability: [C4, D2]
    bullet_source_lines: [245, 247]
    severity: LOW
    title: Identifier-shaped literals are matched as a disjunction of their subtokens, so near-miss documents share the top scores
    statement: >-
      The lexical engine tokenises with FTS5 `porter unicode61`, which splits an identifier-shaped literal on its
      underscores and digits, and the query is then matched as the disjunction of those subtokens. A query for
      `pyfindbysku_marker_0042` returns, after the one chunk that contains it, three unrelated chunks whose only
      shared token is `marker`, at scores within 0.001 of the correct hit. Recall is unaffected — the correct chunk
      ranks first in every case this verifier tried — but precision on identifier and error-string queries is lower
      than the ranking gap suggests, and a k of 1 is the only safe k for such a query.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:243-249 "## C4. Lexical memory — exact terms / identifiers /
      ... / error strings"
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Iteration 0 recorded it as A0-C4-02 (LOW, non-blocking, no blocker class). Same capability, same mechanism,
      unchanged on this candidate.
    evidence:
      - release/capability-baseline/verify-1/beta/evidence/lexical/or-of-subtokens.out
    reproduction: >-
      `gov memory query pyfindbysku_marker_0042 --k 5` on the held-out corpus: the second through fifth hits are
      chunks of other files that contain only the subtoken `marker`.
    repair_direction: >-
      An identifier-shaped or error-string query should be matched as a phrase over its subtokens (or the literal
      should be indexed whole alongside its subtokens), so that a document sharing one subtoken does not score within
      a rounding error of the document containing the literal.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-BETA-07
    capability: [D1, C2]
    bullet_source_lines: [309]
    severity: LOW
    title: An edge owned by an unchanged file survives its target's deletion in the store until a full rebuild
    statement: >-
      `src/web/client.ts` imports `src/web/http.ts`. Removing `http.ts` without touching `client.ts` and running
      `gov rebuild-memory --incremental` leaves the row `file:src/web/client.ts -IMPORTS-> file:src/web/http.ts` in
      the edge store: the incremental pass re-derives the changed and removed artefacts, and the edge is owned by the
      artefact that did not change. The consequence iteration 0 recorded — a stale edge nobody sees — no longer
      holds: `gov memory integrity` reports it as `dangling` (count 1) and the G5 graph_integrity family carries the
      finding, so it is visible and actionable. The row itself is removed only by a full rebuild.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:309 "Changed artefacts invalidate affected
      chunks/nodes/symbols"; :231 "Graph integrity checks detect orphan/stale/reversed/invalid relationships"
    provenance_class: IMPLEMENTATION-CHOICE
    lifecycle: P2
    falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-29
    label_reason: >-
      Same capability (D1) and the same mechanism the class names — "incremental builds leave stale edges owned by
      unchanged files". The repair added the detection that makes it harmless rather than removing the residue, so
      the mechanism persists in a weakened form: an incomplete fix, not a new mechanism. Non-blocking because D1's
      bullet is about CHANGED artefacts and C2's detection bullet is met.
    evidence:
      - release/capability-baseline/verify-1/beta/evidence/heldout/t-D1-incremental-freshness.sh.out
    reproduction: >-
      BETA_WT=<worktree> release/capability-baseline/verify-1/beta/heldout/t-D1-incremental-freshness.sh — check
      D1-b2-stale-edges prints `remaining=[file:src/web/http.ts], dangling=1`.
    repair_direction: >-
      An incremental pass that removes an artefact should also drop, or re-derive, the edges whose destination it
