  - id: V1-BETA-01
    capability: [C8]
    bullet_source_lines: [277, 278, 279, 282]
    severity: MEDIUM
    title: Four of the seven failure classes have a record shape and no writer, so no record of them can exist
    statement: >-
      Contract v3 C8 requires failure memory to hold bugs, failed approaches, wrong assumptions, retrieval misses,
      regressions, migration failures and tool failures. The product has exactly three writers: `record_tool_failure`
      (tool-failure), `retrieval_miss_event` (retrieval-miss) and the profile/work-generation recorders (regression).
      No code path constructs a FailureEvent of kind `bug`, `failed-approach`, `incorrect-assumption` or
      `migration-failure`, and no command records one: `gov memory miss` records only retrieval misses. The four
      classes exist in the `KINDS` constant (runtime/src/memory/failures.rs:48-57) and in the record schema, and the
      compiled evidence map's only owner for checklist items C8.1, C8.2, C8.3 and C8.6 is one unit test over that
      constant (`test:lib:memory::failures::tests::failure_kinds_signatures_and_locations`), which exercises the data
      model, not a behaviour. Under Contract v3:93 that is not evidence of the capability.
      Consequence beyond the checklist: the work generator creates follow-up work from open failure-memory records
      (runtime/src/orchestration/generation.rs:1223), so a bug or a failed approach can never generate governed
      repair work, and the framework's learning loop (§18) never sees those classes.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:276-283 "## C8. Failure memory — bugs / failed approaches /
      wrong assumptions / retrieval misses / regressions / migration failures / tool failures"; and line 93 "A
      capability may not be reported PRESENT_AND_SUBSTANTIAL solely because a file/schema/policy exists."
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: [AC-3]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-32
    label_reason: >-
      Same capability (C8) and the same defect mechanism the class names — "a failure class the contract lists leaves
      no durable, structured, rebuild-surviving record". Iteration 0 observed it for ad-hoc retrieval misses and tool
      failures; the repair made exactly those two (and regressions) durable and left the other four with no writer.
      This is an incomplete fix of the inventoried class, not a new mechanism.
    evidence:
      - release/capability-baseline/verify-1/beta/heldout/t-C8-failure-memory.sh
      - release/capability-baseline/verify-1/beta/evidence/heldout/t-C8-failure-memory.sh.out
    reproduction: >-
      BETA_WT=<worktree> release/capability-baseline/verify-1/beta/heldout/t-C8-failure-memory.sh — checks
      C8-bug, C8-failed-approach, C8-incorrect-assumption and C8-migration-failure fail while C8-retrieval-miss,
      C8-tool-failure, C8-regression, C8-durable and C8-not-indexed pass. Source confirmation:
      `grep -rn "failure_kind" runtime/src/ cli/src/` shows no writer for the four classes.
    repair_direction: >-
      Each of the seven classes must have a governed way to come into existence and a durable, structured,
      rebuild-surviving record when it does: a product-observed failure of that class recorded automatically where the
      OS observes it (a failing product test family is a `regression`; a refused or rolled-back migration is a
      `migration-failure`), and an agent-observed one recorded through a governed command in the way `gov memory
      miss` already records a retrieval miss, so the work generator and the learning loop can act on it. The evidence
      map's owner for each of those checklist items must then be a check that exercises the behaviour, not the
      constant.
    owner_decision_required: false
    owner_decision_reason: null

  - id: V1-BETA-02
