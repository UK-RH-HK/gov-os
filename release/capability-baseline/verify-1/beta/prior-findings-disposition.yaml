  - id: S0-F4-01
    capability: [F4, D5]
    blocker_class: [BC-P2-40]
    title: A registered, gate-approved, elevated plugin in module form has no implementation pin; post-approval code swaps run undetected
    disposition: NOT_APPLICABLE
    evidence: >-
      The finding's mechanism is the plugin registration's implementation binding, which belongs to Gate F4 and is
      the gamma family's scope in this iteration; this verifier did not register a plugin, because a registration
      needs an owner-signed execution gate raised for that plugin identity and is graded there. For the D5 half —
      "the pinned revision is bound to what executes" — beta established, on this candidate, that the live index's
      reranker component identity is re-verified before a pinned reranker scores anything
      (memory::profile::verify_live_reranker; RERANKER_MISMATCH), that a pinned plugin that does not resolve refuses
      rather than falling back (RERANKER_UNAVAILABLE) and records a tool failure, and that a benchmark candidate
      `plugin:<id>` takes the revision the declared plugin executes rather than a hard-coded one
      (runtime/src/memory/benchmark.rs:36-40).
    reproduction: heldout/t-C8-failure-memory.sh (C8-tool-failure-refusal); heldout/t-D4-D5-AC7-retrieval-profile.sh (D5-b5-pinned)
    residual_note: >-
      NOT_APPLICABLE is recorded for the beta family only; the finding remains live for gamma's F4 verification.
