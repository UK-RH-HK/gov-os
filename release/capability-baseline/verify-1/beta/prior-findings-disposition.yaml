  - id: S0-S4-01
    capability: [S4, B2, R1]
    blocker_class: [BC-P2-33]
    title: Re-running adoption classifies the Governance OS's own generated IDE adapter as legacy provider rules and archives it
    disposition: CLOSED
    evidence: >-
      Re-running `gov adopt inventory` and `gov adopt classify` on a project that has already been adopted
      classifies `governance/generated/adapters/ide/RULES.md` and every other generated adapter as
      GOVERNANCE_CURRENT / ACTIVE, and produces no GOVERNANCE_LEGACY class at all;
      `migrations::classify::legacy_mechanisms` skips `governance/`, `archive/` and `spec/` and anything the OS
