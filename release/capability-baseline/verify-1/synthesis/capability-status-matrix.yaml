- capability: A1
  gate: A
  title: Canonical authority and policy precedence
  owner_source_line: 132
  owner_source_bullets: 6
  family: alpha
  family_run: P2-AR-0046
  family_status: PRESENT_AND_SUBSTANTIAL
  final_status: PARTIAL
  corrected_by_synthesis: true
  correction_reason: 'S1-A1-01: three project overlay documents that carry authority or sensitivity decisions (TOOL_PERMISSIONS.yaml, REPOSITORY_CONTRACT.yaml, DATA_SENSITIVITY.yaml) are read straight from
    the overlay and are never visited by policy_precedence::evaluate_overlay, which evaluates only PROJECT_POLICY.yaml and MODEL_ROUTING_OVERRIDES.yaml (runtime/src/policy.rs:295,340). POLICY_PRECEDENCE
    declares no rule for any of the three, so its own deny-by-default (`default_mode: immutable`, ''Keys without a matching rule are NOT overridable'') never reaches them. Demonstrated for TOOL_PERMISSIONS.yaml:
    a hand edit with no gov command, no change transaction and no gate turned the same tool installation from `expands_authority: true, triggers_fired: [privilege_escalation]` into `expands_authority: false`,
    and the governance suite stayed silent (evidence/rerun-gamma-RUN-ALL.out, the two `OD-P2-03 req 2` FAIL lines). Bullets :134 and :137 are therefore not met for the documents outside the mechanism.'
  bullets_evaluated: 6
  bullet_counts:
    PRESENT_AND_SUBSTANTIAL: 6
  partial_qualification_impact: COULD_UNDERMINE. A1's own advanced-qualification challenge (Contract v3:140) is 'inject contradictory project policies, obsolete provider rules, active/superseded decisions,
    malicious exceptions, and attempted authority/sensitivity weakening'. An attempted authority weakening through TOOL_PERMISSIONS.yaml is neither refused nor reported, so a hidden fault of exactly that
    class scores as undetected. Same defect as V1-F4-02; it adds no blocker class beyond BC-P2-45.
  evidence_location: release/capability-baseline/verify-1/alpha/
  blocking_finding_ids: []
