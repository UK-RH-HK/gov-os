- capability: G1
  gate: G
  title: Natural-language intent
  owner_source_line: 443
  owner_source_bullets: 3
  family: gamma
  family_run: P2-AR-0048
  family_status: PARTIAL
  final_status: PARTIAL
  corrected_by_synthesis: false
  correction_reason: null
  bullets_evaluated: 3
  bullet_counts:
    PRESENT_AND_SUBSTANTIAL: 2
    PARTIAL: 1
  partial_qualification_impact: 'CANNOT_UNDERMINE the advanced-qualification scenario as Phase 4 scopes it. The router only PROPOSES commands and never executes one; it never proposes a command that asserts
    a human identity; and an APPROVE proposal still ends at `gov gate present` plus an owner-signed answer that the OS verifies — so a mis-routed negation cannot approve anything, and the synthetic repositories
