  inventoried_class: BC-P2-37
  label_as_adjudicated: RESIDUAL
  disposition: CONFIRMED
  basis: 'CONFIRMED, and I weighed it as P2-AR-0046 invited. Reproduced twice: `A2-b3-ingress-update-refuses-a-tampered-source` and `S5-b2-a-tampered-source-declaring-the-installed-version-is-not-reported-as-up-to-date`
    (`ok=True reason=''already up to date'' (the source was never authenticated)`). Confirmed by code: `apply_update_opts` returns `{applied:false, reason:''already up to date''}` on `chk[''up_to_date'']`
    (`runtime/src/update.rs:238-240`) and `check` derives that from `candidate_identity(&src)` — the source''s own unauthenticated KERNEL.yaml (`:55-63`) — before the verification policy runs. What settles
    its blocking status is Contract v3:154: A2''s OWN advanced-qualification challenge is ''tampered source payload, stale/forged manifest, wrong key, altered security policy, modified migration, downgrade/replay
    attempt, interrupted install''. A tampered payload with an altered security policy at the installed version string is literally that challenge, and the product answers `ok: true` with no refusal, so
    a hidden fault of that class would score as undetected. AC-3 unmet for S5; RESIDUAL of BC-P2-37 (''trust decisions taken from unauthenticated release fields''), whose capability list already contains
    A2 and S5.'
