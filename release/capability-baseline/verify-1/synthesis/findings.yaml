  basis: 'CONFIRMED. Reproduced: A6 refused on a brownfield tree whose secret-bearing files A2 itself classified SECRET, by D011 and `path_map_compliance` (both critical, scope global), whose remedy lists
    name no adoption stage. Blocking under AC-3 is right: Contract v3:197 makes Repo B a brownfield tree without a path map and :164 seeds secrets, so the tree on which A6 cannot proceed is the one the
    contract''s own advanced-qualification challenges describe. RESIDUAL of BC-P2-33 is right — that class''s inventoried mechanism already includes ''the planner and the test scaffold disagree on a secret-bearing
    legacy store and adoption stalls''.'
- finding: V1-S5-01
  raised_by: P2-AR-0046
  scope: alpha
  capability:
  - S5
  - A2
  severity: MEDIUM
  blocking_as_recorded: true
  blocking_as_adjudicated: true
