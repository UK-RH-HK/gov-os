  disposition: CONFIRMED
  basis: 'CONFIRMED, including its MATERIALLY_NEW label. Reproduced twice in my own run: the four interpreter-wrapped install commands each installed with NO human gate (`branch=not_gated expands=False
    triggers=- undetermined=0`), and `V1-F4-01-executed-proof.sh` showed an ungated installation writing OUTSIDE the project root both with `--execute` and, through `health_check.command`, without it. Confirmed
    by code reading too: `installation_authority` scans each argv element (`runtime/src/tools.rs:980-1078`), `token_values` returns the whole shell string, `leaves_project` tests that string''s first character,
    and `undetermined` is pushed only when `installation_commands(descriptor)` is empty (`:969-972`). On the label: I checked it in the direction that would have avoided escalation and it still stands —
    `installation_authority`, `authority_expansion_triggers`, `installation_envelope` and `CHANGE_POLICY.change_classes.tool_installation` have ZERO occurrences at `cap2-candidate-0`, so the defeated OS-side
    derivation is a mechanism no iteration-0 class can name. Its adjacency to BC-P2-39 is real and P2-AR-0048 recorded it; BC-P2-39''s own inventoried mechanism is the PLUGIN authorize/register path deciding
    from the descriptor''s declared fields, which P2-AR-0048 established is closed (`declared_elevation_decides_nothing: true`, 12/12). New class BC-P2-53.'
