findings:
- id: S1-A1-01
  capability:
  - A1
  - F4
  - F3
  bullet_source_lines:
  - 134
  - 137
  severity: MEDIUM
  title: Project overlay documents that carry authority and sensitivity decisions are never visited by POLICY_PRECEDENCE, so its own deny-by-default never reaches them
  statement: '`policy_precedence::evaluate_overlay` is called for exactly two project overlay documents — PROJECT_POLICY.yaml (runtime/src/policy.rs:295) and MODEL_ROUTING_OVERRIDES.yaml (:340) — under
    a comment that claims the opposite (''BC-P2-45: every project overlay input is subject to POLICY_PRECEDENCE, not only policy_overrides'', :285). Three further documents in governance/project/ decide
    authority or sensitivity and are read straight from the overlay without ever entering that evaluator: TOOL_PERMISSIONS.yaml (`tools::role_permissions`, runtime/src/tools.rs:66-78, which supplies the
    AUTHORISED side of the OD-P2-03 installation envelope), REPOSITORY_CONTRACT.yaml (which decides ''broader filesystem access'') and DATA_SENSITIVITY.yaml (which decides ''new secret access''). framework/policies/POLICY_PRECEDENCE.yaml
    declares rules for sixteen policy documents and for none of these three, so its stated `default_mode: immutable` and its comment ''Keys without a matching rule are NOT overridable (deny by default)''
    never apply to them: deny-by-default is declared but is not reached, because the evaluator never visits the document. DEMONSTRATED for TOOL_PERMISSIONS.yaml: a hand edit with no `gov` command, no change
    transaction and no gate turned the same tool installation from `expands_authority: true, triggers_fired: [privilege_escalation]` into `expands_authority: false`, and `gov audit` reported nothing about
    it. NOT demonstrated for REPOSITORY_CONTRACT.yaml or DATA_SENSITIVITY.yaml: I established only that they are outside the evaluator (by reading the code and by `gov policy overrides`, which reports 0
    applied and 0 refused over them); my attempt to show an effective sensitivity weakening through DATA_SENSITIVITY.yaml was inconclusive — D011 read ''none'' both before and after — so I claim the coverage
    gap for all three and the exploit for one.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:134 'Security and authority floors cannot be weakened by lower-precedence policy'; :137 'Invalid weakening attempts fail closed and
    are observable'; and OWNER-DECISION-P2-0003 requirement 2, 'The authorised envelope is computed from trusted OS state, never from the descriptor's own declarations'.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria:
  - AC-3
  blocking: true
  capability_status_correction: 'A1 was recorded PRESENT_AND_SUBSTANTIAL 6/6 by P2-AR-0046, whose bullet-2 and bullet-6 evidence exercised MODEL_ROUTING_OVERRIDES and SECURITY_POLICY only. I correct A1
    to PARTIAL with `partial_qualification_impact: COULD_UNDERMINE`, because Contract v3:140 makes ''attempted authority/sensitivity weakening'' A1''s OWN advanced-qualification challenge.'
  evidence:
  - evidence/rerun-gamma-RUN-ALL.out (the two `OD-P2-03 req 2` FAIL lines)
  - evidence/AC-16-end-to-end-chain.out
  - runtime/src/policy.rs:285-345
  - runtime/src/tools.rs:66-78
  - framework/policies/POLICY_PRECEDENCE.yaml
  reproduction: GAMMA_WT=<worktree> GAMMA_LAB=<scratch> bash release/capability-baseline/verify-1/gamma/heldout/F3-F4-tool-install-gate.sh ; and `grep -n 'evaluate_overlay' runtime/src/policy.rs` (two call
    sites) against `ls governance/project/` in any initialised project (seven overlay documents).
  repair_direction: 'Every project overlay document whose content can change an authority, permission, filesystem-scope or sensitivity decision must be evaluated through POLICY_PRECEDENCE before it is read
    by the decision it feeds, so that a weakening is refused, left without effect and reported — the property Contract v3:134 and :137 state and that POLICY_PRECEDENCE''s own deny-by-default already promises.
    Which documents those are is determined by the accepted sources: OD-P2-03 requirement 2 names TOOL_PERMISSIONS, AUTHORITY_POLICY, DATA_SENSITIVITY, the path map and the tool policy''s allowlists as
    the envelope sources.'
  new_vs_residual: RESIDUAL
  inventoried_class: BC-P2-45
  label_reason: BC-P2-45's mechanism is 'project overlay files read directly, bypassing POLICY_PRECEDENCE, neither refused nor reported', and its capability list already contains A1, the capability that
    owns policy precedence. The two inventoried instances (MODEL_ROUTING_OVERRIDES, PROJECT_POLICY.readiness) are closed; the mechanism is not. Same capability, same mechanism, incomplete fix.
  owner_decision_required: false
  owner_decision_reason: null
- id: S1-AC13-01
  capability:
  - (all 101, derived views)
  bullet_source_lines:
  - 61
  - 64
  severity: MEDIUM
  title: The evidence map leaves the governed per-capability field `severity` null for all 101 capabilities, and 126 of 713 checklist items name no automated check
  statement: '`tests/governance/capability-evidence-map.yaml` declares `severity` among its governed fields and Contract v3:61 lists ''severity if violated'' among the fields recorded for every capability,
    yet the field is null for all 101. Separately, 126 of the 713 checklist items carry no `automated_checks`, spread over 40 capabilities (H2 23, I1 14, H1 9, P1 9, D4 5, P2 5, N1 4, Q1 4, S2 4, then thirty-one
    capabilities with 1-3 each). P2-AR-0049 saw nine of these in family delta and P2-AR-0051 nine in Gate W; neither could see the product-wide figure, and the `severity` gap is product-wide rather than
    a Gate-W peculiarity.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:53-73 'Required contract fields per capability', specifically :61 'severity if violated' and :64 'automated check/test IDs'.
  provenance_class: ORIGINAL-NORMATIVE
  lifecycle: P2
  falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
  blocks_acceptance_criteria: []
  blocking: false
  why_not_blocking: 'AC-10 is a CAPABILITY-level criterion — ''No required capability has zero evidence owners'' — and all 101 have owners that resolve against the product and that I observed running (798
    owners, 0 unresolved, 0 capabilities without an observed run). AC-13 is fidelity to the OWNER SOURCE, and the owner source states no per-capability severity (the compiled form records it `value_stated_in:
    evidence_map`), so an unpopulated severity is a completeness gap in a derived view, not a semantic difference from the source. It leaves no acceptance criterion unmet, so under frozen gate contract
    §6 it does not block.'
  evidence:
  - evidence/AC-10-gov-contract-matrix-with-my-runs.yaml
  - evidence/AC-13-independent-line-accounting.out
  - tests/governance/capability-evidence-map.yaml
  reproduction: python3 -c "import yaml;m=yaml.safe_load(open('tests/governance/capability-evidence-map.yaml'));c=m['capabilities'];print(sum(1 for x in c if not x.get('severity')), sum(1 for x in c for
    i in (x.get('checklist') or []) if not i.get('automated_checks')))"  -> 101 126
  repair_direction: Every capability must carry the Contract v3:53-73 fields with a value, `severity if violated` included, and every checklist item must name the automated check that exercises it or record
    why none can — the property the evidence map's own `note` already claims ('every capability, checklist item, statement, challenge and label of the owner source; every governed Contract v3:53-73 field
    present').
  new_vs_residual: RESIDUAL
  inventoried_class: BC-P2-02
  label_reason: BC-P2-02 is 'Evidence map declares no evidence owner for any capability'. The capability-level defect is closed (798 owners, none at zero); what remains is the bullet level and one governed
    field. Same capability set (all 101), same mechanism, incomplete fix — the same class P2-AR-0049's V1-DELTA-01 and P2-AR-0051's A1-W-01 name from inside their own scopes.
  owner_decision_required: false
  owner_decision_reason: null
- id: S1-AC13-02
  capability:
  - V1
  - V2
  - V3
  - V4
  bullet_source_lines:
  - 60
  - 1012
  severity: INFO
  title: V1-V4 carry a requirement class the owner source's own field definition does not list — because the owner source itself writes that fourth label
  statement: 'Contract v3:60 defines the field as ''requirement class: `ORIGINAL`, `POST_VERIFICATION_HARDENING`, or `EXECUTION_REFINEMENT`'', while Contract v3:1012 heads Gate V ''**[NEW TESTING REFINEMENT]**''.
    The compiled form resolves this by carrying the owner''s own label verbatim as V1-V4''s `requirement_class` rather than inventing a mapping into the three-value vocabulary (O5''s ''[NEW EXECUTION REFINEMENT]''
    IS mapped, to EXECUTION_REFINEMENT, because the vocabulary contains it). I record this as the faithful reading of an inconsistency in the owner source, not as a defect: the alternative — silently reclassifying
    Gate V as ORIGINAL or as EXECUTION_REFINEMENT — would be the semantic difference Contract v3:47 calls a hard failure. It is visible rather than hidden, which is what AC-13 protects.'
  normative_source: Governance_OS_Capability_Acceptance_Contract_v3.md:60 and :1012; Contract v3:37-49 'Contract authority model'.
  provenance_class: OUT-OF-SCOPE / UNSATISFIABLE-AS-STATED
  lifecycle: P2
  falsifies_or_proposes: PROPOSES_STRONGER_LATER_ASSURANCE
  blocks_acceptance_criteria: []
  blocking: false
  evidence:
  - evidence/AC-13-independent-line-accounting.out
  - evidence/AC-9-AC-13-pinned-inputs-and-contract-verify.out
  reproduction: python3 release/capability-baseline/verify-1/synthesis/evidence/AC-13-independent-line-accounting.py | grep 'labelled capabilities'
  repair_direction: No product repair is implied. If the owner wishes the field to be closed over three values, the owner source's Gate V heading or its line 60 vocabulary is the thing that changes; that
    is owner-controlled material, recorded here so the owner can see it, not raised as a gate.
  new_vs_residual: RESIDUAL
  inventoried_class: BC-P2-01
  label_reason: Same mechanism family as BC-P2-01 (fidelity of the derived views to the owner source); the class's substantive defects are closed and this is an observation about the owner source's own
    vocabulary, recorded so it is not lost.
  owner_decision_required: false
  owner_decision_reason: 'Not an owner DECISION for this gate: nothing is blocked by it and no capability is unmet. It is owner-visible information about the owner''s own text.'
