new_blocker_classes:
- id: BC-P2-53
  title: Tool-installation authority derivation is a literal argv-token scan, so an interpreter-wrapped command hides every effect and installs ungated, and a command the OS cannot read is recorded as fully
    evaluated
  capabilities:
  - F4
  - F3
  mechanism: '`tools::installation_authority` derives what an installation would hold by scanning each argv ELEMENT of `install_command`, `uninstall_command` and `health_check.command` literally (runtime/src/tools.rs:980-1078):
    `bare` is the token''s last path segment, `token_values` returns the token itself, and `leaves_project` tests that token''s first character. One string argument therefore hides sudo, host authority,
    an absolute path and a policy write from the scan, and `undetermined` is pushed only when the descriptor carries NO command at all (:969-972), so a command the OS demonstrably cannot read is treated
    as fully evaluated and clean rather than failing closed. The result is an installation on the `not_gated` branch whose command then runs — with `--execute`, and through `health_check.command` without
    it.'
  first_seen: iteration 1
  findings:
  - V1-F4-01
  max_severity: HIGH
  acceptance_criteria_blocked:
  - AC-4
  - AC-3
  materially_new_reason: 'The mechanism did not exist at cap2-candidate-0 and so cannot lie in the iteration-0 inventory: `installation_authority`, `authority_expansion_triggers`, `installation_envelope`
    and `CHANGE_POLICY.change_classes.tool_installation` have ZERO occurrences at that commit (verified with `git show cap2-candidate-0:...`). The whole OS-side derivation was built during repair iteration
    1 under OWNER-DECISION-P2-0003, and its defect is that the derivation is evadable — not that a descriptor''s declarations are trusted.'
  adjacency_recorded: 'Adjacent to BC-P2-39 (''plugin elevation decided by descriptor self-declaration''), and P2-AR-0048 recorded that adjacency rather than claiming distance from it. I checked the label
    in the direction that would have avoided escalation: BC-P2-39''s inventoried mechanism is the PLUGIN authorize/register path deriving the gate decision from the descriptor''s declared `required_permission_classes`/`permissions`,
    and that path is closed on this candidate (A0-F4-03 CLOSED; `declared_elevation_decides_nothing: true`; 12/12 plugin-boundary assertions). Shading a mechanism that did not exist into a closed class
    to keep the new-class count at zero would be exactly the relabelling frozen gate contract §8 forbids.'
