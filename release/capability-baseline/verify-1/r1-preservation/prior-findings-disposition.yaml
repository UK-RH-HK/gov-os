# What this file covers.
#
# I am the AC-14 R1-preservation verifier, not a capability-family verifier. The iteration-0 inventory holds 52
# blocker classes and 134 blocking findings across the whole capability universe; disposing of all of them is the
# family verifiers' duty. This file disposes of the iteration-0 findings that **my own evidence bears on** — the
# ones whose mechanism sits inside one of the twelve frozen R1 items, in an area the
# `srr1-r1-accepted..cap2-candidate-1` diff changed. Everything else in the inventory is NOT_APPLICABLE to this
# scope and is listed as such in `out_of_scope_classes` rather than silently omitted.
#
# I did not adopt any iteration-0 status. Each CLOSED below rests on a test I wrote and ran on this candidate.

dispositions:
  - finding: A0-E1-02
    inventoried_class: BC-P2-09
    class_title: OS-written (T2) records honoured without binding to an OS operation; lower-role writes exempt at task close
    disposition: CLOSED
    basis: >-
      The T2 binding primitive now exists (`runtime/src/t2.rs`, `runtime/src/srr/binding.rs`, both new since
      `srr1-r1-accepted`) and repository content cannot produce an honoured T2 fact. My `p1::a1` shows all four
      forgeries refused on a live machine: an unsealed hand-written record is `Unsealed`; an invented seal block
      of the right shape does not verify; a genuine seal LIFTED onto different content does not verify; and one
      flipped field on a genuinely sealed record is `Broken`. `p1::a2` shows another machine's seal is `Foreign`.
      `p1::a10` is the positive control — a fact sealed on one bound machine IS honoured on the owner's second
      bound machine and is NOT honoured on a different owner's machine — so this is not a vacuous "nothing is
      ever honoured" pass (P2-ADJ-0003).
    residual_scope: >-
      The "lower-role writes exempt at task close" half of the class is task-close behaviour (capability I2) and
      is the family verifier's to establish; I did not test it. My evidence closes the binding half only.
    evidence: [heldout/p1_t2_binding.rs, evidence/HELDOUT-RUN-ALL.txt]

  - finding: A0-F4-02
    inventoried_class: BC-P2-09
    disposition: CLOSED
    basis: >-
      Same mechanism as A0-E1-02 at the F4 surface: a descriptor or registry entry written into the repository is
      not an OS fact. `p3::c4` writes an attacker "registration" straight into both repository-resident
      `authoritative` stores (`governance/registry/plugin-registry.json`, `.../skill-bindings.json`) and neither
      verifies as a T2 fact; both locations are classified `os_managed_location`, so the unsealed state is
      reported rather than ignored.
    evidence: [heldout/p3_stores_and_tools.rs, evidence/HELDOUT-RUN-ALL.txt]

  - finding: A0-D6-01
    inventoried_class: BC-P2-31
    class_title: Non-rebuildable authoritative state stored in, or classified as, derived/generated state
    disposition: CLOSED
    basis: >-
      The stores are relocated and the classification now holds. `p3::c1` shows every declared store resolves
      through `paths::store_path`, and every machine-local store lands under `.governance-state/`. `p3::c2` is
      the decisive one: with every store present at BOTH its legacy location and where it belongs, the framework
      §19 derived-deletion set contains none of them — so a disaster-recovery delete cannot sweep a
      non-rebuildable store wherever it currently sits. `p3::c3` shows relocation moves the bytes intact, is
      idempotent, and refuses a genuine differing-bytes conflict with a typed `STATE_LOCATION_CONFLICT` that
      touches neither copy and carries a remediation.
    caveat: >-
      Closed, but the repair introduced a NEW and separate defect in the relocation routine it added: see my
      finding V1-R1P-01 (two unreadable files compare equal, so a non-rebuildable legacy store is removed without
      its bytes having been compared). That is MATERIALLY_NEW, not a residual of this class — different mechanism.
    evidence: [heldout/p3_stores_and_tools.rs, evidence/HELDOUT-P2AR0044-c5-unreadable-store.txt]

  - finding: A0-A2-01
    inventoried_class: BC-P2-35
    class_title: Post-install kernel integrity anchored only in repository-controlled records
    disposition: CLOSED
    basis: >-
      The machine's protected installation record IS now consulted after install, and it outranks the
      repository-controlled records. `p2::b7` establishes a genuinely green baseline (`kernel verify` →
      `result.ok: true`), then modifies one installed kernel policy file. Verification then reports
      `result.ok: false`, names `policies/TOOL_POLICY.yaml` as modified, and the protected installation record
      reads `state: DIVERGED` with the basis "the installed payload … is not the payload this machine installed
      into this project — a post-install rewrite, or a change made without an ingress on this machine;
      KERNEL_MANIFEST.json and framework.lock agreeing with it does not make it intact." That last clause is the
      inventoried mechanism being refused by name: a mutually consistent repository rewrite no longer passes.
    freshness_demonstrated: true
    freshness_note: >-
      This is also the AC-10 freshness demonstration for the kernel: a relevant input changed and prior green
      evidence went stale in the same run.
    evidence: [heldout/p2_update_and_kernel.rs, evidence/HELDOUT-RUN-ALL.txt]

  - finding: A0-A2-02
    inventoried_class: BC-P2-36
    class_title: Unauthenticated installation presented as current/verified (default posture)
    disposition: CLOSED
    basis: >-
      On the default unprovisioned machine the product now refuses to present an unauthenticated installation as
      current, verified or certified. `p2::b2` shows `gov update --check` on a freshly bootstrapped machine
      reporting `certification: "UNCERTIFIED"` and `certification_basis.authenticated: false`. `p2::b7`'s
      envelope carries `presented_as: "UNAUTHENTICATED"`, `authenticity_established: false`, and a disclosure
      naming BC-P2-36 and OWNER-DIRECTIVE-0004 as its basis.
    evidence: [heldout/p2_update_and_kernel.rs, evidence/HELDOUT-RUN-ALL.txt]

  - finding: A0-F4-03
    inventoried_class: BC-P2-39
    class_title: Plugin elevation decided by descriptor self-declaration
    disposition: NOT_APPLICABLE
    reason: >-
      Not established by this run, and I will not claim it. BC-P2-39's inventoried mechanism is specifically that
      `authorize`/`register` derive whether a gate is needed from a **plugin** descriptor's own
      `required_permission_classes`/`permissions` (`capabilities/registry.rs`, `capabilities/binding.rs`). What I
      tested is the **tool-installation** surface (`tools::installation_authority`,
      `tools::installation_change_decision`), which is a different code path added under OD-P2-03. The two share a
      principle (Contract v3 F4: a descriptor cannot authorise itself) but not an implementation, and closing one
      is not evidence for the other. The plugin path is the plugin family verifier's scope.
    adjacent_evidence: >-
      For the record, the principle does hold on the surface I did test. `p3::d1`: a descriptor that declares
      nothing elevated but installs with `sudo` is an authority expansion anyway, because the OS derives the
      demanded side from the installation's own commands. `p3::d2`: nine attacker-chosen declarations
      (`human_approved`, `approved`, `trust: T1`, `authority_level: 5`, `expands_authority: false`,
      `gate_required: false`, a fabricated `security_review` verdict, `registered`, `auto_install`) each fail to
      clear the expansion verdict. `p3::d3`: an installation the OS cannot derive gates, fail-closed. `p3::d4`: an
      unauthorised acting role authorises nothing. `p3::d5`: project content cannot enlarge the kernel's network
      allowlist. `p3::d6`: an `install_tool` operation aimed at kernel policy is an expansion. This is evidence
      about OD-P2-03, not about A0-F4-03.
    evidence: [heldout/p3_stores_and_tools.rs, evidence/HELDOUT-RUN-ALL.txt]

  - finding: A0-A2-03
    inventoried_class: BC-P2-37
    class_title: Trust decisions and identity records taken from unauthenticated release fields
    disposition: NOT_APPLICABLE
    reason: >-
      Not established by this run. My evidence touches the adjacent question (an unprovisioned machine refuses
      external-source kernel material outright, `p2::b1`, so on that posture there are no unauthenticated release
      fields left to take a trust decision from), but I did not build a provisioned machine holding a signed
      release with hostile metadata fields, which is what this finding is about. Capability A2/A3/S2/S5/S6 —
      the family verifier's scope.

  - finding: A0-S5-02
    inventoried_class: BC-P2-38
    class_title: Provisioned-machine rollback/reinstall
    disposition: NOT_APPLICABLE
    reason: >-
      Not established by this run. `p2::b8` establishes only the availability half that my scope reaches — that
      `update --rollback` is one of the two named `GATE_FREE_RESTORATION_ROUTES`, that both named remedies are
      themselves on the §5 allow-list (a block does not refuse its own remedy), and that the rollback ingress
      answers typed with no snapshot present. I did not exercise rollback of a previous signed release on a
      provisioned machine, nor the mixed-installation reinstall path, which is what this finding is about.
      Capability S5/A2 — the family verifier's scope.

  - finding: A0-F4-04
    inventoried_class: BC-P2-40
    class_title: Plugin implementation bytes not bound
    disposition: NOT_APPLICABLE
    reason: >-
      Plugin binding (`runtime/src/capabilities/binding.rs`, new) is the plugin family verifier's scope. I tested
      the T2 binding of the plugin *registry* (`p3::c4`), which is a different control, and I make no claim about
      whether the plugin implementation bytes are bound.

  - finding: A0-F3-01
    inventoried_class: BC-P2-41
    class_title: 'Tool acquisition: review evidence and approval not bound to the tool installation'
    disposition: NOT_APPLICABLE
    reason: >-
      Not established by this run. `p3::d2` shows a fabricated `security_review` block inside a descriptor does
      not clear the expansion verdict, which is adjacent but not the same claim: this finding is about whether a
      genuine review and a genuine gate answer are bound to the exact installation subject. Capability F3/F4 —
      the family verifier's scope.

