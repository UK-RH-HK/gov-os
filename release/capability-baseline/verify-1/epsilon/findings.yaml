# Labelling note (frozen gate contract §8). The inventory this verifier was given
# (audit-0/synthesis/blocker-classes.yaml) contains BLOCKING classes only. Two of the four findings below are
# non-blocking, so no BC class can name them; each is nevertheless the same capability and the same mechanism as a
# named iteration-0 finding of the epsilon audit of record, so it is labelled RESIDUAL with
# `inventoried_class: null` and the iteration-0 finding id given in `label_reason`. None of the four is a
# regression into a previously held capability, and none is a new blocker class.

findings:
  - id: E-O5-01
    capability: [O5, U]
    bullet_source_lines: [793, 794, 798, 806, 808]
    severity: MEDIUM
    title: >-
      A tier run never executes the 35 doctor checks the catalogue declares at G1 and G5, yet reports the run
      complete with nothing unevaluated; the RED/YELLOW/GREEN aggregate therefore rests on doctor evidence no tier
      run refreshes
    statement: >-
      `gov health checks` declares D001-D035 as members of tiers G1 and G5 and reports their enforcement
      (15 of them hard-block, 8 at `critical` over every governed operation). `run_suite`
      (runtime/src/scheduler/mod.rs:653) iterates the governance-suite FAMILIES only; `crate::doctor::run` is
      reached from exactly two places (runtime/src/scheduler/mod.rs:1407, the G0 guard's block re-evaluation, and
      the `gov doctor` CLI arm at cli/src/main.rs:1959). Consequently `gov health run --tier G1`,
      `gov health run --tier G5`, `gov audit`, `gov update --apply` and `gov release build` evaluate 39 of the 74
      declared checks, and the health result's own summary reports `executed: 39, reused: 0, not_evaluated: 0,
      complete: true` — it states that nothing in the tier was left unevaluated while 35 declared members of the
      tier were never enumerated. (`gov adopt audit` and `gov init` do run doctor, so the A11 adoption audit is
      unaffected.) The omission is observable in the aggregation: after a change in a relevant input class, with a
      run that does not re-establish currency, `gov health status` reports state GREEN and `failing_checks: []`
      while the same output reports `repository.verdict: DEGRADED`, `governance_suite_currency.current: false` and
      20 stale checks; `gov doctor` then turns the state YELLOW on D021, the Gate U SLO
      `governance_suite_freshness`'s declared owner. The bound on the loss is real but partial: doctor checks ARE
      reported in `stale_checks`, and the G0 guard re-evaluates the doctor checks behind an active block before
      refusing (evidence/RUN-ALL.out AV-6, and evidence/E-O5-01-doctor-tier-gap.out), so a doctor-owned hard-block
      is neither missed at admission time nor left refusing after repair.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:798 "G5 Full Suite — adopt/update/release/full audit";
      :808 "health result provenance is recorded"; frozen gate contract AC-5 "established by exercising it ...
      RED/YELLOW/GREEN aggregation; ... health-result provenance"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: [AC-5]
    blocking: true
    new_vs_residual: RESIDUAL
    inventoried_class: BC-P2-07
    label_reason: >-
      Same capability (O5) and same mechanism as BC-P2-07 "Health tiers G1-G6 do not perform their duties at their
      trigger events" — a tier that does not run the checks it declares at its trigger event. The round-2/3 repair
      closed the family half of every tier and added the doctor surface to the catalogue's tier declarations, but
      did not make a tier run execute it; this is an incompletely closed class, not a new one.
    evidence:
      - evidence/RUN-ALL.out            # AC5-G5-covers-its-declared-tier (the one failing AC-5 item)
      - evidence/E-O5-01-doctor-tier-gap.out
      - heldout/t01_ac5_scheduler.py    # AC5-G5-covers-its-declared-tier
      - heldout/t03_gate_u.py           # U-cross-governance_suite_freshness-owner-not-run-by-a-tier
    reproduction: >-
      heldout/RUN-ALL t01 t03 ; or, by hand on a provisioned project:
      `gov health checks` (D001..D035 list "G1","G5" in `tiers`) →
      `gov health run --tier G5` (summary.executed_checks holds 39 family ids, no D-check, not_evaluated 0,
      complete true) → `gov audit` (same) → touch a source file → `gov health run --check health_slos` →
      `gov health status` (state GREEN, repository.verdict DEGRADED, currency false) → `gov doctor` →
      `gov health status` (state YELLOW, failing_checks [D021]).
    repair_direction: >-
      A tier run must evaluate every check the catalogue declares for that tier, whatever surface implements it, or
      the catalogue must not declare a check at a tier that does not run it; and a health result may report
      `complete` only over the checks it actually considered, with every unevaluated declared member listed in
      `not_evaluated_checks`.
    owner_decision_required: false
    owner_decision_reason: null

  - id: E-P2-01
    capability: [P2, P1]
    bullet_source_lines: [832, 834, 836, 820]
    severity: LOW
    title: Three of the eight organisational questions P2 names are not answerable from the telemetry the OS keeps
    statement: >-
      `gov telemetry summary` answers five of the eight: rework by role (`rework_by_role`), model over/under-power
      (`model_routing`, with pass rate, cost, latency and repairs per provider/model/task class), human-gate
      concentration (`human_gates_by_feature`), cost by task (`cost_by_task_class`) and first-pass completion
      (`first_pass_completion_rate`). It has no token accounting at all, so "retrieval effect on token use"
      (:832) cannot be computed; it has no per-skill metric, so "skill repair rate" (:834) cannot be computed; and
      the retrieval block reports queries, latency and hit counts but not misses, so "retrieval misses" (:836)
      cannot be computed from it (retrieval-miss events exist as failure-memory records, `gov memory miss`, but
      are not aggregated into the summary). Underlying this, P1's "token input/output" (:820) is never produced by
      the OS: `observability::emit` records whatever attributes a caller supplies, and the Gate U
      `tokens_per_completed_task` SLO reads `tokens_input`/`tokens_output` only if a closing report, routing
      evidence row or telemetry event carries them. `cost_by_task_class` answers cost by task class, not by
      feature.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:830-838 "Telemetry supports analysis of: ... retrieval
      effect on token use ... skill repair rate ... retrieval misses ... cost by task/feature"; :820 "token
      input/output"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Not a blocker class: no BC-P2 class covers P1/P2, because the iteration-0 epsilon audit of record recorded
      the same defect as non-blocking (A0-P2-01 LOW and A0-P1-01 MEDIUM, both `blocking: false`). Same capability
      and same mechanism as those findings; no regression, no new blocker class.
    evidence:
      - evidence/RUN-ALL.out            # P2-eight-questions-answerable, P1-os-produced-vs-caller-supplied
      - heldout/t04_gate_o_p.py
    reproduction: >-
      heldout/RUN-ALL t04 ; or `gov telemetry emit --name worker.run --attrs '{...tokens_input...}'` then
      `gov telemetry summary` (no token, skill-repair or retrieval-miss metric in the result).
    repair_direction: >-
      Execution telemetry must carry token accounting produced by the OS's own worker/adapter path rather than
      accepted as free-form caller attributes, and the organisational summary must expose the retrieval/token,
      skill-repair and retrieval-miss aggregates Contract v3:829-838 names, with cost attributable to a feature.
    owner_decision_required: false
    owner_decision_reason: >-
      null — the OS already owns the routing/adapter surface where a token count would be produced; no new external
      dependency or trust-boundary choice is implied.

  - id: E-Q1-01
    capability: [Q1]
    bullet_source_lines: [845, 847, 848, 850, 852]
    severity: MEDIUM
    title: The lesson lifecycle is modelled in the record but not enforced on the path that uses it
    statement: >-
      The lesson record models every Contract v3:845-852 stage (`lifecycle` enum candidate, corroborated,
      classified, proposed, validated, approved, promoted, rejected; `sources`, `corroboration`, `scope`,
      `suggested_change`, `validated_by`), but nothing enforces the order. A FRAMEWORK lesson recorded at
      `lifecycle: candidate` — not corroborated, not classified, not independently validated — is accepted by
      `gov upstream prepare` and a packet is minted for it (PKT-0001 in the probe run). The three stages that are
      *evidence* stages — corroboration (:847), scope classification (:848) and independent validation (:850) —
      therefore rest on a free edit of the record's own field rather than on anything the product establishes.
      Two further stages are mechanised only in part. "execution/report" (:845): the record carries `sources`
      and worker-return lessons become candidates, but this verifier did not establish that a task-closing
      report's lessons do, and iteration 0 found they do not. "governed version" (:852): `gov lessons cluster`
      carries a lesson's `suggested_change` into a cluster with its severity, trigger, confidence and release
      action, but with a single lesson it recorded `release_action: accumulate` and wrote no Framework Change
      Proposal, and this verifier established no link from an FCP to a governed release.
      The residual exposure is bounded by the stage that does hold completely: the export gate applies the
      content scans and requires the product owner's owner-signed answer to an authenticated Human Decision Gate
      before anything leaves (the Q4 probes, all passing), so an uncorroborated, unvalidated lesson cannot reach
      the canonical inbox without the owner.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:844-852 "Q1. Lesson lifecycle — execution/report; lesson
      candidate; corroboration; scope classification; rule/skill/retrieval/tool proposal; independent validation;
      human approval where required; governed version"
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Not a blocker class: the iteration-0 epsilon audit of record raised the same defect as A0-Q1-01
      (MEDIUM, `blocking: false`, "Lesson lifecycle stages are unenforced or absent: corroboration,
      classification, independent validation, governed version"), so it was never inventoried as a BC-P2 class.
      Same capability (Q1) and same mechanism; no regression, no new blocker class. Q1's blocking half
      (A0-Q1-02, human approval as a caller-asserted string, class BC-P2-10) is CLOSED — see
      prior-findings-disposition.yaml.
    evidence:
      - evidence/RUN-ALL.out            # Q1-lifecycle-enforced-at-export
      - heldout/t06_gate_q.py
    reproduction: >-
      heldout/RUN-ALL t06 ; or write a FRAMEWORK lesson with `lifecycle: candidate` into `spec/lessons/`,
      `gov rebuild-memory --incremental`, then `gov upstream prepare <id>` (a packet is prepared).
    repair_direction: >-
      A lesson may reach the export path only from a lifecycle state the product itself established: corroboration
      from independent sources it verified, scope classification it can re-derive, and an independent validation
      recorded the way test-authorship independence now is (from the sealed close report that produced the
      content, not from the record's own field).
    owner_decision_required: false
    owner_decision_reason: null

  - id: E-Q2-01
    capability: [Q2, Q1]
    bullet_source_lines: [855]
    severity: MEDIUM
    title: A lesson may record itself as AUTHORITATIVE and no check contradicts it
    statement: >-
      A lesson record carrying `state_class: AUTHORITATIVE` passes the whole governance suite with no finding from
      any family (probe: `hits == []` across all 39 families on a no-cache run), although Contract v3:855 states
      that lessons are evidence, not authority. The `state_class` enum in `lesson.schema.json` admits
      AUTHORITATIVE alongside EVIDENCE, and nothing narrows it for the `lesson` record type. What bounds the
      exposure is that the claim buys nothing this verifier could find: CONTEXT_POLICY's
      `deterministic_authority_fields` names no lesson field, so a compiled context packet does not carry lessons
      in its deterministic authority block, and the export gate's own decisions are made on scope and content, not
      on `state_class`. The defect is therefore a labelling one — an authority claim the OS neither honours nor
      refuses — rather than an authority escalation this verifier could exploit.
    normative_source: >-
      Governance_OS_Capability_Acceptance_Contract_v3.md:854-856 "Q2. Decision vs lesson — Lessons are evidence,
      not authority. Decisions record chosen action."
    provenance_class: ORIGINAL-NORMATIVE
    lifecycle: P2
    falsifies_or_proposes: FALSIFIES_PHASE2_REQUIREMENT
    blocks_acceptance_criteria: []
    blocking: false
    new_vs_residual: RESIDUAL
    inventoried_class: null
    label_reason: >-
      Not a blocker class: the iteration-0 epsilon audit of record raised the same defect as A0-Q2-01 (MEDIUM,
      `blocking: false`), so no BC-P2 class names it. Same capability (Q2) and same mechanism (the record's own
      `state_class` is accepted unchallenged); no regression, no new blocker class.
    evidence:
      - evidence/RUN-ALL.out            # Q2-lesson-cannot-claim-authority
      - heldout/t06_gate_q.py
    reproduction: >-
      heldout/RUN-ALL t06 ; or write a lesson with `state_class: AUTHORITATIVE` into `spec/lessons/`,
      `gov rebuild-memory --incremental`, `gov health run --no-cache` (no family raises a finding for it).
    repair_direction: >-
      The record schema and the schema/invariants family must make an authority claim impossible for a record type
      the contract defines as evidence: a lesson's `state_class` is constrained to the evidence classes, and a
      lesson (or a lesson-derived proposal) recorded otherwise is a finding.
    owner_decision_required: false
    owner_decision_reason: null
