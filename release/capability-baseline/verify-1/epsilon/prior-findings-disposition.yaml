dispositions:
  # ---------------------------------------------------------------- O1
  - id: A0-O1-01
    capability: [O1, U]
    prior: {severity: HIGH, blocking: true, class: BC-P2-43}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t04_gate_o_p.py]
    reason: >-
      Product-test results are governed. Ten named families (`PROJECT_POLICY.tests.families`) run by name and
      each result is sealed into a governed record (`record: AUD-nnnn`, `record_binding.sealed: true`). A failing
      family exits non-ok, turns the health state RED and raises `product_test_health` blocks scoped to the
      covered paths and globally for `release.build`. A closing report claiming `tests.status: passed` while the
      recorded evidence failed is refused with `PRODUCT_TEST_EVIDENCE_REQUIRED` ("a claim cannot stand in for
      evidence"); only `passed` backed by recorded evidence or `not_applicable_with_reason` is accepted.
      (O1-ten-families-nameable, O1-family-results-recorded, O1-failing-family-reaches-health,
      O1-self-attested-pass-refused.)
  - id: A0-O1-02
    capability: [O1]
    prior: {severity: LOW, blocking: false, class: null}
    disposition: RESIDUAL
    evidence: [framework/policies/TEST_POLICY.yaml, framework/policies/POLICY_PRECEDENCE.yaml]
    reason: >-
      `TEST_POLICY.product_families` is `[unit, contract, integration, system, acceptance, scenario, security,
      performance, recovery, smoke]` — `smoke` carries Contract v3:761 "live/smoke", so the family is
      representable — but POLICY_PRECEDENCE still declares the key `overridable`, so a project may redefine the
      vocabulary and drop security/performance/recovery. Unchanged and still non-blocking: the contract requires
      the OS to support the families, not to forbid a project from narrowing its own vocabulary.
  - id: A0-O1-03
    capability: [O1, O2, O3, O4, O5, P1, P2, Q1, Q2, Q3, Q4, U, V1, V2, V3, V4]
    prior: {severity: MEDIUM, blocking: true, class: [BC-P2-01, BC-P2-02]}
    disposition: NOT_APPLICABLE
    evidence: []
    reason: >-
      The defect is in the derived contract views and the evidence map (AC-13/AC-10), not in any epsilon
      capability's behaviour. Iteration 1 routes AC-13 and AC-10 to the synthesis verifier, which judges the
      contract-binding chain and the suite-to-contract matrix across all six families; judging it here would
      duplicate that. This family reports instead, as input to it, that Gate U is now evaluated as a capability
      by the product itself (`gov health status` → `repository.conditions`, doctor D035) and that O5 and V1-V4
      are exercised as EXECUTION/TESTING REFINEMENTS (see A0-O5-14, A0-U-03 below).

  # ---------------------------------------------------------------- O2
  - id: A0-O2-01
    capability: [O2]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-42}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t08_o2_detection.py, heldout/t04_gate_o_p.py]
    reason: >-
      `skill_regression` now binds each skill's version to its content sha256 and executes the declared
      validation scenarios; `gov health skills` and the suite family report per skill the binding, the executed
      scenarios and their outcome, and the family raises findings (7 in the probe project, including scenarios it
      states are "not executed by the governance suite — declared agent" and why). The family no longer asserts a
      property it never tests. (O2-skill-regression-executes-scenarios, O2-detects-skill_regression.)
  - id: A0-O2-02
    capability: [O2]
    prior: {severity: LOW, blocking: false, class: null}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, runtime/src/verification/mod.rs:1219, runtime/src/scheduler/catalogue.rs]
    reason: >-
      Reproducibility is no longer `(h1 == h2) || deep`. Each cacheable check declares `Repro::DoubleRun` or
      `SelfChecked`; a DoubleRun check is executed twice concurrently and its result hashes compared, a refreshed
      check is compared with its cached result under an identical key, and `reproducible` is false if any
      comparison fails (`audit_reproducibility` reported 31 comparisons, 0 mismatches, on a full no-cache run).
      The deep flag is a declared cache-key extra, so a deep result is not conflated with a normal one; and the
      checks that rebuild state now run in disposable sandboxes, so a deep run no longer mutates the state its
      own second run measures (AC5-3-isolation: the live derived state is byte-identical across such a run).
  - id: A0-O2-03
    capability: [O2]
    prior: {severity: INFO, blocking: false, class: null}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      `context_reproducibility` on this candidate reports a compiled packet's deterministic hash, its size and a
      per-task delivery state (`delivery_state: COMPLETE`, `declared_inputs`, `ok: true`) with no standing
      unsatisfiable finding about a policy-declared retrieved field. (O2-detects-context_reproducibility.)

  # ---------------------------------------------------------------- O3
  - id: A0-O3-01
    capability: [O3]
    prior: {severity: HIGH, blocking: true, class: BC-P2-34}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t07_o3_independence.py]
    reason: >-
      Independence is no longer self-attested. A test obligation in an independence-required family
      (`TEST_POLICY.independent_test_author_required_for: [acceptance, scenario, system]`) that declares
      `independent_of_implementer: true` and `author_role: qa` does not open the DAG gate: the claim is refused in
      those words — "`independent_of_implementer` / `author_role` are the artefact's own claims, not evidence;
      produce it through a test-design task closed by an independent role and session" — and independence is taken
      from the recorded author of the obligation's current content (the sealed close report that produced it),
      compared with the implementation task, its designated role and the session holding its claim. Builder
      product-test results are recorded as attributed evidence of the run and claim no independent certification.
      Held-out retrieval queries are a first-class measured artefact whose placeholder entries are held `pending`
      and not counted. (O3-1 … O3-6, all passing.)

  # ---------------------------------------------------------------- O4
  - id: A0-O4-01
    capability: [O4, U, O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-03}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t04_gate_o_p.py]
    reason: >-
      The currency key covers 32 declared input classes, including every class the prior finding named as missing.
      This verifier changed nine classes one at a time from a legitimately current green baseline
      (P2-ADJ-0003) and each one alone moved the record from current to stale, naming exactly that class:
      project_policy, spec_decisions, spec_requirements, spec_architecture, source, sensitivity, path_map,
      tools_plugins, model_profile. The key also carries `runtime_identity` (the gov binary's sha256) and
      `machine_trust`. (O4-green-record-current, O4-invalidated-by-*, O4-key-covers-runtime-and-machine-trust.)
  - id: A0-O4-02
    capability: [O4]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-03}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t04_gate_o_p.py]
    reason: >-
      The close gate no longer keys on declared paths. A governance-class task whose work changed a
      `source`-class file closed with `close_gate.governance_affecting: true` and a G2 run the gate performed
      itself for the CURRENT inputs (`g2.inputs_hash` = the post-change key, `complete: true`, 21 executed /
      18 reused) while the pre-change green record was stale. The decision is never taken on the stale record.
      (O4-close-runs-the-currency-gate, O4-no-close-on-stale-green.)
  - id: A0-O4-03
    capability: [O4]
    prior: {severity: HIGH, blocking: true, class: BC-P2-04}
    disposition: NOT_APPLICABLE
    evidence: []
    reason: >-
      The mechanism (CIT-E propagation into DONE work, W6 staleness) is class BC-P2-04, whose capabilities are
      W6/K2/O4 and whose verification is routed to zeta (W6) and delta (K1-K4) in iteration 1. This family
      verified O4's own half — that a green record goes stale on every relevant input class and that
      governance-affecting work is never closed on a stale record (A0-O4-01, A0-O4-02 above) — and also observed,
      on its own probes, that the scheduler's G1 `observe` path detects a mutation however it was made and
      re-runs the impacted checks before the next admission (AV-6). Whether an upstream change re-stales DONE
      work is zeta's and delta's determination, not this family's, and is not restated here.

  # ---------------------------------------------------------------- O5
  - id: A0-O5-01
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Dependency-aware impacted selection exists and is driven by a real mutation. A one-line source comment
      executed 18 of 39 governance-suite checks and reused 21 from cache; a decision-record change selected a
      different set of 28; with no change at all, 32 were reused and only the 7 never-cacheable checks executed.
      (AC5-1-impacted-selection, AC5-1b-selection-is-dependency-aware, AC5-4-cache-reuse.)
  - id: A0-O5-02
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Independent checks run concurrently on a worker pool: the result records `parallelism.workers: 4` and four
      distinct worker threads, and the run's wall clock is below the sum of its executed checks' own durations
      (2338 ms wall against 5772 ms of check time in one recorded run), which serial execution cannot achieve.
      (AC5-2-parallel-workers, AC5-2b-wall-clock-below-serial-sum.)
  - id: A0-O5-03
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      State-writing checks are isolated. `memory_retrieval_regression`, `context_reproducibility`,
      `skill_regression` and `recovery_rebuild` declare `Sandbox`/`OwnSandboxes`; running them reported
      `isolated_in_sandbox: true` and left the live derived state (`.governance-runtime/index`,
      `governance/generated`, `.governance-state`) byte-identical, and no sandbox directory was left behind.
      (AC5-3-isolation, AC5-3b-sandboxes-disposed.)
  - id: A0-O5-04
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      A per-check cache store exists, keyed on the digests of exactly the inputs each check declares. With
      unchanged inputs 32 of 39 checks were served from it and each reused result names the health result it was
      computed in; a project-policy change (an implicit dependency of every check) re-executed all 39; an
      unrelated file change re-executed 18 and reused 21. (AC5-4, AC5-4b, AC5-5, AC5-5b.)
  - id: A0-O5-05
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-08}
    disposition: CLOSED
    evidence: [evidence/G0-G3-tier-duties.out, evidence/RUN-ALL.out]
    reason: >-
      For O5's own bullet — "G0 Guard — every privileged/mutating command" — the guard now covers the mutating
      commands. Under `gov freeze-writes`, this verifier's census found `task create`, `task status`,
      `gate create`, `adapters generate`, `memory heldout-starter` and `adopt baseline` all refused `FROZEN`;
      only machine-local derived state (`telemetry emit`) and read-only surfaces (`plugins list`) proceed, which
      the scheduler's own store documentation states as intended. The scheduler half is one host API with typed,
      scoped refusals, remedy admission and re-evaluation before refusal (the 15 availability attacks). The
      remainder of class BC-P2-08 — acting-role resolution from `--role`/`GOV_ROLE` (capabilities E1, A5, S3, S4,
      T1) — is not an epsilon capability and is routed to alpha and gamma in iteration 1; this family does not
      restate their determination.
  - id: A0-O5-06
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-07}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t04_gate_o_p.py]
    reason: >-
      G1 no longer exists only on the CIT path: `scheduler::observe` compares the tree with the last observed
      state before any operation that commits, and at `gov status`/`continue`/`gov health status`, and runs the
      impacted G1 checks on what changed — demonstrated by a repair made with a plain file move being observed
      (`observed.tier: G1`, `changed_classes: [spec_decisions]`) inside a `gov health guard` call with no
      explicit `gov health run`. G2 at task close runs a tier suite the gate performs itself
      (`close_gate.g2`, 21 executed / 18 reused, `complete: true`) and refuses a self-attested `tests.status`,
      an undeclared mutation (`MUTATION_SCOPE_VIOLATION`), a stale index (`INDEX_STALE`) and a receipt that does
      not trace to its inputs (`RECEIPT_INVALID`). (AV-6, O1-self-attested-pass-refused, O4-close-runs-the-currency-gate.)
  - id: A0-O5-07
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-07}
    disposition: CLOSED
    evidence: [evidence/G0-G3-tier-duties.out, evidence/RUN-ALL.out]
    reason: >-
      `handoff create` now performs the G3 duty at its own trigger: the returned record carries
      `health: {tier: "G3", verdict, health_result: HR-…, counts}` from a G3 tier run (33 checks, including
      `concurrency_claims`, `human_gate_integrity`, `change_control_integrity`, `continuity_checkpoint_handoff`,
      `authority_unambiguous`, `unresolved_audit_findings`), and it judges decision currency: with a decision the
      packet had already delivered changed afterwards, the handoff reported `freshness.state: REFRESHED`, named
      the stale input with its delivered and current content hashes, marked the previous packet invalidated and
      re-delivered at the current inputs. Its declared policy is stated in the record ("unsatisfied mandatory
      inputs -> refused (HANDOFF_INPUTS_UNSATISFIED); stale packet -> re-delivered at current inputs, degraded
      when work was in progress on the stale inputs"). Not "checks nothing". One honest limit: a condition that
      only a non-G3 check detects (a duplicate record id, caught by `schema_invariants`) is not raised by the G3
      tier itself; it is caught by the G1 mutation observation that precedes the operation and by the G0 guard,
      and `handoff.create` is deliberately not refused by a subject-scoped high block (the catalogue states that
      handing off relies on the inputs, which the claim and the close judge).
  - id: A0-O5-08
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-07}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, runtime/src/scheduler/mod.rs:1576-1584]
    reason: >-
      G4 is a real tier: it is declared with the duty "wider staleness/impact propagation after CIT-E / migration
      / memory / architecture", it carries 39 checks, a G4 run evaluated all 39 and always writes a
      governance-suite record, and the milestone input classes (`spec_architecture`, `kernel_migration`,
      `framework_lock`, `model_profile`, plus the memory-profile digest of the index manifest) are observed at G4
      rather than G1 however the change was made. (AC5-tiers-declared, AC5-tiers-populated, AC5-tiers-executable.)
  - id: A0-O5-09
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-07}
    disposition: RESIDUAL
    evidence: [evidence/RUN-ALL.out, evidence/E-O5-01-doctor-tier-gap.out]
    reason: >-
      Partly repaired, partly not. G5 is no longer a four-family subset: a G5 run and `gov audit` evaluate all 39
      governance-suite families, `update --apply` is admitted through the same availability API and `release.build`
      is refused by any active high or critical block. But a G5 run — including `gov audit`, `update` and
      `release build` — still does not execute the 35 doctor checks the catalogue itself declares at G5, and
      reports the run `complete` with `not_evaluated: 0`. Carried forward as finding E-O5-01 (RESIDUAL of
      BC-P2-07), with its own evidence.
  - id: A0-O5-10
    capability: [O5]
    prior: {severity: HIGH, blocking: true, class: BC-P2-07}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t05_gate_v_oracle.py]
    reason: >-
      A G6 tier exists and is executable: `gov health qualify --kind {synthetic-repository|chaos|soak|hidden-test}
      --oracle <doc> --report <score report>` records a qualification run's health only when the hidden oracle
      conforms to the Qualification Oracle format and is separate from the public suite, this repository and the
      qualification repositories, and the score report is bound to that oracle. A conforming pair was accepted and
      recorded with the oracle's commitment digest and purpose; a non-conforming oracle was refused
      `ORACLE_RECORD_INVALID`. (V-G6-observes-qualification, V-G6-refuses-nonconforming-oracle.)
  - id: A0-O5-11
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Block-versus-warning is declared per check and enforced. All 74 catalogue entries carry an explicit
      `enforcement.mode`; a warning-only failure (index_freshness, medium) lowered the state to YELLOW and refused
      nothing (`task.create` admitted, no active block), while a hard-block failure (schema_invariants, high)
      turned the state RED, produced typed refusals naming the block, its check, its scope and its subjects, and
      refused exactly the operations in scope. (AC5-8-warning-refuses-nothing, AC5-7b-RED-on-hard-block,
      AC5-8b-hard-block-vs-warning-declared, and the 15 availability attacks.)
  - id: A0-O5-12
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-06}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Health results are persisted with provenance. Each `HR-…` record carries tier and tier duty, trigger (event,
      subject, changed paths), per-check status/duration/cache source/enforcement, the per-class input digests and
      their hash, the runtime identity (cli/runtime/index versions and the gov binary's sha256), the repository
      state (git commit, dirty count, content key), the actor (pid, role, session), the machine trust posture,
      the parallelism used, the cache mode, the selection and start/finish times; `gov health history` and
      `gov health show` read them back. (AC5-9, AC5-9b, AC5-9c.)
  - id: A0-O5-13
    capability: [O5]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-24}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Health failures generate governed, linked work. A high `schema_invariants` finding generated a governance
      task whose `generated_from` names the source (`audit-finding`), the subject (the check), a stable generation
      key and the detecting surface, and whose record declares `remedies: [schema_invariants]`; when the finding
      persisted past a close, the generator produced the successor with `recurrence: 1`. (AC5-10,
      AC5-10b; the recurrence observation is recorded in evidence/E-O5-01… context and in 00-VERIFICATION-REPORT.md §5.)
  - id: A0-O5-14
    capability: [O5, V1, V2, V3, V4]
    prior: {severity: MEDIUM, blocking: true, class: BC-P2-01}
    disposition: NOT_APPLICABLE
    evidence: []
    reason: >-
      A defect of the compiled contract view (requirement-class misclassification), i.e. AC-13, which iteration 1
      routes to the synthesis verifier across all families. This family reports as input that O5 and V1-V4 behave
      as the refinements they are: the scheduler is exercised in full (AC-5) and the oracle format covers every
      V1-V4 element with a crosswalk to the owner-source line numbers.
  - id: A0-O5-15
    capability: [O5]
    prior: {severity: INFO, blocking: false, class: null}
    disposition: CLOSED
    evidence: [runtime/src/release.rs:80-94, runtime/src/release.rs:420-429]
    reason: >-
      `gov release build --certification <status that claims certification>` is refused: a certification claim is
      authenticated only by release metadata signed under the owner's `release` role, and `gov` never signs.
      The unsigned manifest's certification block is reported as a claim, with the effective status derived from
      the signed metadata (`certification.effective_status`, `authenticated`, `basis`,
      `unsigned_manifest_claim`).

  # ---------------------------------------------------------------- P
  - id: A0-P1-01
    capability: [P1, P2, U]
    prior: {severity: MEDIUM, blocking: false, class: null}
    disposition: RESIDUAL
    evidence: [evidence/RUN-ALL.out, heldout/t04_gate_o_p.py]
    reason: >-
      Partly repaired. All thirteen Contract v3:815-827 fields survive in a telemetry event and are read back
      (P1-13-fields-representable), and the OS itself produces the event name, session, role, duration,
      trace and span ids; retrieval query text is durable in the failure-memory records and the routing evidence
      carries provider/model/cost/latency/repairs. Still caller-supplied, schema-free attributes: tokens,
      skill/tool versions, agent/model/provider identity and files read/written — the OS produces none of them.
      Carried forward, together with the P2 half, as finding E-P2-01 (non-blocking, as at iteration 0).
  - id: A0-P2-01
    capability: [P2]
    prior: {severity: LOW, blocking: false, class: null}
    disposition: RESIDUAL
    evidence: [evidence/RUN-ALL.out]
    reason: >-
      Five of the eight organisational questions are answerable from `gov telemetry summary`; three are not
      (retrieval effect on token use, skill repair rate, retrieval misses), and cost is by task class rather than
      by feature. Carried forward as finding E-P2-01.

  # ---------------------------------------------------------------- Q
  - id: A0-Q1-01
    capability: [Q1]
    prior: {severity: MEDIUM, blocking: false, class: null}
    disposition: RESIDUAL
    evidence: [evidence/RUN-ALL.out, heldout/t06_gate_q.py]
    reason: >-
      The record models every stage and every stage has a field, but the export path does not enforce the order:
      a FRAMEWORK lesson at `lifecycle: candidate` prepares a packet. Carried forward as finding E-Q1-01
      (non-blocking, as at iteration 0).
  - id: A0-Q1-02
    capability: [Q1, Q4]
    prior: {severity: HIGH, blocking: true, class: BC-P2-10}
    disposition: CLOSED
    evidence: [evidence/RUN-ALL.out, heldout/t06_gate_q.py]
    reason: >-
      Human approval for upstream export is now an answered Human Decision Gate on an authenticated channel.
      `gov upstream submit … --approved-by "me, the agent"` is refused `HUMAN_GATE_REQUIRED`: "exporting PKT-0002
      requires the product owner's owner-signed answer authorising its export gate HDG-0002". On a machine with no
      provisioned root, `gov decide` is refused `HUMAN_CHANNEL_UNAVAILABLE`. On a provisioned machine whose root
      delegates the `human-gate` role, an owner-signed `human-gate-answer` bound to the presented package's
      sha256, gate instance and a nonce was verified and accepted, and only then did submission succeed.
      (Q4-approval-not-caller-asserted, Q4-owner-signed-approval-accepted, Q4-submit-after-approval,
      Q-human-channel-available.)
  - id: A0-Q1-03
    capability: [Q1]
    prior: {severity: INFO, blocking: false, class: null}
    disposition: NOT_APPLICABLE
    evidence: []
    reason: >-
      The observation concerns canonical-repository intake (`gov lessons cluster` on an inbox), which is the
      framework repository's own operation rather than a consumer-project capability, and it was non-blocking.
      This verifier established the property the contract actually places on Q3 — that only FRAMEWORK candidates
      are eligible for export — at the export gate, where both PROJECT and PRODUCT lessons are refused
      `UPSTREAM_SCOPE` (Q3-PROJECT-refused, Q3-PRODUCT-refused, Q3-FRAMEWORK-eligible).
  - id: A0-Q2-01
    capability: [Q2]
    prior: {severity: MEDIUM, blocking: false, class: null}
    disposition: RESIDUAL
    evidence: [evidence/RUN-ALL.out, heldout/t06_gate_q.py]
    reason: >-
      A lesson recorded `state_class: AUTHORITATIVE` still passes the whole suite with no finding. Carried forward
      as finding E-Q2-01 (non-blocking, as at iteration 0), with the bound this verifier established: the claim
      buys no authority, because the deterministic authority block of a compiled context packet carries no lesson
      field.
