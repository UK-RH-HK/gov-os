id: SKL-DB-MIGRATION
name: Database migration
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [data-engineer]
task_classes: [implementation, data]
purpose: "Design and apply reversible database schema migrations with rollback and data-preservation checks."
required_permissions: [READ_REPO, WRITE_REPO_SCOPED, RUN_TESTS, DB_READ]
required_tools: [TOOL-FS-001, TOOL-TEST-001]
inputs: [data model, interface contracts]
outputs: [migration scripts, rollback script, evidence]
method:
  - {step: model-diff, description: Diff target data model against current schema.}
  - {step: write-forward-and-rollback, description: Author forward and rollback migrations as a pair.}
  - {step: dry-run, description: Apply to a disposable copy and verify row counts and constraints.}
  - {step: gate, description: Raise a Human Decision Gate for destructive or large migrations per HUMAN_GATE_POLICY.}
validation_scenarios:
  - {id: V1, given: destructive column drop, expect: human gate raised before execution}
