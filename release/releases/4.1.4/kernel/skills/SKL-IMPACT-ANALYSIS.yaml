id: SKL-IMPACT-ANALYSIS
name: Architecture impact analysis
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [architecture-agent, change-controller, orchestrator]
task_classes: [architecture, decision-preparation, governance]
purpose: "Run a Change-Impact Simulation and produce a plain-language consequence summary."
required_permissions: [READ_REPO]
required_tools: [TOOL-FS-001]
inputs: [proposal, targets]
outputs: [impact report, radius, human-gate recommendation]
method:
  - {step: seed, description: Identify target artefacts and paths.}
  - {step: traverse, description: Deterministic graph traversal to the policy depth for the estimated radius.}
  - {step: retrieve, description: Bounded lexical and semantic candidate retrieval.}
  - {step: summarise, description: Human-readable consequences, tests required, rollback plan.}
validation_scenarios:
  - {id: V1, given: change touching governance/project, expect: radius R5 and human gate required}
