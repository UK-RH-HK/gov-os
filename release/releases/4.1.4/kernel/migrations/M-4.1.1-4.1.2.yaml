id: M-4.1.1-4.1.2
from_version: 4.1.1
to_version: 4.1.2
description: >
  Upgrade a 4.1.1 consumer to 4.1.2: rename GATE_POLICY overlay reference to HUMAN_GATE_POLICY, add the
  PROJECT_EXCEPTIONS.yaml overlay file, add the `gates.presentation_channel` project policy key, record the
  lock schema version, and require a full index rebuild because the chunker/embedder manifest changed.
breaking: false
human_gate: none
affected_indexes: [lexical, semantic, graph, code]
operations:
  - {op: note, text: "4.1.1 shipped 12 policies; 4.1.2 adds ARCHIVE_POLICY and LEARNING_POLICY in the kernel (no overlay action needed)."}
  - {op: add_overlay_file_from_template, file: PROJECT_EXCEPTIONS.yaml, template: PROJECT_EXCEPTIONS.yaml, if_missing: true}
  - {op: rename_overlay_key, file: PROJECT_POLICY.yaml, from: human_gates, to: gates, if_missing: true}
  - {op: set_overlay_key, file: PROJECT_POLICY.yaml, key: gates.presentation_channel, value: chat, if_missing: true}
  - {op: set_overlay_key, file: PROJECT_POLICY.yaml, key: schema_version, value: 1.0.0}
  - {op: set_lock_field, key: lock_schema_version, value: 1.0.0}
  - {op: require_index_rebuild, index: all}
  - {op: regenerate_adapters}
rollback: >
  `gov update --rollback` restores the previous kernel from the update snapshot, restores the overlay snapshot
  taken before migration, restores framework.lock and rebuilds indexes. Spec/ and product/ are never touched.
