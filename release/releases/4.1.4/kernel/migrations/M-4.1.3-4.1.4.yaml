id: M-4.1.3-4.1.4
from_version: 4.1.3
to_version: 4.1.4
description: >
  Repair release after the independent re-verification of 4.1.3 (OS_RELEASE_CANDIDATE_REJECTED). Kernel changes:
  constitutional policy precedence (POLICY_PRECEDENCE.yaml, enforced at policy load), CIT approval derived only from
  authoritative gate answers, governed capability plugins (plugin-descriptor schema 1.1.0, TOOL_POLICY.plugins,
  execute_plugin/register_plugin/revoke_gate operation classes), framework.lock schema 1.1.0 (release_commit =
  framework release, installed_at_commit = consumer HEAD, logical source), rollback ledger, observed mutation scope,
  relocation-aware incremental indexing. This migration also delivers the repository-contract tightening that
  M-4.1.2-4.1.3 described but did not perform: the tracked governance/tests/** rule is set to lexical_index=false
  (the held-out regression file must not be retrievable); every other overlay default that a project never customised
  follows the new template through template-default reconciliation performed by gov update.
breaking: false
human_gate: none
affected_indexes: [lexical, semantic, graph, code]
overlay_template_changes:
  - {file: REPOSITORY_CONTRACT.yaml, handled_by: "op:set_overlay_rule", reason: "governance/tests/** lexical_index tightened to false (verifier L5/NV-19); delivered explicitly so upgraded 4.1.2/4.1.3 projects converge"}
operations:
  - {op: note, text: "4.1.4 enforces policy precedence, gate-derived CIT approval, governed plugins, release-identifying lock provenance and observed mutation scope; existing overlays remain valid, refused overrides are reported by doctor D027."}
  - {op: set_overlay_rule, file: REPOSITORY_CONTRACT.yaml, list_key: paths, match: {pattern: "governance/tests/**"}, set: {lexical_index: false}, add_if_missing: true, template_rule: {class: test, owner_role: independent-test-designer, semantic_index: false, graph_index: false, code_index: false, namespace: governance}}
  - {op: set_lock_field, key: lock_schema_version, value: 1.1.0}
  - {op: require_index_rebuild, index: all}
  - {op: regenerate_adapters}
rollback: >
  `gov update --rollback [--reason ...]` restores the previous kernel, overlay snapshot and framework.lock, rebuilds
  indexes, appends a rollback entry to spec/reports/framework-updates.jsonl and consumes the snapshot.
