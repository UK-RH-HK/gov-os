policy: MEMORY_POLICY
version: 1.0.0
runtime_dir: .governance-runtime
memory_classes: [deterministic, relationship, semantic, lexical, code_structural, temporal, episodic, failure, working, capability]
embedding:
  provider: hashed-ngram
  version: "1"
  dimensions: 512
  # Evidence-driven selection: alternatives are pinned per repository via the overlay `memory.embedding` block
  # after a measured benchmark against held-out retrieval queries (framework section 14.3).
reranker:
  provider: none
chunking:
  max_chars: 1200
  overlap_chars: 120
  levels: [document, section, child]
retrieval:
  default_k: 8
  fusion: reciprocal_rank
  rrf_k: 60
  parent_expansion_top_n: 3
  graph_neighbour_depth: 1
  max_slice_chars: 1600
freshness:
  max_stale_artifacts_on_task_close: 0
  on_stale_close: fail            # fail | degrade
  max_index_age_hours: 168
regression:
  heldout_file: governance/tests/memory/heldout.yaml
  min_recall_at_k: 0.8
  min_mrr: 0.5
  max_stale_hit_rate: 0.0
  max_superseded_hit_rate: 0.0
rebuild:
  must_reproduce_manifest_hash: true
namespaces:
  governance: {sensitivity: internal, roles: [all], retention: permanent, export: framework-lessons-only, embed: true}
  spec: {sensitivity: internal, roles: [all], retention: permanent, export: denied, embed: true}
  product: {sensitivity: internal, roles: [engineering], retention: permanent, export: denied, embed: true}
  archive: {sensitivity: internal, roles: [all], retention: permanent, export: denied, embed: false, default_retrieval: false}
  secret: {sensitivity: secret, roles: [], retention: n/a, export: denied, embed: false, default_retrieval: false}
