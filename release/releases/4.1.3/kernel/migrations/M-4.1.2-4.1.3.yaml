id: M-4.1.2-4.1.3
from_version: 4.1.2
to_version: 4.1.3
description: >
  Repair release after independent verification of 4.1.2 (OS_RELEASE_CANDIDATE_REJECTED). Kernel changes: authority
  operation map (AUTHORITY_POLICY.authority_levels_required), MEMORY_POLICY lexical/reranker/min_queries pins, role
  groups, ENFORCEMENT_MAP, language-tagged tool registry, held-out file excluded from lexical indexing. The lexical
  tokenizer and index format changed, so every derived index must be rebuilt in full; the project overlay is preserved
  (only the tracked repository-contract rule for governance/tests is tightened).
breaking: false
human_gate: none
affected_indexes: [lexical, semantic, graph, code]
operations:
  - {op: note, text: "4.1.3 enforces authority levels, mutation scope, sensitivity classes, destructive-migration gates and embedder pins; existing overlays remain valid."}
  - {op: set_lock_field, key: lock_schema_version, value: 1.0.0}
  - {op: require_index_rebuild, index: all}
  - {op: regenerate_adapters}
rollback: >
  `gov update --rollback` restores the previous kernel, overlay snapshot and framework.lock and rebuilds indexes.
