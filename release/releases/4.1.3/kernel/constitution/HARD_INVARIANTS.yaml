# Machine-readable hard invariants. Adapters must reproduce each `statement` verbatim.
version: 1.0.0
invariants:
  - id: INV-001
    name: session-not-source-of-truth
    statement: "The agent session is not the source of truth. The governed project system is the source of truth."
    enforced_by: [context_compiler, checkpoint_policy]
  - id: INV-002
    name: no-knowledge-only-in-conversation
    statement: "No essential project knowledge may exist only inside a conversation."
    enforced_by: [task_close, worker_return_contract]
  - id: INV-003
    name: authority-precedence
    statement: "When project information conflicts, deterministic authority precedence applies; semantic retrieval cannot silently make something authoritative."
    enforced_by: [retrieval_router, doctor]
  - id: INV-004
    name: legacy-has-no-default-authority
    statement: "Legacy governance material has no default authority over the installed framework."
    enforced_by: [adopt, doctor, retrieval_router]
  - id: INV-005
    name: model-agnostic
    statement: "No canonical policy, skill, task or decision may depend permanently on a current model or vendor name."
    enforced_by: [schema_validation, adapter_conformance]
  - id: INV-006
    name: no-self-modification
    statement: "An executing agent must not rewrite the rules governing its own execution."
    enforced_by: [mutation_scope, kernel_immutability]
  - id: INV-007
    name: kernel-immutable
    statement: "Agents do not customise governance/kernel/ inside a product repository; framework improvements are proposed upstream and released centrally."
    enforced_by: [doctor, mutation_scope]
  - id: INV-008
    name: human-gate-must-be-presented
    statement: "A Human Decision Gate that exists only in a file is not considered presented."
    enforced_by: [gates, status]
  - id: INV-009
    name: secrets-never-indexed
    statement: "Secrets, credentials, unapproved customer material, production personal data and restricted legal or security material are never indexed into generic semantic memory."
    enforced_by: [indexer, secret_scanner, doctor]
  - id: INV-010
    name: derived-memory-rebuildable
    statement: "Deleting a derived index must never destroy project truth; derived memory must be rebuildable from Git plus authoritative records."
    enforced_by: [rebuild_memory, governance_suite]
  - id: INV-011
    name: material-change-is-cit
    statement: "Every accepted material state change is handled atomically as a Change-Impact Transaction with simulation before approval and rollback on failure."
    enforced_by: [cit]
  - id: INV-012
    name: upstream-fail-closed
    statement: "Any upstream operation that attempts to include a forbidden path or content class must fail closed."
    enforced_by: [upstream_export_gate]
  - id: INV-013
    name: framework-update-preserves-project
    statement: "A framework update must never overwrite project decisions or specifications merely because the framework changed."
    enforced_by: [update]
  - id: INV-014
    name: no-worker-orchestrates
    statement: "No spawned worker behaves as an orchestrator unless explicitly assigned that role."
    enforced_by: [handoffs, roles]
  - id: INV-015
    name: memory-rebuilt-after-paths-stable
    statement: "Existing memory is inventoried before path migration, but new canonical memory is built only after path stabilisation and independent migration acceptance."
    enforced_by: [adopt]
