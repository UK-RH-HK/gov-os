id: SKL-TASK-CLOSE
name: Task close
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [orchestrator, change-controller, backend-engineer]
task_classes: [validation]
purpose: "Close a task only with evidence, fresh indexes and a structured return."
required_permissions: [READ_REPO, WRITE_REPO_SCOPED]
required_tools: [TOOL-FS-001]
inputs: [task, report]
outputs: [closed task, report record, checkpoint]
method:
  - {step: evidence, description: Require a report record with tests status and files changed.}
  - {step: freshness, description: Fail or degrade when required indexes are stale beyond policy.}
  - {step: governance-currency, description: Refuse to close on an obsolete green governance record when governance paths changed.}
  - {step: checkpoint, description: Write the mandatory task-transition checkpoint.}
validation_scenarios:
  - {id: V1, given: stale index and on_stale_close=fail, expect: close refused}
