  new_default: 'unreadable_command_shape''s terminal fallback is inverted: the effective program is admitted only when it is positively named in a new closed list TOOL_POLICY.installation_envelope.plain_argument_programs
    (true, false, cp, curl, sudo, apt-get); an unnamed wrapper, an unrecognised flag form or any program nobody has told the OS about is undetermined and gates. The list was derived by grepping every certification
    test''s command fields for what the 235-test baseline actually relies on being read as plain arguments. Listing sudo and apt-get is not a safety judgement - it only means the OS can read their argv;
    the per-token privilege and host-authority scan still names and gates them, proven by the unmodified r4_residual gated-for-each-way test. POLICY_PRECEDENCE needed no change because TOOL_POLICY.* is
    already the immutable catch-all, verified end to end by a property test rather than by inspection.'
  two_direct_fixes_beyond_the_flip: is_inline_code_flag now also matches a listed short flag with its value attached (python3 -cimport..., perl -esystem...), and the script_interpreters no-operand branch
    (sh -s, python3 -) now refuses, since such a shape may read its real program from stdin, invisible to the classifier.
  ar73_f2: classify_file_candidate and leaves_project folded backslash to slash unconditionally before hashing and the escape check, so a pin for a/b.sh verified clean while the shell executed the literally
    different a\b.sh. Now folded only under cfg!(windows), so the pin lookup and escape check operate on the literal bytes reaching the process.
  ar73_f3: 'glob_segments now prepends an implicit ** segment for a /-free pattern - the same closure **/<pattern> compiles to - so the overlap procedure models decide''s second matching rule. Measured
    with the reviewer''s own globprobe built against the repaired runtime: *.txt, ?.txt, *.yaml and *.json now all show the kernel directory in overlap_seen with nothing unchecked; brace, bracket and case-mismatch
    rows remain correctly inert.'
  second_order_regression_found_and_fixed: 'caught only by the one genuine full-suite run, and the most valuable part of this round: adopt.rs''s A2 secret classifier appends a class: secret rule using the
    discovered file''s own path verbatim as the pattern (a root .env file gives the literal pattern .env), and such a rule legitimately never sets mutation - the same convention the kernel''s own **/.env*
    rule uses. Once /-free patterns correctly overlap kernel directories at any depth, .env newly overlapped governance/kernel/** and the raw mutation comparison read it as a widening, producing a GLOBAL
    HARD BLOCK on adopt.migrate. First full run 241 passed / 2 FAILED (brownfield adoption end to end, and destructive migration requires an answered gate). Fixed by excluding mutation from the comparison
    specifically for a class: secret CANDIDATE, mirroring the exclusion kernel secret rules already have as a target, because decide''s secret_locked latch never governs mutation either - and class: secret''s
    other defaults are already maximally restrictive. Guarded both directions: the adopt.rs shape is honoured even overlapping governance/kernel/**, while the same rule with an explicit export override
    is still refused, naming export. The original AR73-F3 attack used class: source, so the exclusion does not reopen it.'
  ar73_f4: health_one now takes is_project_tool derived structurally from which of kernel_tools or project_tools produced the entry, instead of asking whether a descriptor field parses as a string. Absent,
    null and numeric values all now refuse with TOOL_COMMAND_UNVERIFIED and the unpinned health command never runs.
