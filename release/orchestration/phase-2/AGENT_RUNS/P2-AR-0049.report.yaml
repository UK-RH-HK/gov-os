  - "V1-K4-01, V1-M1-01, V1-M4-01, V1-DELTA-01 — recorded, none blocking; the synthesis verifier decides what they mean for the phase verdict."
  - "Content, as opposed to form: the OS checks that a research record carries every J1 field and that a gate package is substantive, never that the measurements support the conclusion or that the impact statement is true. Phase-4 hidden-fault classes, named per capability in capability-audit.yaml."
