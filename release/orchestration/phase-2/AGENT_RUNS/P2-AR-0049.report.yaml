  agent transcript, or user auto-memory. Early in the run I listed the harness's task-output directory
  (/tmp/claude-.../tasks/) while polling my own background build; I read no file in it other than my own build's output,
  and no other agent's output influenced any judgement. This is also recorded in §10 of 00-VERIFICATION-REPORT.md.
  I spawned no sub-agent and did not contact the product owner. My held-out tests, the harness that runs them and the
  administrator/owner key material they use are my own work, written from the on-disk metadata formats in
  runtime/src/srr/** and runtime/src/human_channel.rs, not copied from the product's certification signer.
