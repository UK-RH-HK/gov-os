  - "Later-lifecycle notes, not findings: a run recorded below a task's declared reasoning minimum is accepted with no flag (A0-M2-01); non-numeric routing evidence is accepted and silently aggregated as zero, and a run recorded with MODEL_ROUTING_POLICY's own field aliases is mis-aggregated (A0-M4-02); a rolled-back transaction leaves the derived views' regeneration timestamp bumped although none of their content changes."
