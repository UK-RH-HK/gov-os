independence_statement: >-
  Model Claude Opus 5 with a 1M-token context (model id claude-opus-5[1m]), fresh context. This run is a builder: it wrote
  the product changes it reports on and grades none of them; its tests, named checks and probe re-runs are regression
  evidence only (Contract v3 O3). It read the handoffs P2-HO-0028, P2-HO-0020, P2-HO-0010 (and, for coordination only,
  the round-2 handoffs of WS-2/3/4/5/6/7/8 where they mention this workstream), repair-delta §0-§4, the BC-P2-34 findings
  (A0-T2-01, A0-E1-05, A0-H4-02, A0-O3-01) and the Q findings (A0-Q1-01/02, A0-Q4-01) with their probes, OWNER-DECISION-P2-0001
  and -0002, P2-ADJ-0001, the round-1 integration report and the round-1 reports of WS-2, WS-3, WS-6 and WS-9/11 (its own
  predecessor's), Contract v3, the adoption and release protocols, and the product source and tests. It ran the named
  audit-of-record probes unedited (directly and through the round-1 integration's evidence adapter, used unedited by
  path), wrote two clearly labelled derived probe copies, and ran every prior R1 held-out suite unedited against its own
  worktree through a private per-run path. It did not read any session or agent transcript, task-output store or user
  auto-memory; it spawned no sub-agent and did not contact the product owner. It edited nothing under release/verification,
  release/root-of-trust, release/releases, release/orchestration/phase-1, release/capability-baseline/audit-0 or another
  workstream's repair-1 directory; it did not merge, rebase, tag or push, and touched no other branch or worktree.
  Product edits were confined to the files P2-HO-0028 assigns (runtime/src/adopt.rs, runtime/src/migrations/**,
  migrations/**, framework/schemas/adoption-baseline.schema.json, runtime/src/upstream.rs,
  framework/policies/LEARNING_POLICY.yaml, framework/schemas/upstream-packet.schema.json); certification tests were
  updated where an intended behaviour change required it (reasons in the report §6) and new tests appended. No edit to
  cli/src/main.rs, runtime/src/lib.rs or any other workstream's file.
