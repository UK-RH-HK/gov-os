outcome:
  verdict: 'PARTIAL (worker) -- the declared gap is now CLOSED by the orchestrator''s own full-suite reproduction: 263/0'
  why_partial: the one required full certification suite was NOT run - the worker was stopped before starting it. It reported this plainly rather than claiming a run it did not perform. The orchestrator
    is reproducing the suite independently.
  property_a:
    mechanism: plain_argument_programs shrunk from [true,false,cp,curl,sudo,apt-get] to [true,false] with NO replacement parsing rule for any removed name. The structural fix is a new Unreadable enum in
      tools.rs distinguishing Opaque (argv is not a trustworthy description at all) from UnrecognisedProgram (the one case list membership used to grant). Every unreadable reason still forces undetermined
      and gates; only UnrecognisedProgram also lets the per-token privilege/host/credential/path/network scan run, so the human at the gate still learns WHY.
    list_not_deleted: 'plain_argument_programs SURVIVES with two entries. The worker judged full deletion unsafe within its authority: true/false are POSIX-defined to ignore every argument with zero filesystem,
      network or privilege effect, and about 15 unrelated certification tests outside allow_write use them as an established harmless-baseline vehicle. Reported rather than forced.'
    argument_indirection_flags: SURVIVES unchanged. The worker argues it is not dead because it still gates a pinned script's own trailing arguments (sh install.sh -K) independently of plain_argument_programs.
    ar77_f1_f2_f4: CLOSED BY CONSTRUCTION, NOT FIXED - and the worker discloses this rather than assuming it. endpoint_host's empty-authority file:// bug and resolves_outside_project's blindness to hard
      links are UNTOUCHED; curl and cp can no longer reach the code path where either matters. Proven by direct reproduction including a genuine hard link with content-comparison proof outside the root,
      and the test explicitly asserts that broader_filesystem_or_project_access does NOT fire, disclosing that boundary resolution still cannot see a hard link.
    ar77_f5: runtime message no longer claims a named artefact exists for curl -k; it states the case-fold ambiguity honestly.
    review_subject_binds_argv: VERIFIED OPERATIONALLY, not assumed. installation_subject hashes the whole descriptor minus only gate/approval/status metadata (INSTALLATION_NON_SUBJECT), never install_command,
      uninstall_command, health_check or pinned_files. Two tests prove a review bound to one install_command is refused evidence for a descriptor differing only in that field.
  property_c:
    mechanism: paths.rs gains an Exemption enum (TaskMutationObservation, ProductionTreeMembership), a CLASS_EXEMPTIONS table, and class_confers/class_exemptions/confers_any_exemption. tasks::contract_generated
      and tasks::is_production_path both now derive from it. policy_precedence::overlap_is_no_less_restrictive replaces its hardcoded two-value closure with a general check over class_exemptions, refusing
      a candidate that confers ANY exemption the overlapped kernel rule did not - so all six values are protected and a future class added to the table is protected with no change to that function.
    consumers_surveyed: contract_generated and is_production_path migrated (authority-bearing); overlap_is_no_less_restrictive generalised (the defect site); path_rule_narrowing confirmed to need no change;
      derived_deletion_set deliberately NOT migrated (operational, nothing refused or exempted, and coupling it would let a future TaskMutationObservation addition silently widen deletion scope); paths.rs
      SECRET_CLASS and historical branches judged not a concern because they only ever ADD restriction, which OC-P2-04 permits freely; lineage.rs CODE_CLASSES / W7 / W11 judged DESCRIPTIVE because they
      feed advisory reports and gate nothing.
    judgement_calls_flagged_by_the_worker: the lineage.rs descriptive call is flagged explicitly - if a reviewer judges that escaping an audit sweep is itself a governance exemption, those consumers should
      also route through the shared predicate. derived_deletion_set's separation is reasoned but untested against an actual disaster-recovery run.
    future_consumer_prevention: doc comments on CLASS_EXEMPTIONS and both migrated functions name AR77-F3 as the failure mode, but nothing mechanically stops a lazy consumer writing its own matches! again
      - disclosed by the worker.
    end_to_end_proof: 'AR77-F3''s exact exploit reproduced against real project files: refused via gov policy overrides with policy/key/value/kernel_value/reason per OC-P2-04 clause 2, surfaced on doctor
      D027 through the existing generic mechanism with zero new reporting code, and is_production_path still treats the hand-edited path as production. A companion test proves the preserved capability -
      a governed declaration on an ungoverned pattern still works.'
  changed_test_assertions: 'six, each listed with old and new claim: r2_wsa::ordinary_allowlisted_network_use_still_does_not_gate (curl to pypi now gates, with findings empty and network_endpoints pypi.org
    proving the gate''s sole cause is curl being unbound, then shows answering the gate lets it proceed); r4_residual::ordinary_allowlisted_network_use_does_not_gate_but_a_new_boundary_does (same, plus
    a new sub-block proving a pinned sh install.sh wrapping the same fetch installs UNGATED with zero gate records); r2_failclosed::removing_a_name_from_a_policy_list_only_ever_makes_the_os_more_cautious
    sub-case (a) (cp vehicle swapped to true, since P2-AR-0077 falsified cp''s premise); repair4::cp_with_both_operands_inside_the_project_still_installs_ungated (name kept as required, body inverted -
    cp always gates now - plus a pinned-wrapper half proving the preserved capability); repair4::arbitrary_relevant_tokens_... (inert sub-cases swapped to true; escaping sub-cases left on cp, still passing,
    proving UnrecognisedProgram preserves the diagnostic scan); two repair4 curl tests (substring check moved from prose to the stable identifier argument_indirection_flags after the AR77-F5 rewording).
    NO renames.'
  tests_added: tests/certification/remediation_ac.rs (new, 699 lines) plus one repair4 test. Includes a 72-case property test over all six exempting classes x 4 kernel shapes x 3 overlap suffixes with negative
    controls, a 23-program installer sweep, effect-level AR77-F1/F2/F4 reproductions, and review_subject binding tests.
  worker_declared_generator_gaps: the 23-program sweep is itself hand-enumerated (the very pattern being retired, used defensively); the 72-case property test uses 4x3 hand-picked glob shapes rather than
    a generator over the full pattern grammar; no non-UTF8 argv, Windows/case-insensitive paths, or TOCTOU races; the decoupled UnrecognisedProgram scan was not attacked with adversarial argv designed to
    make the DECOUPLING itself misbehave - the worker names this as the most likely place it is wrong; the lineage.rs descriptive judgement was reasoned, not tested; derived_deletion_set's separation was
    not exercised against a real deletion run.
  checks_run: cargo build clean 0 warnings; cargo test --lib 280/0 in 9.46s at default threads; targeted certification runs across several invocations, all at default threads, every touched or at-risk test
    passing (two intermediate failures were the worker's own test-construction errors, fixed and re-run clean); rustfmt --check per touched non-root file with pre-existing baseline hunks separated from
    its own lines via git show HEAD:<file> | rustfmt --check.
  not_done: the one full certification suite. The worker swept tests/certification for other cp/curl/sudo/apt-get usages and found none outside the six files it touched, but states plainly that this expectation
    is unverified rather than proven.
