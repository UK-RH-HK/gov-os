what_was_broken: evaluate_path_rules_overlay's None arm honoured any project path rule whose pattern had no EXACT kernel counterpart, with no restrictiveness check. Because paths::decide is last-match-wins,
  an appended pattern that merely OVERLAPS a kernel rule's domain decides every path they share - reproducing probe 45E exactly. The sibling evaluate_path_rules had the identical gap and was fixed too.
rule_implemented: for a rule with no exact kernel match, scan every kernel rule whose class is not secret; if patterns_may_overlap (a new bounded segment-by-segment glob domain-intersection check, with
  ** explored as 0..N extra segments) then the new rule must decide NO LESS RESTRICTIVELY on every authority dimension - mutation, agent_read, export, sensitivity rank and every indexing/retrieval flag
  - judged by calling paths::decide on a one-rule contract built from each rule alone, comparing real decided output rather than raw YAML, and deliberately NOT comparing the class label. A violation is
  refused, reported and dropped from effective. secret-class kernel rules are excluded because decide's own secret_locked latch protects them regardless of list order, and scanning them would only produce
  false refusals on ordinary native-layout declarations.
why_it_resists_a_reviewer: the overlap check is a real domain-intersection procedure rather than a shape heuristic - verified with a cross-anchor case (frontend/** vs **/.env*) whose only witness combines
  literal fragments from both patterns - and the restrictiveness check asks the actual production decide() output, so relabelling class, renaming fields or omitting fields (which would silently inherit
  permissive defaults) are all covered by the same computation the tool-install envelope itself uses.
self_correction: 'material, and caught by the required full suite rather than by inspection. Its first version reused path_rule_narrowing''s class-equality gate, which refused a legitimate narrowing that
  a currently-supported test relies on (repair.rs::sensitivity_classes_and_namespaces_are_enforced classifies product/legal/** authoritative/restricted against the kernel''s product/** source). Replacing
  it with the decided-output comparison also surfaced a witness-construction bug: pattern_witness dropped a trailing ** to zero segments, producing a witness that did not match the kernel pattern''s own
  compiled regex and silently fell back to permissive defaults for the kernel side - masked in its first unit test only because a different field happened to differ too. Fixed, pinned with a unit test asserting
  the refusal names the mutation dimension, and guarded with a debug_assert tripwire.'
three_properties:
- refused - certification and unit tests both assert it
- reported - gov policy overrides carries the refused entry with policy, key, the full new rule, the full kernel rule and a reason naming archive/** and mutation; doctor D027 fails with that reason; and
  the policy_precedence suite family carries a critical finding. No wiring changes were needed - policy.rs, doctor.rs, verification and the CLI already read refused_overrides generically
- without effect - the effective document never contains the widening rule, decide still returns mutation restricted for the affected paths, and a fresh tool install reaching them still shows expands_authority
  true with the broader-filesystem trigger and branch gated
negative_controls:
- a restrictive appended rule at an overlapping pattern is honoured and actually decides more strictly
- a declaration for a pattern no kernel rule governs is honoured, and a secret file under it is still classified secret by the latch - so excluding secret from the scan costs nothing
- 'gov init run end to end against the real brownfield fixture: every native-layout rule is honoured and D027 stays clean'
- a unit test proving the check judges decided output rather than the class label, including that a same-class-relabelled widening is still caught
other_consumers: the fix changes only which rules enter the effective paths array, so indexing, retrieval, export, agent-read and the tool-install envelope all read the same decide output downstream and
  are structurally covered. It verified this concretely for the tool-install reproduction and relied on the full suite for the rest, but did NOT build a fresh adversarial probe against indexing, retrieval
  or export - recorded as unaudited beyond the suite.
