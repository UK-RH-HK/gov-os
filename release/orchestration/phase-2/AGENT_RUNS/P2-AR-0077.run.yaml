schema: governance-os.phase-2.agent-run
schema_version: 1
run_id: P2-AR-0077
role: adversarial pre-mint reviewer, fourth pass (independent; not the formal acceptance verifier)
objective: Attack the AR75-F1 boundary-resolution and argument-indirection repair and the AR75-F2 class-exemption repair, prioritising the builder's three self-declared coverage gaps and the domain of its
  property-test generators.
worker:
  execution: native Claude subagent
  model: claude-opus-5
  effort: high
independence: authored none of the repairs, the integration, or any of the three prior adversarial reviews
target:
  branch: phase2/repair-3-adversarial
  base: phase2/repair-3-boundary e25ca70
  review_commit: b96109d
method:
  own_harness: harness4.py + probe_*.py written from scratch, driving target/release/gov against disposable projects each with its own XDG_STATE_HOME; nothing derived from repair4.rs
  self_check: review_subject reimplemented in Python and verified byte-for-byte against the product's reported change_class.security_review.review_subject_sha256 on four descriptor shapes (4/4)
  differential_control: c34c439 extracted with git archive and built separately, so every 'closed' and every 'materially new' claim is measured against the pre-repair code
  lab_discipline: nothing deleted; stale trees and markers moved aside into lab/aside/; marker sink outside every project root by construction
status: COMPLETED_AWAITING_INTEGRATION
outcome:
  verdict: RESIDUAL_DEFECTS (3 HIGH, 1 MEDIUM, 1 LOW)
  owner_stop_condition: 'TRIGGERED ON BOTH LIMBS of OA-P2-06: materially new HIGH blockers on the install-trust surface, AND AR75-F1 and AR75-F2 both left materially open'
  ar75_f1: named witnesses DEAD (proven, with the differential control showing they fired at c34c439) but the FINDING's statement is still true of curl; class materially open
  ar75_f2: named witness DEAD (proven against the parent); class materially open via a second consumer of class
  builder_self_declared_gaps: all three hold - broken intermediate symlink gates as undetermined; --config, --config=<file>, -sK, -Ks, --CONFIG all gate; the case-fold collision is exactly as disclosed
    and the builder's test asserts what its name claims
  defects:
  - id: AR77-F1
    severity: HIGH
    materially_new: true
    class: BC-P2-53 / OD-P2-05 cl.3 / OD-P2-03 req 2,3
    statement: 'endpoint_host ends with (!host.is_empty()).then(..), so a file:// URL with an EMPTY authority returns None and is never routed to the network branch. It falls through to resolves_outside_project,
      where the token starts with ''f'' and has no whole ''..'' segment, so it is joined under the root as <root>/file:/etc/hostname -- inside. Four shapes install not_gated with expands_authority false,
      no triggers, nothing undetermined and ZERO gate records, while writing a file outside the project root or copying /etc/hostname into it. The health_check variant recreates its marker on every later
      gov tools health - the exact recurrence class OD-P2-05 clause 5 exists to close. Boundary characterised: a bare absolute path, x:/etc/hostname, --output-dir=<abs>, --netrc-file <abs>, file://../x
      and file://localhost<abs> are all CAUGHT; file://<abs> and FILE://<abs> are not. PRE-EXISTING at c34c439, never previously reported.'
    orchestrator_verified: runtime/src/tools.rs:1408 reads (!host.is_empty()).then(|| host.to_ascii_lowercase()) exactly as stated
  - id: AR77-F2
    severity: HIGH
    materially_new: true
    class: BC-P2-53 / OD-P2-05 cl.3
    statement: token_values yields the token plus the RHS of the FIRST '=' only, and leaves_project tests the token's PREFIX and whole '..' segments, so an absolute path embedded behind any other prefix
      character is invisible. curl --write-out supports %output{<path>} (curl >= 8.3; this host has 8.5.0), redirecting its own output into an arbitrary file. The shape installs not_gated with zero gate
      records and writes a marker outside the project root. Pre-existing at c34c439. A second shape, curl -d @/etc/hostname <allowlisted https>, classifies with no authority expansion; deliberately NOT
      executed because it would post a host file to a real service.
  - id: AR77-F3
    severity: HIGH
    materially_new: true
    class: BC-P2-45 / OC-P2-04 cl.2,3,4
    statement: 'class has a SECOND authority-bearing consumer the repair does not compare. orchestration::tasks::is_production_path (tasks.rs:1856) exempts SIX values - evidence, narrative, historical,
      generated, derived, runtime-data - and gates three controls: EXPERIMENT_OUTPUT_IN_PRODUCTION, PRODUCTION_MERGE_NOT_ALLOWED and the after-the-fact governance sweep. The repair''s confers_generated_exemption
      names TWO of the six. One hand edit appending {pattern: product/*.yaml, class: evidence} to the project-editable REPOSITORY_CONTRACT.yaml is not refused, not reported, invisible to gov doctor, and
      turns a refused EXPERIMENT_OUTPUT_IN_PRODUCTION into an accepted experiment naming a production path as an output, with the record written to disk. narrative, historical and runtime-data behave identically
      at the close-time check.'
    orchestrator_verified: tasks.rs:1865-1868 matches six values; policy_precedence.rs:586-587 matches exactly two
    counter_argument_stated_by_the_reviewer: is_production_path's own doc comment describes classifying a tree as evidence to sandbox experiments as an INTENDED capability via a governed change to the repository
      contract. The capability is by design; the defect is that a hand edit obtains it SILENTLY, which is OC-P2-04 clause 3. The reviewer flagged this so the owner can weigh it rather than take the grading
      on trust.
  - id: AR77-F4
    severity: MEDIUM
    materially_new: true
    class: BC-P2-53
    statement: A HARD link defeats the boundary model entirely - resolves_outside_project canonicalises symlinks, and a hard link has nothing to resolve. ln <outside>/target.txt <root>/hardlinked then cp
      payload.txt hardlinked installs not_gated and REWRITES the file outside the project root (verified by content comparison, not existence). MEDIUM because git does not preserve hard links, so unlike
      a symlink this cannot arrive through version control or a governed clone - the same precondition that made AR68-F5 and AR73-F4 MEDIUM.
  - id: AR77-F5
    severity: LOW
    materially_new: false
    class: BC-P2-53
    statement: 'The argument-indirection refusal states a falsehood for its own disclosed collateral: curl -k gates with the message "is told through ''-k'' to read further arguments from a file or stream
      ... a named artefact exists", but -k is --insecure, reads nothing and names no artefact. TOOL_POLICY.yaml''s comment discloses the collision honestly; the RUNTIME message does not. Same defect class
      AR75-F3 corrected in this same round. Outcome unaffected.'
  why_the_property_tests_could_not_find_these: 'repair4.rs::a_candidate_conferring_the_generated_exemption_is_refused_for_any_class_value_or_overlapped_kernel_rule quantifies over for cand_class in [generated,
    derived] - EXACTLY the two values the fix implements, verified by the orchestrator at repair4.rs:616. The generator''s domain is the fix''s domain, so the property proved is ''the fix does what it does''.
    The AR75-F1 property test has the same shape of gap: every case it generates is a token that IS a path; it never produces a URL, a path embedded in a larger token, a dangling symlink, or any curl argv
    at all - precisely where AR77-F1 and AR77-F2 live. This is P2-ADJ-0006 section 3''s structural failure recurring ONE LEVEL UP: the test no longer encodes the last reviewer''s shape list, it encodes
    the implementation''s own value set.'
  prior_findings: all twelve CLOSED, each by the reviewer's own reproduction (AR68-F1..F6, AR73-F1..F6), with shape counts of 26 and 14 respectively
  negative_controls: ALL PASS - no over-gating found and OD-P2-03 requirement 6 holds. Conforming install not_gated with zero gate records before and after; curl -sS https allowlisted ungated; cp with both
    operands inside installs and writes inside; sudo make install gates on privilege_escalation; apt-get gates on host_level_authority; gov init on brownfield refuses nothing; product/legal/** authoritative
    over kernel source honoured; a restrictive append honoured; a correctly-bound review authorises. resolves_outside_project edge cases (empty token, '.', '///', trailing slash, $HOME/x, 5000-char name,
    400 segments, x..y) all inert with no false findings, while '..', '~' and '~/x' correctly gate.
  probe_hygiene_note: 'two early path-rule probes appended after capability_roots: and used an unquoted *.txt pattern (a YAML alias), silently breaking the document and producing 6 and 38 spurious ''kernel
    path rule is missing'' refusals. Both found and fixed; probe_prior2.py now ASSERTS no such refusal appears so the class cannot recur silently. Every reported result is from the corrected runs.'
  not_probed: the full certification suite (not reproduced - no reason found to doubt the builder's 252/0 and the orchestrator's confirmation, and no finding depends on suite state); capabilities/host.rs
    and binding.rs; Windows and case-insensitive filesystems (FILE:// was testable, Curl.EXE and NTFS short names were not); non-UTF8 argv (descriptors are JSON); concurrency/TOCTOU races; gov tools uninstall
    (no such route exists); --force and L3 override paths
  reviewers_judgement: the repair is competent, narrowly scoped and does exactly what P2-HO-0052 asked; it is not a closure of either finding's class. Three rounds have now been defeated on the same premise
    - that a finite positive list of programs can be read completely - and this round shows the premise failing for the SAME program, curl, in two more ways, plus the same 'compare one consumer of class'
    pattern failing for a second consumer. A shape worth an architecture review rather than a fifth repair, which is what the stopping rule already provides for.
orchestrator_disposition: OA-P2-06's stop condition triggered on both limbs. No mint, no fifth repair round. Architecture/meta-review package produced and escalated to the owner.
