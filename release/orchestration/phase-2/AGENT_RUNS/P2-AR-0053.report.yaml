findings:
  - id: OWNER-Q-R4-O1
    severity: OWNER_DECISION
    summary: >-
      Contract v3 K3 (a material governance/security change auto-triggers impact simulation), the shipped
      CHANGE_POLICY (governance_change is in human_gate_triggers) and IP-W7-1 / BC-P2-41 (a governed security review
      lets a tool installation proceed "without the owner's gate", its certification test asserting "no gate raised")
      cannot all hold for the review-evidenced installation path. This run implements the reading under which K3 and
      IP-W7-1 are both true — IP-W7-1 means no gate for the INSTALLATION subject, and the installation's change
      transaction keeps its own gate like every other governance change — and changes
      ws07::a_governed_security_review_by_another_role_lets_the_installation_proceed to assert exactly that. The
      alternative keeps IP-W7-1 literally and needs a rule no source states (a CHANGE_POLICY pre-authorisation for
      this change class, or tool descriptors ceasing to be a material governance change). The choice is the owner's;
      nothing else in this run depends on it, and dropping commit ab0a075 returns R4-O1 to the routing list intact.
    evidence_path: release/capability-baseline/repair-1/r4-residual/01-CONTINUATION-REPORT.md
verdict: OWNER_DECISION_REQUIRED
