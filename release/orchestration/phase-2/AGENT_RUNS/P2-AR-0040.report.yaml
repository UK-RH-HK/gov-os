  as an input. It read the handoffs P2-HO-0039, P2-HO-0031, P2-HO-0020, P2-HO-0010 (and, for coordination only, P2-HO-0036
  and P2-HO-0038), the round-2 integration report, the round-2 reports of WS-6 (IP-R2-10/11, O-1), WS-2 (R3-9) and
  WS-9/11, the IP lines of the other round-2 reports that name WS-9, repair-delta §1 (BC-P2-31) and §3, Contract v3 (A3),
  the adoption protocol (roles), and the product source and tests. It ran the unedited R1 held-out suites through a
  private per-run path, P2-AR-0032's labelled derived copy of its own round-2 named checks, and the synthesis AC16-X2
  probe unedited, and wrote one new probe of its own. It did not read any session or agent transcript, task-output store
  or user auto-memory (a user-memory index was injected into its context by the harness; it was not read or acted on);
  it spawned no sub-agent and did not contact the product owner. It edited nothing under release/verification,
  release/root-of-trust, release/releases, release/orchestration/phase-1, release/capability-baseline/audit-0 or another
  workstream's repair-1 directory; it did not merge, rebase, tag or push, and touched no other branch or worktree.
  Product edits were confined to the files P2-HO-0039 assigns (runtime/src/adopt.rs, runtime/src/migrations/**,
  migrations/**, framework/schemas/{migration,adoption-baseline}.schema.json) plus the adoption certification test
  file; no edit to cli/src/main.rs, runtime/src/lib.rs or any other workstream's file.
