independence_statement: >-
  Model Claude Opus 5 with 1M-token context (model id claude-opus-5[1m]), a fresh capability-repair builder. This run
  authored the product changes, the harness provisioning and two-machine helper, the builder tests and the evidence
  scripts listed below. It authored none of the Phase-2 audits, the synthesis, the owner decisions, the adjudications,
  the R1 reviews or their held-out suites, and it grades none of its own work: every claim is REPAIRED_CLAIMED or
  PARTIAL, and acceptance belongs to fresh independent verifiers. It read no session or agent transcript and no
  task-output store. One release build was moved to the background by the harness when it exceeded the foreground
  limit; its completion notice was awaited and its output store was not read. It read no user auto-memory, spawned no
  sub-agents and did not contact the product owner.

  It edited only WS-8's assigned files and the declared exceptions:
  - WS-8's files: runtime/src/{kernel,update,release}.rs, runtime/src/srr/{binding(new),mod}.rs, framework/KERNEL.yaml,
    tests/certification/{common,srr_material}.rs.
  - Builder tests: tests/certification/ws08_r3.rs (new), ws08.rs, repair3.rs (the release-identity test), srr.rs (one
    literal) and update.rs (a diagnostic message), each with its reason in the report.
  - Declared exceptions: runtime/src/lib.rs (the three version constants), Cargo.toml and Cargo.lock (the workspace
    version), cli/src/main.rs (an additive `trust bind` subcommand), runtime/src/orchestration/control.rs (one additive
    COMMAND_GUARDS entry) and tests/certification/main.rs (one mod line).

  No file was modified under release/verification/, release/root-of-trust/, release/releases/,
  release/orchestration/phase-1/, release/capability-baseline/audit-0/ or another repair-1/<ws>/ directory, and no
  docs/, spec/ or migrations/ file was modified. D-0007 and the Contract v3 source are untouched (governed_state_digest
  unchanged). Every pre-existing srr/*.rs, kernel_trust.rs, lock.rs, init.rs, recovery.rs, records.rs, tools.rs and
  capabilities/ file is byte-identical to the base. The R1 held-out suites were built and run against this worktree
  only, from a private scratch root named with this run id.
