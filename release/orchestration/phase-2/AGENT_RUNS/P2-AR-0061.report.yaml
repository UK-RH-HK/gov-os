summary: 'Two of the five WS-G items are now true and observable; three cannot be closed inside this packet''s writable paths and are named precisely below. No existing test was renamed, deleted, ignored
  or weakened, and no check, schema or policy was relaxed.


  LANDED (each with its own test in tests/certification/r2_wsg.rs, registered in tests/certification/main.rs):


  1. `V1-R1P-01` — `paths::relocate_legacy` deletes what it could not read. The function in this worktree already establishes identity only from bytes BOTH copies were read as (`f.is_file() && t.is_file()
  && matches!((read(&f), read(&t)), (Ok(a), Ok(b)) if a == b)`; runtime/src/paths.rs:269-286), so I made the requirement observable instead of changing correct code: `an_unreadable_legacy_store_is_never_removed_without_being_read`
  builds a legacy/destination pair that `read` cannot read (directories — unreadable for every uid, including root — and, as a second case, mode-0 files) and asserts `STATE_LOCATION_CONFLICT`, that the
  legacy copy still exists and that the destination was not overwritten; it also asserts that an identical pair that WAS read is still de-duplicated, so the function stays idempotent. This test fails against
  the pre-repair `read(&f).ok() == read(&t).ok()` shape (that shape returns an incidental EISDIR IO error for the directory case, not the typed conflict).


  2. `V1-BETA-08` — a generated held-out query that can never pass. `runtime/src/memory/heldout.rs`: the generated `graph_impact` query now expects what the graph route returns — the seed''s dependants,
  taken from the same traversal the route runs (`crate::graph::impact_set(db, &[id], 2)`, sorted and de-duplicated) — instead of the seed itself, and a seed with no dependants in this index is generated
  `pending` (never counted) rather than as a permanently failing baseline. `generated_graph_heldout_queries_can_pass_against_the_graph_route` drives the real path (init → spec corpus → `rebuild-memory`
  → `memory heldout-starter --force` → `rebuild-memory --incremental` → `memory verify`) and asserts no counted graph query fails. I verified the test discriminates: with the old expectation restored it
  fails, with the fix it passes.


  BLOCKED — named files, none of which this packet may write (adapter refuses them):


  3. `A1-W12-01` (preview disagrees with the gate) — cannot be closed in `tasks.rs`. The preview `gov health close-check` calls `gov_runtime::verification::close_gate` directly (cli/src/main.rs:721-743),
  while `gov task close` refuses the same receipt earlier and elsewhere, in `orchestration::tasks::require_receipt` (`RECEIPT_INVALID`, runtime/src/orchestration/tasks.rs:2549-2601, reached before the identical
  `close_gate` call at tasks.rs:2215). Making them agree therefore needs the preview call site (`cli/src/main.rs`), the gate itself (`runtime/src/verification/mod.rs::close_gate`) or the receipt validator
  (`runtime/src/context/receipt.rs`); `runtime/src/scheduler/**` is WS-F''s this round. Nothing writable here can change what the preview returns.


  4. `V1-G1-01` (negation inverted) — the deterministic intent router is `runtime/src/orchestration/intents.rs::route` (lines 18-38): it scores the kernel `COMMAND_CONTRACT.yaml` `intent_patterns` with
  a plain `low.contains(pattern)` and has no negation handling, so "do not approve this change" matches the APPROVE pattern. `runtime/src/routing.rs` (writable) is model routing (tiers, reasoning, routing
  evidence), not intent routing, and `runtime/src/intent.rs` named in the repair delta does not exist in this tree. intents.rs is not in my writable list, so item 4 stops here.


  5. `V1-A5-01` (rebuild writes under FREEZE_WRITES/PAUSE) — the only control this packet can express is refusal: `rebuild-memory`/`memory rebuild` are on `FROZEN_ALLOW_LIST` and `PAUSED_ALLOW_LIST` (runtime/src/orchestration/control.rs:517-542).
  Deleting those four entries would make the documented behaviour change, but `tests/certification/ws03.rs:420-431` asserts both commands stay ALLOWED under both controls (and that test is named in the
  governed evidence map), so the change would leave the certification suite red — a forbidden outcome, and ws03.rs is not writable here. The finding''s alternative repair direction (rebuild completes without
  rewriting the tracked `governance/generated/*-manifest.json`) requires the `write_manifests` call in `runtime/src/memory/indexer.rs:2035` or `runtime/src/memory/manifest.rs::write_manifests`, neither
  writable. `runtime/src/memory/mod.rs` (writable) contains only `pub mod` lines and is not on the rebuild path.


  CHECKS OBSERVED (via run_check, summaries only): `build` exit 0, 0 warnings; `lib_tests` 276 passed / 0 failed; `cert_wsg` 2 passed / 0 failed; `paths_tests` 6 passed / 0 failed; `intent_tests` 1 passed
  / 0 failed; `fmt` exit 0, clean. These are claims, not acceptances; an independent verifier decides.'
