    - 'V1-F4-01 (MATERIALLY_NEW): installation_authority scans each argv element literally, so an interpreter wrapper hides the same effects — sh -c sudo apt-get install, bash -lc cp /etc/shadow, python3 -c os.system(''sudo id'') and make install each record expands_authority false with no triggers and install ungated. Proven by execution; --execute is not the boundary (health_check.command, which runs on every installation, did the same). The verifier records adjacency to BC-P2-39 rather than distance: BC-P2-39''s mechanism was descriptor self-declaration, which this candidate no longer does, and installation_authority/change_decision/OD-P2-03 did not exist at iteration 0.'
