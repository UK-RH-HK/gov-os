    - 'V1-F4-02 (RESIDUAL of BC-P2-45): role_permissions reads governance/project/TOOL_PERMISSIONS.yaml straight from the overlay, not through policy_precedence, and POLICY_PRECEDENCE has no rule for it. A hand edit with no gov command, transaction or gate flipped an install from privilege_escalation to inside the envelope and gov audit said nothing. Same exposure for REPOSITORY_CONTRACT.yaml and DATA_SENSITIVITY.yaml.'
