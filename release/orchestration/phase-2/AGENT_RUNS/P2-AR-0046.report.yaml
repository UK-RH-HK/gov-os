cross_machine_attack:
  machines: 5
  checks: 74
  failures: 0
  result: PASS
  summary: >-
    OS-written facts (gate, audit, task and CIT records, all portable-scope sealed under the owner's
    T2 binding authority) are honoured on the owner's other provisioned, bound machine after a Git
    clone, and a fact that machine writes is honoured back on the first. A record edited by hand is
    BROKEN, one with its seal stripped is UNSEALED, one from a provisioned-but-unbound machine, an
    unprovisioned machine or a foreign owner is FOREIGN, and one sealed under a key a newer authority
    revoked is UNAUTHORISED; each refusal is typed and states its reason, and the broken record makes
    the governance suite fail by name. Binding authorities are refused when signed by a
    root-delegated key that is not the t2-binding role or by an unknown key (SRR_THRESHOLD_NOT_MET),
    when expired (T2_BINDING_AUTHORITY_EXPIRED), when rolled back after a rotation
    (T2_BINDING_AUTHORITY_ROLLBACK), for a key they do not authorise (T2_BINDING_KEY_NOT_AUTHORISED),
    for another machine (T2_BINDING_MACHINE_NOT_AUTHORISED) and on an unprovisioned machine
    (T2_BINDING_UNPROVISIONED). No binding key or role private key appears anywhere in the
    repository, the trust surface exposes no signing subcommand and the binary carries no signing
    symbol (SRR-R0-L4). A second machine is KERNEL_UNANCHORED until it verifies the release the
    project pins (ARCH-0003 §8); that refusal names its remedy and leaves status, doctor, kernel
    trust and kernel verify available. An unprovisioned machine refuses external-source ingress
    (OD-P2-02) and installs the embedded payload only as a marked BOOTSTRAP_EMBEDDED_PAYLOAD with
    authenticity UNKNOWN, disclosed by status, doctor and audit.
