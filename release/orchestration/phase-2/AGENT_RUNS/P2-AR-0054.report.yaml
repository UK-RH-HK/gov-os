role: capability-repair
objective: >-
  Repair iteration 1, round 4 integration builder — merge phase2/repair-1-r4-ws01 (P2-AR-0042, the BC-P2-02 evidence
  map) and phase2/repair-1-r4-residual-c (P2-AR-0043 residual integration points, P2-AR-0053 continuation, P2-AR-0055's
  implementation of owner decision OD-P2-03) with --no-ff; reconcile the evidence map against the residual branch's new
  tests so that `gov contract verify` passes (IP-R4-WS01-3) and map those tests to the capabilities their own reports
  name (R4-IP-2); regenerate the suite-to-contract matrix with the product from this run's own outputs; run every suite
  and all four prior R1 held-out suites through a private path with the census; re-run both builders' own probes on the
  integrated binary; carry forward every gap and integration point without closing it. The tree produced becomes
  cap2-candidate-1. Claims only, never acceptance.
agent_model: "claude-opus-5[1m]"
independence_statement: >-
  Model Claude Opus 5 with 1M-token context (model id claude-opus-5[1m]), fresh context for this run. This run is the
  round-4 integration builder: it merged the two round-4 branches and authored exactly one commit beyond the merges
  (e9a2f9c, the evidence-map owners for the residual branch's new tests, written by `gov contract compile` from an
  additive edit to P2-AR-0042's owner-spec.yaml, which P2-HO-0049 and IP-R4-WS01-3 prescribe), plus the integration
  report and evidence. It authored none of the round-1..4 repairs, no audit, synthesis or verification run, and it
  grades no repair, its own work included. It changed no product code, no policy, no schema, no kernel file, no
  migration and no test. It read P2-HO-0049, P2-HO-0040, P2-HO-0030, P2-HO-0019, P2-HO-0031, P2-HO-0020, P2-HO-0010,
  OWNER-DECISION-P2-0003, the three prior integration reports, both round-4 branches' reports, claims and evidence
  scripts, and the product source and tests of the merged tree; the prior R1 held-out suites were run unedited. Other
  branches were read with git show / git diff only; no branch but phase2/repair-1-r4-integration was checked out,
  merged into, rebased, tagged or pushed, and the main checkout was not modified. It did not read session or agent
  transcripts, task-output stores or user auto-memory; it spawned no sub-agents and did not contact the product owner.
