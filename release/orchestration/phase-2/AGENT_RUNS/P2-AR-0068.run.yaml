schema: governance-os.phase-2.agent-run
schema_version: 1
run_id: P2-AR-0068
role: adversarial pre-mint reviewer (independent; not the formal acceptance verifier)
objective: 'Attack the repaired tool-install and authority surface on the integrated iteration-2 tree before any candidate is minted: command-shape bypasses (BC-P2-53), review-to-installation binding (BC-P2-41),
  WS-A''s two disclosed residuals, the negative controls, and real filesystem effects rather than status fields.'
worker:
  execution: native Claude subagent
  model: claude-opus-5
  effort: high
  routing_basis: 'owner routing policy: adversarial and formal verification roles are Opus 5; DeepSeek paused, so the different-provider review is a fresh Opus 5 role instead'
independence: authored none of the iteration-2 repairs, the integration, or the iteration-1 verifications; repairs nothing and writes only its own findings
target:
  branch: phase2/repair-2-adversarial
  base: phase2/repair-2-integration 61e39b6
  product_code_digest: f08f991b3a8f403c164c73fa57e8feffd50871ffee8aef7a267a7c778392e2f2
  governed_state_digest: 8c8ebe02da0926151a4bfc1f3a4437c31f2315c10255da3ad4a56ad451b6935d
  orchestrator_verified: build 0 warnings, lib 276/0, certification 225/0, gov contract verify CONTRACT_SOURCE_BOUND
active_gate: GATE-P2-REPAIR-2
iteration: 2
required_verdict_vocabulary:
- SURFACE_SOUND
- RESIDUAL_DEFECTS
- INCOMPLETE
consequence: RESIDUAL_DEFECTS in an existing blocker class sends the class back for repair and re-review before minting. A genuinely new material blocker class or a normative ambiguity is escalated to the
  owner under the Phase-2 rules.
status: COMPLETED
outcome:
  verdict: RESIDUAL_DEFECTS
  evidence_commit: 3d506c2fba6d3a60e072e2aedc1e6d13dac6fa0b
  report_commit: fe614e3
  reviewer: native Claude subagent, claude-opus-5, high effort; authored none of the repairs, the integration or the iteration-1 verifications
  reproduced: build 0 warnings, lib 276/0, gov contract verify CONTRACT_SOURCE_BOUND, product_code_digest f08f991b...e2f2 and governed_state_digest 8c8ebe02...935d all reproduced; the repair's own tests
    green (r2_ws 18/0, ws07 9/0). Full certification not re-run - the reviewer spent the time on attacks and says so.
  method: black box through the gov JSON contract against disposable projects, each with its own XDG_STATE_HOME; every command-shape defect proven by a marker file appearing OUTSIDE the project root rather
    than by reading a status field; payloads spelled without any absolute path, .. segment or / so the OS's own per-token path scan could not gate incidentally
  defects:
  - id: AR68-F1
    severity: HIGH
    class: BC-P2-53
    judgement: residual
    statement: '25 of 33 command shapes installed not_gated and wrote outside the project root: any exec-prefix before a named recipe program (env, nohup, timeout, nice, setsid, stdbuf, env VAR=x) because
      opaque_recipe_programs matches argv[0]''s basename only; combined or permuted short flags (-ce, -cl, -cx, -xc, -cv, -ic) and the equals form (--eval=) because inline_code_flags matches by whole-token
      equality; flagless interpreters (awk, gawk) with a bare program operand; and payload-in-a-file (sh installer.sh, ./installer.sh, python3 setup.py install). The same families also bypass through health_check.command.
      The four shapes the repair''s own tests cover all gate correctly.'
    note: 'the reviewer deliberately labelled this residual rather than new: calling it new would let BC-P2-53 be recorded closed while its property is still false'
  - id: AR68-F2
    severity: HIGH
    class: BC-P2-41
    judgement: residual, materially worse than disclosed
    statement: 'A subjectless review evidences an installation no reviewer ever saw - no race needed, the reviewed descriptor need never be installed. Aggravating and not previously stated: report.schema.json
      does not describe the security_review block at all, so subject_sha256 is neither required nor validated, and no gov command computes or writes it. The weak fallback is therefore the DEFAULT path for
      every review the governed route produces.'
  - id: AR68-F3
    severity: HIGH
    class: BC-P2-45 / OC-P2-04
    judgement: materially new mechanism inside an existing class, introduced by this iteration's repair
    statement: 'Appending ONE rule at a pattern with no kernel counterpart to governance/project/REPOSITORY_CONTRACT.yaml turns expands_authority true with trigger broader_filesystem_or_project_access into
      false with no triggers, and the branch from gated to not_gated. evaluate_path_rules_overlay honours an unmatched pattern with no restrictiveness check while POLICY_PRECEDENCE''s own comment says a
      project may only append a rule restrictive by construction, and paths::decide is last-match-wins. On a fresh run nothing reports it: gov policy overrides refused [], the policy_precedence family ok,
      path_map_compliance ok with shadowed_rules [], doctor D027 ok. gov audit degrades only via adapter_portability staleness, which fires for any edit and says nothing about authority. Fails OC-P2-04
      clauses 2, 3 and 4.'
  - id: AR68-F4
    severity: MEDIUM
    class: BC-P2-53 (lifetime)
    judgement: residual, one step beyond
    statement: 'A reviewed, pinned, ungated install whose health_check.command runs a script file: changing that file afterwards and running gov tools health wrote a marker outside the project root with
      no gate, no re-review and no pin check. Authority is derived at install time only.'
  - id: AR68-F5
    severity: MEDIUM
    class: BC-P2-41
    judgement: residual, new mechanism
    statement: 'The single-use fallback is re-armed by moving the installed descriptor aside: the uniqueness scan reads currently-installed descriptors, so ''at most one installation ever'' is really ''at
      most one at a time''. Downgraded from HIGH because the precondition is an ungoverned write to a restricted path and there is no gov tools uninstall - if a governed removal route exists, this rises
      to HIGH.'
  - id: AR68-F6
    severity: MEDIUM
    class: BC-P2-41
    judgement: residual, new mechanism
    statement: A wrong-typed subject_sha256 (a number) silently downgrades the exact binding to the weak fallback instead of failing closed, and gov task close --report accepted the malformed review.
  properties_that_held:
  - 'the gated path does not write first: make install with a marker Makefile produced no marker, no descriptor and never set installed'
  - 'BC-P2-41 exact binding across the class''s own six-descriptor acceptance case: exactly the reviewed one installs, the other five refused naming both digests and the difference'
  - no review, nonexistent review, self-attested review, a review hand-edited after the OS wrote it (T2 binding), wrong version, and field reorder all behave correctly
  - 11 of 12 authority attacks held, including the exact edit repair-delta.md named, a new role key with elevated classes, install_authority_roles, widening a kernel rule in place, the same widening through
    a valid YAML anchor or alias, the overlay replaced by a symlink to a widened file outside the repo, an unparseable overlay and a removed overlay (both fail closed and restore every kernel rule), default_class
    lowering, an added lowering classification and path-map reordering
  - 'all three negative controls pass - no over-gating: a non-elevated reviewed pinned reversible install completes ungated with zero gates on disk; allowlisted network use alone does not gate; an ordinary
    flagged command installs'
  could_not_establish:
  - the full certification suite was not re-run by the reviewer (about 30 minutes serial); the orchestrator's own serialised 225/0 stands
  - whether some certification file it did not read already exercises one of the 25 shapes (it read r2_wsa.rs in full)
  - whether a governed route exists to remove an installed tool descriptor - the precondition for AR68-F5
  - 'the breadth of AR68-F3 beyond this surface: paths::decide also feeds indexing, retrieval, export and agent-read'
  - Windows command spellings on a Linux host; by inspection the same three weaknesses apply
  reviewer_convergence_note: 'AR68-F1 is the second consecutive iteration in which the command derivation is defeated - by wrapping in iteration 1, by shape enumeration in iteration 2 - and AR68-F3 is new
    mechanism this iteration added to the same surface. Its own suggestion, offered and not implemented: an enumerated allowlist of readable shapes keeps losing because the set of programs taking code as
    an argument is unbounded while the list is finite; the inversion is the opposite default - nothing readable unless program AND whole argv shape are named - with OD-P2-03 requirement 6 satisfied by naming
    the small set of installs a project actually performs. It states the three-consecutive rule is the orchestrator''s judgement, not its own.'
  orchestrator_disposition: pending - see the owner escalation and the repair routing recorded with this run
