  defects:
  - id: AR75-F1
    severity: HIGH
    class: BC-P2-53
    judgement: residual, new mechanism
    statement: 'cp and curl are on plain_argument_programs on the stated ground that they have no code, wrapper or file-execution meaning of their own. Both do. Combined with the per-token scan treating
      a token as a path ONLY if it contains a slash, six shapes install not_gated with expands_authority false, no triggers, nothing undetermined, zero gate records, a written descriptor and a marker in
      the parent of the project root: cp writing through a symlink named for the parent (in install_command, in health_check.command, and behind an env wrapper), and curl -K reading the rest of its command
      line from an ordinary project file (in both command fields). Five of the six contain no slash, no .. and no absolute path anywhere in argv. The health-check variants re-fire on every later gov tools
      health. Controls confirm specificity: sudo make install gates on privilege_escalation, apt-get install gates on host_level_authority, cp with both operands inside the project installs ungated'
    tension_stated_by_the_reviewer: 'cp and curl are listed BECAUSE the certification suite needs them; striking them gates conforming paths, and modelling their arguments re-opens enumeration. It offers
      a third option it did not implement: resolve every non-flag token against the project root and refuse what escapes, instead of only reading tokens that contain a slash'
  - id: AR75-F2
    severity: HIGH
    class: BC-P2-45 / OC-P2-04
    judgement: residual of AR68-F3, new mechanism
    statement: 'overlap_is_no_less_restrictive deliberately does not compare class, but class is authority-bearing: tasks::contract_generated drops generated and derived paths from the observed-mutation
      set before the declaration and scope checks. Appending a rule at product/*.yaml with class derived - equal or STRICTER on every compared dimension - makes an undeclared, out-of-scope write close cleanly:
      gov task close goes from refused MUTATION_SCOPE_VIOLATION to accepted, observed mutations from one to none, and policy overrides, D027, the policy_precedence family and path_map_compliance all stay
      clean. globprobe confirms the check SAW the overlap and passed the rule, so this is not a pattern miss'
  - id: AR75-F3
    severity: LOW
    class: BC-P2-45 / OC-P2-04
    judgement: the second pair of eyes P2-AR-0074 asked for
    statement: 'an attacker can claim class secret freely, and it does widen mutation - archive restricted to allowed, and governance/kernel prohibited to allowed - with nothing reported. THE EXCLUSION''S
      STATED JUSTIFICATION IS FACTUALLY WRONG: decide applies a later secret rule in full, so the appended rule''s own mutation wins; the latch does not leave mutation to another rule. Not exploitable today
      because the only consumer of decide().mutation is pre-empted by the secret-sensitivity branch above it (measured: the install still gates, on a different trigger) and the two prohibited checks read
      the raw rules array. Declaring secret costs the attacker every other dimension, and an explicit export override on the same rule is still refused. LOW, but the code comment''s reasoning must not be
      carried forward as written'
  witness_gap_measured: 'globprobe fuzz over 2069 candidates x 38 kernel rules (78622 pairs, 776-path corpus): 272 real overlaps missed across 124 candidates and five kernel rules. Argued inert, but for
    a DIFFERENT reason than the repair gave: the 87 misses against the secret rule cannot matter because the procedure deliberately skips secret kernel rules anyway, and all 185 non-secret misses have a
    candidate the procedure does see overlapping .governance-state/**, which by measured decided output dominates all four missed non-secret rules on every compared dimension. The reviewer notes governance/kernel
    is NOT the saturating rule, so the argument must be made against .governance-state. Bounded search, strong evidence, not a proof'
  consumers: indexing (all four flags), retrieval, export and the tool-install envelope are all back at the kernel floor for every refused pattern, with per-dimension globprobe evidence; explicit export
    widening is refused on any candidate including a secret one. The one new consumer this review adds is tasks::contract_generated, reached through class
