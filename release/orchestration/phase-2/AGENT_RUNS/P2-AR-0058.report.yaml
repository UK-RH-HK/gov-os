summary: BC-P2-37 WS-D repair is claimed. runtime/src/update.rs now authenticates an explicit external source through the single srr::admit policy before drawing any currency conclusion. On admission failure,
  `gov update --check` returns a non-affirmative result with source_authenticated=false, up_to_date=false, a typed authentication_error, and a recommendation that states plainly that no currency claim is
  made. `gov update --apply` no longer returns `already up to date` for such a source; it proceeds through the existing Human Gate flow and the final srr::admit returns the typed SRR refusal. A correctly
  signed at-version source still reports source_authenticated=true, up_to_date=true and apply reason `already up to date`. The frozen five-admit/install census was preserved by introducing one shared `admit_update_source`
  helper for update check/rollback while keeping the required `let auth = crate::srr::admit` site in apply_update_opts. Tests in tests/certification/r2_wsd.rs observe the three required source shapes from
  both --check and --apply, plus the authenticated at-version case.
items:
- 'runtime/src/update.rs: explicit-source check authenticates before any currency conclusion and returns typed non-affirmative result on refusal'
- 'runtime/src/update.rs: apply no longer returns a false already-up-to-date clearance for an unauthenticated explicit source'
- 'runtime/src/update.rs: shared admit_update_source helper keeps the SRR five-admit/install census intact'
- 'tests/certification/r2_wsd.rs: payload-tampered, foreign-signed and below-floor sources each produce typed non-affirmative check and apply results'
- 'tests/certification/r2_wsd.rs: correctly signed at-version source still reports up to date'
- 'tests/certification/main.rs: r2_wsd module remains declared'
