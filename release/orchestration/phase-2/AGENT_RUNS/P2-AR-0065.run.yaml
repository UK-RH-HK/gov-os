  finding_that_reframes_the_task: The two failures P2-AR-0060 reported did NOT reproduce. Each passed in isolation (brownfield 1/1, migration::path_migration_with_rollback_and_memory_rebuild 1/1) and a
    genuine full-suite run of the UNMODIFIED preserved tree (8a3d648) came back 210 passed / 0 failed. The worker could not reproduce the 208/2 state.
  reading_chosen: '(b) the adoption audit sees only the families it always did; doctor outcomes go into the health record but not the verdict - and this was ALREADY correctly implemented by the preserved
    work, confirmed by code reading: run_suite''s per-check `wanted` flag is hard false for Surface::Doctor under any selection except an explicit --check <doctor-id>; suite_verdict and audit_with''s findings/counts
    come from wanted_families(), so adopt.rs''s A11 verdict never sees doctor findings. No change to adopt.rs was needed or made.'
  root_cause_fixed_instead: 'A pre-existing latent defect the WS-F repair makes far more likely to bite: runtime/src/scheduler/mod.rs held two PROCESS-GLOBAL statics (SUITE_DEPTH: AtomicUsize, OBSERVING:
    AtomicBool) guarding nested suite runs and concurrent observation. The certification binary runs ~210 tests as concurrent threads in ONE process, each against its own isolated fixture, so a process-wide
    guard lets one test''s run_suite silently suppress an unrelated test''s scheduler::observe() (mutation observation skipped) or make its status() report repository.verdict NOT_EVALUATED. Folding the
    35-check doctor half into every explicit G1/G5 run lengthens the SUITE_DEPTH>0 window (~2.5 s G1, ~5.3 s G5 on a fresh fixture), raising the odds the interference lands on the heaviest tests - brownfield
    and migration make the most audit and G5 calls. Fix: both guards rescoped to per-project registries keyed by canonical project root (HashMap/HashSet behind Mutex + OnceLock, with poisoned-mutex recovery
    so one test''s panic cannot wedge the registry). 63 insertions / 25 deletions in that one file; the statics were referenced nowhere else (grep-confirmed).'
  full_suite_worker_reported: 'before its edit, unmodified preserved tree: 210 passed / 0 failed (1309 s). After its edit, the genuine required run: 210 passed / 0 failed (2173 s - slower only because the
    orchestrator''s WS-B suite was running concurrently on the same machine).'
  g1_cost_measurement: 'fresh greenfield fixture, gov health run --tier G1 --no-persist: ~2.5 s wall, 45 executed + 8 reused + 0 not_evaluated = all 53 declared G1 members including all 35 doctor checks.
    G5: ~5.3 s for all 74. Scoping: this cost hits only an EXPLICIT --tier G1 or gov audit caller. The ambient per-mutation G1 pass from scheduler::observe() uses Selection::Explicit with family ids only,
    so has_doctor stays false and the routine per-mutation path is unaffected. Flagged for the verifier''s judgement against any AC-5 tier-duty timing expectation; the worker found no reason to treat it
    as disqualifying.'
  tests: none added; tests/certification/r2_wsf.rs and main.rs are byte-identical to the preserved commit. A temporary timing test was added to measure G1/G5 cost and reverted before committing.
  unresolved: 'The worker never reproduced the 2-failure state, so its causal claim is a hypothesis: the per-project rescoping is a real defect fix regardless, but it was not A/B-tested against a reproduction.
    If failures recur, capture the full audit JSON (verdict, findings, doctor_failed) at the point of failure - neither run ever captured it.'
