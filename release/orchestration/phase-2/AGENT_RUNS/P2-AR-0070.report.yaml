classification: 'unreadable_command_shape rewritten: every argument of install_command, uninstall_command and health_check.command must classify with confidence as inline code, a recipe program, a flagless
  interpreter, a file this command executes (readable only when pinned_files names it with a matching sha256 of the LIVE file, recomputed every call), or a plain argument - anything else is undetermined
  and gates. skip_wrappers first walks a bounded chain of wrapper programs (env, nohup, timeout, nice, setsid, stdbuf, ionice, chrt), consuming their own flags and env''s NAME=value assignments, so the
  checks run against the EFFECTIVE program regardless of position, absolute path or symlink. Inline-code flags now match three ways: whole token, the =value form of a long flag, and any bundled single-dash
  letter that is itself a listed single-letter flag - derived from policy (short_code_letters) rather than hardcoded, so a new permutation of the same letters is still caught.'
pinning: new descriptor field pinned_files [{path, sha256}]; classify_file_candidate re-reads the live file and recomputes its hash on every call - at install (both when change_decision is computed and
  again at the CIT-E write) and from health_one on every gov tools health for a project-installed descriptor only, gated on installation_sha256 so kernel-registry tools are not scope-crept. Mismatch, missing
  pin or unreadable file returns TOOL_COMMAND_UNVERIFIED instead of running.
all_33_shapes: 'all 33 of the adversarial review''s shapes proven by filesystem effect in r2_toolbind::all_33_probe_53_shapes_are_proven_by_filesystem_effect_not_only_by_a_branch_field: every shape gates
  or refuses undetermined, installed false, descriptor never written, and the payload''s marker never appears in the project''s parent directory. Covers the 7 wrapper prefixes, 8 combined-flag forms, the
  equals form, 2 flagless interpreters, the 3 script-file families, the same 4 families in health_check.command, and the 8 that already held as regression guards.'
ar68_f4: 'a_pinned_script_installs_ungated_and_a_hash_drift_afterwards_is_refused_not_executed: a correctly pinned sh installer.sh installs NOT_GATED with zero gates raised (so OD-P2-03 requirement 6 is
  not sacrificed); editing the script after the clean install makes a standalone gov tools health refuse, and the marker the changed script would have written outside the project root never appears; restoring
  the original bytes makes health clean again.'
review_binding:
  F6: 'closed twice over: report.schema.json now describes security_review and constrains subject_sha256 to a 64-hex string, so gov task close --report hard-refuses SCHEMA_INVALID on the number and empty-string
    forms - the attack never gets written; and security_review_evidence now distinguishes absent from present-but-malformed and hard-errors on the latter. Schema 1.1.0 -> 1.2.0 mirrored in KERNEL.yaml.'
  F5: 'closed: the uniqueness scan now reads committed_installations() - every COMMITTED install_tool change transaction under spec/decisions/ - instead of present-state project_tools(), so moving the installed
    descriptor aside no longer re-arms the fallback; proven with std::fs::rename, the second install still refused and no marker outside the project root.'
  F2: 'partially closed: review_subject is now public and gov tools install always reports review_subject_sha256 under change_class.security_review, whether or not a review is cited, so the strong form
    is computable by the governed route. The fallback itself was NOT retired - see the authorisation note.'
fallback_not_retired: 'Deliberate and correctly escalated rather than forced. Retiring it would break two currently-passing tests outside the run''s authorised edit scope: r2_wsa::an_unbound_review_is_still_held_to_a_single_installation,
  which exists to prove the fallback''s single-use behaviour, and ws07::a_governed_security_review_by_another_role_lets_the_installation_proceed - the flagship test OD-P2-03 itself cites as proof that round-3
  behaviour is restored, which installs its control descriptor on a subjectless review. The worker verified it needed neither r4_residual.rs nor ws07.rs under its own design and ran both suites unmodified.
  Residual: a subjectless review can still evidence an arbitrary FIRST installation whose command classifies as plain or a correctly-pinned file; inline-code, recipe, flagless and unpinned-file shapes no
  longer qualify at all, which removes most of the practical surface including the review''s own awk probe.'
