  iteration-1 verifier's evidence directory or branch, any agent transcript, any task-output store, or user
  auto-memory. I spawned no sub-agents; every command reported here I ran myself. I did not contact the product
  owner. One disclosure: while checking on a background build I listed the session task-output directory before
  recognising what it was; I opened no file in it, and afterwards ran every build and test in the foreground or
  with logs written to my own scratch path.
