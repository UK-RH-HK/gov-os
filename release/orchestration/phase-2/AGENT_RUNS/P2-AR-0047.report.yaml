unresolved:
  - >-
    The reranker plugin boundary was established from the admission code path and the fail-closed refusals, not by
    registering a `rerank` plugin that records what it receives; a registration needs an owner-signed execution gate
    for that plugin identity and is Gate F4 (gamma's scope this iteration).
  - >-
    Model/runtime artefact binding for a real external embedder was read, not exercised, for the same reason: the
    built-in embedder's model and runtime are the running binary, so their identity is derived.
  - >-
    Scale and soak: every probe ran on corpora of 170-280 artefacts. Retrieval latency, index cost and the
    incremental path at 10^4-10^5 artefacts are proposed as Phase-4 chaos/scale challenges per capability.
  - >-
    The G0-G6 scheduler's own properties (impacted-test selection, parallelism, cache reuse and invalidation,
    RED/YELLOW/GREEN aggregation) were exercised only where a beta capability is observed by them; AC-5 is epsilon's.
  - >-
    V1-BETA-01's blocking call rests on my reading of AC-3 for C8; the contrary reading is stated in the report so
    the synthesis verifier can weigh it rather than inherit it.
recommended_next_action: >-
  The synthesis verifier should treat V1-BETA-01 as beta's one blocking finding (AC-3, C8) and carry V1-BETA-03 and
