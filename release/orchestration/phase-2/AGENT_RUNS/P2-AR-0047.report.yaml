ac7_determination:
  holds: true
  basis: >-
    Frozen gate contract §9.1 asks for an executable, evidenced path to a provisional retrieval profile, not for a
    selection. Every element of §9.1 was exercised end to end on a provisioned machine: ten separately identified D4
    components; a three-candidate benchmark over 32 held-out queries reporting recall@k, MRR, precision@k, stale-hit
    and superseded-hit rates, symbol recall, latency and index cost per candidate, each row carrying the candidate's
    component identities; a refusal without evidence; WAITING_HUMAN at radius R5 with nothing applied; refusal of a
    CLI/environment-declared `human` role; application under the owner's signed answer with a recorded decision, a
    full re-index and a measured regression; automatic rollback of a measurably worse candidate with a durable
    regression record; and the resulting decision honoured on a second bound machine of the same owner.
  phase_3_precondition: >-
    V1-BETA-03 and V1-BETA-08: the generated held-out set measures no semantic query and two of its graph queries can
    never pass. Phase 3 must author the pending paraphrase queries and correct the graph expectations before earning
    PROVISIONAL_RETRIEVAL_PROFILE_READY, or the selection will rest on evidence that cannot discriminate the
    component being selected.
  profile_selected: false
