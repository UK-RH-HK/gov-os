worker_stall_protection:
  status: ACTIVE
  adopted: 2026-09-22, owner instruction section 1 of the A+C architecture decision (OD-P2-07)
  scope: procedural/runtime governance for the remainder of Phase 2. Changes nothing in Contract v3, the frozen
    Phase-2 acceptance criteria, product behaviour or the active V8.2 architecture.
  origin: the ~420-minute stall recorded in V8_3_EVIDENCE_PACKAGE.md section 6.3b -- a worker finished its targeted
    work, was told to wait for coordinator confirmation before the full suite, the coordinator never sent it, and
    the worker sat idle while its notifications read as running.
  rules:
  - 1. No worker may be left indefinitely waiting for an orchestrator/coordinator message.
  - 2. A blocking coordinator handshake may be created ONLY with BOTH an explicit timeout AND a deterministic default
    action on expiry.
  - '3. Prefer self-evaluable preconditions over handshakes. BAD: "tell me when ready and wait until I confirm the
    machine is clear". GOOD: "start when no competing cargo/gov certification process is running and load satisfies
    the stated condition; otherwise wait, re-check periodically, and proceed automatically once satisfied".'
  - 4. Worker state must distinguish at least RUNNING_COMPUTE, RUNNING_TOOL, BLOCKED_RESOURCE, BLOCKED_ON_COORDINATOR,
    BLOCKED_ON_OWNER, COMPLETE.
  - 5. BLOCKED_ON_COORDINATOR must be surfaced immediately and must always carry why it is blocked, what response
    is awaited, the timeout and the default action. It must never be reported merely as running.
  - 6. Rising elapsed time with unchanged status or progress is a stall signature. Investigate rather than assume
    progress.
  - 7. Never report a worker as still running from a stale observation. Check current process/worker state AT THE
    TIME of any liveness statement to the owner.
  - 8. For machine-resource waits, workers normally evaluate the condition themselves rather than wait for a coordinator
    message.
  - '3a. COROLLARY, added 2026-09-23 after three wait-loops spun for 10 hours: a self-evaluable precondition must
    not be able to MATCH ITSELF. `until ! pgrep -f <pattern>` inside a shell whose own command line contains <pattern>
    never exits. Exclude the checking process (grep -v $$, a captured PID, a marker file, or wait on a known child),
    and give every wait-loop a bounded iteration count with a defined action on exhaustion -- an unbounded until-loop
    is a handshake with the kernel and earns the same discipline as rule 2.'
  - '7a. COROLLARY: liveness monitoring must cover the TASK REGISTRY, not only the machine. A sleeping waiter is
    invisible to load average and ps -- it looks exactly like a healthy idle machine. A task producing no output
    for far longer than its expected runtime is a stall regardless of what the machine shows.'
  - '9. OD-P2-08: prefer tracked PID/process-group state over process-name regex; where pattern matching is unavoidable,
    PROVE the waiter cannot match itself.'
  - '10. OD-P2-08: maintain last_progress_at or equivalent freshness evidence, and reconcile the task registry against
    live process state, output freshness AND worker report state.'
  - '11. OD-P2-08: worker states must distinguish RUNNING_COMPUTE, RUNNING_TOOL, BLOCKED_RESOURCE, BLOCKED_ON_COORDINATOR,
    BLOCKED_ON_OWNER, STALLED, COMPLETE. A sleeping waiter is not productive work.'
  v8_3_disposition: IMPLEMENTED_DURING_PHASE_2
  confirmed_active_before: the A+C implementation dispatch, as the owner required in section 1 rule 10
test_execution_policy:
  adopted: 2026-09-22, from P2-PERF-0001 recommendation R1 (release/orchestration/phase-2/PERFORMANCE_DIAGNOSTIC.md,
    commit 651ceb3)
  rule: never pass --test-threads=1 to the certification suite; run it machine-exclusive at libtest default parallelism
  basis: 'tests/certification has zero #[serial], no serial_test dependency, zero env::set_var/remove_var and zero
    set_current_dir; every variable is set per-Command; scratch roots are PID+nanosecond unique and XDG_STATE_HOME
    is per-root-hash. P2-AR-0072 already ran 231/0 at default parallelism.'
  cost_of_the_old_practice: 35.09 s/test single-threaded versus 4.30-5.39 s/test at default parallelism -- about
    7x, roughly 2 hours per full run, for no isolation benefit
  what_serialised_means_here: ONE SUITE AT A TIME ON THE MACHINE, default threads intact -- never tests forced serial
    within a suite. The historical spurious failures (203/7 on a tree that was really 210/0) were cross-suite machine
    overload, a different problem with a different fix.
  where_single_threading_is_genuinely_required: the independent verifiers' held-out harnesses, which do mutate process-global
    env (release/verification/.../heldout-tests/mint.rs:138-141 sets XDG_STATE_HOME and HOME). That constraint must
    not migrate back to the certification suite.
  recording_requirement: every run record that reports a suite figure must also state the --test-threads value and
    the machine load. A test result without its concurrency conditions is unfalsifiable -- P2-AR-0075 omitted both
    and its 2,742 s needed a CPU-conservation argument to decode.
  planning_figure: 'MEASURED 2026-09-22 on a verified-quiet machine at default threads: 252 tests, 2,966 s wall
    (49m26s), 38,971 CPU-s, P=12.95 effective cores (65% of 20). The suite costs about 50 minutes on this tree.
    The earlier ~1,460 s (24 min) estimate was derived from a CPU calibration that the direct measurement falsified
    by ~2.4x, and is withdrawn.'
  superseded_reconciliation: 'P2-AR-0075''s 2,742 s was NOT an outlier and needed no explanation: at the measured
    W its P is about 12, indistinguishable from this run''s 12.95. The earlier ''~3 test streams / reduced --test-threads''
    account is retracted. What survives unaffected is the --test-threads=1 category error and its ~7x cost.'
  hardware: 'the guest topology is SYNTHETIC and neither published number is right. /proc/cpuinfo carries the hypervisor
    flag and shows a perfectly uniform 10 cores x 2 threads (siblings 0-1, 2-3 .. 18-19), but the real i7-12700F
    is a hybrid Alder Lake part: 8 P-cores (2 threads each) + 4 E-cores (1 thread each) = 12 PHYSICAL cores, 20
    threads. A genuine 12700F could never show uniform SMT across all cores because the E-cores have none, so WSL2
    is flattening a heterogeneous package, and the vCPU-to-host mapping is not observable from inside the guest.
    Consequences: W/20 = 1,949 s (32.5 min) is a bound SMT cannot reach, not a floor; measured P=12.95 is 65% of
    20 logical but ~108% of 12 physical, and since Linux fills idle physical cores before doubling onto siblings,
    essentially every physical core was busy -- the machine was near saturation, NOT a third idle. Modelled achievable
    floor ~2,400-2,600 s (40-43 min), NOT MEASURED. Perfect scheduling is therefore worth ~7-10 minutes, not 17.5.'
  evidence_hygiene_finding: 'P2-AR-0067.run.yaml records an orchestrator check of "cargo test --test certification
    225/0 (1213 s)" as a single full-suite run. At the measured 154.6 CPU-s/test that requires P=28.7 effective
    cores against a hard ceiling of 20, so as recorded it cannot have happened. Not chunked (only P2-AR-0054 records
    chunking). Candidates: mis-transcription, a partial or differently-scoped run, or a genuinely cheaper tree --
    the record carries no thread count, load or command line and cannot distinguish them. DISCLOSED TO THE FORMAL
    VERIFIER. Those figures must not be used as baselines. The orchestrator wrote that record, and it fails the
    standard the orchestrator adopted today.'
  floor: at 100% utilisation of 20 cores the floor is ~1,950 s (32 min), so no scheduling change alone gets the
    full suite below about half an hour. Optimisation (dev-profile opt-level, R3) is therefore the only remaining
    lever on this figure, not merely the largest.
