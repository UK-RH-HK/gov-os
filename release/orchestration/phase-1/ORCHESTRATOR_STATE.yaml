forbidden_until_gate:
  - action: runtime, kernel, CLI, migration or test implementation of RoT-1
    until: GATE-OWNER-D0008
  - action: describing D-0008 or ARCH-0002 as active, approved or accepted
    until: GATE-OWNER-D0008 (answered with approval)
  - action: soliciting owner answers to OP-1..OP-7
    until: GATE-ARCH-ACCEPT
  - action: reconstructing or inventing Capability Acceptance Contract content
    until: never (owner upload only, GATE-OWNER-CAC-UPLOAD)
  - action: orchestrator or builder issuing ROOT_OF_TRUST_ARCHITECTURE_ACCEPTED or OS_RELEASE_CANDIDATE_ACCEPTED/REJECTED
    until: never
  - action: exposing held-out verifier tests to a builder
    until: that verifier's verdict is committed
  - action: modifying release/verification/**, release/root-of-trust/*-review*/**, release/releases/** or prior kernel payloads
    until: never
  - action: prompt-3 certification, stable release push, phase 2
    until: never within Phase 1
  - action: writing held-out verifier test content, in-progress verdicts or unreviewed findings into the user auto-memory (its index is visible to every subagent)
    until: never
  - action: any role agent reading, listing or searching session/agent transcripts or task-output files (/tmp/claude-1000/<project>/*/tasks/, ~/.claude/projects/)
    until: never (disclosed by AR-0015; every role prompt and template carries the prohibition)
  - action: running a builder concurrently with an independent verifier whose held-out tests are not yet committed with a verdict
    until: that verifier's verdict is committed
