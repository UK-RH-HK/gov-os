rebase_context: >-
  OWNER-DIRECTIVE-0004 adopts D-0009 and the separate ARCH-0003 Signed Release Root lineage. CP-1/RoT-1 remains frozen
  at rejected revision 7 with no Revision 8. D-0007 remains ACTIVE. The current action is a fresh independent R0
  architecture review under the frozen boundary; implementation, key ceremony, R1 and D-0007 transition are not authorised.

current_prohibitions:
  - action: runtime, kernel, CLI, capability, migration or test implementation of ARCH-0003
    until: GATE-R0-ARCH-ACCEPT is satisfied and the owner separately authorises R1 implementation
  - action: creating RoT-1 revision 8 or resuming the CP-1 repair loop
    until: never under OWNER-DIRECTIVE-0004
  - action: activating or mutating D-0008/ARCH-0002, or rewriting RoT-1/review evidence
    until: never under OWNER-DIRECTIVE-0004
  - action: superseding or amending D-0007
    until: ARCH-0003 passes R0 and a later explicit transition record authorises the exact change
  - action: treating R1 implementation detail, R2 certification evidence or R3 high-assurance criteria as an R0 blocker
    until: an exact R0 normative source applies or the product owner adopts the expansion
  - action: selecting constitutional expiry durations
    until: the applicable operational profile is selected and qualified at the proper later gate
  - action: production private-key creation or key ceremony
    until: GATE-OWNER-KEY-CEREMONY at R2
  - action: reconstructing or inventing Capability Acceptance Contract content
    until: never (owner upload only, GATE-OWNER-CAC-UPLOAD)
  - action: orchestrator or builder issuing an independent R0/R1/R2 verdict
    until: never
  - action: exposing held-out verifier tests to a builder before verdict
    until: that verifier's verdict is committed
  - action: modifying release/verification/**, release/root-of-trust/*-review*/**, release/releases/** or prior kernel payloads
    until: never
  - action: writing held-out verifier test content, in-progress verdicts or unreviewed findings into user auto-memory
    until: never
  - action: any role reading/listing/searching session or agent transcript/task-output stores
    until: never

historical_cp1_forbidden_until_gate:
  - action: runtime, kernel, CLI, migration or test implementation of RoT-1
    until: GATE-OWNER-D0008
  - action: describing D-0008 or ARCH-0002 as active, approved or accepted
    until: GATE-OWNER-D0008 (answered with approval)
  - action: soliciting owner answers to OP-1..OP-7
    until: GATE-ARCH-ACCEPT
  - action: reconstructing or inventing Capability Acceptance Contract content
    until: never (owner upload only, GATE-OWNER-CAC-UPLOAD)
  - action: orchestrator or builder issuing ROOT_OF_TRUST_ARCHITECTURE_ACCEPTED or OS_RELEASE_CANDIDATE_ACCEPTED/REJECTED
    until: never
  - action: exposing held-out verifier tests to a builder
    until: that verifier's verdict is committed
  - action: modifying release/verification/**, release/root-of-trust/*-review*/**, release/releases/** or prior kernel payloads
    until: never
  - action: prompt-3 certification, stable release push, phase 2
    until: never within Phase 1
  - action: setting D-0008 status ACTIVE, human_approved true, or superseding D-0007
    until: GATE-OWNER-D0008 formal ratification of an independently accepted D-0008 package (owner, OWNER-DESIGN-REQUIREMENTS-0001)
  - action: reopening owner-selected parameters of OWNER-DESIGN-REQUIREMENTS-0001 (OP-1..OP-16, first-contact composer, environment manifest, certified scope)
    until: an independent reviewer identifies a genuinely new owner trade-off (then raise it to the owner)
  - action: implementing excluded paths (witness service, helper-machine or script admission, OP-13(c) either, platform package signing root, Mode B, clock/grace trust, unanchored governed mutation) in the initial certified profile
    until: a separately governed and verified later release
  - action: extending or weakening the 24-hour trust-state freshness for first admission/install/update, a longer freshness window for offline media, or any clock-based grace period
    until: never within the initial certified profile (OWNER-DESIGN-REQUIREMENTS-0002 OT-1)
  - action: any interim certification exception, fallback to trusting the upstream compiler archive, or counting distributions/mirrors of one compiler lineage as toolchain independence
    until: never within the initial certified profile (OWNER-DESIGN-REQUIREMENTS-0002 OT-2)
  - action: creating RoT-1 revision 8, or spawning any architecture author, specialist or synthesis architect after the revision-7 verdict
    until: meta-architecture review outcome and explicit owner instruction (OWNER-DIRECTIVE-0003)
  - action: routing revision-7 findings into a repair or revision loop, or attempting to solve new findings
    until: meta-architecture review outcome and explicit owner instruction (OWNER-DIRECTIVE-0003)
  - action: implementation (runtime/kernel/CLI), key ceremony, Capability Contract stages, Prompt 2, or formal D-0008 activation, even if revision 7 is accepted
    until: meta-architecture review outcome and explicit owner instruction (OWNER-DIRECTIVE-0003)
  - action: opening new owner options
    until: meta-architecture review outcome and explicit owner instruction (OWNER-DIRECTIVE-0003)
  - action: writing held-out verifier test content, in-progress verdicts or unreviewed findings into the user auto-memory (its index is visible to every subagent)
    until: never
  - action: any role agent reading, listing or searching session/agent transcripts or task-output files (/tmp/claude-1000/<project>/*/tasks/, ~/.claude/projects/)
    until: never (disclosed by AR-0015; every role prompt and template carries the prohibition)
  - action: running a builder concurrently with an independent verifier whose held-out tests are not yet committed with a verdict
    until: that verifier's verdict is committed
