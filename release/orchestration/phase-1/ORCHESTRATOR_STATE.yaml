r1_blocker_class_history:
  convergence_rule: >-
    If THREE consecutive R1 iterations introduce materially NEW blocker classes instead of closing the existing class,
    STOP with PHASE_CONVERGENCE_ESCALATION_REQUIRED and produce a root-cause/meta-review package.
  iterations:
    - {iteration: 1, verifier: AR-0027, candidate: srr1-r1-candidate-1, classes: [BC-R1-1], materially_new: [BC-R1-1], closed: [], note: guard DECISION shape - deny-list instead of class control}
    - {iteration: 2, verifier: AR-0029, candidate: srr1-r1-candidate-2, classes: [BC-R1-2], materially_new: [BC-R1-2], closed: [BC-R1-1], note: guard COVERAGE; assigned class fully closed}
    - {iteration: 3, verifier: AR-0031, candidate: srr1-r1-candidate-3, classes: [BC-R1-3, residual of BC-R1-2], materially_new: [BC-R1-3], closed: [BC-R1-2 for bullets 2/3/4/6 only], note: BC-R1-3 is undetermined-subject fail-open; AR31-B1 is a residual of BC-R1-2 at bullet 7}
  consecutive_new_class_count: 3
  escalation_fired: true
  escalation_resolved_by: OWNER-DECISION-0008 (Option B)
  superseding_convergence_policy: >-
    For the remainder of R1, OWNER-DECISION-0008 replaces the three-iteration rule. Residual defects within the
    already-identified classes BC-R1-1, BC-R1-2 and BC-R1-3 repair and re-verify AUTOMATICALLY for as many cycles as
    needed, with no owner interruption. A genuinely NEW material blocker class, or any architecture/owner decision,
    STOPS the loop and escalates IMMEDIATELY - one occurrence is enough, not three.
  escalation_token: PHASE_CONVERGENCE_ESCALATION_REQUIRED
  escalation_package: release/orchestration/phase-1/ESCALATION/PHASE-CONVERGENCE-ESCALATION-R1.md
  escalation_package_sha256: 82d87c963c1bf423e181e006c157d4ded9171ade9683f24223c22d602b46d829
  escalation_honesty_note: >-
    The orchestrator pre-committed, before iteration 3 ran, to stopping if a third materially new class appeared, and
    to not rationalising one away. AR-0031 labelled AR31-B2 materially new. The nuance that argues for continuing -
    AR31-B2 was self-disclosed by repair 2, inherited from repair 1, present in candidates 1 and 2, and is two lines to
    fix - is recorded IN the escalation package for the owner to weigh, not used by the orchestrator to cancel its own
    commitment. The convergence decision is the owner's.
  iterations_that_failed_to_close_their_assigned_queue: 0
  escalation_reading: >-
    The protocol escalates when three consecutive iterations introduce materially new blocker classes INSTEAD OF closing
    the existing class. Iteration 2 did close its assigned class completely - AR27-B1, N1, N2 and N4 are all confirmed
    closed by an independent verifier who could not break the allow-list across 63 near-miss forms - so the literal
    "instead of" condition is not met. The orchestrator nonetheless treats the new-class count as the operative signal:
    if R1 verification iteration 3 produces another materially new blocker class, STOP with
    PHASE_CONVERGENCE_ESCALATION_REQUIRED and produce the root-cause/meta-review package, even though each cycle closed
    its assignment. Two successive classes one level apart (guard decision, then guard coverage) is the pattern the rule
    exists to catch, and the orchestrator will not rationalise a third away.

