owner_requirements:
  OWNER-DESIGN-REQUIREMENTS-0001:
    record: release/orchestration/phase-1/GATES/OWNER-DESIGN-REQUIREMENTS-0001.md
    direction:
      selected_design_target: Option C — RoT-1
      not_supported_production_alternatives:
      - A
      - B
      - D
      - E
      - F
      note: retain useful TUF/transparency/reproducible-build-inspired mechanisms; design direction, not activation
    OP-1..OP-16:
      OP-1:
        keys: 3
        threshold: 2-of-3
        custodial_roles:
        - Product Owner Root Custodian
        - Independent Security Root Custodian
        - Recovery Root Custodian
        requirements:
        - physically separate custody
        - offline hardware-backed signing devices
        - root private keys never in repository, CI, cloud build environment or ordinary development workstation
        - no single custodian can exercise root authority
        - root ceremony for Trust Policy/root-lineage changes, not ordinary releases
        unappointed_custodians: preserve as required custodial ROLES; do not collapse into one person's ordinary workstation
      OP-2:
        selection: (b) delegated registration quorum
        threshold: 2-of-3
        keys: single-purpose hardware-backed registration keys delegated by the root
        root_keys: offline for normal release operation
        purpose_separated_from:
        - candidate signing
        - certification
        - trust state
        - revocation
        - retrieval-profile signing
        no_single_registration_key_registers_production: true
      OP-3:
        selection: Mode A — always_gate
        local_human_trust_gate_for:
        - adoption
        - production installation
        - update
        - rollback
        - downgrade/recovery where policy requires
        certification_never_silently_removes_gate: true
        repository_gate_records: requests only; cannot authorise trust operations
        mode_b: not implemented in the initial certified production profile
      OP-4:
        separate_candidate_key: YES — single-purpose, evaluation candidates only; cannot create production release authenticity/certification
        registration: 2-of-3 dedicated registration custodians (OP-2)
        production_release_artifact_final_identity: threshold protection; no threshold-1 key may by itself mint a production
          gov binary; at least 2 independent authorised signatures consistent with the accepted revision-7 trust chain
        trust_state: 2-of-3 dedicated trust-state authority
        certification: two independently produced verifier/certifier records (OP-8)
        revocation: 2-of-3 dedicated revocation authority, with root-threshold emergency recovery/rotation where the architecture
          specifies
        retrieval_profile: separate signing purpose; cannot sign kernel/release/trust-state material
        witness: none in the initial certified profile (OP-7 anchored-only)
        purpose_separation: domain-separated and mechanically enforced for every key/statement purpose
      OP-5:
        metadata_age_warning_days: 30
        informational_only: true
        constraint: never silently changes security decisions or becomes a hidden clock-based trust root
      OP-6:
        selection: (a) once per machine
        detail: after first admission the operator confirms the expected trust-root/lineage fingerprint once per verifier
          trust store/machine; not at every gov init; root-lineage change requires re-admission/reconfirmation
      OP-7:
        selection: (a) anchored only
        witness_service: none
        workstation_anchor_max_validity: 90 days
        ci_admission_image_anchor_max_validity: 7 days
        production_install_update_rollback_fresh_anchor_max_age: 24 hours
        on_anchor_expiry: governed mutation degrades to C0/read-only diagnostics until re-anchored
        invariants:
        - no stale/unanchored state presented as current
        - locally retained high-water trust state never moves backwards during re-admission
        - 'honest statement: a machine that never received newer metadata cannot be claimed to know it'
        excluded:
        - OP-7(b)
        - OP-7(c)
        - OP-7(d)
      OP-8:
        verification_records_required: 2
        detail: genuinely separate verifier executions/evidence, not two signatures over one self-produced conclusion; neither
          verifier alone creates production eligibility
      OP-9:
        selection: (b) 2-of-3 plus (d) registration includes final binary digests
        requirements:
        - three eligible independent reproducer roles
        - any two matching reproducible results required
        - final binary/content digests part of the release registration
        - mismatched reproduction blocks production registration
        - reproduction evidence identifies exact source, toolchain and build-environment identities
      OP-10:
        selection: (b) diverse, independently bootstrapped compiler agreement
        requirements:
        - certified release does not rely solely on an upstream binary compiler archive as root of build correctness
        - independence defined by provenance/build lineage, not filenames or mirrors
        - architecture establishes how compiler/toolchain identities become registered inputs
        - a target that cannot satisfy this is not certified (no silent fallback to OP-10(a))
      OP-11:
        selection: (b) raise the minimum release sequence at every security-relevant content change
        requirements:
        - older authentic release stays historically authentic but ineligible where the minimum advanced
        - no grace periods/clocks in the initial certified profile
        - repository/transport never chooses among eligible release versions on behalf of the local trust authority
      OP-12:
        selection: (a) separate compiled program, registered and reproduced
        admitter_properties:
        - not gov validating itself
        - smaller fixed responsibility
        - authenticated under the root/first-contact trust chain
        - independently reproduced
        - verifies and admits the first gov binary
        - cannot be replaced by an arbitrary repository copy
        excluded:
        - helper-machine admission
        - script-based admission
      OP-13:
        selection: (b) two owner-controlled sources under genuinely separate custody; both must match
        initial_channels:
        - authenticated private release channel
        - separately controlled immutable/offline release mirror/media channel
        requirements:
        - byte-identical first-contact/admitter/trust-base material
        - mismatch fails closed
        - neither source alone sufficient
        - one trust-state publisher must not compose the first-contact code carried by both channels
        excluded:
        - OP-13(c) either suffices
        - platform/OS package manager as an independent root
        - OP-13(d) as the sole generic admission route
      OP-14:
        selection: (b) all admission records expire
        validity: OP-7 limits
        re_admission: preserves and enforces the stored trust high-water mark; never resets or lowers revocations, root versions,
          trust-state sequence, minimum eligible release, security floors
      OP-15:
        selection: (a) read-only only
        allowed: bounded diagnostics sufficient for recovery
        forbidden:
        - governed mutation
        - installation/update
        - policy enforcement relied upon for production work
        - release/certification operation
        recovery: via a newly admitted eligible binary
      OP-16:
        selection: (b) matching builds from at least two genuinely independent supplier classes
        independence_by_provenance:
        - base OS/build image lineage
        - package source
        - build-system provenance
        - signing/control infrastructure
        not_independent: distribution label alone
        requirements:
        - static/self-contained linking wherever practical
        - narrow certified platform/target set acceptable rather than weakening the rule
        - a target is not CERTIFIED until its independent build-environment requirements are satisfied
    first_contact_composer_signer:
      not: the ordinary trust-state publisher
      approved_by: root threshold 2-of-3 after independent reproduction/verification appropriate to the admitter
      constraint: ordinary release/trust-state keys may not redefine the first-contact root
    environment_manifest:
      single_author_authoritative: false
      generation: deterministic from measured build inputs/environment and content identities
      authoritative_only_when:
      - required independent build/reproducer evidence agrees with it
      - delegated registration quorum 2-of-3 signs/registers that exact manifest/content identity
      not_independent: a different label naming the same upstream/provenance chain
    initial_certified_profile:
      supports_only:
      - D-0008 Option C / RoT-1
      - OP-2(b)
      - OP-3 Mode A
      - OP-7(a)
      - OP-10(b)
      - OP-12(a)
      - OP-13(b)
      - OP-16(b)
      excluded:
      - witness service
      - helper-machine admission
      - script-based certified admission
      - OP-13(c) either suffices
      - platform package signing as an alternate independent root
      - Mode-B no-human-gate updates
      - clock/grace-period trust
      - unanchored governed mutation
      requirements:
      - keep unsupported paths out of the certified executable surface where practical; no dormant combinations
      - extensible later through a separately governed/verified release
      - prefer a small number of reproducible/static targets; certify further Windows/macOS/Linux targets individually when
        their requirements are satisfied; never weaken the trust model for platform breadth
  OWNER-DESIGN-REQUIREMENTS-0002:
    record: release/orchestration/phase-1/GATES/OWNER-DESIGN-REQUIREMENTS-0002.md
    OT-1:
      freshness_rule: do not extend or weaken the 24-hour freshness requirement for first admission; no clock-based grace-period
        exception
      A_immutable_first_contact_material:
        sources: both OP-13(b) channels independently provide matching immutable material; one channel may be offline immutable
          media under separate custody
        establishes:
        - root lineage
        - trust-root fingerprints/identity
        - admitter identity and digest
        - Trust Base Manifest identity
        - compiled/bootstrap policy identity
        - other immutable first-contact artefacts defined by the accepted architecture
        offline_medium_role: second independent source of identity/authenticity, not a source of indefinite trust-state freshness
      B_current_trust_state:
        rule: remains subject to OP-7(a)
        production_admission_install_update:
        - trust-state anchor satisfies the existing 24-hour freshness requirement
        - offline media receives no special longer freshness window
        - stale trust state on otherwise authentic media cannot become current because the medium is trusted
        - the machine's previously known trust high-water can never be lowered
        if_fresh_state_unavailable:
        - first-contact immutable material may still be inspected/validated
        - machine operates only at the architecture's bounded diagnostic/bootstrap level
        - must NOT complete governed production admission/install or enter C1-C3 based on stale state
      summary: offline source establishes independent first-contact identity; freshness is a separate property and remains
        fail-closed
      if_immutable_material_needs_freshness: distinguish explicitly from mutable trust-state freshness rather than weakening
        OP-7
    OT-2:
      certification: no interim certification exception; all targets NOT CERTIFIED until the OP-10(b) compiler/toolchain assurance
        criterion is evidenced
      no_fallback: do not silently fall back to trusting the official upstream compiler archive
      security_objective: prevent a compromised compiler/toolchain from reproducing malicious behaviour through otherwise
        reproducible builds (trusting-trust class)
      evidence_route_techniques:
      - independently derived compiler provenance
      - diverse double compilation or an equivalent trust-breaking procedure
      - independent bootstrap chains where feasible
      - cryptographically registered toolchain inputs
      - multiple independent builders/reproducers
      - reproducible final artefacts
      - provenance evidence that purported diversity is genuine, not different labels over the same bootstrap lineage
      not_independence:
      - two different distributions
      - two mirrors of the same compiler binary
      not_a_ritual: do not require byte-identical output from fundamentally different compilers merely as a ritual if that
        is not the correct security test
      acceptance_condition: prove with independent evidence that the final trusted compiler/binary chain is not solely dependent
        on an unaudited upstream compiler binary being honest
      unachievable_target_label: NOT CERTIFIED — TOOLCHAIN ASSURANCE INCOMPLETE
      phase_1_architecture_acceptance: acceptable with no production-CERTIFIED platform, provided the certification criterion
        is explicit, executable/testable and non-circular
  OWNER-DIRECTIVE-0003:
    record: release/orchestration/phase-1/GATES/OWNER-DIRECTIVE-0003-FREEZE-ROT-LOOP.md
