findings:
  - id: SRR-B1
    severity: INFO
    title: >-
      Release floors are advanced only from a verified signed release, so a machine that has never been provisioned
      enforces no release floor and makes no authenticity claim. Stated as an implementation choice with its residual.
    path: release/root-of-trust/signed-release-root-v1-r1-build/00-BUILD-REPORT.md
  - id: SRR-B2
    severity: INFO
    title: >-
      The protected-state override is refused on a provisioned machine, but a process running as the owner can still
      relocate HOME/XDG_STATE_HOME and move the default. ARCH-0003 section 1 places that process inside the trusted
      boundary; recorded as a residual rather than concealed.
    path: release/root-of-trust/signed-release-root-v1-r1-build/00-BUILD-REPORT.md
  - id: SRR-B3
    severity: INFO
    title: >-
      Expiry is a lexicographic comparison of RFC-3339 UTC strings at second precision against the declared local
      clock. Correct for the emitted format; a producer using another offset or precision would need a real date parse.
    path: release/root-of-trust/signed-release-root-v1-r1-build/00-BUILD-REPORT.md
  - id: SRR-B4
    severity: INFO
    title: >-
      Delegated signed targets are verified and enforced, but publisher-side tooling to issue one is not built, so a
      privileged remotely acquired capability currently has no admission path. Deliberate scope limit, stated openly.
    path: release/root-of-trust/signed-release-root-v1-r1-build/00-BUILD-REPORT.md
  - id: SRR-B5
    severity: INFO
    title: >-
      tests/certification/common.rs now gives each scenario its own XDG_STATE_HOME so each simulated machine has its
      own protected state. Test isolation for a machine-scoped control; no assertion was weakened and no pre-existing
      test was modified to make it pass.
    path: release/root-of-trust/signed-release-root-v1-r1-build/00-BUILD-REPORT.md
