role: verifier-d
objective: >-
  Fresh independent R1 verification (iteration 4) of the Signed Release Root v1 candidate srr1-r1-candidate-4
  against the R1 section of the frozen acceptance boundary, with independently authored held-out tests, after the
  owner-authorised structural repair (AR-0032, OWNER-DECISION-0008) claimed to close AR31-B1 and AR31-B2, to
  derive section 6 coverage from the product rather than assert it, and to make any no-primitive-exists claim
  falsifiable by the product's own suite.
agent_model: claude-opus-5
independence_statement: >-
  This run is not AR-0027, AR-0029 or AR-0031, and is not AR-0026, AR-0028, AR-0030 or AR-0032. It authored none
  of the implementation, none of the three repairs, none of the three prior verifications and none of the
  architecture. It authored all 31 held-out scenarios itself, in a standalone crate (srr-heldout-ar0033) outside
  the product tree and outside its cargo workspace, depending on gov-runtime by path, so verification required no
  edit to any product file. The harness in common.rs was written from an independent reading of
  runtime/src/srr/breakglass.rs, runtime/src/srr/state.rs and runtime/src/srr/present.rs and shares no source
  line with AR-0027's forge.rs, AR-0029's mint.rs or AR-0031's bench.rs, and none with
  tests/certification/section6.rs, which is the material under test. The derivation mechanism was re-implemented
  twice independently - once in Rust with a brace-counting function splitter deliberately different from the
  candidate's indentation splitter, and once in Python - and both reproduce the candidate's census exactly. NO
  DELEGATION - every command in this verification was run by this agent; no sub-agent was spawned and no
  sub-agent result was relied upon. All three prior held-out suites were copied byte-identically (cmp verified,
  17 of 17 files) and re-run unmodified; only each Cargo.toml dependency path was retargeted by symlink. Read -
  the HO-0033 handoff, the frozen R0/R1/R2/R3 acceptance boundary, OWNER-DECISION-0006, -0007 and -0008, the
  Capability Acceptance Contract v3, the AR-0032 repair report and its evidence including DERIVATION.md,
  AR-0031's blocking findings and later-lifecycle conditions, the prior verification evidence and held-out test
  sources, the product source under runtime/ and cli/, the certification suite, and git history at 30aa98a,
  cf52741 and 84b9ee8. Prior evidence was read for orientation and then verified rather than adopted. Not read -
  any session or agent transcript, any task-output store, any user auto-memory. The product owner was not
  contacted. No fix was implemented and no product source was modified.
