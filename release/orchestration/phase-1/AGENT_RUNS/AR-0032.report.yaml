unresolved:
  - >-
    The derivation is syntactic. It will not see an implementation that reaches a §6 effect without using any of
    the product's own primitives — a hand-built path plus std::fs::write, for instance. evidence/DERIVATION.md §4
    lists nine limits and §5 lists what would defeat it. This is much less likely than the three enumerations that
    preceded it and is NOT impossible; no universal claim is made here and the suite makes none.
  - >-
    Bullet 7's universality is a property of the CLI boundary. Every gov command carries the marking because run()
    is called once and its value reaches stdout through one envelope. An in-process embedder of gov_runtime gets it
    only from the four surfaces that carry it in their own payload; a fifth in-process reporting function written
    tomorrow would not, and nothing in the suite would catch that.
  - >-
    Acceptance markers are as load-bearing as signatures and are less well defended. A marker widened to something
    common would accept everything and nothing in the suite would notice: the positive control proves acceptance
    matches an enforced implementation, not that it fails to match an unenforced one.
  - >-
    records::save_record is the record-write sink, and I did not prove it is the only writer of a governed record
    file. A function that hard-codes spec/decisions/HDG-0001.yaml and calls write_text matches no marker. None
    exists today; nothing structural prevents one.
  - >-
    cit::take_snapshot is the single derivation exemption, with its reason in SECTION_6_DERIVATION_EXEMPTIONS. I
    read it and believe it; an exemption is the one place a wrong judgement passes quietly, so a verifier should
    read it too.
  - >-
    A file-level grep census over product source will now also count breakglass.rs for any primitive named in
    SECTION_6_SIGNATURES, because the signatures are string literals naming the product's own primitives. Such a
    census must exclude the table.
  - >-
    AR-0031's hx_a::a5, hx_a::a8, hx_c::c2 and hx_c::c3 still fail. Each fails at a location assertion rather than
    at its property; every property is closed and measured, and a8's four OBSERVED conditions were each verified
    individually. Full explanation in evidence/HELD-OUT-FLIPS.md.
  - >-
    Behaviour change worth a verifier's attention: gov gate present calls authority::require and save_record and
    NOT control::guard_write, so on candidate 3 it mutated a governed Human Gate record below floor. It is now
    refused at the record-write sink.
  - >-
    R2-lifecycle AR31-N6, AR29-N2, AR27-N3, N5, N6 and N7 remain carried and untouched.
  - >-
    NEW_MATERIAL_CLASS_SUSPECTED — none. Both items the derivation surfaced rather than handed to this run
    (AR32-D1, AR32-D2) sit inside BC-R1-2, which OWNER-DECISION-0008 authorises to repair automatically. Both are
    closed and both are reported above rather than absorbed silently.
  - >-
    NEW_OWNER_DECISION_REQUIRED — none. Everything implements a policy the owner already decided in
    OWNER-DECISION-0006 §6. No owner record, frozen-boundary content or normative source was amended.
recommended_next_action: >-
