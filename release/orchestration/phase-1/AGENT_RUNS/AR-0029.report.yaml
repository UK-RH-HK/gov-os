  R0/R1/R2/R3 acceptance boundary, 00-ARCHITECTURE.md, ARCH-0003.yaml, OWNER-DECISION-0005, OWNER-DECISION-0006,
  OWNER-DECISION-0007, OWNER-DIRECTIVE-0004, Capability Acceptance Contract v3, the AR-0026 build report, the
