unresolved:
  - >-
    guard_effect fails open when resolve_state_root() errors, exactly as guard_light has since repair 1. That is
    the "no protected state on this machine" case; changing it would mean changing machine-state root resolution,
    which OWNER-DECISION-0007 §1 puts out of scope. Inherited, not introduced.
  - >-
    §6 bullet 7 (presenting a below-floor release as current) has no sink because it has no primitive. I verified
    gov trust status, gov trust break-glass and gov recover, and AR29-C1 closed the case where they disagreed with
    the guard, but I did not exhaustively audit every other JSON surface for a field readable as "current and
    fully trusted" without the marking beside it.
  - >-
    §6 bullet 5's sink is the acquisition decision (plugins::guard_acquisition), not a byte-installing primitive.
    It has one caller today; tools::install reaches the same effect through the operation-level guard only. A
    future path that installs a privileged capability without consulting guard_acquisition would miss the
    effect-level point. Weaker than the bullet 2 and 4 sinks, and stated as such.
  - >-
    ho_b_coverage::b3's printed §6 census is stale after this repair and needs re-deriving by the next verifier.
  - >-
    R2-lifecycle AR29-N2, AR27-N3, AR27-N5, AR27-N6, AR27-N7 remain carried and untouched.
  - >-
    NEW_OWNER_DECISION_REQUIRED — none. Both blocking findings implement a policy the owner already decided in
    OWNER-DECISION-0006 §6; no owner decision was required and none was invented.
recommended_next_action: >-
