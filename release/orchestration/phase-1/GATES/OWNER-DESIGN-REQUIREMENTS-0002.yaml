resolves:
- OT-1
- OT-2
OT-1:
  freshness_rule: do not extend or weaken the 24-hour freshness requirement for first admission; no clock-based grace-period
    exception
  A_immutable_first_contact_material:
    sources: both OP-13(b) channels independently provide matching immutable material; one channel may be offline immutable
      media under separate custody
    establishes:
    - root lineage
    - trust-root fingerprints/identity
    - admitter identity and digest
    - Trust Base Manifest identity
    - compiled/bootstrap policy identity
    - other immutable first-contact artefacts defined by the accepted architecture
    offline_medium_role: second independent source of identity/authenticity, not a source of indefinite trust-state freshness
  B_current_trust_state:
    rule: remains subject to OP-7(a)
    production_admission_install_update:
    - trust-state anchor satisfies the existing 24-hour freshness requirement
    - offline media receives no special longer freshness window
    - stale trust state on otherwise authentic media cannot become current because the medium is trusted
    - the machine's previously known trust high-water can never be lowered
    if_fresh_state_unavailable:
    - first-contact immutable material may still be inspected/validated
    - machine operates only at the architecture's bounded diagnostic/bootstrap level
    - must NOT complete governed production admission/install or enter C1-C3 based on stale state
  summary: offline source establishes independent first-contact identity; freshness is a separate property and remains fail-closed
  if_immutable_material_needs_freshness: distinguish explicitly from mutable trust-state freshness rather than weakening OP-7
OT-2:
  certification: no interim certification exception; all targets NOT CERTIFIED until the OP-10(b) compiler/toolchain assurance
    criterion is evidenced
  no_fallback: do not silently fall back to trusting the official upstream compiler archive
  security_objective: prevent a compromised compiler/toolchain from reproducing malicious behaviour through otherwise reproducible
    builds (trusting-trust class)
  evidence_route_techniques:
  - independently derived compiler provenance
  - diverse double compilation or an equivalent trust-breaking procedure
  - independent bootstrap chains where feasible
  - cryptographically registered toolchain inputs
  - multiple independent builders/reproducers
  - reproducible final artefacts
  - provenance evidence that purported diversity is genuine, not different labels over the same bootstrap lineage
  not_independence:
  - two different distributions
  - two mirrors of the same compiler binary
  not_a_ritual: do not require byte-identical output from fundamentally different compilers merely as a ritual if that is
    not the correct security test
  acceptance_condition: prove with independent evidence that the final trusted compiler/binary chain is not solely dependent
    on an unaudited upstream compiler binary being honest
  unachievable_target_label: NOT CERTIFIED — TOOLCHAIN ASSURANCE INCOMPLETE
  phase_1_architecture_acceptance: acceptable with no production-CERTIFIED platform, provided the certification criterion
    is explicit, executable/testable and non-circular
effect_on_review:
- treat OT-1 and OT-2 as resolved owner requirements
- reviewers B, C and synthesis attack the resulting concrete design
- return to the owner only for a genuinely different security/product trade-off, not an implementation difficulty
