    satisfaction_evidence: this record's commit

  - id: GATE-OWNER-R1-BREAK-GLASS-EXIT
    title: Owner question (non-blocking, R1) — what does break-glass exit require?
    status: SATISFIED
    answer: >-
      (b) STRICTER — exit requires a verified authenticated release at or above BOTH the signed minimum secure release
      AND the protected local high-water. Confirms the orchestrator's fail-safe interim; no code change required. It
      supplements OWNER-DECISION-0006 requirement 7, whose floor is necessary but not sufficient.
    answer_record: OWNER-DECISION-0007
    satisfier: product owner
    raised_by: AR-0025 (independent R0 re-reviewer), finding SRR2-R1-C1
    lifecycle: R1
    blocking: false
    question: >-
      Exit from DEGRADED - RECOVERY ONLY currently clears on the signed minimum secure release alone, while "below
      floor" is defined over two floors. Counterexample inside the declared envelope: high-water v6, minimum secure v4,
      only complete local state v5 - break-glass admits v5, exit fires because v5 >= v4, and the marking clears while
      the machine is still below its protected high-water. Does exit require (a) the signed minimum secure release only,
      as OWNER-DECISION-0006 requirement 7 states today, or (b) BOTH that floor and the protected local high-water?
    why_non_blocking: >-
      The ingress itself is authorised, recorded and marked when it occurs, so the R0 guarantee holds; only the
      marking's lifetime is underspecified. The compliant reading is already supported by the architecture text, the
      state is unreachable without owner-controlled break-glass authority, and the clause faithfully transcribes owner
      requirement 7.
    interim_decision_by_orchestrator: >-
      R1 implements the stricter fail-safe reading (b) as ONE isolated policy point, explicitly labelled SRR2-R1-C1 and
      documented so the owner can flip it to (a) with a single change. Recorded as an assumption, not an owner answer.
    satisfied_when: the owner selects (a) or (b); the selection is recorded and the R1 policy point set accordingly
    satisfaction_evidence: release/orchestration/phase-1/GATES/OWNER-DECISION-0007-R1-QUESTIONS.md

  - id: GATE-OWNER-R1-MACHINE-STATE-ANCHOR
    title: Owner adjudication (R0 boundary) — should protected machine state be anchored to a fixed machine-domain path?
    status: SATISFIED
    answer: >-
      NO — keep the current derivation from XDG_STATE_HOME/HOME. The accepted R0 bootstrap/trusted-boundary assumption
      is unchanged, so R0_OWNER_READJUDICATION_REQUIRED is NOT triggered and GATE-R0-ARCH-ACCEPT stands. The residual
      asymmetry is an owner-adjudicated position, not a defect; AR27-OD1 is closed and must not be raised as an R1
      blocker.
    answer_record: OWNER-DECISION-0007
    satisfier: product owner
    raised_by: AR-0027 (independent R1 verifier), finding AR27-OD1
    classification: NEW_OWNER_DECISION_REQUIRED, flagged REQUIRES_R0_OR_OWNER_ADJUDICATION
    blocking_r1_repair: false
    question: >-
      Protected machine state lives under a path derived from XDG_STATE_HOME/HOME. The implementation refuses the
      GOV_MACHINE_STATE_DIR override on a provisioned machine, but an owner-privileged process can achieve the same
      relocation by moving HOME or XDG_STATE_HOME. Should protected machine state instead be anchored to a fixed
      machine-domain path independent of those variables?
    why_owner: >-
      Closing it changes the accepted R0 bootstrap/trusted-boundary assumption, which ARCH-0003 section 1 states and
      which was accepted at R0. It also collides with the certification harness's own isolation mechanism, which relies
      on XDG_STATE_HOME relocation to give each scenario its own machine state. A security-versus-testability trade-off
      reserved to the owner.
    verifier_position: >-
      The current reliance is SOUND and NOT circular - ARCH-0003 section 1 independently disclaims protection from a
      hostile local admin, so the implementation is not vouching for itself. The verifier records the asymmetry rather
      than treating it as a defect, and did not make it a blocking finding.
    must_not: be routed to a bounded R1 repair; a repair role must not change machine-state path resolution
    satisfied_when: the owner decides whether to keep the current derivation or adopt a fixed machine-domain anchor
    satisfaction_evidence: release/orchestration/phase-1/GATES/OWNER-DECISION-0007-R1-QUESTIONS.md

