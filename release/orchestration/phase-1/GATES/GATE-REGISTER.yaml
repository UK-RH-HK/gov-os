  - id: GATE-OWNER-R0-BELOW-FLOOR-RECOVERY
    title: Owner trade-off inside SRR-R0-H1 — below-floor recovery behaviour
    status: SATISFIED
    answer: >-
      (b) BREAK-GLASS — permitted only as an explicit owner-authorised emergency recovery mode, on an authentic
      Governance OS release, under an owner-controlled local/out-of-band authority that repository content, environment
      variables, caller fields, plugins and model output cannot manufacture; durably recorded; machine marked
      DEGRADED — RECOVERY ONLY; the signed floor is never lowered; network access is not the sole authority.
    answer_record: OWNER-DECISION-0006
    satisfier: product owner
    raised_by: AR-0023 (independent R0 reviewer), finding SRR-R0-H1, correction item CD-R0-1
    lifecycle: R0
    question: >-
      For a machine whose only complete local state is below its own protected high-water or signed minimum secure
      release: (a) STRICT — below-floor recovery is always refused and the machine must be re-initialised from an
      authenticated release; or (b) BREAK-GLASS — permitted only under an explicit separately authorised local
      authority that no repository record, environment variable or caller field can manufacture, recorded, and marked
      in the machine's reported state until it returns to an at-or-above-floor release.
    why_owner: >-
      A security-versus-availability product trade-off. Both behaviours are currently consistent with the architecture
      text and they fail in opposite directions. An architecture role must not choose it on the owner's behalf.
    blocks: nothing further; the bounded R0 correction cycle is unblocked
    satisfied_when: the owner selects (a) or (b); the selection is recorded as an owner record and cited by the correction
    satisfaction_evidence: release/orchestration/phase-1/GATES/OWNER-DECISION-0006-BELOW-FLOOR-RECOVERY.md

  - id: OWNER-DECISION-0006
    title: Below-floor recovery — option (b) BREAK-GLASS, authorised and recorded
    status: RECORDED
    satisfier: product owner
    classification: binding owner product/security decision at R0; not an R0 acceptance and not an implementation authorisation
    record_path: release/orchestration/phase-1/GATES/OWNER-DECISION-0006-BELOW-FLOOR-RECOVERY.md
    record_sha256: 903407729327d67c198c9bf97885a936c5601993e16ad76137a3106c5728d1db
    effects:
      - answers GATE-OWNER-R0-BELOW-FLOOR-RECOVERY and unblocks CD-R0-1
      - break-glass requires an authentic Governance OS release; never arbitrary or unsigned code
      - authority must be owner-controlled local/out-of-band; not manufacturable by repo content, env vars, caller fields, plugins or model output
      - entry durably recorded; machine marked DEGRADED - RECOVERY ONLY; signed floor never lowered
      - below-floor forbids normal privileged operation, Human Gate creation/approval, certification, trust-policy mutation, privileged plugin/profile acquisition and floor reset
      - floor rule must govern recovery, rollback and every backward-capable privileged ingress consistently
      - network/GitHub access is not the sole break-glass authority; recovery must work offline
    satisfaction_evidence: this record's commit

  - id: GATE-OWNER-R1-BREAK-GLASS-EXIT
    title: Owner question (non-blocking, R1) — what does break-glass exit require?
    status: OPEN
    satisfier: product owner
    raised_by: AR-0025 (independent R0 re-reviewer), finding SRR2-R1-C1
    lifecycle: R1
    blocking: false
    question: >-
      Exit from DEGRADED - RECOVERY ONLY currently clears on the signed minimum secure release alone, while "below
      floor" is defined over two floors. Counterexample inside the declared envelope: high-water v6, minimum secure v4,
      only complete local state v5 - break-glass admits v5, exit fires because v5 >= v4, and the marking clears while
      the machine is still below its protected high-water. Does exit require (a) the signed minimum secure release only,
      as OWNER-DECISION-0006 requirement 7 states today, or (b) BOTH that floor and the protected local high-water?
    why_non_blocking: >-
      The ingress itself is authorised, recorded and marked when it occurs, so the R0 guarantee holds; only the
      marking's lifetime is underspecified. The compliant reading is already supported by the architecture text, the
      state is unreachable without owner-controlled break-glass authority, and the clause faithfully transcribes owner
      requirement 7.
    interim_decision_by_orchestrator: >-
      R1 implements the stricter fail-safe reading (b) as ONE isolated policy point, explicitly labelled SRR2-R1-C1 and
      documented so the owner can flip it to (a) with a single change. Recorded as an assumption, not an owner answer.
    satisfied_when: the owner selects (a) or (b); the selection is recorded and the R1 policy point set accordingly
    satisfaction_evidence: null

