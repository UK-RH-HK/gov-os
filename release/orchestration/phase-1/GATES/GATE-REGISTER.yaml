    record_path: release/orchestration/phase-1/GATES/OWNER-DECISION-0006-BELOW-FLOOR-RECOVERY.md
    record_sha256: 903407729327d67c198c9bf97885a936c5601993e16ad76137a3106c5728d1db
    effects:
