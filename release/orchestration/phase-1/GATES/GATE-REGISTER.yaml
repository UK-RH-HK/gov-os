# Phase 1 hard gates. A gate advances only when every precondition holds and satisfaction evidence is committed.
# status: NOT_OPEN | OPEN | SATISFIED | REFUSED; owner records use RECORDED.
schema: governance-os.phase-1.gate-register
schema_version: 1
gates:
  - id: GATE-ARCH-ACCEPT
    title: Historical CP-1 / RoT-1 architecture acceptance gate
    status: REFUSED
    last_verdict: ROOT_OF_TRUST_ARCHITECTURE_REJECTED on revision 7 (review 4c7735b)
    disposition: >-
      CP-1 retired as the Phase-1 target by OWNER-DIRECTIVE-0004. Evidence retained; no Revision 8 and no routing into
      the former repair loop.
    satisfaction_evidence: null

  - id: GATE-OWNER-D0008
    title: Historical Human Decision Gate — D-0008 / CP-1
    status: REFUSED
    satisfier: product owner
    disposition: >-
      The owner did not activate D-0008. OWNER-DIRECTIVE-0004 selected D-0009/ARCH-0003 as a separate lineage and
      retained D-0008/ARCH-0002 as non-active research evidence.
    satisfaction_evidence: release/orchestration/phase-1/GATES/OWNER-DIRECTIVE-0004-SIGNED-RELEASE-ROOT-REBASE.md

  - id: GATE-R0-ARCH-ACCEPT
    title: R0 — independent acceptance of Signed Release Root architecture ARCH-0003
    status: OPEN
    satisfier: fresh independent R0 architecture reviewer
    preconditions:
      - D-0009 is ACTIVE and human-approved
      - ARCH-0003 and release/root-of-trust/signed-release-root-v1 are committed as one exact review candidate
      - frozen acceptance boundary is committed and hashable
      - D-0007 remains ACTIVE; D-0008 and ARCH-0002 remain non-active and unchanged
      - runtime/kernel/CLI/capability implementation is unchanged
    reviewed_inputs:
      - spec/decisions/D-0009.yaml
      - spec/architecture/ARCH-0003.yaml
      - release/root-of-trust/signed-release-root-v1/00-ARCHITECTURE.md
      - release/root-of-trust/signed-release-root-v1/01-FROZEN-R0-R1-R2-R3-ACCEPTANCE-BOUNDARY.md
      - release/root-of-trust/signed-release-root-v1/02-OP-1-OP-16-DISPOSITION.md
      - release/root-of-trust/signed-release-root-v1/03-TRANSITION-MAP.md
    frozen_contract_sha256: 70977d11b778c4a8391a65cb3e0f53103bcc1e565de595c1e83150797f1699c1
    satisfied_when: >-
      fresh reviewer returns ROT_ARCHITECTURE_ACCEPTED_R0 for the exact committed candidate under the frozen R0
      contract, with no unresolved R0 CRITICAL/HIGH and no R0 MEDIUM requiring architecture change
    on_refusal: >-
      record findings with source, provenance and lifecycle; do not implement, do not create RoT-1 Revision 8 and do
      not promote R1/R2/R3 hardening into R0 without owner approval
    satisfaction_evidence: null

  - id: GATE-OWNER-KEY-CEREMONY
    title: R2 production trust-anchor and key-custody ceremony
    status: NOT_OPEN
    satisfier: product owner / authorised key custodians
    preconditions: [GATE-R1-CANDIDATE-ACCEPT]
    constraint: >-
      private key material never enters the repository, an agent context or a log; repository evidence contains only
      public anchors, fingerprints and appropriately redacted ceremony records
    lifecycle: R2
    satisfaction_evidence: null

  - id: GATE-OWNER-CAC-UPLOAD
    title: AWAITING_PRODUCT_OWNER_CAPABILITY_CONTRACT_UPLOAD
    status: NOT_OPEN
    satisfier: product owner copies the approved file
    preconditions: [builder scaffolding for contract source, executable YAML, source lock, schema, evidence map and generated view committed]
    destination: framework/contracts/source/GOVERNANCE_CAPABILITY_ACCEPTANCE_CONTRACT_v3.md
    owner_source_file: Governance_OS_Capability_Acceptance_Contract_v3.md
    satisfied_when: owner confirms upload in chat and the file exists at the destination; digest recorded
    satisfaction_evidence: null

  - id: GATE-BUILDER-READY
    title: R1 builder readiness — READY_FOR_INDEPENDENT_OS_VERIFICATION
    status: NOT_OPEN
    satisfier: builder (declares readiness only; never acceptance)
    preconditions: [GATE-R0-ARCH-ACCEPT, GATE-OWNER-CAC-UPLOAD]
    satisfied_when: >-
      exact candidate commit and tag recorded; full builder regression evidence committed for product capabilities,
      Signed Release Root, plugin/migration/trust controls, Gate W and G0-G6
    satisfaction_evidence: null

  - id: GATE-R1-CANDIDATE-ACCEPT
    legacy_alias: GATE-P2-ACCEPT
    title: R1 — fresh independent acceptance of the Phase-1 implementation candidate
    status: NOT_OPEN
    satisfier: fresh independent candidate-verification process only
    preconditions:
      - GATE-BUILDER-READY
      - architecture/security and capability/memory/workflow evidence with fresh held-out tests
      - prior relevant verifier harnesses rerun unchanged
    satisfied_when: >-
      verdict ROT_PHASE1_CANDIDATE_ACCEPTED_R1 for one exact immutable candidate under the frozen R1 contract
    on_refusal: >-
      record and classify every finding by provenance/lifecycle; implementation defects return to a bounded R1 repair;
      a genuine R0 defect reopens GATE-R0-ARCH-ACCEPT; owner approval is required for expanded requirements
    satisfaction_evidence: null

  - id: GATE-R2-STANDARD-RELEASE
    title: R2 — Standard Release Certification
    status: NOT_OPEN
    satisfier: fresh independent release-certification process plus owner release authority
    preconditions: [GATE-R1-CANDIDATE-ACCEPT, GATE-OWNER-KEY-CEREMONY]
    satisfied_when: >-
      ROT_STANDARD_RELEASE_CERTIFIED_R2 for one exact release, target and profile with production signatures/custody,
      two independent verification records, platform lifecycle tests, private publication smoke, rotation/revocation
      drill, SBOM/licences/provenance, current capability evidence and applicable Gate W/G6 qualification
    satisfaction_evidence: null

  - id: GATE-R3-HIGH-ASSURANCE
    title: R3 — Optional High-Assurance Platform Qualification
    status: NOT_OPEN
    optional: true
    satisfier: independently governed high-assurance qualification process
    preconditions: [GATE-R2-STANDARD-RELEASE]
    satisfied_when: >-
      the named target/profile meets the owner-adopted R3 criteria for reproduction, toolchain/bootstrap, first-contact,
      supplier independence, compromise testing, organizational audit and extended ceremonies
    when_unsatisfied: STANDARD RELEASE — HIGH-ASSURANCE TOOLCHAIN PROFILE NOT CERTIFIED
    note: non-satisfaction does not invalidate R0, R1, R2 or the normal Governance OS product
    satisfaction_evidence: null

  - id: GATE-PHASE1-COMPLETE
    title: PHASE_1_INTERNAL_CONVERGENCE_COMPLETE
    status: NOT_OPEN
    satisfier: orchestrator, after GATE-R1-CANDIDATE-ACCEPT, by writing the final checkpoint
    preconditions: [GATE-R1-CANDIDATE-ACCEPT]
    note: does not itself certify R2, qualify R3, publish a stable release or start product adoption
    satisfaction_evidence: null

  - id: OWNER-DESIGN-REQUIREMENTS-0001
