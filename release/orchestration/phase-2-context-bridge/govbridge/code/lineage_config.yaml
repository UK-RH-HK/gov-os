schema: govbridge-lineage-config/1
# Configuration for the R1-RL "lineage" store layer (govbridge/code/lineage_layer.py) and for
# govbridge.graph.symbol_history's bounded git-log walk. Data, not a code literal (BR-AR-0019 reopening ruling,
# item 3): edit this file (or set GOVBRIDGE_SYMBOL_HISTORY_MAX_COMMITS) to change the bound without touching
# source. Generic: no Review-8/Phase-2 item, F-finding or symbol is named here (OC-BR-02).
symbol_history:
  # the largest number of commits govbridge.graph.symbol_history.introduced_in/deleted_in will examine walking
  # one path's own history before giving up and reporting an HONEST lower bound (bounded_incomplete: true in the
  # result -- the walk never silently claims certainty past this point).
  default_max_commits: 500
