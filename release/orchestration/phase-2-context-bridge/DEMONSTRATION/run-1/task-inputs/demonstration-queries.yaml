- id: AUTH-1
  kind: authority
  text: List every mandatory input with its authority class, exactly as the packet presents it.
- id: AUTH-2
  kind: authority
  text: Which items are owner decisions in force, and which are owner directions or hypotheses to test?
- id: AUTH-3
  kind: authority
  text: Which Phase-2 findings were withdrawn, and by whom?
- id: AUTH-4
  kind: authority
  text: Which Phase-2 stop conditions are current, and which are superseded?
- id: CTRL-1
  kind: control
  text: Which decision adopted the signed release root, what requirement does rollback/high-water protection serve,
    where is the high-water check enforced in code, and which tests prove it?
- id: CTRL-2
  kind: control
  text: Why does an executable capability plugin need a registration, which decisions constrain that, and where does
    the product refuse an unregistered plugin?
- id: CTRL-3
  kind: control
  text: What is current and what is superseded for the operator control panel version, the Phase-1 target architecture,
    and the Phase-2 stop conditions?
