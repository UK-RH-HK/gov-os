schema: govbridge-demonstration-queries/1
note: >-
  PUBLIC query set for the first mandatory benchmark case (Review 8). Builders may use it as acceptance input. The
  held-out oracle that grades the answers is written separately by a fresh test-author and is never shown to builders.
  The ten query classes and the chain stages are GENERIC; only these instances name the Review-8 case (OC-BR-02).
case: review-8
views:
  product_commit: 3c880d80f81475f5306bdd5f680f2e004df49391
  records_commit: 6e7a2a3495a8d3619759a95b7ed055da9c848618
  evidence_commit: 58219d5628683d6f462aa67bf25dbc2641933bce
chain_stages:
- requirement
- source_construction
- composition_union
- partition_filtering
- precedence_ordering
- matcher_evaluator
- final_enforcement_decision
- effective_behaviour
- tests
- prior_findings
- current_status
subjects:
  S1: the composition that decides a path's effective attributes -- from the layout derivation that produces path
    patterns, through policy loading and the project-overlay evaluation, to the per-path decision
  S2: the re-onboarding union of last-known floor rules across the machine's protected adoption-floor store
  S3: the health-sandbox exemption and its creator-liveness predicate
query_classes:
  QC1: Why does this mechanism exist?
  QC2: Which Contract-v3 capability requires it?
  QC3: Which owner or architecture decisions constrain it?
  QC4: What does it depend on?
  QC5: What depends on it?
  QC6: Which prior approaches failed, and why?
  QC7: Which tests prove it or challenge it?
  QC8: Which evidence becomes stale if it changes?
  QC9: What is current and what is superseded -- for its governing decisions and for the code itself (which ref is
    canonical)?
  QC10: What could potentially be deleted without violating the actual requirement? Answer with evidence only
    (consumers, requirements served, test-only consumers); make no recommendation.
queries:
- id: R8-CHAIN-F2
  kind: chain
  finding_ref: P2-AR-0097#F2
  text: Starting from the finding as reported in the Review-8 return (P2-AR-0097, F2), reconstruct its full decision/effect
    chain at the frozen product 3c880d8, stage by stage (chain_stages). For each stage cite the code or record anchor
    and state what it does, verified at 3c880d8 rather than quoted from the review. Identify the actual decision/enforcement
    point, meaning the code whose evaluated result decides the concrete behaviour. If a stage does not exist for this
    finding, say so and cite why.
- id: R8-CHAIN-F3
  kind: chain
  finding_ref: P2-AR-0097#F3
  text: Starting from the finding as reported in the Review-8 return (P2-AR-0097, F3), reconstruct its full decision/effect
    chain at the frozen product 3c880d8, stage by stage (chain_stages). For each stage cite the code or record anchor
    and state what it does, verified at 3c880d8 rather than quoted from the review. Identify the actual decision/enforcement
    point, meaning the code whose evaluated result decides the concrete behaviour. If a stage does not exist for this
    finding, say so and cite why.
- id: R8-SIDE-BY-SIDE
  kind: side_by_side
  text: Place the F2 path and the F3 path side by side, each down to its real enforcement point. List the code locations
    they share and the ones where they differ. Record the evidence that bears on whether they are one deeper class
    and the evidence that bears against it. Do not classify them. Set the answer field classification to NOT_DETERMINED_BY_BRIDGE.
- id: R8-F1-BOTHWAYS
  kind: both_ways
  finding_ref: P2-AR-0097#F1
  text: For the health-sandbox exemption that F1 concerns, reconstruct why it was created (purpose, origin record, and
    the requirement or owner decision it served), every consumer (production and test, and whether each is in-process
    or cross-process), what it depends on and what depends on it. Record the evidence relevant to the owner's direction
    (DELETE / SIMPLIFY / REPAIR / NARROW / RETAIN), both for and against. State no decision.
