schema: govbridge-schema/1
describes: govbridge-answers/1
purpose: the demonstration agent's answers, shaped so that grading is mechanical where it can be
citation: '{item_id} (a packet item) or {exact: {path, commit, lines}} (declared in receipt external_reads if outside every packet)'
fields:
  run_id: {type: string, required: true}
  packets_used: {type: list of packet_id, required: true}
  answers:
    type: list
    required: true
    item:
      query_id: string
      status: 'ANSWERED | PARTIAL | NOT_FOUND'
      answer_text: string
      citations: list of citation
      stages: 'chain queries only: list of {stage, claim, citations, is_enforcement_point: bool}'
      shared_points: 'side-by-side only: list of citation'
      differing_points: 'side-by-side only: list of citation'
      evidence_for: 'side-by-side and both-ways only: list of {claim, citations}'
      evidence_against: 'side-by-side and both-ways only: list of {claim, citations}'
      classification: 'side-by-side only: MUST be the constant NOT_DETERMINED_BY_BRIDGE'
      disposition: 'both-ways only: MUST be the constant NONE_STATED'
