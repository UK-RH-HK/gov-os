schema: govbridge-task-spec/1
task_id: BR-DEMO-R8-1
role: fresh demonstration agent (whole-system context reconstruction; not a builder, not the test-author)
objective: Reconstruct the Review-8 rule-composition decision/effect chains to their actual enforcement points and answer
  the public demonstration queries, using only the bootstrap, the compiled packet(s) and govbridge queries, with every
  external read declared.
view: config/canonical-view.yaml
required_inputs:
- state_ref: state:bridge#mandatory_bridge_inputs.items[*]
  reason: the owner's Review-8 disposition and the synthesis evidence, with authority classes preserved exactly
- state_ref: state:bridge#owner_records[*]
  reason: owner records in force for this lifecycle (OD-P2-10, OD-P2-10A/B, OD-P2-09, OD-P2-08, OC-P2-04, frozen gate
    contract, launcher, OC-BR-02)
- state_ref: state:bridge#contract_v3
  reason: the owner source contract (Property C and Gate W requirements)
seeds:
- P2-AR-0097
- P2-AR-0097#F1
- P2-AR-0097#F2
- P2-AR-0097#F3
queries: ARCHITECTURE/demonstration-queries.yaml
retrieval_exclusions:
- release/orchestration/phase-2-context-bridge/ARCHITECTURE/**
- release/orchestration/phase-2-context-bridge/AGENT_RUNS/**
- release/orchestration/phase-2-context-bridge/DEMONSTRATION/**
- release/orchestration/phase-2-context-bridge/HANDOFFS/BR-HO-0*
mutation_scope:
- release/orchestration/phase-2-context-bridge/DEMONSTRATION/<run>/answers.yaml
- release/orchestration/phase-2-context-bridge/DEMONSTRATION/<run>/receipt.yaml
prohibitions:
- read any path matched by retrieval_exclusions, or any Phase-2 session transcript
- repair, classify or pre-judge F1-F6; state a disposition for F1; classify F2/F3 as one class or as distinct classes
- cite the withdrawn AR96 positive-control finding as a finding
- whole-tree enumeration or content sweeps (DEMONSTRATION_DESIGN G7)
required_checks:
- govbridge receipt check --packet <main> --receipt receipt.yaml
completion_vocabulary: [ANSWERED, PARTIAL, BLOCKED]
budget_profile: synthesis
