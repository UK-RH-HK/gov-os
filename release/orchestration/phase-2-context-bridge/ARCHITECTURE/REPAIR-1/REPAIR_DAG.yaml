nodes:
- id: R1-CTRL
  title: unrelated real-view control CONTROL-A (orchestrator-chosen) and its baseline on the unrepaired bridge
  capabilities:
  - OC-BR-02 control subject
  depends_on: []
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/tests/fixtures/controls/**
  deliverables:
  - 'tests/fixtures/controls/control-a/{task-spec.yaml, queries.yaml, SELECTION.md}: a subject meeting conventions.unrelated_controls,
    with the orchestrator''s evidence (exact greps and paths) that it spans >= 3 top-level directories and involves >= 1
    decision record and >= 1 test file'
  - 'tests/fixtures/controls/control-a/baseline/: compile, packet verify and a manifest summary on the UNREPAIRED bridge,
    so that every node can show a before/after comparison on the same subject'
  acceptance_checks:
  - cmd: $PY -m govbridge compile $D/tests/fixtures/controls/control-a/task-spec.yaml --out /tmp/ca0 && $PY -m govbridge
      packet verify /tmp/ca0
    expect: PASS on the unrepaired bridge; the baseline is recorded
  - cmd: grep -nE 'P2-AR-0097|REVIEW-8|OD-P2-10' $D/tests/fixtures/controls/control-a/*.yaml
    expect: no match
  routing: orchestrator (deterministic)
  size: S
  parallel_group: R1-PG0
- id: R1-DEC
  title: 'grading-rule decisions D-1..D-5: whole-document vs sectioned anchors; must_state binding; AUTH gating; reads of
    run metadata; G7 packet-byte accounting'
  capabilities:
  - demonstration grading rules
  depends_on: []
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/ARCHITECTURE/REPAIR-1/DECISIONS/**
  - release/orchestration/phase-2-context-bridge/ARCHITECTURE/DEMONSTRATION_DESIGN.md
  deliverables:
  - ARCHITECTURE/REPAIR-1/DECISIONS/GRADING-RULES.md recording D-1..D-5 (REPAIR_PLAN.md section 8.1), each with its approver
    (the orchestrator; the owner where a gate's meaning changes) and its date
  - a dated amendment section appended to DEMONSTRATION_DESIGN.md section 4 (G3, G4, G5, G7) that quotes D-1..D-5; the existing
    text is not rewritten
  acceptance_checks:
  - cmd: grep -cE '^\| D-[1-5] ' $D/ARCHITECTURE/REPAIR-1/DECISIONS/GRADING-RULES.md
    expect: '5'
  - cmd: grep -c 'APPROVED' $D/ARCHITECTURE/REPAIR-1/DECISIONS/GRADING-RULES.md
    expect: '>= 5, and each row names its approver'
  - cmd: git diff <base> -- $D/ARCHITECTURE/DEMONSTRATION_DESIGN.md | grep -c '^-[^-]'
    expect: 0 (the amendment only appends)
  routing: orchestrator (the owner is consulted for D-2 and D-3)
  size: S
  parallel_group: R1-PG0
- id: R1-RN
  title: 'hierarchical evidence notes: schema, validator and CLI (OD-BR-05 s7, OD-BR-06 s4)'
  capabilities:
  - derived evidence notes with claim-to-source lineage
  depends_on: []
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/notes/**
  - release/orchestration/phase-2-context-bridge/config/notes-schema.yaml
  - release/orchestration/phase-2-context-bridge/tests/notes/**
  deliverables:
  - 'config/notes-schema.yaml: note_id; class DERIVED_NOTE; claims[] with sources[] {item_id, path, commit, blob, lines,
    content_sha256}; unresolved[]; built_from_sha256'
  - govbridge/notes/{build,validate}.py and `govbridge notes validate <file>`; DERIVED_NOTE is non-ladder and never admissible
    in A
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/notes -q
    expect: 'exit 0. Refused: a claim with no source, a source that does not resolve, a note placed in A, and a built_from_sha256
      mismatch. Accepted: a note rebuilt twice from the same sources, with an identical hash. unresolved[] is mandatory
      and may be empty'
  routing: sonnet
  size: S
  parallel_group: R1-PG0
- id: R1-RX
  title: 'task context: retrieval_exclusions applied automatically by every route, every CLI query command and every compile
    call site (OBS-BR-08, OD-BR-03 item 1)'
  capabilities:
  - task-scoped retrieval exclusions
  depends_on:
  - R1-CTRL
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/core/taskctx.py
  - release/orchestration/phase-2-context-bridge/govbridge/cli.py
  - release/orchestration/phase-2-context-bridge/govbridge/route/real_routes.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/packet.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/why.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/impact.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/history.py
  - release/orchestration/phase-2-context-bridge/govbridge/authority/state.py
  - release/orchestration/phase-2-context-bridge/govbridge/core/exact.py
  - release/orchestration/phase-2-context-bridge/tests/route/test_task_exclusions.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/route/exclusions/**
  deliverables:
  - 'govbridge/core/taskctx.py: a TaskContext loaded from --task <spec> or GOVBRIDGE_TASK, with one exclusion predicate
    used everywhere'
  - every CLI query command (search, why, impact, history, exact, state), and the compiler's seed code route and D.2 templates,
    apply the context; every output carries excluded_hits, a count, so the exclusion is disclosed
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/route/test_task_exclusions.py -q
    expect: exit 0. In a fixture repo whose excluded directory holds the best lexical and semantic match, every command
      and compile (seed route and D.2 included) return 0 excluded occurrences and a non-zero excluded_hits disclosure
  - cmd: grep -n 'routes.run(' $D/govbridge/compile/packet.py
    expect: every call passes the task context's exclusions; no call omits them
  - cmd: python3 $D/ARCHITECTURE/REPAIR-1/evidence/tools/exclusion_probe.py <CONTROL-A task spec> (adapted to --task)
    expect: totals.cli_default_no_exclude == 0 once the task context is set
  routing: sonnet
  size: S
  parallel_group: R1-PG1
- id: R1-RL
  title: 'graph and lineage additions: tests beyond names, code->data and code->requirement edges, addressable state records,
    symbol introduction history, paging primitives'
  capabilities:
  - code/test lineage
  - data dependencies
  - requirement lineage
  - structured-record identity
  - continuation
  depends_on:
  - R1-CTRL
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/code/**
  - release/orchestration/phase-2-context-bridge/govbridge/graph/derive.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/code_bridge.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/edges.py
  - release/orchestration/phase-2-context-bridge/govbridge/graph/symbol_history.py
  - release/orchestration/phase-2-context-bridge/govbridge/authority/records.py
  - release/orchestration/phase-2-context-bridge/config/id-grammar.yaml
  - release/orchestration/phase-2-context-bridge/tests/code/**
  - release/orchestration/phase-2-context-bridge/tests/graph/**
  - release/orchestration/phase-2-context-bridge/tests/authority/test_state_records.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/code/**
  - release/orchestration/phase-2-context-bridge/tests/fixtures/graph/**
  deliverables:
  - TESTS edges from (a) direct calls inside test functions, (b) tests that run the product binary with a subcommand, mapped
    through the CLI dispatch table to its handler, and (c) test registries recognised by path class and schema; each edge
    is labelled with its derivation
  - DEPENDS_ON_DATA edges from string literals and joined path fragments that resolve to tracked repository paths
  - CITES_REQUIREMENT edges from requirement citations in code comments (<document>:<line>, section references), resolved
    to the cited section
  - record_def rows for the nested YAML keys and id-bearing list items of state files, so that `exact id` resolves them
  - symbol INTRODUCED_IN / DELETED_IN over the indexed history layer, bounded by configuration, as a `symbol-history` query
  - paging (cursor, page_size) for callers, tests_of and reads_key_of; a capped list returns a continuation handle
  - every addition registered as a store layer with a digest (ARCHITECTURE.md section 8)
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/code tests/graph tests/authority/test_state_records.py -q
    expect: 'exit 0. Fixtures prove each edge kind with its label: a process-level test reaches its handler; a joined path
      literal reaches its data file; a comment citation reaches the cited section; a nested YAML key is resolved by `exact
      id`; a symbol''s introducing commit is found; and a 50-caller symbol paged 8 at a time gives the same union as the
      unpaged query'
  - cmd: $PY -m govbridge.core.freshness rebuild --from-clean (twice, into two fresh stores)
    expect: identical digests for every new layer; freshness NOOP afterwards
  - cmd: $PY -m govbridge.code.symbols callers <a CONTROL-A symbol with more callers than the profile cap> --page-size 6
    expect: a continuation handle; following it to exhaustion returns every call site that the unpaged query returns
  routing: sonnet
  size: L
  parallel_group: R1-PG1
- id: R1-RG
  title: 'deterministic grader repair: GD-1..GD-10 and OBS-BR-05, each with a regression test (implements D-1..D-5)'
  capabilities:
  - demonstration grading
  depends_on:
  - R1-DEC
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/demo/**
  - release/orchestration/phase-2-context-bridge/tests/integration/test_demo_grade.py
  - release/orchestration/phase-2-context-bridge/tests/integration/test_demo_grade_regressions.py
  - release/orchestration/phase-2-context-bridge/tests/integration/test_extract_reads.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/demo/**
  deliverables:
  - 'the fixes of REPAIR_PLAN.md section 8.2: GD-1 line forms; GD-2 answer selection by the both-ways query id; GD-3 record
    by id OR section; GD-4 a generic withdrawn marker; GD-5 the enforcement-point rule; GD-6 read-extraction scope and govbridge
    argument parsing; GD-7 byte accounting per D-5; GD-8 per D-1; GD-9 [R] ingestion and AUTH per D-3; GD-10 enclosing-symbol
    matching; OBS-BR-05, the 1% check always on, over main plus supplementary packets'
  - one synthetic fixture set (oracle, answers, receipt, transcript) per defect, with no Review-8 content
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/integration/test_demo_grade.py tests/integration/test_demo_grade_regressions.py tests/integration/test_extract_reads.py
      -q
    expect: exit 0; one named regression test per GD-1..GD-10 and OBS-BR-05. Each fails when run against the pre-repair
      commit and passes after the repair
  - cmd: (orchestrator only, quarantined) $PY -m govbridge demo grade over run-1 with the run-1 oracle
    expect: no crash; G6 is graded on the both-ways answer; the per-item [D] results equal BR-AR-0012's design-rule results
      except for the items that D-1 or GD-10 re-rule, each of which is listed. The orchestrator records the comparison without
      oracle values
  routing: sonnet (fixtures reviewed by the orchestrator)
  size: M
  parallel_group: R1-PG1
- id: R1-TA2
  title: 'fresh test-author for run-2: a fresh oracle, sealed at an unrecorded location, with D-2 fact binding'
  capabilities:
  - demonstration oracle
  depends_on:
  - R1-DEC
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/DEMONSTRATION/oracle-commitment-run-2.yaml
  - release/orchestration/phase-2-context-bridge/DEMONSTRATION/oracle-tools/**
  deliverables:
  - a fresh oracle (schema govbridge-oracle/1 plus a per-fact binding, stage or chain, per D-2), written from primary sources
    only, in an orchestrator-created 0700 directory whose path is recorded in NO committed file, state entry or brief (OBS-BR-04,
    OBS-BR-10)
  - DEMONSTRATION/oracle-commitment-run-2.yaml {oracle_sha256, author_run, author_model, written_at, schema}
  - oracle-tools/check_oracle.py extended for the binding field
  acceptance_checks:
  - cmd: python3 $D/DEMONSTRATION/oracle-tools/check_oracle.py <sealed path>
    expect: exit 0; every must_state fact carries a binding; one enforcement stage per chain; one authority row per mandatory
      item
  - cmd: git grep -n '<sealed directory name>' -- . (run by the orchestrator)
    expect: no match anywhere in the repository
  - cmd: sha256sum <sealed path>
    expect: equals oracle-commitment-run-2.yaml
  routing: 'opus (fresh: not the run-1 test-author, not a builder, not BR-AR-0016)'
  size: M
  parallel_group: R1-PG1
  notes: reads primary sources at the view commits only; never builder branches, run-1 answers, REPAIR-1/** or bridge/grade-0012
- id: R1-RM
  title: 'mandatory-input fidelity: no silent truncation; declared selectors honoured; directory items expanded; the receipt
    acknowledges what was delivered (RC-1)'
  capabilities:
  - mandatory-authoritative-input resolution
  - bounded context compilation
  depends_on:
  - R1-RX
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/authority/resolver.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/packet.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/budgets.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/render.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/receipt.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/validate.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/sectionmap.py
  - release/orchestration/phase-2-context-bridge/tests/compile/test_mandatory_fidelity.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/compile/mandatory/**
  deliverables:
  - item_from_mandatory never cuts text. An item over the per-item cap is delivered as a section map (headings or keys,
    with line ranges and hashes) plus facet-selected sections plus a by-reference remainder, with the J notice MANDATORY_PARTIAL_DELIVERY
    listing every undelivered range (REPAIR_PLAN.md section 3)
  - the resolver honours `entries` (an id range), `keys` (YAML keys) and multiple `paths`; an unresolvable selector fails
    closed with a J notice
  - a by-reference directory is expanded to a member manifest (path, blob, size, class)
  - the receipt and manifest carry delivered_sha256 and source_sha256 separately; packet verify checks both
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/compile/test_mandatory_fidelity.py tests/compile -q
    expect: 'exit 0, with the whole compile suite still green. Fixtures: an oversize item never ends mid-content without
      the notice; an id-range selector delivers exactly those entries; a key selector exactly those keys; a two-path item
      both paths; a directory item a member manifest; section A is never dropped'
  - cmd: grep -n 'max_chars' $D/govbridge/compile/packet.py
    expect: no truncation of mandatory items; any remaining cap applies only to RETRIEVED or DERIVED excerpts and is disclosed
  - cmd: $PY -m govbridge compile <CONTROL-A task spec with >= 1 oversize mandatory item and >= 1 selector> --out /tmp/rm
      && $PY -m govbridge packet verify /tmp/rm
    expect: PASS; every A item has delivered_bytes == source_bytes, or a MANDATORY_PARTIAL_DELIVERY notice with its ranges
  routing: sonnet
  size: M
  parallel_group: R1-PG2
- id: R1-GA1
  title: 'govbridge gather, core: query instantiation, facet registry, deterministic parallel facet retrieval, paging and
    continuation with a configurable batch size, stopping reasons, telemetry (OD-BR-05 s1, s2, s4, s5, s9 telemetry)'
  capabilities:
  - multi-facet, multi-batch retrieval
  depends_on:
  - R1-RX
  - R1-RL
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/gather/__init__.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/instantiate.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/facets.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/engine.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/telemetry.py
  - release/orchestration/phase-2-context-bridge/config/facets.yaml
  - release/orchestration/phase-2-context-bridge/config/budgets.yaml
  - release/orchestration/phase-2-context-bridge/govbridge/route/real_routes.py
  - release/orchestration/phase-2-context-bridge/govbridge/route/router.py
  - release/orchestration/phase-2-context-bridge/govbridge/lexical/query.py
  - release/orchestration/phase-2-context-bridge/govbridge/semantic/search.py
  - release/orchestration/phase-2-context-bridge/govbridge/semantic/vectors.py
  - release/orchestration/phase-2-context-bridge/govbridge/cli.py
  - release/orchestration/phase-2-context-bridge/tests/gather/test_engine.py
  - release/orchestration/phase-2-context-bridge/tests/gather/test_instantiate.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/gather/**
  deliverables:
  - instantiation of {class, subject} entries from the query file's own tables; a query that cannot be made executable is
    the compile error QUERY_NOT_EXECUTABLE and is never skipped (RC-2)
  - 'config/facets.yaml: generic facets (REPAIR_PLAN.md section 2.2) with routes, path-class scopes, query builders, batch
    size and minimum share; a class -> facet mapping; no instance-specific names'
  - 'the engine: rounds; the facets of a round run concurrently with a deterministic merge order; per-facet cursors (lexical
    and semantic offset, code paging from R1-RL); batch_size from configuration (no hard-coded 8); stop reasons from the
    fixed vocabulary'
  - 'telemetry per gather: rounds, per round and facet the candidates (items, bytes), deduplication counts, final bytes,
    stop reason, unresolved identifiers'
  - '`govbridge gather --task <spec> --query <id|text> [--batch-size N] [--max-rounds N] [--threads N]`'
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/gather/test_engine.py tests/gather/test_instantiate.py -q
    expect: exit 0. A fixture query file with class x subject entries yields one executable query per entry; a malformed
      entry raises QUERY_NOT_EXECUTABLE; a fixture subject whose evidence spans 5 directories and exceeds one batch is covered
      after more than one round; stop_reason is one of FACETS_COVERED, NO_UNRESOLVED_IDENTIFIERS, MARGINAL_GAIN_ONLY_DUPLICATES,
      MAX_ROUNDS, BUDGET_REACHED_WITH_UNRESOLVED
  - cmd: $PY -m govbridge gather --task <CONTROL-A spec> --query <CONTROL-A query> with --threads 1, 4 and 16
    expect: a byte-identical merged result (equal sha256) across thread counts
  - cmd: the same query with --batch-size 2 and with --batch-size 16
    expect: an identical merged evidence set; more rounds for the smaller batch; a telemetry row for every round
  - cmd: 'grep -rnE ''k: int = 8|DEFAULT_K = 8|k=8\b'' $D/govbridge/'
    expect: no match outside the configuration-default loader; 8 survives only as configuration
  routing: sonnet
  size: L
  parallel_group: R1-PG2
- id: R1-GA2
  title: 'gather, adaptive follow-up and merge: identifier extraction and resolution, triggered rounds, provenance-preserving
    deduplication, occurrence collapse, version reconciliation, authority and lifecycle filtering (OD-BR-05 s3, s6)'
  capabilities:
  - sequential and adaptive multi-hop retrieval
  - provenance-preserving merge
  - version reconciliation
  depends_on:
  - R1-GA1
  - R1-RL
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/gather/followup.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/identifiers.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/merge.py
  - release/orchestration/phase-2-context-bridge/govbridge/gather/versions.py
  - release/orchestration/phase-2-context-bridge/tests/gather/test_followup.py
  - release/orchestration/phase-2-context-bridge/tests/gather/test_merge.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/gather/followup/**
  deliverables:
  - identifier extractors for id-grammar ids, symbol-shaped tokens, path literals and joined fragments, test names, commit
    hashes and requirement citations; resolvers via exact id, code definitions, callers and tests, path resolution, and
    the sections of a known document
  - follow-up rounds with a visited set; every follow-up item records its trigger (the identifier and its source item)
  - 'merge: deduplication by (blob, line span); a provenance list per item (routes, facets, rounds, triggers); occurrences
    collapsed to the canonical occurrence plus a per-ref identity summary; a `versions` facet reporting per-path blob identity
    across the view''s refs and the canonical ref; authority and lifecycle filtering unchanged (A only from the resolver)'
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/gather/test_followup.py tests/gather/test_merge.py -q
    expect: exit 0. In the fixture, a record citing an id defined elsewhere, a function whose tests live in another directory,
      a joined path literal and a comment requirement citation are each reached within 3 rounds, with the trigger recorded.
      The same item found by three routes is one merged item with three provenance entries. A 3-ref fixture reports identical
      or different per ref. A superseded item is filtered to E with its banner
  - cmd: $PY -m govbridge gather --task <CONTROL-A spec> --query <CONTROL-A query> --json | jq '.telemetry'
    expect: '>= 1 round whose trigger is an identifier first seen in an earlier round; merged items carry provenance; no
      search hit lists more than one occurrence row plus a ref summary'
  routing: sonnet
  size: L
  parallel_group: R1-PG3
- id: R1-RS
  title: supplementary packets for every query command; occurrence collapse; bootstrap by reference; task inputs in section
    I (OBS-BR-06, OBS-BR-07)
  capabilities:
  - budgeted supplementary retrieval output with manifests
  depends_on:
  - R1-GA1
  - R1-RM
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/compile/supplementary.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/bootstrap.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/receipt.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/validate.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/section_i.py
  - release/orchestration/phase-2-context-bridge/govbridge/cli.py
  - release/orchestration/phase-2-context-bridge/tests/compile/test_supplementary.py
  - release/orchestration/phase-2-context-bridge/tests/compile/test_section_i_and_bootstrap.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/compile/supplementary/**
  deliverables:
  - every query command (search, why, impact, history, exact, state, gather) writes a supplementary packet directory (manifest.json,
    packet.md, meta.json, packet hash, read tokens) under --out. Each is budgeted by a per-command profile and deduplicated,
    by item id, against the main packet and earlier supplementary packets. Raw JSON is available only behind --raw
  - '`packet verify` and `receipt check` cover the main packet and every supplementary packet'
  - section I carries the task's instantiated query set and the answers and receipt schemas, verbatim and by hash
  - the bootstrap references the packet by id and hash and does not inline it
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/compile/test_supplementary.py tests/compile/test_section_i_and_bootstrap.py -q
    expect: exit 0. A fixture search writes a verifiable supplementary packet; a hit already in the main packet appears
      only by reference; no hit carries more than one occurrence row plus a ref summary; a receipt that omits a supplementary
      packet fails
  - cmd: $PY -m govbridge search --task <CONTROL-A spec> '<CONTROL-A query>' --out /tmp/s1 && $PY -m govbridge packet verify
      /tmp/s1
    expect: PASS; bytes within the command profile; meta.json carries packet_sha256
  - cmd: $PY -m govbridge bootstrap <CONTROL-A spec> | wc -c
    expect: well under the packet size, because the packet is referenced, not inlined
  routing: sonnet
  size: M
  parallel_group: R1-PG3
- id: R1-GA3
  title: 'compile from gather: facet quotas and a facet-aware drop order; content slices instead of pointers; per-item query
    and facet tags; overflow to evidence notes and supplementary packets; D.2 via gather (RC-4, RC-5; OD-BR-05 s6-s8)'
  capabilities:
  - bounded context compilation over multi-round evidence
  depends_on:
  - R1-GA2
  - R1-RS
  - R1-RN
  - R1-RM
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/compile/packet.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/budgets.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/render.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/codesurfaces.py
  - release/orchestration/phase-2-context-bridge/govbridge/compile/overflow.py
  - release/orchestration/phase-2-context-bridge/config/budgets.yaml
  - release/orchestration/phase-2-context-bridge/tests/compile/test_facet_quotas.py
  - release/orchestration/phase-2-context-bridge/tests/compile/test_content_slices.py
  - release/orchestration/phase-2-context-bridge/tests/compile/test_overflow_notes.py
  - release/orchestration/phase-2-context-bridge/tests/fixtures/compile/gather/**
  deliverables:
  - the compiler builds sections B-H from gather results for every task query (instantiated), with per-item query ids and
    facets
  - facet quotas (a minimum share for every requested facet that has candidates) and a drop order that is round-robin across
    facets; a resolution label is never a global sort key; per-facet drops are disclosed with continuation handles
  - code and test items carry their definition body slice (max_slice_chars, larger for a facet's top items); semantic items
    carry chunk text; content already present is cited by item id
  - 'when merged evidence exceeds the profile: evidence notes (the R1-RN schema) plus supplementary packets (R1-RS). The
    main packet keeps the mandatory sources, the notes and each facet''s top items; nothing is silently discarded'
  - D.2 both-ways evidence is produced by gather with the task context's exclusions
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/compile -q
    expect: 'exit 0. Fixtures: a facet with 40 heuristic-label candidates beside 300 exact-label candidates of another facet
      keeps at least its minimum share; no symbol or semantic item has a 0-byte body; an over-budget fixture produces notes
      that pass `govbridge notes validate` and supplementary packets that pass `packet verify`; quotas leave section A unchanged'
  - cmd: $PY -m govbridge compile <CONTROL-A spec> --out /tmp/c1 (twice) && $PY -m govbridge packet verify /tmp/c1
    expect: byte-identical packets; PASS; every requested facet of every query is present, or disclosed as MISSING or BUDGET
      with a handle; the main packet is within the profile total
  routing: sonnet
  size: L
  parallel_group: R1-PG4
- id: R1-RA
  title: 'answer-side aids: govbridge cite and govbridge answers lint (RC-11)'
  capabilities:
  - citation resolution
  - answer completeness lint
  depends_on:
  - R1-GA2
  - R1-RS
  mutation_scope:
  - release/orchestration/phase-2-context-bridge/govbridge/answers/**
  - release/orchestration/phase-2-context-bridge/govbridge/cli.py
  - release/orchestration/phase-2-context-bridge/tests/answers/**
  - release/orchestration/phase-2-context-bridge/tests/fixtures/answers/**
  deliverables:
  - '`govbridge cite <identifier> [--commit C]` returns an exact (path, commit, lines, symbol if any), or AMBIGUOUS with
    every candidate'
  - '`govbridge answers lint <answers> --packet DIR [--supplementary DIR...]` reports four kinds of finding: NAMED_NOT_CITED
    (an identifier in a claim that resolves in the index and has no citation), DOC_LEVEL_CITATION (a whole-document citation
    of a document that has a section map), CROSS_ANSWER_REFERENCE and NOT_SELF_CONTAINED. Output is machine-readable; exit
    1 on findings unless they are waived'
  acceptance_checks:
  - cmd: cd $D && $PY -m pytest tests/answers -q
    expect: exit 0. A fixture answer that names three tests and cites one yields two NAMED_NOT_CITED; a whole-document citation
      of a sectioned fixture document yields DOC_LEVEL_CITATION with the suggested section anchor; `cite` resolves a test
      name to its definition span
  routing: sonnet
  size: M
  parallel_group: R1-PG4
