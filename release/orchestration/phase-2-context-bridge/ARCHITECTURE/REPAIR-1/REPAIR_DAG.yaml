# REPAIR-1 implementation DAG (BR-AR-0016). Same node format as ARCHITECTURE/IMPLEMENTATION_DAG.yaml: id, title,
# depends_on, mutation_scope (inside the domain), deliverables, acceptance_checks (cmd + expect), routing, size,
# parallel_group. PROPOSED; no node has been dispatched. Generated from a checked data structure (ordering and
# scope disjointness verified; see AGENT_RUNS/BR-AR-0016.checkpoint.yaml).
schema: govbridge-implementation-dag/1
run_id: BR-AR-0016
title: REPAIR-1 -- generic repair of the Context/Retrieval Bridge after the run-1 DEMONSTRATION_FAIL
status: PROPOSED (for the orchestrator; nothing has been built)
reads_with: REPAIR_PLAN.md (sections cited per node), CAUSE_ANALYSIS.md (root causes RC-1..RC-11), ARCHITECTURE.md, DEMONSTRATION_DESIGN.md,
  GATES/OWNER-DIRECTION-BR-0005-*, GATES/OWNER-DIRECTION-BR-0006-*
conventions:
  domain: release/orchestration/phase-2-context-bridge
  paths: every mutation_scope glob is relative to the repository root and lies inside the domain
  run_records: the orchestrator appends release/orchestration/phase-2-context-bridge/AGENT_RUNS/<RUN_ID>.* to each node's
    mutation_scope at dispatch (typed report + schema-2 checkpoint, OD-BR-04 A)
  python: PY=$HOME/.cache/gov-bridge/venv/bin/python; D=release/orchestration/phase-2-context-bridge; commands run from
    the repository root of the node's worktree with PYTHONPATH=$D and GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-<RUN_ID>
  generic_rule: no code, config, facet, scope or test may name a Review-8 item, an F-finding, a Phase-2 file or a symbol
    of the Review-8 chains (OC-BR-02). Builders must NOT use the public demonstration query texts, the run-1 answers or
    any oracle as acceptance input; they use fixtures and CONTROL-A only (REPAIR_PLAN.md section 9)
  unrelated_controls: 'real-view subjects chosen by the orchestrator: evidence spanning >= 3 top-level directories, >= 1
    decision record and >= 1 test file involved, not a Review-8 subject, not a CTRL-1..3 subject. CONTROL-A is written by
    R1-CTRL before any builder starts and is the real-view acceptance subject of every builder node and of R1-INT. CONTROL-B
    is chosen by the orchestrator only at R1-MB dispatch and is never shown to builders, so the OD-BR-05 s9 demonstration
    cannot have been tuned for'
  shared_files: govbridge/cli.py is edited in sequence RX -> GA1 -> RS -> RA; govbridge/compile/packet.py in sequence RX
    -> RM -> GA3; govbridge/compile/{receipt,validate}.py in sequence RM -> RS; never co-edited
  tests: never pipe without set -o pipefail; every wait bounded with a timeout action; no rm
  size_limit: no committed file over 5 MB; stores, venvs and models live under $HOME/.cache/gov-bridge/
  model_pinning: every dispatched role is spawned with an explicit model (routing below); unpinned roles are not accepted
build_node_count: 10
build_node_count_rationale: RX, RN, RL, RM, RG, GA1, GA2, GA3, RS, RA -- one node per disjoint scope. Gather is split in
  three (core / follow-up and merge / compile integration) because each part is L-sized and they are strictly sequential.
  RN stays its own node because GA3 and the verifier both consume its schema. Protocol nodes (CTRL, DEC, TA2, INT, MB, D2,
  DEMO2, GRADE2) are not builders.
parallel_groups:
  R1-PG0:
  - R1-CTRL
  - R1-DEC
  - R1-RN
  R1-PG1:
  - R1-RX
  - R1-RL
  - R1-RG
  - R1-TA2
  R1-PG2:
  - R1-RM
  - R1-GA1
  R1-PG3:
  - R1-GA2
  - R1-RS
  R1-PG4:
  - R1-GA3
  - R1-RA
  R1-PG5:
  - R1-INT
  R1-PG6:
  - R1-MB
  R1-PG7:
  - R1-D2
  R1-PG8:
  - R1-DEMO2
  R1-PG9:
  - R1-GRADE2
traceability:
  OD-BR-05:
    s1_query_decomposition:
