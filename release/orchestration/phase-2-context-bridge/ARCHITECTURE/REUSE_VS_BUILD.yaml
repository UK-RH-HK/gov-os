schema: govbridge-reuse-vs-build/1
run_id: BR-AR-0001
decision_vocabulary:
  REUSE: used as-is, from path@commit, never modified (a file outside the domain is executed or read from its blob, never edited)
  ADAPT: copied into the domain with its provenance {path, commit, blob}; the listed changes are applied to the COPY only
  BUILD: new code inside release/orchestration/phase-2-context-bridge/
  NOT_NEEDED: deliberately not provided, with the reason
evidence_key: SO-NN = ARCHITECTURE/spike-outputs/NN-*.out (command, exit code and sha256 in AGENT_RUNS/BR-AR-0001.checkpoint.yaml)
corpus_statement:
  scope: WHOLE canonical repository (OC-BR-02), not a Review-8 subset -- every tracked blob reachable from the canonical
    view's trees, filtered only by config/corpus-rules.yaml (ARCHITECTURE.md section 1)
  measured:
    records_ref_6e7a2a3: {tracked_files: 6585, included: 6507, included_bytes: 74339472, included_lines: 1278604}
    product_ref_3c880d8: {tracked_files: 6567, included: 6489, included_bytes: 75388702, included_lines: 1288847,
      excluded: {X-SEC-CONTENT: 65, X-SEC-PATH: 2, X-BINARY: 5, M-LARGE: 6}}
    evidence_ref_58219d5: {tracked_files: 6572, included: 6494, included_bytes: 75436594}
    union_three_named_refs: {unique_included_blobs: 5787, bytes: 77275503}
    union_98_refs_incl_95_phase2_tips: {unique_included_blobs: 6501, bytes: 99359337}
  evidence: [SO-04, SO-05, SO-14]
  coverage_node: D1 (IMPLEMENTATION_DAG.yaml) -- files included, files excluded by rule, unclassified (must be 0)
