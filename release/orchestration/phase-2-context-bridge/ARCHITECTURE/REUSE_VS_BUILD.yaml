capabilities:
- capability: canonical worker bootstrap
  decision: ADAPT
  source: release/orchestration/phase-2/tools/worker_bootstrap.py@6e7a2a3
  change: copy to govbridge/compile/bootstrap.py; keep verbatim-quote discipline, conventions, checkpoint protocol and
    completion semantics; replace phase_state()'s hard-coded text with structured state lookups (with provenance) and
    the fixed DECISIONS dict with the resolver's section A
  rationale: the canonical one-text bootstrap already exists and caches at 98-99% (V8.3 section 2.3); its only defect is
    hard-coded state
  evidence: SO-01; worker_bootstrap.py:131-139
  node: B6
- capability: deterministic mandatory-authoritative-input resolver
  decision: BUILD
  reuse_within: UniqueKeyLoader + canonical_hash from the bridge's tools/check_state.py (REUSE, imported)
  rationale: no existing resolver reads the bridge state's mandatory lists with section scoping and authority classes;
    the product's W3 resolver (runtime/src/context/manifest.rs) needs an adopted project (SO-03); its FIELD NAMES are adopted
  evidence: SO-03; runtime/src/context/manifest.rs:7-24
  node: B5
- capability: structured current-state lookup
  decision: BUILD
  reuse_within: UniqueKeyLoader, canonical_hash (tools/check_state.py); git blame for per-key freshness
  rationale: state keys age independently (SO-01 shows a stale RUNNING row beside a FROZEN lifecycle); the lookup must
    return provenance and last-change per key
  evidence: SO-01
  node: B5
- capability: exact retrieval
  decision: BUILD
  reuse_within: git (git show / git grep -F / git cat-file --batch) -- REUSE of the tool, thin wrapper
  rationale: Git is the source of truth; exact retrieval by path/ref/ID/literal is a wrapper, not an engine
  evidence: SO-04 (cat-file batch reads 5,787 blobs in seconds)
  node: B1
- capability: lexical retrieval
  decision: BUILD
  reuse_within: sqlite3 FTS5 (stdlib); MEMORY_POLICY lexical tokenizer and retrieval parameters (REUSE as data)
  rationale: measured 9.5 s build / 5-6 ms queries over 78k chunks
  evidence: SO-16; MEMORY_POLICY.yaml:15,20-26
  node: B2
- capability: dependency/impact graph traversal
  decision: BUILD
  reuse_within: Contract v3 C2 relationship vocabulary; SKL-IMPACT-ANALYSIS method (seed/traverse); W1 identity fields
  rationale: no invocable graph over records+code across refs exists (product graph needs an adopted project)
  evidence: SO-03, SO-17
  node: B5
- capability: semantic/vector retrieval on the existing replaceable architecture
  decision: ADAPT
  source: capabilities/python/govos_capabilities/embed_sentence_transformers.py@6e7a2a3 (+ plugin.py protocol, PROTOCOL.md model/runtime declarations)
  change: copy to govbridge/semantic/adapters/onnx_embed.py; replace the sentence-transformers backend with ONNX Runtime
    CPU + the pinned bge-small-en-v1.5 artefacts; keep the gov-capability/1 request/response and fail-closed codes;
    add mode query|passage (query prefix) and PIN_MISMATCH
  rationale: the D-0006 architecture exists and runs but its only neural plugin is not operational; one provisional
    model is permitted by the launcher's semantic bootstrap rule
  evidence: SO-02, SO-08, SO-09, SO-10, SO-11, SO-18; SEMANTIC_ROUTE.md
  also_reused: capabilities/python/govos_capabilities/embedder_hashed_ngram.py@6e7a2a3 -- REUSE as a deterministic
    TEST DOUBLE only; never substituted for the real route (D-0005 fail closed)
  node: B4
- capability: code/symbol/reference retrieval
  decision: BUILD (Rust) + REUSE (Python)
  source: capabilities/python/govos_capabilities/code_intel_python_ast.py@6e7a2a3 (REUSE, executed from its blob, unmodified)
  build: govbridge/code/adapters/rust_treesitter.py -- a gov-capability/1 code_intel adapter on pinned tree-sitter
    0.25.2 + tree-sitter-rust 0.24.0; symbol/call/literal tables; labelled resolution; lazy per-commit symbol history
  rationale: measured 1.56 s parse of all 217 .rs files at 3c880d8 from Git blobs, no build; rust-analyzer/SCIP needs a
    working tree + cargo check + a toolchain component outside the cache
  evidence: SO-06, SO-12, SO-13, SO-20
  node: B3
- capability: authority filtering
  decision: BUILD
  rationale: the class ladder + non-ladder classes (verbatim from mandatory_bridge_inputs.authority_classes) +
    admissibility constants + independent validator; nothing existing implements the bridge's class vocabulary
  evidence: ORCHESTRATOR_STATE.yaml mandatory_bridge_inputs; ARCHITECTURE.md section 5
  node: B5 (classes, registry) + B6 (validator)
- capability: lifecycle current-vs-superseded filtering
  decision: BUILD
  reuse_within: spec/decisions metadata fields; cited registry for supersessions records do not carry
  rationale: the four known supersessions are not machine-readable in their targets' own metadata (SO-19)
  evidence: SO-19; ARCHITECTURE.md section 5.2
  node: B5
- capability: provenance
  decision: BUILD
  rationale: part of the identity model -- every unit carries (ref, commit, path, blob, lines, sha256); W1's nine attributes
  evidence: ARCHITECTURE.md section 2; runtime/src/graph/identity.rs:1-20 (vocabulary adopted)
  node: B1 (occurrence/blob/chunk identity) + B5 (record identity)
- capability: bounded context compiler (A-J)
  decision: BUILD
  reuse_within: CONTEXT_POLICY packet_blocks semantics (deterministic_authority vs retrieved_intelligence), max budgets as
    data; MEMORY_POLICY fusion parameters
  rationale: no compiler emits the launcher's ten sections with authority-typed items
  evidence: CONTEXT_POLICY.yaml:8-13
  node: B6
- capability: exact context manifest with IDs/versions/hashes
  decision: BUILD
  rationale: schemas/packet-manifest.yaml; W4 fields
  evidence: Contract v3 W4 (lines 1106-1112)
  node: B6
- capability: context-packet provenance/hash
  decision: BUILD
  rationale: packet_sha256 + manifest_sha256 + per-section read tokens (same component as the manifest)
  evidence: schemas/packet-manifest.yaml
  node: B6
- capability: worker consumption receipt
  decision: BUILD
  reuse_within: product W5 receipt FIELD NAMES (runtime/src/context/receipt.rs:7-17); the bridge's typed-return
    discipline (tools/check_state.py integrate-check)
  rationale: the product validator needs an adopted project; field compatibility keeps promotion cheap
  evidence: SO-03; receipt.rs:7-17
  node: B6
- capability: checkpoint/renewal support
  decision: BUILD
  reuse_within: the bridge checkpoint format ({cmd, exit_code, output_path, output_sha256}) for run checkpoints;
    worker_bootstrap.py's CHECKPOINT_PROTOCOL text (via the ADAPT)
  rationale: delta packets keyed by (item_id, content_sha256) and RENEW_NOOP need the manifest; nothing existing does this
  evidence: V8.3 evidence package section 2.4 and 3.3 (renew() in api_worker.py is API-worker-only)
  node: B6
- capability: historical lesson/failure retrieval
  decision: BUILD
  rationale: a traversal PROFILE over existing units (review sections, ledger entries, WITHDRAWN/SUPERSEDED records,
    DELETED_IN symbols, lessons/) -- no separate store, no LLM extraction
  evidence: ARCHITECTURE.md section 6.3; SO-17
  node: B5
- capability: system-purpose chain
  decision: BUILD
  rationale: deterministic traversal in the owner's order over labelled edges; MISSING links printed, never filled
  evidence: ARCHITECTURE.md section 6.2
  node: B5
- capability: rebuild/freshness telemetry
  decision: BUILD
  reuse_within: git rev-parse / diff-tree for change detection; MEMORY_POLICY.rebuild.must_reproduce_manifest_hash
  rationale: NOOP detection must be LLM-free (OD-P2-10 section 11)
  evidence: MEMORY_POLICY.yaml:39-40
  node: B1 (freshness, build manifest) + I1 (committed telemetry rows)
- capability: whole-repository corpus rules + coverage measurement (OC-BR-02 addendum)
  decision: BUILD
  reuse_within: SECURITY_POLICY secret_path_patterns / secret_content_patterns / never_index_classes; ARCHIVE_POLICY;
    .gitignore; product_identity.py PRODUCT_CODE (canonical partition)
  rationale: spike corpus_measure.py proved the rules on the real repository at 98 refs in 17 s
  evidence: SO-04, SO-05, SO-14
  node: B1 (rules, coverage) + D1 (coverage measurement run)
not_needed:
- item: reranker
  reason: MEMORY_POLICY.reranker.provider is none; Phase 3 may add one behind gov-capability/1 rerank
- item: invoking the product gov memory/context engine
  reason: ARCHITECTURE.md section 0.2 (not adopted; would perturb the adoption-floor store; circular; single tree)
- item: rust-analyzer / SCIP precise index
  reason: needs a working tree, cargo check and a toolchain component outside the cache; tree-sitter meets the need with labelled heuristics (SO-12)
- item: vector database server
  reason: brute-force cosine over ~33k x 384 float32 (~50 MB) is milliseconds
- item: GPU inference
  reason: CPU gives measured bitwise determinism (SO-09, SO-10), which rebuild reproducibility depends on
- item: a second embedding model / bake-off
  reason: forbidden by the launcher; Phase 3 evaluates alternatives behind the same adapter
- item: prep_packet.py / api_worker.py
  reason: write into release/orchestration/phase-2/; API-worker route paused
- item: LLM query planning, LLM summarisation, automatic lesson extraction
  reason: OD-P2-10 section 11 (deterministic filtering before model reasoning); cost
- item: daemons/watchers, cross-project memory, MCP server, UI
  reason: freshness is on demand; V8.3 section 11; D-0004 defers MCP; out of scope
- item: redaction-and-index of secret-content-matching files
  reason: SECURITY_POLICY.yaml:27 block_index_and_report and OC-BR-02 ("anything policy marks non-indexable"); the 8
    excluded product files stay reachable by exact metadata (ARCHITECTURE.md section 1.1)
