schema: govbridge-schema/1
describes: govbridge-oracle/1
purpose: >-
  The HELD-OUT oracle for a demonstration case. Written by a fresh test-author from primary sources, stored outside
  every worktree until grading, committed first only as a sha256 commitment (DEMONSTRATION_DESIGN.md section 1).
  Generic: nothing in this schema is specific to Review 8.
anchor:
  kind: 'code | test | record | contract | evidence'
  commit: full 40-hex commit the anchor was verified at
  path: repository path
  lines: '[start, end] (optional for record anchors given by id/section)'
  symbol: 'qualified symbol (optional)'
  record_id: 'record id or ID#local (optional)'
  section: 'heading text (optional)'
  why: required for traps, wrong entries and alternative enforcement points
fields:
  schema: {type: const, value: govbridge-oracle/1, required: true}
  oracle_id: {type: string, required: true}
  author: {type: '{run_id, role: test-author, model_observed}', required: true}
  commits: {type: '{product, records, evidence}', required: true}
  written_from: {type: list of anchors actually read, required: true}
  line_tolerance: {type: int, default: 3}
  chains:
    type: list
    required: true
    item:
      query_id: string
      stages:
        type: 'list, exactly the 11 chain stages of demonstration-queries.yaml, in order'
        item:
          stage: one of the 11 stage names
          required: bool
          is_enforcement_point: 'bool; exactly one true per chain'
          anchors: '{any_of: [anchor]} or {all_of: [anchor]}'
          must_state: list of short factual statements
          traps: 'list of anchors (with why) that are upstream representations; citing ONLY these at the enforcement stage = UPSTREAM_ONLY'
          wrong: list of anchors (with why)
      acceptable_alternative_enforcement_points: list of anchors (with why)
      effective_behaviour: '{subject, attribute, before, after, evidence: anchor}'
  side_by_side: {type: '{query_id, shared_points: [anchor], differing_points: [anchor]}', required: true}
  f1_both_ways: {type: '{query_id, purpose_anchors: [anchor], consumer_anchors: [anchor + {process: in|cross, production: bool}]}', required: true}
  queries: {type: 'list of {query_id, required: [id|anchor], forbidden: [id|anchor + why], must_state: [..]}', required: true}
  authority_expectations: {type: 'list of {item, sections: [A|B|C|D.1|D.2|D.3|E|F|G|H], class}, one per mandatory_bridge_inputs item', required: true}
  controls: {type: 'list of {query_id, required, forbidden, must_state}', required: true}
prohibited_content: an oracle asserts facts and anchors only -- no classification of findings, no disposition, no remedy
