schema: govbridge-schema/1
describes: govbridge-build-manifest/1
purpose: deterministic identity of an index build (Contract v3 D1, D6); NO timestamps (timestamps go to telemetry)
fields:
  view: '[{name, ref, role, follow, commit, tree}]'
  config_sha256: '{corpus-rules, canonical-view, id-grammar, authority-registry, embed-profile, budgets, model-pin, requirements.lock}'
  bridge_code_tree: git tree id of govbridge/
  pins: '{chunker_version, fts_tokenizer, code_adapters: [{id, version, grammar}], semantic: SEMANTIC_ROUTE.md section 4 block}'
  coverage: '{files_total, included, excluded_by_rule: {rule: n}, unclassified}'
  layers:
    occurrence: {rows: int, digest: sha256 over sorted rows}
    chunk: {rows: int, digest: sha256}
    symbol: {rows: int, digest: sha256}
    call_site: {rows: int, digest: sha256}
    literal: {rows: int, digest: sha256}
    record_def: {rows: int, digest: sha256}
    edge: {rows_by_derivation: map, digest: sha256}
    classification: {rows: int, digest: 'sha256 over (unit, class, lifecycle)'}
    vector: {rows: int, digest: 'sha256 over sorted (chunk_id, sha256(vec))', status: 'BUILT | UNAVAILABLE'}
  manifest_sha256: sha256 of this manifest with manifest_sha256 set to null
acceptance: two from-clean builds at the same view give an equal manifest_sha256; an incremental build V1->V2 equals a from-clean build at V2
