schema: govbridge-schema/1
describes: govbridge-packet-manifest/1
purpose: exact record of what a worker was supplied (Contract v3 W4); canonical JSON, sorted keys, NO timestamps
fields:
  packet_schema: {type: const, value: govbridge-packet-manifest/1}
  task_spec_sha256: {type: sha256}
  view: {type: list, desc: '[{name, ref, role, commit}] as resolved for this compile'}
  build_manifest_sha256: {type: sha256, desc: the index build the routes read}
  bridge_code_tree: {type: git tree id of govbridge/ at the compiling commit}
  config_sha256: {type: map, desc: sha256 per config file used}
  budget_profile: {type: string}
  retrieval_exclusions: {type: list}
  status: {type: 'enum: OK | BLOCKED | BLOCKED_BUDGET', desc: BLOCKED names every missing or mismatched mandatory input}
  sections:
    type: map A..J
    each:
      title: string
      subblocks: 'D only: D.1 decisions, D.2 OWNER_DIRECTION_TO_TEST, D.3 HYPOTHESIS_TO_TEST'
      queries: '[{route, text, k, filters, profile}] that produced the section (empty for A, I, J)'
      items:
        item_id: sha256(unit id | section | delivery)[:24]
        unit: '{kind: occurrence|section|record|chunk|symbol|edge-path, id}'
        delivery: 'MANDATORY (resolver) | PINNED (mandatory, non-authoritative) | RETRIEVED | DERIVED'
        authority_class: exact class name (ARCHITECTURE.md section 5.1)
        lifecycle: ACTIVE|SUPERSEDED|WITHDRAWN|PROPOSED|HISTORICAL|UNKNOWN
        version_status: CANONICAL|CANONICAL_FALLBACK|SAME_AS_CANONICAL|HISTORICAL_VERSION|HISTORY_ONLY
        source: '{ref, commit, path, blob, line_start, line_end}'
        content_sha256: sha256 of the delivered bytes
        bytes: int
        by_reference: bool (true => content not inlined; reader must read and acknowledge the sha256)
        route: 'exact|lexical|semantic|graph|code|resolver|state'
        score: '{raw, rank, fused}'
        edge_path: '[{src, type, dst, derivation}] for graph-derived items'
        banner: the mandatory class banner text, if any
      dropped: '[{item_id, unit, reason: BUDGET|DUPLICATE|EXCLUDED, score, bytes}]'
      section_sha256: sha256 of the rendered section body (without its read-token line)
      read_token: 'derived, not stored -- sha256(manifest_sha256 | section letter)[:12], printed as the last line of the section; the manifest is never given to the worker'
  notices: '[CLASS_CONFLICT | LIFECYCLE_CONFLICT | DANGLING_ID | STALE_ANCHOR | EXCLUDED_BY_POLICY {…}]'
  manifest_sha256: sha256 of this manifest with manifest_sha256 and packet_sha256 set to null
  packet_sha256: sha256 of the final rendered packet bytes (bodies plus read-token lines); excluded from manifest_sha256
