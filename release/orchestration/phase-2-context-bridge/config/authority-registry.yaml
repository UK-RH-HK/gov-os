schema: govbridge-authority-registry/1
purpose: >-
  Explicit, cited authority/lifecycle assignments for what records do not carry machine-readably (ARCHITECTURE.md
  section 5.2 rule 2), plus path/type class rules (rule 4). Entries may only RESTRICT (add supersession, withdrawal,
  section scoping, a lower class); govbridge.authority.registry never raises a class from what a rule states. Every
  entry's quote is verified against the cited blob at build/load time (govbridge.authority.registry.load); a
  mismatch fails loudly. The class vocabulary is the one in ORCHESTRATOR_STATE.yaml mandatory_bridge_inputs.authority_classes
  plus the ladder classes of ARCHITECTURE.md section 5.1 (govbridge.authority.classes).
seeded_from: ARCHITECTURE/schemas/authority-registry.yaml seed_entries_verified_by_BR-AR-0001 (verified at 6e7a2a3 by
  BR-AR-0001's direct reads, checkpoint command 17); every quote below was independently re-read and re-verified by
  BR-AR-0007 (node B5) at the same commit before this file was committed, and is re-verified again on every load by
  govbridge.authority.registry.load (never trust-on-read).
verified_at_commit: 6e7a2a3495a8d3619759a95b7ed055da9c848618

