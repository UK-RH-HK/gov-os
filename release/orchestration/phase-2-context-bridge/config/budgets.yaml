schema: govbridge-budgets/1
purpose: >-
  Bounding policy for govbridge.compile (ARCHITECTURE.md section 7.3). Budgets are UTF-8 bytes (tokens ~= bytes/4).
  Both profiles sit inside the 50k-150k-token band V8.3 section 3.1 measured as sufficient. rrf_k,
  graph_neighbour_depth, parent_expansion_top_n and max_slice_chars are read as evidence from the frozen product's
  own MEMORY_POLICY.yaml (framework/policies/MEMORY_POLICY.yaml, outside this domain, never edited or imported at
  runtime) -- retrieval.rrf_k, retrieval.graph_neighbour_depth, retrieval.parent_expansion_top_n,
  retrieval.max_slice_chars.

rrf_k: 60                      # MEMORY_POLICY.yaml retrieval.rrf_k
graph_neighbour_depth: 1       # MEMORY_POLICY.yaml retrieval.graph_neighbour_depth
parent_expansion_top_n: 3      # MEMORY_POLICY.yaml retrieval.parent_expansion_top_n
max_slice_chars: 1600          # MEMORY_POLICY.yaml retrieval.max_slice_chars
per_item_cap_kb: 24            # ARCHITECTURE.md section 7.3: "The per-item cap is 24 KB."

# BR-AR-0015 reopening, defect 1: the worker reads RENDERED packet.md bytes, not the manifest's raw item-content
# byte count -- each rendered item also carries its "- unit: ...(delivery=..., route=..., class=..., lifecycle=...)"
# line, its "source: path@commit:L1-L2" line and any banner/reason lines (govbridge.compile.render._render_item_body).
# Budget enforcement (govbridge.compile.budgets._item_bytes) now measures that SAME rendered form, so a section's
# cap bounds what the worker actually reads. section_header_bytes is the fixed, per-SECTION allowance on top of the
# summed item bytes: the "## X. TITLE" line, the queries-log line (a section that runs task-spec queries embeds
# their {id,text,routes,k} JSON once, not per item), the drop-summary footer and the read-token line -- none of
# which are items, so none of which the per-item accounting above prices in.
section_header_bytes: 4096

profiles:
  # ARCHITECTURE.md section 7.3: "bounded-builder totals 100 KB, about 25k tokens." The architecture gives no
  # independent per-section citation for this profile; its section_caps_kb are scaled proportionally from
  # synthesis's own cited split (100/360), documented here rather than invented ungoverned.
  bounded-builder:
    total_kb: 100
    section_caps_kb: {A: null, B: 4, C: 11, D: 11, E: 7, F: 11, G: 33, H: 11, I: 3, J: 3}
    # BR-AR-0015 reopening, defect 2: fan-out caps bound CANDIDATE GENERATION per T1 symbol (never just the
    # rendered OUTPUT after the fact) -- govbridge.route.real_routes.code_route slices callers/callees/TESTS/
    # READS_KEY expansion to these counts, deterministically (by the same stable (path, line) order the underlying
    # B3 query already returns), before budget enforcement ever runs. This is also most of what cut the real-view
    # compile from ~8 minutes to seconds: the pipeline no longer proposes tens of thousands of candidates only to
    # discard nearly all of them.
    g_fanout: {max_callers: 3, max_callees: 3, max_tests: 2, max_reads_key_values: 2, max_reads_key_consumers: 3}

  # ARCHITECTURE.md section 7.3, cited verbatim: "synthesis totals 360 KB, about 90k tokens... allocates, in KB: A no
  # cap, B 16, C 40, D 40 (D.2/D.3 pinned), E 24, F 40, G 120, H 40, I 12, J 12."
  synthesis:
    total_kb: 360
    section_caps_kb: {A: null, B: 16, C: 40, D: 40, E: 24, F: 40, G: 120, H: 40, I: 12, J: 12}
    g_fanout: {max_callers: 6, max_callees: 6, max_tests: 4, max_reads_key_values: 3, max_reads_key_consumers: 6}

# BR-HO-0015 (G row, defect 3): "Placement looks at (class, lifecycle, delivery) only... A retrieved hit whose
# canonical occurrence is product code or a test lands in H". A RETRIEVED/DERIVED item whose occurrence path
# matches one of these (source-kind or test-path) rules is placed in G instead of H --
# govbridge.compile.codesurfaces.is_code_or_test_surface, applied only on packet.py's section == "H" fallback, so
# A/D.1/D.2/D.3/E/F placements are never touched. source_dirs reuses the SAME generic code-directory vocabulary
# govbridge.graph.derive.CODE_DIRS already uses for CODE_CITES scanning -- one list, never duplicated with a
# different membership. Generic (OC-BR-02): a versioned config list, never a hand-picked file/path.
code_test_surfaces:
  source_extensions: [".rs", ".py"]
  source_dirs: ["runtime/", "cli/", "framework/", "capabilities/", "migrations/", "tools/", "bin/", "scripts/"]
  test_path_globs: ["**/tests/**", "tests/**", "**/test_*.py", "**/*_test.py", "**/*_tests.rs"]

# REPAIR_DAG.yaml node R1-GA1 (OD-BR-05 section 4's stopping criterion, "explicit task/context budget reached, with
# unresolved coverage disclosed" -> BUDGET_REACHED_WITH_UNRESOLVED): govbridge.gather.engine's own overall retrieval
# budget for one query, independent of any one facet's batch_size. This is DELIBERATELY separate from
# profiles.<name>.total_kb above: that number bounds the FINAL, COMPILED packet AFTER facet quotas and content
# trimming (REPAIR_PLAN.md section 2.8, R1-GA3's job); gather intentionally fetches MORE than that so the compiler
# has something to select from, so tying gather's own stop condition to a compile profile would make its stopping
# point (and therefore its merged evidence set) depend on which profile a caller happens to be compiling for later --
# never desired, and never deterministic across an unrelated setting. A caller that DOES want gather bounded by a
# named compile profile may still opt in explicitly (govbridge.gather.engine.gather's own `budget_profile` argument);
# the CLI does not do this by default.
gather:
  max_items_per_query: 500
  max_bytes_per_query: 2000000   # ~2 MB of raw candidate text -- generous headroom well above any one compiled
                                  # packet profile, so an ordinary gather stops on facet coverage, not on this.
  # REPAIR_DAG.yaml node R1-GA1 reopening (task 2): a per-query WALL-TIME budget for the query's own DEFAULT facet
  # set (every registered facet -- config/facets.yaml's own class_facets default), --threads 4, --batch-size 8,
  # against the real store. Advisory only (govbridge.gather.engine does not itself enforce a wall clock; this is
  # the number an operator/CI wrapper times a gather call against). Justified by AGENT_RUNS/BR-AR-0023.
  # check7-controla-all-5-queries-default-facets.out -- all 5 CONTROL-A queries, full default facet set,
  # --threads 4 --batch-size 8, real store, each reaching FACETS_COVERED in 2 rounds:
  #   CA-WHY 93.25s (118 items)  CA-REQ 76.81s (97 items)   CA-ENF 96.17s (107 items)
  #   CA-TESTS 47.74s (125 items)  CA-DEPS 89.06s (107 items)
  # max 96.17s, min 47.74s, mean ~80.6s, all comfortably under the 180s per-call ceiling those measurements were
  # taken with. wall_time_budget_seconds is set to 150s: above the measured max with a ~1.5x margin for a slower
  # machine/cold model-load/larger corpus growth, not a bare ceiling-match. The dominant cost is NOT this node's
  # own SQL work (post the R1-GA1 reopening's scope-index fix, a scoped facet's SQL query is sub-second -- see
  # govbridge.lexical.query._ensure_scope_indexes/govbridge.semantic.vectors._ensure_scope_indexes) but the
  # semantic route's embedding subprocess, spawned once per (facet, round); a query whose facets almost all need
  # semantic (govbridge.route.real_routes.semantic_route) is the realistic worst case this budget covers.
  wall_time_budget_seconds: 150
