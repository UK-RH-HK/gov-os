schema: govbridge-budgets/1
purpose: >-
  Bounding policy for govbridge.compile (ARCHITECTURE.md section 7.3). Budgets are UTF-8 bytes (tokens ~= bytes/4).
  Both profiles sit inside the 50k-150k-token band V8.3 section 3.1 measured as sufficient. rrf_k,
  graph_neighbour_depth, parent_expansion_top_n and max_slice_chars are read as evidence from the frozen product's
  own MEMORY_POLICY.yaml (framework/policies/MEMORY_POLICY.yaml, outside this domain, never edited or imported at
  runtime) -- retrieval.rrf_k, retrieval.graph_neighbour_depth, retrieval.parent_expansion_top_n,
  retrieval.max_slice_chars.

rrf_k: 60                      # MEMORY_POLICY.yaml retrieval.rrf_k
graph_neighbour_depth: 1       # MEMORY_POLICY.yaml retrieval.graph_neighbour_depth
parent_expansion_top_n: 3      # MEMORY_POLICY.yaml retrieval.parent_expansion_top_n
max_slice_chars: 1600          # MEMORY_POLICY.yaml retrieval.max_slice_chars
per_item_cap_kb: 24            # ARCHITECTURE.md section 7.3: "The per-item cap is 24 KB."

profiles:
  # ARCHITECTURE.md section 7.3: "bounded-builder totals 100 KB, about 25k tokens." The architecture gives no
  # independent per-section citation for this profile; its section_caps_kb are scaled proportionally from
  # synthesis's own cited split (100/360), documented here rather than invented ungoverned.
  bounded-builder:
    total_kb: 100
    section_caps_kb: {A: null, B: 4, C: 11, D: 11, E: 7, F: 11, G: 33, H: 11, I: 3, J: 3}

  # ARCHITECTURE.md section 7.3, cited verbatim: "synthesis totals 360 KB, about 90k tokens... allocates, in KB: A no
  # cap, B 16, C 40, D 40 (D.2/D.3 pinned), E 24, F 40, G 120, H 40, I 12, J 12."
  synthesis:
    total_kb: 360
    section_caps_kb: {A: null, B: 16, C: 40, D: 40, E: 24, F: 40, G: 120, H: 40, I: 12, J: 12}

# BR-HO-0015 (G row, defect 3): "Placement looks at (class, lifecycle, delivery) only... A retrieved hit whose
# canonical occurrence is product code or a test lands in H". A RETRIEVED/DERIVED item whose occurrence path
# matches one of these (source-kind or test-path) rules is placed in G instead of H --
# govbridge.compile.codesurfaces.is_code_or_test_surface, applied only on packet.py's section == "H" fallback, so
# A/D.1/D.2/D.3/E/F placements are never touched. source_dirs reuses the SAME generic code-directory vocabulary
# govbridge.graph.derive.CODE_DIRS already uses for CODE_CITES scanning -- one list, never duplicated with a
# different membership. Generic (OC-BR-02): a versioned config list, never a hand-picked file/path.
code_test_surfaces:
  source_extensions: [".rs", ".py"]
  source_dirs: ["runtime/", "cli/", "framework/", "capabilities/", "migrations/", "tools/", "bin/", "scripts/"]
  test_path_globs: ["**/tests/**", "tests/**", "**/test_*.py", "**/*_test.py", "**/*_tests.rs"]
