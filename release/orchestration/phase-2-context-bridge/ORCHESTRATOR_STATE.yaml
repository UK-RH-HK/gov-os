    G7 condition is silently disabled; query outputs are also not counted. Handling -- the GRADE brief requires the rubric
    grader to compute the packet-bytes check itself over the main packet plus every saved query output, and to report the
    defect; not repaired under the freeze (a verifier may require it)'
