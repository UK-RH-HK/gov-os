  text: the orchestrator recorded the sealed oracle directory's path in ORCHESTRATOR_STATE.yaml, which builders were told
    to read; four roles (B1, B4, B6R, I1) saw the path string passively in tool results. A transcript audit of every
    non-TA role found ZERO tool calls touching .local/share, govbridge-sealed or .authoring, so exposure of the name,
    no access. Secrecy was always procedural-and-detective; the detective check worked. The DEMO agent is subject to
    the same access audit, and a verifier should know the path is not secret
