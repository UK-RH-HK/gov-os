role: >-
  REPAIR-1 node R1-XC (BR-DAG-AMEND-R1-16/-17/-23) -- cross-cutting fixes: freshness -m entry point (R1-5), gitobj
  repo_root cache (R1-6), authority import-time config read (R1-12), thread-safe ExclusionCounter (R1-14),
  read-only code/classification query paths (R1-17 items 5 and 6), and one resolved view per operation (R1-23).
  Reopened FIVE times: R1-17(5) was narrowed on pass 1 (read-only variants added for gather's code route only,
  while ensure_indexed still lazily built at query time behind symbols.stats/definitions/callers/reads_key and in
  five external callers; a broad except in code_route also swallowed StoreNeedsRebuild) -- pass 2 makes
  ensure_indexed BUILD-ONLY everywhere and re-raises typed errors. Pass 3 (accepted pass 2's own six fixes; two
  follow-ups before merge): fixes the REAL cause of the one remaining full-suite flake (tests/compile/conftest.py's
  own GOVBRIDGE_STORE isolation, not the git-ref concord R1-RM already closed), applies the same fix to
  tests/graph/conftest.py once the same grep found the same bug there, uncovers and rule-5-corrects a hidden
  hermeticity bug in GD-10's own regression test that the store isolation fix exposed, and moves
  govbridge/graph/impact.py's own BFS store access to open_db_readonly() (scope explicitly extended by the
  coordinator) -- ALSO the pass where this run itself breached REPAIR-1 rule 6 (ran the system python3, not the
  pinned venv, misdiagnosed the result, pip-installed an unpinned package into a scratch venv) -- see findings for
  the correction, now closed via R1-T3 (BR-DAG-AMEND-R1-18). Pass 4 (BR-DAG-AMEND-R1-23, this pass): fixes
  govbridge/core/exact.py's grep()/id_lookup() re-resolving the "records" ref's live tip on every call (the
  confirmed cause of a single ~1031s gather recording four different "records" commits,
  AGENT_RUNS/BR-AR-0024.check-ca-why-wall-time-defaults.out), threads the ONE view real_routes.build_real_routes
  already resolves through exact_route/registrymod.load/lifecyclemod._load_mandatory_items, and audits (but per
  scope does not fix) every other tip-resolution site across govbridge/**. Pass 5 (this pass, BR-DAG-AMEND-R1-23
  extended to every audited site): fixes every remaining site pass 4's own audit found -- lexical/query.py,
  semantic/search.py, authority/lifecycle.py (a NEAR-FROZEN module, threaded minimally), gather/followup.py
  (removes its own second resolution outright), compile/packet.py (the most affected operation, now exactly one
  resolution for its whole lifetime), graph/why.py, graph/history.py, answers/cite.py and answers/lint.py -- then
  re-audits with two independent methods and finds zero remaining query-path tip re-resolutions.
