findings:
- >-
  RESOLVED this reopening (was an open finding on pass 1): govbridge/graph/code_bridge.py's
  build_shaped_code_connection no longer calls the BUILD-only _open_conn()/ensure_indexed() at query time -- it
  reads via _open_conn_readonly()/ensure_indexed_readonly(), and no longer swallows the resulting StoreNeedsRebuild
  internally (its own former `except Exception: return None` around exactly that call is removed). Confirmed by
  AGENT_RUNS/BR-AR-0034.check16 (tests/route/test_query_commands_readonly.py, run against pass 1's own final commit
  a72dae24c168f6445c03ea04fdf4645c1fa063e7 as the baseline -- the reopening's own narrowed state, not the pre-pass-1
  one): the store-succeeds scenario fails outright with `sqlite3.OperationalError: attempt to write a readonly
  database` (from symbols.py's own lazy `_open_conn()`/`ensure_schema()`), and the missing-code-layer scenario
  fails with `DID NOT RAISE StoreNeedsRebuild`. .check17/.check18 show the identical test file, unchanged, passing
  4/4 against the current, fixed tree.
- >-
  RESOLVED this reopening (was open issue 2 on pass 1): govbridge/route/real_routes.py's code_route no longer
  wraps codesymbols.definitions(...)/callers(...) (nor _shaped_code_conn's own two internal calls) in a bare
  `except Exception`. Every one of the four call sites now re-raises StoreNeedsRebuild specifically, catches only
  ValueError (a commit that does not resolve -- genuinely nothing to retrieve) as an expected degrade-to-empty
  case, and counts any OTHER exception via a new module-level helper, _record_unexpected_exception, which writes
  {event, site, exception_type, ...} to the shared local telemetry sink (govbridge.core.telemetry, kind="queries")
  -- never silently. Proven end-to-end by tests/route/test_query_commands_readonly.py (new): impact/compile/
  gather(code)/symbols.callers/symbols.definitions each raise the typed error on a store built without the code
  layer, and none of them writes a byte to the store file even in that failure path.
- >-
  NEW finding, this reopening: govbridge/compile/packet.py's compile_packet has its OWN, THIRD code-route call
  site this run had not previously inspected -- the main per-seed retrieval, `c.routes.run("code",
  seeds=seed_names, ...)` (packet.py, unconditional for every task-spec seed) -- which is NOT wrapped in any
  try/except at all (unlike the file's other two code-route touchpoints, Compiler.code_seeds_for and .code_conn,
  which DO still swallow broadly for a documented, separate "honest MISSING" contract deriving EXTRA seeds from a
  record's citations). This means `compile` ALREADY correctly raises StoreNeedsRebuild when the code layer is
  missing, via this one, unwrapped call -- confirmed empirically
  (tests/route/test_query_commands_readonly.py::test_compile_raises_store_needs_rebuild_when_the_code_layer_is_missing),
  not assumed from the two swallowing call sites alone. Recorded here because the assumption in this run's own
  first-pass findings (that compile would need packet.py edited, out of scope, to raise) was wrong, and the
  correction is worth keeping visible for whoever next reads packet.py's exception shape.
- >-
  RESOLVED this (third) reopening (was a NOT-fixed finding on pass 2, scope was extended to
  govbridge/graph/impact.py by the coordinator's own explicit instruction): impact()'s authority-graph BFS now
  opens the store via `store.open_db_readonly()` instead of `store.open_db()`. No before/after test failure
  exists to demonstrate here -- as the pass-2 finding itself already said, `store.open_db()`'s own "tolerate a
  read-only FILE by catching each write attempt" behaviour meant impact() never actually crashed or wrote against
  the file+directory read-only acceptance fixture either. This is a construction-level hardening fix for
  consistency with the other six query paths this node already closed, not a repair of an observed defect;
  reported honestly as such rather than manufacturing an artificial regression test. Verified: `impact` is
  exercised by tests/route/test_query_commands_readonly.py in BOTH scenarios already (the file-level read-only
  success case and the missing-code-layer StoreNeedsRebuild case -- the latter via impact()'s OWN unrelated
  code-route call through code_bridge, not the BFS this fix touches); tests/route/test_task_exclusions.py's own
  unit test for impact()'s exclusion filtering continues to pass after a one-line, purely mechanical rename of
  its monkeypatch target (`store.open_db` -> `store.open_db_readonly`) needed to keep mocking the function
  actually called (see decisions D-R1-XC-8; that file is not in this run's own recorded mutation_scope).
- >-
  NEW finding, this (third) reopening, root cause of the reopening's own follow-up 1: the coordinator correctly
  diagnosed that tests/compile/test_compile_real_view_mandatory_in_a.py's byte-identical flake was caused by
  Compiler.code_conn/code_seeds_for reading the machine-wide default store. Tracing WHY that module's own
  GOVBRIDGE_STORE was never isolated led to the actual root cause: tests/compile/conftest.py's own `_no_env_leak`
  autouse fixture only ever called `monkeypatch.delenv("GOVBRIDGE_STORE", raising=False)` -- this stops a value
  already exported in the surrounding shell from leaking IN, but does nothing to stop ANY test in the whole
  tests/compile/** package that never sets GOVBRIDGE_STORE itself from falling through to the shared default. An
  earlier attempt at fixing ONLY test_compile_real_view_mandatory_in_a.py, by adding a module-scoped
  `pytest.MonkeyPatch()` fixture directly in that file, was itself silently defeated by this same conftest
  fixture: pytest runs a function-scoped autouse fixture's own setup AFTER any wider-scoped one for the same test,
  so `_no_env_leak`'s `delenv` call ran (and deleted the override) every single test, after the module fixture had
  already set it. That earlier attempt happened to report "2 passed" (165.65s) purely because nothing else
  touched the shared default store in that particular window, not because the isolation had taken effect --
  confirmed empirically by instrumenting the exact ordering (a throwaway probe test asserting
  os.environ["GOVBRIDGE_STORE"] during the test body itself, checkpoint commands `check19`/`check20`, and see
  lessons). The real fix is at the conftest level: `_no_env_leak` now `setenv`s a fresh `tmp_path`-derived
  directory for EVERY test in the package (function-scoped, so it always wins the ordering race), matching the
  isolation tests/code/conftest.py and tests/lexical/conftest.py already gave their own packages; the
  now-redundant, non-functional module-level fixture in test_compile_real_view_mandatory_in_a.py itself was
  removed rather than left as dead/misleading code.
- >-
  NEW finding, this (third) reopening: the SAME delenv-only (not isolating) pattern existed in
  tests/graph/conftest.py -- and tests/graph/** IS in this run's own mutation_scope. test_code_bridge.py/
  test_symbol_history.py's own bare `corestore.open_db()` seeding calls were exposed to the identical shared-store
  risk. Fixed the same way (checkpoint commands `check21`/`check22` prove the same before/after). The identical
  delenv-only pattern also exists in tests/authority/conftest.py, tests/notes/conftest.py, tests/semantic/
  conftest.py and tests/core/conftest.py -- but a careful check of every test file in each of those four
  directories found NONE that currently relies on it (every test that actually touches the store either passes an
  explicit `root=`/`repo=`-scoped path that bypasses GOVBRIDGE_STORE resolution entirely, e.g.
  tests/core/test_manifest.py and tests/graph/test_traverse.py's own `sqlite3.connect(":memory:")`, or sets
  GOVBRIDGE_STORE itself per-test via its own helper, e.g. tests/core/test_scope_path_cache.py's
  `_built_minimal`). Those four directories are NOT in this run's mutation_scope (only specific named files
  within tests/authority and tests/core are); the delenv-only fixture is a latent trap for any FUTURE test added
  to those packages that forgets its own explicit setenv, not a currently-active bug -- routed to open_issues
  rather than fixed, exactly as instructed for anything outside this run's own scope.
- >-
  NEW finding, this (third) reopening, uncovered BY the tests/integration/test_demo_grade_regressions.py store
  isolation fix (not caused by it): `test_gd10_a_line_citation_inside_a_function_matches_that_functions_symbol_
  anchor` called `grademod.anchor_matches` directly against a commit whose code layer this test never built
  itself. It passed before only because this file's own (also delenv-only) `_no_env_leak` fixture let it read the
  machine-wide shared default store, which some OTHER, unrelated, concurrently- or previously-run test (most
  likely another compile_repobuilder-based fixture producing the identical deterministic commit SHA) had already
  built that exact commit's code layer into -- a hidden, test-order/other-process-dependent pass, not a genuine
  one. Isolating this file's own GOVBRIDGE_STORE (this run's own authorized fix, see decisions) turned that hidden
  reliance into a deterministic, 100%-reproducible failure: `_enclosing_symbol`'s own (pass-2, unchanged)
  `ensure_indexed_readonly` correctly raised `StoreNeedsRebuild` for the never-built commit, `_enclosing_symbol`'s
  own deliberate `except Exception: return None` swallowed it (exactly as GD-10's own grading contract intends),
  and `anchor_matches` therefore saw no enclosing symbol at all and wrongly returned `False`. Corrected (rule 5,
  decisions D-R1-XC-9) by giving the test its own `_eager_build_code_layer` helper, called before `anchor_matches`
  -- mirroring the SAME eager-build pattern pass 2 already applied to six other pre-existing test files for the
  exact same underlying reason (ensure_indexed's own BUILD-ONLY conversion). Checkpoint commands `check23`
  (isolated store, no eager build: FAILS, confirming the hidden reliance) / `check24` (fully fixed: PASSES) prove
  this precisely, isolating the eager-build fix's own necessity from the unrelated isolation fix.
- >-
  IMPORTANT operational finding, this (third) reopening, NOT a code defect in this domain -- reported for the
  orchestrator's own visibility, since it materially affects every OTHER concurrently-running agent's own test
  runs, not only this one: partway through this pass, the shared system Python interpreter (bare `python3`, no
  venv, used by every agent in this multi-agent session per this run's own prior findings about the shared
  default store) was found to be missing `tree_sitter_rust`, `tree_sitter`, `onnxruntime` and `tokenizers`
  entirely (`ModuleNotFoundError` at collection/first-use). These are `config/requirements.lock`'s own
  hash-pinned, bootstrap-time dependencies (the lock file's own header: "Installed... so the shared venv is never
  touched again after B1's bootstrap runs") -- nothing in this run's own commits touches dependency installation,
  and no install/uninstall process was found running at the time. The most likely explanation, given this
  environment's own documented multi-agent concurrency, is that something reset or reinstalled the shared
  interpreter's site-packages during this session; this was NOT investigated further as it is outside this node's
  own domain. Worked around, for THIS run's own verification only, via a session-private venv
  (`python3 -m venv --system-site-packages`, so every OTHER already-correct package is inherited unchanged) with
  the four missing packages installed at config/requirements.lock's own exact pinned versions -- the shared system
  interpreter itself was never touched (this session's own tool-permission classifier denies "Modify Shared
  Resources" writes, and installing system-wide would need `--break-system-packages` on this PEP-668-managed host
  regardless, which was not attempted). Recommend the orchestrator have whoever owns the shared machine re-run
  `bootstrap/bootstrap.sh` (or `pip install --require-hashes --no-deps -r config/requirements.lock`) against the
  actual shared interpreter -- every other concurrent agent's own test suite will otherwise see the identical
  collection failures on any test that reaches the code or semantic layers.
- >-
  UNCHANGED from pass 1: govbridge/authority/classes.py's BRIDGE_STATE_PATH is a process-wide-cached lazy value
  (computed on first ACCESS, via a module __getattr__, never at import time), not a fully uncached per-access
  recompute -- BR-DAG-AMEND-R1-12 asks for "lazy or path-explicit" specifically to stop the FIRST IMPORTER's
  environment from fixing the process-wide result; deferring the read to first ACCESS (by an actual consumer,
  never an unrelated importer like govbridge.code.lineage_layer/govbridge.graph.derive) fully closes that race.
  Caching thereafter is deliberate (this value sits on a potential per-hit hot path via authority.layer.
  classify_hit/record_id_for_occurrence, and every real domain/test fixture already treats it as a fixed
  convention) -- recorded as decision D-R1-XC-3, unchanged this reopening.
