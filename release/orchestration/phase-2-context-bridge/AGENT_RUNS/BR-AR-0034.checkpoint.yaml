  lesson in self-review discipline (see `lessons`): reviewing one's own fix for internal consistency (does THIS
  function itself resolve once, not just "does it accept a resolved_view parameter and pass it somewhere") is a
  distinct check from confirming every downstream callee accepts the parameter.
lessons:
- >-
  When a fix note says "X must not build/write at query time," trace EVERY caller of X across the whole domain
  before declaring the fix complete, not just the one call site the acceptance check's own example happens to
  name. Pass 1 fixed the code route's own two calls (definitions/callers) and missed five OTHER modules
  (code/history.py, compile/codeseeds.py, graph/code_bridge.py, graph/symbol_history.py, demo/grade.py) that called
  the exact same function for the exact same reason -- a `git grep` for the function's own name across
  `govbridge/**`, not just within the one file the brief's example pointed at, would have caught this on pass 1.
- >-
  Before assuming a pre-existing broad `except Exception` makes a caller "gracefully degrade" instead of raise,
  trace to the ACTUAL call site the acceptance scenario exercises, not just the first one found while reading the
  file -- a module can have several code-route touchpoints with DIFFERENT exception-handling shapes (packet.py's
  `code_seeds_for`/`code_conn` swallow; its own main per-seed `routes.run("code", ...)` does not). The wrong
  assumption here was caught immediately by writing a test FIRST and watching it fail for the opposite reason
  expected, before it was reported as a finding rather than corrected.
- >-
  A GIL-based "not thread-safe" defect does not always reproduce empirically via a pure busy-loop stress test on a
  modern CPython interpreter (3.12's specializing adaptive interpreter can make a tiny slots-attribute `+=` appear
  atomic in practice). A deterministic, structural test (assert the lock exists and that a concurrent call
  genuinely blocks on it) is the reliable "fails before, passes after" proof REPAIR-1 requires when the dynamic
  reproduction is unreliable -- accepted by the orchestrator on pass 1, unchanged this reopening.
- >-
  A module-scoped (or session-scoped) `pytest.MonkeyPatch()` override of an environment variable can be silently
  defeated by a WIDER-package's own function-scoped autouse fixture that touches the SAME variable -- pytest runs
  a function-scoped fixture's setup AFTER any wider-scoped one for the same test, so a later `delenv`/`setenv`
  call wins the ordering race even though it is declared at a NARROWER scope. Do not assume a locally-added
  override "worked" merely because the test it targets passed once -- verify what the environment actually is
  DURING the test body (a throwaway assertion probe, as used here) rather than inferring correctness from a green
  run alone, especially when a pre-existing, wider-scoped autouse fixture in the same package could plausibly be
  touching the same variable. The correct fix, when this happens, is almost always at the WIDER (conftest) scope,
  not a narrower one trying to out-run it.
- >-
  Isolating a test's environment (e.g. giving it its own private GOVBRIDGE_STORE) can convert a previously
  "passing" test into a deterministic failure -- this is not the isolation fix breaking something; it is the
  isolation fix REVEALING that the test was never actually correct on its own, only accidentally correct via
  unintended reliance on shared, external state (another test's, or another process's, side effects on a store
  neither test nor process was ever supposed to share). When this happens, the correct response is to fix the
  test's own missing setup (rule 5), not to weaken the assertion or revert the isolation fix.
- >-
  A "byte-identical across a moved vs. unmoved run" control comparison needs the SAME repo/commit content in both
  runs, not two separately-built fixtures -- ``followup_repobuilder.build()`` (and every git-commit-based fixture
  builder in this domain) stamps a real commit with a real timestamp, so two independent ``build()`` calls
  produce two DIFFERENT commit shas for otherwise-identical content, making any hash-based determinism comparison
  across them meaningless. The fix is to reuse ONE built repo for both the "moved" and "control" runs, restoring
  the moved ref back to its original commit (``git update-ref``, never a checkout -- nothing in this domain reads
  the working tree, only git plumbing) between them, rather than building a second, superficially-identical repo.
- >-
  A query's own explicit `routes: [...]` field only RESTRICTS which routes a facet may use for that query; it can
  never make a facet invoke a route the facet's own config (`config/facets.yaml`) does not itself list. Neither
  the real config nor this domain's own lexical-only test fixture (`tests/fixtures/gather/test-facets.yaml`)
  declares any facet using "exact" -- the ONLY path to the exact route, in gather and in compile alike, is
  follow-up identifier resolution (`resolve_identifier` -> `_resolve_via_exact`), never a facet's own base-round
  retrieval. A test that wants to exercise the exact route through `compile_packet`/`gather_with_followup` must
  trigger a real KIND_RECORD_ID/KIND_COMMIT/KIND_TESTS_OF identifier (e.g. a record citing another record's id),
  not merely list "exact" on the query.
- >-
  A full-result equality (or hash-equality) comparison between a "defect triggered" run and a "no defect" run can
  PASS even against genuinely un-fixed code, if the test's own trigger point fires too LATE in the call sequence
  to affect whichever early resolutions the bug lives in -- this looks like a passing regression test but proves
  nothing (verified directly: the compile test's own packet_sha256 comparison passed against the pre-pass-5 tree,
  which still had the exact defect it was meant to catch). The fix is to also assert on the MECHANISM the real fix
  changes (here: a call count on the function the fix stops calling redundantly), not only on an end-to-end
  output that might coincidentally agree for reasons unrelated to the fix. Always verify a new regression test
  against the KNOWN-BROKEN tree before trusting a passing run against the fixed one as evidence of anything.
- >-
  A test fixture's own "identifier a test resolves" constant (e.g. a record id already used successfully
  elsewhere in the same fixture, for a DIFFERENT lookup mechanism) is not automatically valid input for every
  OTHER lookup mechanism that nominally handles the same id shape -- confirmed empirically here:
  `followup_repobuilder`'s own `id_defined_elsewhere` resolves via the exact route's MENTION path (a plain git
  grep) but not via the id-grammar's own DEFINITION path (`lifecycle.find_definition`), because the fixture's own
  markdown heading shape does not match any of the real grammar's definition rules. Verify a fixture identifier
  actually exercises the SPECIFIC code path a new test targets (a quick direct call, before writing the test
  around it), rather than assuming "it resolved for a similar-sounding test elsewhere" transfers.
- >-
  A "did I fix every call site" self-review (grepping for a function's own name, checking each caller passes the
  new parameter) is NOT the same check as "does the function whose OWN fix I just made still resolve exactly once
  itself" -- this run's own first-method re-audit confirmed `core/exact.py`'s `grep()` and `lifecycle.
  find_definition()` each individually accepted and correctly used `resolved_view` (the check it ran), but never
  asked whether `id_lookup` -- the function that calls BOTH of them -- itself resolved once and handed the SAME
  value to both, or let each fall through to its own independent `None` fallback. A genuinely independent second
  reviewer (a fresh agent with no access to the first pass's own conclusions or self-assessment) caught this
  immediately by re-deriving the call graph from scratch rather than checking off a list the first pass already
  believed was complete. When a coordinator explicitly asks for "a second, INDEPENDENT method", running the same
  method again with more care is not a substitute -- a genuinely different reviewer, or a genuinely different
  technique (here: dynamic call-counting probes against the real operations, not just static code reading), finds
  what the first method's own blind spots miss.
