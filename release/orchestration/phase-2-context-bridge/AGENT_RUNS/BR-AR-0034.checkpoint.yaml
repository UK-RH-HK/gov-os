run_id: BR-AR-0034
commit: REPLACE_WITH_PASS3_COMMIT_SHA
role: >-
  REPAIR-1 node R1-XC (BR-DAG-AMEND-R1-16/-17) -- cross-cutting fixes: freshness -m entry point (R1-5), gitobj
  repo_root cache (R1-6), authority import-time config read (R1-12), thread-safe ExclusionCounter (R1-14), and
  read-only code/classification query paths (R1-17 items 5 and 6). Reopened THREE times: R1-17(5) was narrowed on
  pass 1 (read-only variants added for gather's code route only, while ensure_indexed still lazily built at query
  time behind symbols.stats/definitions/callers/reads_key and in five external callers; a broad except in
  code_route also swallowed StoreNeedsRebuild) -- pass 2 makes ensure_indexed BUILD-ONLY everywhere and re-raises
  typed errors. Pass 3 (accepted pass 2's own six fixes; two follow-ups before merge): fixes the REAL cause of the
  one remaining full-suite flake (tests/compile/conftest.py's own GOVBRIDGE_STORE isolation, not the git-ref
  concord R1-RM already closed), applies the same fix to tests/graph/conftest.py once the same grep found the same
  bug there, uncovers and rule-5-corrects a hidden hermeticity bug in GD-10's own regression test that the store
  isolation fix exposed, and moves govbridge/graph/impact.py's own BFS store access to open_db_readonly() (scope
  explicitly extended by the coordinator).
model_observed: claude-sonnet-5
