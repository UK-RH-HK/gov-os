findings:
- >-
  govbridge/graph/code_bridge.py's build_shaped_code_connection (out of this node's mutation_scope) still calls
  codesymbols._open_conn()/ensure_indexed() (read-write) at query time, from real_routes.py's own
  _shaped_code_conn() second block -- the SAME query-time-write pattern R1-17 item 5 fixes elsewhere in this file.
  Currently a no-op in practice against the acceptance scenario (a file+directory read-only store built by the
  eager code-layer builder, B3R): ensure_indexed's own classify-then-parse loop finds every product-role .rs blob
  already cached and never reaches its write branch. It is a LATENT write-at-query-time path for any commit the
  eager builder does not cover (e.g. a shaped code connection built for a non-eager/history commit), left for
  whoever next owns govbridge/graph/code_bridge.py -- reported per the brief's "find another cross-cutting defect,
  report it, do not fix it," not fixed here.
- >-
  govbridge/route/real_routes.py's code_route wraps BOTH codesymbols.definitions_readonly(...) and
  codesymbols.callers_readonly(...) in a bare `except Exception: ... = {...: []}` (pre-existing, not introduced by
  this run). This means a StoreNeedsRebuild raised by either (a genuinely missing/not-yet-eager-indexed commit) is
  silently swallowed into an empty result at the ROUTE level, rather than surfacing as the typed error to a CLI/
  gather caller. Calling ensure_indexed_readonly/definitions_readonly/callers_readonly directly (this run's own
  new tests, tests/code/test_symbols_readonly.py) DOES see the typed exception; only the pre-existing broad
  except in real_routes.py's own code_route masks it for that one call site. Named for whoever next tightens that
  exception handling; not one of this run's six named fixes.
- >-
  govbridge/authority/classes.py's BRIDGE_STATE_PATH is now a process-wide-cached lazy value (computed on first
  ACCESS, via a module __getattr__, never at import time) rather than fully uncached: BR-DAG-AMEND-R1-12 asks for
  "lazy or path-explicit" specifically to stop the FIRST IMPORTER's environment from fixing the process-wide
  result -- deferring the read to first ACCESS (by an actual consumer of the value, never an unrelated importer
  like govbridge.code.lineage_layer/govbridge.graph.derive) fully closes that race. Caching thereafter is a
  deliberate, load-bearing choice (this value is read on a potential per-hit hot path via authority.layer.
  classify_hit/record_id_for_occurrence): every real domain and every test fixture in this repository already
  treats this value as a fixed convention (every repobuilder hard-codes the identical string), so re-reading and
  re-parsing config/state-aliases.yaml on every hit would be a pure, unnecessary performance regression with no
  behavioural benefit. Recorded as a decision below, not left implicit.
failed_approaches:
- >-
  Converting govbridge.code.symbols.stats/definitions/callers/reads_key themselves (not just real_routes.py's own
  code route) to the read-only, non-building path. This is the LITERAL first reading of "ensure_indexed must not
  build at query time" -- but tests/code/test_symbols_integration.py, tests/code/test_definitions_lookup.py and
  tests/code/test_corpus_exclusion.py all call these functions DIRECTLY against a commit no eager build has ever
  touched, relying on their lazy, build-on-first-use behaviour as a deliberate test convenience (none of them are
  one of BR-DAG-AMEND-R1-15's enumerated "query commands" -- they are govbridge.code.symbols's own diagnostic CLI/
  library surface, not the gather/search query path). Converting them broke 2 of those tests immediately
  (confirmed by running them) and would have broken the other pre-existing suites' own lazy-build convention too.
  Reverted; replaced with the narrower, correct fix: real_routes.py's code route (the ACTUAL query surface BR-
  DAG-AMEND-R1-17 item 5's acceptance check measures) now calls two NEW read-only counterparts,
  definitions_readonly/callers_readonly (sharing their result-computation logic with the originals via
  _definitions_result/_callers_result), while stats/definitions/callers/reads_key themselves keep their original,
  unmodified, lazy behaviour for every existing caller.
- >-
  Switching govbridge.route.real_routes._conn() to store.open_db_readonly() without first correcting
  tests/route/test_real_routes.py::test_code_route_hits_carry_real_classification_and_real_definitions and
  ::test_exact_route_hits_carry_real_classification. Both pre-existing tests called the route directly against a
  store that had NEVER been built at all (no freshness.run() call), relying on authority.layer.classify_hit's own
  query-time ensure_schema() to silently create the (empty) authority tables on the spot, and on
  govbridge.code.symbols.ensure_indexed's own query-time build for the code route. Once classify_hit stopped
  calling ensure_schema() and _conn() moved to open_db_readonly() (which never creates a store that does not
  exist), both tests failed -- confirmed by running them before making the correction. This is exactly the
  scenario BR-DAG-AMEND-R1-17 item 6 anticipates ("pre-existing tests that relied on query-time schema creation
  are corrected to run the builder first, a rule-5 correction, justified") -- see decisions.
- >-
  Trying to reproduce ExclusionCounter's pre-fix race with a pure Python busy-loop stress test (many threads,
  `counter.bump()` in a tight loop, up to 500 threads x 200,000 bumps = 6.4M operations, at several
  sys.setswitchinterval settings). It never lost a single update against the UNFIXED implementation on this
  interpreter (CPython 3.12.3): its specializing adaptive interpreter appears to make a bare `self.count += n` on
  a tiny __slots__ int attribute effectively atomic in practice for this shape of workload, so the eval-breaker's
  GIL-drop point never lands inside the load/add/store sequence often enough to observe within a practical test
  budget. Replaced the "fails before, passes after" proof with a DETERMINISTIC structural test
  (test_bump_serialises_through_a_lock, tests/core/test_taskctx_concurrency.py) that holds the counter's own lock
  from the main thread and asserts a concurrent bump() call genuinely blocks on it -- this fails immediately and
  unambiguously against the pre-fix class (no lock attribute at all) and passes deterministically against the
  fixed one. The busy-loop stress tests are kept (they pass both before and after on this interpreter, so they
  are not evidence of the fix by themselves, but they do confirm exactness/no-regression under real concurrency,
  and the brief's own literal request: "many threads bump, and the count is exact").
unresolved: []
decisions:
- >-
  D-R1-XC-1 (within authority; a rule-5 correction, justified per BR-DAG-AMEND-R1-17 item 6's own text): corrected
  two pre-existing tests in tests/route/test_real_routes.py --
  test_code_route_hits_carry_real_classification_and_real_definitions and
  test_exact_route_hits_carry_real_classification -- to call freshness.run(..., from_clean=True) before building
  routes and querying, matching the file's own test_lexical_route_hits_carry_real_classification (which already
  did). Both previously relied on query-time store/schema creation (authority.layer.classify_hit's own
  ensure_schema() call, and govbridge.code.symbols.ensure_indexed's own query-time build) against a store that was
  never built at all -- a real caller always builds the store first; this is never a narrower assertion, the
  SAME real classification and definitions are asserted, just against a store built the way a real deployment
  (and every other test in the same file) already does.
- >-
  D-R1-XC-2 (within authority): govbridge.code.symbols.stats/definitions/callers/reads_key are left UNCHANGED
  (lazy, build-on-first-use) rather than converted to the read-only path; two NEW functions,
  definitions_readonly/callers_readonly, are added instead and used only by govbridge.route.real_routes's code
  route -- see failed_approaches for why the literal "convert every function" reading would have silently
  narrowed/broken three pre-existing test files' own, deliberate use of the lazy behaviour as a test convenience.
  stats/reads_key keep no read-only counterpart at all: neither is called by real_routes.py, so BR-DAG-AMEND-R1-17
  item 5's actual query surface (the code route) never reaches them.
- >-
  D-R1-XC-3 (within authority): govbridge.authority.classes.BRIDGE_STATE_PATH becomes a PEP 562 module
  `__getattr__` lazy attribute (computed and cached on first ACCESS, never at import time), not a fully uncached
  per-access recompute -- see findings for the reasoning (every real caller already treats it as a fixed
  convention; recomputing per-access would be a pure performance regression on a per-hit-classification hot path
  with no closed race left to fix once the read is deferred past import time).
- >-
  D-R1-XC-4 (within authority): govbridge.core.gitobj.repo_root()'s error message on a resolution failure now
  names the RESOLVED starting directory (an absolute path) rather than the original, possibly-relative `start`
  argument or the literal string '.' -- a direct, minor consequence of resolving the cache key before the
  subprocess call. No test (in this run or pre-existing) asserts the exact text of that message; grepped to
  confirm (see evidence in the report).
lessons:
- >-
  When a fix note says "X must not build/write at query time," check FIRST whether the function named is shared
  between a genuine query surface (a route, a CLI query command) and a separate diagnostic/library surface
  (govbridge.code.symbols's own stats/callers CLI here) that pre-existing tests already depend on for its OTHER
  behaviour (lazy build-on-first-use, as a test convenience). Converting the shared function outright breaks the
  diagnostic surface's own tests; splitting into a read-only counterpart used only by the actual query caller
  (real_routes.py here) satisfies the literal fix, its acceptance check, AND "no silent narrowing" for the
  pre-existing surface, at the cost of a small amount of duplication (resolved here by factoring the shared
  result-computation logic into a private helper both the lazy and read-only entry points call).
- >-
  A GIL-based "not thread-safe" defect does not always reproduce empirically via a pure busy-loop stress test on
  a modern CPython interpreter (3.12's specializing adaptive interpreter can make a tiny slots-attribute `+= `
  appear atomic in practice) -- when a stress test passes on BOTH the pre-fix and post-fix code, that is not
  proof the fix is unnecessary; it is a interpreter-specific gap in that test's own ability to observe the race.
  A deterministic, structural test (assert the lock exists and that a concurrent call genuinely blocks on it) is
  the reliable "fails before, passes after" proof REPAIR-1 requires when the dynamic reproduction is unreliable;
  keep the stress test too, for the exactness/no-regression guarantee it DOES provide.
