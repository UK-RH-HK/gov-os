- 'REOPENING Gap 2 fix: REPAIR_PLAN.md §2''s "tests that drive the product through its command-line binary" means
  the governed PRODUCT''s binary -- a Rust, clap-derive CLI -- not only this domain''s own Python argparse tooling.
  New govbridge/code/rust_cli.py: two tree-sitter passes over the SAME grammar govbridge.code.adapters.
  rust_treesitter already loads (never a second grammar). Pass 1 (build_dispatch_map) parses any file with a
  #[derive(Subcommand)] enum into {(enum, variant): kebab-cased subcommand name (or its #[command(name=...)]
  override), nested #[command(subcommand)] enum/field if any, the dispatching match arm''s own handler -- a block''s
  TAIL expression is unwrapped, so setup-then-dispatch handlers like `{ let p = ...?; real_handler(...) }` resolve
  to `real_handler`, not the setup}. Pass 2 (find_cargo_bin_exe_helpers / find_wrapper_functions /
  rust_cli_dispatch_tests_edges) finds every env!("CARGO_BIN_EXE_<bin>") helper, every test-local wrapper function
  taking a &[&str] parameter (direct, or forwarding into another already-known wrapper, bounded to
