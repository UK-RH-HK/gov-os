lessons:
- >-
  When a DAG node's own mutation_scope excludes the file that would be the "obvious" integration point (here,
  govbridge/gather/engine.py and govbridge/cli.py), that is usually deliberate sequencing, not an oversight to work
  around -- the right response is to build the new capability as a clean, drop-in-compatible WRAPPER/superset
  around the excluded file's existing contract, and disclose the remaining one-line integration step precisely,
  rather than reach for the excluded file anyway or silently narrow the deliverable to "whatever the CLI already
  exposes".
- >-
  A route's own already-computed data (a lexical hit's multi-ref ``occurrences`` tuple; a route's own
  classification) is very often already the answer to a "how do I reconcile/collapse this" question that looks,
  at first glance, like it needs a whole new subsystem -- read the existing data model closely (RouteOccurrence's
  own version_status field, here) before designing new derivation logic.
- >-
  A synthetic fixture's OWN choice of language for "a function and its test" is not a free choice in this
  domain: govbridge.code's indexer is Rust-only today, so a Python-shaped fixture for a code-route-dependent
  scenario silently produces zero hits rather than an error -- always independently probe a NEW fixture's
  assumptions against the real indexing pipeline (a two-line seed lookup) before writing assertions around it.
- >-
  Building a real-view store `index rebuild --from-clean` for a whole-repository domain is a multi-minute
  operation (semantic embeddings dominate); budget for it as a background task with a bounded poll, not a
  synchronous command with a short timeout.
- >-
  A stop-reason or defect name that "sounds right" from a recent message still needs to be checked against the
  ACTUAL identifier the coordinator used, not assumed: this reopening's own first drafts attached the previous
  dispatch's amendment id (BR-DAG-AMEND-R1-18, interpreter pinning) to an unrelated fix (the priority queue) simply
  because it was the most recently mentioned id in context. A `grep` for the id across every touched file, right
  before returning, caught it -- cheap enough to make a standing habit whenever a prior dispatch's own identifier
  gets reused in a new pass's own prose.
- >-
  "Degrade to MISSING on any exception" and "byte-identical regardless of speed/load" are both good, individually
  correct instincts that can quietly fight each other: a fix that makes a subsystem more ROBUST to a transient
  environment failure (this node's own first-pass git-call try/except) can simultaneously make it LESS deterministic
  (a race that lands differently on two otherwise-identical runs now silently produces different content), unless
  the failure path itself is made deterministic too -- here, by retrying first (closing the common case) and
  disclosing, never silently absorbing, the rare case that still fails. Whenever a defect fix reaches for a bare
  try/except around an external call, the right follow-up question is "does WHEN this triggers depend on anything
  the caller cannot control (timing, concurrent load), and if so, does that leak into the output" -- not just
  "does it stop the crash".
- >-
  A wall-clock safety net (a timeout/abort) and a content budget (a count) look similar -- both "stop follow-up
  before it runs away" -- but they are answers to two different questions ("has this taken too long" vs. "have we
  seen enough") and belong in two different code paths with two different disclosure stories the moment EITHER one
  can affect what gets returned to a caller who expects reproducible evidence. Folding them into one check (this
  node's own first-pass mistake) is an easy, natural-looking shortcut that only shows up as a bug once someone
  compiles the SAME query twice and diffs the result.
- >-
  A shared, real repository under concurrent multi-agent access moves out from under a long-lived store: a ref
  this domain's own store indexed can advance (another agent's own commits) while that store is still being
  queried, which is exactly why "build from clean with the current tree" is not a formality -- it was necessary
  here (the "records" ref had moved since this node's own first-pass store build) and the resulting number
  (identifiers/rounds/timings) can differ across two "from-clean" builds of the SAME store path for exactly that
  reason, never because the code changed.
- >-
  BR-DAG-AMEND-R1-22 (second reopening): the defect was max_wall_seconds (default 240s) being checked ALONGSIDE
  max_total_identifiers in the SAME overall-budget decision, so a slower run of the identical query against the
  identical store could stop with a different prefix of the queue resolved -- R1-GA3's own CONTROL-A compile-twice
  check caught two compiles differing in exactly the resulting overflow set. Fixed by moving the wall-time check
  to run FIRST and SEPARATELY, before the content-budget check, with its own distinct stop reason
  (STOP_WALL_TIME_ABORT) never added to govbridge.gather.engine.STOP_REASONS, and disabling it by default
  (DEFAULT_MAX_WALL_SECONDS = None; config/facets.yaml's own default_max_wall_seconds: null, changed from 240).
  gather_with_followup's own return shape gained one new top-level field, `deterministic` (bool) -- a disclosed,
  additive, backward-compatible change (no existing key removed or repurposed).
- >-
  BR-DAG-AMEND-R1-22's own mid-pass addendum (cross-process determinism): read every module in this reopening's
  scope for a PYTHONHASHSEED-sensitive ordering (raw set/frozenset iteration, or a sort key that can tie without a
  total tie-break) and found none needing a fix -- identifiers.py/merge.py already key by dict+list, never a bare
  set for output order; collapse_occurrences/reconcile_path sort by an explicit value, never hash; this node's own
  _priority_sort_key already ends in a total (kind, value) tie-break. Verified empirically with a new hermetic
  subprocess script (tests/fixtures/gather/followup/hash_seed_probe.py) rather than relying on inspection alone.
  No upstream file needed a change; this decision records that the audit was done and DID find candidate risk
  points (documented above), not that none existed to check.
- >-
  A second coordinator addendum (git-read retry) arrived after BR-DAG-AMEND-R1-22's own fix and its cross-process
  addendum were both already complete: this node's FIRST pass (C-10, findings) made every direct git call degrade
  to an honest MISSING on any exception, which stopped crashes but reintroduced a determinism gap of its own -- a
  transient failure (a repack race) could silently change WHICH items a gather found. Fixed with a bounded retry
  (_retry_transient_git_read, 3 attempts, a short fixed backoff) in front of the existing degrade-to-MISSING
  behaviour, plus a new, disclosed `degraded_git_reads` list (threaded exactly like tree_cache: call-scoped, never
  a module-global) that the `deterministic` field's second condition now also checks. This is a REFINEMENT of C-10
  layered on top of it, never a reversion -- an exception still degrades rather than crashes; it is simply retried
  first and disclosed if it persists.
- >-
  Made within this node's own authority: a degraded (post-retry-exhaustion) `_safe_ls_tree_paths` result is
  deliberately NEVER written into `tree_cache`. Caching would make a LATER lookup against the same commit silently
  reuse the failure (and look exactly like a genuinely empty tree) instead of getting its own fresh retry budget on
  its own next call -- the opposite of the "never let a degraded item look like genuine absence" instruction this
  addendum states explicitly.
