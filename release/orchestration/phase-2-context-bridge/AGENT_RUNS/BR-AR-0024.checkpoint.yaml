decisions:
- >-
  Acknowledged and applied mid-pass: template amendment R1-T3 (BR-DAG-AMEND-R1-18), received directly from the
  orchestrator (bridge tip 2713afd). Every command in this checkpoint's own `commands` list, and every ad hoc
  probe script this pass ran, was already invoked exclusively through $PY=$HOME/.cache/gov-bridge/venv/bin/python
  (never a bare python3/pip/pytest) from before this amendment arrived; the two checks already recorded were
  regenerated to prepend an explicit `# interpreter: $PY (<version>)` header line to their own saved output (the
  grep-only genericity audit is marked N/A -- no interpreter is invoked). No venv was created and no package was
  installed at any point.
- >-
  REQUEST to the orchestrator: route the one-line govbridge/cli.py change described in open_issues/unresolved (swap
  `govbridge.gather.engine` for `govbridge.gather.followup` in cmd_gather, call gather_with_followup) to whichever
  node next owns cli.py in the RX -> GA1 -> RS -> RA sequence (R1-RA, unless R1-GA3/R1-INT is judged a better fit).
  gather_with_followup is a drop-in superset of engine.gather's own return shape, so this is mechanical.
- >-
  Made within this node's own authority: the versions facet's real content (govbridge.gather.versions) is computed
  UNCONDITIONALLY by gather_with_followup whenever at least one path resolved, rather than gated behind
  config/facets.yaml's own facet-selection machinery (which is a compile-time quota concept, out of this node's
  mutation_scope to widen) -- so a caller using a minimal/lexical-only facets.yaml (as this node's own real-view
  tests do, to avoid the embedding subprocess) still gets real version reconciliation, never a silently-skipped
  facet just because "versions" was not itself a registered facet row in whatever config the caller happened to
  load.
- >-
  SUPERSEDED by this reopening: the first pass's own decision (per-identifier/round caps as bare module constants,
  config/facets.yaml out of scope) is no longer current -- the coordinator's reopening extended this node's
  mutation_scope to config/facets.yaml for exactly this purpose (task_contract.mutation_scope, above), and all
  five follow-up knobs now live in that file's own `followup:` section (govbridge/gather/followup._followup_config),
  the module's own DEFAULT_* constants demoted to a documented code fallback only.
- >-
  REOPENING (required by the dispatch message, not requested by this node): gather_with_followup's own signature
  changed. max_followup_rounds/max_identifiers_per_round/max_items_per_identifier now default to None (defer to
  config/facets.yaml) instead of a literal module constant; two NEW keyword-only parameters were added
  (max_total_identifiers, max_wall_seconds), both also defaulting to None (defer to config). Both changes are
  backward compatible for any caller that named these arguments explicitly (the resolved VALUE for the three
  pre-existing ones is unchanged unless config/facets.yaml's own new defaults differ from the old module
  constants, which they now deliberately do -- see the next decision); a caller that relied on the OLD literal
  defaults without reading config could observe a different number. Stated per the dispatch message's own
  instruction ("keep that function's signature stable, or state any change in decisions").
- >-
  Made within this node's own authority: the five new config/facets.yaml `followup:` defaults
  (default_max_rounds: 6, default_max_identifiers_per_round: 15, default_max_total_identifiers: 250,
  default_max_wall_seconds: 240, default_max_items_per_identifier: 50 unchanged) were tuned from a real-view
  timing measurement (~2-5s per identifier resolution on this domain's own corpus) so that a real CONTROL-A-shaped
  query can reach multiple follow-up rounds within the wall budget (acceptance check evidence:
  AGENT_RUNS/BR-AR-0024.check-controla-sweep.out) while still bounding one gather's own follow-up phase to a few
  minutes.
- >-
  Made within this node's own authority: a round's own "added nothing genuinely new" check
  (MARGINAL_GAIN_ONLY_DUPLICATES) now compares merge.MergeAccumulator.item_count() before/after the round, not
  "the round resolved zero items" -- the more correct reading of the OD-BR-05 wording ("only duplicates"), since a
  round whose every resolution DID return content that was already merged (a genuine duplicate, not an empty
  result) is exactly the case this stop reason names, and the old, narrower reading conflated "found nothing" with
  "found only what we already had".
- >-
  No existing test file was modified beyond the ONE correction this reopening itself required and already
  disclosed in the FIRST pass's own decisions (govbridge/gather/telemetry.py's own follow_up_triggers slot is
  appended to via new GatherTelemetry instances, never edited). This reopening's own test-file change is
  REWRITING one test this node wrote in its OWN first pass
  (test_a_round_with_more_identifiers_than_budget_stops_disclosed_never_silently_dropped), which measured the now-
  fixed-as-defective immediate-stop behaviour as if it were correct -- split into
  test_a_round_with_more_identifiers_than_the_per_round_cap_carries_the_rest_to_a_later_round and
  test_budget_reached_with_unresolved_fires_only_when_the_overall_budget_is_exhausted, neither of which weakens
  any assertion (both are strictly MORE specific about what must happen) -- the same "extend or correct, never
  weaken, and justify every modification" discipline the REPAIR-1 builder template states for any existing test,
  applied here to this node's OWN first-pass test now that the behaviour it measured is understood to be the
  defect this reopening fixes.
- >-
  Found and corrected before returning: this reopening's own first drafts of the code comments/docstrings/tests
  mislabelled the priority-queue fix as "BR-DAG-AMEND-R1-18 (R1-T3)" -- that id is the PRIOR, unrelated dispatch
  message (interpreter pinning), not this reopening, which the coordinator's own message never numbered. Every
  such mention in govbridge/gather/{followup,identifiers,merge}.py, tests/gather/test_followup.py,
  config/facets.yaml and this checkpoint/report was corrected to "the BR-AR-0024 reopening" before commit (a
  `grep -rn 'BR-DAG-AMEND-R1-18'` over every file this node touched, kept only where it correctly names the
  interpreter-pinning amendment: the `# interpreter: $PY (...)` header lines and this checkpoint's own R1-T3
  entries).
lessons:
- >-
  When a DAG node's own mutation_scope excludes the file that would be the "obvious" integration point (here,
  govbridge/gather/engine.py and govbridge/cli.py), that is usually deliberate sequencing, not an oversight to work
  around -- the right response is to build the new capability as a clean, drop-in-compatible WRAPPER/superset
  around the excluded file's existing contract, and disclose the remaining one-line integration step precisely,
  rather than reach for the excluded file anyway or silently narrow the deliverable to "whatever the CLI already
  exposes".
- >-
  A route's own already-computed data (a lexical hit's multi-ref ``occurrences`` tuple; a route's own
  classification) is very often already the answer to a "how do I reconcile/collapse this" question that looks,
  at first glance, like it needs a whole new subsystem -- read the existing data model closely (RouteOccurrence's
  own version_status field, here) before designing new derivation logic.
- >-
  A synthetic fixture's OWN choice of language for "a function and its test" is not a free choice in this
  domain: govbridge.code's indexer is Rust-only today, so a Python-shaped fixture for a code-route-dependent
  scenario silently produces zero hits rather than an error -- always independently probe a NEW fixture's
  assumptions against the real indexing pipeline (a two-line seed lookup) before writing assertions around it.
- >-
  Building a real-view store `index rebuild --from-clean` for a whole-repository domain is a multi-minute
  operation (semantic embeddings dominate); budget for it as a background task with a bounded poll, not a
  synchronous command with a short timeout.
- >-
  A stop-reason or defect name that "sounds right" from a recent message still needs to be checked against the
  ACTUAL identifier the coordinator used, not assumed: this reopening's own first drafts attached the previous
  dispatch's amendment id (BR-DAG-AMEND-R1-18, interpreter pinning) to an unrelated fix (the priority queue) simply
  because it was the most recently mentioned id in context. A `grep` for the id across every touched file, right
  before returning, caught it -- cheap enough to make a standing habit whenever a prior dispatch's own identifier
  gets reused in a new pass's own prose.
- >-
  A shared, real repository under concurrent multi-agent access moves out from under a long-lived store: a ref
  this domain's own store indexed can advance (another agent's own commits) while that store is still being
  queried, which is exactly why "build from clean with the current tree" is not a formality -- it was necessary
  here (the "records" ref had moved since this node's own first-pass store build) and the resulting number
  (identifiers/rounds/timings) can differ across two "from-clean" builds of the SAME store path for exactly that
  reason, never because the code changed.
next_consumer: >-
  Whoever next owns govbridge/cli.py in the RX -> GA1 -> RS -> RA sequence (R1-RA, most likely), for the one-line
  wiring described in decisions/open_issues; R1-GA3, which depends on this node and wires `gather` into
  govbridge.compile (a natural second integration point for gather_with_followup, alongside or instead of the CLI
  one) -- and should know config/facets.yaml now carries a `followup:` section alongside the facet rows it already
  reads, in case a compile-time caller wants to override the same five knobs; R1-XC, already tracking the
  code-route/classify_hit query-time writes this node independently reconfirmed (findings) and deliberately did
  not extend (failed_approaches); whoever owns govbridge/code/symbols.py next, for the Python-adapter gap
  (findings, unresolved); the orchestrator, for the remaining disclosed open_issues and the cli.py-wiring decision
  request.
