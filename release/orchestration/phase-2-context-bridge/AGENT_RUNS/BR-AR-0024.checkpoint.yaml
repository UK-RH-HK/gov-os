findings:
- >-
  govbridge.gather.engine's own identifier_extractor hook (R1-GA1's extension point) discloses whatever it returns
  but never acts on it -- confirmed by tests/gather/test_engine.py::
  test_identifier_extractor_hook_is_called_and_disclosed_never_acted_on, and by reading engine.gather's own loop
  body directly (the hook's return value only ever feeds telem.unresolved_identifiers). Triggered rounds therefore
  have to live in a wrapper OUTSIDE engine.gather (this node's followup.gather_with_followup), never inside it --
  matching this node's own mutation_scope, which does not include govbridge/gather/engine.py at all.
- >-
  govbridge.code.symbols (the "code" layer) indexes ``.rs`` blobs only; a python_ast.py adapter exists under
  govbridge/code/adapters/ but ensure_indexed never calls it. Confirmed by reading _rs_tree_entries/_rs_paths
  directly and by an empty-result probe (a Python fn/test pair seeded through the code route returns zero hits;
  the identical pair in Rust returns both the definition and the caller). This bounds which language this node's
  "a function whose tests live in another directory" fixture could use (Rust), disclosed in open_issues, not
  silently substituted.
- >-
  A lexical hit's own occurrences tuple (govbridge.route.real_routes.lexical_route) already carries one
  RouteOccurrence PER REF where the underlying store found that exact content -- the store's own per-ref identity,
  computed once at build/query time by govbridge.lexical.query, never re-derived by this node. Occurrence collapse
  (merge.collapse_occurrences) is therefore a read of each occurrence's own, already-computed version_status, never
  a second cross-ref comparison.
- >-
  The code route (govbridge.route.real_routes.code_route) only ever resolves seeds against the ref whose ROLE is
  "product" (_product_commit); a view with no product-role ref makes every code-route seed lookup silently return
  empty (an honest MISSING, never an error) -- found while building the "ambiguous trailing segment" fixture (a
  single-ref repo originally), fixed by giving that fixture a second, product-role ref pointed at the same commit,
  exactly like config/canonical-view.yaml's real product/records pair.
- >-
  CRITICAL, found while re-running CA-WHY on the real store to satisfy BR-DAG-AMEND-R1-22 requirement 5 ("confirm
  two consecutive runs give an identical merged_sha256"): they did NOT match (a real, reproduced divergence, not a
  transient fluke -- see AGENT_RUNS/BR-AR-0024.check-ca-why-wall-time-defaults.out for the full investigation and
  every commit hash involved). Root-caused to code OUTSIDE this node's mutation_scope:
  config/canonical-view.yaml's "records" ref (role: primary) is `follow: tip` against refs/heads/bridge/
  p2-context-retrieval -- THIS session's own live, actively-committed-to orchestration branch. govbridge/core/
  exact.py's `grep()` (lines ~125-130: `vc = viewmod.load_view(view_path); resolved = viewmod.resolve_view(vc,
  repo=repo); ... commit = resolved.named[primary.name].commit`), called by `id_lookup()` (line ~189), called by
  govbridge/route/real_routes.py's `exact_route` (which forwards `view_path`/`repo` STRINGS, never a pre-resolved
  view/commit, at every call -- see its own call to `exactmod.id_lookup(text, view_path=view_path, repo=repo)`),
  re-resolves that ref's LIVE TIP FRESH ON EVERY CALL, with no caching or pinning for the RouteSet's or the
  gather's own lifetime -- unlike `code_route`, which correctly freezes `product_commit` ONCE
  (`_product_commit(resolved_view)`) at `build_real_routes()` time and closes over it. PROOF this is a live-ref
  race, not anything in gather/identifiers/merge/versions: run1's own single, uninterrupted gather_with_followup
  call (~1031s wall, this session's own heavy multi-agent load) contains FOUR DIFFERENT commits for the SAME
  "records" ref across its own 675 merged items -- meaning the branch tip moved multiple times WHILE that one call
  was still in flight, entirely independent of any second run. Base-round (lexical/semantic) items, which read the
  pre-built, frozen store rather than live git, are unaffected -- consistent with only exact-route-resolved
  (KIND_RECORD_ID/KIND_COMMIT) items showing the drift. This node's OWN determinism guarantee holds, proven
  byte-for-byte, on every hermetic test using a static (non-"follow: tip") fixture; this is a pre-existing property
