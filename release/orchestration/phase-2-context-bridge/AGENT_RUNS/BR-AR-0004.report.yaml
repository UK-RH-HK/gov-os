open_issues:
  - id: OI-1-freshness-single-layer-cli-cannot-self-register
    text: >
      The DAG's literal acceptance-check text -- `$PY -m govbridge.core.freshness rebuild --layer lexical
      --from-clean`, run twice -- cannot succeed as a bare, single-process command: govbridge.core.freshness.run()
      restricts a call to EXACTLY the named layer for the WHOLE call
      (`builders = get_layer_builders() if layer is None else {layer: _LAYER_BUILDERS[layer]}`, freshness.py:214),
      and nothing under govbridge/core (govbridge/__init__.py, govbridge/core/__init__.py) imports any sibling
      layer package, so "lexical" is never in _LAYER_BUILDERS in a process that has not itself imported
      govbridge.lexical -- reproduced twice, verbatim: KeyError: 'lexical' both times (see
      AGENT_RUNS/BR-AR-0004.evidence/freshness-rebuild-layer-lexical-fromclean-LITERAL-transcript.txt). This is not
      a B2 defect: govbridge/core/** and govbridge/__init__.py are outside B2's mutation_scope, and both
      freshness.py's and manifest.py's own docstrings describe the intended trigger for registration as "import
      time of the layer's own package" -- i.e. node I1's future govbridge/cli.py is expected to import every layer
      package before dispatching any freshness/compile command; B2 has no dependency on I1 or on any sibling PG1
      node. I reproduced the acceptance check's stated INTENT instead ("identical lexical layer digest" across two
      from-clean rebuilds) by importing govbridge.lexical then calling freshness.run(from_clean=True) (layer=None,
      so core+lexical build together in one pass -- the same sequence I1 will use) twice against the real view;
      see C6 above and AGENT_RUNS/BR-AR-0004.evidence/lexical-digest-determinism-from-clean-twice.json for the
      side-by-side comparison. Secondary, unrelated observation made while investigating this: two --from-clean
      calls within the same wall-clock second can collide on store.move_store_aside()'s
      `<root>.trashed-<int(time.time())>` naming (ENOTEMPTY on rename) -- observed once, not fixed (store.py is
      core, out of B2's mutation_scope), noted here for B1's owner / the orchestrator.
  - id: OI-2-authority-class-lifecycle-not-yet-assigned
    text: >
      Every RetrievedItem's authority_class/lifecycle are None with classification_note
      "NOT_YET_ASSIGNED: authority class/lifecycle are assigned by govbridge.authority (node B5, not a B2
      dependency)". This is deliberate (see C3), not an omission: B2 depends only on B1, node B5 does not exist in
      this worktree, and ARCHITECTURE.md section 4 says a route's items carry a class "already assigned by section
      5" -- i.e. by an upstream classifier, never fabricated by the route itself. Node B6/I1 is expected to merge
      lexical RetrievedItems with B5's resolver output before section placement.
  - id: OI-3-per-ref-layers-field-not-consumed-by-core
    text: >
      config/canonical-view.yaml's per-ref `layers: [...]` list (e.g. records lists "lexical") is not consumed by
      govbridge.core's own occurrence/chunk builder -- core indexes every ref uniformly regardless of that field.
      All four refs in the real view currently list "lexical", so this is moot today, and the lexical layer builder
      itself does not filter by it either (it indexes whatever govbridge.core already put in the `chunk` table).
      Flagging so a future per-ref layer-scoping requirement is recognised as a core-level property, not something
      B2 silently opted out of.
  - id: OI-4-manifest-digest-functions-must-tolerate-an-unbuilt-layer
    text: >
      govbridge.core.manifest.build_manifest() calls every REGISTERED layer's digest function unconditionally,
      including on a connection where that layer's own tables were never created (store.open_db() only creates
      core's schema; each layer creates its own lazily). Once govbridge.lexical is imported anywhere in a process
      (e.g. pytest collecting tests/lexical alongside tests/core), any OTHER test that builds a manifest over a
      bare/manually-seeded connection would hit "no such table: lexical_fts" unless lexical_layer_digest() is
      defensive. Fixed by having lexical_layer_digest() call ensure_schema() first (returns a deterministic
      zero-row digest for a connection this layer has never touched, the same shape occurrence_layer_digest gives
      for an empty-but-present core table); verified by running tests/core + tests/lexical together, in both
      collection orders (83 tests, both orders green). Flagging as a pattern nodes B3/B4/B5 should also apply to
      their own digest functions, since node I1 will be the first process to import every layer package together.
