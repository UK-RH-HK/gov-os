open_issues:
  - id: OI-1-corpus-l-machine-output-difference
    text: >
      The coverage acceptance check's expected counts (SO-05) come from the architect's simplified spike script
      (corpus_measure.py), which never implemented the L-MACHINE-OUTPUT rule (ARCHITECTURE.md section 1.1 row 8).
      My config/corpus-rules.yaml implements the full rule table, so at 3c880d8 INCLUDED is 3639 and
      L-MACHINE-OUTPUT is 2850 rather than one INCLUDED bucket of 6489; every other rule (X-SEC-CONTENT, X-SEC-PATH,
      X-BINARY, M-LARGE) matches exactly, and 3639+2850=6489 reproduces SO-05's INCLUDED figure once the split is
      accounted for. Verified by inspecting excluded_examples for the rule -- all are .out/.log/.jsonl files under
      probes/ and fixtures/. No rule was tuned to hit a number; this rule exists in ARCHITECTURE.md independent of
      any measurement.
  - id: OI-2-exact-id-is-a-placeholder
    text: >
      `govbridge.core.exact id` reports literal mentions only (via the same Git-grep path as `grep`); it does not
      resolve a definition site, because true definition-site resolution needs config/id-grammar.yaml, which node B5
      owns and has not yet been built. The command says so explicitly in its output (`note` field) so nothing
      downstream mistakes a mention for a definition.
  - id: OI-3-blob-sha256-partial
    text: >
      blob.sha256 is populated only for blobs whose content was actually read (every corpus_effect other than a
      path/size-based EXCLUDE where the architecture deliberately avoids reading content -- X-SEC-PATH, X-BUILD,
      X-SELF, M-LARGE). Git's own blob id (sha1) is always present and is what exact.show's acceptance check
      verifies against `git rev-parse`; no acceptance check or downstream interface in this brief needs blob.sha256
      for an excluded/metadata-only blob. A later layer that needs it can compute it on demand from the blob id.
  - id: OI-4-incremental-rewalks-the-changed-refs-tree
    text: >
      INCREMENTAL re-walks the full `git ls-tree` of each ref whose commit moved (one fast git call per changed
      ref) rather than following a diff-tree of exactly the changed paths; every already-known blob is skipped
      without a content read, so no blob is re-chunked, but occurrence rows for a changed ref's UNCHANGED paths are
      still rewritten (INSERT OR REPLACE, no re-read). gitobj.diff_tree() exists and is tested
      (tests/core/test_gitobj.py::test_diff_tree_reports_changed_paths) for a future tightening if occurrence-row
      churn on a large history ever matters; it is not required by any B1 acceptance check.
  - id: OI-5-history-ref-removal-not-detected
    text: >
      The freshness fingerprint compares refs present in both the previous and current fingerprint; a history tip
      that disappears entirely (a phase2/* branch deleted) is not detected as a change and its stale occurrence rows
      are not dropped. phase2/* branches are historical evidence and are not expected to be deleted in this
      lifecycle; documented rather than handled, given the brief's bound on B1's scope.
  - id: OI-6-canonical-fallback-untested-in-isolation
    text: >
      view.classify_occurrence()'s CANONICAL_FALLBACK branch (absent at the owner, present at a named fallback ref)
      shares its code path with the SAME_AS_CANONICAL/HISTORICAL_VERSION branches that tests/core/test_view.py does
      exercise, but the fixture repo's linear commit history (product pinned to the root commit) made it awkward to
      construct a clean "absent at owner, present at a named non-history fallback" fixture without a second orphan
      root; not added under this run's time budget. The real-repository acceptance checks (CANONICAL,
      HISTORICAL_VERSION, SAME_AS_CANONICAL implicitly) are covered.
  - id: OI-7-store-size-is-large-locally-not-committed
    text: >
      A from-clean build against the full 98-ref view produces a ~460 MB local SQLite store under
      $HOME/.cache/gov-bridge/store-BR-AR-0003/ (chunk text for 135k chunks across all refs, including the history
      layer). Nothing under that path is committed; config/requirements.lock and this report both note the venv,
      model cache and every index live under $HOME/.cache/gov-bridge/ only. Disk on this machine (183G free) was
      not a constraint; a future node may want to reconsider whether history-layer chunking should be lazier if that
      changes.
