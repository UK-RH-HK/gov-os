claims:
  - id: C1-store-isolation
    text: >
      The index store root is resolved through exactly one function, govbridge.core.store.store_root(): GOVBRIDGE_STORE
      wins outright when set, else $HOME/.cache/gov-bridge/store/<view_id>. Every module that touches the store
      (store, freshness, manifest, and every CLI in govbridge.core) calls it -- none computes a store path itself
      (BR-DAG-AMEND-1 point 1). tests/core/test_store.py and tests/core/test_freshness.py::
      test_two_govbridge_store_values_build_independent_stores prove two different GOVBRIDGE_STORE values build
      independent stores and a freshness update in one never touches the other (BR-DAG-AMEND-1 point 3).
  - id: C2-git-object-access
    text: >
      govbridge/core/gitobj.py is a thin wrapper over git plumbing (rev-parse, ls-tree, cat-file --batch,
      diff-tree, for-each-ref, grep, blame) -- the bridge never reads the working tree.
  - id: C3-canonical-view
    text: >
      govbridge/core/view.py implements the canonical multi-ref model (ARCHITECTURE.md section 1.2): named refs
      (tip-followed or pinned), a ref_glob history layer, ordered partitions with a dynamic paths_from extractor
      (generic AST-based, reused nowhere else -- reads config/canonical-view.yaml's declared "path#NAME" without
      hardcoding either), and classify_occurrence() producing CANONICAL / CANONICAL_FALLBACK / SAME_AS_CANONICAL /
      HISTORICAL_VERSION / HISTORY_ONLY. config/canonical-view.yaml follows the brief exactly: records follows
      refs/heads/bridge/p2-context-retrieval's tip; product and evidence are pinned to 3c880d8/58219d5 and report
      REF_MOVED rather than following a moved branch; history is refs/heads/phase2/*.
  - id: C4-corpus-rules-and-coverage
    text: >
      govbridge/core/corpus.py is a generic interpreter over config/corpus-rules.yaml (globs / size_gt / binary /
      content_regex / kinds match types), evaluated in file order, monotone, with a mandatory trailing catch-all.
      `corpus coverage` measured against the real repository at 3c880d8 (product ref): X-SEC-CONTENT 65, X-SEC-PATH
      2, X-BINARY 5, M-LARGE 6 -- all four match SO-05 exactly. INCLUDED alone is 3639, not 6489, because
      corpus-rules.yaml additionally implements the L-MACHINE-OUTPUT rule (ARCHITECTURE.md section 1.1 row 8,
      "lexical and exact only, not embedded"), which the architect's corpus_measure.py spike never modelled;
      INCLUDED (3639) + L-MACHINE-OUTPUT (2850) = 6489, reproducing SO-05's INCLUDED figure exactly once that rule
      is accounted for (see open_issues). unclassified is 0 for every one of the 98 resolved refs (3 named +
      95 phase2/* history tips), and files_total matches `git ls-tree -r <commit> | wc -l` for every one of them.
  - id: C5-content-addressed-store-and-chunking
    text: >
      govbridge/core/store.py defines the SQLite store (blob, occurrence, chunk tables) and
      govbridge/core/chunking.py implements deterministic, line-aligned, overlapping chunking
      (MEMORY_POLICY 1200/120) with chunk_id = sha256(blob_id||chunker_version||start_line||end_line)[:24].
  - id: C6-exact-route
    text: >
      govbridge/core/exact.py implements show/grep/id/path. show honours corpus exclusions (metadata only, never
      content, for an EXCLUDE-effect path) and reports version_status from the canonical view. Verified on the real
      repository: `exact show 3c880d8:runtime/src/init.rs:146` -> version_status CANONICAL, blob equal to
      `git rev-parse 3c880d8:runtime/src/init.rs`; `exact show 3c880d8:release/orchestration/phase-2/ORCHESTRATOR_STATE.yaml`
      -> version_status HISTORICAL_VERSION (the records partition owns that path; its blob at 3c880d8, 136e825a...,
      differs from the records ref's current blob for the same path, 314605ba..., exactly as ARCHITECTURE.md section
      1.2 describes). `id` is a bounded, generic placeholder (mention-only, via the same Git-grep mechanism as
      `grep`) pending node B5's id-grammar; it never claims a definition site it cannot support.
  - id: C7-freshness-and-manifest
    text: >
      govbridge/core/freshness.py determines NOOP/INCREMENTAL/FULL from Git ids and config hashes only (0 model
      calls, always llm_invocations 0). Measured on the real 98-ref view: first `freshness update` (FULL) processes
      6,683 blobs / 503,320 occurrences / 135,296 chunks in ~17s; the immediate second call is NOOP, 0
      blobs/occurrences/chunks, wall_seconds 0.015 (<2s), identical manifest_sha256.
      govbridge/core/manifest.py provides the layer-registration API (register_layer/get_registered_layers) that
      B2-B5 use to add their own tables' digests to the build manifest without editing this file; core registers its
      own occurrence/chunk/blob layers the same way. tests/core/test_manifest.py::
      test_a_new_layer_can_register_without_editing_core proves a layer foreign to govbridge.core can register and
      appear in build_manifest()'s output through the public API alone.
  - id: C8-telemetry
    text: >
      govbridge/core/telemetry.py writes local JSONL rows to $GOV_BRIDGE_HOME/telemetry/<kind>.jsonl (builds rows
      from every non-NOOP freshness run include llm_invocations: 0).
  - id: C9-bootstrap
    text: >
      bootstrap/bootstrap.sh is idempotent: creates/reuses $GOV_BRIDGE_HOME/venv, installs config/requirements.lock
      with `pip install --require-hashes --no-deps`, downloads config/model-pin.yaml's 6 artefacts, and re-verifies
      every sha256 on every run (a cached artefact whose sha256 no longer matches -- corruption or tampering -- is
      refused immediately; only a genuinely MISSING artefact is (re)downloaded). Verified live: two successive runs
      both exit 0, the second performs no pip install and no download; a deliberately tampered byte in an existing
      cached artefact makes the next run exit 1 with an explicit mismatch message before touching any other
      artefact; replacing the tampered file with a fresh download recovers cleanly. The final line of every run
      prints "python 3.12.3, onnxruntime 1.30.0, tokenizers 0.23.2, tree-sitter 0.25.2 and the pin id <sha256>".
  - id: C10-generic-not-bespoke
    text: >
      No module under govbridge/ names Review 8, F1-F6, Phase 2 or a specific file in its LOGIC (grep-verified);
      every rule, path and pin is config data (config/corpus-rules.yaml, config/canonical-view.yaml,
      config/model-pin.yaml), most of it inherited verbatim from ARCHITECTURE.md/BR-HO-0003, which is itself the
      architect's and the orchestrator's own specification for this lifecycle's concrete view.
