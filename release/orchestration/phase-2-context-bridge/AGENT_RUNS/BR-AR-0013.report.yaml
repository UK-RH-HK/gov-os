open_issues:
  - id: OI-1-no-existing-test-locked-in-the-old-behaviour
    text: >
      Grepping tests/** before this repair found no test asserting the old "a mandatory item with a non-ACTIVE
      lifecycle is excluded from A" behaviour, and no test referencing MANDATORY_ITEM_NOT_IN_A -- the defect (OI-3
      in AGENT_RUNS/BR-AR-0008.report.yaml) was found only on the real corpus, never on the hermetic fixture, since
      the fixture's only ladder-admissible mandatory items (CX-0010A/CX-0010B) happen to carry "Status | IN FORCE"
      and were always ACTIVE. Per BR-HO-0013's instruction to quote before/after if a test needed changing: none
      did. The one literal encoding of the old rule outside packet.py was in validate.py's verify_placement (not a
      test) -- before: `if lifecycle != classesmod.LIFECYCLE_ACTIVE: problems.append(f"A/{row['item_id']}:
      lifecycle {lifecycle!r} != ACTIVE")` inside the `section == "A"` branch; after: removed (see C4).
  - id: OI-2-real-corpus-still-has-no-machine-readable-lifecycle-for-these-ten-records
    text: >
      The underlying B5/authority-layer question OI-3 partly raised (that Contract v3, the frozen gate contract,
      the launcher and several orchestration records carry no recognisable Status/in_effect marker, so
      govbridge.authority.lifecycle.classify legitimately returns UNKNOWN for them) is UNCHANGED by this repair and
      out of its scope (govbridge/authority/** was not touched, per the handoff's explicit prohibition). This
      repair only fixes WHERE a non-ACTIVE mandatory item is placed (always A, never silently moved) and makes the
      gap visible (lifecycle banner + J notice) -- it does not and must not make these records ACTIVE. Whether any
      of the ten should eventually get a machine-readable status line is a question for whoever owns those source
      records, not for the bridge.
