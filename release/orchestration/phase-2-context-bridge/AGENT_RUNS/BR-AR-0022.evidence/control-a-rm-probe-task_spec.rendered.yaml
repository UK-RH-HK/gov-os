  in code, and which tests prove it -- plus prove mandatory-input fidelity end to
  end on the real view, with one oversize mandatory item (no selector) and one real
  mandatory item narrowed by a declared `keys` selector.
view: config/canonical-view.yaml
required_inputs:
- state_ref: state:bridge#contract_v3
  reason: the owner source contract (the evidence-owner requirement) -- CONTROL-A's
    own required input, unchanged
- path: release/orchestration/phase-2-context-bridge/ORCHESTRATOR_STATE.yaml@records
  reason: 'R1-RM acceptance check 3: a real, ~89KB mandatory item (over the 24KB per-item
    cap) with a declared `keys` selector -- exactly `schema` and `current_prohibitions`
    must be delivered in full, every other top-level key disclosed as an undelivered
    range via MANDATORY_PARTIAL_DELIVERY'
  keys:
  - schema
  - current_prohibitions
seeds: []
queries: tests/fixtures/controls/control-a/queries.yaml
retrieval_exclusions:
- release/orchestration/phase-2-context-bridge/ARCHITECTURE/**
- release/orchestration/phase-2-context-bridge/AGENT_RUNS/**
- release/orchestration/phase-2-context-bridge/DEMONSTRATION/**
mutation_scope: []
prohibitions: []
required_checks: []
