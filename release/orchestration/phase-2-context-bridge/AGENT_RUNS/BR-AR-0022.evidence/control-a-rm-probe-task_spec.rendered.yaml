schema: govbridge-task-spec/1
task_id: CONTROL-A-RM-PROBE
role: R1-RM acceptance probe (REPAIR_DAG.yaml node R1-RM acceptance check 3) -- not
  a demonstration; a CONTROL-A-derived task spec, never CONTROL-A's own committed
  file (that stays untouched)
objective: Explain why renaming or removing a certification test breaks gov contract
