open_issues:
- 'OI-1 Owner-level questions: none. The records settle every trade-off this design needed. The corpus is set by OC-BR-02.
  The authority classes are set by mandatory_bridge_inputs. The exclusions come from SECURITY_POLICY and ARCHIVE_POLICY.
  The model latitude comes from the launcher''s semantic bootstrap rule. The write boundary comes from BR-HO-0001 and OD-P2-10B.'
- 'OI-2 Named coverage cost, not an owner question. Applying SECURITY_POLICY.secret_content_patterns faithfully (block_index_and_report,
  :27) excludes 8 product files from the content indexes: runtime/src/security/secrets.rs and 7 tests/certification/*.rs files
  including brownfield.rs. They contain fake test keys. They stay reachable as exact-route metadata, and packets that need
  them say so. Redact-and-index would need an explicit owner decision; nothing currently asks for one.'
- 'OI-3 Estimates to be measured by builders: the full semantic build (~27 min, from the measured chunk count and rate under
  machine load 2-14); the records/graph build and the global edge recompute on incremental builds (estimated <= 30 s); the
  real per-run token overhead. Nodes I1 and D1 measure these, and telemetry records them.'
- OI-4 Oracle secrecy is procedural. The oracle lives in a 0700 directory outside every worktree; only a sha256 commitment
  is committed before the demonstration; its path is absent from every builder and demonstration brief. A builder that searched
  the filesystem could still find it. The orchestrator should create that directory only after builder dispatch, or in a location
  builders' permissions exclude.
- OI-5 tree-sitter-rust 0.24.0 leaves localised ERROR nodes in 10 files (e.g. cli/src/main.rs:2285, runtime/src/exec_resolve.rs:370,681,
  runtime/src/contracts.rs:687, runtime/src/upstream.rs:753). The adapter labels its regex fallback in those spans as heuristic.
  None of the rule-composition files verified in C7 is affected.
- OI-6 The DAG's B3 and B5 acceptance checks name a few public Review-8 facts (for example the single caller of partition_floor_rules_against_kernel),
  alongside unrelated controls (resolve_state_root, D-0006 why-chain). These are acceptance data, not design inputs. The held-out
  oracle grades stage-level anchors and must_state facts that builders never see.
- OI-7 check_state.py verify is designed to run on bridge/p2-context-retrieval; on bridge/arch-0001 it reports only 'HEAD
  branch bridge/arch-0001 != bridge_branch' (expected), and no mutation-boundary, anchor or YAML problem.
