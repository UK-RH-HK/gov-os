open_issues:
  - id: OI-1-authority-layer-full-rebuild-is-slow-under-contention
    text: >
      A from-clean `freshness rebuild --layer authority` on the real repo took ~240-280s across three independent
      runs on this machine (ARCHITECTURE.md section 12's cost table targets ~30s), even after two optimisations
      (scan_ref(keep_text=True) reuse via classify()'s new pre_text parameter, and a call-scoped lru_cache around
      gitobj.blob_at/read_blob for the remaining fallback reads). Isolated profiling early in this run showed the
      classify() loop itself is fast once caching engages (~1500 items in ~17s); the dominant remaining cost
      appears to be git-subprocess-spawn latency under this machine's contention from concurrently running
      sibling builders (B2-B4, confirmed via `ps`/`uptime` mid-run), not an algorithmic issue in this scope.
      Result is still fully DETERMINISTIC (three runs, two after further correctness fixes, all gave manifest_sha256
      6586ae8160f996c2ea8ae9e9383a3898f33f4f3f8ac3ab522327ee98b6be5c2f the two times it mattered) and completes
      well inside any reasonable timeout; routed to I1/the verifier as a performance note, not a correctness gap.
  - id: OI-2-mentions-cites-code-route-edges-not-persisted-globally
    text: >
      Only DEFINES (one per record definition) and registry-derived SUPERSEDES edges are persisted in the
      authority_edge table; MENTIONS/CITES_PATH/CITES_LINE/CITES_COMMIT/CODE_CITES/EVIDENCE_MAP and the
      B3-dependent CALLS/READS_KEY/TESTS remain on-demand, bounded, per-seed lookups in govbridge/graph/derive.py
      (used directly by why.py/history.py), not globally pre-computed rows. A whole-corpus MENTIONS/CITES scan for
      every one of ~2,900 record ids is a materially larger, separate operation from this layer's ~4 minute
      DEFINES-only pass; I1 may promote them into this same schema later without changing its shape. Routed to I1.
  - id: OI-3-review-8-probes-multi-path-item-uses-its-first-path-only
    text: >
      REVIEW-8-PROBES (a mandatory_bridge_inputs item) lists two paths (a directory and a file); resolver.py's
      _mandatory_item_from_row treats required_inputs rows as single-occurrence and resolves only paths[0] (the
      directory) as the MandatoryItem's own occurrence -- both paths still verify to exist, but only one is
      recorded as the item's primary (path, blob). Every other mandatory_bridge_inputs item has exactly one path.
      Routed to B6/I1 in case packet compilation needs both paths represented as separate section-A evidence.
  - id: OI-4-state-aliases-are-a-small-hardcoded-table
    text: >
      config/id-grammar.yaml and config/authority-registry.yaml are B5's only permitted new config files (per the
      DAG node's mutation_scope), so the "bridge"/"phase-2"/"phase-1" state-alias -> ORCHESTRATOR_STATE.yaml path
      table used by resolver.py's state_ref parsing and by state.py's CLI lives as a small constant
      (resolver.STATE_ALIASES) rather than its own config file. It is generic in shape (any repository domain that
      has its own ORCHESTRATOR_STATE.yaml could be added as a fourth entry) but is currently a closed, hand-written
      set of three. Routed to I1/B6 in case a fourth domain's state needs to be addressable later.
  - id: OI-5-b1-reused-as-is
    text: >
      No changes were needed or made to govbridge/core/**; B1's gitobj/view/corpus/yamlutil/manifest/freshness APIs
      were sufficient as given. The one real defect found in a B1-owned function (pathrules.glob_match has no
      brace-alternation support) was worked around entirely within this node's own scope (registry.expand_braces),
      per the working rules never editing govbridge/core/**.
