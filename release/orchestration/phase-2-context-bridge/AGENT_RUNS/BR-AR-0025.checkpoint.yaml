findings:
- >-
  govbridge/core/store.py's open_db() (B1's file, out of this node's mutation_scope) unconditionally runs
  `PRAGMA journal_mode=WAL` and `INSERT OR IGNORE INTO store_meta(...)` on EVERY open, whatever the caller's
  intent. Empirically verified (interactively, against the real 889 MB store, twice): against an OS-read-only
  store.db this raises `sqlite3.OperationalError: attempt to write a readonly database` even though both
  statements are genuine no-ops on an already fully-built store; against a normal (writable) store, an
  open+query+close cycle leaves store.db byte-for-byte identical (sha256 unchanged). This is why BR-DAG-AMEND-
  R1-15's new test uses `govbridge state get` (which never calls open_db() at all -- it reads straight from Git)
  rather than `search`/`gather`/`why`/`impact`, which do call it via govbridge.route.real_routes/govbridge.
  lexical.query.
- >-
  govbridge/compile/packet.py's item_from_mandatory/_mandatory_text (out of this node's mutation_scope) produce
  THREE distinct "delivered" shapes with different delivered_sha256 semantics: (1) a single whole-piece body,
  where delivered_sha256 == hash_pieces([item.text]) exactly (the RC-1-relevant common case); (2) a keys/entries/
  paths-selector body, where item.text embeds packet.py's own private "--- name (loc) ---" per-piece headers and
  delivered_sha256 hashes only the raw per-piece text WITHOUT those headers (so a whole-body hash of the rendered
  text does NOT reproduce it -- "declared==delivered by construction" per resolver.declared_parts's own
  docstring); (3) a no-selector oversize/section-map body, where delivered_sha256 is None and nothing raw is
  embedded at all, only a structural disclosure. BR-DAG-AMEND-R1-10's verify_rendered_delivery handles all three,
  but only shape (1) gets an EXACT hash re-derivation; shapes (2) and (3) get a content-identity containment
  check instead (see report.yaml's conformance row and this file's own unresolved entry below).
- >-
  govbridge/demo/grade.py's own docstring states the rendered packet text "never" prints the internal item_id
  hash, only unit_kind:unit_id -- this was a deliberate design invariant (a worker can only cite what it can
  read) that the new body-begin/body-end markers had to preserve. Confirmed by construction (item_body_marker
  takes unit_kind/unit_id only, never item.item_id) rather than by a new grep-based test (a grep for a 24-hex-char
  item_id pattern inside packet.md would have been the independent second check; not added here since no
  existing test asserts this invariant either, and the marker format is exercised directly by test_verify_
  rendered_body.py's own round-trip test).
failed_approaches:
- >-
  Editing govbridge/compile/packet.py directly to add the section-I task-inputs item and/or a render-time hash
  of each item's exact rendered body. Both would have been the more "natural" single-module home for that logic,
  but packet.py is not in this node's mutation_scope (it is RX->RM->GA3's shared-file sequence; GA3 is its next
  editor). Resolved by building section_i.py as a POST-COMPILE enrichment step that calls govbridge.compile.
  render's own build_manifest/render_packet a second time with one item appended -- reusing the exact same public
  functions packet.py itself calls, never touching packet.py.
- >-
  Trying to make BR-DAG-AMEND-R1-10's rendered-body check an EXACT byte-for-byte reconstruction of packet.py's
  own private per-piece "--- name (loc) ---" header format for the keys/entries/paths-selector shape, so that a
  whole-body hash could be compared to delivered_sha256 directly. Abandoned as a fragile, out-of-scope coupling
  to a format R1-GA3 (packet.py's next editor) may change; replaced with the content-identity containment check
  (present in the report.yaml conformance rows and this file's unresolved section).
- >-
  Testing BR-DAG-AMEND-R1-15 by chmod'ing the REAL 889 MB store copy (store-BR-AR-0025) read-only and running
  `search` against it. This IS what first demonstrated (interactively, not as a checked-in test) that govbridge.
  core.store.open_db() hard-fails against an OS-read-only store.db (see findings) -- too slow and too coupled to
  a large, environment-specific store to make a good automated, hermetic test. Replaced with `state get` (never
  touches the store) against a tiny placeholder file in a fixture-built tmp_path, which proves the SAME
  observable guarantee (packet written under --out, store file/directory untouched) hermetically and fast.
unresolved:
- >-
  BR-DAG-AMEND-R1-10's containment check for the no-selector oversize/section-map shape verifies each disclosed
  range's own (name, sha256) pair is present in the rendered body -- catching REPLACEMENT/MUTATION (proven twice,
  independently, on the real CONTROL-A packet) but not a pure content INSERTION that adds unrelated text without
  removing/altering any existing disclosed identity. Closing this fully needs either a new render-time hash
  (a packet.py change, out of scope) or an exact reconstruction of packet.py's private format (fragile coupling).
  Routed to R1-GA3/R1-INT; not claimed closed (see report.yaml conformance).
- >-
  BR-DAG-AMEND-R1-15's own store-open-mode gap (govbridge/core/store.py's open_db() cannot honour a genuinely
  read-only-opened connection) is routed to whoever next owns that file, or the orchestrator; not fixed here
  (out of mutation_scope).
- >-
  tests/compile/test_compile_bootstrap.py's own pre-existing assertion, encoding the exact behaviour this node's
  Deliverable 4 removes, is left un-edited (out of mutation_scope) and now fails -- see decisions below for the
  specific request.
decisions:
- >-
  D-R1-RS-1 (within authority): section I's task-inputs enrichment (OBS-BR-07) is implemented as a POST-COMPILE
  re-finalisation (govbridge/compile/section_i.py:with_task_inputs_in_section_i), appending one more PINNED item
  to section I and re-running govbridge.compile.render's own build_manifest/render_packet, rather than editing
  govbridge/compile/packet.py's _build_i_item (out of this node's mutation_scope). Wired into both `govbridge
  compile --out` (govbridge/cli.py:cmd_compile) and the bootstrap (govbridge/compile/bootstrap.py:compile_brief),
  so every packet obtainable through this domain's CLI carries it consistently, and packet_sha256 always matches
  between the two entry points.
- >-
  D-R1-RS-2 (within authority): BR-DAG-AMEND-R1-10's rendered-body re-extraction is an EXACT hash-recompute for
  the common, RC-1-relevant single-piece "delivered in full" shape, and a content-identity containment check
  (every disclosed range's own name+sha256, covering the FULL section_map, not just the delivered subset) for the
  selector/oversize shapes -- see findings/unresolved for the specific, disclosed residual gap (pure insertion).
  This is the literal reading proportionate to "the smallest item-delimiting format support" the node brief
  names, not a narrowing: the negative test the amendment names explicitly (replace/mutate the rendered body,
  manifest intact -> FAIL) is met, independently, at three levels including two real-view, non-pytest shell/sed
  probes against the actual CONTROL-A packet.
- >-
  D-R1-RS-3 (within authority): supplementary packets place ALL evidence under section H (SUPPLEMENTARY RETRIEVED
  CONTEXT, render.py's own pre-existing letter for exactly this), with delivery=RETRIEVED/cls=None/
  lifecycle=UNKNOWN uniformly, regardless of an underlying hit's own resolved authority_class/lifecycle (kept as
  informational text in the rendered body instead of used for placement) -- avoiding any risk of a real
  authority_class's own allowed_sections rule conflicting with a section a supplementary packet was never meant
  to carry placement semantics for.
- >-
  D-R1-RS-4 (within authority): added --repo to `govbridge compile.bootstrap`'s CLI, `govbridge packet verify`,
  `govbridge receipt check`, and --repo/--view to `govbridge state get` -- none had these flags before. Necessary
  for this run's OWN new tests to exercise these commands end-to-end against a fixture repo hermetically (the
  brief's own "pass repo= explicitly in every test" rule) instead of relying on cwd-based git resolution (the
  same class of issue as the gitobj.repo_root() cache, routed to R1-INT). Minimal, additive, backward-compatible
  (omitting the flag keeps the pre-existing cwd-based default).
- >-
  D-R1-RS-5 (requested): tests/compile/test_compile_bootstrap.py::
  test_bootstrap_contains_prelude_packet_and_receipt_instructions fails after this repair because its own
  assertion (`assert "## A. MANDATORY AUTHORITATIVE INPUTS" in brief`, commented "the packet itself (A-J) is
  embedded, not summarised away") encodes EXACTLY the RC-9 defect this node's Deliverable 4 and REPAIR_PLAN.md
  section 6 require removing (the DAG's own acceptance check 3 requires the opposite). The file is not in R1-RS's
  mutation_scope, so it was not edited. Requesting either (a) a scope grant (to R1-RS or routed to R1-INT) to
  correct this one assertion -- replace it with an assertion that packet_sha256/packet_id are named and that
  "## A. MANDATORY AUTHORITATIVE INPUTS" is NOT inlined, mirroring this run's own test_bootstrap_references_
  packet_instead_of_inlining_it -- or (b) accepting it as a second named exception to amendment R1-T1's "0
  failures" rule, alongside test_compile_real_view_mandatory_in_a.py. This is the ONLY failure in the full domain
  suite (581 passed, 1 failed); it was not skipped, xfailed or weakened.
lessons:
- >-
  When a node's own deliverable requires REMOVING a documented behaviour (here, "the bootstrap inlines the whole
  packet"), check EARLY whether any pre-existing, out-of-scope test asserts that exact behaviour -- running the
  FULL domain suite only at the very end (as amendment R1-T1 requires) is still the right final gate, but a
  targeted `grep` for the behaviour's own distinctive string (here, `"## A. MANDATORY AUTHORITATIVE INPUTS" in
  brief`) across the whole tests/ tree, done as soon as the deliverable's literal reading is clear, would have
  surfaced this scope conflict before most of the implementation work, giving more time to raise the scope
  question to the orchestrator mid-pass rather than only at return.
- >-
  A mid-task amendment (BR-DAG-AMEND-R1-15) that asks for "one test" against a store "opened read-only" is worth
  testing EMPIRICALLY against the real dependency (here, sqlite) before writing the test -- the naive approach
  (chmod the file, run the normal code path) surfaced a genuine, pre-existing limitation in a dependency
  (govbridge/core/store.py's open_db()) that a purely textual reading of the amendment, or a mocked/monkeypatched
  test, would never have caught. Picking the one command that provably never touches the resource under test
  (here, `state get`, which reads Git directly) turned an initially-failing, scope-conflicted test into a
  genuinely strict, passing one, with the real limitation disclosed rather than hidden.
next_consumer: >-
