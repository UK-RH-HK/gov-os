open_issues:
  - id: OI-1-RESOLVED-code_blob-migration
    text: >
      The first COMPLETED return's OI-1 ("no migration for a pre-existing store's code_blob table") is resolved by
      C8/follow-up 2.
  - id: OI-2-RESOLVED-rules-parameter-now-used
    text: >
      The first COMPLETED return's OI-2 ("code_layer_builder accepts `rules` but never consults it") is resolved
      by C7/follow-up 1: `rules` is now threaded through to `ensure_indexed` and drives corpus-rule classification.
  - id: OI-3-store-BR-AR-0014b-only-used-for-check-2
    text: >
      Unchanged from the first return: store-BR-AR-0014b holds only the second from-clean code-layer build for
      check 2's reproducibility comparison.
  - id: OI-4-rs_files-in-stats-counts-every-rs-path-including-excluded-ones
    text: >
      `stats()`'s `rs_files` (and the underlying `_rs_paths`) deliberately still counts every `.rs` path at a
      commit regardless of corpus-rule verdict -- unchanged, to keep matching the pre-existing, frozen acceptance
      line ("exactly what `git ls-tree -r --name-only <commit> | grep -c '\.rs$'` counts",
      test_stats_counts_rs_files_and_definitions). `files_excluded` (new) and `definitions` (which naturally
      shrinks, since an excluded blob contributes zero code_symbol rows) are how an excluded file's absence is
      actually visible; `rs_files` answers a different, narrower question ("how many .rs paths exist") on purpose.
  - id: OI-5-content-regex-classification-reads-every-new-blobs-content-once-more-than-before
    text: >
      Classifying a blob through corpus.classify_entry's content_regex/binary rules requires reading its content
      via ContentSniffer; a NEWLY-seen INCLUDE-verdict blob is therefore read from Git twice on first sight (once
      by the sniffer for classification, once more via cat.read for tree-sitter parsing) -- previously it was read
      once. Already-cached blobs (the overwhelming majority on any but a from-clean build) are unaffected; a
      from-clean eager build across the three real refs still completes in ~3.3-3.8 s (measured, check2/check9),
      comfortably under ARCHITECTURE.md section 12's ~1.5 s/commit estimate for three commits. Not fixed: avoiding
      the double read would mean reaching into ContentSniffer's decoded text and re-encoding it, which risks a
      subtle non-byte-identical round-trip for content tree-sitter must parse byte-exactly; simplicity and
      correctness were preferred over this micro-optimisation.
