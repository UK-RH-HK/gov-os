open_issues:
  - id: OI-1-code_blob-schema-gained-a-column-not-a-migration
    text: >
      code_blob.eager is added via `CREATE TABLE IF NOT EXISTS` (unchanged) plus a bare `ALTER TABLE`-shaped
      addition is NOT what was done -- the full CREATE TABLE statement in govbridge/code/store.py was edited
      in place to include the new column, matching how every other schema change in this codebase (there is no
      migration framework; SCHEMA_SQL is idempotent DDL run every ensure_schema() call) is handled. This is safe
      for a fresh store (this run only ever built into store-BR-AR-0014/-0014b, both fresh) but a caller with an
      OLDER store.db that already has a code_blob table WITHOUT the eager column would need that table dropped or
      migrated -- `CREATE TABLE IF NOT EXISTS` does not retrofit a column onto an existing table. No such store is
      known to exist outside this run's own throwaway ones; flagged for whoever next builds a from-clean store
      from an old checkout.
  - id: OI-2-rules-parameter-unused-by-the-code-builder
    text: >
      code_layer_builder accepts `rules` (govbridge.core.freshness.BuilderFn's shared signature -- every builder
      gets corpus rules passed in) but never consults it, matching ensure_indexed's own pre-existing behaviour:
      the code route parses every `.rs` blob at a commit regardless of config/corpus-rules.yaml's INCLUDE/EXCLUDE
      verdicts (ARCHITECTURE.md section 4.6 says "parses every Rust blob", not "every corpus-included Rust blob").
      Changing that would alter query behaviour too (ensure_indexed is shared by queries and the eager build) and
      is out of this repair's scope (BR-HO-0014 items 1-4 do not ask for corpus-rule filtering); noted so a future
      change to corpus-rules.yaml that targets `.rs` files is not surprised to find the code route ignoring it.
  - id: OI-3-store-BR-AR-0014b-only-used-for-check-2
    text: >
      Per the handoff, store-BR-AR-0014b holds only the second from-clean code-layer build for check 2's
      reproducibility comparison -- it was never used for check 3/4/5 (those ran against store-BR-AR-0014 and
      hermetic fixture repos respectively, per BR-HO-0014's own instructions).
