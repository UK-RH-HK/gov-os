role: >-
  REPAIR-1 node R1-XC (BR-DAG-AMEND-R1-16/-17) -- cross-cutting fixes: freshness -m entry point (R1-5), gitobj
  repo_root cache (R1-6), authority import-time config read (R1-12), thread-safe ExclusionCounter (R1-14), and
  read-only code/classification query paths (R1-17 items 5 and 6)
model_observed: claude-sonnet-5
