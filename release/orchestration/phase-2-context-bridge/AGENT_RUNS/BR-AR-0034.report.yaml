claims:
- id: C-1
  text: >-
    (R1-5) `python -m govbridge.core.freshness rebuild --from-clean` and `python -m govbridge index rebuild
    --from-clean` now build the identical layer set and per-layer digests. The `-m` entry point's own
    `if __name__ == "__main__":` block delegates to the canonical `govbridge.core.freshness` module (imported by
    its dotted name) rather than running `main()` in the `__main__` copy's own namespace, so every sibling
    package's `register_layer_builder` call (made against the canonical module, by dotted-name import, as they
    always were) lands in the SAME `_LAYER_BUILDERS` dict the delegated `main()` actually reads.
- id: C-2
  text: >-
    (R1-6) `govbridge.core.gitobj.repo_root()` resolves the starting directory (or the CURRENT cwd, read at call
    time, when no `start` is given) BEFORE it reaches the `functools.lru_cache`, so two `os.chdir` calls in one
    process resolve two distinct cache keys and hence two different repositories, rather than the first bare
    caller's cwd winning the cache's one `None`-keyed slot for the rest of the process.
- id: C-3
  text: >-
    (R1-12) `govbridge.authority.classes.BRIDGE_STATE_PATH` is now a PEP 562 lazy module attribute, computed and
    cached on first ACCESS rather than at import time. Merely importing `govbridge.authority` (directly, or
    transitively through `govbridge.code.lineage_layer`/`govbridge.graph.derive`, which need it only for
    id-grammar resolution) no longer touches the filesystem at all, so `tests/code/conftest.py`'s collection-time
    `import govbridge.authority` workaround (which existed only to win the resulting import-order race) is
    removed. Every existing external consumer (`govbridge.authority.lifecycle`, and every fixture repobuilder's
    `from govbridge.authority.classes import BRIDGE_STATE_PATH`) still sees a plain string, unchanged. The class
    table, the class-table test, the six named invariant tests and the import-boundary test are byte-unchanged
    (verified: `git diff --stat` shows no output for any of them).
- id: C-4
  text: >-
    (R1-14) `govbridge.core.taskctx.ExclusionCounter.bump` now serialises through a `threading.Lock`, so
    `excluded_hits` is exact when `govbridge.gather.engine` shares one counter across its `--threads` worker pool.
    Proven three ways: many threads hammering `bump()` directly against an exact expected total; a real `gather()`
    call at `--threads 16` vs. `--threads 1` over the same fixture/query reporting the identical `excluded_hits`
    (independently cross-checked against the fixture's own known excluded-file count); and a deterministic
    structural test that holds the counter's own lock from the main thread and confirms a concurrent `bump()`
    call genuinely blocks on it (see decisions/lessons for why the first two do not reliably fail against the
    pre-fix class on this interpreter, and why the third is the one that does; ACCEPTED by the orchestrator on
    pass 1, unchanged).
- id: C-5
  text: >-
    (R1-17 item 5, REOPENED and CORRECTED) `govbridge.code.symbols.ensure_indexed` is now BUILD-ONLY -- its only
    legitimate caller is `govbridge.code.build.code_layer_builder`, at build time. EVERY query caller, without
    exception, now uses `ensure_indexed_readonly` (read-only, by construction; raises the typed
    `StoreNeedsRebuild`, mirroring `govbridge.lexical.query.StoreNeedsRebuild`, for any `.rs` blob the eager
    code-layer builder has not already reached): this module's own `stats`/`definitions`/`callers`/`reads_key`
    (converted, not duplicated -- the pass-1 `definitions_readonly`/`callers_readonly` functions are removed),
    `govbridge.route.real_routes`'s code route, `govbridge.code.history` (the `history diff`/`deleted`/
    `introduced` CLI), `govbridge.compile.codeseeds` (compile's record-citation code-seed derivation),
    `govbridge.graph.code_bridge` (why/impact/search/gather/compile's shared code connection),
    `govbridge.graph.symbol_history` (`introduced-in`/`deleted-in`), and `govbridge.demo.grade` (GD-10's own
    citation-symbol lookup, which keeps its own, deliberate "never raises" grading contract -- see decisions
    D-R1-XC-6). Pass 1's narrower reading (read-only variants for real_routes.py's code route alone, everything
    else left lazy) is documented in `failed_approaches` and superseded.
- id: C-6
  text: >-
    (R1-17 item 6, plus REOPENED open issue 2) `govbridge.authority.layer.classify_hit`/`record_id_for_occurrence`
    no longer call `ensure_schema()` at query time; `govbridge.route.real_routes._conn()` uses
    `store.open_db_readonly()`. `code_route`'s own four code-layer call sites (the blob-to-path map, the shaped
    code connection, `definitions()`, `callers()`) no longer swallow `StoreNeedsRebuild` in a bare
    `except Exception` -- each re-raises it specifically, catches only the one genuinely expected `ValueError` (a
    commit that does not resolve), and counts any other, truly unanticipated exception via a new
    `_record_unexpected_exception` helper (writes `{event, site, exception_type, ...}` to
    `govbridge.core.telemetry`'s local "queries" sink -- never the git-tracked store).
- id: C-7
  text: >-
    (Acceptance, expanded this reopening) On a FILE-LEVEL AND DIRECTORY-LEVEL read-only store, built from clean
    with every layer: `why`, `impact`, `history`, `compile`, `gather` (every route active) and
    `govbridge.code.symbols.callers`/`.definitions` all succeed, and the store file's sha256 stays byte-identical
    across every one of them (`tests/route/test_query_commands_readonly.py`, new). On a store built from clean
    WITHOUT the code layer (every ref's own `layers` list omits "code" -- the SAME generic admission rule
    `govbridge.code.build.eager_ref_names` already reads, never a special-cased ref name), also made read-only:
    `impact`, `compile` (via its own MAIN, unwrapped per-seed code-route call -- see findings), `gather` (seeded so
    its code facet runs) and `callers`/`definitions` each raise `StoreNeedsRebuild` and write nothing; `why`/
    `history` are unaffected either way (neither ever touches the code layer at all, confirmed directly, not just
    by inspection).
- id: C-8
  text: >-
    (Third reopening, follow-up 1) `tests/compile/conftest.py`'s and `tests/graph/conftest.py`'s own `_no_env_leak`
    autouse fixtures now `setenv` a fresh, per-test `tmp_path`-derived `GOVBRIDGE_STORE` instead of only
    `delenv`-ing it, so every test in both packages is genuinely hermetic (R1-T1) and never reads the machine-wide
    shared default store -- the actual root cause of
    `test_compile_real_view_mandatory_in_a.py::test_real_demonstration_task_compiles_byte_identical_twice`'s own
    flake (not the git-ref confound R1-RM already closed). A `tests/` -wide grep for other store-touching calls
    lacking their own isolation found no further ACTIVE bugs in scope (tests/authority, tests/notes, tests/
    semantic, tests/core all share the same delenv-only pattern in their own conftest.py, but no current test in
    any of them relies on it, and none of those four directories is in this run's own mutation_scope -- routed to
    open_issues). Isolating tests/integration/test_demo_grade_regressions.py's own store (already in scope)
    uncovered a genuine, pre-existing hidden bug in its own GD-10 regression test (relying, undetected, on the
    shared store already having the fixture commit's code layer built by something else), corrected by giving that
    one test its own eager build (rule 5, decisions D-R1-XC-9) -- not a new defect this fix introduced.
- id: C-9
  text: >-
    (Third reopening, follow-up 2) `govbridge/graph/impact.py`'s own authority-graph BFS now opens the store via
    `store.open_db_readonly()` instead of `store.open_db()`, for construction-level consistency with the other six
    query paths this node already closed (scope explicitly extended to this file by the coordinator). No
    before/after test failure exists to demonstrate here, honestly reported as such: `store.open_db()`'s own
    "tolerate a read-only FILE" behaviour meant impact() never actually crashed or wrote against this run's own
    file+directory read-only acceptance fixture either, before or after. `impact` is already exercised by
    `tests/route/test_query_commands_readonly.py` in both the file-level read-only success scenario and the
    missing-code-layer `StoreNeedsRebuild` scenario (via its own, separate code-route call, unaffected by this
    fix).
- id: C-10
  text: >-
    (Fourth reopening, BR-DAG-AMEND-R1-23: ONE RESOLVED VIEW PER OPERATION) `govbridge.core.exact.show`/`grep`/
    `path_resolve`/`id_lookup` all now accept an optional `resolved_view`, using it instead of re-resolving
    `config/canonical-view.yaml` when given (the exact defect
    AGENT_RUNS/BR-AR-0024.check-ca-why-wall-time-defaults.out found: a single ~1031s gather recording FOUR
    different "records" commits, traced to `grep()`/`id_lookup()` re-resolving the view fresh on every call).
    `govbridge.route.real_routes.exact_route` now threads the ONE `resolved_view` its own `build_real_routes`
    already resolved through to `id_lookup`, instead of handing it a bare `view_path`; `build_real_routes` also
    now passes that same `resolved_view` into `registrymod.load(...)` and `lifecyclemod._load_mandatory_items(...)`
    (both already accepted it -- only the call sites were missing the argument). `govbridge.route.router.RouteSet`
    gained a `resolved_view` field so a caller (gather, compile, search) can read/record the one view its own
    routes were pinned to. `govbridge.core.view.ResolvedView` gained `pinned_refs()`, a generic
    `{name, commit, status}` list for an operation's own output to record its pins in. A tests-wide, read-only
    audit (delegated to an Explore agent) found MANY more tip-resolution sites across govbridge/** outside this
    run's own mutation_scope (lexical/query.py, semantic/search.py, authority/lifecycle.py, gather/followup.py's
    own second resolution, compile/packet.py -- the most affected operation -- graph/why.py, graph/history.py,
    answers/cite.py, answers/lint.py); reported with file:line in the checkpoint's `findings`, not fixed, per this
    reopening's own instruction.
- id: C-11
  text: >-
    (Fifth reopening, BR-DAG-AMEND-R1-23 extended to every audited site) every non-compliant site the pass-4
    audit found is now fixed, within this pass's own extended scope: `lexical.query.query`/`semantic.search.
    search` accept and reuse `resolved_view`; `authority.lifecycle.classify`/`_find_definition`/`find_definition`
    accept and reuse it too (a NEAR-FROZEN module -- ONLY this one parameter added to each of three functions, no
    other line changed; the class-table, import-boundary and every lifecycle test pass byte-unmodified);
    `exact.id_lookup`'s own `definition_sites` lookup now threads `resolved_view` into `find_definition`, closing
    the residual gap C-10 reported; `gather.followup._resolve_view_for` (an independent second resolution) is
    REMOVED, replaced by reusing `routes.resolved_view`; `graph.why.why`/`graph.history.history` accept
    `resolved_view` and record `resolved_refs` in their own output; `answers.cite.cite_identifier` resolves once
    and threads it into all four of its own identifier-kind branches (previously up to two independent
    resolutions in one call); `answers.lint.lint_answers` resolves once and passes it into every one of its
    (potentially many) internal `cite_identifier` calls; `compile.packet.compile_packet` now makes exactly ONE
    resolution for its whole lifetime -- `resolver.resolve`, `Compiler.__init__`, every per-seed `why()`/
    `history()` call, and both per-query `RouteSet` rebuilds (including their own `gather_with_followup` calls)
    all reuse it, mechanically verified by a monkeypatched, counting `viewmod.resolve_view` showing ZERO
    additional calls (13 before the fix, on the identical scenario). `manifest.view`, gather's own result, and
    cite's own result each record the one view actually used (`resolved_refs`/`view_rows`), per this reopening's
    own requirement 1. Re-auditing afterwards (two independent methods: this run's own direct grep/call-graph
    cross-check, and a fresh Explore agent given no access to this run's own conclusions) -- see C-12 for what
    that re-audit actually found (this run's own first method's "zero remaining" claim was wrong).
- id: C-12
  text: >-
    (Fifth reopening requirement 4's own required re-audit) this run's own first method (a direct grep/call-graph
    cross-check) wrongly reported "zero remaining defects". A genuinely independent second method (an Explore
    agent given the current code but no access to this run's own conclusions, using dynamic call-counting probes
    against the real operations in addition to static call-graph tracing) found two real defects the first
    missed: `authority/resolver.py`'s own id-form `required_inputs` branch (reachable from compile, packet verify
    and receipt check) never threaded `resolved_view` into its own `lifecycle._find_definition` call, even though
    `resolve()`'s other two branches already did -- a live re-resolution of "records" for every id-form entry;
    `core/exact.py`'s own `id_lookup` (already fully in this run's own scope since pass 4 -- a gap in this run's
    OWN prior fix, not a scope question) resolved the view TWICE per call (once inside `grep()`, once inside
    `lifecycle.find_definition()`) rather than once, itself, before calling either. Both are now fixed and proven
    fails-before/passes-after. `authority/resolver.py` and its own test file `tests/authority/test_resolver.py`
    are added to this run's own mutation_scope directly -- not part of either scope-extension message, but a
