run_id: BR-AR-0034
role: >-
  REPAIR-1 node R1-XC (BR-DAG-AMEND-R1-16/-17) -- cross-cutting fixes: freshness -m entry point (R1-5), gitobj
  repo_root cache (R1-6), authority import-time config read (R1-12), thread-safe ExclusionCounter (R1-14), and
  read-only code/classification query paths (R1-17 items 5 and 6). REOPENED three times: pass 1 -> pass 2 on
  R1-17(5) plus open issue 2; pass 2 -> pass 3 on two follow-ups (the real cause of the one remaining full-suite
  flake, and govbridge/graph/impact.py's own store.open_db() -> open_db_readonly()). This report covers all three.
