  - id: C3-vector-store-matches-the-schema
    text: >
      govbridge/semantic/vectors.py's `vector` table is exactly
      vector(chunk_id TEXT PRIMARY KEY, text_sha256 TEXT, pin_id TEXT, dim INT, vec BLOB), float32 LE, matching
      ARCHITECTURE.md section 4 and schemas/build-manifest.yaml's vector layer field. digest_for_pin computes
      sha256 over sorted (chunk_id, sha256(vec)) using the same FIELD_SEP/ROW_SEP convention
      govbridge.core.manifest's own layer digests use. search() is brute-force cosine (vectors are pre-normalised,
