open_issues:
  - id: OI-1-freshness-cli-has-no-layer-package-auto-discovery
    text: >
      `python -m govbridge.core.freshness rebuild --layer semantic` (the acceptance check's literal command) does
      not, by itself, know the "semantic" layer exists: govbridge.core.freshness self-registers only its own
      "core" builder at import time; a sibling layer's register_layer_builder() call runs only when that layer's
      OWN package is imported first, and nothing in govbridge.core imports sibling layer packages generically
      (manifest.py's own docstring documents the register_layer/register_layer_builder extension points for
      B2-B5 but does not provide a discovery mechanism). This node's mutation_scope excludes govbridge/core/**,
      so it cannot add one. Worked around, in-scope, for every command in this run's checkpoint that needs the
      "semantic" layer registered: `import govbridge.semantic` is added ahead of the call (either naturally, via
      `python -m govbridge.semantic.<module>`, which imports the govbridge.semantic package first and registers
      as a side effect; or explicitly, via
      `python -c "import govbridge.semantic, govbridge.core.freshness as f, sys; sys.exit(f.main(sys.argv[1:]))"
      rebuild --from-clean --timings` for the freshness CLI itself, recorded verbatim in the checkpoint). A
      second, related consequence: because this registration is process-global (Python module state), importing
      govbridge.semantic anywhere in a pytest session that ALSO collects tests/core means a bare freshness.run()
      call inside tests/core now also runs the "semantic" builder. Verified this does not break any tests/core
      assertion in either collection order (see C8/check6/check7); the underlying gap is generic to every B2-B5
      package, not specific to this node, and belongs to I1 (which wires the whole govbridge package together)
      or a future govbridge.core change to resolve properly (e.g. a real plugin-discovery hook, or per-run layer
      registry scoping).
  - id: OI-2-semantic-manifest-block-lives-under-layers-vector-not-pins-semantic
    text: >
      schemas/build-manifest.yaml describes the semantic manifest block (SEMANTIC_ROUTE.md section 4) as living
      at the top-level `pins.semantic`. govbridge.core.freshness.run() builds its `pins` dict inline
      (`pins = {"chunker_version": CHUNKER_VERSION}`) with no hook for a layer to contribute its own pins entry --
      unlike `layers`, which DOES have a public register_layer() extension point. Outside this node's
      mutation_scope (govbridge/core/freshness.py), so this run instead attaches the full block (adapter, model,
      runtime, encoding, embed_profile_sha256, pin_id) as `layers.vector.extra["semantic_block"]`, which
      LayerDigest.to_dict() already merges into the manifest through the existing, sanctioned register_layer("vector",
      ...) path. All the same information is present in the manifest and byte-verifiable (see
      AGENT_RUNS/BR-AR-0006.check3a-manifest-vector-layer.out), just reachable at
      manifest.layers.vector.{status,pin_id,semantic_block} rather than manifest.pins.semantic. Flagged for B1/I1
      to reconcile (e.g. generalising the pins dict construction the same way layers already is) -- this affects
      B2 (fts_tokenizer) and B3 (code_adapters) identically, not just this node.
  - id: OI-3-authority-class-and-lifecycle-are-placeholders-pending-b5
    text: >
      govbridge.semantic.search assigns every result authority_class "UNCLASSIFIED" and lifecycle "UNKNOWN" (the
      exact non-ladder placeholder values ARCHITECTURE.md section 5.1/5.2 define for "otherwise unclassified"),
      because real classification is govbridge.authority's job (node B5), which is not in this node's depends_on
      and is not merged into this branch's base. A `classify` callable parameter lets a caller (B6/I1, once B5 is
      merged) supply the real classifier without editing this file; version_status is NOT a placeholder -- it is
      computed for real via the already-built govbridge.core.view canonical model, exactly as the exact route
      does. Because the semantic route can only ever land in packet sections B-H with delivery RETRIEVED (never
      A/D.1, ARCHITECTURE.md section 5.3), this placeholder can never be mistaken for authority.
  - id: OI-4-model-pin-yaml-local-name-does-not-match-the-real-bootstrapped-cache
    text: >
      config/model-pin.yaml declares `local_name: pooling_config.json` for the `1_Pooling/config.json` artefact
      (presumably to avoid a filename collision with the top-level config.json once flattened). The real, shared
      model cache B1's bootstrap already populated (verified on disk at
      $HOME/.cache/gov-bridge/models/BAAI-bge-small-en-v1.5/<revision>/) preserves the original nested path
      instead -- there is a `1_Pooling/config.json`, never a `pooling_config.json`. govbridge.semantic.modelpin
      resolves every artefact by its declared `path` verbatim (subdirectories preserved), matching the REAL
      layout rather than the aspirational `local_name` field, which avoids a spurious MODEL_UNAVAILABLE; `local_name`
      is still parsed and kept on the Artefact dataclass for visibility but is not used for filesystem resolution.
      Flagged for B1/bootstrap.sh reconciliation (either bootstrap.sh should honour local_name, or model-pin.yaml's
      local_name field should be dropped/corrected).
  - id: OI-5-embed-and-store-commits-once-at-the-end-not-per-batch
    text: >
      vectors.embed_and_store() calls conn.commit() once, after every batch has been embedded, not after each
      individual batch. A from-clean full rebuild that is killed or crashes partway through therefore loses ALL
      of this run's vector progress (the already-committed core layer -- occurrence/blob/chunk -- survives, since
      core_layer_builder commits its own work first and separately), and because
      govbridge.core.freshness.determine_trigger() always forces a full store.move_store_aside() whenever no
      manifest was successfully saved yet (which is exactly the case after an interrupted run), a retry cannot
      resume from the partial vector table either way under the current CLI -- it always restarts from clean.
      This run's own full rebuild completed successfully in one pass (~36 minutes, see C5), so this was not hit
      in practice, but is worth reconsidering (periodic commits, or a resumable invocation that bypasses
      freshness.run()'s move-aside via a direct embed_and_store() call against an already-populated store) if a
      future full corpus grows enough that a single embed pass becomes failure-prone.
  - id: OI-6-plugin-blob-fixed-mid-run
    text: >
      An earlier version of freshness_layer.py computed `semantic_block.adapter.plugin_blob` via
      manifest.bridge_code_tree(), which returns the TREE id of the whole govbridge/ directory -- the wrong git
      object kind for a single plugin file, and (since this node's files were not yet committed when the one
      real, full corpus rebuild ran) a stale value from before this branch's own commit besides. Fixed in code
      (a new _adapter_blob() helper resolves govbridge/semantic/adapters/onnx_embed.py's own blob id at HEAD via
      gitobj.rev_parse, mirroring bridge_code_tree()'s "None until committed" convention) and covered by the
      existing test_vector_status_built_and_rows_recorded_in_manifest test (which checks the block's other
      fields; plugin_blob is exercised structurally but its concrete value is not asserted since it depends on
      commit state). The already-persisted manifest.json in $HOME/.cache/gov-bridge/store-BR-AR-0006/ (this run's
      real-corpus evidence, check3/check3a) still carries the OLD, incorrect value, since re-running the ~36-minute
      full embed solely to refresh one provenance field was judged not worth the CPU cost this run's isolation
      rules ask other parallel builders to share; the next FULL rebuild of this store (which a future commit to
      govbridge/ triggers unconditionally, via the code_tree fingerprint) will record the corrected value with no
      further action needed.
