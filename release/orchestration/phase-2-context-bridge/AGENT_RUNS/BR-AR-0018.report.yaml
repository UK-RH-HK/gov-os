open_issues:
- 'govbridge/core/gitobj.py:22-23: repo_root()''s functools.lru_cache(maxsize=8) is keyed only on the argument
  actually passed, so every BARE call (repo=None/start=None, "resolve against cwd") in a process shares ONE cached
  answer regardless of which cwd was current at each call site or afterwards -- this made this node''s own cli
  search test order-dependent (fixed here by giving search an explicit --repo, never relying on cwd) and is the
  same class of process-global-state issue as the test_compile_real_view flake below. gitobj.py is outside R1-RX''s
  mutation_scope: NOT fixed here. A correct fix would key the cache on the resolved repo (e.g. cache by the
  ABSOLUTE path `start` resolves to via `git -C <cwd-or-start> rev-parse --show-toplevel`, computed once without
  caching, or drop the cache and let each of the -- currently 8, per maxsize -- callers that truly want a cached
  cwd-relative root request it explicitly) rather than by the raw, possibly-omitted argument.'
- 'tests/compile/test_compile_real_view_mandatory_in_a.py flaked non-deterministically under concurrent git activity
  in this shared multi-agent worktree (see claims); it reproduces the same way with the unmodified packet.py, so no
  action is needed from R1-RX, but the next node/integrator should expect it and re-run in isolation if it fires.'
- 'why/impact''s code-route hops (callers/callees/TESTS via the shaped code connection) are not exclusion-filterable
  at this layer -- their evidence_occurrence is "blob:line", not a path (occurrence_path returns None for them,
  honestly, rather than guessing). Resolving blob-to-path there (the same map govbridge.route.real_routes builds
  for itself) would close this, but OBS-BR-08/RC-8 scope this node to the CLI routes and the two named compile call
  sites, not graph-derived code edges; flagged for R1-RL (graph and lineage additions) or a future observation if
  the orchestrator wants it closed.'
- 'govbridge/core/exact.py''s path_resolve (the `exact path` subcommand) was left without --task/excluded_hits: it
  returns candidate PATHS only, never content, so there is nothing to withhold -- a deliberate scoping decision,
  not an oversight (see the checkpoint''s decisions).'
