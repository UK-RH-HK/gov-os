findings:
- 'RC-8/OBS-BR-08 named exactly two govbridge/compile/packet.py call sites as running without exclusions -- the seed
  code route (compile_packet''s per-seed loop) and the D.2 "evidence both ways" templates (_attach_evidence_both_ways)
  -- confirmed by reading packet.py before editing; the query loop already passed task_spec.get(''retrieval_exclusions'')'
- 'govbridge.lexical.query.query already filters by exclude= internally but exposes no drop count and is outside this
  node''s mutation_scope; real_routes.lexical_route discloses excluded_hits with a second, exclude=None call over the
  SAME query, counting hits whose occurrence path falls under the merged exclusion list -- the same double-run
  technique ARCHITECTURE/REPAIR-1/evidence/tools/exclusion_probe.py itself used to first diagnose RC-8'
- 'code-route hops built from govbridge.graph.code_bridge''s shaped connection (callers_of/callees_of/tests_of, used
  by why()''s "dependency"/"tests" stages and by impact()''s "code" section) carry evidence_occurrence "blob:line",
  never a path -- taskctx.occurrence_path returns None for them (honest MISSING, not a guess), so they are not
  exclusion-filterable at this layer; documented in report.yaml''s open_issues rather than silently left unfiltered'
- 'govbridge.authority.resolver.STATE_ALIASES is a plain module-level dict imported by name into govbridge.authority.
  state -- monkeypatch.setitem on it (as tests/route/test_task_exclusions.py does) is enough to test state.get''s
  exclusion branch against an arbitrary path, without needing a real state alias pointed at fixture content'
failed_approaches:
- 'first design used a plain list-of-globs exclude= merge with no ambient layer, matching the CLI''s pre-repair
  --exclude flag exactly; rejected because ARCHITECTURE/REPAIR-1/evidence/tools/exclusion_probe.py''s own
  "cli_default_no_exclude" mode calls routes.run with exclude=None and no --task equivalent at all -- an
  ambient, re-read-per-call fallback (govbridge.core.taskctx.current()) is what makes THAT measurement read 0
  post-repair, not merely a caller passing the right argument'
- 'considered caching the ambient context''s GOVBRIDGE_TASK lookup once at import time; rejected for test isolation
  (an earlier test exporting the env var would leak into a later, unrelated one) and because the acceptance
  scenario needs the SAME already-built RouteSet to see GOVBRIDGE_TASK change mid-process (export it, call again)
  -- current() now re-checks the env var (small, keyed cache per path) on every call instead'
- 'considered changing RouteFn/RouteSet.run''s return type to (hits, excluded_count) to disclose counts uniformly;
  rejected -- govbridge/route/router.py is outside mutation_scope and RouteSet.run hard-casts to list(...), which
  would silently drop any extra return value; ExclusionCounter (a mutable object passed via the existing **kwargs
  channel) discloses the same information without touching that contract'
- 'first cut of the D.2/query-loop compile test relied on the real B2/B3/B4 routes and hoped the fixed "evidence both
  ways" query text would happen to lexically match content under the excluded directory; too fragile (FTS token
  overlap is incidental) -- replaced with a small, deterministic fake RouteSet shared by all three call sites, which
  leaks a distinctive unit id ("LEAK-EXCLUDED") into the rendered packet if ANY call site forgot to pass exclude='
unresolved:
- see report.yaml's open_issues (the real-view test flake, code-route path-blindness, and path_resolve's scoping)
decisions:
- 'ambient TaskContext installation (taskctx.set_current, via from_args) happens ONLY when --task is actually given
  on that command line -- never merely because GOVBRIDGE_TASK is set in the environment. current() still honours
  GOVBRIDGE_TASK on its own (a non-sticky, per-call env re-check) so a bare env export keeps working for every
  route/command that never calls from_args at all (e.g. a probe script). This keeps from_args() itself free of any
  global side effect when --task is absent, so calling it defensively (as every command''s main() now does) can
  never make an unrelated later call see a context it did not ask for.'
- 'exact.py''s `path` subcommand (path_resolve) was NOT given --task/excluded_hits: it returns candidate PATHS only
  (never content), so retrieval_exclusions -- which governs what CONTENT a route/command may deliver -- has nothing
  to withhold there. show/grep/id (which do deliver content or literal mention text) all gained it.'
- 'state.get''s excluded branch withholds `value` but keeps path/commit/blob/line/seal-status metadata, mirroring
  exact.py''s own pre-existing corpus-rules.yaml EXCLUDE-effect behaviour ("only metadata and the rule id are
  returned, never the content") rather than inventing a second, differently-shaped withholding convention.'
- 'no existing test file was modified. tests/route/test_task_exclusions.py and tests/fixtures/route/exclusions/**
  are both new; every other file this node touched is production code (govbridge/**), never a test.'
lessons:
- 'a route-level fix that only accepts exclude= from its caller is not "automatic" in the sense OBS-BR-08 means --
  the acceptance check calls routes.run with exclude=None on purpose, to prove the exclusion holds even when a
  caller forgets. The ambient layer (current()/merge_exclude(), consulted INSIDE the route) is what actually closes
  RC-8, not merely wiring exclude= through one more call site.'
- 'when a shared, out-of-scope module (govbridge.route.router) fixes a function''s return type, a mutable
  out-parameter passed through the SAME **kwargs channel the contract already tolerates is a clean way to add a
  disclosure without renegotiating that contract.'
- 'a compile-level test that depends on incidental lexical/semantic content overlap to exercise a specific code path
  (the D.2 templates) is fragile; a small, purpose-built fake RouteSet that all three call sites share is far more
  direct evidence that packet.py''s OWN wiring (not the underlying B2-B4 routes'' relevance) is correct.'
next_consumer: 'R1-RM (mandatory-input fidelity, R1-PG2) is next in packet.py/cli.py per REPAIR_PLAN.md section 12
  ("RM follows RX, which edits the compile call sites first"); R1-GA1 also depends on this node''s task context and
  R1-RL''s paging. Both should keep every govbridge/compile/packet.py routes.run(...) call passing exclude=/
  exclude_counter= (grep -n "routes.run(" is this node''s own regression guard) and may extend
  tests/route/test_task_exclusions.py freely but must not weaken any of its 23 assertions.'
