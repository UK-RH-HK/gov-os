claims:
- id: C-1
  text: >-
    Every query command (search, why, impact, history, exact show/grep/id/path, state, gather) accepts --out DIR
    and writes a supplementary packet directory (manifest.json, packet.md, meta.json, packet hash, read tokens)
    in the exact same on-disk shape `govbridge compile --out DIR` already writes -- so `govbridge packet verify`/
    `govbridge receipt check` need no special case for it (meta.json's own packet_kind: "supplementary" is how
    they tell the two apart). why/impact/history/exact/state were moved out of the generic
    `_DISPATCH`+`mod.main(argv)` forwarding table (they had no way to capture a structured result to packetise)
    into their own govbridge/cli.py cmd_* functions, calling the underlying library function directly -- the same
    pattern cmd_search/cmd_gather already used. Every pre-existing flag and behaviour is unchanged when --out is
    omitted.
- id: C-2
  text: >-
    Occurrence collapse (govbridge/compile/supplementary.py:_collapse_occurrences): a unit hit at many refs is
    delivered as ONE canonical occurrence (the CANONICAL version_status, else the first) plus a per-ref identity
    summary (occurrence_count, distinct_refs, a sha256 over the sorted ref names) -- never a second occurrence
    row per ref. Verified both on a synthetic 5-ref fixture (exactly one `source:` line in the rendered body) and
    structurally for every one of the 7 commands' own result shapes.
- id: C-3
  text: >-
    Deduplication by item id ("{unit_kind}:{unit_id}") against the main packet and earlier supplementary packets
    in the same run: a caller passes --dedup-against DIR (repeatable) naming any earlier packet directory (main
    or supplementary); a duplicate item is still listed (never silently hidden) but reduced to a bare reference,
    never a second full copy of its text. Unit-tested (test_dedup_against_main_packet_delivers_by_reference_only)
    and end-to-end through the real CLI.
- id: C-4
  text: >-
    Raw JSON stays available only behind --raw: with --out and no --raw, only a short packet summary (packet_id/
    packet_sha256/item/deduped/dropped counts) is printed; the full underlying result is printed only when --raw
    is also given. Without --out, every command's output is byte-for-byte what it always printed (no regression).
- id: C-5
  text: >-
    `packet verify`/`receipt check` cover the main packet AND every supplementary packet: `govbridge packet
    verify DIR` dispatches on meta.json's packet_kind to either the (now rendered-body-aware) main-packet
    validator or the new govbridge.compile.validate.verify_supplementary_packet (placement/banners/ordering, plus
    a hard refusal of any MANDATORY/PINNED item or non-empty section A). `govbridge receipt check` gained
    repeatable --supplementary DIR; a receipt whose context_packet_hash/manifest_sha256 omits an acknowledged
    supplementary packet's own hashes FAILS, naming it.
- id: C-6
  text: >-
    Section I carries the task's instantiated query set (govbridge.gather.instantiate.instantiate_all, the SAME
    "never silently skip a {class,subject} entry" function R1-GA1 built) and the answers/receipt schemas
    (ARCHITECTURE/schemas/answers.yaml, receipt.yaml), verbatim and by hash (OBS-BR-07/RC-9: "the query set and
    the answers and receipt schemas travel outside the packet, in orchestrator-copied files"). Implemented in
    govbridge/compile/section_i.py as an ADDITIONAL PINNED item appended to section I, with the packet
    re-finalised (fresh manifest_sha256/packet_sha256/read tokens) via govbridge.compile.render's own
    build_manifest/render_packet -- govbridge/compile/packet.py (out of this node's mutation_scope; RX->RM->GA3's
    file) is never edited. Wired into both `govbridge compile --out` and the bootstrap.
- id: C-7
  text: >-
    The bootstrap references the compiled packet by id and hash instead of inlining it (RC-9: "run-1's bootstrap
    was 282,782 bytes and contained the whole packet"). On the real CONTROL-A task spec, `govbridge bootstrap`
    now prints 8,350 bytes versus a 134,788-byte compiled packet (~6%) -- AGENT_RUNS/
    BR-AR-0025.check3-controla-bootstrap-not-inlined.out. Added --out (writes the SAME packet directory the brief
    references, so packet_sha256 in the text and on disk always agree) and --repo (bootstrap.py's CLI had no
    --repo before; needed for MY OWN tests to run hermetically against a fixture repo instead of relying on cwd
    resolution).
- id: C-8
  text: >-
    BR-DAG-AMEND-R1-10: `govbridge.compile.render` gained an exact, unambiguous per-item body-begin/body-end
    marker pair (item_body_marker/extract_item_delivered_body/extract_section_text) -- the "smallest
    item-delimiting format support" the amendment asks for, embedding only unit_kind:unit_id (already printed on
    the line above; never the internal item_id hash, preserving govbridge/demo/grade.py's own documented "never
    the hash" invariant). `validate.verify_rendered_delivery` uses it to re-extract each A item's delivered body
    from the ACTUAL rendered packet.md bytes and independently recompute its hash: an EXACT hash match for the
    common, RC-1-relevant single-piece "delivered in full" shape; for the keys/entries/paths-selector and the
    no-selector oversize/section-map shapes (whose rendered body embeds packet.py's own private per-piece
    headers, out of this node's scope to reconstruct byte-for-byte), a content-identity containment check over
    both delivered ranges (raw text) and every disclosed range's own (name, sha256) pair (covering the FULL
    section_map, not just the delivered subset). `packet verify`/`receipt check` now always pass the rendered
    text through.
- id: C-9
  text: >-
    The amendment's own negative test, tests/compile/test_verify_rendered_body.py: tampering the rendered body
    between an item's own markers, with manifest.json byte-identical, makes `packet verify` FAIL -- proven at
    three levels: the library function directly, the real `govbridge packet verify` CLI on a fixture repo, and
    (independent of this run's own Python test code) a shell/sed-level tamper of the REAL, already-compiled
    CONTROL-A packet.md, verified via subprocess (AGENT_RUNS/BR-AR-0025.check4-independent-shell-level-tamper-
    detection.out). A DISCLOSED LIMIT of the containment check (open_issues) is documented from that same probe.
- id: C-10
  text: >-
    BR-DAG-AMEND-R1-15 (added mid-run): a query command writing a supplementary packet under --out never writes
    to the store. Proven with the store made GENUINELY read-only at the OS level (chmod 0o444 on store.db, 0o555
    on the store directory, not a mock or a monkeypatch of the store module): `govbridge state get` (which never
    opens the sqlite store at all -- it reads straight from Git) succeeds, writes its supplementary packet under
    --out, and leaves the store file's sha256, and the store directory's own file listing, byte-for-byte
    unchanged. `--repo`/`--view` were added to `govbridge state get` (it had neither before) so this test -- and
    any future one -- can run hermetically against a fixture repo instead of relying on cwd-based git resolution.
