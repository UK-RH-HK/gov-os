open_issues:
- >-
  BR-DAG-AMEND-R1-15's own principle ("query commands are read-only with respect to the store") holds at the
  DATA level for every command (search/gather/why/impact included), but govbridge/core/store.py's open_db()
  (NOT in this node's mutation_scope, and explicitly routed to R1-GA1 by the orchestrator on this reopening)
  unconditionally issues a write-shaped statement (`PRAGMA journal_mode=WAL` then `INSERT OR IGNORE INTO
  store_meta`) on EVERY open, whatever the caller intends. Empirically verified (twice, interactively, against
  the real store): this genuinely raises `sqlite3.OperationalError: attempt to write a readonly database` if
  store.db is OS-read-only, even though both statements are true no-ops on an already fully-built store and,
  under normal (writable) conditions, open+query+close leaves store.db byte-for-byte unchanged. This is why the
  test (test_query_command_with_out_never_writes_to_a_genuinely_read_only_store) uses `state get` (which never
  calls open_db() at all) rather than `search`/`gather`/`why`/`impact`. Not touched here, per the coordinator's
  explicit instruction on this reopening ("Do not edit store.py").
- >-
  govbridge/compile/supplementary.py's COMMAND_PROFILE_BYTES table (search/why/impact/history/exact: 40 KB,
  state: 16 KB, gather: 60 KB) is a small, documented Python table INSIDE this node's own scope, deliberately NOT
  added to config/budgets.yaml (out of R1-RS's mutation_scope). Whether these specific numbers should instead
  become a real, versioned config/budgets.yaml entry is a product question for whoever next owns that file
  (R1-GA3) or the orchestrator.

