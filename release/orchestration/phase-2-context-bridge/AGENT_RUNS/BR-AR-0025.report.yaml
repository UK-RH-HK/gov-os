open_issues:
- >-
  BR-DAG-AMEND-R1-15's own principle ("query commands are read-only with respect to the store") holds at the
  DATA level for every command (search/gather/why/impact included), but govbridge/core/store.py's open_db()
  (NOT in this node's mutation_scope) unconditionally issues a write-shaped statement (`PRAGMA journal_mode=WAL`
  then `INSERT OR IGNORE INTO store_meta`) on EVERY open, whatever the caller intends. Empirically verified
  (twice, interactively, against the real store): this genuinely raises `sqlite3.OperationalError: attempt to
  write a readonly database` if store.db is OS-read-only, even though both statements are true no-ops on an
  already fully-built store and, under normal (writable) conditions, open+query+close leaves store.db
  byte-for-byte unchanged. This is why the new test (test_query_command_with_out_never_writes_to_a_genuinely_
  read_only_store) uses `state get` (which never calls open_db() at all) rather than `search`/`gather`/`why`/
  `impact` -- those cannot be proven against a TRULY OS-read-only store file until store.py gains a real
  read-only open mode (a `mode=ro` URI connection that skips the schema-ensure statements entirely). Routed to
  whoever next owns govbridge/core/store.py (B1's file) or the orchestrator.
- >-
  tests/compile/test_compile_bootstrap.py::test_bootstrap_contains_prelude_packet_and_receipt_instructions FAILS
  after this repair (the ONLY failure in the full domain suite: 581 passed, 1 failed -- AGENT_RUNS/
  BR-AR-0025.check6-full-domain-suite.out). Its own assertion, `assert "## A. MANDATORY AUTHORITATIVE INPUTS" in
  brief` (with the comment "the packet itself (A-J) is embedded, not summarised away"), encodes EXACTLY the
  RC-9 defect ("the bootstrap inlines the whole packet") that REPAIR_PLAN.md section 6 and this node's own
  deliverable explicitly require removing -- the DAG's own acceptance check 3 requires the opposite ("well under
  the packet size, because the packet is referenced, not inlined"). This file is NOT in R1-RS's mutation_scope
  (only tests/compile/test_supplementary.py and test_section_i_and_bootstrap.py are), so it was not edited,
  per the hard scope rule. Requesting: either (a) a scope grant (to R1-RS or routed to R1-INT) to correct this
  ONE assertion -- replace it with an assertion that packet_sha256/packet_id are named and that "## A. MANDATORY
  AUTHORITATIVE INPUTS" is NOT inlined (mirroring this run's own
  test_bootstrap_references_packet_instead_of_inlining_it), or (b) accepting it as a second named exception to
  amendment R1-T1's "0 failures" rule, alongside test_compile_real_view_mandatory_in_a.py. Not skipped, not
  xfailed, not weakened.
- >-
  verify_rendered_delivery's containment check for the no-selector oversize/section-map shape (delivered_sha256
  is None, nothing raw delivered) checks that each disclosed range's OWN (name, sha256) pair is verbatim present
  in the rendered body -- this catches REPLACEMENT/MUTATION of a disclosure line (independently confirmed twice
  on the real CONTROL-A packet: AGENT_RUNS/BR-AR-0025.check4...out) but NOT a pure content INSERTION that adds
  unrelated text into that item's body area without removing or altering any existing disclosed identity (an
  exploratory probe during this run demonstrated the gap before the containment check was added for the
  undelivered/section_map ranges; a follow-up mutation-style probe on the SAME real item, after the fix, WAS
  caught). Closing this fully would need either a new render-time hash of that exact rendered body (a
  govbridge/compile/packet.py change -- out of this node's scope; R1-GA3 edits that file next) or reconstructing
  packet.py's private per-piece text format byte-for-byte inside validate.py (a fragile coupling to a format
  R1-GA3 may change). Routed to R1-GA3/R1-INT as a disclosed, real, but narrow residual gap -- never claimed
  closed.
- >-
  govbridge/compile/supplementary.py's COMMAND_PROFILE_BYTES table (search/why/impact/history/exact: 40 KB,
  state: 16 KB, gather: 60 KB) is a small, documented Python table INSIDE this node's own scope, deliberately NOT
  added to config/budgets.yaml (out of R1-RS's mutation_scope). Whether these specific numbers should instead
  become a real, versioned config/budgets.yaml entry is a product question for whoever next owns that file
  (R1-GA3) or the orchestrator.

