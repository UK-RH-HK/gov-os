  config/budgets.yaml''s 24 KB default) is delivered as a full structural section map
  (govbridge/compile/sectionmap.py: Markdown headings or YAML top-level keys, exact line ranges, sha256 per
  section) plus any selected parts plus a MANDATORY_PARTIAL_DELIVERY J notice listing every undelivered range --
  never a bare truncated string. Confirmed on REAL production content: state:bridge#contract_v3 (a real,
  oversize mandatory item) now triggers this path instead of being silently cut (AGENT_RUNS/BR-AR-0022.evidence/
  control-a-rm-probe-manifest.json).'
- 'Selectors honoured: a mandatory-input row (bridge-state item or task-spec path_form entry) may declare `keys`
  (dotted YAML key paths), `entries` ({under, ids} or {under, start, end} -- an id range/set within a YAML
  sequence) and multiple `paths`; govbridge/authority/resolver.py resolves each to exact line spans via the new
  govbridge/compile/sectionmap.py and delivers every matched part in full. An unresolvable selector fails the
  WHOLE row closed (added to blocked_reasons, a BLOCKED_INPUT J notice), exactly like a missing path already did
  -- never a silent partial match. A pre-existing, real, non-structured `entries` value
  (PHASE-2-LEDGER-P2-L-0033-0047''s free-text annotation in ORCHESTRATOR_STATE.yaml) is left completely alone --
  discovered by running the corrected test_compile_real_view_mandatory_in_a.py, which crashed against it before
  the fix (`entries` is only ever treated as a selector when it is a dict; `keys` only when it is a list).'
- 'Multi-path items now deliver every declared path in full (previously: every path was existence-checked but
  only the first delivered), and a by-reference directory item is expanded into a member manifest (path, blob,
  size, class per tracked file under it, via a generic Registry.class_for_path glob lookup) -- proven on a
  synthetic MF-PATHS/MF-DIR fixture (tests/compile/test_mandatory_fidelity.py).'
- 'Receipt/manifest now carry delivered_sha256 (what the packet''s body actually contains) separately from
  source_sha256 (the resolver''s own recorded hash, unchanged in meaning from the old content_sha256 field, kept
  for backward compatibility). The two coincide for a fully-delivered item and legitimately differ only for a
  partially-delivered mandatory item (disclosed by its own MANDATORY_PARTIAL_DELIVERY notice).
  validate.verify_delivered_fidelity asserts both are present for every A item -- a directory item with no
  row-declared hash no longer carries source_sha256=None (the concrete run-1 pain point: "acknowledged as
  ''ID@None'' because the manifest carries no content_sha256 for this by-reference [item]"); it now gets a real,
  deterministic hash derived from its own member manifest.'
- 'BR-DAG-AMEND-R1-1: govbridge.compile.validate.verify_section_a (and therefore receipt.check, which calls into
  the SAME function) now re-derives section A at the packet''s OWN recorded view (pinned_view_from_manifest,
  built from manifest[''view''] -- every named ref pinned to its recorded commit), never the repository''s moving
  tip. Regression test tests/compile/test_verify_recorded_view.py: compile against a fixture repo, commit a NEW
  mandatory owner record onto the SAME ref, re-verify the OLD packet -> PASS (plus two negative controls proving
  the fixture genuinely exercises a moving tip and that the pre-repair, live-view re-derivation would have
  disagreed here).'
- 'BR-DAG-AMEND-R1-2: tests/compile/test_compile_real_view_mandatory_in_a.py used to compile against LIVE refs of
  the shared repository with no repo/view pin (config/canonical-view.yaml''s `records` ref, follow: tip, is
  exactly the branch every parallel builder agent commits to, in the SAME underlying object store every worktree
