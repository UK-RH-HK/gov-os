open_issues:
- 'Packet-body re-extraction (reopening point 3, "recompute delivered_sha256 from the packet itself") was NOT
  implemented. `validate.verify_declared_and_delivered` verifies delivered_sha256 against the INDEPENDENTLY
  recomputed declared_sha256 (from Git) and, for a partial delivery, independently re-verifies every disclosed
  range against Git too -- but it does not currently re-parse `packet.md` to confirm the manifest''s own
  delivered_sha256 matches what was literally rendered. govbridge.cli''s `packet verify`/`receipt check` entry
  points also do not pass the rendered text into the validator (govbridge/cli.py is out of this node''s scope,
  sequenced RX -> GA1 -> RS -> RA). The smallest remaining step, inside this node''s own scope, would be: (a) wrap
  each item''s body in render.py with an `<!-- item:<item_id> body-begin/end -->` marker pair (cheap, additive,
  breaks no existing test -- checked), (b) add `validate.extract_delivered_body(rendered, item_id)`, (c) an
  optional `rendered=` parameter on verify_packet/verify_declared_and_delivered that, when given, re-hashes the
  extracted body and compares it to the stored delivered_sha256. Not implemented under this reopening''s time
  budget; requesting a decision on whether R1-INT or a follow-up should close this, since it also needs a
  cli.py-side wire-up outside this node''s scope to matter for the CLI path specifically.'
- 'pinned_view_from_manifest (validate.py) leaves `history` (a ref_glob of many equally-historical tips) unpinned
  -- manifest[''view''] does not itemise glob refs (only named refs), so a mandatory item resolved only through a
  partition''s history fallback is not covered by this amendment''s own regression test. No real
  mandatory_bridge_inputs item currently resolves through that fallback; flagged for R1-INT''s generic-rule/
  determinism audit to confirm, not fixed here (out of this node''s scope to extend view.py/render.py''s manifest
  shape further).'
- 'Selector support (`keys`/`entries`) is wired into the state_ref/row path (every real mandatory_bridge_inputs
  item) and into path_form entries; id_form entries do not carry it (no real required_input currently uses
  id_form with a selector need, and demonstration-task.yaml''s three required_inputs are all state_form). Noted
  for whichever node next extends id_form, should a future task need it.'
- 'The `entries`/`keys` selector shape (`{under, start, end}` / `{under, ids}` / a plain list) is new, generic
  syntax on top of the existing required_inputs/mandatory_bridge_inputs row schema; ARCHITECTURE/schemas/
  task-spec.yaml (not in this node''s mutation_scope) does not yet document it. Recommend R1-INT or a
  schema-owning node add the two new optional fields to that schema file.'
- 'Per the coordinator''s instruction: I did NOT edit ORCHESTRATOR_STATE.yaml''s PHASE-2-LEDGER-P2-L-0033-0047 row.
  The exact structured shape the resolver now expects, for the coordinator to apply: add
  `entries: {start: <first ledger entry id the row means>, end: <last ledger entry id the row means>}` to that
  row (a plain dict value for the `entries` key, replacing its current free-text string) -- both ids must be
  real ## headings in PHASE_LEDGER.md (or PHASE_LEDGER.md@phase-2, depending which ledger the row means) whose
  title begins with a config/id-grammar.yaml-recognised token, and `start` must not come AFTER `end` in that
  document''s own order (checked by position, not string comparison).'
