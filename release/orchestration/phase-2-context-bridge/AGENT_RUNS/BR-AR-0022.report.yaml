  never a bare truncated string. Confirmed on REAL production content: state:bridge#contract_v3 (a real,
  oversize mandatory item) now triggers this path instead of being silently cut (AGENT_RUNS/BR-AR-0022.evidence/
  control-a-rm-probe-manifest.json).'
- 'Selectors honoured: a mandatory-input row (bridge-state item or task-spec path_form entry) may declare `keys`
  (dotted YAML key paths), `entries` ({under, ids} or {under, start, end} -- an id range/set) and multiple `paths`;
  govbridge/authority/resolver.py resolves each to exact line spans via govbridge/compile/sectionmap.py and
  delivers every matched part in full. An unresolvable selector fails the WHOLE row closed (added to
  blocked_reasons, a BLOCKED_INPUT J notice), exactly like a missing path already did -- never a silent partial
  match. A pre-existing, real, non-structured `entries` value (PHASE-2-LEDGER-P2-L-0033-0047''s free-text
  annotation in ORCHESTRATOR_STATE.yaml) is left completely alone -- `entries`/`keys` are only ever treated as
  selectors when they carry their expected structured shape (a dict / a list respectively).'
- 'Multi-path items now deliver every declared path in full (previously: every path was existence-checked but
  only the first delivered), and a by-reference directory item is expanded into a member manifest (path, blob,
  size, class per tracked file under it, via a generic Registry.class_for_path glob lookup). Confirmed on REAL
  content: REVIEW-8-PROBES (probes/P2-AR-0097/) resolves with 4 real members, source_sha256 == delivered_sha256
  (AGENT_RUNS/BR-AR-0022.evidence/check4-real-view-directory-manifest-review8probes.out).'
- 'BR-DAG-AMEND-R1-1: govbridge.compile.validate.verify_section_a (and therefore receipt.check, which calls into
  the SAME function) now re-derives section A at the packet''s OWN recorded view (pinned_view_from_manifest,
  built from manifest[''view''] -- every named ref pinned to its recorded commit), never the repository''s moving
  tip. Regression test tests/compile/test_verify_recorded_view.py: compile against a fixture repo, commit a NEW
  mandatory owner record onto the SAME ref, re-verify the OLD packet -> PASS (plus two negative controls proving
  the fixture genuinely exercises a moving tip and that the pre-repair, live-view re-derivation would have
  disagreed here).'
- 'BR-DAG-AMEND-R1-2: tests/compile/test_compile_real_view_mandatory_in_a.py used to compile against LIVE refs of
  the shared repository with no repo/view pin (config/canonical-view.yaml''s `records` ref, follow: tip, is
  exactly the branch every parallel builder agent commits to, in the SAME underlying object store every worktree
  of this repository shares). Made hermetic: every follow:tip NAMED ref is resolved ONCE, at module load, and
  pinned into a temp copy of the view for both assertions in the file; repo= is now passed explicitly to every
  compile_packet/verify_packet call (never relying on gitobj.repo_root()''s process-global cwd cache -- R1-INT''s
  routed fix). The byte-identical-twice assertion is unchanged and unweakened.'
- 'REOPENING POINT 1 fixed ("packet verify cannot detect silent truncation"): a THIRD, independent measurement,
  declared_sha256/declared_bytes (govbridge.authority.resolver.declared_parts/hash_pieces), is recomputed FRESH
  from Git at the packet''s recorded view -- never trusted from the manifest. `packet verify`
  (validate.verify_declared_and_delivered) now requires delivered_sha256 == declared_sha256 (a real byte-level
  equality: both computed via the SAME resolver.hash_pieces over the SAME ordered raw pieces) OR a
  MANDATORY_PARTIAL_DELIVERY notice whose delivered+undelivered ranges EXACTLY TILE the declared span (no gaps,
  no overlaps -- checked with an interval/line-set comparison), with every disclosed range independently
  re-verified against Git. Proven to actually CATCH all three named failure shapes on synthetic negative
  controls: a body swapped/cut with no notice, a notice with a dropped (gapped) range, and a tampered
  declared_sha256 -- each makes `packet verify` FAIL
  (tests/compile/test_mandatory_fidelity.py::test_truncated_body_with_no_notice_fails_verify,
  ::test_notice_with_a_gap_fails_verify, ::test_declared_sha256_mismatch_fails_verify). Packet-body
  re-extraction (point 3 of the reopening) was NOT implemented -- see decisions/open_issues for why and what the
  smallest remaining step is.'
- 'REOPENING POINT 2 fixed ("entries works only on YAML"): `entries` now resolves over Markdown too -- a heading
  whose title begins with a token matched by config/id-grammar.yaml''s mention_patterns is an entry
  (govbridge.compile.sectionmap.markdown_flat_tiling), and `{start, end}` is resolved in DOCUMENT ORDER (list
  position), never lexicographically, for BOTH YAML and Markdown entries
  (govbridge.compile.sectionmap.select_entry_range) -- fixing a real lexicographic-comparison bug in the
  original YAML-only implementation along the way. Proven on a synthetic fixture whose entry ids are
  deliberately out of lexicographic order
  (test_markdown_entries_resolve_in_document_order_not_lexicographic,
  test_markdown_entries_reverse_document_order_fails_closed) and on the REAL bridge-domain PHASE_LEDGER.md (not
  a Review-8 subject): `entries: {start: BR-L-0002, end: BR-L-0004}` resolves and delivers exactly those 3
  entries, delivered_sha256 == declared_sha256, packet verify PASS
  (control-a-rm-probe-manifest.json/packet.md, check3-packet-verify.out) -- independently re-confirmed by a
  SECOND method (raw `git show`+`grep`, not this node''s own code) that those three headings sit at exactly the
  disclosed lines, in that document order (check3b-independent-git-grep-ledger-entries.out). The exact structured
  row shape the resolver now expects for the REAL PHASE-2-LEDGER-P2-L-0033-0047 row (never edited here; the
  coordinator restates it) is: `entries: {start: <first ledger id>, end: <last ledger id>}` (optionally `under:`
  if the ids are nested inside a YAML key rather than being the row''s own Markdown headings -- not applicable to
  a Markdown ledger like PHASE_LEDGER.md, where `under` is unused).'
- 'Full domain suite: 433 passed, 0 failed (tests/compile/test_compile_real_view_mandatory_in_a.py included, now
  hermetic, ~154s of the ~214s total). AGENT_RUNS/BR-AR-0022.evidence/check-full-domain-suite.out.'
