open_issues:
- >-
  taskctx.ExclusionCounter.bump() (govbridge/core/taskctx.py, out of this node's mutation_scope) is a plain
  `self.count += n`, not thread-safe; govbridge.gather.engine shares ONE ExclusionCounter across every
  concurrently-running facet in a round. Under real concurrency this could occasionally UNDER-count
  excluded_hits (lose an increment), never over-count or affect the merged evidence itself. Left alone per the
  reopening's own explicit instruction ("routed to R1-INT; leave it").
- >-
  R1-RL paginated codesymbols.callers() and derivemod.tests_of(), but not derivemod.callees_of() or the
  CONSUMERS side of derivemod.reads_key_of() being round-driven by a facet. The `dependencies` facet (callees)
  is therefore single-shot/fanout-capped on this pass, and the `dependents` facet's reads_key-consumer
  contribution stays fanout-capped rather than paged round-over-round (see conformance item 3,
  MET_WITH_DISCLOSED_LIMIT). Routed to R1-GA2/R1-GA3 or a future reopening if full code-facet pagination parity
  is wanted.
- >-
  `tests`/`dependents` facets' TESTS/READS_KEY code expansion (govbridge.route.real_routes._expand_symbol) only
  ever runs from a SEEDED (T1) definition -- pre-existing code_route behaviour, unchanged by this node. Without
  a task_spec `seeds` list (CONTROL-A's own task-spec.yaml declares `seeds: []`), those two facets surface
  mainly through CALLERS and plain definitions, not through TESTS/READS_KEY edges. R1-GA2's adaptive
  identifier-driven seeds are the natural fix; out of this node's scope by the dispatch brief itself.
- >-
  gather_scope_path_cache (govbridge/lexical/query.py, govbridge/semantic/vectors.py) is built ONCE PER PROCESS
  (a module-level flag), refreshed via INSERT OR IGNORE from the current occurrence table at that moment. It can
  therefore be at most one process-start stale relative to a store rebuilt mid-session by a DIFFERENT process
  (e.g. a concurrent `index update`), and it is never rebuilt again within one long-lived process. This is a
  disclosed, bounded staleness window for a PERFORMANCE cache only (never a correctness gap: a stale/missing
  cache degrades to fewer Tier A/B pre-filter hits, and the real classify_hit-based assertion in every route
  still catches any wrongly-admitted item). Routed to whoever owns a long-lived gather server process, if one is
  ever built; the one-shot CLI this node ships is never at risk (one process per invocation).
- >-
  Superseded by the reopening's own re-measurement: the previous report's claim that CONTRACT/decisions_active/
  decisions_history found zero in-scope items on CONTROL-A's CA-WHY was an artefact of the post-hoc-only filter
  (defect 1) letting those facets page uselessly through corpus-wide, mostly out-of-scope rankings until
  MAX_ROUNDS. With the SQL push-down (C-8/C-9), the SAME query's default facet set now reaches FACETS_COVERED in
  2 rounds with 118 merged items (up from ~65 before this reopening) -- the requirement/decisions_* facets DO
  find real, in-scope evidence on this corpus once the scope predicate reaches them before their cursor gets
  spent on irrelevant pages.

