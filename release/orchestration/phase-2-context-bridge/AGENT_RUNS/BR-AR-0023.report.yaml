run_id: BR-AR-0023
role: >-
  REPAIR-1 node R1-GA1 -- govbridge gather, core: query instantiation, facet registry, deterministic parallel
  facet retrieval, paging and continuation with a configurable batch size, stopping reasons, telemetry
  (OD-BR-05 s1, s2, s4, s5, s9); plus the routed `govbridge notes` dispatch line (R1-RN/BR-AR-0017). REOPENED once
  (three defects: scoped-facet post-hoc filtering, AC2 graded on a facet subset, AC3 citing an unsaved file); this
  report covers the reopened, fixed state.
model_observed: claude-sonnet-5
branch: bridge/r1-ga1-0023
commit: 732933c9f5b5665f3ad3cebe3d9113d5e863a7e0
status: COMPLETED
claims:
- id: C-1
  text: >-
    govbridge/gather/instantiate.py repairs RC-2 generically: a {class, subject} query-set entry is instantiated
    from that SAME document's own query_classes/subjects tables (never a hand-coded class or subject name); an
    entry that cannot be made executable raises QueryNotExecutable, never silently skipped.
- id: C-2
  text: >-
    config/facets.yaml is a generic facet registry: 11 facets (purpose, requirement, decisions_active,
    decisions_history, failed_approaches, dependencies, dependents, enforcement, tests, evidence_staleness,
    versions), each scoped by AUTHORITY CLASS/lifecycle (never a path or file name), with routes, extra query
    terms, batch size and minimum packet share. class_facets is a real, versioned class->facet override table,
    empty by default so every query gets every facet (OC-BR-02: no instance-specific name is required for this
    to be a genuine mapping).
- id: C-3
  text: >-
    govbridge/gather/engine.py runs a query's facets CONCURRENTLY within a round (a thread pool, size
    --threads), merges every round in FIXED FACET-REGISTRY order (never thread-completion order) through
    govbridge.route.router.dedupe (reused, not reimplemented), and pages each (facet, route) stream to a fixed,
    batch-size-INDEPENDENT target_items -- so --batch-size changes only how many rounds are needed, never the
    final merged evidence set. Stop reasons are exactly the closed OD-BR-05 vocabulary: FACETS_COVERED,
    NO_UNRESOLVED_IDENTIFIERS, MARGINAL_GAIN_ONLY_DUPLICATES, MAX_ROUNDS, BUDGET_REACHED_WITH_UNRESOLVED.
- id: C-4
  text: >-
    Per-facet cursors: lexical and semantic routes gained offset-based paging (govbridge/lexical/query.py,
    govbridge/semantic/search.py, govbridge/semantic/vectors.py); the code route gained
    include_callers/callees/tests/reads_key toggles and page_size/cursor threading through R1-RL's own
    codesymbols.callers()/derivemod.tests_of() paging primitives (reused, not reimplemented). callees_of and
    reads_key_of's own consumer pagination are NOT round-driven by this engine -- R1-RL never paginated
    callees_of at all, and reads_key_of's pagination is not wired into the round loop in this pass; both are a
    disclosed, bounded limitation (conformance table, item 3).
- id: C-5
  text: >-
    The literal hard-coded top-k default (8) is removed from every route function signature
    (govbridge/lexical/query.py's DEFAULT_K, and all four functions in govbridge/route/real_routes.py); it
    resolves through config/facets.yaml's default_batch_size, the one configuration-default loader. A
    `grep -rnE 'k: int = 8|DEFAULT_K = 8|k=8\b' govbridge/` audit finds no match (AGENT_RUNS/
    BR-AR-0023.check4-no-hardcoded-topk.out; exit 1 = no match = pass) -- re-confirmed after the reopening's own
    edits.
- id: C-6
  text: >-
    Telemetry (govbridge/gather/telemetry.py): one FacetRoundStat per (facet, round), with candidate items/bytes,
    deduplicated new items/bytes, exhausted/missing flags and reasons, and (added in the reopening)
    out_of_scope_dropped -- how many candidates a scope assertion actually dropped this call, rolled up per query
    into out_of_scope_dropped/out_of_scope_dropped_by_facet, so a scoped facet's MAX_ROUNDS/exhaustion can be told
    apart from genuine scarcity (REPAIR_DAG.yaml node R1-GA1 reopening: "if it happens, count that in telemetry").
    GatherTelemetry.summary() adds total rounds, deduplicated totals, follow_up_triggers (disclosed, always empty
    in this node), final_bytes, stop_reason and unresolved facets/identifiers. Best-effort written to the existing
    "queries" telemetry stream (govbridge.core.telemetry, out of this node's scope, so no new telemetry kind was
    invented).
- id: C-7
  text: >-
    `govbridge gather --task <spec> --query <id|text> [--batch-size N] [--max-rounds N] [--threads N]` is wired
    into govbridge/cli.py, plus --facets, --exclude, --view, --registry, --json and an explicit opt-in
    --gather-budget-profile (never the task spec's own budget_profile automatically, since that field bounds the
    FINAL COMPILED packet, not raw gathered evidence -- see config/budgets.yaml's own comment). Untouched by the
    reopening (govbridge/cli.py is R1-RS's file to edit next; this run made no new edits to it -- verified: `git
    diff` between this run's PRE-reopening commit and its final commit touches no path under govbridge/cli.py).
- id: C-8
  text: >-
    REOPENING DEFECT 1 FIX: a facet's scope_classes/lifecycle_scope is now a generic keyword argument on every
    real route (lexical, semantic, code, exact) -- never a client-side filter applied after a corpus-wide page.
    lexical (govbridge/lexical/query.py) and semantic (govbridge/semantic/vectors.py) push the restriction into
    SQL itself before top-k/LIMIT: Tier A joins record_def+class_lifecycle (precise on class AND lifecycle) for a
    record-backed span; Tier B matches a path glob (translated from the registry's own class_rules by
    govbridge/route/real_routes.py's _path_globs_for_classes, the one place that knows about authority classes) for
    everything else, and is skipped whenever lifecycle_scope is given (a path alone cannot prove lifecycle, so it
    is never used to admit one). total_matching_chunks/exhaustion accounting is computed over the SAME scoped
    universe, so paging still terminates correctly. code_route/exact_route apply the identical scope as a
    post-hoc assertion (their result sets are already small/bounded -- no large ranking to push a SQL filter
    into). Every route's own assertion, PLUS a gather-level backstop (Facet.filter_in_scope_counted, for a route
    that does not implement scope itself, e.g. a test double), discloses how many candidates it dropped via
    out_of_scope_dropped (see C-6).
- id: C-9
  text: >-
    REOPENING, performance finding and fix: the FIRST version of C-8's SQL push-down measured 4-6 SECONDS PER
    CALL on the real store (a scoped COUNT/SELECT), because ``occurrence`` has ~503,601 rows for only ~7,909
    distinct (blob_id, path) pairs -- the same blob/path pair repeats once per historical (ref, commit), up to
    hundreds of times for a stable file (measured directly: one blob had 21,498 occurrence rows, several others
    500-900). A correlated EXISTS against the raw table re-walked every one of those repeats per candidate row.
    Fixed with two query-time-only, idempotent additions to the SHARED store.db, owned by neither this node's nor
    another node's existing schema: an index on record_def(path), and gather_scope_path_cache(blob_id, path), a
    DEDUPLICATED copy of occurrence, built once per process (govbridge.lexical.query._ensure_scope_indexes /
    govbridge.semantic.vectors._ensure_scope_indexes). Measured effect: the same scoped COUNT query fell from
    4.27s to 0.13s (33x); a full CONTROL-A gather on the query's actual DEFAULT facet set fell from a >115s
    timeout (with 0 output) to 47-96s per query across all 5 CONTROL-A queries (AGENT_RUNS/BR-AR-0023.
    check7-controla-all-5-queries-default-facets.out).
- id: C-10
  text: >-
    REOPENING DEFECT 2 FIX: AC2 (--threads 1/4/16 byte-identical) is re-verified to completion on CONTROL-A's
    ACTUAL DEFAULT facet set (all 11 registered facets, not a hand-picked subset) --
    AGENT_RUNS/BR-AR-0023.check2-controla-thread-determinism-full-default.out: identical merged_sha256
    (1696698f7ffd7adeae16f060bc468a38895609be92c60a0707050130f6fec1a2) across all three thread counts, 118 merged
    items, FACETS_COVERED in 2 rounds every time. All 5 CONTROL-A queries were also run once on their default
    facets (--threads 4 --batch-size 8), timed: CA-WHY 93.25s (118 items), CA-REQ 76.81s (97), CA-ENF 96.17s
    (107), CA-TESTS 47.74s (125), CA-DEPS 89.06s (107) -- every one FACETS_COVERED in 2 rounds; none hit
    MAX_ROUNDS or a timeout. config/budgets.yaml gained gather.wall_time_budget_seconds: 150 (an advisory,
    operator/CI-facing figure, not self-enforced by the engine), set with a ~1.5x margin over the measured max
    (96.17s).
- id: C-11
  text: >-
    REOPENING DEFECT 3 FIX: AC3 (--batch-size 2 vs 16, identical evidence set) is re-run on the full default
    facet set and SAVED (AGENT_RUNS/BR-AR-0023.check3-controla-batchsize-2-vs-16-full-default.out) -- the
    previous pass's note cited a "check3b" file that was never created; that dangling citation is corrected (the
    superseded file is relabelled, not removed). New result: 118-item evidence set, byte-identical unit_id set at
    both batch sizes, 8 rounds (batch=2) vs 1 round (batch=16), 53 telemetry rows for the 8-round run.
- id: C-12
  text: >-
    A real, pre-existing cross-thread sqlite3 bug was found and fixed in govbridge/route/real_routes.py (first
    pass, unchanged by the reopening): the classify connection and the shaped code connection were each built
    ONCE and shared across every RouteSet call, which crashes ("SQLite objects created in a thread can only be
    used in that same thread") the moment two facets run concurrently on different threads -- exactly what
    OD-BR-05 section 2 asks for. Both are built once PER THREAD (threading.local); single-threaded callers
    (govbridge search, govbridge.compile.packet, every pre-existing test) are unaffected.
- id: C-13
  text: >-
    `govbridge notes` is dispatched from the top-level CLI (routed from R1-RN/BR-AR-0017, whose own mutation_scope
