- 'GD-3/GD-8/D-1 (a record anchor matched by record id only; whole-document vs sectioned anchor undefined):
  `anchor_matches`''s record branch previously short-circuited on `anchor.get("record_id")` truthy and NEVER fell
  through to the path/commit/line-overlap ("section") rule used for every other anchor kind, and `_resolve_citation`
  never read `record_id` off a raw citation OBJECT at all (only off a string item_id, via `items_by_id`). Both are
