  DIFFERENT record id never matches even on a path/commit/line coincidence; and when neither side carries a usable
  record id, the same path + blob-identical-commit + line-overlap rule already used for code anchors decides it.'
- 'GD-4 (one literal withdrawn-marker phrase): the withdrawn-finding check is now a generic, same-line marker scan
  (`\bwithdrawn\b`, case-insensitive) alongside the cited id, recognising `(WITHDRAWN)`, `[WITHDRAWN]`, `-- WITHDRAWN`,
  `: WITHDRAWN` and lower/mixed case -- not only the one original bracket phrase.'
- 'GD-5 (side-by-side required both WHOLE CHAINS to PASS): `_grade_chain` now reports each chain''s
  `enforcement_reached` independently of its overall PASS/FAIL result, and `grade_g4`''s side-by-side condition uses
  that -- matching DEMONSTRATION_DESIGN.md section 4''s own text ("passes when both enforcement points are reached"),
  not "both chains fully passed" (which additionally, and wrongly, failed side-by-side whenever an unrelated required
  stage of either chain was MISSING or WRONG).'
- 'GD-6/D-4 (undeclared-read false positives on govbridge query arguments): `extract_reads.py` now recognises a
  govbridge "selector" argument generically -- any token with an optional scheme prefix and a MANDATORY
  `:start[-end]` line-range suffix (the syntax the exact/search/why/impact/history/state query commands actually
  use, distinct from a bare path given to a real read command) -- and a shell redirection/`--out` target, masking
  both out before the bare-file-token scan; `grade_g7`''s undeclared-read computation additionally excludes any path
  already supplied through a compiled packet, the task spec''s own declared inputs, or the receipt''s own
  `outputs_produced`/`inputs_consumed`, and any path under a `run-<n>/` directory (D-3''s ruling: not a corpus read).'
- 'GD-7/D-5 (external bytes counted as whole blobs): `grade_g7` now charges only a DECLARED WINDOW''s bytes (a
  receipt `external_reads` entry''s `lines` or `line_start`/`line_end`) when one is present, falling back to the
  whole blob only for a genuine direct/whole-file read.'
- 'GD-9/D-3 ([R] results never ingested; AUTH ungated): `grade()` accepts an optional `--rubric` file
