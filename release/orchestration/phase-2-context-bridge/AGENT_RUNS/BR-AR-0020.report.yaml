  supplied `must_state` verdict instead of always reporting (and never acting on) PENDING_RUBRIC, and `grade_g3`
  ingests every `auth_gating` row as a hard, generic answer-side gate -- gating whatever items the rubric names, never
  one hard-coded id set.'
- 'GD-10 (a symbol-qualified anchor never matched by an in-symbol line citation): a new `_enclosing_symbol` helper
  resolves the function/type enclosing a cited line through the SAME code store the code route already builds
  (`govbridge.code.symbols`/`govbridge.code.store`, read-only, lazily indexed, never a second symbol table), so a
  plain line citation inside a function''s body now matches that function''s symbol anchor even outside
  `line_tolerance`.'
- 'OBS-BR-05 (the 1%-of-corpus packet-bytes check never fired): `grade()` unconditionally called
  `grade_g7(..., budget_bytes=None, ...)`, and `grade_g7` required a truthy `budget_bytes` before ever comparing
