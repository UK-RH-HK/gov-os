findings:
- 'CORRECTION of my own prior finding: I previously wrote "CITES_REQUIREMENT is genuinely 0 -- verified by a
  direct git-grep... The product''s Rust comments do not use this citation convention today." That was WRONG. The
  orchestrator''s OWN git grep against the frozen 3c880d8 finds 6 real hits, and my SECTION_CITE_RE already
  matched them; the citations were being found and then SILENTLY DROPPED by my own later code, for two separate
  reasons (see the next two findings). My earlier "independent" grep was too narrow (it searched only the
  "<path>:<line>" shape, never the "<path> section N"/"<path> §N" shape that all 6 real hits actually use) --
  a genuine analysis error, not a fabrication, but wrong nonetheless, and now corrected with a REAL second,
  independent measurement (a grep matching the ACTUAL shape) in AGENT_RUNS/BR-AR-0019.check6-gap1-cites-requirement.out.'
- 'Root cause 1 of the CITES_REQUIREMENT drop: CODE_DIRS (govbridge/graph/derive.py) never included "tests/", so
  4 of the 6 real citations -- all living in tests/certification/*.rs doc comments -- were never even scanned.
  Fixed by adding "tests/" to CODE_DIRS (shared by code_cites_edges_for_id too, a free extension of its own
  reach, verified not to break its existing frozen fixture test since that test passes code_dirs explicitly).'
- 'Root cause 2 of the CITES_REQUIREMENT drop: a citation whose document resolved (uniquely) but whose numbered
  section heading did not exist there (the measured `SYNTHESIS.md §10.4` shape -- SYNTHESIS.md is real and
  unique, but has no "10.4" heading) hit a bare `continue` with no edge and no record. Fixed: such a citation now
  yields an edge to the DOCUMENT itself (derivation HEURISTIC_SECTION_UNRESOLVED), and a document that does not
  resolve at all (or resolves ambiguously) is recorded in a new `unresolved` return value / `lineage_unresolved`
  table, with its reason -- never silently dropped either way.'
- 'The "records" ref this bridge domain resolves against is NOT a stable pin of the frozen product: it is a LIVE,
  actively-evolving candidate branch that OTHER AGENTS in this same session also commit to. Observed directly:
  tests/certification/ar94_floor.rs (present, with a resolvable Rust CLI dispatch call, in one measurement) was
  GONE three measurements later; the "records" commit itself changed three times across this reopening round
  alone (8e84da6..., ad791bae..., 56095c38...). This makes a NAIVE "run my verification script twice, as two
  separate process invocations, and diff the result" approach genuinely unsound for a real-view "identical
  digest" proof -- not because the layer builder is non-deterministic, but because the INPUT can change between
  the two invocations. Fixed by resolving the view ONCE per comparison and reusing that same resolved snapshot
  object for both from-clean builds within a single script/process, which pins the commit regardless of how long
  the script runs or what happens to the live ref afterward.'
- 'A second, related corpus-drift finding: tests/certification/repair.rs still exists, with its own real
  CITES_REQUIREMENT citation, in the CURRENT "records" tree -- but govbridge.core.corpus.classify_entry now
  classifies it EXCLUDE under rule X-SEC-CONTENT (a rule/content change made by other in-session repair work,
  not by this node). The lineage layer correctly never reads its content as a result -- independent, positive
  confirmation that BR-AR-0014''s corpus-exclusion discipline is honoured by this node''s new capability too,
  not a defect in the count.'
- 'A partially-dynamic Rust array literal (`["trust", "bind", "--authority", path.to_str().unwrap(), ...]`) is
  the DOMINANT real-corpus shape for a CLI-dispatch test call, not the fully-literal array my first draft assumed
  -- the subcommand PATH is always a literal prefix, but VALUE arguments (paths, ids) are routinely computed.
  Fixed generically: read the literal PREFIX of the array, stopping at the first non-literal element OR the first
  element that looks like a flag ("-"-prefixed), the same "read the prefix, do not require the whole list"
  principle govbridge.graph.derive._argv_list_literal already uses for the Python CLI-dispatch case.'
- 'Confirmed by direct testing that govbridge.authority.lifecycle._find_definition (which govbridge.core.exact.
  id_lookup / `govbridge exact id` already calls, UNCHANGED) resolves a new state-key record the moment
  extract_definitions_yaml (records.py, my scope) emits it -- no change needed anywhere outside records.py/
  id-grammar.yaml for this to work end to end'
- 'The existing tests/fixtures/authority/authority_repobuilder.py fixture (not owned by this node) already
  writes its synthetic ORCHESTRATOR_STATE.yaml-shaped document at BRIDGE_STATE_PATH, which is EXACTLY config/
  state-aliases.yaml''s real "bridge" alias path -- this let tests/authority/test_state_records.py exercise
  the REAL alias table and REAL exact-id/lifecycle pipeline end to end without any change to a file outside
  this node''s scope'
- 'A PyYAML node-mark subtlety: end_mark.column==0 reliably means "start of the next line" only for a TOP-level
  block; a NESTED sibling''s end_mark can land mid-line, at the following key''s own indentation column. Fixed by
  using the deepest START mark reached by any descendant node instead (always precisely placed, at every depth)
  -- see extract_definitions_state_keys''s _max_start_line'
- 'govbridge/core/freshness.py has a pre-existing double-import defect when invoked as `python -m
  govbridge.core.freshness ...` directly (`-m pkg.submodule` splits the module from its own `__main__` copy).
  `python -m govbridge index rebuild`/`freshness` (top-level CLI) and any in-process `run()` call are unaffected.
  Not this node''s file; the orchestrator has said it is routing the repair elsewhere'
- 'govbridge/graph/__init__.py -- the usual place a layer package registers itself -- is OUTSIDE this node''s
  mutation_scope (individual files named, no wildcard). govbridge/code/__init__.py IS a wildcard and is already
  imported by every ensure_all_layer_packages_imported() walk, so the new "lineage" layer registers there instead,
  with its OWN builder file calling into govbridge/graph/derive.py''s (and now govbridge/code/rust_cli.py''s)
  edge-deriving functions'
failed_approaches:
- 'Tried addressing nested state keys with a synthetic "state:<alias>#<dotted.path>" id: abandoned because
  govbridge.authority.lifecycle._find_definition resolves by git-grepping the literal token first, and that
  compound string never appears verbatim in any file. Switched to the key''s own bare name as the id'
- 'Tried the SAME end_mark-based span heuristic govbridge.authority.state._compose_and_find uses: produced an
  off-by-one-line span for any node with more than one child; replaced with the start-mark-based approach'
- 'Tried gating the lineage layer''s Python-test-file scan to a hard-coded "tests/" REPO-ROOT prefix: found ZERO
  of this domain''s OWN Python tests, which live nested under release/.../tests/. Replaced with a generic "a .py
  file inside any directory literally named tests, at any depth" rule'
- 'Tried computing the real-view lineage-layer cost via the full `index rebuild --from-clean` pipeline: correct,
  but the semantic/embedding layer alone (~885s) swamped the lineage layer''s own ~96s. Measured the lineage
  layer in isolation via `freshness.run(layer="lineage")` instead'
- 'Tried gating Gap 2''s helper/dispatch/test-file collection to CODE_DIRS, matching the CITES_REQUIREMENT/
  DEPENDS_ON_DATA gate: missed 3 real Rust CLI-dispatch matches living under release/capability-baseline/** and
  release/verification/**/heldout-tests/ -- neither prefix is in CODE_DIRS. A clap CLI definition, a
  CARGO_BIN_EXE helper or a #[test] fn can legitimately live anywhere a .rs file does; widened Gap 2''s OWN scan
  to every .rs file in the corpus (never CODE_DIRS-gated), while leaving the code-COMMENT scan
  (DEPENDS_ON_DATA/CITES_REQUIREMENT) correctly scoped to CODE_DIRS'
- 'Tried requiring an ENTIRE array literal to be string literals before reading any subcommand tokens from a
  Rust test''s `.args([...])` call: found 0 real matches, because the dominant real shape mixes literal
  subcommand tokens with dynamically-computed value arguments in the SAME array. Replaced with a
  literal-PREFIX read (stopping at the first non-literal or flag-shaped element)'
- 'Tried scoring a clap match arm''s "quality" using ONLY its immediate value node type (call_expression vs
  match_expression): missed the real handler for a variant dispatched via a `{ let p = ...?; real_handler(...) }`
  block (a block scored 0, below even an unrelated match elsewhere in the file that happened to be a bare
  call_expression). Added block-tail-expression unwrapping BEFORE scoring, so a block ending in a call/nested
  match is treated as that call/match for both quality-scoring and handler-extraction purposes'
