findings:
- 'Confirmed by direct testing that govbridge.authority.lifecycle._find_definition (which govbridge.core.exact.
  id_lookup / `govbridge exact id` already calls, UNCHANGED) resolves a new state-key record the moment
  extract_definitions_yaml (records.py, my scope) emits it -- no change needed anywhere outside records.py/
  id-grammar.yaml for this to work end to end'
- 'The existing tests/fixtures/authority/authority_repobuilder.py fixture (not owned by this node) already
  writes its synthetic ORCHESTRATOR_STATE.yaml-shaped content at BRIDGE_STATE_PATH, which is EXACTLY config/
  state-aliases.yaml''s real "bridge" alias path -- this let tests/authority/test_state_records.py exercise
  the REAL alias table and REAL exact-id/lifecycle pipeline end to end without any change to a file outside
  this node''s scope'
- 'A PyYAML node-mark subtlety: end_mark.column==0 reliably means "start of the next line" only for a TOP-level
  block; a NESTED sibling''s end_mark can land mid-line, at the following key''s own indentation column, which
  silently truncates a naive column==0 heuristic by one line for anything below the top level. Fixed by using
  the deepest START mark reached by any descendant node instead (always precisely placed, at every depth) --
  see extract_definitions_state_keys''s _max_start_line'
- 'govbridge/core/freshness.py has a pre-existing double-import defect when invoked as `python -m
  govbridge.core.freshness ...` directly: `-m pkg.submodule` runs the target as `__main__`, a module object
  SEPARATE from `govbridge.core.freshness` as normally imported, so sibling packages'' register_layer_builder/
  register_layer calls (against the real module) are invisible to `main()`''s own copy of `_LAYER_BUILDERS` --
  a bare `rebuild --from-clean` silently runs only the "core" builder while still calling every digest via the
  correctly-shared govbridge.core.manifest, producing an empty-hash digest for every OTHER layer regardless of
  its actual content. `python -m govbridge index rebuild`/`python -m govbridge freshness` (through the top-level
  CLI) and any in-process `govbridge.core.freshness.run()` call are unaffected. Not this node''s file to fix;
  the orchestrator has said it is routing the repair elsewhere'
- 'REOPENING: govbridge/graph/__init__.py -- the usual place a layer package registers itself at import time --
  is OUTSIDE this node''s mutation_scope (individual govbridge/graph/*.py files are named, never a `**`
  wildcard). govbridge/code/__init__.py IS a wildcard (govbridge/code/**) and is already imported by every
  ensure_all_layer_packages_imported() walk (it registers "code"). Registering the new "lineage" layer there,
  with its OWN builder file (govbridge/code/lineage_layer.py) calling INTO govbridge/graph/derive.py''s
  edge-deriving functions, keeps every derivation function exactly where the brief puts it while still reaching
  the real registration point from within scope'
- 'REOPENING: on the REAL current view, DEPENDS_ON_DATA (225 rows) and TESTS (2 rows, both EXACT_CLI_DISPATCH)
  are genuinely present; CITES_REQUIREMENT is genuinely 0 -- verified by a direct git-grep for a comment-shaped
  "<path>.md:<N>"/"<path>.rs:<N>" citation under every CODE_DIRS prefix, which returns zero hits repo-wide. The
  product''s Rust comments do not use this citation convention today. Not a defect in the derivation logic
  (proven nonzero, correctly labelled, on a controlled fixture); a property of the current corpus'
- 'REOPENING/hermeticity: my own first-return test (tests/graph/test_derive.py::
  test_cli_dispatch_tests_edge_resolves_a_subprocess_invoked_subcommand) depended on gitobj.resolve_commit("HEAD")
  with repo=None (the shared, live repository''s current HEAD, which other agents mutate this session) and a
  CWD-relative file read -- exactly the class of bug BR-DAG-AMEND-R1-4 exists to catch. Fixed with a fully
  synthetic fixture and explicit repo=; the mechanism it tests (resolve_cli_handler) is unaffected, only the test
  changed'
failed_approaches:
- 'Tried addressing nested state keys with a synthetic "state:<alias>#<dotted.path>" id (matching the resolver''s
  own state_ref syntax): abandoned because govbridge.authority.lifecycle._find_definition resolves a token by
  git-grepping its LITERAL text first, and that compound, synthetic string never appears verbatim in any file --
  it would never be grep-found. Switched to the key''s own bare name as the id (always literally present in the
  YAML text at the line that defines it), with the dotted path kept only as Definition.record_path for
  disambiguating context'
- 'Tried the SAME end_mark-based span heuristic govbridge.authority.state._compose_and_find uses (end_mark.line,
  -1 if column==0): produced an off-by-one-line span for any node with more than one child (see findings) --
  that function is only ever asked to resolve a single caller-given LEAF key path, so the bug was never
  triggered there; replaced with the start-mark-based approach for this walk-every-depth use case'
- 'REOPENING: tried gating the new lineage layer''s test-file scan to a hard-coded "tests/" REPO-ROOT prefix
  (mirroring an early draft): on the real view this matched only the product''s OWN Rust test suite (top-level
  tests/**/*.rs) and found ZERO Python test files, because this domain''s own Python tests live nested under
  release/orchestration/phase-2-context-bridge/tests/ -- a DIFFERENT top-level path in the same "records" tree.
  Replaced with a generic "a .py file inside any directory literally named tests, at any depth" rule
  (_is_test_python_path), which correctly found this domain''s own CLI-dispatch tests without naming any path'
- 'REOPENING: tried computing the real-view lineage-layer cost via `python -m govbridge index rebuild
  --from-clean` (the full pipeline, all layers): correct, but the semantic/embedding layer alone took ~885s,
  swamping the ~77s the lineage layer itself needs. Measured the lineage layer in isolation instead via
  `freshness.run(from_clean=True, layer="lineage")`, which the run() API already supports'
