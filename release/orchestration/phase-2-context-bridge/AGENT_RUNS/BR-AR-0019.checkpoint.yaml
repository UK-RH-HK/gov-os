lessons:
- 'When a new record-addressing scheme must work through an EXISTING, out-of-scope resolver that git-greps the
  literal token first, design the id format to BE that literal text -- check the consumer''s resolution mechanism
  before inventing a new id shape'
- 'PyYAML end_mark columns are not uniformly "start of next line" at every nesting depth; prefer the deepest
  START mark when sizing a multi-child block''s own span'
- 'A background `index rebuild --from-clean` against the real corpus is slow (semantic/embedding alone ~15 min)
  and will run at 400%+ CPU per embedding worker if left unattended -- use the true background (nohup, detached)
  and kill orphaned children explicitly (SIGKILLing the parent does not reap them); `freshness.run(layer="<name>")`
  isolates one layer''s own cost cleanly'
- '"on-demand, never persisted" is not a free pass just because sibling functions already work that way -- when
  an acceptance check says "identical digests for every new layer", a capability that persists nothing makes that
  check vacuous. This programme has rejected exactly that pattern twice before (BR-DAG-AMEND-3, B3R): read the
  acceptance-check TEXT as binding before assuming an existing code pattern settles the question'
- 'a mutation-scope boundary that excludes an __init__.py can still be worked around, generically and without
  scope creep, by finding an in-scope package whose __init__.py is already on the same import-discovery path'
- 'when a "must be configuration" requirement has no natural home in config/ and no wildcard covers it, a small
  YAML file inside an in-scope wildcarded package directory is a legitimate alternative to a code literal'
- 'MY OWN "independently verified" claim can still be wrong if the independent check uses too narrow a pattern --
  re-deriving a negative result (a zero count) with a DIFFERENT, more literal method (the exact shape the
  counterparty describes, not my own paraphrase of it) is worth the extra few minutes before reporting genuine
  absence, especially when the counterparty''s own command is given verbatim: run THAT command, not a
  reformulation of it, as the first check'
- 'a shared, actively-developed branch ("records" here) is not a safe pin for a two-invocation "identical digest"
  proof done as two SEPARATE process runs; resolve the view once and reuse the resolved snapshot object for both
  builds within ONE script/process to make the comparison immune to the ref moving in between'
- 'a real-world Rust test corpus mixes literal and dynamically-computed values in the SAME argument list far more
  often than a synthetic fixture suggests -- design a "read the literal PREFIX" extraction from the start for
  this kind of shape, rather than an "all-or-nothing" literal-array check'
