findings:
- 'Confirmed by direct testing that govbridge.authority.lifecycle._find_definition (which govbridge.core.exact.
  id_lookup / `govbridge exact id` already calls, UNCHANGED) resolves a new state-key record the moment
  extract_definitions_yaml (records.py, my scope) emits it -- no change needed anywhere outside records.py/
  id-grammar.yaml for this to work end to end'
- 'The existing tests/fixtures/authority/authority_repobuilder.py fixture (not owned by this node) already
  writes its synthetic ORCHESTRATOR_STATE.yaml-shaped content at BRIDGE_STATE_PATH, which is EXACTLY config/
  state-aliases.yaml''s real "bridge" alias path -- this let tests/authority/test_state_records.py exercise
  the REAL alias table and REAL exact-id/lifecycle pipeline end to end without any change to a file outside
  this node''s scope'
- 'A PyYAML node-mark subtlety: end_mark.column==0 reliably means "start of the next line" only for a TOP-level
  block; a NESTED sibling''s end_mark can land mid-line, at the following key''s own indentation column, which
  silently truncates a naive column==0 heuristic by one line for anything below the top level. Fixed by using
  the deepest START mark reached by any descendant node instead (always precisely placed, at every depth) --
  see extract_definitions_state_keys''s _max_start_line'
- 'govbridge/core/freshness.py has a pre-existing double-import defect when invoked as `python -m
  govbridge.core.freshness ...` directly (see open_issues in the report); `python -m govbridge index rebuild`/
  `python -m govbridge freshness` (through the top-level CLI) and any in-process govbridge.core.freshness.run()
  call are unaffected. Not this node''s file to fix; flagged for the orchestrator'
failed_approaches:
- 'Tried addressing nested state keys with a synthetic "state:<alias>#<dotted.path>" id (matching the resolver''s
  own state_ref syntax): abandoned because govbridge.authority.lifecycle._find_definition resolves a token by
  git-grepping its LITERAL text first, and that compound, synthetic string never appears verbatim in any file --
  it would never be grep-found. Switched to the key''s own bare name as the id (always literally present in the
  YAML text at the line that defines it), with the dotted path kept only as Definition.record_path for
  disambiguating context'
- 'Tried the SAME end_mark-based span heuristic govbridge.authority.state._compose_and_find uses (end_mark.line,
  -1 if column==0): produced an off-by-one-line span for any node with more than one child (see findings) --
  that function is only ever asked to resolve a single caller-given LEAF key path, so the bug was never
  triggered there; replaced with the start-mark-based approach for this walk-every-depth use case'
unresolved:
- 'the govbridge/core/freshness.py `-m` double-import defect (found, documented, worked around; not fixed --
  outside mutation scope)'
- 'whether R1-INT''s generic-rule audit is satisfied by this run''s comments/docstrings (they discuss the
  MECHANISM generically -- CLI dispatch shapes, test-registry shape, state-file registry -- and name no Review-8
  item, F-finding or Phase-2 file; fixture DATA in the new tests uses synthetic ids like FX-CAP-1, never a real
  finding id)'
decisions:
- 'D-R1-RL-1 (within authority): state-key record ids are the key''s own bare name (not a synthetic
  "state:alias#path" token), because the existing, unmodified exact-id resolution path is git-grep-first --
  see findings/failed_approaches above. The full dotted path is still recorded, in Definition.record_path, for
  precision'
- 'D-R1-RL-2 (within authority): no new store layer is registered. State records flow into the EXISTING
  "authority" layer (govbridge/authority/layer.py, untouched) automatically, because extract_definitions_yaml
  is the function records.scan_ref/layer.build already call for every YAML file. TESTS(b)/(c), DEPENDS_ON_DATA,
  CITES_REQUIREMENT and symbol history stay on-demand, bounded, git-content functions -- never persisted --
  exactly like every sibling function already in govbridge/graph/derive.py and govbridge/code/history.py''s own
  diff(). Flagged in open_issues/unresolved for the orchestrator/R1-INT to confirm this reading of "every
  addition registered as a store layer with a digest" is correct'
- 'no modification to any existing test file''s assertions: tests/graph/test_derive.py and
  tests/code/test_symbols_integration.py were extended by pure addition (git diff shows 0 deletions in either
  file); no existing test needed correcting'
lessons:
- 'When a new record-addressing scheme must work through an EXISTING, out-of-scope resolver that works by
  git-grepping the literal token first, design the id format to BE that literal text, not a synthetic
  compound -- check the consumer''s resolution mechanism before inventing a new id shape'
- 'PyYAML end_mark columns are not uniformly "start of next line" at every nesting depth; prefer walking to the
  deepest START mark when sizing a multi-child block''s own span'
- 'A background `python -m govbridge index rebuild --from-clean` against the real corpus is slow (the semantic/
  embedding layer alone took ~15 minutes on this box) and will happily run at 400%+ CPU per embedding worker
  process if left unattended -- run it in the true background (nohup, detached) and kill it (and its orphaned
  onnx_embed.py children specifically -- SIGKILLing the parent does not reap them) rather than block on it
  when a faster, equally valid, isolated fixture-based proof already exists'
next_consumer: 'R1-GA1/R1-GA2/R1-GA3 (the "govbridge gather" retrieval-loop nodes), which consume these new
  derive.py/symbol_history.py/code.symbols capabilities from within the gather loop (they, not this node, wire
  them into govbridge why/impact -- why.py/impact.py are outside R1-RL''s mutation scope and were not touched);
  R1-INT for the generic-rule audit and the mutation-scope/overlap check; the orchestrator for the
  govbridge/core/freshness.py double-import defect'
