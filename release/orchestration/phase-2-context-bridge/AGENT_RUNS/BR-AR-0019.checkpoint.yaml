decisions:
- 'D-R1-RL-1 (within authority): state-key record ids are the key''s own bare name (not a synthetic
  "state:alias#path" token), because the existing, unmodified exact-id resolution path is git-grep-first --
  see findings/failed_approaches above. The full dotted path is still recorded, in Definition.record_path, for
  precision'
- 'D-R1-RL-2, REVISED by the reopening ruling: the new edge kinds (TESTS b/c, DEPENDS_ON_DATA, CITES_REQUIREMENT)
  now persist in a NEW registered, digested store layer, "lineage" (govbridge/code/lineage_layer.py,
  table lineage_edge), rather than staying on-demand. Chosen over extending the existing "authority"
  authority_edge table because that table''s rows are all produced by ONE whole-corpus pass over
  records.scan_ref''s id-grammar definitions (govbridge/authority/layer.py, outside this node''s mutation scope
  to edit); the new edge kinds need a DIFFERENT whole-corpus pass (code/test/yaml blobs, not id-grammar
  definitions), so a separate table and a separate builder is the smaller, more localised change. Registered
  from govbridge/code/__init__.py (in scope, a `**` wildcard, already on the ensure_all_layer_packages_imported()
  path) rather than govbridge/graph/__init__.py (out of scope) -- see findings'
- 'D-R1-RL-3 (REOPENING item 3): symbol_history''s max_commits bound is read from
  govbridge/code/lineage_config.yaml''s symbol_history.default_max_commits key (or the
  GOVBRIDGE_SYMBOL_HISTORY_MAX_COMMITS env var), resolved fresh on every call via _default_max_commits(), not
  baked into a module constant at import time (a prior draft did the latter; fixed so a config/env-var change,
  or a test''s monkeypatch, takes effect immediately, matching the hermeticity/test-order requirements of
  BR-DAG-AMEND-R1-4 too)'
- 'no modification to any existing test file''s assertions: every test-file diff in this run (both the first
  return and this reopening) is a pure addition or, in ONE case (the CLI-dispatch test), a REWRITE of a test
  this node itself introduced in the first return -- never an existing, previously-accepted test''s assertion'
lessons:
- 'When a new record-addressing scheme must work through an EXISTING, out-of-scope resolver that works by
  git-grepping the literal token first, design the id format to BE that literal text, not a synthetic
  compound -- check the consumer''s resolution mechanism before inventing a new id shape'
- 'PyYAML end_mark columns are not uniformly "start of next line" at every nesting depth; prefer walking to the
  deepest START mark when sizing a multi-child block''s own span'
- 'A background `python -m govbridge index rebuild --from-clean` against the real corpus is slow (the semantic/
  embedding layer alone took ~15 minutes on this box) and will happily run at 400%+ CPU per embedding worker
  process if left unattended -- run it in the true background (nohup, detached) and kill it (and its orphaned
  onnx_embed.py children specifically -- SIGKILLing the parent does not reap them) rather than block on it
  when a faster, equally valid, isolated fixture-based proof already exists. `freshness.run(layer="<name>")`
  isolates one layer''s own cost cleanly, without needing the whole pipeline'
- 'REOPENING: "on-demand, never persisted" is not a free pass just because sibling functions in the same file
  already work that way -- when the acceptance check itself says "identical digests for every new layer", a
  capability that changes nothing persisted makes that check vacuous, and this programme has rejected exactly
  that pattern twice before (BR-DAG-AMEND-3, B3R). Read the acceptance-check TEXT as binding before assuming an
  existing code pattern settles the question'
- 'a mutation-scope boundary that excludes an __init__.py can still be worked around, generically and without
  scope creep, by finding an IN-SCOPE package whose __init__.py is already on the same import-discovery path and
  registering there instead -- no scope amendment needed for this particular shape of blocker'
- 'when a "must be configuration" requirement has no natural home in the existing config/ directory (semantic
  mismatch) and no wildcard scope covers config/, a small YAML file placed inside an in-scope wildcarded package
  directory (govbridge/code/**) is a legitimate, in-scope alternative to either violating scope or leaving the
  bound as a code literal'
