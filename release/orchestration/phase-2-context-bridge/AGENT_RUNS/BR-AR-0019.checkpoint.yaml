lessons:
- 'When a new record-addressing scheme must work through an EXISTING, out-of-scope resolver that git-greps the
  literal token first, design the id format to BE that literal text -- check the consumer''s resolution mechanism
  before inventing a new id shape'
- 'PyYAML end_mark columns are not uniformly "start of next line" at every nesting depth; prefer the deepest
  START mark when sizing a multi-child block''s own span'
- 'A background `index rebuild --from-clean` against the real corpus is slow (semantic/embedding alone ~15 min)
  and will run at 400%+ CPU per embedding worker if left unattended -- use the true background (nohup, detached)
  and kill orphaned children explicitly (SIGKILLing the parent does not reap them); `freshness.run(layer="<name>")`
  isolates one layer''s own cost cleanly'
- '"on-demand, never persisted" is not a free pass just because sibling functions already work that way -- when
  an acceptance check says "identical digests for every new layer", a capability that persists nothing makes that
  check vacuous. This programme has rejected exactly that pattern twice before (BR-DAG-AMEND-3, B3R): read the
  acceptance-check TEXT as binding before assuming an existing code pattern settles the question'
- 'a mutation-scope boundary that excludes an __init__.py can still be worked around, generically and without
  scope creep, by finding an in-scope package whose __init__.py is already on the same import-discovery path'
- 'when a "must be configuration" requirement has no natural home in config/ and no wildcard covers it, a small
  YAML file inside an in-scope wildcarded package directory is a legitimate alternative to a code literal'
- 'MY OWN "independently verified" claim can still be wrong if the independent check uses too narrow a pattern --
  re-deriving a negative result (a zero count) with a DIFFERENT, more literal method (the exact shape the
  counterparty describes, not my own paraphrase of it) is worth the extra few minutes before reporting genuine
  absence, especially when the counterparty''s own command is given verbatim: run THAT command, not a
  reformulation of it, as the first check'
- 'a shared, actively-developed branch ("records" here) is not a safe pin for a two-invocation "identical digest"
  proof done as two SEPARATE process runs; resolve the view once and reuse the resolved snapshot object for both
  builds within ONE script/process to make the comparison immune to the ref moving in between'
- 'a real-world Rust test corpus mixes literal and dynamically-computed values in the SAME argument list far more
  often than a synthetic fixture suggests -- design a "read the literal PREFIX" extraction from the start for
  this kind of shape, rather than an "all-or-nothing" literal-array check'
- 'when a sibling layer ALREADY has a correct, generic "which refs am I eager over" answer (govbridge.code.build.
  eager_ref_names), a new layer that derives edges ABOUT the same content should REUSE that function directly
  rather than asking "what should MY OWN eager-ref rule be" from scratch -- the two questions have the same
  answer for a reason (both are about the same underlying code), and a second, parallel selector is a second
  place for the two to silently drift apart later'
- 'an expensive per-item classification (here: git-backed version-status lookup, ~2 subprocess calls per blob per
  ref) can often be safely short-circuited by DATA this build ALREADY computed for another purpose (a per-ref
  path->blob tree, needed anyway to enumerate what to scan) -- but only when the substitution is proven equivalent
  to the real function by a DIRECT test that calls both and compares, not merely assumed correct because it "does
  the same thing" by inspection; this project has been burned twice before by an unverified "equivalent" shortcut
  quietly diverging from its own source of truth'
- 'before widening a resolver to cover a new indirection shape (a struct method, here), measure the REAL corpus
  file/call-site counts for that shape FIRST (a plain git grep, before writing any code) -- it turns both "does
  this shape actually matter" and "did my fix work" into a comparison against a number obtained independently of
  the code being judged, rather than a number the same code later reports about itself'
- 'a synthetic test fixture using a shape the real corpus does not actually use (a unit struct literal, where
  every real harness type in the corpus uses `Type::new()`) can silently exercise the WRONG code path (a fallback,
  not the primary path) and still pass -- when a fixture''s result surprises you, check whether the fixture itself
  matches the real corpus''s own shape before altering the implementation to accommodate it'
- 'a schema-recognition mechanism that walks PARSED structure (not raw text) can legitimately find MORE real rows
  than a hand-written regex the counterparty''s own verification command uses, not just fewer -- when a real-view
  count comes out higher than an independent measurement, investigate why before assuming the independent
  measurement is the ceiling; here it was a YAML style difference (flow vs block) the parsed walk is naturally
  immune to and a line-anchored regex structurally cannot see'
- 'a build-time function that needs data another layer''s table holds should read it through the CALLER''S OWN
  already-open connection (a JOIN against a table that layer''s own builder already populated), never by calling
  a QUERY-time helper designed for a caller with no shared connection of its own (which opens its own,
  independent one) -- the two call sites have genuinely different correct designs, and using the wrong one for a
  BUILD context can have a side effect (a spurious write to whatever store the environment currently names) with
  no connection to the feature''s own correctness at all; the full domain suite (BR-DAG-AMEND-R1-4''s own
  "run it last") is what caught this, not any test of the new feature itself -- one more reason it is a HARD
  requirement, not a formality'
