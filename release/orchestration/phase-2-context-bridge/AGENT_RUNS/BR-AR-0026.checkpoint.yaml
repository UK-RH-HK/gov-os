findings:
- >-
  gather_with_followup's own "merged" list (govbridge.gather.merge.MergedItem.to_dict()) does not itemise which
  requested facet produced a BASE-ROUND item (provenance.facet is None for every base contribution -- confirmed
  by reading govbridge/gather/followup.py's own module docstring and R1-GA2's checkpoint failed_approaches, which
  tried and reverted calling the engine once per facet inside gather_with_followup itself for exactly this
  reason). This node recovers a disclosed, defensible per-item facet tag at ITS OWN layer (route+scope
  consistency against the query's own requested facets) rather than re-opening that decision.
- >-
  govbridge.compile.supplementary.build_supplementary_packet's "gather" command handling
  (extract_items -> _items_from_route_hits) was written against govbridge.gather.engine.gather's plain
  RouteHit.to_dict() "merged" shape (an "occurrences" LIST), not against gather_with_followup's richer
  MergedItem.to_dict() shape (a single "occurrence" dict plus "provenance"/"ref_summary") -- R1-RS and R1-GA2 ran
  in the same parallel group (R1-PG3) and never saw each other's exact return shape. Reconciled with a small,
  lossless adapter (govbridge.compile.overflow.merged_items_as_hit_dicts) rather than editing supplementary.py.
- >-
  govbridge.gather.facets.Facet.effective_target_items()/effective_batch_size() fall back to the PARAMETERLESS
  govbridge.gather.facets.default_target_items()/default_batch_size() (the real, global config/facets.yaml's own
  document-level defaults) whenever a facet row does not set its own target_items/batch_size -- neither function
  threads a custom facets_path through that fallback. A synthetic facets.yaml fixture that wants a target_items
  different from the real global default (16) must set it explicitly on every facet row (see
  tests/compile/test_facet_quotas.py's own comment on this). Not a bug in this node's own files; disclosed because
  it cost real debugging time and would recur for any other synthetic facets.yaml fixture.
- >-
  router.dedupe_key keys a "chunk" unit by (path, line_start, line_end) alone -- two synthetic fixture pools that
  share one path with overlapping line numbers silently collide and dedupe into each other. Not a bug; a fixture-
  authoring lesson (this node's own test_facet_quotas.py fixtures use distinct paths per pool for exactly this
  reason).
- >-
  `govbridge compile --out DIR` never persists a supplementary packet's own rendered content to disk -- only its
  sha256 reaches the main packet's own EVIDENCE_OVERFLOW J notice (compile_packet's own
  result["supplementary_packets"] dict is built but only ever consumed in-process, never written by the CLI; see
  the pre-existing "cli.py wiring" open_issue above). This made the one real-view determinism divergence
  UN-DIFFABLE after the fact: I could compare the two runs' main-packet drop records (identical) but could not
  compare the actual differing supplementary-packet text, because it was never saved anywhere. The coordinator
  has named this BR-DAG-AMEND-R1-20, routed to R1-RA, to close.
- >-
  govbridge/gather/followup.py's own _safe_read_path/_safe_ls_tree_path (its module docstring, "a git gc/repack
  can transiently race an ordinary read... observed directly") degrade a transient git read failure to an honest
  MISSING rather than crashing, in the follow-up identifier-resolution path specifically. This session
  independently observed (via `ps aux`) 2-3 sibling agents' own concurrent `index rebuild --from-clean` processes
  running at the exact wall-clock time of this node's one real-view determinism divergence -- the environmental
  precondition for this mechanism was confirmed present, even though the exact degraded item could not be pinned
  down (see the unresolved item above).
failed_approaches:
- >-
  Tried calling gather_with_followup ONCE per query with ALL requested facets (matching the tested, budgeted
  performance envelope R1-GA1 measured), then recovering per-item facet attribution purely from provenance.
  Reverted the "recover from provenance alone" half: provenance never carries a real facet name for base-round
  items (see findings), so this alone could not satisfy "per-item facet tags" -- added the route+scope heuristic
  in govbridge.compile.overflow instead, on top of the same single gather_with_followup call per query (never
  switched to a per-facet call pattern, which would have cost roughly 11x the real-view wall time per query for
  CONTROL-A's default facet set and was never necessary once the heuristic covered the gap).
- >-
  Tried matching a mandatory item's oversize section against the gather facet vocabulary using the section's own
  BODY TEXT (not just its heading/key name). Reverted: R1-RM's own MF-BIG fixture (tests/fixtures/compile/
  mandatory/repobuilder.py, outside this node's mutation_scope) generates filler prose containing the word "must"
  in every single section, which collided with the "requirement" facet's own extra_terms and would have delivered
  every "Part N" section in full -- breaking test_mandatory_fidelity.py::test_oversize_item_never_ends_mid_content
  and ::test_notice_with_a_gap_fails_verify's own assumptions, neither of which this node may edit. Scoring the
  section's own NAME only (never its free-form body prose) is both safer and a better match for "a section
  someone would ask for by name".
- >-
  Considered giving BR-DAG-AMEND-R1-11's oversize-section selection the CURRENT compile's own task-specific
  requested facets (the literal reading of "the task's gather facets"). Reverted: govbridge.compile.validate's
  independent re-derivation (_composition_context_class) calls Compiler._mandatory_text(mi, dparts) through a
  bare Compiler subclass that sets ONLY repo/per_item_cap_bytes/notices -- no task, no query set, no facets_path.
  A task-specific selection would make that blind re-derivation permanently disagree with the real compile's own
  rendered body, failing `packet verify`'s rendered-body recomposition check for every oversize item that ever
  used it. Escalated to the coordinator; ACCEPTED as a disclosed limit (see decisions).
unresolved:
- >-
  One CONTROL-A compile pair (/tmp/ga3-ca-1, /tmp/ga3-ca-2, run immediately after store-BR-AR-0026 finished its
  from-clean build, before this node's section_map-compaction fix) diverged: every section's rendered content was
  byte-identical, but CA-DEPS's own EVIDENCE_OVERFLOW notice differed (94 overflow items in both, different
  supplementary_packet_sha256). Investigated exhaustively (see check5, and decisions below) -- PYTHONHASHSEED
  cross-checked and refuted, drop records identical, semantic-route determinism confirmed by the coordinator, and
  6 further clean re-runs (3 different-hash-seed concurrent, 2 in-process, 2 sequential mimicking the ORIGINAL
  test's own methodology) all matched byte-for-byte. Could not be confirmed directly against the original pair
  because `govbridge compile --out DIR` never persists a supplementary packet's own rendered content to disk (see
  the finding below) -- the original divergent artifacts could not be diffed after the fact. Best explanation
  (coordinator-endorsed, not directly provable): a transient git read failure under concurrent repository
  activity (multiple sibling agents' own from-clean rebuilds were confirmed running at that wall-clock time)
  degraded one follow-up-resolved identifier to an honest MISSING in govbridge/gather/followup.py's own
  documented degradation path (_safe_read_path/_safe_ls_tree_path) -- outside this node's mutation_scope, not
  fixed by me. R1-GA2 is hardening this (bounded retry, then an explicit deterministic:false with the degraded
  items listed); after that merges, the orchestrator re-runs the double compile on the merged tree and R1-INT
  stress-tests determinism under concurrent load.
decisions:
- >-
  Escalated to the coordinator and ACCEPTED: replaced the MANDATORY_PARTIAL_DELIVERY notice's "section_map" field
  (a full copy of every disclosure row, on top of the "delivered"/"undelivered_ranges" lists that already
  partition that exact same set) with a compact {count, names_sha256} summary -- the real-view CONTROL-A check
  found this ONE notice, for the real oversize contract_v3 (132 structural sections), was 76,978 bytes on its own,
  making J (PINNED, never budget-dropped) the dominant contributor to a 187,881-byte rendered packet against the
  bounded-builder profile's 100 KB nominal total. Confirmed (grep across govbridge/ and tests/, and by reading
  validate.py's own tiling check directly) that nothing anywhere reads notice["section_map"]; R1-RM's own original
  code had the identical redundancy (section_map == undelivered_ranges verbatim, since "delivered" was always
  empty pre-R1-GA3). Reduced the real CONTROL-A packet.md from 187,881 to 143,688 bytes. Same discipline BR-AR-0015's
  own budgets.compact_drops already established for G's own oversized drop lists.
- >-
  Escalated to the coordinator and ACCEPTED: the real-view "byte-identical" acceptance row is recorded
  MET_WITH_DISCLOSED_LIMIT, not plain MET. Evidence for MET: 6 of 6 clean re-runs of the current code were
  byte-identical, including 3 different PYTHONHASHSEED values (0, 0, 1, run concurrently) and both concurrent and
  sequential process patterns; the two runs' own per-item drop records were identical. The disclosed limit: one
  EARLIER compile pair (before the section_map fix, run immediately after the store's own from-clean build)
  diverged in exactly one query's (CA-DEPS) supplementary-packet reference hash, with a cause that could not be
  confirmed directly (see findings/unresolved) because the differing artifact was never persisted to disk. R1-GA2
  is hardening the suspected mechanism (a bounded retry, then explicit deterministic:false with degraded items
  listed); the orchestrator will re-run the double compile once that merges, and R1-INT will stress-test
  determinism under concurrent load.
- >-
  Escalated to the coordinator and ACCEPTED: BR-DAG-AMEND-R1-11's oversize-section selection uses the DEFAULT,
  global facet registry (config/facets.yaml at its default path) rather than the current compile's own requested
  facet subset, because of the validate.py blind-re-derivation constraint (see failed_approaches). Recorded
  MET_WITH_DISCLOSED_LIMIT in conformance. The coordinator additionally judged the better design (recording the
  selected ranges in the manifest so verify can check a task-specific selection) to need a validate.py change,
  outside this node's mutation_scope, and is carrying it as a residual for the verifier/R1-INT -- not implemented
  here.
- >-
  Escalated to the coordinator and ACCEPTED: section G keeps its own pre-existing BR-AR-0015 T1-T4 tiered budget,
  unmodified; facet quotas (govbridge.compile.budgets.enforce_section_with_quotas) apply to every OTHER section.
  Recorded MET_WITH_DISCLOSED_LIMIT in conformance.
- >-
  Escalated to the coordinator and ACCEPTED: per-item facet tags for a base-round gather item are a disclosed
  SUPERSET (route+scope consistency), never a precise single-facet claim; follow-up-round items are tagged
  precisely by their own trigger identifier kind. See findings/failed_approaches for why a precise base-round tag
  is not obtainable without editing govbridge/gather/** (out of scope, and R1-GA2 already tried and reverted the
  one approach that would have supplied it).
- >-
  Made within this node's own authority: BR-DAG-AMEND-R1-11's max_sections=6/max_extra_bytes=49152 constants
  (govbridge.compile.overflow.select_oversize_facet_sections) are module-level Python defaults, not a new
  config/budgets.yaml key -- matching the existing precedent of govbridge.gather.followup's own
  DEFAULT_MAX_FOLLOWUP_ROUNDS/_MAX_SLICE_CHARS module constants (also hardcoded, also documented) rather than
  adding a config surface the deliverable never asked for.
- >-
  No existing test file was modified (R1-T1's own rule 5 does not apply: every new assertion lives in this node's
  own three new test files, all inside mutation_scope; tests/compile/test_mandatory_fidelity.py and
  tests/fixtures/compile/mandatory/** -- R1-RM's files -- were read for reference but never edited).
lessons:
- >-
  When a node's own facet-tagging/selection logic must be reproducible by a SEPARATE module's blind
  re-derivation (here, govbridge.compile.validate's task-free recomposition of a mandatory item's body), the
  reproducibility constraint has to be checked FIRST, before designing the selection heuristic -- "use the
  current compile's own context" is the natural first instinct and is exactly the one reading that breaks the
  independent-verification contract ARCHITECTURE.md section 5.3 rule 4 exists to protect.
- >-
  A synthetic fixture that wants to distinguish two facets sharing the same authority class/lifecycle should
  differentiate them by ROUTE (a facet's own `routes` tuple), not by trying to make govbridge.gather's own
  round-0 merge order do the differentiating -- route is the one field this domain's own facet-tagging heuristic
  (and the underlying engine's own per-round accounting) can never blur across two otherwise-identical facets.
- >-
  A synthetic facets.yaml fixture must set target_items/batch_size explicitly on every facet row it cares about;
  the document-level default_target_items/default_batch_size keys are read through a PARAMETERLESS loader that
  silently falls back to the REAL global config/facets.yaml's own defaults for any facet row that omits them.
