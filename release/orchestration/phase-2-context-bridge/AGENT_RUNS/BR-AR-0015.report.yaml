claims:
  - id: C1-record-seed-symbols-derived-and-resolved-at-product-ref
    text: >
      New module govbridge/compile/codeseeds.py (defect 1: "nothing derives seed symbols from record seeds").
      record_span() resolves a task seed to its own heading-delimited section -- a bare record id via a git-grep +
      id-grammar-extraction walk (govbridge/compile/codeseeds.py:81-106, mirroring govbridge.graph.derive.
      defines_edges_for_id's own walk, kept separate only because that frozen function discards line_end), or
      RECORD#LOCAL (e.g. P2-AR-0097#F2) by finding the record's own file first, then re-scanning that SAME file's
      text for the local heading (codeseeds.py:109-128). cited_code_units() (codeseeds.py:202-259) then scans the
      section's own text for the four citation shapes BR-HO-0015 names: path:N / path:N-M (via govbridge.graph.
      derive.cites_edges_in_text, called with citing_commit=PRODUCT commit -- never the record's own ref, because
      G's job, ARCHITECTURE.md section 7.2, is "the code route at the canonical product ref"), a path-qualified
      symbol ("module::fn"/"Type::fn"), and a bare backticked symbol. Every citation is resolved at the product ref
      using only govbridge.code.symbols's public entry points (ensure_indexed) plus a precomputed whole-commit
      (name, qualified_name) index built from govbridge.code.store.symbols_for_blobs (codeseeds.py:136-172) --
      never a new resolution heuristic. Labels are never blurred: EXACT_PATH/HEURISTIC_SUFFIX for path:line
      citations (carried straight from cites_edges_in_text's own derivation), EXACT_QUALIFIED only for a
      "::"-qualified token that resolves to exactly one definition, HEURISTIC_NAME always for a bare backtick
      token (never promoted to exact, whatever the match count), HEURISTIC_AMBIGUOUS (all candidates, none chosen)
      for an ambiguous qualified token. A cited line with no enclosing symbol becomes an occurrence-level G item
      (CitedOccurrence) instead of being dropped -- this is also how a cited evidence probe (a non-.rs path, e.g.
      under probes/) surfaces, generically, with no special-casing of that directory.
  - id: C2-seed-expansion-callers-callees-tests-reads-key
    text: >
      govbridge/route/real_routes.py's code_route (defect 2: "expand from those seed symbols... callers and
      callees; the READS_KEY consumers of any literal key read at a seed symbol; TESTS edges") now builds a shaped
      code_conn (govbridge.graph.code_bridge, the same connection why()/impact() already use) once per RouteSet
      (real_routes.py:172-185) and, for every resolved definition, calls govbridge.graph.derive.callees_of/
      tests_of (real_routes.py:229-247) plus a READS_KEY expansion: the literal keys read AT that symbol (queried
      directly from the shaped connection's own literal table, the same query shape derive.reads_key_of itself
      uses) followed by derive.reads_key_of for each key, surfacing every peer consumer. Existing definitions/
      callers resolution (codesymbols.definitions/callers) is untouched. code_route gained two new optional
      kwargs, seed_labels (citation-confidence label, embedded as "[citation:LABEL]" in the definition hit's text,
      never conflated with a CALLS/TESTS/READS_KEY edge's own resolution label) and bare_occurrences (occurrence-
      level G items for citations with no enclosing symbol) -- both additive, so an existing caller passing neither
      is unaffected (confirmed by tests/route/test_real_routes.py's own 6 pre-existing tests, unmodified, still
      passing).
  - id: C3-packet-py-wires-derivation-into-the-seed-pass
    text: >
      govbridge/compile/packet.py's Compiler.code_seeds_for (packet.py:325-357) calls codeseeds.cited_code_units
      per seed and returns (seed_names, seed_labels, bare_occurrences) -- seed_names always starts with the
      original seed, so a seed that is already a code symbol keeps working exactly as before. The seed pass
      (packet.py:545-560) now calls c.routes.run("code", seeds=seed_names, seed_labels=seed_labels,
      bare_occurrences=bare_occurrences) instead of seeds=[seed], so every derived symbol/occurrence flows through
      the SAME code-route -> RouteHit -> item_from_hit pipeline as a direct symbol seed, picking up dedup, budget
      and ordering uniformly. Compiler gained product_commit() (packet.py:294-304), a cached, role-resolved lookup
      (role: product in config/canonical-view.yaml, never a hard-coded ref name -- OC-BR-02) reused by both
      code_conn() and code_seeds_for().
  - id: C4-placement-code-or-test-surface-to-g-not-h
    text: >
      Defect 3 ("Placement looks at (class, lifecycle, delivery) only... A retrieved hit whose canonical occurrence
      is product code or a test lands in H"). New module govbridge/compile/codesurfaces.py: is_code_or_test_surface
      checks an occurrence's path against a small, versioned config list (config/budgets.yaml's new
      code_test_surfaces key: source_extensions [.rs, .py], source_dirs [the SAME generic list
      govbridge.graph.derive.CODE_DIRS already uses], test_path_globs). packet.py's query-fusion loop
      (packet.py:568-590) now redirects a RETRIEVED/DERIVED item from H to G when its occurrence path is a code/
      test surface, applied ONLY on the section == "H" fallback branch, so A/D.1/D.2/D.3/E/F placements are
      provably unaffected (the branch is unreachable from any of those return paths in place_item). D.1/D.2/D.3/E/F
      placement logic itself (place_item, d1_eligible, NON_LADDER_*_SECTION) is untouched -- verified by grep and
      by the six named ARCHITECTURE.md section 5.3 invariant tests passing unmodified (check1).
  - id: C5-admissibility-bug-found-and-fixed-during-real-view-verification
    text: >
      The FIRST real-view compile (before this fix) surfaced a genuine admissibility bug: both the seed-pass
      redirect (pre-existing code, `target = "G" if cls_section == "H" else cls_section`, never touched by this
      repair's first draft) and my new query-loop redirect would move a NON-LADDER class (UNCLASSIFIED, whose
      ARCHITECTURE.md section 5.1 allowed_sections is fixed to H only) into G, which validate.py's independent
      verify_placement correctly refused ("class 'UNCLASSIFIED' not allowed in G"). Fixed by a new helper,
      g_admissible(cls) (packet.py:197-205): true only for a LADDER class (ClassSpec.allowed_sections == () means
      "any admissible section"; a non-ladder class's allowed_sections never names G). Both redirect sites
      (packet.py:559, packet.py:580-584) now gate on cls_section == "H" and g_admissible(...) together. This is
      the one place this repair touches PRE-EXISTING seed-pass code (previously
      `target = "G" if cls_section == "H" else cls_section"; the bug could never manifest before this repair,
      because before it G never received any code-route hit at all for a record seed (defect 1) -- no test
      asserted the old, latent-buggy behaviour). Re-verified clean on a second full real-view compile (packet
      verify: zero problems, both runs -- check3).
  - id: C6-fixture-test-proves-the-five-required-scenarios
    text: >
      tests/compile/test_compile_code_route_seeds.py (new, 3 tests, self-contained fixture repo, never Review-8/
