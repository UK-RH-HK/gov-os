open_issues:
  - id: OI-1-real-view-compile-is-slow
    text: >
      Compiling the real demonstration task with real routes takes about 8 minutes per run (up from effectively
      instantaneous when G was empty), because the seed pass now proposes ~20000 candidate G items (43+ resolved
      symbols per seed x callers/callees/TESTS/READS_KEY expansion x 4 seeds, mostly discarded by budget
      enforcement afterward -- check3's own drop list). A first draft resolved each derived symbol name a SECOND
      time via a fresh govbridge.code.symbols.definitions()/callers() call per name (each re-walking the whole
      .rs tree via ensure_indexed); this was fixed for the CITATION-SCANNING half (codeseeds.py's
      _symbol_name_index builds one whole-commit (name, qualified_name) index per seed instead of one
      ensure_indexed call per token -- cut cited_code_units from several seconds to ~0.35s per seed, confirmed by
      direct timing). The remaining cost is in real_routes.py's code_route, which still calls
      codesymbols.definitions()/callers() once per derived NAME (by design -- this is the existing, pre-repair
      code path, now simply given many more names). A further optimisation (batch-resolving every seed's names in
      one pass, reusing codeseeds.py's own whole-commit index instead of re-deriving it inside real_routes.py)
      is possible but out of this bounded repair's scope: correctness (five acceptance checks, all green,
      byte-identical across two independent runs) was prioritised over compile latency, and nothing in
      BR-HO-0015 or ARCHITECTURE.md sets a time budget for compilation itself (only for the PACKET's own byte
      budget, which is enforced and respected).
  - id: OI-2-local-heading-citations-can-be-unreachable-in-indented-corpus-content
    text: >
      For the real demonstration task's three record-local seeds (P2-AR-0097#F1/#F2/#F3), record_span's
      LOCAL-heading lookup finds nothing: EVIDENCE/review-8/P2-AR-0097-return.verbatim.md's actual committed text
      has every line indented (it was captured from a subagent hand-back frame, "the harness indents every line of
      the report"), so the record's "### F2" headings never start at column 0 and
      govbridge.authority.records.extract_definitions_markdown's DR-MD-HEADING-LOCAL regex (anchored `^#{1,6}`)
      never matches them. This is honest MISSING (cited_code_units returns ((), ()) for those three local-id
      seeds, never a guess or a crash) -- G is still populated for the real task because the FOURTH seed,
      P2-AR-0097 (the bare, non-local id), resolves via DR-FILE-STEM to the WHOLE file and its citation scan covers
      the same F1/F2/F3 body text anyway (43 symbols found from that one seed alone, verified directly). This is a
      pre-existing content/indentation property of that specific committed file, not a defect in this repair's
      logic, and EVIDENCE/review-8/** is explicitly out of scope to edit or repair (per this run's brief:
      "Do not repair, pre-judge or classify Review-8 findings F1-F6"). Flagged for whoever owns that file's
      provenance, not fixed here.
  - id: OI-3-code-route-retrieval-exclusions-not-applied-to-seed-derived-names
    text: >
      task_spec['retrieval_exclusions'] is applied to the QUERY-fusion loop's route calls (unchanged,
      packet.py:564) but, as in the code BEFORE this repair, is NOT passed to the seed loop's
      c.routes.run("code", seeds=...) call (packet.py:553-554 -- the original code
      `for hit in c.routes.run("code", seeds=[seed])` never passed exclude either). This repair does not change
      that pre-existing asymmetry; noted here in case a future node wants seed-derived G items to honour
      retrieval_exclusions too.
