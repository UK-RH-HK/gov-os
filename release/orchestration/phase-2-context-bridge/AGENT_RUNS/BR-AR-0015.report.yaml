claims:
  # --- first pass: G was empty; these defects are unchanged by the reopening -----------------------------------
  - id: C1-record-seed-symbols-derived-and-resolved-at-product-ref
    text: >
      govbridge/compile/codeseeds.py derives seed symbols/occurrences from a record seed's own citation text --
      path:N/path:N-M (via govbridge.graph.derive.cites_edges_in_text, called with citing_commit=PRODUCT commit),
      a path-qualified symbol, or a bare backticked symbol -- all resolved at the canonical PRODUCT ref using only
      govbridge.code.symbols's public entry points plus a precomputed whole-commit symbol index. Every resolution
      is labelled (EXACT_PATH/HEURISTIC_SUFFIX/EXACT_QUALIFIED/HEURISTIC_NAME/HEURISTIC_AMBIGUOUS).
  - id: C2-seed-expansion-callers-callees-tests-reads-key
    text: >
      govbridge/route/real_routes.py's code_route expands callers, callees, TESTS edges and READS_KEY consumers
      via the shaped code connection why()/impact() already use, when the code route is called with explicit
      seeds (record-derived T1 symbols).
  - id: C3-packet-py-wires-derivation-into-the-seed-pass
    text: >
      govbridge/compile/packet.py's Compiler.code_seeds_for calls codeseeds.cited_code_units per seed and feeds
      the derived names/occurrences into the SAME code route the seed itself uses, so everything flows through
      one RouteHit -> item_from_hit pipeline uniformly.
  - id: C4-placement-code-or-test-surface-to-g-not-h
    text: >
      govbridge/compile/codesurfaces.py's is_code_or_test_surface (config/budgets.yaml's code_test_surfaces list)
      redirects a RETRIEVED/DERIVED item whose occurrence is a code/test surface from H to G, applied only on the
      section == "H" fallback, so A/D.1/D.2/D.3/E/F placements are unaffected.

  # --- reopening defect 1: "the budget is bypassed by rendering" -------------------------------------------------
  - id: C10-budget-measures-real-rendered-bytes
    text: >
      govbridge/compile/budgets.py:_item_bytes (line ~79-87) now measures an item's REAL rendered form -- via
      govbridge.compile.render._render_item_body, the exact function packet.md is built from -- instead of
      len(item.text). Before this fix, G's content fit its 120 KB cap (122,872 bytes) but rendered to 715,438
      bytes of packet.md once the ~300-byte/item metadata line (unit/delivery/route/class/lifecycle, source,
      banner, reason) was included; the WHOLE packet.md was 889,764 bytes, over 1% of the 116.4 MB corpus (would
      need to be <= 1,163,649 bytes) and over the synthesis profile's 360 KB total. BudgetProfile gained
      section_header_bytes (config/budgets.yaml's new top-level key, 4096, defaulted to 0 so a pre-reopening
      direct BudgetProfile(...) construction -- e.g. test_budget_pressure, one of the six named invariant tests --
      keeps working unmodified) -- the fixed per-SECTION allowance (title/queries-log/drop-footer/read-token
      lines, never an item) a compiled section's rendered bytes are checked against, alongside its own
      section_caps_bytes content budget. Verified empirically (check 7): the real demonstration packet.md is now
      274,572 bytes (268 KB, well under both bounds) and manifest.json is 417,036 bytes (407 KB, under both the
      1 MB target and the 5 MB commit limit; was 6,149,721 bytes / 5.9 MB).

  # --- reopening defect 2: "the priority is wrong" -- G's deterministic tier order -------------------------------
  - id: C11-g-tier-order-t1-t2-t3-t4
    text: >
      RouteHit (govbridge/route/router.py) and PacketItem (govbridge/compile/packet.py) each gained two fields,
      tier ("T1".."T4", None outside G) and resolution (the label for how THIS item's own identity was matched,
      never inferred from route/rank/text). sort_key (packet.py, line ~141-163) inserts g_tier_rank (T1 < T2 < T3
      < T4, via the new _G_TIER_ORDER tuple) and exact_rank (EXACT_*/DIRECT_SEED before HEURISTIC_* before
      unlabelled) as two new tie-breakers, positioned AFTER class rank/lifecycle/delivery-tier and BEFORE fused
      score -- both are a single shared constant across every non-G item, so no B/C/D/E/F/H item's relative order
      changes; they only ever refine G's own internal order, which the architecture's rule 5 never spoke to before
      G existed as a tiered section. real_routes.py's code_route (line ~192-337) assigns T1 to a definition/
      occurrence hit genuinely derived from a seed record's own citation (delivery PINNED -- "T1 is pinned inside
      G", never displaced by budget until made by-reference); T2 to that T1 symbol's direct callers/callees/TESTS/
      READS_KEY consumers (delivery RETRIEVED); T3 to any code/test hit from lexical/semantic/code QUERY
      retrieval (packet.py's query loop tags a redirected lexical/semantic hit T3 explicitly, line ~636-641); T4
      is reserved (defined, currently unreached -- no pipeline stage does a second level of expansion). Fan-out
      itself is bounded per symbol: config/budgets.yaml's new per-profile g_fanout (max_callers/max_callees/
      max_tests/max_reads_key_values/max_reads_key_consumers), threaded through Compiler.fanout ->
      routes.run("code", ..., fanout=c.fanout) (packet.py line ~589), applied in real_routes.py's
      _expand_symbol/code_route BEFORE any RouteHit is built, over lists sorted into a stable order first (B3's
      own SQL carries no ORDER BY). This is what cut the real-view compile from ~8 minutes to ~1.5 minutes per run
      (check 7) -- the pipeline no longer proposes ~20,000 candidates only to discard nearly all of them
      afterward.
  - id: C12-enforce-section-g-t1-pinned-t2-dropped-first
    text: >
      govbridge/compile/budgets.py:enforce_section_g (new, line ~158-198) is G's own tiered enforcement: T1 items
      (delivery PINNED) are never dropped -- if T1's own rendered bytes exceed G's cap, oversized T1 items become
      by-reference (govbridge.compile.budgets._as_reference, the SAME mechanism section A uses) and a
      G_T1_OVER_BUDGET notice is raised (apply_budgets now returns a 4th value, notices, appended to the packet's
      J section). T2/T3/T4 (droppable RETRIEVED content) are filled into whatever budget remains in the tier order
      sort_key already establishes, so expansion/retrieval noise is dropped before any T1 anchor ever would be.
      Proven by the new fixture (check 6): a seed citing 3 anchors inside a 24-candidate fan-out graph, under a
      2 KB G cap -- all 3 T1 anchors WITH their enclosing definitions (6 items) survive; the dropped-item count
      for tier T2 is > 0; rendered G bytes stay within cap + the header allowance.

  # --- reopening defect 3: "resolving a cited line" ---------------------------------------------------------------
  - id: C13-citation-yields-occurrence-and-enclosing-definition-both
    text: >
      govbridge/compile/codeseeds.py's cited_code_units (line ~202-259) now ALWAYS emits the cited line's own
      occurrence for a path:line citation, and SEPARATELY (never either/or) the enclosing definition when one is
      found -- a CALLS/TESTS/READS_KEY edge that happens to land on the same line (T2 expansion) is never treated
      as the citation's own resolution. Before this fix, a symbol-less occurrence and a found-symbol definition
      were mutually exclusive, and (compounded by defect 2's lack of tiering) runtime/src/init.rs:146 survived
      budget dropping only as "CALLS:runtime/src/init.rs:146:Materiality::push" -- a caller-expansion artifact
      from an unrelated symbol's own T2 expansion, never native_layout_rules's own citation. Check 7's citation
      cross-check (govbridge.compile.codeseeds.cited_code_units run directly, the SAME function the compiler
      itself calls, cross-referenced against the compiled G section) now shows ALL 55 computed citations --
      including the exact anchors this reopening named, runtime/src/tools.rs:1817 and
      runtime/src/policy_precedence.rs:911/:940/:786 -- landing in G as T1, each with its own enclosing
      definition (native_layout_rules, installation_authority, partition_floor_rules_against_kernel,
      evaluate_path_rules_overlay respectively) present alongside the cited line itself.

  # --- reopening defect 4: "drop records bloat the manifest" -----------------------------------------------------
  - id: C14-compact-drop-records-per-section-and-tier
    text: >
      govbridge/compile/budgets.py:compact_drops (new, line ~268-300) groups G's raw per-item drop dicts by
      (section, tier) and replaces each group with a compact summary -- count, the sha256 of its SORTED dropped
      unit ids (newline-joined), and the first 50 of those same sorted ids -- never the full per-item list.
      Truncation stays fully recorded (every drop is counted and hashed), never silent; only the manifest's own
      representation of a large drop list is bounded. compact_sections defaults to ("G",) ONLY: every other
      section keeps its pre-reopening raw per-item drop list unchanged, because test_budget_pressure (one of the
      six named ARCHITECTURE.md section 5.3 invariant tests, outside this repair's mutation scope) asserts that
      exact raw shape (item_id/unit/reason/score/bytes) for section H's own drops -- discovered by re-running the
      existing suite after an initial universal-compaction draft broke it, then narrowing compact_drops to G
      alone. govbridge/compile/render.py's _drop_footer (updated) aggregates either shape (a compact group's own
      "count", or one implicit count per raw item) into the same one-line summary. Result: G's manifest entry
      dropped from 4.66 MB (3.27 MB of which was drop records) to a few KB; the whole manifest.json from 6.1 MB to
      417 KB.

  # --- a real bug this reopening's OWN re-verification found (not asked for, found and fixed) ----------------------
  - id: C15-pinned-non-ladder-item-outside-g-downgraded
    text: >
      Re-verifying against the real demonstration task (after fixing defects 1-4) surfaced a genuine new bug: a
      T1 (PINNED) citation whose class is NON-LADDER (e.g. UNCLASSIFIED -- a cited path the registry's class_rules
      do not cover) cannot reach G (g_admissible correctly refuses it, since UNCLASSIFIED's allowed_sections is
      fixed to H-only), so it lands in H -- but STILL carried delivery=PINNED, which (a) would have wrongly
      exempted it from H's own budget (enforce_section treats any PINNED item as never-dropped, a rule meant only
      for G's T1 or the resolver's own mandatory/pinned items), and (b) failed validate.py's verify_banners: a
      PINNED non-ladder row must carry its CLASS's mandatory banner ("AUTHORITY UNKNOWN" for UNCLASSIFIED), but
      item_from_hit's banner is lifecycle-only, so it showed the wrong banner. Fixed at the one place this
      matters -- packet.py's seed loop (line ~590-604): when a citation-tiered hit's placement target is NOT G,
      its delivery is downgraded to RETRIEVED and its tier cleared, since pinning only ever means anything inside
      G. Found by re-running `packet verify` against the real compile (it FAILED with exactly this one problem);
      fixed; re-verified clean (zero problems) on both real-view runs (check 7) and the D-0006 control (check 8).
  - id: C16-whole-tree-coexistence-after-reopening
    text: >
      `pytest tests -q` (plain collection) passes 329/329 (328 pre-reopening + 1 new: the tiny-G-budget/large-
      fan-out fixture test), zero modifications to any existing test file. The six named ARCHITECTURE.md section
      5.3 invariant tests, the import-boundary test and the class-table test all pass unmodified. validate.py is
      untouched (zero diff, confirmed by `git diff <base>..HEAD -- govbridge/compile/validate.py` across both
      passes).
