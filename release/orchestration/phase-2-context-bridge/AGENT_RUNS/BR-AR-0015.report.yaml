      labelled HEURISTIC_NAME), and probes/CX-PROBE-0001.md:1 (a non-code path -- surfaces as an occurrence-level
      G item, no special-casing). Section G is proven to contain: the enclosing symbol (labelled), a caller
      (caller_of_target), a TESTS edge target (test_target_fn), and the cited evidence probe.
      test_lexical_code_hit_lands_in_g_not_h_and_noncode_hit_stays_in_h proves the SAME code file, reached via
      lexical retrieval (not the code route), lands in G not H, while an unrelated non-code record stays in H.
      test_hand_moved_g_item_fails_packet_verify proves both invariants (checkpoint entry 5) directly against this
      fixture: hand-moving a G item into A, and a RETRIEVED G item into D.1, each fails packet verify.
