open_issues:
  - id: OI-1-real-view-compile-still-takes-about-90-seconds
    text: >
      Down from ~8 minutes (this reopening's own defect-2 fix), a real-view compile of the full demonstration
      task still takes ~1.5 minutes per run -- most of it real_routes.py's per-NAME codesymbols.definitions()/
      callers() calls (43+ resolved symbols x 4 seeds), each of which internally re-walks the .rs tree
      (ensure_indexed) once. codeseeds.py's own citation-scanning cost was already cut to ~0.35 s/seed by
      _symbol_name_index (a whole-commit index built once per seed instead of once per token); the remaining
      per-name resolution in real_routes.py could be similarly batched, but that is a further optimisation beyond
      what this reopening's four named defects asked for, and the acceptance checks (byte-identical, zero
      packet-verify problems, all size bounds met) are satisfied at the current speed.
  - id: OI-2-local-heading-citations-still-unreachable-in-indented-corpus-content
    text: >
      Unchanged from the first pass: P2-AR-0097#F1/#F2/#F3's local-heading citations are unreachable because that
      specific committed file (EVIDENCE/review-8/P2-AR-0097-return.verbatim.md) has every line indented (captured
      from a subagent hand-back frame), so its "### F2"-shaped headings never start at column 0 and
      DR-MD-HEADING-LOCAL's anchored regex never matches. Honest MISSING (cited_code_units returns ((), ()) for
      those three seeds); G is still fully populated for the real task because the fourth seed, the bare
      P2-AR-0097 id, resolves via DR-FILE-STEM to the WHOLE file and its citation scan covers the same F1/F2/F3
      body text anyway (all 55 citations, verified in check 7). A pre-existing corpus/content property, not a
      defect in this repair's logic; EVIDENCE/review-8/** stays out of scope to edit or repair.
  - id: OI-3-t4-tier-defined-but-unreached
    text: >
      T4 ("any wider expansion") is defined in _G_TIER_ORDER and sort_key but no current pipeline stage produces
      it -- G's only sources are T1 (seed-record citations), T2 (their direct callers/callees/TESTS/READS_KEY) and
      T3 (query retrieval). Reserved for a future second-level expansion (e.g. callers-of-callers), out of this
      reopening's scope.
  - id: OI-4-seed-code-route-retrieval-exclusions-still-not-applied
    text: >
      Unchanged from the first pass and pre-existing before it: task_spec['retrieval_exclusions'] is applied to
      the query-fusion loop's route calls but not to the seed loop's c.routes.run("code", seeds=...) call.
