  # Acceptance check 2: $PY -m govbridge.semantic.vectors determinism --sample 50, run twice in separate
  # processes, and once with --threads 4. Run against this run's own real-corpus store (store-BR-AR-0006), so
  # the sample is 50 real chunks, not a synthetic fixture. Four separate-process invocations total: two at
  # --threads 4 (explicit and default-4), two at --threads 16 -- all four give the identical vectors digest
  # (c2ecf1643b83bce0846c3af0dc4ce45bc0d6db83c99be38d196831a99f6d7be7), and batch1_eq_batch32 is true in every one.
  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 $PY -m govbridge.semantic.vectors determinism --sample 50 --threads 4"
    exit_code: 0
    output_path: release/orchestration/phase-2-context-bridge/AGENT_RUNS/BR-AR-0006.check2a-determinism-threads4-run1.out
    output_sha256: 66ceb395556358d54c29f321695b3cf64aa9b430af27a1ef8316ba9fe9de68de
  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 $PY -m govbridge.semantic.vectors determinism --sample 50"
