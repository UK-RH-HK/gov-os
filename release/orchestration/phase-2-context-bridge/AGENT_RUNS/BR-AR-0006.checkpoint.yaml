  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 $PY -m govbridge.semantic.search 'how is a checkpoint made mandatory for a worker' --json"
