  # Acceptance check 3: $PY -m govbridge.core.freshness rebuild --layer semantic. Run as a combined
  # `rebuild --from-clean` (both "core" and "semantic" registered, via the govbridge.semantic import-first
  # workaround open_issues OI-1 explains -- a bare `--layer semantic` alone would have nothing to embed, since
  # nothing else populates chunk/blob data in the same pass, and a plain `--layer semantic` re-invocation after a
  # separate core-only build hits freshness's NOOP short-circuit instead of running the semantic builder at all).
  # This is the ONE full real-corpus semantic rebuild this run performs (~36 minutes CPU), run once, at the end,
  # in the background with a bounded shell-level timeout (3600s), per the isolation rules.
  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 timeout 3600 $PY -c \"import govbridge.semantic, govbridge.core.freshness as f, sys; sys.exit(f.main(sys.argv[1:]))\" rebuild --from-clean --timings"
    exit_code: 0
    output_path: release/orchestration/phase-2-context-bridge/AGENT_RUNS/BR-AR-0006.check3-freshness-rebuild-semantic.out
    output_sha256: f5af0954a1e117dace05033f3598554746435f4948ea267a5c52d47e51ee1a86
  # Supplementary: the persisted manifest's layers.vector block (status BUILT, rows 44191, digest, and the
  # semantic manifest block -- see open_issues OI-2 for why it is here rather than at pins.semantic).
  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 $PY -c \"import json; m=json.load(open('$HOME/.cache/gov-bridge/store-BR-AR-0006/manifest.json')); print(json.dumps(m['manifest']['layers']['vector'], indent=1, sort_keys=True))\""
    exit_code: 0
    output_path: release/orchestration/phase-2-context-bridge/AGENT_RUNS/BR-AR-0006.check3a-manifest-vector-layer.out
    output_sha256: 6039980903f90e42d2495f9098e9dbf6269b1e4e539be4d06b0edf16e7d4e9cf
  # Supplementary: "no chunk of an L-MACHINE-OUTPUT kind embedded" and "no history-only-blob chunk embedded",
  # verified directly against the real, full corpus store (not just the pytest fixture).
  - cmd: "cd $D && PYTHONPATH=$D GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0006 $PY -c \"import sqlite3, json; conn=sqlite3.connect('$HOME/.cache/gov-bridge/store-BR-AR-0006/store.db'); n=conn.execute('SELECT COUNT(*) FROM chunk c JOIN blob b ON b.blob_id=c.blob_id WHERE b.corpus_rule=\\\"L-MACHINE-OUTPUT\\\" AND c.chunk_id IN (SELECT chunk_id FROM vector)').fetchone()[0]; total=conn.execute('SELECT COUNT(*) FROM chunk c JOIN blob b ON b.blob_id=c.blob_id WHERE b.corpus_rule=\\\"L-MACHINE-OUTPUT\\\"').fetchone()[0]; n2=conn.execute('SELECT COUNT(*) FROM chunk c WHERE c.blob_id IN (SELECT DISTINCT blob_id FROM occurrence WHERE ref_name LIKE \\\"refs/heads/phase2/%\\\" AND blob_id NOT IN (SELECT blob_id FROM occurrence WHERE ref_name NOT LIKE \\\"refs/heads/phase2/%\\\")) AND c.chunk_id IN (SELECT chunk_id FROM vector)').fetchone()[0]; vcount=conn.execute('SELECT COUNT(*) FROM vector').fetchone()[0]; print(json.dumps({'l_machine_output_chunks_embedded_must_be_0': n, 'l_machine_output_chunks_total_in_corpus': total, 'history_only_chunks_embedded_must_be_0': n2, 'total_vector_rows': vcount}, indent=1, sort_keys=True))\""
    exit_code: 0
    output_path: release/orchestration/phase-2-context-bridge/AGENT_RUNS/BR-AR-0006.check3b-no-machine-output-no-history-verify.out
    output_sha256: 6ced1ffaaa59f218d41902c7c8a0d95cfafb73636ea26e67e5f6a44541ca4b00

