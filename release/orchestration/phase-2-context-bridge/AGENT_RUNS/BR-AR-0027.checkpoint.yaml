findings:
- >-
  govbridge/code/adapters/rust_treesitter.py's `_walk` (out of this node's mutation scope) only ever qualifies a
  function name with its ENCLOSING `impl` block's type (`qual = f"{impl}::{name}" if (impl and t ==
  "function_item") else name`); a `mod { }` block's own name is never tracked into a nested fn's qualified_name at
  all -- confirmed empirically (tests/answers/test_cite.py's own two-`mod`-block fixture, and independently on the
  real product: `init::native_layout_rules` needed the trailing-segment fallback, never matching directly). This
  is exactly what R1-RA's brief predicted ("the code layer stores free and mod-nested Rust fns WITHOUT their
  module path") and is why trailing-segment resolution exists; it is not something this node's own mutation scope
  could or should fix in the adapter itself.
- >-
  `govbridge.core.exact.path_resolve`'s own ambiguity rule (`len(matches) != 1` -> `ambiguous: True`) treats ZERO
  matches the same as MULTIPLE matches. This node's `_resolve_doc_anchor` distinguishes them itself (empty
  candidates -> NOT_FOUND, non-empty -> AMBIGUOUS) rather than propagating the upstream function's own conflation,
  so `cite`'s own AMBIGUOUS/NOT_FOUND distinction stays honest for callers, without needing any change to
  `path_resolve` itself (out of this node's mutation scope; also used, unmodified, by every other query command).
- >-
  See report.yaml's own open_issues for `find_definition`'s single-best-candidate-only behaviour (no id-grammar
  AMBIGUOUS today) and NAMED_NOT_CITED/CROSS_ANSWER_REFERENCE's inherent, generic-heuristic limits.
failed_approaches:
- >-
  Considered scanning an answer's ENTIRE flattened text (all claim contexts pooled together) for NAMED_NOT_CITED,
  checking each extracted identifier against the answer's own TOP-LEVEL `citations` only. Rejected: the deliverable
  text is "an identifier in a claim... has no citation" -- a per-stage/per-evidence-entry claim in a chain or
  both-ways answer has its OWN `citations` list in the schema (schemas/answers.yaml: `stages: list of {stage,
  claim, citations, is_enforcement_point}`), and pooling would let a stage's own citation silently "cover" an
  identifier named in a DIFFERENT stage's claim -- exactly the kind of narrowing R1-T2 forbids. Implemented
  per-claim-context scoping instead (govbridge/answers/lint.py:_claim_contexts).
- >-
  Considered NOT distinguishing "AMBIGUOUS zero candidates" (a genuinely unresolvable doc path) from "AMBIGUOUS
  many candidates" in `_resolve_doc_anchor`, simply forwarding `path_resolve`'s own `ambiguous` flag verbatim.
  Rejected once real-view testing on "RA_NOPE_DOES_NOT_EXIST.md" would have reported AMBIGUOUS with an EMPTY
  candidate list -- indistinguishable from a real ambiguity and a violation of the deliverable's own "AMBIGUOUS
  with every candidate" (there would be none to list). Fixed as described in this checkpoint's own `findings`.
- >-
  Attempted the CROSS_ANSWER_REFERENCE phrase check with a plain `\b...answer\b` boundary (no lookahead). Passed
  every fixture test (fixtures never happened to contain a compound word), but FAILED on the real view (C-8 in
  report.yaml) -- "answer-side" matched because `\b` is satisfied at a hyphen. Root-caused and fixed with a
  `(?!-)` negative lookahead, with a new regression test reproducing the exact real-view phrase, and re-verified
  clean on the same real-view input.
unresolved: []
decisions:
- >-
  D-R1-RA-1 (within authority): added `--repo` to `cmd_gather` (govbridge/cli.py) -- the only query command in
  this file that had no `--repo` flag at all, unlike search/state/exact/packet verify/receipt check. Necessary for
  this node's OWN new tests (tests/answers/test_gather_wiring.py) to exercise `govbridge gather` end-to-end against
  a fixture repo hermetically, per R1-T1's own "pass --repo/repo= explicitly; do not chdir" rule, since
  `build_real_routes`'s bare `repo=None` resolves via `gitobj.repo_root()`, cwd-based. Minimal, additive, backward
  compatible (omitting the flag keeps the pre-existing cwd-based default) -- the exact same class of gap R1-RS's
  own D-R1-RS-4 (AGENT_RUNS/BR-AR-0025.checkpoint.yaml) closed for bootstrap/packet verify/receipt check/state get.
- >-
  DOC_LEVEL_CITATION's "suggested anchor" is chosen by simple claim-text/section-title WORD OVERLAP (deterministic
  tie-break: first, in document order). This is a disclosed HEURISTIC, not a semantic match -- REPAIR_PLAN.md
  section 7 only requires "the suggested section anchor" (singular, advisory), not a proof of relevance. Recorded
  here as a decision within authority rather than escalated, since the deliverable text does not specify a
  matching algorithm and a generic, cheap, explainable heuristic (word overlap) is proportionate for an advisory
  lint tool that a human or agent will still read before acting on.
- >-
  NAMED_NOT_CITED/CROSS_ANSWER_REFERENCE's identifier/phrase extraction uses fixed, generic regexes (snake_case,
  `mod::fn`, the id-grammar token shape already defined in govbridge.authority.records.ID_TOKEN_RE, and a small
  set of English outward-pointer phrases) rather than an NLP/semantic approach. Within authority: REPAIR_PLAN.md
  section 7 names the CAPABILITY ("identifiers named... resolve in the index"; "a claim that points to 'another
  answer'"), not an implementation technique, and a semantic approach would need a model call this tool (a cheap,
  deterministic CLI aid) should not depend on.
- >-
  No existing test file was modified. Every change is additive: new files under govbridge/answers/** and
  tests/answers/**, plus the described, minimal govbridge/cli.py additions (two dispatch lines; --no-followup and
  --repo on cmd_gather).
lessons:
- >-
  When a node's own deliverable says "resolve identifier kind X the way the corpus actually stores it" (here: "the
  code layer stores free and mod-nested Rust fns WITHOUT their module path"), read the adapter/parser's OWN source
  (govbridge/code/adapters/rust_treesitter.py's `_walk`) before designing the resolution algorithm, rather than
  assuming the obvious "just look up the qualified name" approach -- the brief's own wording was a precise,
  verifiable claim about the code, not a hint to be interpreted loosely, and reading `_walk` directly turned "how
  would trailing-segment resolution even trigger" into a five-line, confidently-correct dispatch.
- >-
  Real-view acceptance (CONTROL-A, per BR-HO-R1-TEMPLATE-repair-builder.md rule 2) is not redundant with a
  thorough fixture suite: it found a genuine defect (the CROSS_ANSWER_REFERENCE compound-word false positive,
  C-8) that 36 passing fixture tests, all deliberately covering the documented finding shapes, never exercised --
  because no fixture happened to contain a hyphenated word starting with a phrase-trigger token. Building the
  real-view synthetic input to genuinely EXERCISE every finding kind against real prose (not just check that the
  command runs) is what surfaced it; running `cite`/`answers lint` against the real corpus only to confirm "it
  doesn't crash" would have missed this.
- >-
  A full `index rebuild --from-clean` of the real corpus took 4,263.6 seconds this run (semantic embedding
  dominated: 3,503.7s for 43,687 chunks) -- roughly 4.8x an earlier recorded measurement (885.8s,
  AGENT_RUNS/BR-AR-0019.check2-freshness-determinism.out) from a different point in this domain's history, on
  what is presumably a larger corpus by now. A future node needing a from-clean real-view store should budget
  well over an hour, run it in the background, and NOT assume the earlier, smaller number still holds.
next_consumer: >-
