- id: C-16
  text: >-
    CROSS-PROCESS DETERMINISM (a coordinator addendum to the BR-DAG-AMEND-R1-22 pass, mid-task): Python randomises
    ``str`` hashing per PROCESS (``PYTHONHASHSEED``) unless pinned, so an ordering that even indirectly depends on
    iterating a bare ``set``/``frozenset`` of strings -- or a sort whose key can tie without a total tie-break --
    can differ between two real CLI invocations while looking identical within one in-process test run (the
    existing ``--threads`` test cannot see this at all, since every thread shares the same process's hash seed).
    Read every module in this reopening's own scope (``govbridge/gather/{followup,identifiers,merge,versions}.py``)
    line by line for exactly this risk and found NONE: ``identifiers._dedupe_identifiers`` and
    ``merge.MergeAccumulator`` both key by a plain ``dict`` (insertion-order-preserving, never raw set iteration)
    plus an explicit ``_order``/insertion list; ``merge.collapse_occurrences`` and ``versions.reconcile_path`` both
    sort by an explicit, already-deterministic VALUE (a status rank, a ref/path string), never by hash; this node's
    own ``distinct_paths = sorted({...})`` is a sorted set comprehension of distinct strings (safe: sorting removes
    any hash-order dependency); and ``_priority_sort_key`` already ends in a total ``(kind, value)`` lexical
    tie-break, so no two candidates can compare equal and fall back to insertion/hash order. Verified empirically,
    not just by inspection: a new, hermetic, standalone script
    (``tests/fixtures/gather/followup/hash_seed_probe.py``, reusing this file's own ``_ResolvableExactRoutes``
    fixture) is run in TWO SEPARATE SUBPROCESSES with ``PYTHONHASHSEED=0`` and ``PYTHONHASHSEED=1``, and produces
    an IDENTICAL ``merged_sha256`` both times. The SAME check was independently re-run directly against the real
    CONTROL-A store/corpus (CA-WHY, two separate process invocations, seeds 0 and 1) -- see the acceptance-check
    evidence below for both hashes.
- id: C-17
  text: >-
    GIT-READ RETRY AND DISCLOSED DEGRADATION (a second coordinator addendum to the BR-DAG-AMEND-R1-22 pass): this
    node's FIRST pass (C-10) made every direct git call this module makes degrade to an honest MISSING on ANY
    exception, closing a crash risk but opening a NEW determinism gap -- a single TRANSIENT failure (the observed
    shape: a `cat-file`/`ls-tree` call racing another agent's concurrent `git gc`/repack against this domain's own
    shared repository) now silently changed WHICH items a gather found depending on how the race landed, with the
    same identifier count and a different hash (R1-GA3 traced exactly one CONTROL-A compile-twice divergence to
    this). Fixed with a BOUNDED retry (``_retry_transient_git_read``: up to 3 attempts, a short fixed backoff
    between them) wrapping all three direct-git-read call sites (``_safe_ls_tree_path``, ``_safe_ls_tree_paths``,
    ``_safe_read_path``) -- a race that clears within the retry budget now changes NOTHING about the merged result
    (proved against a real, built Git fixture: a monkeypatched ``gitobj.ls_tree_path`` that raises once then
    delegates to the real function produces a ``merged_sha256`` IDENTICAL to a clean run with no failure injected).
    If every attempt still fails, the read degrades to an honest MISSING exactly as before, but that degradation is
    now DISCLOSED: a new, call-scoped list (``degraded_git_reads``, threaded through ``resolve_identifier`` and
    every resolver exactly like the existing ``tree_cache``, never a module-global) records ``{call, commit, path,
    error}`` for every read that exhausted its retry, surfaced in ``telemetry.degraded_git_reads``; the top-level
    ``deterministic`` field is now ``False`` when EITHER the wall-time abort fired (C-15) OR at least one git read
    degraded -- the same "this run's evidence may not match a luckier run against the identical store" disclosure,
    for a different root cause. A degraded ``ls_tree_paths`` result is deliberately NEVER written into
    ``tree_cache``: caching a degraded empty list would make every LATER lookup against the same commit silently
    reuse the failure (and look exactly like a genuinely empty tree) instead of getting its own fresh retry budget.
- id: C-18
  text: >-
    A THIRD coordinator addendum: this node's own pass-2 test,
    test_gather_with_followup_is_byte_identical_across_thread_counts, FAILED ONCE in a full-suite run on the bridge
    tip plus R1-GA3, under system load average ~14 (passed reliably, ~1s each, when run alone). Root cause found
    in govbridge/gather/identifiers.py:_lineage_table_exists -- it memoised its True/False result in a MODULE-LEVEL
    dict keyed by ``id(conn)``. govbridge.gather.followup opens and closes its OWN store connection per
    gather_with_followup call (BR-DAG-AMEND-R1-15); CPython is free to reuse a closed/collected object's memory
    address for a later, UNRELATED connection, and ``sqlite3.Connection`` supports neither ``weakref`` (verified
    empirically: ``weakref.ref()`` on a live connection raises TypeError) nor arbitrary instance attributes
    (verified: assigning one raises AttributeError) -- so there was no sound way to tie a cache entry to the
    connection object's own lifetime. Under heavy allocation/deallocation churn (more likely exactly when system
    load is high), a NEW connection could land on a stale, recycled ``id()`` and silently inherit an UNRELATED,
    long-dead connection's cached result -- in the failing run, one of the test's two same-store calls almost
    certainly inherited a stale ``False`` from an earlier, different test's connection (a hermetic fixture with no
    lineage_edge table), silently skipping lineage-edge-derived identifiers for that ONE call and producing a
    different merged_sha256 than the other call. Fixed by removing the cache entirely: the query it protected
    (``SELECT 1 FROM lineage_edge LIMIT 1``) is trivial and runs once per :func:`extract_all` call, never per hit,
    so the caching was never a measurable performance win, only a correctness hazard. Proved, not just reasoned
    about: the exact failing test was run 20 times in a loop under a SYNTHETIC CPU-burning load (40 busy-loop
    processes on a 20-core machine, started and stopped by this same check, driving load average from 14.37 up to
    39.66 -- meeting and exceeding the originally observed ~14) with ZERO failures; the full domain suite was also
    run twice, in parallel, after the fix, both passing in full.
