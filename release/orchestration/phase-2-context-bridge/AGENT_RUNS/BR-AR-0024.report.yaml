claims:
- id: C-1
  text: >-
    govbridge/gather/identifiers.py extracts every REAL INPUT SHAPES kind (R1-T2 item 4) from a round's merged
    evidence, reusing existing grammars rather than inventing new ones: id-grammar record ids (govbridge.authority.
    records.load_grammar's own mention_patterns, so a heading title or a YAML block/flow-style id is caught the
    same way govbridge.core.exact/govbridge.graph.derive already catch it); symbol-shaped tokens and Rust
    ``mod::fn`` qualified paths (govbridge.route.router._SYMBOL_TOKEN_RE, the same pattern select_routes/
    _extract_symbol_names already use); repository path literals and 2-4-fragment JOINED path literals
    (govbridge.route.router._PATH_TOKEN_RE, govbridge.graph.derive.STRING_LITERAL_RE -- the identical joining
    heuristic depends_on_data_edges uses at index time); 40-hex/short commit hashes (derive.HEX_COMMIT_RE); and
    ``<doc> section N``/``<doc> §N``/``<doc>:<line>`` requirement citations inside ``///``/``//!``/``#`` comments
    (derive.PATH_CITE_RE/SECTION_CITE_RE/_looks_like_comment, the exact grammar cites_requirement_edges_in_text
    uses).
- id: C-2
  text: >-
    identifiers.extract_from_lineage reads R1-RL's persisted lineage_edge table DIRECTLY (a read-only SELECT,
    never a re-derivation) for the three edge kinds no route surfaces: TESTS (CLI dispatch, clap-derive dispatch
    and schema-shaped test-registry rows, at any nesting depth -- the SAME rows govbridge.code.lineage_layer wrote
    at build time), DEPENDS_ON_DATA (literal and joined-path dependencies) and CITES_REQUIREMENT (including the
    document-only HEURISTIC_SECTION_UNRESOLVED label -- never dropped just because the section heading itself did
    not resolve at index time). Every row's own ref_name/commit_id/version_status is carried through in the
    resulting Identifier's ``note`` (this node's brief: "per-row ref, commit and version_status").
- id: C-3
  text: >-
    govbridge/gather/followup.py's gather_with_followup builds triggered rounds on govbridge.gather.engine's OWN,
    UNCHANGED extension point (the identifier_extractor hook R1-GA1 left unwired) WITHOUT forking engine.gather:
    round 0 is exactly one call to engine.gather (parallel facets, paging, the fixed stopping vocabulary, all
    unchanged); every round after that is triggered by an identifier discovered in the PREVIOUS round's own new
    evidence, resolved through resolve_identifier (exact route for record ids/commits/path literals; the code
    route, paged callers/tests/reads_key to EXHAUSTION within a budget via R1-RL's own cursors, for symbols; a
    direct git-content slice, tagged but never authority-classified, for the two lineage-only edge kinds), with a
    visited set (kind, value) so the same identifier is never chased twice. Stop reasons are the SAME closed
    OD-BR-05 vocabulary (govbridge.gather.engine.STOP_REASONS), reused, never a new one invented.
- id: C-4
  text: >-
    REAL INPUT SHAPES item 2 (Rust ``mod::fn``, module-free at the code layer): followup._resolve_symbol_or_rust_
    test_path retries an unresolved ``mod::fn``-shaped identifier by its TRAILING segment, tagging the result
    HEURISTIC_TRAILING_SEGMENT when the bare name resolves to exactly one definition and
    HEURISTIC_TRAILING_SEGMENT_AMBIGUOUS (every candidate returned, never silently collapsed to the first) when it
    does not -- proved on a real Rust fixture with two same-named ``test_widget`` symbols in different modules.
- id: C-5
  text: >-
    govbridge/gather/merge.py's MergeAccumulator deduplicates by the SAME identity govbridge.route.router.
    dedupe_key already uses (blob+line span for a chunk, unit id otherwise -- never a second notion), keeps a
    provenance list per merged item ({route, facet, round, trigger}, one entry per contribution, so the same item
    found via three routes across two calls carries three entries), and collapses a hit's own multi-ref
    occurrences (already computed by the underlying route) to one canonical occurrence plus a compact per-ref
    summary (identical/different/history-only/absent), so a merged item's own serialised dict never carries more
    than one occurrence row. Authority/lifecycle is a pure pass-through (REPAIR_PLAN.md section 2.7: "unchanged, A
    only from the resolver") -- merge.banner_for/allowed_sections_for only DISCLOSE a non-ladder class's already-
    decided banner/section restriction (e.g. EVIDENCE_WITHDRAWN -> sections ("E","F"), never "A"), never assign or
    upgrade a class.
- id: C-6
  text: >-
    govbridge/gather/versions.py fills the ``versions`` facet's real content (REPAIR_PLAN.md section 2.7),
    replacing engine.gather's own always-MISSING synthetic placeholder in gather_with_followup's own returned
    result: per-path blob identity across every ref the view resolves (the store's own occurrence rows /
    gitobj.blob_at, never re-derived), with the canonical ref decided GENERICALLY BY ROLE
    (ResolvedView.partition_for + a role lookup over config/canonical-view.yaml's own refs, exactly like
    real_routes._product_commit's own role-based lookup) -- never by a hardcoded ref NAME. Proved on a real
    three-ref fixture (REAL INPUT SHAPES item 6) where one path differs at every ref and is owned by the
    "product"-role ref specifically.
- id: C-7
  text: >-
    A gather with triggered follow-up rounds runs, unmodified, against a store opened
    store.open_db_readonly (BR-DAG-AMEND-R1-15): every SELECT this node's own modules issue uses that read-only
    connection, and the store file's sha256 is verified byte-identical before and after. This test deliberately
    stays on the lexical/exact path; the code route's own query-time write (code/symbols.py's lazy ensure_indexed)
    and hit classification's ensure_schema call are BR-DAG-AMEND-R1-17's fix, routed to R1-XC in parallel (see
    open_issues) -- not fixed here, per this node's own dispatch notes.
- id: C-8
  text: >-
    All five REAL INPUT SHAPES scenarios (R1-T2 item 4) and the acceptance check's own worked examples are proved
    on ONE real, synthetic, three-ref Git fixture (tests/fixtures/gather/followup/followup_repobuilder.py), through
    the REAL lexical/exact/code routes (govbridge.route.real_routes) and tests/fixtures/gather/test-facets.yaml's
    lexical-only registry (never spawning the embedding subprocess): a record citing an id defined elsewhere; a
    Rust function whose only test lives in a different top-level directory (Python is NOT reachable this way --
    see open_issues); a joined path literal; a comment requirement citation resolved to its numbered SECTION, not
    the whole document; a 40-hex and a short commit hash; and the Rust mod::fn trailing-segment case (both
    unambiguous and ambiguous). Every one is reached within 3 follow-up rounds (all in fact reach it in 1), with
    its trigger recorded.
- id: C-9
  text: >-
    A real-view measurement on this domain's own CONTROL-A subject (CA-WHY, "purpose" facet, 31 base-round items)
    found 81 distinct identifier candidates -- id-grammar-shaped tokens, path/joined-path literals, symbols and
    commit hashes are all common shapes in ordinary English/code prose. Chasing every one, unbounded, made a single
    follow-up round impractically slow against the real, multi-thousand-file, 95-history-ref corpus (independently
    timed: a first attempt exceeded 280s and was killed). Fixed generically, never by narrowing WHICH kinds are
    chased: (a) govbridge/gather/followup.py's own git-tree lookups for path/joined-path/requirement-citation
    resolution now memoise one ls-tree per (commit, repo) per gather call (a plain in-process dict, thrown away
    with the call -- never a persisted cache, BR-DAG-AMEND-R1-15 is unaffected); (b) a new, disclosed per-round
    identifier budget (DEFAULT_MAX_IDENTIFIERS_PER_ROUND=20) stops a round that exceeds it with
    BUDGET_REACHED_WITH_UNRESOLVED, naming every deferred identifier in telemetry.unresolved_identifiers -- never a
    silent drop (OD-BR-05 section 5). With both fixes, this node's own CONTROL-A acceptance-check run (C-8's
    sibling, acceptance check 2) completes in ~2 minutes.
- id: C-10
  text: >-
    govbridge/gather/followup.py's own direct git calls (for the two lineage-only edge kinds' content, and for
    path-literal/requirement-citation resolution) now degrade to an honest MISSING on ANY exception, not just a
    resolved-to-None path -- found directly against the real, multi-agent-shared repository this domain lives in:
    a `git cat-file blob <oid>` failed ("bad file") moments after `blob_at` resolved that exact oid, almost
    certainly a transient `git gc`/repack race with another agent's own concurrent work in the SAME object
    database. Every one of this node's own git call sites is wrapped (`_safe_ls_tree_path`/`_safe_ls_tree_paths`/
    `_safe_read_path`, and `_hit_from_git_slice`'s own try/except), so one unlucky git call degrades that single
    identifier's resolution, never the whole gather.
