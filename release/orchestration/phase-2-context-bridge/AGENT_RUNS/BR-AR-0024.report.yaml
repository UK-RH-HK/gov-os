- id: C-11
  text: >-
    REOPENING FIX (the defect: a round exceeding max_identifiers_per_round deferred
    the rest AND ended follow-up right there, so a real query with 81 round-0 candidates got exactly one hop no
    matter how many rounds/budget were configured). govbridge/gather/followup.py's own _PriorityQueue now carries
    every not-yet-resolved identifier ACROSS rounds: each round merges the round's own newly extracted candidates
    into the queue (summing mention_count into an already-queued entry, never resetting it -- identifiers.
    Identifier gained a mention_count field, identifiers._dedupe_identifiers sums it across duplicates), then
    takes the top max_identifiers_per_round by the stated priority order. Follow-up now stops for exactly one of
    four reasons, checked in this order every round: the queue is empty after merging (NO_UNRESOLVED_IDENTIFIERS);
    max_followup_rounds is reached (MAX_ROUNDS); a round's own resolution added no genuinely new merged item,
    measured against merge.MergeAccumulator's own new item_count() method, never "resolved nothing at all"
    (MARGINAL_GAIN_ONLY_DUPLICATES); or the OVERALL follow-up budget -- max_total_identifiers and/or
    max_wall_seconds, checked at the top of a round, before that round's own batch is taken -- is exhausted with
    the queue still non-empty (BUDGET_REACHED_WITH_UNRESOLVED). The per-round cap itself can now only ever make
    MORE rounds necessary to drain the same queue; it can no longer end follow-up by itself.
