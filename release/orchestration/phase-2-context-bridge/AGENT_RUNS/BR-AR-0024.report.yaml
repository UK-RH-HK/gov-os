role: >-
  REPAIR-1 node R1-GA2 -- gather, adaptive follow-up and merge: identifier extraction and resolution, triggered
  rounds, provenance-preserving deduplication, occurrence collapse, version reconciliation, authority and
  lifecycle filtering (OD-BR-05 sections 3 and 6; REPAIR_PLAN.md sections 2.5/2.7). REOPENED THREE TIMES, the
  second reopening carrying two coordinator addenda plus a self-inflicted fourth fix found while addressing them
  (see item 4 below): (1)
  follow-up budget semantics (a round exceeding max_identifiers_per_round deferred the rest AND ended follow-up, so
  a real query got exactly one hop regardless of configured rounds/budget) -- fixed by a deterministic,
  carry-forward priority queue (C-11/C-12/C-13/C-14); (2) BR-DAG-AMEND-R1-22, content budgets must not depend on
  wall-clock time (R1-GA3's own CONTROL-A compile-twice check caught two compiles differing in exactly the
  overflow set derived from gather's merged results, traced to max_wall_seconds being checked alongside the
  count-based budget) -- fixed by separating wall time into its own, disabled-by-default SAFETY ABORT
  (STOP_WALL_TIME_ABORT, `deterministic: false`), plus a mid-pass addendum requiring determinism ACROSS PROCESSES
  (PYTHONHASHSEED) -- see C-15/C-16; (3) a coordinator addendum to (2): a single transient git-read failure (a
  `cat-file`/`ls-tree` race against this domain's own multi-agent-shared repository) must be RETRIED, bounded,
  before degrading, and a read that still fails after every attempt must be DISCLOSED (never mistaken for genuine
  absence) and also mark the result non-deterministic -- see C-17; (4) a further addendum: this node's own pass-2
  test (byte-identical-across-thread-counts) failed ONCE under heavy system load in a full-suite run -- traced to
  an id(conn)-keyed cache in identifiers.py vulnerable to CPython id-reuse, fixed by removing the cache, and proved
  with 20 stress-loop iterations plus two full-suite runs -- see C-18. This report covers the state after all four.
