open_issues:
  - id: OI-1-real-b2-b3-b4-adapters-not-wired
    text: >
      govbridge.route.router.RouteSet's lexical/semantic/code slots are exercised only through in-test fakes and
      the all-empty FAKE_ROUTES (--fake-routes is required by this branch's own CLI, since B2/B3/B4 are not a B6
      dependency). I1 must write the adapter functions that translate govbridge.lexical.query.RetrievedItem /
      govbridge.semantic.search's dict results / the real code route's rows into RouteHit, and wire them into a
      RouteSet passed to compile_packet -- without changing anything in govbridge/route or govbridge/compile.
  - id: OI-2-c-section-depends-on-a-built-authority-edge-layer
    text: >
      Section C (graph neighbours) reads govbridge.graph.traverse.bfs over the PERSISTED authority_edge table
      (govbridge.authority.layer), which is empty until govbridge.authority.layer.build() has run against a given
      store. On a fresh/empty store this is honestly empty (MISSING), matching the outage discipline, but I1 (or
      whichever node builds the real index) should confirm C is populated on a built store before the demonstration
      run leans on it.
  - id: OI-3-several-real-mandatory-items-classify-unknown-lifecycle
    text: >
      Compiling the REAL demonstration-task.yaml surfaces 10 MANDATORY_ITEM_NOT_IN_A notices in section J,
      including PHASE-2-FROZEN-GATE-CONTRACT, OWNER-LAUNCHER-BR-0001 and state:bridge#contract_v3 -- all
      ladder-admissible classes whose LIFECYCLE classified as UNKNOWN rather than ACTIVE, so they correctly land in
      H (never fabricated into A per "UNKNOWN is never treated as ACTIVE"), but are visibly parked there rather
      than in a more prominent section. This is a B5 lifecycle-classification question over real records (their
      files may lack a recognisable Status/in_effect marker in the vocabulary govbridge.authority.lifecycle
      matches), not a B6 placement defect -- flagging for I1/whoever reviews real-corpus classification coverage.
      Reproduce with `$PY -m govbridge.compile.packet ARCHITECTURE/demonstration-task.yaml --fake-routes --json |
      python3 -c "import json,sys; print(json.load(sys.stdin)['notices'])"`.
  - id: OI-4-bounded-builder-budget-split-has-no-independent-citation
    text: >
      ARCHITECTURE.md section 7.3 cites an exact per-section KB split for the "synthesis" profile only
      ("A no cap, B 16, C 40, D 40, E 24, F 40, G 120, H 40, I 12, J 12") and gives "bounded-builder totals 100 KB"
      with no independent per-section breakdown. config/budgets.yaml's bounded-builder section_caps_kb are scaled
      proportionally (100/360) from synthesis's cited split and documented as such in the file's own comment --
      a reasonable, generic default, not an architecture citation. Worth an owner/architect confirmation if
      bounded-builder's section shape ever needs to differ from a straight scale-down.
  - id: OI-5-d1-references-rather-than-duplicates-mandatory-content
    text: >
      D.1 entries sourced from a MANDATORY item already in A are rendered as a short reference ("[see A: <item_id>
      (<unit_id>)]", by_reference=true) rather than a second full excerpt. ARCHITECTURE.md section 7.2 states this
      economy explicitly only for section B ("if a record is already in A, B references it by item id rather than
      duplicating it"); I applied the same principle to D.1 by analogy, since nothing forbids it and it avoids
      needlessly doubling A's bytes inside the same packet. If a future reviewer wants D.1 to carry the full
      excerpt again (matching a literal reading of "RELEVANT ACTIVE DECISIONS" as a self-contained section), that
      is a one-line change in Compiler.add_to_a's caller (govbridge/compile/packet.py's main resolver loop).
  - id: OI-6-config-sha256-and-build-manifest-sha256-are-partial
    text: >
      The packet manifest's config_sha256 covers the four config files THIS compile actually reads
      (canonical-view, authority-registry, id-grammar, budgets); it does not include corpus-rules.yaml or
      model-pin.yaml, which B6 never reads. build_manifest_sha256 is always null in this branch, since no index
      build (govbridge.core.freshness) is invoked by compile_packet itself -- I1, which wires the real routes, is
      the natural place to thread through the ACTUAL build manifest hash of whatever store the routes read.
