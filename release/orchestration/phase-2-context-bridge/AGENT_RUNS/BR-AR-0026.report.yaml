mutation_scope_respected: true
open_issues:
- >-
  govbridge/cli.py's `govbridge compile --out DIR` does not yet write evidence_notes/supplementary_packets to
  disk -- compile_packet returns them built (result["evidence_notes"], result["supplementary_packets"], keyed by
  query id) but unwritten; wiring needs govbridge/cli.py, owned next by R1-RA per BR-DAG-AMEND-R1-19's own
  cli.py sequence (RX -> GA1 -> RS -> RA). See decisions/next_consumer.
- >-
  BR-DAG-AMEND-R1-11's oversize-section selection uses the default, global facet registry rather than a specific
  task's own requested facet subset (owner-accepted, see decisions) -- a stronger design would record the
  selected ranges in the manifest so validate.py could check a task-specific selection; that touches
  govbridge/compile/validate.py, outside this node's mutation_scope, and is carried as a residual for the
  verifier/R1-INT.
- >-
  Facet quotas are not layered on top of section G's own pre-existing BR-AR-0015 T1-T4 tiered budget (owner-
  accepted, see decisions) -- G keeps exactly its prior behaviour.
- >-
  Per-item facet tags for a BASE-ROUND gather item are a disclosed, defensible SUPERSET (route+scope consistency
  against the query's own requested facets), not a precise single-facet claim -- gather_with_followup's own
  return shape does not itemise which facet produced a base-round hit (confirmed by reading R1-GA2's own
  checkpoint failed_approaches, which tried and reverted calling the engine once per facet inside
  gather_with_followup itself, because it would drop R1-GA1's tested cross-facet-parallel property for every
  caller including the CLI `gather` command). Follow-up-round items ARE tagged precisely, by their own trigger
  identifier kind.
- >-
  govbridge.compile.section_i.instantiated_query_set and this node's own query-instantiation call both use
  govbridge.gather.instantiate.load_query_set, which can raise an uncaught exception (not QueryNotExecutable) if
  a task spec's `queries` field is a STRING path to a genuinely missing file -- not caught into a graceful J
  notice by this node. Not currently exercised by any real caller (every existing task spec passes a list or an
  existing real file); flagged rather than silently left unhandled.
- >-
  `govbridge compile --out DIR` never persists a supplementary packet's own rendered content to disk (only its
  sha256 reaches the main packet's EVIDENCE_OVERFLOW notice) -- this made one real-view determinism divergence
  (see below) un-diffable after the fact. BR-DAG-AMEND-R1-20, routed to R1-RA, closes it.
- >-
  One real-view CONTROL-A compile pair (before this node's section_map fix) diverged in exactly one query's
  (CA-DEPS) supplementary-packet reference hash; the main packet, drop records and facet coverage were all
  identical. Exhaustively investigated (PYTHONHASHSEED cross-check refuted it; 6 of 6 clean re-runs of the
  current code matched); the cause could not be confirmed directly (the differing artifact was never persisted).
  Best explanation: a transient git-read degradation in govbridge/gather/followup.py (its own documented
  behaviour) under confirmed-concurrent repository activity. Routed to R1-GA2 for hardening (bounded retry, then
  explicit deterministic:false); the orchestrator will re-run the double compile once that merges.
