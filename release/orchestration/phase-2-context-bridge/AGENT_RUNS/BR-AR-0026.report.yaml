status: COMPLETED
claims:
- >-
  govbridge.compile.packet.compile_packet's query loop now instantiates every task query
  (govbridge.gather.instantiate, RC-2's "a query with no executable text is a compile error, never a silent skip")
  and compiles sections B-H from govbridge.gather.followup.gather_with_followup results, one call per query, with
  each query's own explicit/auto-detected route selection honoured (router.select_routes) rather than silently
  widened to every facet's own routes.
- >-
  Every gather-sourced PacketItem carries facet_tags/query_ids (new fields), unioned across duplicate placements,
  visible in both the manifest row (item_manifest_row) and the rendered packet text (_render_item_body) -- never
  only internal Python state.
- >-
  Facet quotas: govbridge.compile.budgets.enforce_section_with_quotas reserves each requested facet's own
  min_share of a section's budget before a general, round-robin fill, with a continuation handle on every
  resulting drop record; wired into apply_budgets for every section except A (resolver-only, untouched) and G
  (kept on its own pre-existing BR-AR-0015 T1-T4 tiered budget -- a disclosed, owner-accepted limit, not stacked
  with a second quota system).
- >-
  Content slices (RC-5): Compiler.item_from_hit now fetches a real body slice from Git for a code-route
  symbol/occurrence hit (previously a bare signature or edge-label pointer) and for a semantic hit with no text at
  all (previously 0 bytes) -- via govbridge.compile.overflow.needs_content_slice/read_content_slice -- with a
  larger cap for a facet's own top-ranked items (a per-facet rank counter, not a single global rank over the whole
  merged list). An item already delivered in section A is cited by item id (Compiler.reference_to_a_item), never
  duplicated.
- >-
  Overflow (REPAIR_PLAN.md section 2.8): an item a query's own gather call retrieved but the budget then dropped
  is shaped into an R1-RN hierarchical evidence note (govbridge.compile.overflow.build_overflow_note, grounded
  claims re-verified by govbridge.notes.validate.validate_note) and an R1-RS supplementary packet
  (govbridge.compile.supplementary.build_supplementary_packet, re-verified by
  govbridge.compile.validate.verify_supplementary_packet) per query, returned in compile_packet's own
  evidence_notes/supplementary_packets dict keys and disclosed by an EVIDENCE_OVERFLOW J notice -- nothing
  silently discarded. Writing these to disk under `govbridge compile --out DIR` needs a govbridge/cli.py change,
  routed by the orchestrator to R1-RA (outside this node's mutation_scope).
- >-
  D.2 both-ways evidence (_attach_evidence_both_ways) now runs each of its two fixed templates through
  gather_with_followup (bounded to one follow-up round), honouring the task context's exclusions through the same
  plumbing every other gather call in this module uses, instead of a single-round ad hoc route fuse.
- >-
  BR-DAG-AMEND-R1-11: an oversize mandatory item with no declared selector now additionally delivers, in full, the
  sections the gather facet vocabulary (config/facets.yaml's own facet names and extra_terms, matched against a
  section's own NAME, never its body text) scores as relevant -- govbridge.compile.overflow.
  select_oversize_facet_sections, wired into Compiler._render_oversize_no_selector. Nothing is ever removed from
  A; the MANDATORY_PARTIAL_DELIVERY notice's shape and the exact-tiling verify rule are unchanged (rows move
  between its delivered/undelivered_ranges lists, never dropped). Owner-accepted disclosed limit: selection uses
  the DEFAULT global facet registry, not a specific task's own requested facet subset, because
  govbridge.compile.validate's blind re-derivation (_composition_context_class) supplies no task/query context at
  all when it recomposes an A item's expected body -- a task-specific dependency there would make `packet verify`
  permanently disagree with the real compile. The better design (record the selected ranges in the manifest so
  verify can check a task-specific selection) needs a validate.py change, outside this node's mutation_scope;
  carried as a residual for the verifier per the coordinator's ruling.
- >-
  BR-DAG-AMEND-R1-15 (query paths read-only): a compile against a genuinely (file-level chmod) read-only real
  store never writes to it -- tests/compile/test_facet_quotas.py::
  test_compile_against_a_read_only_store_never_writes_to_it, store file sha256 unchanged before/after.
- >-
  govbridge/gather/** is completely untouched by this node (independently confirmed by `git diff --stat --
  govbridge/gather/`, empty output) -- BR-DAG-AMEND-R1-19's function is consumed, never edited or forked.
- >-
  120/120 tests pass in `pytest tests/compile -q` (0 failures); the FULL domain suite passes with 0 failures
  (665/665, including tests/compile/test_compile_real_view_mandatory_in_a.py, R1-T1's one named exception, which
  did not fail).
