run_id: BR-AR-0026
role: >-
  REPAIR-1 node R1-GA3 -- compile from gather: facet quotas and a facet-aware drop order, content slices, per-item
  query and facet tags, overflow to evidence notes and supplementary packets, D.2 via gather; plus
  BR-DAG-AMEND-R1-11 (oversize-mandatory-item facet-selected sections).
model_observed: claude-sonnet-5
branch: bridge/r1-ga3-0026
