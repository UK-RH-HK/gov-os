findings:
- >-
  REOPENING defect 1's root cause: a scoped facet's out-of-scope filtering happened entirely client-side
  (govbridge.gather.facets.Facet.filter_in_scope), AFTER a route had already paged a corpus-wide, unscoped
  ranking -- so a scoped facet's cursor advanced on every page while its COUNT advanced only on the rare in-scope
  hit, driving it to MAX_ROUNDS or a timeout on a real corpus. Fixed by threading scope_classes/lifecycle_scope as
  a plain keyword argument into every real route (govbridge.route.real_routes), which lexical/semantic push into
  SQL before top-k/LIMIT (govbridge.lexical.query._scope_sql, govbridge.semantic.vectors._scope_sql) and code/
  exact apply as a post-hoc assertion (their own result sets are already small/bounded). Verified end to end: the
  SAME CONTROL-A query (CA-WHY) went from ~65 merged items (post-hoc filtering only, first pass) to 118 merged
  items (SQL push-down, this reopening) on its default facet set, in 2 rounds either way -- the fix did not just
  make it faster, it made the requirement/decisions_* facets actually find their real, in-scope evidence.
- >-
  REOPENING performance finding: the first working version of the SQL push-down (correct, but naive) measured
  4-6 SECONDS PER SCOPED QUERY on the real store, entirely from a correlated EXISTS against the raw ``occurrence``
  table (503,601 rows for only 7,909 distinct (blob_id, path) pairs on this corpus -- the same blob/path pair is
  repeated once per historical ref/commit, up to hundreds of times: one blob had 21,498 occurrence rows). This
  alone made a full CONTROL-A gather on the default facet set exceed a 115s timeout with 0 output. Fixed with two
  query-time-only, idempotent additions to the shared store.db that this node does not otherwise own the schema
  of: an index on record_def(path), and gather_scope_path_cache(blob_id, path), a deduplicated snapshot of
  occurrence built once per process. Measured: the same scoped COUNT query fell from 4.27s to 0.13s; the same
  CONTROL-A query's full default-facet-set gather fell from a >115s timeout to 93s (--threads 4).
- >-
  A real, pre-existing cross-thread sqlite3 bug in govbridge/route/real_routes.py (found in the FIRST pass,
  unchanged by the reopening): build_real_routes()'s classify connection and shaped-code connection were each
  opened ONCE and closed over by every RouteSet call, so the moment two facets run on different threads (exactly
  what OD-BR-05 section 2 and this node's own engine ask for), the second thread's sqlite call raised "SQLite
  objects created in a thread can only be used in that same thread." Fixed with threading.local() per connection
  kind; every single-threaded caller (govbridge search, govbridge.compile.packet, every pre-existing test) is
  unaffected (full domain suite: 507 passed, 0 failed).
- >-
  REPAIR_PLAN.md section 2.6's "FACETS_COVERED: every requested facet has at least one item" is a MINIMAL
  coverage bar, not full exhaustion -- but stopping the FIRST time a facet reaches 1 item makes the final
  evidence set depend directly on --batch-size (a facet's one satisfying page can carry anywhere from 1 to
  batch_size items), which breaks acceptance check 3's own "identical merged evidence set" requirement. The
  resolution built here (FIRST pass, confirmed still correct after the reopening's SQL push-down): each (facet,
  route) stream pages to a FIXED, batch-size-independent target_items (config/facets.yaml's default_target_items,
  distinct from default_batch_size on purpose), requesting only min(batch_size, target - already_have) per call.
  Re-verified on the full default facet set post-reopening: 118 identical items at batch-size 2 (8 rounds) and 16
  (1 round).
- >-
  MARGINAL_GAIN_ONLY_DUPLICATES must be computed from RAW (pre-scope-filter) content identity, never from the
  scope-filtered/globally-deduped contribution -- an early implementation (FIRST pass) stopped a scope-restricted
  facet after just 2 rounds because its out-of-scope pages "added nothing new" to the merged set, even though
  each page was genuinely fresh, unseen raw content a later page could still turn into an in-scope hit. Fixed by
  tracking a raw_seen dedupe-key set across the whole gather; this reasoning became MOOT for the reopening's own
  scoped facets once the SQL push-down meant they rarely see out-of-scope pages at all, but the mechanism (and its
  test, test_marginal_gain_only_duplicates_when_a_route_keeps_returning_the_same_item) stays correct and in place
  for any route (a fake/test double, or code/exact's own post-hoc assertion) that still can.
- >-
  SECOND REOPENING root cause: the FIRST reopening's own fix for defect 1's performance problem
  (gather_scope_path_cache, an index on record_def(path)) was built the SAME way the problem it fixed was found --
  lazily, on first use, inside the query path itself (govbridge.lexical.query._ensure_scope_indexes/
  govbridge.semantic.vectors._ensure_scope_indexes). That is itself a write from a query command, just a
  performance-motivated one rather than a correctness-motivated one -- the coordinator's second reopening named
  three concrete consequences (a frozen demonstration store would be mutated by the demo agent's own queries; a
  read-only-opened store would silently fall back to the slow path instead of erroring; INSERT OR IGNORE never
  prunes a stale (blob,path) pair on a path a blob no longer occupies). Fixed by moving BOTH structures to BUILD
  time, inside the layer builders that already own the tables they extend (govbridge.core.store for occurrence ->
  occurrence_distinct_path, govbridge.authority.layer for record_def -> record_def_by_path), and replacing the
  query-time builder with a read-only existence check that raises a typed StoreNeedsRebuild instead of ever
  building or falling back silently.
- >-
  SECOND REOPENING, coordinator addendum finding: removing govbridge.lexical.query's old
  try/except-around-the-scoped-SELECT (the ALREADY-reopened-away silent fallback) exposed a SEPARATE, real,
  pre-existing bug in govbridge.semantic.vectors.search: its SQL unconditionally joined `vector v JOIN chunk c ON
  c.chunk_id = v.chunk_id`, even for an UNSCOPED call, even though `chunk` is not this module's own table and
  `_scope_sql`'s own fragments (the only thing that ever needed `c.blob_id`/`c.start_line`/`c.end_line`) are
  referenced only when a scope filter is actually requested. This was previously masked by the very silent
  fallback the reopening required removing (a caller testing `vector` in isolation, with no `chunk` table at all,
  silently fell back to the unscoped query on "no such table: chunk" and never noticed the JOIN was wrong for
  every unscoped call too). Fixed by making the JOIN conditional on `scope_sql` being non-empty -- confirmed via
  tests/semantic/test_vectors.py's own two pre-existing tests, which exercise exactly this unscoped, no-`chunk`
  path and both failed before this fix, both pass after.
- >-
  SECOND REOPENING, coordinator addendum finding: a bare `mode=ro` SQLite URI connection is NOT sufficient for a
  WAL-mode database once its DIRECTORY (not just the file) is also read-only -- verified directly with a throwaway
  script: `mode=ro` alone raised "attempt to write a readonly database" on its very first SELECT in that
  configuration (WAL readers need to consult/create a `-shm` file even to read), while `mode=ro&immutable=1` (this
  node's own store.open_db_readonly, actually adopted) read the same file correctly. The REQUIRED test only chmods
  the store FILE (directory left writable, matching the literal wording "read-only at the file level"), a
  configuration under which even a PLAIN, non-immutable connection already reads correctly -- `immutable=1` is
  still the adopted, more defensive choice (SQLite's own documented answer for "read-only media"), and this
  finding is recorded so a future reader does not assume `mode=ro` alone would have been equivalent.
failed_approaches:
- >-
  REOPENING: pushing scope into SQL by joining straight off the raw ``occurrence`` table (no cache). Correct
  results, but 4-6s per scoped query on the real store -- see findings. The fix (gather_scope_path_cache) is
  described there, not repeated here.
- >-
  Tying gather's own BUDGET_REACHED_WITH_UNRESOLVED threshold to config/budgets.yaml's existing
  profiles.<name>.total_kb (the compiled-PACKET budget) by default (FIRST pass). That number bounds the FINAL
  packet AFTER R1-GA3's facet quotas; gather is expected to over-fetch relative to it, so tying gather's own stop
  condition to it made the merged evidence set depend on an unrelated compile-time setting (observed directly:
