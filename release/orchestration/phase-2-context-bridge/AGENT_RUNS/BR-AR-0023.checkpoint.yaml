- >-
  gather_scope_path_cache is a per-process performance cache (see findings), not rebuilt within a long-lived
  process if the underlying store is rebuilt mid-session by a different process. Never a correctness gap (the
  real classify_hit-based assertion in every route still catches any wrongly-admitted item; a stale cache can
  only under-restrict, i.e. degrade toward the FIRST pass's slower-but-correct behaviour), but worth knowing if a
  long-lived gather server is ever built on top of this CLI.
