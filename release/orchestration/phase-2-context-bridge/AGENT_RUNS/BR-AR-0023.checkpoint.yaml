lessons:
- >-
  When a client-side post-filter sits between a route and an engine's own paging/round logic, check WHETHER a
  scoped/restricted caller's CURSOR can advance without its USEFUL COUNT advancing -- that mismatch, not the
  filter's correctness, is what drives MAX_ROUNDS/timeouts on a real corpus. The fix is not "filter better," it
  is "push the restriction to where the cursor is decided."
- >-
  Before declaring a SQL-level fix complete, TIME it against the real corpus, not just a small synthetic fixture
  (which this node's own hermetic tests, by design, never expose to this problem at all -- a few dozen rows never
  reveal a 500,000-row occurrence table's redundancy). A `git grep`-style measurement of table cardinality
  (`SELECT count(*) FROM t` vs `SELECT count(*) FROM (SELECT DISTINCT ... FROM t)`) is a five-second check that
  would have caught this before the first, naive SQL push-down was ever timed against the real store.
- >-
  An acceptance check that names a specific real-view query implicitly names that query's OWN default
  configuration (its default facet set, here) unless a narrower one is explicitly agreed -- grading it on a
  hand-picked, faster subset is a narrowing under R1-T2 even when every individual number reported is honest.
- >-
  A PERFORMANCE fix and a CORRECTNESS/policy fix can look identical in the diff (both add "an idempotent
  CREATE/INSERT the first time it's needed") while being opposite in what they should do about a query-time write:
  the first reopening's own lazy index/table creation was a legitimate, working fix for a real timeout, and it was
  STILL wrong to build at query time, because "query commands must never write to the store" is a policy
  independent of whether the write is idempotent, cheap, or fixing a real problem. When a fix's mechanism is
  "the first caller to need X builds X," ask who else might rely on X never having been built yet (a frozen
  store, a read-only mount, a demo agent whose own queries must not be observable as writes) before asking whether
  the mechanism is correct or fast.
- >-
  Removing a silent except-block (a fallback OR a swallow-all like classify_occ's own) is itself a form of
  tightening, and tightening exposes whatever the except-block was quietly covering for -- twice in this pass
  (the `chunk`-JOIN bug the old fallback masked in govbridge.semantic.vectors, and the authority-layer
  lazy-schema-creation the old open_db()-based `_conn()` was quietly tolerating). Removing a fallback is the right
  call when the reopening asks for it, but it should be treated as its own small investigation, not assumed to be
  a no-op refactor -- re-running the FULL scoped test suite (never just the tests the change was aimed at) right
  after is what caught both.
