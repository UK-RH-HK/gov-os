- >-
  D-R1-GA1-3 (within authority): the `versions` facet stays synthetic/MISSING-disclosed; version reconciliation
  remains R1-GA2's job (REPAIR_PLAN.md section 2.7). Unchanged by the reopening.
- >-
  D-R1-GA1-4 (within authority, first pass): the notes-dispatch tests and the one isolation fixture live in
  tests/gather/test_engine.py, not tests/notes/test_cli.py or a new tests/gather/conftest.py -- kept every changed
  path inside the declared mutation_scope. Unchanged by the reopening.
- >-
  D-R1-GA1-6 (within authority, REOPENING): scope is pushed down via a plain keyword argument
  (scope_classes/lifecycle_scope/scope_path_globs), never a new abstraction layer between gather and the routes,
  matching the reopening's own instruction ("generically, through a route keyword argument"). Tier B's path globs
  are computed by govbridge.route.real_routes (the one place that already loads the authority registry), never by
  govbridge.lexical.query or govbridge.semantic.vectors themselves, so those two stay ignorant of "authority
  classes" as a concept and only ever see plain SQL-facing class/lifecycle/glob values -- preserving B2's own
  "depends only on B1" layering as closely as a cross-cutting SQL filter can.
- >-
  D-R1-GA1-7 (within authority, REOPENING): gather_scope_path_cache and the record_def(path) index are added to
  the SHARED store.db from within this node's own files (lexical/query.py, semantic/vectors.py), never by editing
  govbridge/authority/layer.py's schema (out of this node's mutation_scope). Both are idempotent
  (`IF NOT EXISTS`/`INSERT OR IGNORE`), additive, and self-contained -- the same "add your own table to the shared
  file" pattern every other layer (lexical_fts, vector) already uses.
- >-
  D-R1-GA1-8 (requested): whether config/facets.yaml's class_facets should carry a real, non-empty per-class
  mapping for the actual demonstration query set is left to the orchestrator/R1-TA2/R1-GA2 -- unchanged by the
  reopening.
lessons:
- >-
  When a client-side post-filter sits between a route and an engine's own paging/round logic, check WHETHER a
  scoped/restricted caller's CURSOR can advance without its USEFUL COUNT advancing -- that mismatch, not the
  filter's correctness, is what drives MAX_ROUNDS/timeouts on a real corpus. The fix is not "filter better," it
  is "push the restriction to where the cursor is decided."
- >-
  Before declaring a SQL-level fix complete, TIME it against the real corpus, not just a small synthetic fixture
  (which this node's own hermetic tests, by design, never expose to this problem at all -- a few dozen rows never
  reveal a 500,000-row occurrence table's redundancy). A `git grep`-style measurement of table cardinality
  (`SELECT count(*) FROM t` vs `SELECT count(*) FROM (SELECT DISTINCT ... FROM t)`) is a five-second check that
  would have caught this before the first, naive SQL push-down was ever timed against the real store.
- >-
  An acceptance check that names a specific real-view query implicitly names that query's OWN default
  configuration (its default facet set, here) unless a narrower one is explicitly agreed -- grading it on a
  hand-picked, faster subset is a narrowing under R1-T2 even when every individual number reported is honest.
