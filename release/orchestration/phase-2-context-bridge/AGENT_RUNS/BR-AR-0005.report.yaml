open_issues:
  - id: OI-1-macro-token-scan-was-needed-for-the-real-mutation-check
    text: >
      The real acceptance check (reads-key mutation -> tools.rs:1817) initially failed: that call is
      `d.str("mutation")` inside `matches!(d.str("mutation").as_str(), "allowed" | "")`, and tree-sitter-rust does
      not expand a macro's argument tokens into call_expression/field_expression nodes (confirmed directly against
      the grammar), so the literal was captured but the accessor call was not, until the macro-token scan
      (HEURISTIC_MACRO_TOKEN) was added and wired into reads_key()'s same-line accessor check alongside normal
      "method" calls. ADAPTER_VERSION was bumped (1.0.0 -> 1.0.1) when this was fixed, so a stale per-blob cache
      from before the fix is never reused silently (ARCHITECTURE.md section 3's invalidation contract). Recorded
      here because it is exactly the kind of edge case a fresh grader should be able to re-derive independently.
  - id: OI-2-resolution-table-not-persisted
    text: >
      See claim C5: ARCHITECTURE.md section 4.6 names a `resolution` table; this build recomputes resolution in
      memory per query instead of persisting it, because a persisted-by-call-site cache would go stale across
      commits (resolution depends on the whole commit's definition set, not on one call site in isolation). If a
      future consumer needs resolution rows queryable directly in SQL (e.g. joined against other layers), that
      would need a commit-scoped cache key (not call_site_id alone) -- not built here, as no B3 acceptance check
      needs it and the in-memory recomputation is well within the measured latency budget (SO-12: ~0.1s).
  - id: OI-3-regex-fallback-definitions-untested-on-the-real-corpus
    text: >
      HEURISTIC_REGEX_FALLBACK (recovering a definition from inside an ERROR-node span via a line regex) is
      implemented and unit-tested (tests/code/test_rust_adapter.py::
      test_error_node_is_recorded_and_fallback_definition_recovered) on a deliberately malformed synthetic
      snippet, but never actually fires on the real repository at 3c880d8: all 5363 code_symbol rows are
      derivation EXACT_PARSE (verified: `SELECT COUNT(*) FROM code_symbol WHERE derivation != 'EXACT_PARSE'` = 0),
      because tree-sitter's own error recovery already keeps every real definition outside the 10 files' localized
      ERROR spans parseable. The fallback is therefore a safety net proven correct in isolation, not (yet)
      exercised by the real-repository acceptance checks themselves.
  - id: OI-4-python-route-not-wired-into-the-commit-wide-index
    text: >
      govbridge/code/adapters/python_ast.py (REUSE, C2) is implemented, tested end to end (blob id, subprocess
      invocation, error handling) and available for a future caller, but govbridge.code.symbols' stats/callers/
      reads-key/history commands index and query Rust (.rs) blobs only. ARCHITECTURE.md section 4.6's "Tables"
      paragraph and every B3 acceptance check are Rust-specific; nothing specifies how Python symbols would share
      the same qualified-name/module-path scheme or the same resolution-label vocabulary, and inventing one
      unrequested felt like scope creep past this brief rather than diligence. Python files still get file-level
      lexical coverage through B2's route per ARCHITECTURE.md section 4.6 ("Other languages get file-level lexical
      coverage only").
  - id: OI-5-blob-identity-collapses-byte-identical-files
    text: >
      Because code_blob/code_symbol are keyed by Git blob id alone (ARCHITECTURE.md section 3's own invalidation
      table: "keyed by (blob, adapter id+version, grammar version)"), two source files with byte-identical content
      parse and cache as a single blob; a name defined only in such a pair resolves as HEURISTIC_UNIQUE_NAME, not
      HEURISTIC_AMBIGUOUS. This is a direct, intentional consequence of the architecture's own caching key, not an
      implementation gap; tests/code/test_symbols_integration.py::
      test_byte_identical_files_share_one_cached_blob_by_design pins the behaviour so it is never silently
      "fixed" into something the cache key cannot actually support (that would need keying by (blob, path)
      instead, changing what "cached by blob" means). Not observed on the real repository's 217 files (no two
      share content), and not implicated in any B3 acceptance check.
  - id: OI-6-module-path-is-a-heuristic-not-mod-resolution
    text: >
      module_path() derives a crate::... guess from a file's path alone (runtime/src/x.rs -> crate::x); it is not
      true Rust `mod`-declaration resolution, which would need a working tree. This is the documented source of
      HEURISTIC_TYPE_PATH's imprecision (ARCHITECTURE.md section 4.6 already labels that path HEURISTIC, not
      EXACT) and is unchanged from the architect's own spike (ARCHITECTURE/spike-scripts/code_spike.py's
      module_path()), copied by logic per BR-HO-0005 ("copy their logic, do not import them"), not by import.
