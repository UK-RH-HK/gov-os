  chain facts and query for query/control facts'
- 'the merged govbridge/demo/grade.py anchor_matches returns only on exact unit-id equality when an anchor carries a
  record_id; D-1 requires record-id OR section matching -- chain any_of lists carry both variants; a grader that is not
  D-1-conformant would under-match record_id anchors'
- 'the authoring scripts sit in <SEALED> beside oracle.yaml (not removable under the no-rm rule; they are content-bearing
  and must stay sealed); the grader copies oracle.yaml only'
decisions:
