findings:
- 'the sealed oracle is structurally valid in BOUND mode: 2 chains x 11 stages, one enforcement stage each, 34 query rows
  (30 query-class + AUTH-1..4), 3 control rows, side_by_side, f1_both_ways, 16 authority rows (one per mandatory item,
  class verbatim), 124 must_state facts all bound (D-2), 363 anchors all verified at their commits'
- 'anchor commits: product 3c880d8, records 6e7a2a3 (records outside the bridge domain are blob-identical at the bridge
  tip), evidence 58219d5; the Review-8 return copy is anchored at the bridge commit 9258d0a (immutable blob); one
  optional anchor is at an earlier frozen-history product commit; no anchor is at any builder, grade or run-1 commit'
- 'every stage lists all equally-correct anchors in any_of; each chain has one acceptable_alternative_enforcement_points
  entry with its justification; each enforcement stage lists its upstream-representation traps with a why'
- 'record anchors: chain stages list a record_id variant and an id-less (lines + section) variant of key records, so
  either D-1 route (record id, or section) can match; query required lists use id-less anchors (single-record documents
  path + section; multi-record files lines + section)'
- 'A-admissible mandatory items expect section A (OWNER_DECISION items [A, D.1]); non-ladder items keep their section
  (D.2, D.3, F, E/F) -- BR-ARCH-RULING-1 and its Addendum A1 applied, no Addendum reinterpretation needed'
- 'no oracle fact asserts an F2/F3 classification or an F1 disposition (checker lint + selftest); F1 appears only as
  evidence and the owner direction to test; the F2/F3 item only as a hypothesis to test'
failed_approaches:
