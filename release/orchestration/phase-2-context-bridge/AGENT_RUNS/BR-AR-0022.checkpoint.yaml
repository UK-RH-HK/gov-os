findings:
- 'RC-1''s root cause was a single hard-coded `max_chars=4000` in packet.py''s ``_read_excerpt``, applied to every
  mandatory item unconditionally, regardless of section A''s own total budget (budgets.py''s existing
  over-budget-as-reference fallback never even saw most oversize items, because they were already cut upstream).'
- 'A mandatory item''s existing ``content_sha256`` field was ALREADY documented in
  ARCHITECTURE/schemas/packet-manifest.yaml as "sha256 of the delivered bytes", but the code set it to the
  resolver''s whole-occurrence hash regardless of what was actually delivered -- the schema''s own intent and the
  code disagreed before this fix. I did not repoint ``content_sha256`` itself (several existing, frozen tests and
  ``validate.verify_section_a``''s re-derivation key on it staying exactly the resolver''s hash); I added
  ``delivered_sha256``/``source_sha256`` alongside it instead, so both meanings are now available and distinct.'
- 'An anchored mandatory item''s ``source_sha256``/``content_sha256`` (the resolver''s whole-FILE hash) and its
  ``delivered_sha256`` (the hash of just its anchored slice) legitimately differ even when the item is fully,
  honestly delivered -- so ``verify_delivered_fidelity`` checks PRESENCE of both fields, never their equality
  (an earlier draft asserted equality-unless-notice and produced false positives against every real anchored
  item, e.g. CX-0010A in the shared fixture -- caught by the existing compile suite before it ever reached a
  commit).'
- 'A real ``mandatory_bridge_inputs`` row (PHASE-2-LEDGER-P2-L-0033-0047) already uses the field name ``entries``
  as free, human-readable prose, not a structured selector -- discovered when the corrected real-view test first
  crashed against it. ``keys``/``entries`` are therefore selectors ONLY when they carry their expected structured
  shape (a list / a mapping respectively); any other shape is left completely alone, never an error.'
- 'The real ``records`` ref (``refs/heads/bridge/p2-context-retrieval``) is exactly the branch this whole
  REPAIR-1 effort''s parallel builders commit to, in the SAME object store every git worktree of this repository
  shares -- confirmed by ``config/canonical-view.yaml`` itself (only ``records`` is ``follow: tip``; ``product``/
  ``evidence`` were already ``follow: pinned``), which is why BR-DAG-AMEND-R1-2''s hermeticity fix only needs to
  pin that one named ref.'
failed_approaches:
- 'First draft of ``verify_delivered_fidelity`` asserted ``delivered_sha256 == source_sha256`` for every A item
  unless a ``MANDATORY_PARTIAL_DELIVERY`` notice named it. This failed
  ``test_hand_edited_packet_with_extra_a_item_fails_verify``/``test_semantic_trap``/
  ``test_mandatory_bridge_inputs_classes``/two ``test_compile_receipt.py`` cases -- EVERY anchored mandatory item
  in the shared fixture corpus (CX-0010A etc.) legitimately has a whole-file source hash and an anchored-slice
  delivered hash, so the two never matched even for a fully, honestly delivered item. Replaced with a
  presence-only check (see findings).'
- 'Considered emitting a second MandatoryItem (``id#path2``) per extra declared path, mirroring an earlier,
  since-reverted approach the resolver''s own docstring warned against (it changes section A''s real-view item
  set and breaks the frozen ``EXPECTED_IN_A``/``lifecycle_notices`` shape of
  ``test_compile_real_view_mandatory_in_a.py``). Used ``MandatoryItem.parts`` instead -- additional, fully-resolved
  sub-occurrences of the SAME one item, never a second section-A entry.'
- 'Considered treating a `keys`/`entries` selector''s "remainder" disclosure the same way for a paths-only row
  (deliver primary in full via a part, then ALSO run the remainder-of-primary disclosure). Realised a paths-only
  row narrows NOTHING about the primary (both paths are meant in full), so the disclosure only fires when a
  keys/entries selector ACTUALLY narrowed the primary occurrence itself -- gated on a `narrowing` flag in
  ``Compiler._render_selected_parts``.'
unresolved:
- see report.yaml open_issues (history-glob-ref pinning left to R1-INT; id_form selector support left for a
  future need; task-spec.yaml schema documentation of the new keys/entries fields left for a schema-owning node)
decisions:
- 'Modified an EXISTING test file, tests/compile/test_compile_real_view_mandatory_in_a.py (BR-DAG-AMEND-R1-2,
  explicitly assigned to this node): added a module-level pin of every follow:tip named ref (config/canonical-view.yaml
  currently has exactly one -- `records`) to the commit it resolves to once, at import time, and threaded that
  pinned view + an explicit `repo=` into both test functions'' compile/verify calls. The byte-identical-twice
  assertion itself, and every other assertion in the file, is UNCHANGED and unweakened -- only the input view each
  assertion runs against is now fixed instead of live. Justification: the amendment names this exact file and
  exact defect; the fix is orthogonal to, and does not touch, any assertion''s meaning.'
- 'Also modified _mandatory_item_from_row''s docstring in resolver.py (not a test) to describe the NEW
  multi-path/selector behaviour instead of the old "extra paths are checked but never delivered" rationale it
  used to document, since that rationale (protecting the frozen real-view test''s exact item count) still holds
  -- the real-view test''s own assertions were never about path COUNT, only about which item_ids land in A -- and
  is now literally re-verified by the corrected test itself.'
- 'Chose to generalise `keys`/`entries`/`paths` selector resolution (`_resolve_row_selectors`) to path_form
  required_inputs entries as well as state_ref rows, though REPAIR_PLAN.md section 3 rule 2 frames selectors as
  "declared in the bridge state." All three real production required_inputs (demonstration-task.yaml) are
  state_form already, so this generalisation changes no real behaviour; it let acceptance check 3 exercise the
  selector mechanism against REAL, already-existing production content (ORCHESTRATOR_STATE.yaml, read-only)
  instead of requiring either a synthetic-only demonstration or an edit to real state. Flagged as a decision
  rather than silently assumed because it slightly broadens the node''s original one-line description.'
- 'Did not modify govbridge/compile/budgets.py or govbridge/compile/receipt.py: both are in mutation_scope but
  needed no code change (see input_manifest notes) -- their existing behaviour already composes correctly with
  every new field/mechanism, which I verified rather than assumed (ran the full compile suite after every change).'
lessons:
- 'When a field''s DOCUMENTED meaning (a schema file) and its ACTUAL code meaning disagree, prefer ADDING the
  correctly-named field alongside the old one over silently repointing the old field -- the old field usually has
  load-bearing consumers (here: validate.py''s section-A re-derivation, three other tests'' content_sha256
  comparisons) that assume its EXISTING semantics.'
- 'A "this must always equal that" validator invariant needs to be checked against every EXISTING legitimate
  shape in the corpus (here: an anchored sub-record''s whole-file vs. slice hashes) before it is trusted, not just
  against the new code path it was written for -- the full compile suite caught this in under a minute.'
