findings:
- 'RC-1''s root cause was a single hard-coded `max_chars=4000` in packet.py''s ``_read_excerpt``, applied to every
  mandatory item unconditionally, regardless of section A''s own total budget (budgets.py''s existing
  over-budget-as-reference fallback never even saw most oversize items, because they were already cut upstream).'
- 'A mandatory item''s existing ``content_sha256`` field was ALREADY documented in
  ARCHITECTURE/schemas/packet-manifest.yaml as "sha256 of the delivered bytes", but the code set it to the
  resolver''s whole-occurrence hash regardless of what was actually delivered. I added ``delivered_sha256``/
  ``source_sha256`` alongside it rather than repoint it (several existing, frozen tests and
  ``validate.verify_section_a``''s re-derivation key on it staying exactly the resolver''s hash).'
- 'An anchored mandatory item''s ``source_sha256`` (the resolver''s whole-FILE hash) and its ``delivered_sha256``
  (the hash of just its anchored slice) legitimately differ even when fully, honestly delivered -- my FIRST
  presence-only fidelity check accepted this correctly, but (per the reopening) presence alone cannot catch a
  compiler that cuts a body and writes SOME hash for the cut text anyway.'
- 'A real ``mandatory_bridge_inputs`` row (PHASE-2-LEDGER-P2-L-0033-0047) already uses the field name ``entries``
  as free, human-readable prose, not a structured selector -- discovered when the corrected real-view test first
  crashed against it. ``keys``/``entries`` are therefore selectors ONLY when they carry their expected structured
  shape (a list / a mapping respectively); any other shape is left completely alone, never an error.'
- 'The real ``records`` ref is exactly the branch this whole REPAIR-1 effort''s parallel builders commit to, in
  the SAME object store every git worktree of this repository shares -- confirmed by
  ``config/canonical-view.yaml`` itself (only ``records`` is ``follow: tip``), which is why BR-DAG-AMEND-R1-2''s
  hermeticity fix only needs to pin that one named ref.'
- 'REOPENING finding: "declared" is not one uniform concept -- it means the WHOLE file/slice when no selector
  narrows it (comparable directly to a full delivery''s hash), but the SELECTOR''S OWN resolved parts when
  ``keys``/``entries``/``paths`` apply (also directly comparable, since every matched part is delivered in full
  by construction). Treating "declared" as ALWAYS "the whole document, structurally decomposed" (my first draft)
  made ``delivered_sha256`` and ``declared_sha256`` use two DIFFERENT hash shapes (a raw-text hash vs. a
  JSON-wrapped structural hash) that could never equal each other even for a perfectly honest, full delivery --
  caught immediately by the existing compile suite (every anchored/full-delivery test failed).'
- 'REOPENING finding: my first Markdown flat-tiling algorithm picked ONE heading level for the whole document
  (shallowest, or the level carrying entries). This is WRONG for a document that mixes depths (some headings have
  nested subsections, some do not) -- a heading between two chosen-level siblings that happens to be shallower
  swallows everything after it up to the next entry, silently absorbing a sibling''s content. Replaced with a
  per-heading "own content only" partition (every heading, at every level, contributes exactly its own text up to
  its first CHILD heading or its own end) -- this tiles ANY heading structure exhaustively, verified with an
  automated overlap/gap check against both a synthetic mixed-depth fixture and the real 499-line PHASE_LEDGER.md
  (19 sections, 18 entries, zero gaps, zero overlaps).'
- 'REOPENING finding: the real ``mandatory_bridge_inputs.items[*]``/``owner_records[*]``/``contract_v3`` required
  inputs (demonstration-task.yaml) are ALL ``state_ref`` (state_form) rows -- so generalising selector support to
  ``path_form`` entries (a decision from the FIRST pass) changed no real production behaviour, but did let
  acceptance check 3 exercise the entries-over-Markdown fix against REAL content (PHASE_LEDGER.md) via a
  read-only ``path_form`` probe, without needing to edit real state.'
failed_approaches:
- 'First draft of the (now-removed) ``verify_delivered_fidelity`` asserted ``delivered_sha256 == source_sha256``
  for every A item unless a notice named it. Failed on every anchored fixture item (whole-file vs. slice hashes
  legitimately differ). Replaced with a presence-only check -- which the reopening then correctly identified as
  too weak to catch silent truncation, since presence alone says nothing about whether the delivered bytes match
  what was declared.'
- 'REOPENING first draft of ``declared_parts``/``declared_hash_and_bytes`` computed a structural, JSON-wrapped
  hash over ``sectionmap.flat_tiling``''s FULL decomposition for EVERY mandatory item (treating "declared" as
  always "the whole document, finely decomposed"). This made ``delivered_sha256`` (a raw-text hash) and
  ``declared_sha256`` (a JSON-wrapped structural hash) use incompatible schemes -- even a perfectly-delivered,
  unselected, undersized item failed 2(a) trivially. Redesigned so "declared" means exactly what the ROW asks for
  (whole file/slice, or the selector''s own resolved parts) and both hashes use the SAME
  ``resolver.hash_pieces`` -- confirmed working via a targeted compile-suite run showing the SAME class of
  failure (every item, not just anchored ones) before the fix, none after.'
- 'REOPENING first draft of the Markdown flat-tiling picked ONE heading level for the whole document (shallowest
  present, or the entries'' own level). Caught immediately by a manual overlap/gap probe against a synthetic
  mixed-depth fixture (a heading with a nested subsection, followed by a sibling at the SAME level as the parent)
  -- the sibling''s content was silently absorbed into the nested heading''s span. Replaced with the
  per-heading "own content up to its first child" partition (see findings) before it reached any committed test.'
- 'Considered emitting a second MandatoryItem (``id#path2``) per extra declared path, mirroring an earlier,
  since-reverted approach the resolver''s own docstring warned against (it changes section A''s real-view item
  set and breaks the frozen ``EXPECTED_IN_A``/``lifecycle_notices`` shape of
  ``test_compile_real_view_mandatory_in_a.py``). Used ``MandatoryItem.parts`` instead.'
