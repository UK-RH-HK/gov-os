      exact against a small synthetic repo classified through a purpose-built registry.
  - id: C4-real-bug-found-and-fixed-fts5-syntax
    text: >
      Wiring the real lexical route into govbridge.compile.packet._attach_evidence_both_ways (ARCHITECTURE.md
      section 7.3's "evidence both ways" query templates, e.g. "consumers, dependents and uses of <subject>")
      exposed a genuine crash: free natural-language text containing a comma is not valid FTS5 MATCH syntax, and
      govbridge.lexical.query.query() passes its `text` argument straight through as a MATCH expression by
      design/contract. Fixed in real_routes.py (not lexical/query.py, which is correctly documented as taking "an
      FTS5 MATCH expression" from a caller who already builds one): _safe_fts_query() passes an already-quoted
      phrase through unchanged (the shape B2's own examples and existing task-spec queries use), and otherwise
      tokenises free text (the tokenizer's own alphanumeric+underscore token shape) and OR's the tokens together
      -- syntactically always valid, recall-favouring. Verified live against the real demonstration-task.yaml
      (which has a D.2 OWNER_DIRECTION_TO_TEST item, exercising this exact code path) with real routes: compile
      succeeds, no crash. tests/route/test_real_routes.py::test_safe_fts_query_never_raises_on_punctuated_free_text
      and ::test_lexical_route_survives_a_comma_bearing_free_text_query cover it.
