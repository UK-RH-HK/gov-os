  - id: C8-b1-incremental-diff-tree
    text: >
      Closes B1 OI-4 ("INCREMENTAL re-walks a changed ref's whole tree"). govbridge/core/freshness.py's
      core_layer_builder, for an INCREMENTAL ref move, now tries a new _index_one_ref_incremental() first: `git
      diff-tree` gives exactly the changed paths; every UNCHANGED path's occurrence row is carried forward to the
      new commit id by one SQL UPDATE (no git call, no re-read, no re-classification -- diff-tree partitions the
      tree into "changed" and "everything else", and "everything else" is BY DEFINITION byte-identical at both
      commits); only changed/added paths are freshly read and classified. Falls back to the original full-walk
      _index_one_ref() if diff-tree itself fails (belt-and-braces) or no prior commit is known for that ref (a
      genuinely new ref). Proven equal to a full walk on the real corpus: build1 (from-clean, records @
      e9b8f119502a458953c72a73313520e74a32b5e5) incrementally updated via diff-tree (2 blobs changed, a real
      commit landing on the bridge branch mid-run -- see open_issues for the full account) to records @
      6b766656042557c56d8f4a7a9e49077b74e72dea gives manifest_sha256 3b68840cd2d377654361e4aba72595307d6debc536b0e89b1037eba4e3371b2c,
