      original NOT_YET_ASSIGNED placeholder, so no existing test's assertions changed) mirroring the hook
      govbridge.semantic.search already had. Every RouteHit from every route now carries a real authority_class/
      lifecycle, delivery always RETRIEVED -- a class label can never be a promotion into section A, since these
      adapters build only RouteHit, never MandatoryItem (no conversion function exists between them).
