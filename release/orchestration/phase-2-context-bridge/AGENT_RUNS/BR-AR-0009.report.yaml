open_issues:
  - id: OI-1-b3-python-ast-not-wired-into-commit-wide-index
    text: >
      B3's Python AST adapter (govbridge/code/adapters/python_ast.py, reused unmodified per B3's own report) is
      NOT wired into a commit-wide Python symbol/caller index, taking the DAG's own offered alternative ("Wire
      it, or record why a Python index is not needed for this corpus"). Reason: the real corpus has 502 .py files
      at the product ref, genuinely non-trivial, but every one of the demonstration task's seeds
      (P2-AR-0097(#F1/F2/F3)) and every one of the 30 generic query-class instances (S1/S2/S3 x QC1-QC10, plus
      the chain/side-by-side/both-ways/control queries) concerns the Rust governance/policy layer exclusively
      (layout derivation -> policy loading -> overlay evaluation -> path decision; the floor-rule union; the
      health-sandbox exemption) -- none names or needs a Python symbol. Building a parallel Python definitions/
      callers query surface (mirroring code/symbols.py's ~250 lines for Rust) for zero demonstration-relevant
      benefit was judged not worth the time against this run's mandatory three from-clean rebuilds (C11) and the
      full acceptance-check sequence. Python files still get real lexical-route coverage (config/corpus-rules.yaml
      admits .py; verified live: `lexical/py` blobs are indexed and searchable), which is architecture's own
      documented degrade path ("Other languages get file-level lexical coverage only, and coverage reports them
      as code_intel: NONE") -- not a silent gap. Routed forward: a future node wanting Python symbol/caller
      retrieval can reuse code_bridge.py's translation PATTERN (real persisted tables -> a query-surface shape)
      once a Python-equivalent of code/symbols.py exists.
  - id: OI-2-mid-run-records-ref-move-by-the-orchestrator
    text: >
      Observed interaction, not a defect (the orchestrator's own framing, recorded verbatim here per their
      instruction): build1 (check2a) started at 15:49 with the canonical view's `records` ref (follows
      refs/heads/bridge/p2-context-retrieval's tip) at e9b8f119502a458953c72a73313520e74a32b5e5. The orchestrator
      committed 6b766656042557c56d8f4a7a9e49077b74e72dea to that branch at 16:09:04, mid-build. build2 (check2b,
      a from-clean build in a SEPARATE store) started at 16:31, after that commit, and so indexed 6b76665...
      directly. A `govbridge freshness` NOOP check (intended as acceptance check 4) run at 16:35 against
      store-BR-AR-0009 (build1's store) correctly detected the ref move and returned INCREMENTAL (refs_changed:
      [records], 2 blobs, 231.6s wall under heavy concurrent CPU load from build2's own semantic embedding) --
      correct freshness detection, not a false NOOP and not a hang. This incidentally moved store-BR-AR-0009's
      OWN view from e9b8f11... to 6b76665..., landing on manifest_sha256
      3b68840cd2d377654361e4aba72595307d6debc536b0e89b1037eba4e3371b2c -- IDENTICAL to build2's own from-clean
      manifest_sha256 at 6b76665... . Per the orchestrator's explicit guidance, this equality is recorded as the
      incremental == full proof (C12), and a third, EXPLICITLY --records-ref-pinned from-clean build (build3,
      C11/C12) supplies the strict two-from-clean-same-view reproducibility proof the incident alone could not.
      The orchestrator confirmed the bridge branch frozen (no further commits) before this run's remaining
      acceptance checks (4 clean, 5, 6, 7) were executed. AGENT_RUNS/BR-AR-0009.check4-freshness-noop.out is the
      original (contended, INCREMENTAL) result, kept as evidence of the interaction, alongside
      check4-freshness-noop-clean.out (the true NOOP measurement taken after all builds finished and the branch
      was frozen).
  - id: OI-3-check-state-verify-deferred-to-the-orchestrator
    text: >
      Acceptance check 8 (`python3 tools/check_state.py verify`) is explicitly annotated in the DAG as "(run by
      the orchestrator on the integrated branch)". Run here, on MY OWN branch (bridge/i1-0009, not the bridge's
      own bridge_branch), it correctly reports ORCHESTRATION_STATE_CONFLICT ("HEAD branch 'bridge/i1-0009' !=
      bridge_branch 'bridge/p2-context-retrieval'") -- expected and inherent to running on a feature branch
      before merge, not a defect in this run's work. Deferred to the orchestrator post-merge, per the DAG's own
      annotation. This run's own scope compliance was instead verified via `tools/check_state.py integrate-check
      BR-AR-0009` (self-check, required by the brief) -- see the checkpoint for its result.
