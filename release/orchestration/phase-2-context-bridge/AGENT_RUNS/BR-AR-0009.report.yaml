  - id: C15-b4-model-pin-and-bootstrap
    text: >
      Closes B4/BR-AR-0006 OI-4 ("the model-pin local_name does not match the bootstrapped cache layout").
      bootstrap.sh's own download step never read `local_name` or `download.dest_template` at all -- it always
      wrote (and govbridge.semantic.modelpin always read back) every artefact at its literal `path`. Removed the
      incorrect `local_name: pooling_config.json` field from config/model-pin.yaml (an absent local_name already
      falls back to `path`, per modelpin.py's own load_model_pin) rather than "fixing" it to a value that would
      just duplicate `path` -- one source of truth instead of two fields that must stay in sync. Re-ran
      bootstrap/bootstrap.sh twice live: both runs exit 0, all 6 artefacts "present and verified" (no download),
      identical pin id ec48d829ccde4f05edff02aa3220cbee0864579a078f25783a6612f3bee410b7 both times. This change
      touches config/model-pin.yaml's config_sha256, so it correctly forced FULL on this run's own from-clean
      builds (already from-clean regardless); it does not change compute_pin_id() (the formula never read
      local_name), so it never invalidates any already-embedded vectors under the existing pin id.
  - id: C16-b4-embed-and-store-commits-per-batch
    text: >
      Closes B4/BR-AR-0006 OI-5 ("embed_and_store commits once, at the end"). govbridge/semantic/vectors.py's
      embed_and_store() now commits after the reuse pass (existing-vector rows resolved for free) and after EVERY
      embedding batch, not only once at the very end -- a killed rebuild resumes: every already-committed batch's
      text_sha256 group is found by reuse_vector() on the next call (whether that is a fresh embed_and_store()
      call over the same not-yet-completed rows, or the same store reopened) and is never re-embedded. New
      tests/semantic/test_vectors_resumability.py (2 tests; tests/semantic/test_vectors.py, existing, unmodified)
      proves both the commit-per-batch boundary (a Connection subclass counting real commits: one for the reuse
      pass, one per batch) and that a kill-after-first-batch-then-resume sequence gives a BYTE-IDENTICAL final
      vector-table digest to one uninterrupted build, with exactly the right number of real "model" calls
      (1 pre-kill + 2 on resume, none repeated for the 3 already-committed rows).
