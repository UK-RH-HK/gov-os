- 88 of 89 measured anchor rows are indexed in the demonstration store; the bridge lost evidence in delivery and retrieval
  strategy, not in indexing
- 'RC-1: 15/20 section-A mandatory items silently cut at 4,000 chars (384,595 source bytes rendered as 61,107; no marker)
  despite ''A is never truncated''; declared selectors (entry range, key list, second path) ignored -- the range/key items
  rendered their file heads'
- 'RC-2: 30 of 41 public queries (class x subject templates) have no text and were silently never compiled'
- 'RC-3: one round, fixed k=8, no facets, no follow-up; 33/63 T1 symbols exceed the caller fan-out cap (1,255 call sites
  beyond it) with no continuation; discovered identifiers never followed'
- 'RC-4: G''s budget drop order is resolution-label-lexicographic: 225 READS_KEY kept, all 37 TESTS edges dropped'
- 'RC-5: pointer-only delivery (G: 22,558 content bytes for 325 items; 24 semantic items with 0 bytes)'
- 'RC-6: no supplementary packets; 1,063,203 raw output bytes of which 406,501 are per-hit occurrence lists (<= 98 rows
  per hit); bootstrap inlines the whole packet'
- 'RC-7: TESTS edges by name heuristic only (17/20 missed test anchors not one hop from any surfaced symbol); no code->data
  or code->requirement edges; YAML state records largely unaddressable; no symbol history; no version-reconciliation facet
  although the store holds per-ref blob ids'
- 'RC-8/OBS-BR-08: CLI routes return 75 excluded-path hits for the 11 public texts by default; two compile call sites pass
  no exclusions'
- 'RC-10: grader defects GD-1..GD-9 confirmed and a new GD-10 (symbol-qualified anchor never matched by an exact line citation
  inside the symbol); 7 ORACLE_STRICTNESS items are all must_state stage placement'
- 'counterfactuals: grader+oracle fixes rescue 0/29 failing queries; +agent fixes 12/29 (G5 6/10 classes); bridge fixes
  alone 6/29 (G5 2/10) incl. CTRL-1 and CTRL-2; both families are required; controls fail on the bridge (8/11)'
- run-1 compile reproduced exactly (424/424 items identical) from a pinned view; demonstration store hash unchanged before/after
failed_approaches:
- 'first recompile used the committed view: its records ref follows the moved bridge tip (records resolved to 9de0d79),
  giving a different packet; fixed by pinning the records ref to 94d0211 (make_pinned_task.py)'
- first two exploratory recompiles ran before telemetry isolation and appended 26 query-telemetry rows to the shared $HOME/.cache/gov-bridge/telemetry/queries.jsonl
  (2026-09-26T00:41:42Z..00:45:27Z); not the store; not reverted (no shared-file edits or removals); all later runs used
  a scratch GOV_BRIDGE_HOME
- measurement v1 counted evidence possession with the grader's +-3 line tolerance; tolerance-edge overlaps wrongly credited
  the agent with sections it never saw; replaced by substantive overlap (>= min(3, len) shared lines) for possession, keeping
  tolerance only for 'citable'
- code one-hop probe v1 compared caller_symbol with qualified names; the store keeps symbol ids there; fixed to join through
  code_symbol
- 'DAG v1 was hand-written YAML with plain scalars containing '': '' and backticks and failed to parse; regenerated from
  a checked Python data structure (gen_repair_dag.py) and validated (check_repair_dag.py)'
- overlap self-check v1 counted public tokens (mandatory item ids, class names, bridge file paths) as overlaps; refined
  to separate PUBLIC (present in packet/state/design or a bridge-domain tracked path) from SUBSTANTIVE
unresolved:
- must_state classification rests on the grader's per-fact notes plus private presence probes whose tokens are oracle-derived
  and were not committed; a verifier with quarantine access can re-derive them
- the anchor-level private file (locators) exists only in scratch; regenerate with evidence/tools/measure_anchors.py (needs
  bridge/grade-0012 access, a copy of store-BR-AR-0010 and the recompile capture)
- 'classification sensitivity: 10 GD-8 items flip to AGENT or BRIDGE-R under a strict D-1 ruling (shown per item); counting
  grep definition lines as possession for code/test anchors moves 16 test rows between AGENT and BRIDGE-R if reversed; neither
  changes the counterfactual conclusion'
- decisions D-1..D-5 (REPAIR_PLAN.md section 8.1) are recommendations for the orchestrator/owner, not decisions
- CONTROL-A / CONTROL-B subjects are to be chosen by the orchestrator (criteria in REPAIR_DAG.yaml conventions)
decisions:
- 'classes assigned by deterministic rules in order: GD-8 whole-document citation > GD-10 symbol-body citation > evidence
  in packet > evidence in agent outputs > cited elsewhere > bridge signals (budget drop > truncated mandatory > by-reference
  directory > query not run > follow-up id > follow-up callers > top-k > scoped section) > not retrievable'
- any-of stage anchors classified by their most favourable alternative; every alternative recorded
- ORACLE_STRICTNESS used only for must_state stage placement; no required item was found that the public query did not ask
  for
- G7 packet-byte breach mapped to BRIDGE_NOT_IN_PACKET_BUT_RETRIEVABLE (evidence retrievable, delivered only via unbudgeted
  raw dumps); external-read bytes GD-7; undeclared reads GD-6
- committed files carry grade-report keys, anchor kinds, measured booleans/ranks and classes only; no locators, facts or
  per-query expected items
- 'repair plan kept generic: acceptance on fixtures and orchestrator-chosen unrelated controls; public demonstration query
  texts and run-1 answers forbidden as builder acceptance input'
lessons:
- 'a demonstration failure analysis needs an exact recompile with pre-budget capture: the manifest''s compact drop summary
  cannot show what the compiler found and discarded'
- possession must be measured with real overlap, not grading tolerance
- every tool touching the bridge must isolate GOV_BRIDGE_HOME (telemetry) and GOVBRIDGE_STORE before its first run
- hand-written YAML with prose values is fragile; generate machine-readable plans from data and validate them
- the '8k/top-k is only a batch size' rule was violated not by a constant alone but by the absence of continuation everywhere
  (routes, fan-out caps, budget drops)
