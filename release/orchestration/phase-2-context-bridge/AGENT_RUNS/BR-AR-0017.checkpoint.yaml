findings:
- 'REPAIR_DAG.yaml''s R1-RN deliverable text ("govbridge/notes/{build,validate}.py and `govbridge notes validate
  <file>`") names a CLI surface, but govbridge/cli.py -- the only place that surface can be dispatched from -- is
  outside this node''s mutation_scope and is edited in a fixed sequence by other nodes (conventions.shared_files:
  RX -> GA1 -> RS -> RA). Resolved by building govbridge/notes/cli.py as a self-contained subcommand dispatcher
  (mirroring govbridge/demo/cli.py exactly), runnable today via `python -m govbridge.notes.cli validate <file>`,
  and leaving a one-line, clearly documented hook for the next cli.py editor'
- 'DERIVED_NOTE is a new authority class the repair introduces (REPAIR_PLAN.md section 2.10) that does not yet
  exist in govbridge/authority/classes.py''s ALL_CLASSES table -- that file is outside this node''s mutation_scope
  too. Resolved by NOT depending on classes.py at all: the "never admissible in A" invariant is enforced directly
  inside govbridge.notes.validate (a NEVER_ADMISSIBLE_SECTIONS constant and a target_section parameter to
  validate_note), independent of whatever classes.py does or does not know about the class. R1-GA3 (compile
  integration, which does own packet.py and can also touch classes.py) is the natural place to wire this into the
  packet compiler''s own placement logic'
- 'the schema''s source/claim/source_fields tables in config/notes-schema.yaml are read at runtime by
  govbridge.notes.schema (never hard-coded a second time in Python), following the same discipline
  govbridge.compile.budgets.py and govbridge.authority.classes.py use for their own config files'
- 'a `lines` range convention already exists in this codebase (govbridge.core.exact''s "<ref>:<path>[:L1-L2]", and
  the authority registry''s section_anchors `lines: [l1, l2]`) -- both 1-indexed inclusive. The note schema''s
  source.lines follows the SAME convention rather than inventing a third one'
failed_approaches:
- 'first draft of config/notes-schema.yaml used `{...}` flow-style field entries (mirroring
  ARCHITECTURE/schemas/receipt.yaml''s literal look); several desc strings contain a bare '':'' inside prose
  (e.g. ''OD-BR-05 section 7: "..."''), which YAML''s flow-mapping grammar cannot parse unquoted -- confirmed by
  a parse error at the first such line. Rewritten as block-style mappings (one indented block per field), which
  places no restriction on the prose; re-verified the whole file parses with yaml.safe_load before proceeding'
- 'considered making resolve_source in validate.py accept a bare (path, commit) pair and trust the recorded
  ``blob``/``content_sha256`` outright for speed; rejected in favour of always re-deriving from Git (matching
  govbridge.authority.registry._verify_cite''s own "never trust-on-read" rule), since a note whose lineage is not
  independently re-checked is exactly the kind of unverifiable pointer OD-BR-06 section 4 and RC-5 (pointer-only
  delivery) warn against'
unresolved:
- 'govbridge/cli.py needs one dispatch line for "notes" (documented in govbridge/notes/cli.py''s own docstring and
  in this run''s open_issues); left for the next node in the shared_files sequence, since this node''s
  mutation_scope excludes that file'
- 'DERIVED_NOTE''s formal registration in govbridge/authority/classes.py''s ALL_CLASSES table (name, ladder=False,
  admissible_in_a=False, admissible_in_d1=False, allowed_sections, banner) is left to whichever later node owns
  that file -- R1-GA3 is the stated consumer of this schema per REPAIR_DAG.yaml traceability (OD-BR-05 s7,
  OD-BR-06 s4) and also touches packet.py''s placement logic'
- 'no CONTROL-A / real-view acceptance was exercised for this node: R1-RN''s own acceptance check
  (`pytest tests/notes -q`) is fixture-only, and the validator''s Git-resolution logic is generic over ANY
  repository (it needs no real corpus to prove correct) -- CONTROL-A is for nodes that do real retrieval over the
  actual corpus (R1-GA1/GA2/GA3/RS), which this node is not'
decisions:
- 'claim_fields adds claim_id and text (not explicitly named by REPAIR_DAG.yaml''s deliverable line, which names
  only "claims[] with sources[]"): a claim with sources but no statement of what it claims would be useless to a
  consumer, and OD-BR-05 section 7''s own language ("evidence-grounded intermediate notes/claims") implies a claim
  has content beyond its sources. Both fields are structurally required'
- '"a note placed in A is refused" is implemented as a target_section parameter to validate_note (None by default,
  meaning no placement decision is being checked yet) rather than a field on the note itself, because placement is
  a property of where a CALLER is about to put the note, not of the note''s own content -- a note is refused for A
  by TYPE, regardless of what its own (possibly hostile or malformed) `class` field claims'
- 'source resolution treats a blob mismatch (`blob_at(commit, path) != recorded blob`) as "does not resolve"
  rather than silently accepting whichever blob is live -- REPAIR_PLAN.md section 2.10 requires content_sha256 to
  be re-verified, which is meaningless if a stale/wrong blob is trusted first'
- 'no existing test file was modified (R1-RN rule 5 does not apply here -- every file under tests/notes/ is new)'
lessons:
- 'a REPAIR-1 deliverable line naming a CLI command can outrun what the node''s own mutation_scope allows editing
  (shared_files sequencing); the fix is to build the subcommand as a fully working, independently runnable module
  with `main()`, and document the one remaining integration line for whichever node touches the shared file next,
  rather than either violating scope or leaving the deliverable half-built'
- 'when a node introduces a new authority class that a shared registry (authority/classes.py) does not yet know
  about, enforce the invariant locally and defensively (a parameter the caller must pass, refused by default logic)
  rather than assuming the shared registry will be updated in lock-step'
next_consumer: 'R1-GA3 (compile integration, OD-BR-05 s7 and OD-BR-06 s4 per REPAIR_DAG.yaml traceability): call
  govbridge.notes.build.build_note when merged evidence exceeds the budget profile, govbridge.notes.validate.validate_note
  before emitting a note into the packet, and pass target_section explicitly so a note is never routed into A;
  also register DERIVED_NOTE in govbridge/authority/classes.py. Separately, whichever of R1-RX/R1-GA1/R1-RS/R1-RA
  edits govbridge/cli.py next should add the one "notes" dispatch line described in govbridge/notes/cli.py'
