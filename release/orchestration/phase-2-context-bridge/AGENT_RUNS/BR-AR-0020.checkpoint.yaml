lessons:
- 'a fixture that only pins the DESCRIBED symptom (e.g. a string item_id citation for "whole-document citation")
  can silently already pass pre-repair if the pre-repair code happens to handle that particular shape correctly;
  the fail-before/pass-after check (swap in the git HEAD file, rerun) catches this immediately and should be run
  for every regression test, not assumed from reading the defect description alone'
- 'a regex-based transcript classifier (extract_reads.py) cannot fully distinguish "a path argument to a query
  command" from "a path that is itself being executed" without either parsing the shell properly or hard-coding
  the invoking program''s name (which would fight OC-BR-02''s genericity rule) -- the selector-syntax signal
  (a mandatory `:start[-end]` suffix) is a robust, generic way to catch the ARGUMENT case cleanly; the invoked-
  program-name case is a smaller, separate residual gap, disclosed rather than silently left'
- 'FOLLOW-UP 1: a synthetic-fixture test suite proves a heuristic does what it was CODED to do; only running the
  real grader over the real, held-out oracle (something only the orchestrator can do, by design) can show that
  what it was coded to do is the WRONG rule. A text-scan-based [D] approximation of an [R] check should default to
  PENDING_RUBRIC on a hit, never FAIL, from the start -- this is now the standing rule for every such check in this
  module, not a one-off fix for the withdrawn-finding scan alone'
- 'FOLLOW-UP 2: when an orchestrator''s description of a defect ("the merged grader matches on exact unit-id
  equality only") does not match what direct testing of THIS branch''s own code shows, re-verify empirically
  before changing anything -- the description may describe a different evaluation (e.g. after a merge with other
  builders'' work) than this run''s own, unmerged branch state. Adding the requested regression coverage either
  way is still valuable: it locks the correct behaviour in for whatever gets merged next'
