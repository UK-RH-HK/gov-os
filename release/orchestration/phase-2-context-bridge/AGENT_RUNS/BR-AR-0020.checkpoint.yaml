findings:
- 'grade.py already implemented BR-ARCH-RULING-1 Addendum A1 (G3''s lifecycle-UNKNOWN-in-A reading) before this node
  started -- that logic was NOT touched; only the GD-1..GD-10/OBS-BR-05 defects this node owns were fixed'
- 'GD-3 and GD-8 are the SAME underlying gap in `anchor_matches`''s record-id branch (it returned on record_id
  presence alone, never falling through to the section rule, and `_resolve_citation` could not read a record_id
  off a raw citation object at all) -- one rewrite, two named regression tests, one per REPAIR_PLAN.md''s own
  defect id'
- 'GD-9''s AUTH gating is implemented fully generically: `grade_g3` gates whatever item ids a supplied rubric
  file names under `auth_gating`, never a hard-coded AUTH-1..4 (or any other) id set -- satisfying OC-BR-02 while
  still implementing D-3''s "AUTH items are gated under G3 ... on the answers by the rubric" rule'
- 'GD-10 required a real, git-backed repository (the code store is commit-addressed) -- reused
  tests/fixtures/compile/compile_repobuilder.py''s existing `cx_rule` Rust function (lines 2-4 of
  runtime/src/cx_module.rs) rather than authoring a new code fixture, since it already exists, is generic and is
  already depended on by tests/integration/test_demo_grade.py'
- 'the pre-repair grade.py''s `anchor_matches` line-less-anchor fallback (`return bool(anchor.get("section")) or
  True`) is dead code that always evaluates True; while fixing GD-10 this was found to ALSO wrongly match a
  symbol-qualified anchor against every other line in the same file when the anchor carried no lines of its own --
  fixed as part of GD-10''s rewrite (a symbol-qualified anchor with no line range now requires an actual symbol
  match, never falls through to "path+commit is enough")'
failed_approaches:
- 'first GD-8 regression test used a string item_id citation (`"T-REC-1"`) for the "whole-document citation"
  case -- this already resolved correctly in the PRE-repair code too (the string-citation branch always read
  record_id off `items_by_id`), so the test passed both before and after and pinned nothing. Replaced with a raw
  citation OBJECT naming only `record_id` (no path/commit) -- the actual pre-repair gap
  (`_resolve_citation`''s dict branch required "path" or "commit" present, so this exact shape resolved to `None`
  and could never match anything) -- verified to fail pre-repair and pass post-repair'
- 'first GD-10 regression test''s negative control (a citation OUTSIDE the symbol''s body) unexpectedly passed
  (returned True) even in the FIRST repaired version, because the anchor had no `lines` of its own and the
  existing "line-less anchor: path+commit is enough" fallback matched regardless of the symbol check -- fixed by
  making a symbol-qualified anchor with no line range require an actual symbol match (see findings)'
- 'first GD-6 test used a scratch wrapper script name (mirroring REPAIR_PLAN.md''s own illustrative
  `gq.sh exact ...` example) as the Bash command; the wrapper''s own name (ending `.sh`) was itself picked up as a
  false "read" by the generic bare-file-token scan -- a real, but SEPARATE, residual imprecision from the one
  GD-6 defect actually names (the wrapper''s ARGUMENTS being parsed as reads). Rewrote the fixture to invoke
  govbridge directly (no wrapper script name in the command), which cleanly exercises the named defect without
  tripping the separate, out-of-scope imprecision (recorded in the report''s open_issues, not fixed)'
unresolved:
- 'GD-7/D-5''s "task inputs in section I count once" packet-byte-accounting clause (as opposed to the
  external-read-window accounting this repair fixes) -- see the report''s open_issues for why this was left as a
  flagged, not fixed, gap'
- 'extract_reads.py''s residual false-positive on an invoked wrapper script''s own name -- see report open_issues'
- second acceptance check is orchestrator-only/quarantined by the node's own routing; not run by this builder
decisions:
- 'implemented D-1..D-5 exactly as BR-ARCH-RULING-2 rules them, not REPAIR_PLAN.md section 8.1''s pre-ruling
  analyst recommendations (D-1''s "delivered coverage" and D-2''s "per-fact stage/chain binding" in particular) --
  per this node''s brief'
- 'D-2 required no grade.py change: it binds a must_state fact to its STAGE (existing [R] rubric text, unchanged),
  which is oracle-authoring guidance for R1-TA2, not a grader mechanism; no stage/chain field or logic was added'
- 'GD-6''s "exclude supplied inputs" was implemented as: any path already present in a compiled packet''s own
  manifest (any section), in the task spec''s own `required_inputs`, or in the receipt''s own
  `outputs_produced`/`inputs_consumed` -- rather than requiring a second, separate "supplied inputs" list, since
  the packet/task-spec/receipt already say exactly what was supplied'
- 'GD-6''s "agent''s own outputs" was implemented as: a shell redirection (`>`/`>>`) or `--out`/`-o` target within
  the SAME command, PLUS the D-4 `run-<n>/` path rule (which also covers re-reading that same output back in a
  LATER command, the shape REPAIR_PLAN.md''s own `gq.sh` example shows) -- rather than tracking write history
  across the whole transcript, which would need state extract_reads.py does not otherwise keep'
- 'no existing test file was modified (test_demo_grade.py, test_extract_reads.py both stay byte-identical to
  HEAD) -- every new assertion lives in the new test_demo_grade_regressions.py file the node names, so REPAIR-1
  rule 5''s "list and justify every modification" has nothing to list'
lessons:
- 'a fixture that only pins the DESCRIBED symptom (e.g. a string item_id citation for "whole-document citation")
  can silently already pass pre-repair if the pre-repair code happens to handle that particular shape correctly;
  the fail-before/pass-after check (swap in the git HEAD file, rerun) catches this immediately and should be run
  for every regression test, not assumed from reading the defect description alone'
- 'a regex-based transcript classifier (extract_reads.py) cannot fully distinguish "a path argument to a query
  command" from "a path that is itself being executed" without either parsing the shell properly or hard-coding
  the invoking program''s name (which would fight OC-BR-02''s genericity rule) -- the selector-syntax signal
  (a mandatory `:start[-end]` suffix) is a robust, generic way to catch the ARGUMENT case cleanly; the invoked-
  program-name case is a smaller, separate residual gap, disclosed rather than silently left'
next_consumer: 'R1-INT (the generic-rule/OC-BR-02 audit and integration node), which depends on R1-RG among others;
  R1-DEC''s D-1..D-5 are now implemented in code exactly as BR-ARCH-RULING-2 rules them, so any later
  node/verifier reading grade.py can rely on that. R1-GA3/R1-RS (compiler work) should re-check GD-7/D-5''s
  packet-byte "task inputs count once" clause once real supplementary packets exist (see open_issues -- not
  something R1-RG could exercise without those packets)'
