lessons:
- 'a zero is only as good as the method that produced it: three false zeros here came from code paths the builders'' own tests never reached (a
  shaped connection built with path='''', a two-line citation form, route gating inside compile)'
- '`compile` and `gather` answer the same query differently (1 vs 6 follow-up rounds, 98-127 vs 637-671 items) because compile gates the routes
  the follow-up needs; any acceptance measured on `gather` alone says little about the packet'
- a read-only check must compare CONTENT, not only status and store sha256
- 'pin the view first: the orchestrator committed mid-audit and only the two commands that cannot take a view noticed'
