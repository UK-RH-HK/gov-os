    # all 40 tests/compile/** tests pass: the 34 pre-existing node-B6 tests unmodified, plus the 6 new
    # BR-ARCH-RULING-1 tests (4 in test_compile_mandatory_lifecycle_in_a.py, 2 in
    # test_compile_real_view_mandatory_in_a.py).
  - cmd: |
      GOVBRIDGE_STORE=$HOME/.cache/gov-bridge/store-BR-AR-0013 PYTHONPATH=$D $PY -c "
      import json
      from govbridge.core.yamlutil import load_yaml_file
      from govbridge.compile import packet as packetmod
      from govbridge.compile import validate as validatemod
      from govbridge.route.router import FAKE_ROUTES

      task_spec = load_yaml_file('$D/ARCHITECTURE/demonstration-task.yaml')
      r1 = packetmod.compile_packet(task_spec, routes=FAKE_ROUTES)
      r2 = packetmod.compile_packet(task_spec, routes=FAKE_ROUTES)
      print('run1_status', r1['status']); print('run2_status', r2['status'])
      print('rendered_identical', r1['rendered'] == r2['rendered'])
      print('packet_sha256_run1', r1['packet_sha256']); print('packet_sha256_run2', r2['packet_sha256'])
      print('packet_sha256_equal', r1['packet_sha256'] == r2['packet_sha256'])
      m = r1['manifest']
      problems = validatemod.verify_packet(m, task_spec, registry_path=r1['registry_path'])
      print('validate_problems', problems)
      print('A_item_count', len(m['sections']['A']['items']))
      a_ids = sorted(it['unit']['id'] for it in m['sections']['A']['items'])
      print('A_ids', a_ids)
      for target in ('state:bridge#contract_v3', 'PHASE-2-FROZEN-GATE-CONTRACT', 'OWNER-LAUNCHER-BR-0001'):
          print('required-in-A:', target, '->', target in a_ids)
      d2 = m['sections']['D']['subblocks']['D.2']['items']
      d3 = m['sections']['D']['subblocks']['D.3']['items']
      f_items = m['sections']['F']['items']
      print('D2_ids', [it['unit']['id'] for it in d2])
      print('D3_ids', [it['unit']['id'] for it in d3])
      print('F1-DIRECTION only in D.2:', all(it['unit']['id'] != 'F1-DIRECTION' for sec, s in m['sections'].items() for it in (s['items'] if sec != 'D' else []) ) )
      notices_by_type = {}
      for n in m['notices']:
          notices_by_type.setdefault(n['type'], []).append(n['id'])
      print('notice_types', {k: sorted(v) for k, v in notices_by_type.items()})
      print()
      print('=== per-item section map (run1) ===')
      section_map = {}
      for letter, sec in m['sections'].items():
          if letter == 'D':
              for sub, subsec in sec['subblocks'].items():
                  for row in subsec['items']:
                      section_map[row['unit']['id']] = sub
          else:
              for row in sec['items']:
                  section_map[row['unit']['id']] = letter
      print(json.dumps(section_map, indent=1, sort_keys=True))
      "
    # the real-view acceptance check (BR-HO-0013): compiles the REAL ARCHITECTURE/demonstration-task.yaml with
    # FAKE_ROUTES (--fake-routes' Python-API equivalent, same as BR-AR-0008's own check2) TWICE, and prints the
    # per-item section map BR-HO-0013 asks to be saved as a checkpoint output -- this output file IS that map.
    exit_code: 0
    output_path: release/orchestration/phase-2-context-bridge/AGENT_RUNS/BR-AR-0013.check2-realview-compile-twice.out
    output_sha256: 2541e2c6579a01ad188e25bd25ded47e219cb3c7f8836d9d0992f33b0402d5da
