# RoT-1 revision 7 — certified production profile CP-1 (machine-readable). PROPOSED architecture artefact; not approved, not
# active, not implemented. Normative text: `35-CERTIFIED-PROFILE.md`. Source of the owner selections: the verbatim owner text of
# release/orchestration/phase-1/GATES/OWNER-DESIGN-REQUIREMENTS-0001.md (binding design inputs, not D-0008 approval).
#
# This file is read by: the revision-7 reference executor (compiled constants), the revision-7 derivation calculator (the only
# production configuration), `decision-register/register_check.py` (excluded and informational inputs) and
# `evidence/r7/PROF7-profile-conformance.py` (every exclusion checked against its enforcing mechanisms).
