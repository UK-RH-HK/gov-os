certified_targets:
  rule: "A target is labelled CERTIFIED only when every criterion CC-1…CC-9 holds for gov and gov-admit on that target; otherwise it is NOT CERTIFIED. There is no fallback."
  criteria:
    CC-1: "bit-for-bit reproduction of gov and gov-admit by at least 2 of the 3 reproducer roles (OP-9 (b)); no mismatching valid reproduction"
    CC-2: "matching builds from at least two supplier classes that are independent by provenance: distinct base OS/build image lineage, package source, build-system provenance and signing/control infrastructure; disjoint pinned checksum keys; disjoint component digests (OP-16 (b))"
    CC-3: "diverse double-compilation agreement: the registered compiler rebuilt through at least two toolchain lineages independent by provenance (at least one not rooted in an upstream binary compiler archive) yields bit-identical gov and gov-admit (OP-10 (b))"
    CC-4: "static, self-contained linking: no program interpreter, no DT_NEEDED entry, CRT and linker from the registered toolchain (OP-16 (b) static/self-contained)"
    CC-5: "environment manifests derived by gov-envmanifest/1 from the environment lock of the registered source, each reproduced identically by at least 2 of 3 environment reproductions"
    CC-6: "gov-admit for the target registered, reproduced (CC-1…CC-5), verified by two records, and listed in a first-contact authority record at root threshold"
    CC-7: "the protected admission store and protected install locations of `31` §5 implemented for the target's OS (TCB-location predicate)"
    CC-8: "the shared conformance vectors (FA7, CUR7, ADM7, PROF7 shapes) pass on the target's gov and gov-admit"
    CC-9: "the Trust Policy lists the target in certified_targets at root threshold, citing the CC-1…CC-8 evidence digest"
  initial_target_set:
    - {target: x86_64-unknown-linux-musl, status: NOT_CERTIFIED_PENDING_CRITERIA, reason: "static musl target with the toolchain's self-contained CRT and linker; no CC evidence exists before implementation"}
    - {target: aarch64-unknown-linux-musl, status: NOT_CERTIFIED_PENDING_CRITERIA, reason: "as above"}
  not_in_initial_set: ["*-linux-gnu (dynamic glibc)", "*-apple-darwin", "*-pc-windows-msvc"]

