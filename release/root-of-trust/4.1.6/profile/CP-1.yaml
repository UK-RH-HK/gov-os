# Each exclusion names: the owner text or unselected answer it removes; how it is absent or refused; the test that fails if it
# becomes reachable. Mechanism kinds: schema (a JSON pointer that must not exist, or a const/enum that excludes the value),
# compiled (a constant of the certified executors with no switch), refusal (the typed refusal of the reference executor when the
# excluded input is presented), register (decision-register row with role `excluded`), calculator (absent from the production
# configuration; present only in labelled non-production controls).
exclusions:
