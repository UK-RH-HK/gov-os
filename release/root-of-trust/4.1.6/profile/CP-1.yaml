    owner_text: "witness service"
    removes: "OP-7 (c) expiring freshness witnesses; the freshness-witness purpose and statement"
    mechanisms:
      schema: ["trust-root.schema.json#/properties/purposes/properties/freshness-witness (absent)", "trust-policy-statement.schema.json#/properties/bootstrap/properties/witness_max_validity_hours (absent)", "freshness-witness.schema.json moved to schemas/withdrawn-non-production/"]
      compiled: "TYPE_PURPOSE has no freshness-witness type"
      refusal: "a witness statement is not a statement type (ignored); a root granting freshness-witness is PROFILE_NONCONFORMANT"
      calculator: "no WR victim class in the production configuration"
    test: [RT-190, PROF7:EX-01]
  - id: EX-02
    owner_text: "helper-machine admission"
    removes: "OP-12 (c)"
    mechanisms:
      schema: ["admission-record.schema.json#/properties/admitter_kind const compiled-gov-admit"]
      compiled: "an admission record is honoured only when its admitter digest is listed in the first-contact authority record named by the effective Trust State (GB-1″)"
      refusal: "RECORD_ADMITTER_NOT_LISTED"
    test: [RT-190, PROF7:EX-02]
  - id: EX-03
