# RoT-1 decision register (rule FD-1, `29` §4; R-SEL-1…R-SEL-4) — revision 7, certified profile CP-1. PROPOSED, not approved,
# not implemented. Source of `29` §4 (rendered by register_check.py --write) and of the binary's compiled register (R-SEL-1).
# Revision 7 (review r6 CD6-4): completeness is checked over every INPUT VALUE with its role and establishing party:
#   decisions         every trust decision: selectors (authority; currency; established by), restrictors, carriers, rules, tests
#   inputs            every leaf field of every certified schema (C9)
#   procedure_inputs  every input no schema holds (C10), each with a test whose input does not come from this file
#   excluded_inputs   every exclusion of profile/CP-1.yaml (C11)
schema: governance-os.decision-register/2
revision: 7
profile_id: governance-os.rot1/CP-1
authority_ranks:
  1: the root threshold (2 of 3)
  2: a quorum of at least two distinct single-purpose keys each establishing the fact first-hand; or local machine authority (a human typing values read now from both first-contact sources, a protected operator pin within its validity, a local confirmation)
  3: one key of one purpose
  4: the repository writer, project configuration, the governed account
  5: transport, unauthenticated input, the pipeline, the artefact under judgement
rule_scope:
  files: [05-KEY-MANAGEMENT.md, 19-ELIGIBILITY-AND-SECURITY-FLOOR.md, 24-FRESHNESS-ANCHORING-AND-MACHINE-BOOTSTRAP.md, 25-BINARY-AND-TRUST-BASE-AUTHENTICITY.md,
          30-RELEASE-REGISTRATION-AND-REPRODUCTION.md, 31-INDEPENDENT-ADMISSION.md, 32-FIRST-CONTACT-ROOT.md, 33-BUILD-ENVIRONMENT.md,
          34-FIRST-HAND-CONSTITUTIONAL-CONTENT.md, 35-CERTIFIED-PROFILE.md]
  prefixes: [AP-R, AP, FC, R-REG, R-VER, R-REP, R-PUB, R-BENV, R-CON, R-ADM, GB, R-CER, IR-REP, KS, R-FCA, R-FCS, R-FCD, R-STORE, R-ANC, R-CLK, R-CUR]
  file_prefixes: {19-ELIGIBILITY-AND-SECURITY-FLOOR.md: [E], 35-CERTIFIED-PROFILE.md: [EX, CC]}
  ranges:
    - {text: "KS-3…KS-8", expands_to: [KS-3, KS-4, KS-5, KS-6, KS-7, KS-8]}
instruments:
  CS7: evidence/r7/CS7-derivation-calculator.json
  FA7: evidence/r7/FA7-first-contact-authority.json
  CUR7: evidence/r7/CUR7-first-contact-currency.json
  ADM7: evidence/r7/ADM7-admission-stores.json
  ENV7: evidence/r7/ENV7-environment-authority.json
  PROF7: evidence/r7/PROF7-profile-conformance.json
  BA11r7: evidence/r7/BA11r7-machine-classes.json
  BA12r7: evidence/r7/BA12r7-key-subsets-below-threshold.json
  CRASH7: evidence/r7/LAY7/crashmig7.json
  P4r6: evidence/r6/P4r6-conformance-oracle.json
  DA03r6: evidence/r6/DA03r6-oracle-regression-sensitivity.json
  CON6: evidence/r6/CON6-first-hand-constitutional-content.json
  UW6: evidence/r6/UW6-user-writable-install.json
  SRC6: evidence/r6/SRC6-source-identity-v2.json
  CSI: evidence/r6/CSI6-selftest.json
  ATTR6: evidence/r6/ATTR6-gitattributes-condition.json
  LAY6: evidence/r6/LAY6/LAY6-comparison.json

decisions:
  - id: DR-01
    decision: TCB acceptance of binary B, running mode
    confers: T0
    selectors:
      - input: source identity, input manifest, environments, toolchains, content, final, targets, binary digests
        authority: the 2-of-3 delegated release registration (rank 2)
        currency: referenced by the selected Trust State
        established_by: each signing registration custodian, first-hand (30 R-REG-3 (a)–(h))
        calculator: {strategy: registration_routes, goals: [G_SRC, G_INPUTS]}
      - input: bytes
        authority: two first-hand reproductions by distinct single-purpose reproducer keys from two independent supplier classes and toolchain lineages, equal to the registered digest (rank 2)
        currency: reproductions of the registered release
        established_by: the reproducers' own builds and the custodians' own reproduction
        calculator: {strategy: build, goals: [G_BYTES]}
      - input: publication and negatives
        authority: the selected Trust State (2 of 3 trust-state keys within the anchored chain)
        currency: inclusion anchor plus a currency proof of at most 24 hours naming that Trust State
        established_by: the trust-state key holders at threshold; currency from both sources' state codes typed or pinned by the operator
        calculator: {strategy: thief_selectable, goals: [G_BYTES], rule: V_P1_NAMES_STATE}
    restrictors:
      - {rule: "AP-4 negatives (binary, registration, registered final and candidate)", scenarios: ["FA7:R1_registered_final_revoked", "FA7:R2_registered_candidate_revoked", "P4r6:R6-AP-R1_registered_final_revoked"]}
      - {rule: "AP-4 binary floor", scenarios: ["FA7:R4_binary_below_min_binary_version"]}
      - {rule: "AP-5 two verification records from distinct keys, executions and reports", calculator_rule: V_VERIFICATION_COUNT, scenarios: ["FA7:R6_two_signatures_over_one_verification_execution", "FA7:count_attestation_signatures"]}
      - {rule: "AP-5 REJECTED attestation", calculator_rule: V_REJECTED, scenarios: ["P4r6:R6-AP5r_trust_state_revocation_does_not_clear_REJECTED", "DA03r6:R6-A4b-ignores-REJECTED"]}
      - {rule: "AP-5 registration referenced by the selected Trust State", calculator_rule: V_REGISTRATION_REFERENCED, scenarios: ["DA03r6:R6-registration-not-referenced"]}
      - {rule: "AP-6 reproducer quorum 2", calculator_rule: V_QUORUM, scenarios: ["FA7:quorum_one", "DA03r6:R6-single-signature"]}
      - {rule: "AP-6 conflict", calculator_rule: V_CONFLICT, scenarios: ["FA7:conflicting_reproduction_refuses", "DA03r6:R6-conflict"]}
      - {rule: "AP-6 registered binary digest (OP-9 (d))", calculator_rule: V_OP9D_DIGEST, scenarios: ["FA7:R10_registered_binary_digest_differs"]}
      - {rule: "AP-6 supplier classes and toolchain lineages by provenance", calculator_rule: V_ENV_DIVERSITY, scenarios: ["FA7:R7_reproductions_from_one_supplier_class", "FA7:R9_second_toolchain_is_a_relabelled_upstream_lineage"]}
      - {rule: "AP-7 publication", calculator_rule: V_PUBLISHED, scenarios: ["DA03r6:R6-A5-publication-not-required"]}
      - {rule: "AP-8 TBM and accepted-TBM high-water", scenarios: ["CUR7:rollback_to_admitted_R8_runs_C2", "DA03r6:R6-first-run-record"]}
      - {rule: "AP-3 currency proof names the selected Trust State", calculator_rule: V_P1_NAMES_STATE, scenarios: ["DA03r6:R6-descendant-proof"]}
      - {rule: "AP-SEC computed security minimum", scenarios: ["FA7:R11_release_below_computed_security_minimum"]}
    carriers: [Git host, pipeline, mirrors, bundles, download host]
    rules: [AP-0, AP-2, AP-3, AP-4, AP-5, AP-6, AP-7, AP-8, AP-9, AP-10, R-REG-1, R-REG-2, R-REG-4, R-REP-1, R-REP-3, R-REP-4′, R-REP-6, R-REP-7, R-REP-8, R-PUB-3]
    tests: [RT-134, RT-129, RT-153, RT-165, RT-188]
    specified_in: ["25 §5", "30 §5–§8"]

  - id: DR-02
    decision: TCB acceptance at first admission and re-admission (bootstrap mode)
    confers: T0 on a machine with no prior trust, or a re-admitted machine
    selectors:
      - input: lineage, evaluator and state through DR-03…DR-06 and DR-36…DR-39
        authority: the First-Contact Authority record at root threshold and the Trust State both sources publish (rank 1 and rank 2)
        currency: codes read now from both sources; state at most 24 hours old
        established_by: the root custodians (FCA), the trust-state key holders at threshold and each source custodian's first-hand verification
        calculator: {strategy: binary_accepted, goals: [G_BYTES, G_CONTENT]}
    restrictors:
      - {rule: "AP-4…AP-8 in gov-admit (shared vectors R1–R16)", scenarios: ["FA7:S4_every_vector_refused_control_accepted", "FA7:R3_attestation_for_another_candidate_same_source"]}
      - {rule: "candidate never executed; self-evaluation refused", scenarios: ["FA7:honest_workstation"]}
    carriers: [download host, bundles, Git host, media]
    rules: [AP-1, R-ADM-1″, R-ADM-4, R-ADM-5, R-ADM-10, R-ADM-11, R-ADM-12, R-ADM-14]
    tests: [RT-135, RT-136, RT-184]
    specified_in: ["31 §3–§4", "25 §5", "32"]

  - id: DR-03
    decision: First-contact lineage selection
    confers: the root chain on a machine with no prior trust
    selectors:
      - input: lineage of the admitter build and of the FCA
        authority: the root ceremony (rank 1), compiled into every registered admitter build
        currency: the admitter build
        established_by: the root custodians; the registration of the admitter release
        calculator: {strategy: fc_lineage_sub, goals: [G_BYTES, G_CONTENT], rule: V_FC_LINEAGE}
    restrictors:
      - {rule: "FC-6 lineage never from bundle order", calculator_rule: V_FC_LINEAGE, scenarios: ["FA7:bundle_order_attacker_root_first"]}
      - {rule: "FC-7′ compiled lineage in every admitter build", calculator_rule: V_FC_LINEAGE, scenarios: ["FA7:both_pages_attacker_lineage_genuine_admitter", "FA7:authority_of_attacker_lineage"]}
    carriers: [bundles, download host]
    rules: [FC-6, FC-7′, R-ADM-3″]
    tests: [RT-156, RT-158, RT-184]
    specified_in: ["32 §7", "25 AP-2"]

  - id: DR-04
    decision: First-contact state selection
    confers: the selected Trust State (publication, negatives) at first admission
    selectors:
      - input: the Trust State named by the state code both sources show
        authority: 2 of 3 trust-state keys, published by both source custodians after first-hand verification (rank 2)
        currency: at most 24 hours old (FC-9)
        established_by: the trust-state key holders at threshold; each source custodian (R-FCS-2)
        calculator: {strategy: sources_publish_thief_state, goals: [G_BYTES, G_REVOKED]}
    restrictors:
      - {rule: "FC-10 state binding at the trust-state threshold, naming the FCA", calculator_rule: V_TS_THRESHOLD, scenarios: ["FA7:genuine_authority_state_signed_by_one_trust_state_key", "FA7:trust_state_threshold_1"]}
      - {rule: "R-FCS-2 descendant without dropped revocations", calculator_rule: H_SOURCE_FIRST_HAND, scenarios: ["FA7:two_trust_state_keys_descendant_drops_revocation"]}
    carriers: [bundles, download host]
    rules: [FC-10]
    tests: [RT-156, RT-184, RT-191]
    specified_in: ["32 §4, §7", "25 AP-3"]

  - id: DR-05
    decision: First-contact source quorum
    confers: that both sources agree on every first-contact value
    selectors:
      - input: the compiled quorum of gov-admit (2) and the operator reading both sources
        authority: the registration of the admitter release (rank 2); the operator reading both sources now (rank 2 local authority)
        currency: the admitter build; now
        established_by: the owner requirement OP-13 (b) compiled into the admitter; the operator (TA-5′)
        calculator: {strategy: pages_agree_on_attacker_value, goals: [G_BYTES], rule: V_FC_COMPILED_QUORUM}
    restrictors:
      - {rule: "FC-4′ compiled quorum", calculator_rule: V_FC_COMPILED_QUORUM, scenarios: ["FA7:procedure_one_source", "FA7:quorum_one"]}
      - {rule: "FC-1′ codes and procedure digest identical across both sources", scenarios: ["FA7:procedure_state_codes_disagree", "FA7:procedure_procedure_digest_disagrees"]}
    carriers: [both sources as carriers of the codes]
    rules: [FC-4′]
    tests: [RT-156, RT-158]
    specified_in: ["32 §6–§7"]

  - id: DR-06
    decision: Evaluator selection at first admission
    confers: which code evaluates the first TCB
    selectors:
      - input: admitters[target] of the FCA the trust code names, compared with the platform hash tool
        authority: the FCA at root threshold (rank 1), issued after the admitter's registration, reproduction and verification
        currency: now
        established_by: the root custodians checking the admitter evidence first-hand (R-FCA-1); the operator's platform hash tool
        calculator: {strategy: fc_eval_sub, goals: [G_BYTES, G_CONTENT], rule: V_FC_EVALUATOR}
    restrictors:
      - {rule: "FC-3′ admitter digest in the FCA", calculator_rule: V_FC_EVALUATOR, scenarios: ["FA7:procedure_substituted_admitter_bytes"]}
      - {rule: "FC-8′ evaluator binding (listed, not revoked, target certified)", scenarios: ["FA7:skip_evaluator_binding", "CUR7:readmission_store_holds_the_admitter_revoked"]}
    carriers: [owner site, download host, media]
    rules: [FC-8′, R-ADM-2″]
    tests: [RT-157, RT-159, RT-184]
    specified_in: ["32 §6–§7", "31 R-ADM-2″"]

  - id: DR-07
    decision: Evaluator of later binaries
    confers: acceptance of binary N+1
    selectors:
      - input: the admitted gov N
        authority: its own admission (DR-02 or DR-01)
        currency: its admission record within validity
        established_by: gov-admit or the admitted gov that accepted it
        outside_calculator: "the evaluator is the TCB accepted by DR-01/DR-02; bounded by GB-1″…GB-7"
    restrictors:
      - {rule: "GB-3′ own revocation: C0-R only (OP-15 (a))", scenarios: ["ADM7:X15_revoked_self_C0_R_only"]}
    carriers: []
    rules: [GB-3′]
    tests: [RT-137, RT-185]
    specified_in: ["31 §3, §5"]

  - id: DR-08
    decision: Bytes that run as gov
    confers: the enforced TCB bytes
    selectors:
      - input: the bytes the evaluator measured, installed from its buffer
        authority: the evaluator of DR-02/DR-07
        currency: at installation
        established_by: the evaluator's single read of the candidate
        outside_calculator: "same-account replacement is A3 (RS-3); GB-4′ and GB-6 bound C3 and ceremonies"
    restrictors:
      - {rule: "GB-4′ TCB-location predicate for C3 and ceremonies", scenarios: ["UW6:ceremonies_refused_on_user_writable_install", "ADM7:C3_user_writable_executable"]}
      - {rule: "GB-6 effective uid 0 writable", defence_in_depth: true, load_bearing: "GB-4′ (UW6)"}
      - {rule: "R-ADM-6 installation from the buffer; crash between install and record", scenarios: ["ADM7:A08_fail_closed"]}
    carriers: [file system]
    rules: [R-ADM-6, GB-4′, GB-5, GB-6]
    tests: [RT-138, RT-139, RT-171]
    specified_in: ["31 §4–§5, §7.1"]

  - id: DR-09
    decision: Admission record honoured (genuine-binary rule) and ceremony order
    confers: C0–C3 and ceremonies for a running binary
    selectors:
      - input: an admission record in the protected admission store naming the running digest, with a listed compiled admitter
        authority: gov-admit (DR-02)
        currency: valid_until (90 days workstation, 7 days CI image)
        established_by: gov-admit, writing only the protected store under its lock
        outside_calculator: "local store integrity (TA-9); an administrator-level attacker is outside the model (store_admin atom in G_REVOKED)"
    restrictors:
      - {rule: "GB-1″ records honoured only inside the protected store with a listed admitter", scenarios: ["ADM7:A15_records_outside_protected_store", "ADM7:EX02_helper_machine_admitter_not_listed", "ADM7:L9_store_name_is_full_lineage"]}
      - {rule: "GB-2′ expiry and clock", scenarios: ["ADM7:X14_record_expiry", "ADM7:CLK_clock_below_high_water"]}
    carriers: [file system]
    rules: [R-ADM-7″, R-ADM-9, GB-1″, GB-2′, R-CER-1, R-CER-2′, R-CER-3, R-CER-4]
    tests: [RT-137, RT-171, RT-185]
    specified_in: ["31 §4–§6"]

  - id: DR-10
    decision: First admission versus re-admission
    confers: whether the account verifier trust store is moved aside
    selectors:
      - input: the first-admission marker of the protected admission store for the lineage
        authority: gov-admit's protected store (rank 2 local authority)
        currency: at admission, under the lock
        established_by: gov-admit (R-STORE-2); never a file the governed account can write
        outside_calculator: "store integrity; RV6-M6 closed by R-STORE-2 (ADM7 A07)"
    restrictors:
      - {rule: "R-ADM-8″ move-aside only at first admission, decided by the protected store", scenarios: ["ADM7:A07_first_admission_decided_by_protected_store_only", "ADM7:A07_mutant_detected", "ADM7:A09_readmission"]}
      - {rule: "R-ADM-13 exclusive lock", scenarios: ["ADM7:A11_concurrent_first_admissions"]}
    carriers: [file system]
    rules: [R-ADM-8″, R-ADM-13, R-STORE-1, R-STORE-2]
    tests: [RT-139, RT-170, RT-181]
    specified_in: ["31 R-ADM-8″, R-ADM-13, §4.2"]

  - id: DR-11
    decision: Source identity of release R
    confers: F-SRC
    selectors:
      - input: source {release_commit, git_tree, content_digest v2}
        authority: the 2-of-3 registration (rank 2)
        currency: at registration
        established_by: each signing custodian recomputing from its own fetch, with two first-hand verification records
        calculator: {strategy: registration_routes, goals: [G_SRC]}
    restrictors:
      - {rule: "R-REG-3 (d) two first-hand verification records for exactly the candidate", calculator_rule: H_REG_RECORDS_FIRST_HAND, scenarios: ["P4r6:R6-CER-records_not_first_hand", "DA03r6:R6-ceremony-first-hand-records"]}
      - {rule: "source identity v2 refusals", scenarios: ["SRC6:T1_v2_refuses_carrier_path", "SRC6:T1_v2_encoding_alone_distinguishes"]}
      - {rule: "R-VER-3 verification selects nothing alone", calculator_rule: V_VERIFICATION_COUNT}
    carriers: [Git host, pipeline]
    rules: [R-REG-3, R-REG-9′, R-REG-10, R-VER-3, R-VER-4, IR-REP-4, IR-REP-6]
    tests: [RT-130, RT-172]
    specified_in: ["30 §4.1, §5, §6"]

  - id: DR-12
    decision: Build inputs (toolchain archives, lockfile, build profile)
    confers: F-INPUTS
    selectors:
      - input: input manifest v3 (toolchains, lockfile, environment lock digest, build profile)
        authority: the 2-of-3 registration against the pinned toolchain registry (rank 2)
        currency: at registration
        established_by: each signing custodian checking archives under registry keys or bootstrap registrations first-hand
        calculator: {strategy: registration_routes, goals: [G_INPUTS, G_TOOLCHAIN]}
    restrictors:
      - {rule: "R-REG-3 (a), (c″) checks under pinned keys by custodians", calculator_rule: H_REG_UPSTREAM, scenarios: ["ENV7:A09_checksum_key_named_by_manifest"]}
      - {rule: "R-VER-1′ checks under pinned keys by verifiers", calculator_rule: H_VER_UPSTREAM, scenarios: ["ENV7:A09_checksum_key_named_by_manifest"]}
      - {rule: "R-REP-2′ inputs by digest", calculator_rule: H_REP_BY_DIGEST}
    carriers: [mirrors, caches, CI configuration]
    rules: [R-REP-2′, IR-REP-1, IR-REP-2, IR-REP-3]
    tests: [RT-130, RT-131, RT-133]
    specified_in: ["30 §4.2, R-REG-3"]

  - id: DR-13
    decision: Build environment identity for release R
    confers: F-ENV
    selectors:
      - input: environment_id and environment_tree_digest of each environment of each target
        authority: at least two agreeing environment reproductions under the 2-of-3 registration over that exact identity (rank 2)
        currency: at registration
        established_by: environment reproducers deriving and assembling first-hand; the registration custodians
        calculator: {strategy: build, goals: [G_ENV]}
    restrictors:
      - {rule: "R-BENV-7″ authority needs agreeing reproductions and the registration", calculator_rule: H_REG_ENV_QUORUM, scenarios: ["ENV7:A07a_pipeline_manifest_with_injection", "ENV7:A07b_pipeline_manifest_selects_instrumented_artefacts"]}
      - {rule: "R-BENV-4″ reproducers re-assemble", calculator_rule: H_REP_ENV_REASSEMBLE, scenarios: ["ENV7:A07c_both_classes_same_injection"]}
    carriers: [image registries, mirrors, caches]
    rules: [R-BENV-7″, IR-REP-5]
    tests: [RT-160, RT-161, RT-186]
    specified_in: ["33 §5"]

  - id: DR-14
    decision: Faithful build of a registered release (bytes)
    confers: F-BYTES
    selectors:
      - input: reproductions of the registered source, inputs, environments and toolchains
        authority: 2 of 3 reproducer roles first-hand, and the custodians' own reproduction naming binary_digests (rank 2)
        currency: reproductions of the registered release
        established_by: the reproducers' and custodians' own builds
        calculator: {strategy: build, goals: [G_BYTES]}
    restrictors:
      - {rule: "R-REP-3 first-hand confirmation to the publisher", calculator_rule: H_REP_FIRST_HAND}
      - {rule: "R-REG-3 (f) custodians' own reproduction (OP-9 (d))", calculator_rule: H_REG_OWN_REPRODUCTION}
      - {rule: "R-REP-5′ conflict refuses", calculator_rule: V_CONFLICT, scenarios: ["FA7:trust_state_revocation_of_the_conflict_does_not_clear_it"]}
      - {rule: "05 §7 rule 2 signers sign only what they rebuilt; release-final threshold 2", calculator_rule: H_SIGN_REPRODUCE, scenarios: ["FA7:R15b_candidate_and_final_share_a_key", "FA7:R15_release_final_threshold_1"], defence_in_depth: true, load_bearing: "V_FINAL_THRESHOLD_2 (KS-15)"}
      - {rule: "KS-15 release-final threshold 2", calculator_rule: V_FINAL_THRESHOLD_2, scenarios: ["FA7:R15_release_final_threshold_1"]}
    carriers: [pipeline, download host]
    rules: [R-REP-5′]
    tests: [RT-133, RT-134, RT-153]
    specified_in: ["30 §7"]

  - id: DR-15
    decision: Verification records counted (binding)
    confers: the OP-8 verification restrictor of source, content and bytes
    selectors: []
    shortfall:
      statement: "verification records select nothing; they restrict (TB-4′ when two verification processes are compromised with pipeline input)"
      residual: TB-4′
      test: RT-165
    restrictors:
      - {rule: "R-VER-1′ the verifier attests exactly the candidate, kernel and environments it reproduced", calculator_rule: H_VER_BINDS_CANDIDATE, scenarios: ["FA7:R3_attestation_for_another_candidate_same_source", "FA7:skip_verification_environment"]}
      - {rule: "R-VER-2′ / R-CON-2 counted attestations bound to the registered candidate and kernel; two independent executions", calculator_rule: V_CANDIDATE_BINDING, scenarios: ["FA7:R5_attestation_other_kernel", "FA7:R6_two_signatures_over_one_verification_execution"]}
      - {rule: "R-BENV-8 verification environment named", scenarios: ["FA7:skip_verification_environment"]}
    carriers: [owner ceremony channel]
    rules: [R-VER-1′, R-VER-2′, R-CON-2, R-BENV-8]
    tests: [RT-165]
    specified_in: ["30 §6", "34 R-CON-2", "33 R-BENV-8"]

  - id: DR-16
    decision: Registered constitutional content (kernel tree, non-join units, migrations)
    confers: F-CON
    selectors:
      - input: the constitution and migrations blocks of the registration
        authority: the 2-of-3 registration (rank 2)
        currency: at registration
        established_by: each signing custodian deriving them first-hand from its own kernel build with registered tools
        calculator: {strategy: content_accepted, goals: [G_CONTENT]}
    restrictors:
      - {rule: "R-CON-1 first-hand derivation", calculator_rule: H_REG_CONTENT_FIRST_HAND, scenarios: ["P4r6:R6-CER-D-A01_ceremony_derives_content_first_hand", "CON6:B_ceremony_refuses_CI_derived_registration", "CSI:S72"]}
      - {rule: "R-REG-7 V8 producer restrictor", scenarios: ["P4r6:R6-E7-D-A01_variant_registration_names_attested_candidate"]}
    carriers: [pipeline, kernel payload, Git delivery]
    rules: [R-CON-1, R-REG-6, R-REG-7]
    tests: [RT-163]
    specified_in: ["34 §3", "30 R-REG-3 (g), R-REG-6", "23 §12"]

  - id: DR-17
    decision: Registration effective on a machine
    confers: that release R's registration is known and in force
    selectors:
      - input: the effective or selected Trust State referencing the registration
        authority: 2 of 3 trust-state keys within the anchored chain, or both sources' state code at first contact
        currency: as DR-20 or DR-04
