      - {rule: "AP-R1…AP-R5 re-admission applies the stores", calculator_rule: V_READMISSION_STORE, scenarios: ["CUR7:readmission_T7_value_B7x_store_holds_T11", "CUR7:readmission_T11_B9_store_holds_a_revocation_the_selected_state_lacks", "CUR7:control_readmission_ignores_store_mutant"]}
    carriers: [media, CI images, cached pages]
    rules: [FC-9, AP-R1, AP-R2, AP-R3, AP-R4, AP-R5]
    tests: [RT-191]
    specified_in: ["32 §8", "31 §4.1"]

  - id: DR-40
    decision: Environment lock and derived environment manifest
    confers: component selection, placement and assembly of every environment
    selectors:
      - input: the environment lock of the registered source
        authority: the 2-of-3 registration of the source (rank 2), restricted by two verification records
        currency: at registration
        established_by: the registration custodians (source); every party deriving the manifest with gov-envmanifest/1
        calculator: {strategy: build, goals: [G_ENV], rule: H_ENV_LOCK_IN_SOURCE}
    restrictors:
      - {rule: "R-BENV-2″ selection in source; no content in the lock", calculator_rule: H_ENV_LOCK_IN_SOURCE, scenarios: ["ENV7:A07a_lock_with_inline_content"]}
      - {rule: "R-BENV-3″ derived, never authored", calculator_rule: H_ENV_LOCK_IN_SOURCE, scenarios: ["ENV7:A07a_pipeline_manifest_with_injection", "ENV7:A07b_pipeline_manifest_selects_instrumented_artefacts"]}
      - {rule: "R-BENV-9 registered derivation tools", defence_in_depth: true, load_bearing: "R-BENV-3″ (every party re-derives)"}
    carriers: [pipeline, mirrors]
    rules: [R-BENV-2″, R-BENV-3″, R-BENV-4″, R-BENV-9]
    tests: [RT-186]
    specified_in: ["33 §3–§5"]

  - id: DR-41
    decision: Supplier registry and supplier-class independence
    confers: which component checksums verify and which classes are independent
    selectors:
      - input: Trust Policy supply_chain.suppliers (provenance, checksum keys)
        authority: the root threshold (rank 1)
        currency: held
        established_by: the root custodians inspecting supplier provenance first-hand
        calculator: {strategy: build, goals: [G_ENV], rule: V_SUPPLIER_PROVENANCE}
    restrictors:
      - {rule: "R-BENV-1″ pinned keys only", calculator_rule: V_SUPPLIER_PINNED_KEYS, scenarios: ["ENV7:A09_checksum_key_named_by_manifest"]}
      - {rule: "R-BENV-5″ independence by provenance", calculator_rule: V_SUPPLIER_PROVENANCE, scenarios: ["ENV7:A08_two_labels_over_one_compromised_supplier", "FA7:R8_second_class_is_a_relabelled_first_supplier", "FA7:supplier_class_by_label"]}
      - {rule: "matching reproductions from two independent classes", calculator_rule: V_ENV_DIVERSITY, scenarios: ["FA7:R7_reproductions_from_one_supplier_class", "ENV7:control_one_compromised_class_with_independent_honest_class"]}
    carriers: [mirrors, checksum files]
    rules: [R-BENV-1″, R-BENV-5″]
    tests: [RT-186]
    specified_in: ["33 §5"]

  - id: DR-42
    decision: Toolchain lineages and their independence
    confers: which compiler lineages build production binaries
    selectors:
      - input: Trust Policy supply_chain.toolchains (provenance, archive or bootstrap registration)
        authority: the root threshold (rank 1); a bootstrap lineage's own registration (rank 2)
        currency: held
        established_by: the root custodians inspecting provenance; the bootstrap registration custodians
        calculator: {strategy: build, goals: [G_TOOLCHAIN], rule: V_TOOLCHAIN_DIVERSITY}
    restrictors:
      - {rule: "R-BENV-6″ two lineages independent by provenance", calculator_rule: V_TOOLCHAIN_DIVERSITY, scenarios: ["ENV7:T2_relabelled_toolchain_lineage", "FA7:R9_second_toolchain_is_a_relabelled_upstream_lineage", "FA7:toolchain_class_by_label"]}
      - {rule: "R-REP-9′ upstream archive alone insufficient", scenarios: ["ENV7:T1_upstream_binary_lineage_compromised", "PROF7:EX-15"]}
    carriers: [mirrors, toolchain archives]
    rules: [R-BENV-6″, R-REP-9′]
    tests: [RT-187]
    specified_in: ["33 §5", "30 R-REP-9′"]

  - id: DR-43
    decision: Target certification
    confers: whether a target has any production admission
    selectors:
      - input: certified_targets of the Trust Policy and of the FCA
        authority: the root threshold (rank 1) citing CC-1…CC-8 evidence
        currency: held
        established_by: the root custodians reviewing the criteria evidence first-hand
        outside_calculator: "the calculator models one certified target; uncertified targets are refused (FA7 admission_uncertified_target)"
    restrictors:
      - {rule: "R-FCA-2 and FC-8′ uncertified target refused", scenarios: ["FA7:admission_uncertified_target"]}
    carriers: []
    rules: [CC-1, CC-2, CC-3, CC-4, CC-5, CC-6, CC-7, CC-8, CC-9, R-FCA-2]
    tests: [RT-194]
    specified_in: ["35 §5", "32 R-FCA-2"]

  - id: DR-44
    decision: Operation class permitted on a running machine
    confers: C0-R, C0, C1, C2 or C3
    selectors:
      - input: admission record, clock high-water, own revocation, accepted-TBM, anchor and its validity, currency
        authority: DR-09, DR-21, DR-20, DR-33, DR-35
        currency: at process start and per unit of work
        established_by: as those decisions
        outside_calculator: "decision rule 24 §4.3; executed in ADM7 X7/CLK/X15 and BA11r7"
    restrictors:
      - {rule: "R-ANC-1 unanchored C0", scenarios: ["ADM7:unanchored_C1", "BA11r7:unanchored_C0_only"]}
      - {rule: "R-ANC-5 expiry C0", scenarios: ["BA11r7:expired_anchors_C0_only", "ADM7:workstation_anchor_91d_C2"]}
      - {rule: "OP-5 age warning informational only", scenarios: ["PROF7:EX-07"]}
    carriers: []
    rules: [R-ANC-1, R-ANC-5]
    tests: [RT-189]
    specified_in: ["24 §4.3", "31 §5"]

  - id: DR-45
    decision: Retrieval profile acceptance
    confers: provenance of a reference retrieval profile
    selectors:
      - input: a retrieval-profile statement
        authority: the single-purpose retrieval-profile key (rank 3), profile integrity only
        currency: held
        established_by: the retrieval-profile signing ceremony verifying the profile's files first-hand
        outside_calculator: "confers no trust decision over kernel, release or state (05 KS-16); 10"
    restrictors:
      - {rule: "KS-16 retrieval-profile keys hold no other purpose", defence_in_depth: true, load_bearing: "the CP-1 whitelist (DR-31)"}
    carriers: [registries, download host]
    rules: []
    tests: [RT-46]
    specified_in: ["10", "05 §1"]

