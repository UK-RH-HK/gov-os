  - schema: trust-root.schema.json
    fields:
      - {match: "keys*", role: selector, decision: DR-31, established_by: "the root custodians in ceremony", justification: "key set"}
      - {match: "purposes*", role: selector, decision: DR-31, established_by: "the root custodians; CP-1 shapes compiled", justification: "grants"}
      - {match: "revoked_keys*", role: selector, decision: DR-31, established_by: "the root custodians", justification: "key revocation"}
      - {match: "quorums.reproducer", role: restrictor, decision: DR-31, established_by: "schema const 2"}
      - {match: "lineage.trust_root_id", role: restrictor, decision: DR-03, established_by: "compiled lineage"}
      - {match: profile_id, role: restrictor, decision: DR-22, established_by: "compiled profile"}
      - {match: version, role: restrictor, decision: DR-31, established_by: "the root chain"}
      - {match: "*", role: informational, justification: "framework, profile label and issuance time"}
  - schema: trust-state-pin.schema.json
    fields:
      - {match: state_code, role: selector, decision: DR-21, established_by: "the operator provisioning from both sources"}
      - {match: state_digest, role: selector, decision: DR-21, established_by: "the operator provisioning"}
      - {match: state_sequence, role: selector, decision: DR-21, established_by: "the operator provisioning"}
      - {match: "root_*", role: restrictor, decision: DR-21, established_by: "the operator provisioning", justification: "root reference of the pinned state"}
      - {match: "policy_*", role: restrictor, decision: DR-21, established_by: "the operator provisioning", justification: "policy reference of the pinned state"}
      - {match: machine_class, role: restrictor, decision: DR-21, established_by: "the operator (validity 90 or 7 days)"}
      - {match: valid_until, role: restrictor, decision: DR-21, established_by: "the operator within the class maximum"}
      - {match: provisioned_at, role: restrictor, decision: DR-33, established_by: "the operator; bounded by R-CLK-1"}
      - {match: lineage, role: restrictor, decision: DR-03, established_by: "compiled lineage"}
      - {match: "*", role: informational, justification: "provisioner and note shown only"}
  - schema: trust-state-statement.schema.json
    fields:
      - {match: published_binaries, role: selector, decision: DR-18, established_by: "2 of 3 trust-state keys"}
      - {match: registrations, role: selector, decision: DR-17, established_by: "2 of 3 trust-state keys after the publisher's E7 check"}
      - {match: revocations, role: restrictor, decision: DR-18, established_by: "2 of 3 trust-state keys"}
      - {match: revocation_statements, role: restrictor, decision: DR-18, established_by: "revocation keys at threshold or root emergency"}
      - {match: "references.first_contact_authority*", role: restrictor, decision: DR-36, established_by: "2 of 3 trust-state keys naming the FCA", justification: "FCA in force"}
      - {match: "references.root*", role: restrictor, decision: DR-31, established_by: "2 of 3 trust-state keys", justification: "root in force"}
      - {match: "references.trust_policy*", role: restrictor, decision: DR-32, established_by: "2 of 3 trust-state keys", justification: "policy in force"}
      - {match: "prior_states*", role: restrictor, decision: DR-20, established_by: "2 of 3 trust-state keys (inclusion)", justification: "chain"}
      - {match: previous_state_digest, role: restrictor, decision: DR-20, established_by: "2 of 3 trust-state keys"}
      - {match: sequence, role: restrictor, decision: DR-20, established_by: "2 of 3 trust-state keys; floored by the stores"}
      - {match: issued_at, role: restrictor, decision: DR-39, established_by: "2 of 3 trust-state keys; FC-9 age"}
      - {match: trust_root_id, role: restrictor, decision: DR-31, established_by: "compiled lineage"}
      - {match: "certifications*", role: informational, justification: "certification view; CERTIFIED selects nothing"}
      - {match: "*", role: informational, justification: "framework and profile labels"}
  - schema: verification-attestation.schema.json
    fields:
      - {match: candidate_statement_digest, role: restrictor, decision: DR-15, established_by: "the verifier's own reproduction"}
      - {match: kernel_tree_digest, role: restrictor, decision: DR-15, established_by: "the verifier's own reproduction"}
      - {match: environment_ids, role: restrictor, decision: DR-15, established_by: "the verifier's own derivation (R-BENV-8)"}
      - {match: toolchain_ids, role: restrictor, decision: DR-15, established_by: "the verifier's registered lineages"}
      - {match: inputs_manifest_digest, role: restrictor, decision: DR-15, established_by: "the verifier"}
      - {match: "source.*", role: restrictor, decision: DR-15, established_by: "the verifier's own fetch", justification: "source identity fields"}
      - {match: verdict, role: restrictor, decision: DR-15, established_by: "the verifier"}
      - {match: verification_report_digest, role: restrictor, decision: DR-15, established_by: "the verifier's execution"}
      - {match: verifier_execution_id, role: restrictor, decision: DR-15, established_by: "the verifier's execution"}
      - {match: release_id, role: restrictor, decision: DR-15, established_by: "the verifier"}
      - {match: lifts_negative_statement_digest, role: restrictor, decision: DR-18, established_by: "the verifier issuing a new verdict"}
      - {match: trust_root_id, role: restrictor, decision: DR-31, established_by: "compiled lineage"}
      - {match: "*", role: informational, justification: "label and time shown only"}

procedure_inputs:
  - {id: PI-01, input: "designation of the two first-contact sources (source identities read by the operator)", role: selector, decision: DR-38, established_by: "the root ceremony record delivered at onboarding outside release carriers (R-FCD-1, R-FCD-2)", tests: ["FA7:one_attacker_page_one_genuine_page", "FA7:both_pages_attacker_lineage_genuine_admitter", RT-184]}
  - {id: PI-02, input: "procedure text of the first-contact procedure (FC-PROC)", role: restrictor, decision: DR-38, established_by: "the root ceremony record; its digest is in the FCA", tests: ["FA7:procedure_procedure_digest_disagrees", RT-184]}
  - {id: PI-03, input: "trust codes read by the operator from both sources", role: selector, decision: DR-36, established_by: "each source custodian after first-hand verification (R-FCS-1)", tests: ["FA7:authority_signed_by_one_root_key", RT-184]}
  - {id: PI-04, input: "state codes read by the operator from both sources", role: selector, decision: DR-04, established_by: "each source custodian after first-hand verification (R-FCS-2)", tests: ["FA7:genuine_authority_state_signed_by_one_trust_state_key", RT-191]}
  - {id: PI-05, input: "the trust-state publication process (the revision-6 composer of first-contact values)", role: carrier, decision: DR-37, justification: "it composes no first-contact value: codes are digests of threshold statements each source custodian verifies (INV7-NO-COMPOSER)", tests: ["FA7:control_r6_carrying_sources_and_unverified_authority", "FA7:two_trust_state_keys_descendant_drops_revocation"]}
  - {id: PI-06, input: "platform package submitter (a submitted admitter package under a signing service)", role: excluded, decision: DR-22, justification: "EX-05: no platform root and no submitter path exist", tests: ["FA7:S_package_submitter_signed_package", "PROF7:EX-05"]}
  - {id: PI-07, input: "environment manifest author (a party proposing manifest content)", role: carrier, decision: DR-40, justification: "no author exists: every party derives the manifest; an authored manifest is refused (R-BENV-3″)", tests: ["ENV7:A07a_pipeline_manifest_with_injection", "ENV7:A07b_pipeline_manifest_selects_instrumented_artefacts"]}
  - {id: PI-08, input: "stored first-contact codes (provisioning media, CI image codes, cached or designated pages)", role: restrictor, decision: DR-39, established_by: "the compiled 24-hour ceiling (FC-9) and the stores' floors", tests: ["CUR7:media_prepared_at_T7_used_now", "CUR7:ci_image_codes_provisioned_at_T10_image_built_48h_later", "CUR7:designated_pages_show_genuine_T7_codes_genuine_admitter"]}
  - {id: PI-09, input: "admission clock and the local clock of a running machine", role: restrictor, decision: DR-33, established_by: "the local clock bounded by the recorded high-water (R-CLK-1) and FC-9 (TA-7)", tests: ["ADM7:CLK_clock_below_high_water", "CUR7:stored_codes_with_clock_set_back"]}
  - {id: PI-10, input: "environment lock in the registered source", role: selector, decision: DR-40, established_by: "the 2-of-3 registration of the source restricted by two verification records", tests: ["ENV7:A07a_lock_with_inline_content", "ENV7:A07b_source_authority_control_lock_changed_in_reviewed_source"]}
  - {id: PI-11, input: "supplier provenance registry (Trust Policy supply_chain.suppliers)", role: selector, decision: DR-41, established_by: "the root threshold ceremony", tests: ["ENV7:A08_two_labels_over_one_compromised_supplier", "FA7:R8_second_class_is_a_relabelled_first_supplier"]}
  - {id: PI-12, input: "upstream signed checksum files of environment components", role: carrier, decision: DR-41, justification: "verified only under keys pinned in the supplier registry (R-BENV-1″)", tests: ["ENV7:A09_checksum_key_named_by_manifest"]}
  - {id: PI-13, input: "toolchain provenance registry (Trust Policy supply_chain.toolchains) and bootstrap registrations", role: selector, decision: DR-42, established_by: "the root threshold; the bootstrap lineage's registration", tests: ["ENV7:T2_relabelled_toolchain_lineage", "FA7:R9_second_toolchain_is_a_relabelled_upstream_lineage"]}
  - {id: PI-14, input: "derivation tool and assembly tool (gov-envmanifest/1, gov-envassemble/1, the content derivation checker)", role: restrictor, decision: DR-40, established_by: "an admitted gov or the party's own build of the registered source (R-BENV-9)", tests: ["ENV7:A07c_both_classes_same_injection", RT-186]}
  - {id: PI-15, input: "the operator reading both sources and typing their codes", role: selector, decision: DR-05, established_by: "the operator (TA-5′), restricted by the compiled quorum", tests: ["FA7:genuine_admitter_one_code_typed", "FA7:procedure_one_source"]}
  - {id: PI-16, input: "gov-admit bytes fetched from a carrier", role: carrier, decision: DR-06, justification: "selected by the FCA digest the operator checks with the platform hash tool (FC-3′)", tests: ["FA7:procedure_substituted_admitter_bytes"]}
  - {id: PI-17, input: "candidate binary bytes", role: carrier, decision: DR-02, justification: "the artefact under judgement: measured once, never executed, never a selector (FD-1 (4))", tests: ["FA7:honest_workstation", "FA7:R0_control"]}
  - {id: PI-18, input: "repository request naming which release a project uses", role: carrier, decision: DR-25, justification: "a request only: the local trust gate selects, above the computed security minimum (OP-11 (b))", tests: ["FA7:R11_release_below_computed_security_minimum", "CUR7:readmission_release_below_held_security_minimum"]}
  - {id: PI-19, input: "account store files (anchors, confirmations, per-project records, planted admission records)", role: restrictor, decision: DR-10, established_by: "the admitted gov; never decides first admission (R-STORE-2); A3 can write them (RS-3)", tests: ["ADM7:A07_planted_account_record_r7", "ADM7:A15_records_outside_protected_store"]}
  - {id: PI-20, input: "protected admission store files (marker, records, floors)", role: selector, decision: DR-09, established_by: "gov-admit under its lock", tests: ["ADM7:A09_readmission", "ADM7:A11_concurrent_first_admissions"]}
  - {id: PI-21, input: "bundle order and statements supplied by carriers", role: carrier, decision: DR-03, justification: "order never selects; statements are selected by digest (FC-6)", tests: ["FA7:bundle_order_attacker_root_first"]}
  - {id: PI-22, input: "OP-5 metadata age warning (30 days)", role: informational, decision: DR-44, read_by_decision: none, justification: "shown only; no decision function reads it", tests: ["PROF7:EX-07"]}
  - {id: PI-23, input: "CI pin and image provisioning by the image operator", role: selector, decision: DR-21, established_by: "the image operator outside the repository writer's control (TA-9)", tests: ["BA11r7:pins_beyond_7_days_not_anchors", "ADM7:ci_image_record_13_days_old"]}

