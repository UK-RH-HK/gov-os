      - {match: sensitivity_order, role: selector, decision: DR-30, established_by: "the root threshold"}
      - {match: state_chain_reset, role: selector, decision: DR-32, established_by: "the root threshold"}
      - {match: install_authority, role: restrictor, decision: DR-32, established_by: "the root threshold"}
      - {match: "lowering_history*", role: restrictor, decision: DR-26, established_by: "the root threshold", justification: "computed reductions"}
      - {match: "unrevokes*", role: selector, decision: DR-18, established_by: "the root threshold", justification: "unrevocation"}
      - {match: "registration.min_verification_records", role: restrictor, decision: DR-15, established_by: "schema const 2"}
      - {match: floor_schema_version, role: restrictor, decision: DR-32, established_by: "compiled"}
      - {match: policy_version, role: restrictor, decision: DR-32, established_by: "the root threshold; monotone"}
      - {match: "prior_policies*", role: restrictor, decision: DR-32, established_by: "the root threshold", justification: "policy chain"}
      - {match: supersedes_policy_digest, role: restrictor, decision: DR-32, established_by: "the root threshold"}
      - {match: profile_id, role: restrictor, decision: DR-22, established_by: "compiled profile"}
      - {match: trust_root_id, role: restrictor, decision: DR-31, established_by: "compiled lineage"}
