- path: roles/ROLES.yaml
  mode: structured
  name: ROLES
  collections:
  - path: roles
    id_field: id
    rationale: removing a role id reclassifies `--by <id>` gate answers as human (gates.rs answer); adding a role grants a new authority level
  leaves:
  - key: ROLES.version
    class: pinned
    note: document header
    digests:
      ROLES.version:
      - sha256:39fe4a40977d0585fd5704359e3685b0ada5cf5ee061e5d97385601d120cd0ec
  - key: ROLES.authority_levels.*.*
    class: informational
    rationale: 'display vocabulary for levels; no runtime reader (grep runtime/src 4.1.5: only authority_levels_required is read); levels are parsed from roles[].level'
  - key: ROLES.groups.engineering
    class: floor
    op: set_subset
    value:
    - orchestrator
    - architecture-agent
    - frontend-engineer
    - backend-engineer
    - data-engineer
    - integration-engineer
    - ai-ml-engineer
    - devops-engineer
    - security-engineer
    - performance-engineer
    - independent-test-designer
    - test-execution-agent
    - integration-agent
    - change-controller
    - memory-engineer
    - tooling-engineer
    - independent-auditor
    - release-agent
    - migration-executor
    - migration-reviewer
    - migration-verifier
    - memory-verifier
    - human
    rationale: group membership grants memory-namespace access (authority.rs role_in); adding a member widens access
  - key: ROLES.groups.product
    class: floor
    op: set_subset
    value:
