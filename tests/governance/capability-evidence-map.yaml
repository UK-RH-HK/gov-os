  - id: doctor:D029
    class: governance health check
    tiers:
    - G1
    - G5
    exercises: constitutional policy is read from a verified kernel
  - id: check:authority_unambiguous
    class: governance health check
    tiers:
    - G1
    - G3
    - G4
    - G5
    - G6
    exercises: contradictions between current authoritative records are reported until resolved
  - id: check:schema_invariants
    class: governance health check
    tiers:
    - G1
    - G2
    - G4
    - G5
    - G6
    exercises: superseded-but-ACTIVE authority is reported
  - id: test:certification:repair2::project_policy_cannot_weaken_constitutional_floors
    class: unit/integration/system test
    exercises: every weakening of authority/sensitivity/gate/change/export floors is refused, reported, auditable
  - id: test:certification:ws03::project_overlays_may_raise_floors_but_never_lower_them
    class: unit/integration/system test
    exercises: every overlay input goes through POLICY_PRECEDENCE
  - id: test:certification:repair3::constitutional_floors_require_a_verified_kernel
    class: unit/integration/system test
    exercises: tampered kernel policy fails closed with KERNEL_TAMPERED
  - id: test:certification:repair3::policy_exceptions_require_a_real_governing_decision
    class: unit/integration/system test
    exercises: a malicious exception without a real decision is refused
  - id: test:lib:policy_precedence::tests::overlay_documents_may_raise_floors_but_never_lower_them
    class: unit/integration/system test
  - id: test:lib:context::contradictions::tests::precedence_resolves_first_and_undecidable_pairs_are_detected
    class: unit/integration/system test
    exercises: deterministic precedence decides active decisions first
  - id: test:certification:repair::context_packet_layers_and_contradiction_flags
    class: unit/integration/system test
    exercises: the packet carries the authority layers above retrieved context and flags superseded-but-ACTIVE decisions
  - id: test:certification:arch::schemas_policies_and_registries_validate_against_kernel_schemas
    class: unit/integration/system test
    exercises: constitution, policies and registries are machine-readable and schema-valid
