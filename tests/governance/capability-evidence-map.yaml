schema: governance-os.capability-evidence-map
schema_version: 2
contract_version: v3
source_sha256: 4c2df29115c8d5389034b2e2d817772add80d61678807c23e0d520c937cb5ed3
note: 'capability → test/check/evidence mapping. Every field except the governed ones is derived from the owner source and checked against it by `gov contract verify`. The governed fields — the Contract v3:53-73 fields the owner source states no per-capability value for, each checklist item''s automated_checks and the freshness_invalidation owners — are populated by governed evidence mapping, never asserted by the compiler, and are preserved by `gov contract compile`. Evidence owners (BC-P2-02, frozen AC-10) are objects {id: <kind>:<reference>, class, tiers?, record?, tests?, exercises?} in automated_checks (product and builder owners) and independent_verification (independent owners); `gov contract verify` resolves every owner against the product and fails, typed, on a capability with no running owner. evidence_class (Contract v3:81-91), health_scheduler_tiers (O5), freshness_triggers (Contract v3:97-109), adoption_obligation, operational_audit_obligation and remediation_rule are what the owners determine, derived by `gov contract compile`; the source lock binds the digest of every governed value, so none changes without a recompile.'
governed_fields:
- severity
- applicability
- evidence_class
- automated_checks
- independent_verification
- freshness_triggers
- health_scheduler_tiers
- adoption_obligation
- operational_audit_obligation
- allowed_status
- na_requirements
- remediation_rule
