    line: 136
    text: Active decision/spec/task context follows deterministic precedence.
    automated_checks:
    - check:authority_unambiguous
    - check:schema_invariants
    - test:lib:context::contradictions::tests::precedence_resolves_first_and_undecidable_pairs_are_detected
  - id: A1.5
    line: 137
    text: Retrieved context/model inference cannot override higher authority.
    automated_checks:
    - test:certification:repair::context_packet_layers_and_contradiction_flags
  - id: A1.6
    line: 138
    text: Invalid weakening attempts fail closed and are observable.
    automated_checks:
    - check:policy_precedence
    - doctor:D027
    - test:certification:repair2::project_policy_cannot_weaken_constitutional_floors
    - test:certification:repair3::constitutional_floors_require_a_verified_kernel
    - test:certification:repair3::policy_exceptions_require_a_real_governing_decision
  statements: []
  qualification_challenge_ids:
  - AQC-A1
  severity: null
  applicability: 'required: every capability of the owner source is required unless it is recorded N/A_WITH_REASON (frozen gate contract AC-2, §4); the same contract applies at every lifecycle point of Contract v3:115-127'
  evidence_class:
  - unit/integration/system test
  - governance health check
  - independent audit evidence
  automated_checks:
  - id: check:policy_precedence
    class: governance health check
    tiers:
