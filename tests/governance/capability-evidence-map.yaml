    - test:certification:repair3::constitutional_floors_require_a_verified_kernel
    - test:lib:policy_precedence::tests::overlay_documents_may_raise_floors_but_never_lower_them
  - id: A1.3
    line: 135
    text: Project policy may specialise/strengthen only within allowed override modes.
    automated_checks:
    - check:policy_precedence
    - doctor:D027
    - test:certification:repair2::project_policy_cannot_weaken_constitutional_floors
    - test:certification:ws03::project_overlays_may_raise_floors_but_never_lower_them
    - test:certification:repair3::policy_exceptions_require_a_real_governing_decision
