advanced_qualification_challenges:
- id: AQC-A1
  gate: A
  section: A1
  line: 140
  text: '**Advanced qualification challenge:** inject contradictory project policies, obsolete provider rules, active/superseded decisions, malicious exceptions, and attempted authority/sensitivity weakening.'
- id: AQC-A2
  gate: A
  section: A2
  line: 154
  text: '**Advanced qualification challenge:** tampered source payload, stale/forged manifest, wrong key, altered security policy, modified migration, downgrade/replay attempt, interrupted install.'
- id: AQC-A3
  gate: A
  section: A3
  line: 164
  text: '**Advanced qualification challenge:** seeded secrets, restricted research, confidential project files, malicious plugin descriptors, weakened project policy.'
- id: AQC-B2
  gate: B
  section: B2
  line: 197
  text: '**Advanced qualification challenge:** Repo B starts without a path map; includes misplaced specs, duplicate authority, provider rules, dead code, generated files in wrong locations and hidden cross-references.'
- id: AQC-D6
  gate: D
  section: D6
  line: 356
  text: '**Advanced qualification challenge:** deliberately missing index coverage, stale chunks, wrong authority namespace, archive indexed as current, renamed files duplicated, graph edges stale, deleted indexes, wrong embedder pins.'
- id: AQC-H4
  gate: H
  section: H4
  line: 529
  text: '**Advanced qualification challenge:** deliberately omit scenarios, test datasets, failure criteria, NFRs, security analysis, performance targets, recovery and operations documentation.'
- id: AQC-J2
  gate: J
  section: J2
  line: 616
  text: '**Advanced qualification challenge:** unsupported research conclusion, irreproducible experiment, decision taken before required evidence, conflicting scientific reference data.'
- id: AQC-W12
  gate: W
  section: W12
  line: 1194
  text: '**Advanced qualification challenge:** intentionally omit current specs from semantic index, index superseded specs with higher semantic similarity, change specs after implementation, move files while retaining stable IDs, omit task dependency declarations, return code without consumption receipts, create contradictory mandatory inputs, induce context pressure, switch model/session, and create orphan authoritative outputs. The hidden oracle defines the correct required input/version and expected downstream propagation.'
