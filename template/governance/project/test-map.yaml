# The test map (DEC-896 item 2): what a scoped close runs for a change (DEC-880 item 2, DEC-889 items 1 and 2).
# Schema: governance/kernel/schemas/test-map.schema.json. Patterns are read as allowed_paths are:
# ** matches any characters including /, * any characters except /, the rest literal, the whole path.
# The strict close (close.yaml: strict): a changed path under the shared core, a changed path nothing places, and a
# missing or invalid map run the full regression. The scoped close (close.yaml: scoped, a new project's default):
# never the full suite; a shared-core path selects the suites its couplings and the import graph name, record places
# and governance/project/ select nothing by themselves (records select record_reading), and a changed path nothing
# maps refuses the selection (SELECTION_REFUSED) until the map names it.
version: 1

# The strict close: a change here runs the full regression. The scoped close: its couplings and importers.
shared_core:
  - "governance/project/path-map.yaml"
  - "governance/project/test-map.yaml"
  - "governance/kernel/**"

# Records only (DEC-891's places): a matching path is placed and selects nothing by itself. Name records, never code.
record_only:
  - ".tickets/**.md"
  - "docs/checkpoints/**.md"
  - "docs/close/**.md"
  - "docs/close/nightly/*.json"
  - "docs/probes/**.md"
  - "docs/DECISION_REGISTER.md"
  - "governance/project/orchestration/**.md"

# The tests that read a record-only path, directly or by scanning the tree: run on every close.
record_reading: []

# Targets run on a close whose change holds a record-only path (and in the full run).
every_close: []

# What imports and coverage cannot see: {paths: [patterns], suites: [targets], why: <text>}.
couplings: []

# Paths that are test inputs, not records.
test_inputs:
  - "fixtures/**"

# pytest-timeout's signal method, per test, in seconds.
per_test_timeout: 900
# The parallel run's pytest-xdist --dist mode.
distribution: load
