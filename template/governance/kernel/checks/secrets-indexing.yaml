# The secrets-indexing family check (CAP-38.b, W1-15): no secret or canary in any derived store under .gov-runtime/.
# The command is run by `sh -c` in the project root; exit 0 is green (DEC-285).
id: secrets-indexing
family: secrets-indexing
tier: G1
severity: hard-block
command: python3 -m gov.secrets
# Every file is scanned, two gitleaks runs a file: measured on a runtime folder of 2,575 files and 244 MiB at
# 137 to 143 s on twenty processors and 369 s on four (DEC-595).
timeout-seconds: 900
