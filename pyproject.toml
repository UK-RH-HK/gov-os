[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov"
version = "0.1.6"
description = "Governance OS command line"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "jsonschema>=4.10"]

[project.scripts]
gov = "gov.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gov.retrieval" = ["retrieve_baseline.yaml"]
# Every file the shipped-file resolver (gov.adopt.fabric.shipped) is asked for, byte for byte at its path in the Gov OS
# repository, the template/ prefix kept (gov.adopt.fabric.PACKAGED, read through fabric.shipped's step (2)): the files
# A9 needs that are not under template/, and, under template/ (W2-88 S29, DEC-1189 (1)), A0's and MA's .gitleaks.toml
# and A9's kernel sources, so an installed release finds them in a repository without the kit.
"gov" = ["_shipped/template/.gitleaks.toml",
         "_shipped/template/governance/kernel/skills/retrieval/SKILL.md",
         "_shipped/template/governance/kernel/skills/discovery/SKILL.md",
         "_shipped/template/governance/kernel/skills/judging-work/SKILL.md",
         "_shipped/template/governance/kernel/skills/spec-writing/check_spec.py",  # W2-36, gov discover
         "_shipped/template/governance/kernel/templates/brief.md",
         "_shipped/template/governance/kernel/templates/role-cto.md",
         # the ticket schema the Verify pass validates against (gov.adopt.verify_pass._validator; W2-174, DEC-1189 (1))
         "_shipped/template/governance/kernel/schemas/ticket.schema.json",
         "_shipped/template/governance/kernel/schemas/common.schema.json",
         "_shipped/governance/project/retrieval.yaml",
         "_shipped/governance/project/indep-walls/CLAUDE.md.tmpl",
         "_shipped/governance/project/indep-walls/README.md",
         "_shipped/governance/project/indep-walls/kinds.yaml",
         "_shipped/governance/project/indep-walls/settings.json.tmpl",
         "_shipped/governance/project/indep-walls/tree-exclude.txt",
         "_shipped/governance/project/indep-walls/wall_hook.py",
         "_shipped/governance/project/orchestration/packages/MEMORY-AUDIT-1/briefs/auditor.md",
         "_shipped/governance/project/orchestration/packages/MEMORY-AUDIT-1/briefs/checker.md",
         "_shipped/governance/project/orchestration/packages/MEMORY-AUDIT-1/briefs/writer.md",
         "_shipped/governance/project/orchestration/tools/memaudit_cron.sh"]
