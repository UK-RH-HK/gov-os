[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov"
version = "0.1.0"
description = "Governance OS command line"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
gov = "gov.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gov.retrieval" = ["retrieve_baseline.yaml"]
# The files A9 needs that are not under template/, byte for byte at their paths in the Gov OS repository
# (gov.adopt.fabric.PACKAGED, read through fabric.shipped's step (2)).
"gov" = ["_shipped/governance/project/retrieval.yaml", "_shipped/governance/project/indep-walls/*",
         "_shipped/governance/project/orchestration/packages/MEMORY-AUDIT-1/briefs/*"]
