[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gov"
version = "0.1.0"
description = "Governance OS command line"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
gov = "gov.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
