# The project facts the kernel templates are filled from (DEC-1050 TPL-2; schema:
# template/governance/kernel/schemas/facts.schema.json). The templates name a path by its key ({TREE} is paths.tree,
# a `paths` name upper-cased) and a command by {CMD:name}; a conditional line is {STEP:name}. Each command's `check`
# exits 0 in a temporary repository with no model, network or GPU (--help, a dry run or a no-op), so a tool change
# that breaks a form shows in a unit test, not in a session. Until `gov brief` lands (W2-128 round 2), `lead_brief`
# maps to today's build_lead_brief.py and a worker brief is built with `context`; the templates do not change when it lands.
paths:
  main: '/home/usain/Dynamic-Agentic-Engineering-OS'
  worktrees: '/home/usain/gov-os-worktrees'
  tree: '/home/usain/gov-os-worktrees/{W2}'
  tests_tree: '/home/usain/gov-os-worktrees/{W2}-tests'
  store_tree: '/home/usain/gov-os-worktrees/W2-00-store'
  tools: '/home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools'
  ticket_file: '{MAIN}/.tickets/{ID}.md'
  register: '{MAIN}/docs/DECISION_REGISTER.md'
  scratch: '{TREE}/.gov-runtime/scratch'
  lead_records: '{TREE}/.gov-runtime/scratch/lead'
  briefs: '{TREE}/.gov-runtime/scratch/lead/briefs'
  logs: '{TREE}/.gov-runtime/scratch/lead/log'
  checkpoint_file: '{TREE}/.gov-runtime/scratch/lead/CHECKPOINT.md'
  tests_ready: '{TREE}/.gov-runtime/scratch/lead/TESTS-READY'
  empty_home: '{WRITE_TREE}/.gov-runtime/scratch/empty-home'
  acceptance_root: 'tests/acceptance/'
  acceptance: 'tests/acceptance/{W2}'
  acceptance_readme: 'tests/acceptance/{W2}/README.md'
  probes: '{TREE}/docs/probes/{ID}'
  known_reds: '{TOOLS}/skip_known.json'
  kernel: 'template/governance/kernel'
  contract: 'docs/contract/contract.yaml'

commands:
  # where, accept, pytest_folder and unit_tests run in the session's own tree, {WRITE_TREE}: {TESTS_TREE} for a test
  # designer, {TREE} for every other role (DEC-963 item 1), so a designer's red is taken on its own tree.
  identity:
    run: 'printenv GOV_ROLE GOV_TICKET'
    check: 'printenv --version'
  where:
    run: 'git -C {WRITE_TREE} rev-parse --show-toplevel --abbrev-ref HEAD'
    check: 'git rev-parse --show-toplevel'
  retrieve:
    run: 'gov retrieve --root {STORE_TREE} "{QUESTION}"'
    check: 'gov retrieve --help'
  context:
    run: 'gov context {ID} --role {WORKER_ROLE}'
    check: 'gov context --help'
  links:
    run: 'gov links --since {BASE}'
    check: 'gov links --help'
  accept:
    run: 'gov accept {W2} --root {WRITE_TREE}'
    check: 'gov accept --help'
  pytest_folder:
    run: 'env HOME={EMPTY_HOME} PYTHONPATH={WRITE_TREE}/src python3 -m pytest {FOLDER} -q -p no:cacheprovider -o tmp_path_retention_policy=failed -m "not local_only" -k "not real and not green_here and not time_limit"'
    check: 'python3 -m pytest --version'
  unit_tests:
    run: 'env HOME={EMPTY_HOME} PYTHONPATH={WRITE_TREE}/src python3 -m pytest {UNIT_TEST_PATH} -q -p no:cacheprovider -o tmp_path_retention_policy=failed'
    check: 'python3 -m pytest --version'
  schema_check:
    run: 'env PYTHONPATH={TREE}/src python3 -m gov.check.schema'
    check: 'check-jsonschema --version'
  commit:
    run: 'git commit -m "{SUBJECT}" --trailer "Task: {ID}" --trailer "Role: {ROLE}" --trailer "Implements: {IMPL}" -- {COMMIT_PATHS}'
    check: 'git --version'
  rebuild:
    run: 'env PYTHONPATH={TREE}/src bash {TOOLS}/rebuild_slot.sh {TREE}'
    check: 'gov rebuild --help'
  lead_verify:
    run: 'bash {TOOLS}/lead_verify.sh {TREE} {W2} {ID}'
    check: 'bash -n /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/lead_verify.sh'
  launch_worker:
    run: 'bash {TOOLS}/launch_worker.sh {WORKER_ROLE} {EFFORT} {BRIEF_FILE}'
    check: 'bash -n /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/launch_worker.sh'
  wait_for:
    run: 'bash {TOOLS}/wait_for.sh {EXIT_FILE}'
    check: 'bash -n /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/wait_for.sh'
  lead_brief:
    run: 'python3 {TOOLS}/build_lead_brief.py {PART} {BRIEF_FILE} ID={ID} W2={W2} PROFILE={PROFILE} PATHS={PATHS} ROWS={ROWS} SOURCES={SOURCES} IMPL={IMPL} EST={EST}'
    check: 'python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/build_lead_brief.py'
  tests_worktree:
    run: 'git -C {TREE} worktree add {TESTS_TREE} -b w2/{W2}-tests HEAD'
    check: 'git worktree list'
  merge_tests:
    run: 'git -C {TREE} merge --no-ff w2/{W2}-tests -F {MESSAGE_FILE}'
    check: 'git --version'
  tests_worktree_remove:
    run: 'git -C {TREE} worktree remove {TESTS_TREE}'
    check: 'git worktree list'
  checkpoint:
    run: 'gov checkpoint --ticket {ID} --trigger ticket-transition --next "{NEXT}"'
    check: 'gov checkpoint --help'
  context_ceiling:
    run: 'gov context {ID} --json'
    check: 'gov context --help'
  keyword_warn:
    run: 'python3 {TOOLS}/keyword_warn.py {TREE}'
    check: 'python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/keyword_warn.py'
  trailer_gate:
    run: 'env PYTHONPATH={TREE}/src python3 {TOOLS}/trailer_gate.py {ID} {TREE}'
    check: 'python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" /home/usain/Dynamic-Agentic-Engineering-OS/.gov-runtime/scratch/orchestrator/tools/trailer_gate.py'
  collect_only:
    run: 'env PYTHONPATH={TREE}/src python3 -m pytest tests --collect-only -q -p no:cacheprovider --no-header'
    check: 'python3 -m pytest --version'
  hooks_check:
    run: 'test ! -e {MAIN}/.git/hooks/pre-commit'
    check: 'test -d .'
  scratch_size:
    run: 'du -sh {SCRATCH}'
    check: 'du --version'
  scratch_inodes:
    run: 'du -s --inodes {SCRATCH}'
    check: 'du --version'

# The Definition of Done, quoted by id in the ticket (T-1) and lead (T-7) templates (R3-6).
dod:
- id: DOD-1
  line: 'Every KPI line''s verify holds: the acceptance suite passes through {CMD:accept}, read as pass or fail per line.'
- id: DOD-2
  line: 'The scoped verification is green ({CMD:lead_verify}); a red is named only from {KNOWN_REDS}.'
- id: DOD-3
  line: 'Every commit carries Task: {ID}, Role: and Implements: with ACCEPTED ids from sources:; {CMD:links} reports no new finding.'
- id: DOD-4
  line: 'FULL: the reviewer''s verdict block gives READY (no finding in scope, ordinary work yes, fails open or loses work).'
- id: DOD-5
  line: 'The tree is clean and its head is the verified (and, FULL, the reviewed) head.'
- id: DOD-6
  line: 'The return carries the twelve fields, the template receipt, brief_gaps and guard_refusals.'

# Conditional lines (R3 §B′, R2-5): on while an ACCEPTED rule in force keeps the step; off where the owner lifted it
# (DEC-1052's R-6 and R-12 by DEC-1057, DEC-868 by DEC-953 item 1). A switch turned off removes its one line and
# nothing else. `match` is the pattern M3 counts.
steps:
  keyword_warn:
    "on": true
    line: 'Before verification, run {CMD:keyword_warn} and fix each path it lists [DEC-911].'
    match: 'keyword_warn\.py'
  trailer_gate:
    # off: DEC-927 item 2 lifted by DEC-1057 (R-12); `gov links`' first line is the one `evidence` quote (LINK-INTEGRITY §5).
    "on": false
    line: 'Before you return, run {CMD:trailer_gate} [DEC-927].'
    match: 'trailer_gate\.py'
  collect_only:
    # off: DEC-868 lifted by DEC-953 item 1 as a gate on this repository's own development.
    "on": false
    line: 'Before DONE, run {CMD:collect_only}: it ends with no collection error; quote its last line [DEC-868].'
    match: '--collect-only'
  hooks_check:
    "on": true
    line: 'Before each commit, run {CMD:hooks_check}; a pre-commit hook there stops you: return PACKAGES [DEC-718].'
    match: '\.git/hooks/pre-commit'
  scratch_measure:
    "on": true
    line: 'Before every heavy run and at the end, give {CMD:scratch_size} and {CMD:scratch_inodes} in `evidence` [DEC-898].'
    match: 'du -s'
  context_ceiling:
    "on": true
    line: 'Before DONE, run {CMD:context_ceiling} once; on CONTEXT_OVER_CEILING return the figures and a package naming what to trim [DEC-1027].'
    match: 'gov(\.cli\.main)? context \S+ --json'
  checkpoint_record:
    # off: DEC-511 lifted by DEC-1057 (no committed `gov checkpoint` record per round, R-6).
    "on": false
    line: 'At the end, before the final probe, record {CMD:checkpoint} with the next step [DEC-511].'
    match: 'gov(\.cli\.main)? checkpoint'
  guard_refusal_lines:
    "on": true
    line: '- <time> | <the command''s form, one line> | <the rule''s reason as the hook gave it> | true or false-positive [DEC-958]'
    match: 'guard_refusals:'

# Prose budgets in characters (R3 §C): the body after the front matter, less fenced code blocks and table lines.
budgets:
  brief: 4000
  ticket: 4000
  role-research: 3500
  role-product-spec: 3500
  role-test-designer: 3500
  role-engineer: 3500
  role-reviewer: 3500
  role-lead: 8000
  role-cto: 6000

# The tools a launched session runs without asking: launch_worker.sh's --allowedTools (the reviewer: no Edit, Write).
harness_allowed:
- Bash
- Read
- Edit
- Write
- Grep
- Glob

# The ready check inside `gov brief` (W2-152, DEC-1088 (3)): a ticket created on or after new_since must declare
# reads:, needs: and waits_on: (an empty list is a declared none); an older ticket is not refused for them.
ready:
  new_since: "2026-11-10"
