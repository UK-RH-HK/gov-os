# The rebuild's settings (DEC-1067 order (5); W2-32's index-time method 1, measure 4: x5 + headers 38 of 48, visible 21
# against 20, adopted by the rule written before it ran). Each chunk is embedded with its file path and the headings
# above it; the keyword chunk, the evidence and the reranker's input are unchanged. Switching it re-embeds every chunk.
embed_headers: true
# The integration branch's store (W2-116, DEC-1087 (3); W2-122's warm base): the link `gov rebuild --integration`
# keeps at the branch's head in two halves beside it (-a, -b), and the store `gov launch` points every worker's
# `gov retrieve` at (GOV_STORE). The CTO's refresh scripts keep the same link until window 4 puts W2-116 live.
integration_store: /home/usain/gov-os-worktrees/W2-00-store
# The integration store's two daily refreshes (W2-116 S2, P-W2-116-S2-INTERFACE Q1 (a), DEC-1157 (12)), read by
# `gov rebuild --integration <branch> --when-due` (the cron tick: window 4's ACT) and by `gov status`. A refresh is due
# after a counting verdict file of the nightly (one holding a `verdict:` line) newer than the last scheduled refresh,
# or once `latest` has passed without one; and once `second` has passed. Times are "HH:MM", 24-hour, quoted.
integration_refresh:
  branch: w2/integrate
  after_nightly:
    verdict: .gov-runtime/scratch/orchestrator/log/nightly/*/run.txt
    latest: "10:00"
  second: "18:00"
