# Commits that W1-01's MR-3 history case accepts though they touch tests/acceptance/ without the test designer's
# role (DEC-906): each by its exact sha, with the owner's decision. Only the owner's commit adds an entry; any other
# commit touching tests/acceptance/ without that role stays red.
acceptance_exemptions:
  - commit: "c9a08678644485a7528bc875164e110881b63d93"
    decision: DEC-900
# gov close of this project (DEC-549, DEC-554): the time limit of each of its test runs, in seconds.
# The worker count stays at its default, auto.
close_timeout: 7200
# gov close's owner-accepted known reds, a ratchet (DEC-757): each red by exact test id, the owner's decision
# that accepts it, its reason and the ticket that fixes it. Only an owner's commit adds an entry; a listed test
# that passes leaves the list in the same close.
accepted_reds: []
