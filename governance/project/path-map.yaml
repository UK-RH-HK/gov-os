# The evaluation sets (DEC-820 (d), DEC-845, W2-58): a session a set measures (its role in `roles`, or its ticket
# in `tickets`) is refused reads of the hidden part by the guard (no sandbox Read rule, DEC-873), and reads the visible part.
# memory-retrieval is W2-61's: lens B's 20 questions are visible; the hidden part, which W2-61 fills, lies under
# fixtures/, a product-memory namespace the indexer never reads. W2-61 narrows `measures` to tickets.
evaluation_sets:
  memory-retrieval:
    visible: ["docs/assessment/2026-10/B-memory-retrieval.md"]
    hidden: ["fixtures/evaluation/memory-retrieval/hidden/**"]
    measures:
      roles: [engineer, research]
