# The Gov OS repository's own path map (DEC-185, DEC-224, DEC-225).
# Schema: template/governance/kernel/schemas/path-map.schema.json.
# Every tracked path matches a pattern of exactly one namespace. `**` crosses folders, `*` stays inside one folder.
state_class: AUTHORITATIVE

namespaces:
  root-files:
    paths: ["*"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed
    embedding_policy: not embedded
    provenance: written by hand under a ticket; git history
    deletion_rebuild: authoritative; restored from git only
  agent-settings:
    paths: [".claude/**", ".rulesync/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed
    embedding_policy: not embedded
    provenance: role files and settings written under a ticket; generated by rulesync once it is adopted
    deletion_rebuild: authoritative until rulesync generates it; then rebuilt from .rulesync/
  ci:
    paths: [".github/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed
    embedding_policy: not embedded
    provenance: written by hand under a ticket; git history
    deletion_rebuild: authoritative; restored from git only
  tickets:
    paths: [".tickets/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history; closed tickets stay
    export_policy: allowed
    embedding_policy: embedded
    provenance: written by tk and the orchestrator; git history
    deletion_rebuild: authoritative; restored from git only
  docs:
    paths: ["docs/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history; superseded records stay
    export_policy: allowed
    embedding_policy: embedded
    provenance: charter, contract, decisions, plan and lessons, written under a ticket or an owner decision; git history
    deletion_rebuild: authoritative; restored from git only
  # DEC-856 (P-W2-50 (a)): the overlay is governance memory. DEC-887 (owner, 2026-10-21, P-REC-1 (a)): the raw
  # orchestration record moved to the branch record/w2; only its searchable part (the README, the sync script,
  # packages, session summaries and the checkpoint copy) stays in this tree, under this namespace.
  project-overlay:
    paths:
      - "governance/*"
      - "governance/adoption/**"
      - "governance/project/*"
      - "governance/project/briefs/**"
      - "governance/project/prompts/**"
      - "governance/project/orchestration/*"
      - "governance/project/orchestration/packages/**"
      - "governance/project/orchestration/sessions/**"
      - "governance/project/orchestration/main/orchestrator/CHECKPOINT.md"
      - "governance/project/orchestration/main/orchestrator/PR-*.md"
    memory_class: governance
    sensitivity: restricted
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: denied
    embedding_policy: not embedded
    provenance: the project overlay, written by the orchestrator or under a ticket; git history
    deletion_rebuild: authoritative; restored from git only
  # DEC-887 (owner, 2026-10-21): the raw orchestration record (DEC-856's `orchestration-record` namespace) lives on
  # the branch record/w2, outside this tree; no namespace here holds it.
  kernel-template:
    paths: ["template/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed; copied into adopting products
    embedding_policy: embedded, except vendored code
    provenance: written under a ticket; vendored parts are pinned in the tool registry
    deletion_rebuild: authoritative; restored from git only
  gov-source:
    paths: ["src/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed
    embedding_policy: embedded
    provenance: written by the engineer under a ticket; git history
    deletion_rebuild: authoritative; restored from git only
  tests:
    paths: ["tests/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: allowed
    embedding_policy: embedded
    provenance: tests/acceptance by the independent test designer only (MR-3); tests/unit by the engineer
    deletion_rebuild: authoritative; restored from git only
  fixtures:
    paths: ["fixtures/**"]
    memory_class: product
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: kept in git history
    export_policy: denied
    embedding_policy: not embedded
    provenance: synthetic product repositories, written under a ticket; stand-ins for product data, kept out of governance memory
    deletion_rebuild: authoritative; restored from git only
  carried-code:
    paths: ["cli/**", "schemas/**"]
    memory_class: governance
    sensitivity: internal
    permitted_roles: [orchestrator, product-spec, independent-test-designer, engineer, independent-auditor, research]
    retention: until the tickets that reuse it have ported it into src/gov/; then removed
    export_policy: allowed
    embedding_policy: not embedded
    provenance: carried from the earlier implementation (ADR-0002 §5); not authoritative for the Gov OS
    deletion_rebuild: removed after porting; restored from git only

# The project floor (CAP-06.e).
capabilities:
  code_intelligence:
    enabled: true
    languages: [python]
  research_corpus:
    enabled: false

# Each policy takes a strength at or above its kernel minimum: informational < warning < hard-block (DEC-230, DEC-238).
policies:
  security: hard-block
  authority: hard-block
  test: hard-block
  change: hard-block
  human_gate: hard-block
  tool: hard-block
  memory: warning
  context: warning
  checkpoint: warning
  model_routing: informational
  budget: informational
  learning: informational
  archive: informational

# The twenty-two constitutional systems, as they stand in this repository (CAP-54.b).
systems:
  constitution-and-policies:
    status: minimal
    where: ["docs/charter/**", "docs/contract/**", "docs/DECISION_REGISTER.md"]
  knowledge-fabric:
    status: absent
    reason: The record store and retrieval are not built yet; later Wave 1 tickets build them.
  repository-contract:
    status: minimal
    where: ["governance/project/path-map.yaml", "template/governance/kernel/schemas/**"]
  agent-organisation:
    status: minimal
    where: [".claude/agents/**", "template/governance/kernel/roles/**", "governance/project/roster.yaml"]
  skills:
    status: minimal
    where: ["template/governance/kernel/vendor/**"]
  tools-and-capabilities:
    status: minimal
    where: ["governance/project/tool-registry.yaml"]
  command-surface:
    status: minimal
    where: ["src/gov/cli/**"]
  model-adapters:
    status: absent
    reason: No adapter is built yet; one harness is used directly.
  orchestration-and-handoffs:
    status: minimal
    where: ["governance/project/prompts/**"]
  specification-and-planning:
    status: minimal
    where: ["docs/spec/**", "docs/plan/**"]
  research-and-experiments:
    status: minimal
    where: ["src/gov/launch/**", "template/governance/kernel/roles/research*", ".claude/agents/research.md"]
  task-system:
    status: minimal
    where: [".tickets/**", "tk"]
  product-delivery:
    status: absent
    reason: No delivery pipeline is built yet.
  verification-and-governance-tests:
    status: minimal
    where: ["tests/acceptance/**", "docs/plan/tools/validate_s1.py"]
  change-impact-control:
    status: minimal
    where: ["docs/changes/**"]
  checkpoint-and-recovery:
    status: absent
    reason: gov checkpoint is not built yet.
  observability-and-cost:
    status: absent
    reason: Telemetry is not built yet.
  organisational-learning:
    status: minimal
    where: ["docs/lessons/**", "template/governance/kernel/schemas/lesson.schema.json"]
  independent-audit:
    status: minimal
    where: [".claude/agents/independent-auditor.md"]
  security-and-permissions:
    status: minimal
    where: ["src/gov/guard/**", "template/governance/kernel/hooks/**", ".claude/settings.json", ".gitleaks.toml"]
  budget-governance:
    status: absent
    reason: No budget control is built yet.
  emergency-stop-and-rollback:
    status: absent
    reason: gov pause is not built yet.
