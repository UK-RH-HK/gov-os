# The model and effort of every role, in one file (MR-1; DEC-1246 (3)(b), DEC-1242 R-4, DEC-1236 (3)). `gov launch` reads the row of the
# role it starts when this file is there (`lead` for a ticket, fix or chore lead; `orchestrator` is the CTO's own row, started by its
# own script); the role files' `Launch default` lines must equal their rows (`python3 -m gov.launch.role_table`), the three start
# scripts must agree with `lead`, `orchestrator` and `audit-wide` (`--scripts`). A row changes only in a commit that carries the
# trailer `Decided-by: owner` (`--check <range>`). No row names Fable; a role's model never varies by class or review round.
version: 1
rows:
  - {role: orchestrator, model: claude-opus-5-5, effort: high, decided: DEC-1242 R-4}
  - {role: senior-engineer, model: claude-opus-5-5, effort: high, decided: DEC-1242 R-4}
  - {role: lead, model: claude-sonnet-5-5, effort: medium, decided: "DEC-1242 R-4, DEC-1236 (2)"}
  - {role: engineer, model: claude-sonnet-5-5, effort: high, decided: DEC-1242 R-4}
  - {role: independent-test-designer, model: claude-sonnet-5-5, effort: high, decided: DEC-1242 R-4}
