# Criticality rules (W2-184, DEC-1120 (1), DEC-1167 (2); the list of audit 4's Table 3, DEC-1214 K1, W2-201): a ticket's
# class is the highest of the rules that match. Since DEC-1225 (2026-11-22) a class no longer picks a model: every
# agent but the two orchestrating roles runs Sonnet at every class, and an Opus run is only an exceptions entry
# (governance/project/model-exceptions.yaml); the class is only what an entry's `class: C3` limiter reads. Read at launch by gov.launch.criticality and by the helper model rule
# (.claude/hooks/agent_model.py). A glob matches an allowed path as an fnmatch pattern ('*' crosses '/').
version: 1
default: C2                    # the class when no rule matches
opus: claude-opus-5-5          # the Opus model an exceptions entry may cover (a promotion's and a probe's too); a class picks no model
rules:
  # C3: the kernel and the Contract; the landing and close; the memory measure and sets; release, update and pin; the
  # path map. The guard, the hooks, the settings, secrets, walls, held-out and operator entries are retired (DEC-1214 K1).
  - class: C3
    paths:
      - "template/governance/kernel/**"
      - "governance/kernel/**"
      - "docs/contract/**"
      - "src/gov/close/**"
      - "src/gov/accept/**"
      - "src/gov/queue/**"
      - "src/gov/dispatch/landing.py"
      - "src/gov/tasks/queue.py"
      - "governance/project/orchestration/tools/merge_queue.py"
      - "governance/project/operator/landing_check.py"
      - "src/gov/memaudit/**"
      - "fixtures/evaluation/**"
      - "src/gov/release/**"
      - "src/gov/update/**"
      - "src/gov/lock/**"
      - "governance/project/path-map.yaml"
  # C2: all other product code, the test map, the schemas
  - class: C2
    paths:
      - "src/**"
      - "governance/project/test-map.yaml"
      - "*/schemas/*"
  # C1: records and docs
  - class: C1
    paths:
      - "docs/*"
      - "governance/project/orchestration/*"
  # a FULL ticket is at least C2
  - class: C2
    profile: FULL
