# The secrets scan's switch (read by gov.config.loader). One key, `scan`: `on` or `off`; this file or the key absent
# is on, and any other value is CONFIG_INVALID.
# Off on this repository by the owner's DEC-1045 (2026-11-02): the repository and its remote are private and never
# shared, so gitleaks scanning is lifted here (the rebuild's memory-indexing scan, the secrets-indexing check, the
# staged-content scan), as DEC-953 lifted the other gates. The feature stays built; every other repository keeps it on.
# Each place it acts says "secrets scan: off by configuration (DEC-1045)".
scan: off
