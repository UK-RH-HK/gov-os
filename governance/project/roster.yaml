# The project's roster. W1-46 delivers the research entry (DEC-163); the
# entries of the other roles come with their own tickets.
roles:
  research:
    role_file: template/governance/kernel/roles/research.md
    agent: .claude/agents/research.md
    session: gov launch research <ticket>
    network_profile: research-allowlist
  # W1-33: the five Wave 1 roles (DEC-066). The launcher starts no session for
  # the orchestrator or product-spec, so they name no session and no profile.
  orchestrator:
    role_file: template/governance/kernel/roles/orchestrator.md
    agent: .claude/agents/orchestrator.md
  product-spec:
    role_file: template/governance/kernel/roles/product-spec.md
    agent: .claude/agents/product-spec.md
  independent-test-designer:
    role_file: template/governance/kernel/roles/independent-test-designer.md
    agent: .claude/agents/independent-test-designer.md
    session: gov launch independent-test-designer <ticket>
    network_profile: empty
  engineer:
    role_file: template/governance/kernel/roles/engineer.md
    agent: .claude/agents/engineer.md
    session: gov launch engineer <ticket>
    network_profile: empty
  independent-auditor:
    role_file: template/governance/kernel/roles/independent-auditor.md
    agent: .claude/agents/independent-auditor.md
    session: gov launch independent-auditor <ticket>
    network_profile: empty
