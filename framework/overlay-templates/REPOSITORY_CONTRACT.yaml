schema_version: 1.0.0
roots:
  governance: governance/
  spec: spec/
  product: product/
  archive: archive/
# Ordered rules: for each path the LAST matching rule decides (a later rule overrides an earlier one), so a general
# rule comes before the specific rules that refine it. A `secret` classification always wins. After these rules the
# kernel applies its classification of the OS's own non-rebuildable stores (paths::OS_STORES, BC-P2-31): whatever an
# overlay says, claims, emergency-control state, rollback snapshots and the plugin registry are never derived or
# generated. The store rules below state that classification here too, so this file reads truthfully on its own.
paths:
  - pattern: "governance/kernel/**"
    class: authoritative
    owner_role: release-agent
    mutation: prohibited
    semantic_index: true
    lexical_index: true
    graph_index: false
    namespace: governance
  - pattern: "governance/project/**"
    class: authoritative
    owner_role: change-controller
    mutation: restricted
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: governance
  # OS-written authoritative project state (D-0007 T2): tracked, written only by gov operations, never regenerated
  - pattern: "governance/registry/**"
    class: authoritative
    mutation: os-only
    semantic_index: false
    lexical_index: false
    graph_index: false
    default_retrieval: false
    export: denied
    namespace: governance
  # regenerable views (T3): each is rebuilt from authoritative state by the command that owns it
  - pattern: "governance/generated/*-manifest.json"
    class: generated
    owner_role: orchestrator
    mutation: generated
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: governance
  - pattern: "governance/generated/tool-registry.json"
    class: generated
    owner_role: orchestrator
    mutation: generated
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: governance
  - pattern: "governance/generated/adapters/**"
    class: generated
    owner_role: orchestrator
    mutation: generated
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: governance
  # OS-written state kept in governance/generated/ that is not regenerable: the plugin registry and the first-seen
  # skill content bindings where writers before BC-P2-31 kept them (both belong in governance/registry/ and are moved
  # there by the OS)
  - pattern: "governance/generated/plugin-registry.json"
    class: authoritative
    mutation: os-only
    semantic_index: false
    lexical_index: false
    graph_index: false
    default_retrieval: false
    export: denied
    namespace: governance
  - pattern: "governance/generated/skill-bindings.json"
    class: authoritative
    mutation: os-only
    semantic_index: false
    lexical_index: false
    graph_index: false
    default_retrieval: false
    export: denied
    namespace: governance
  - pattern: "governance/framework.lock"
    class: authoritative
    owner_role: release-agent
    mutation: restricted
    semantic_index: false
    lexical_index: true
    graph_index: false
    namespace: governance
  - pattern: "governance/tests/**"
    class: authoritative
    owner_role: memory-engineer
    mutation: restricted
    semantic_index: false
    lexical_index: false      # held-out queries must never leak into the retrieval index
    graph_index: false
    namespace: governance
  # specification: authoritative by default; the evidence areas below refine it
  - pattern: "spec/**"
    class: authoritative
    owner_role: product-spec-agent
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  - pattern: "spec/decisions/**"
    class: authoritative
    owner_role: change-controller
    mutation: restricted
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  - pattern: "spec/reports/**"
    class: evidence
    owner_role: orchestrator
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  # retrieval-miss failure records (framework §18 failure memory): evidence that is never indexed for retrieval
  - pattern: "spec/reports/memory-quality/**"
    class: evidence
    semantic_index: false
    lexical_index: false
    graph_index: false
    code_index: false
    namespace: spec
  - pattern: "spec/lessons/**"
    class: evidence
    owner_role: orchestrator
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  - pattern: "spec/research/**"
    class: evidence
    owner_role: research-agent
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  - pattern: "spec/experiments/**"
    class: evidence
    owner_role: research-agent
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  - pattern: "spec/audits/**"
    class: evidence
    owner_role: independent-auditor
    semantic_index: true
    lexical_index: true
    graph_index: true
    namespace: spec
  # product: source by default; its tests are refined below
  - pattern: "product/**"
    class: source
    owner_role: backend-engineer
    semantic_index: true
    lexical_index: true
    graph_index: true
    code_index: true
    namespace: product
  - pattern: "product/tests/**"
    class: test
    owner_role: independent-test-designer
    semantic_index: true
    lexical_index: true
    graph_index: true
    code_index: true
    namespace: product
  - pattern: "archive/**"
    class: historical
    owner_role: orchestrator
    default_retrieval: false
    mutation: restricted
    semantic_index: false
    lexical_index: true
    graph_index: false
    namespace: archive
  - pattern: "**/.env*"
    class: secret
    semantic_index: false
    lexical_index: false
    graph_index: false
    code_index: false
    agent_read: prohibited
    export: denied
    namespace: secret
  - pattern: "**/secrets/**"
    class: secret
    semantic_index: false
    lexical_index: false
    agent_read: prohibited
    export: denied
    namespace: secret
  # the derived runtime directory (framework §81, §19): what the OS rebuilds from Git and the governed records
  - pattern: ".governance-runtime/state.db*"
    class: derived
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: runtime
  - pattern: ".governance-runtime/context/**"
    class: derived
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: runtime
  - pattern: ".governance-runtime/health/**"
    class: derived
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: runtime
  - pattern: ".governance-runtime/plugins/**"
    class: derived
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: runtime
  - pattern: ".governance-runtime/benchmarks/**"
    class: derived
    semantic_index: false
    lexical_index: false
    graph_index: false
    namespace: runtime
  # machine-local observations (telemetry, routing evidence, staged upstream packets): not project truth and not
  # rebuildable either
  - pattern: ".governance-runtime/telemetry/**"
    class: runtime-data
    namespace: runtime
  - pattern: ".governance-runtime/routing/**"
    class: runtime-data
    namespace: runtime
  - pattern: ".governance-runtime/outbound/**"
    class: runtime-data
    namespace: runtime
  # non-rebuildable OS operational state where writers before BC-P2-31 kept it inside the runtime directory; the OS
  # moves each store to .governance-state/ (paths::relocate_legacy)
  - pattern: ".governance-runtime/claims.db*"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  - pattern: ".governance-runtime/control.json"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  - pattern: ".governance-runtime/tasks/**"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  - pattern: ".governance-runtime/cit/**"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  - pattern: ".governance-runtime/update/**"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  - pattern: ".governance-runtime/migration/**"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
  # the OS's non-rebuildable machine-local operational state (claims, emergency control, claim-time trees, rollback
  # snapshots): untracked, never derived, never indexed, never deleted by a rebuild
  - pattern: ".governance-state/**"
    class: operational
    mutation: os-only
    default_retrieval: false
    export: denied
    namespace: runtime
