policy: TOOL_POLICY
version: 1.1.0
permission_classes: [READ_REPO, WRITE_REPO_SCOPED, RUN_TESTS, EXEC_PLUGIN, NETWORK_READ, NETWORK_WRITE, PACKAGE_INSTALL, SYSTEM_INSTALL, DB_READ, DB_WRITE, CLOUD_READ, CLOUD_WRITE, CI_TRIGGER, SECRET_READ, DEPLOY_STAGING, DEPLOY_PRODUCTION]
tool_types: [MCP, CLI, API, library]
# All conditions must hold for autonomous installation; otherwise a Human Decision Gate is raised for exactly that
# installation (subject: tool id, pinned version, installation descriptor). A presented, owner-answered A on that gate
# lets the same install proceed; a decline ends the request (BC-P2-41). licence_and_security_satisfied needs an approved
# licence AND a governed security review of that tool id and version: an OS-written report closing a `security` task,
# not written by the installing session or role (Contract v3 F4:431) - a descriptor's own claim is never evidence.
auto_install_conditions:
  - role_has_install_authority
  - installation_reversible
  - cost_within_budget
  - no_privilege_escalation
  - licence_and_security_satisfied
  - version_pinned_and_recorded
  - tool_registered
  - environment_reproducible
# **The already-authorised permission and trust envelope of a tool installation** (OD-P2-03 requirement 2; governed
# record spec/decisions/D-0011.yaml; the rule that uses it is CHANGE_POLICY.change_classes.tool_installation). This is
# only ever the AUTHORISED side of the comparison. What an installation would hold is derived by the OS from the
# request and from what it can observe of the installation itself; a descriptor's declarations can only ADD to that
# demand, never enlarge this envelope and never shrink what the OS derives (Contract v3 F4 "descriptor cannot
# authorise itself"; BC-P2-39, where declared permissions decided whether approval was needed). The token lists are a
# KERNEL FLOOR, not a safety proof: the OS cannot confine a spawned process (see the plugins note below), so the
# governed, independent security review carries what the OS cannot observe. Anything the OS cannot determine is an
# expansion, and the installation is gated.
installation_envelope:
  # classes no role's TOOL_PERMISSIONS entry authorises for an installed tool, because they reach past the project
  host_authority_classes: [SYSTEM_INSTALL, DEPLOY_STAGING, DEPLOY_PRODUCTION, CLOUD_WRITE]
  credential_classes: [SECRET_READ]
  network_classes: [NETWORK_READ, NETWORK_WRITE]
  # command tokens the OS reads as raising privilege, or as acting on the host rather than in the project
  privilege_tokens: [sudo, su, doas, pkexec, runas, setcap, setuid, chown, chmod]
  host_authority_tokens: [systemctl, service, launchctl, apt, apt-get, aptitude, yum, dnf, apk, brew, pacman, zypper,
                          choco, winget, msiexec, rpm, dpkg, installer, mount, crontab, docker, podman, kubectl,
                          insmod, modprobe, useradd, usermod, update-alternatives]
  # flags that make an installer act outside the project (globally, system-wide or in the user's home)
  host_scope_flags: ["-g", "--global", "--system", "--user"]
  # ordinary network use the project or tool policy already authorises: a tool whose every derived endpoint is one of
  # these, installed by a role that already holds a network class, is NOT by itself elevated (OD-P2-03). A network
  # class demanded with no derivable endpoint is an unrestricted boundary and gates.
  approved_registries: [registry.npmjs.org, pypi.org, files.pythonhosted.org, crates.io, static.crates.io,
                        index.crates.io, proxy.golang.org, rubygems.org, repo.maven.apache.org]
  allowlisted_services: []
  # argument and environment names the OS reads as credential access (case-insensitive globs)
  credential_patterns: ["*TOKEN*", "*SECRET*", "*PASSWORD*", "*PASSWD*", "*API_KEY*", "*APIKEY*", "*CREDENTIAL*",
                        "*PRIVATE_KEY*", "*ACCESS_KEY*"]
  # paths whose mutation is governance or security policy mutation; the installation's own descriptor and the
  # generated tool registry it regenerates are excluded by the OS, being exactly what an installation writes
  policy_paths: ["framework/**", "governance/**", "spec/decisions/**", ".governance-state/**"]
approved_licences: [MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, PSF-2.0, Python-2.0, Unlicense, CC0-1.0]
health_check_required: true
mcp:
  registry_path: governance/generated/tool-registry.json
  scope: role_and_task        # tool exposure is role/task scoped; never grant every agent every server
# Capability plugins (gov-capability/1) are executable capabilities and are governed like tools (framework §28-32):
# a descriptor executes only when schema-valid, healthy, bound (every byte the command executes equals the registered
# implementation) and authorised for the acting role. The OS cannot confine a spawned process, so declared permissions
# are not enforced and never decide whether approval is needed (BC-P2-39): every executable plugin runs only with an
# OS-written, T2-sealed registration approved by a presented, owner-answered gate raised for exactly its identity,
# version, implementation and permission set, re-verified at every execution. Only this gov binary's own capability
# server (`gov capabilities serve-embed`) is non-elevated by construction and may run hand-declared.
# Unknown, malformed, unregistered, unapproved, unbound or unauthorised plugins fail closed.
plugins:
  descriptor_schema: plugin-descriptor
  require_valid_descriptor: true
  # A descriptor is discovery, never authorisation (D-0007). The floor below applies to EVERY plugin execution,
  # registered or not, and nothing inside a descriptor (approved_roles, provenance, status) can widen it.
  min_authority: L2                 # minimum authority level to trigger any capability plugin
  # OS-written, tracked T2 state and the only proof of registration. It is not a regenerable view, so it does not
  # live under governance/generated/ (BC-P2-31: deleting the generated views must not drop registrations); a registry
  # still at the legacy location governance/generated/plugin-registry.json is read until the next registry write moves it.
  registry_path: governance/registry/plugin-registry.json
  registration_binds: [plugin_id, version, descriptor_sha256, implementation_sha256, registration_subject_sha256, registration_gate]
  # declared elevation is shown to the approver (and raises the registration gate's stated impact); it is not what
  # makes approval necessary - every executable plugin needs it
  elevated_permission_classes: [NETWORK_READ, NETWORK_WRITE, PACKAGE_INSTALL, SYSTEM_INSTALL, DB_WRITE, CLOUD_WRITE, CI_TRIGGER, SECRET_READ, DEPLOY_STAGING, DEPLOY_PRODUCTION]
  refuse_on_pin_drift: true         # any change to a bound byte -> PLUGIN_PIN_MISMATCH (Contract v3 F4:429: always refused)
  timeout_seconds: 60
