policy: TOOL_POLICY
version: 1.0.0
permission_classes: [READ_REPO, WRITE_REPO_SCOPED, RUN_TESTS, EXEC_PLUGIN, NETWORK_READ, NETWORK_WRITE, PACKAGE_INSTALL, SYSTEM_INSTALL, DB_READ, DB_WRITE, CLOUD_READ, CLOUD_WRITE, CI_TRIGGER, SECRET_READ, DEPLOY_STAGING, DEPLOY_PRODUCTION]
tool_types: [MCP, CLI, API, library]
# All conditions must hold for autonomous installation; otherwise a Human Decision Gate is raised.
auto_install_conditions:
  - role_has_install_authority
  - installation_reversible
  - cost_within_budget
  - no_privilege_escalation
  - licence_and_security_satisfied
  - version_pinned_and_recorded
  - tool_registered
  - environment_reproducible
approved_licences: [MIT, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0, PSF-2.0, Python-2.0, Unlicense, CC0-1.0]
health_check_required: true
mcp:
  registry_path: governance/generated/tool-registry.json
  scope: role_and_task        # tool exposure is role/task scoped; never grant every agent every server
# Capability plugins (gov-capability/1) are executable capabilities and are governed like tools (framework §28-32):
# a descriptor executes only when schema-valid, registered in the generated registry, healthy, version/content pinned
# and authorised for the acting role. Unknown, malformed, unregistered, unpinned or unauthorised plugins fail closed.
plugins:
  descriptor_schema: plugin-descriptor
  require_valid_descriptor: true
  # A descriptor is discovery, never authorisation (D-0007). The floor below applies to EVERY plugin execution,
  # registered or not, and nothing inside a descriptor (approved_roles, provenance, status) can widen it.
  min_authority: L2                 # minimum authority level to trigger any capability plugin
  registry_path: governance/generated/plugin-registry.json   # OS-written; the only proof of registration
  registration_binds: [plugin_id, version, descriptor_sha256, implementation_sha256]
  elevated_permission_classes: [NETWORK_READ, NETWORK_WRITE, PACKAGE_INSTALL, SYSTEM_INSTALL, DB_WRITE, CLOUD_WRITE, CI_TRIGGER, SECRET_READ, DEPLOY_STAGING, DEPLOY_PRODUCTION]
  refuse_on_pin_drift: true         # implementation changed without a version change -> PLUGIN_PIN_MISMATCH
  timeout_seconds: 60
