policy: SECURITY_POLICY
version: 1.0.0
sensitivity_classes: [public, internal, confidential, restricted, secret]
never_index_classes: [secret, restricted]
never_export_classes: [secret, restricted, confidential]
secret_path_patterns:
  - "**/.env"
  - "**/.env.*"
  - "**/*.pem"
  - "**/*.key"
  - "**/id_rsa*"
  - "**/secrets/**"
  - "**/*secret*.yaml"
  - "**/*secret*.yml"
  - "**/*secret*.json"
  - "**/*credentials*"
secret_content_patterns:
  - {id: aws-access-key, regex: "AKIA[0-9A-Z]{16}"}
  - {id: aws-secret-key, regex: "(?i)aws_secret_access_key\\s*[=:]\\s*['\"]?[A-Za-z0-9/+=]{40}"}
  - {id: private-key-block, regex: "-----BEGIN (RSA |EC |OPENSSH |DSA |)PRIVATE KEY-----"}
  - {id: github-token, regex: "gh[pousr]_[A-Za-z0-9]{36,}"}
  - {id: generic-api-key, regex: "(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token)\\s*[=:]\\s*['\"]?[A-Za-z0-9_\\-]{20,}"}
  - {id: password-assignment, regex: "(?i)password\\s*[=:]\\s*['\"][^'\"\\s]{8,}['\"]"}
  - {id: slack-token, regex: "xox[baprs]-[A-Za-z0-9-]{10,}"}
  - {id: stripe-like-key, regex: "\\bsk_(live|test)_[A-Za-z0-9_]{16,}"}
  - {id: jwt, regex: "eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}"}
on_secret_outside_secret_class: block_index_and_report   # index is refused for the file; doctor reports CRITICAL
on_secret_in_export_payload: fail_closed
agent_read_default_for_secret_class: prohibited
