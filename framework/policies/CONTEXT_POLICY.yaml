policy: CONTEXT_POLICY
version: 1.1.0
# input_manifest (Contract v3 W3/W4): the resolution of the task's declared mandatory inputs; delivery_state BLOCKED
# names every missing or violated input. retrieved_intelligence is supplementary only (W10).
packet_blocks: [deterministic_authority, input_manifest, retrieved_intelligence]
deterministic_authority_fields: [task, objective, project_state, feature, governing_requirements, active_decisions, conflicting_decisions, architecture, interfaces, scenarios, test_designs, datasets, evidence_inputs, other_inputs, acceptance_criteria, allowed_writes, prohibited_writes, required_skills, required_tools, dependency_state]
retrieved_fields: [query, retrieval_strategy, index_snapshot, ranked_evidence, semantic_candidates, lessons_failures, code_references, declared_supplementary]
max_packet_chars: 60000
max_retrieved_slices: 12
fresh_agent_read_budget_files: 25
reproducibility: deterministic_block_must_hash_stable
