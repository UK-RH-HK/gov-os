policy: CONTEXT_POLICY
version: 1.1.0
# input_manifest (Contract v3 W3/W4): the resolution of the task's declared mandatory inputs; delivery_state BLOCKED
# names every missing or violated input. retrieved_intelligence is supplementary only (W10).
# contradictions (BC-P2-18): inputs precedence cannot reconcile are delivered as conflicting and block the manifest.
# input_staleness (BC-P2-04): delivered inputs and the task itself carrying an upstream-change staleness marker.
# task_contract: the enforcement state of the task contract (required data/tools/skills, blocked_by, role, merge).
packet_blocks: [deterministic_authority, input_manifest, retrieved_intelligence]
deterministic_authority_fields: [task, objective, project_state, feature, governing_requirements, active_decisions, conflicting_decisions, architecture, interfaces, scenarios, test_designs, datasets, evidence_inputs, other_inputs, acceptance_criteria, allowed_writes, prohibited_writes, required_skills, required_tools, dependency_state, contradictions, input_staleness, task_contract]
retrieved_fields: [query, retrieval_strategy, index_snapshot, ranked_evidence, semantic_candidates, lessons_failures, code_references, declared_supplementary]
max_packet_chars: 60000
max_retrieved_slices: 12
fresh_agent_read_budget_files: 25
reproducibility: deterministic_block_must_hash_stable
