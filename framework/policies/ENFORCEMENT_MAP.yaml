# Policy enforcement coverage map (verifier M12). Every leaf key of every kernel policy must appear here, either with
# `enforced_by` (executable paths in runtime/src that read the key) or as `informational` with a reason. The governance
# suite family `policy_enforcement_coverage` fails on uncovered keys; a builder test verifies that each enforced_by
# function exists and that the key string is read in source. A declared key that does nothing must never be reported
# as implemented.
version: 1.0.0
keys:
  # ---- AUTHORITY_POLICY
  AUTHORITY_POLICY.precedence: {enforced_by: [context::compile, adapters::generate]}
  AUTHORITY_POLICY.state_classes: {enforced_by: [verification::run]}
  AUTHORITY_POLICY.lifecycle_statuses: {enforced_by: [verification::run]}
  AUTHORITY_POLICY.default_state_class_by_type.*: {enforced_by: [records::state_class_for]}
  AUTHORITY_POLICY.retrieval_default_excludes_statuses: {enforced_by: [retrieval::retrieve]}
  AUTHORITY_POLICY.authority_levels_required.*: {enforced_by: [authority::require, authority::required_level]}
  AUTHORITY_POLICY.authority_levels_required.revoke_gate: {enforced_by: [gates::revoke]}
  AUTHORITY_POLICY.authority_levels_required.execute_plugin: {enforced_by: [capabilities::governance::authorize]}
  AUTHORITY_POLICY.authority_levels_required.register_plugin: {enforced_by: [capabilities::governance::register]}
  # ---- POLICY_PRECEDENCE (constitutional; evaluated at policy load)
  POLICY_PRECEDENCE.layers: {enforced_by: [policy_precedence::load, context::compile]}
  POLICY_PRECEDENCE.default_mode: {enforced_by: [policy_precedence::evaluate]}
  POLICY_PRECEDENCE.rules: {enforced_by: [policy_precedence::evaluate, policy::PolicySet::load]}
  # ---- TOOL_POLICY.plugins (capability supply-chain boundary)
  TOOL_POLICY.plugins.descriptor_schema: {informational: "names the kernel schema (plugin-descriptor) that capabilities::host::discover_all validates every descriptor against; the schema id is fixed by the kernel, not read at runtime"}
  TOOL_POLICY.plugins.require_valid_descriptor: {informational: "always true: an invalid descriptor is rejected by capabilities::host::discover_all and can never execute; declared strengthen-only so no overlay can relax it"}
  TOOL_POLICY.plugins.min_authority: {enforced_by: [capabilities::governance::authorize, tools::plugin_tools]}
  TOOL_POLICY.plugins.elevated_permission_classes: {enforced_by: [capabilities::governance::authorize, capabilities::governance::register]}
  TOOL_POLICY.plugins.refuse_on_pin_drift: {enforced_by: [capabilities::governance::authorize]}
  TOOL_POLICY.plugins.timeout_seconds: {enforced_by: [capabilities::governance::invoke_timeout]}
  # ---- MEMORY_POLICY
  MEMORY_POLICY.runtime_dir: {enforced_by: [project::runtime_dir_name]}
  MEMORY_POLICY.memory_classes: {informational: "taxonomy of the fabric; each class maps to a store (docs/ARCHITECTURE.md §4)"}
  MEMORY_POLICY.embedding.provider: {enforced_by: [embedder::from_policy, indexer::rebuild, retrieval::retrieve]}
  MEMORY_POLICY.embedding.version: {enforced_by: [embedder::from_policy]}
  MEMORY_POLICY.embedding.dimensions: {enforced_by: [embedder::from_policy]}
  MEMORY_POLICY.reranker.provider: {enforced_by: [embedder::from_policy, retrieval::retrieve]}
  MEMORY_POLICY.reranker.version: {enforced_by: [embedder::from_policy]}
  MEMORY_POLICY.lexical.tokenizer: {enforced_by: [indexer::lexical_config, db::init_schema_with]}
  MEMORY_POLICY.chunking.max_chars: {enforced_by: [indexer::chunking_config]}
  MEMORY_POLICY.chunking.overlap_chars: {enforced_by: [indexer::chunking_config]}
  MEMORY_POLICY.chunking.levels: {informational: "fixed hierarchy document/section/child implemented by chunking.rs"}
  MEMORY_POLICY.retrieval.default_k: {enforced_by: [retrieval::retrieve]}
  MEMORY_POLICY.retrieval.fusion: {informational: "reciprocal-rank fusion is the only fusion implemented; rrf_k parameterises it"}
  MEMORY_POLICY.retrieval.rrf_k: {enforced_by: [retrieval::retrieve]}
  MEMORY_POLICY.retrieval.parent_expansion_top_n: {enforced_by: [retrieval::retrieve]}
  MEMORY_POLICY.retrieval.graph_neighbour_depth: {enforced_by: [retrieval::retrieve]}
  MEMORY_POLICY.retrieval.max_slice_chars: {enforced_by: [retrieval::retrieve]}
  MEMORY_POLICY.retrieval.rerank_candidates: {enforced_by: [embedder::from_policy, retrieval::retrieve]}
  MEMORY_POLICY.freshness.max_stale_artifacts_on_task_close: {enforced_by: [tasks::close]}
  MEMORY_POLICY.freshness.on_stale_close: {enforced_by: [tasks::close]}
  MEMORY_POLICY.freshness.max_index_age_hours: {enforced_by: [manifest::freshness]}
  MEMORY_POLICY.regression.heldout_file: {enforced_by: [verification::run, benchmark::run]}
  MEMORY_POLICY.regression.min_queries: {enforced_by: [retrieval::run_heldout_with]}
  MEMORY_POLICY.regression.min_recall_at_k: {enforced_by: [retrieval::run_heldout_with]}
  MEMORY_POLICY.regression.min_mrr: {enforced_by: [retrieval::run_heldout_with]}
  MEMORY_POLICY.regression.max_stale_hit_rate: {enforced_by: [retrieval::run_heldout_with]}
  MEMORY_POLICY.regression.max_superseded_hit_rate: {enforced_by: [retrieval::run_heldout_with]}
  MEMORY_POLICY.rebuild.must_reproduce_manifest_hash: {enforced_by: [verification::run]}
  MEMORY_POLICY.namespaces.*: {enforced_by: [retrieval::retrieve, manifest::write_manifests]}
  # ---- CHANGE_POLICY
  CHANGE_POLICY.impact_radii: {informational: "enumeration of radii; radius_rules decide the radius"}
  CHANGE_POLICY.auto_approve_max_radius: {enforced_by: [cit::simulate_inner, cit::approve]}
  CHANGE_POLICY.auto_simulate_triggers: {enforced_by: [cit::propose]}
  CHANGE_POLICY.human_gate_triggers: {enforced_by: [cit::simulate_inner]}
  CHANGE_POLICY.radius_rules.*: {enforced_by: [cit::estimate_radius]}
  CHANGE_POLICY.graph_traversal_depth_by_radius.*: {enforced_by: [cit::simulate_inner]}
  CHANGE_POLICY.semantic_candidates_by_radius.*: {enforced_by: [cit::simulate_inner]}
  CHANGE_POLICY.propagation.*: {enforced_by: [cit::execute]}
  CHANGE_POLICY.verification_required: {enforced_by: [cit::execute]}
  CHANGE_POLICY.rollback.snapshot_before_execute: {enforced_by: [cit::execute]}
  CHANGE_POLICY.rollback.keep_snapshots: {enforced_by: [cit::prune_snapshots]}
  # ---- SECURITY_POLICY
  SECURITY_POLICY.sensitivity_classes: {informational: "enumeration validated by the overlay schemas"}
  SECURITY_POLICY.never_index_classes: {enforced_by: [project::contract, paths::decide, indexer::rebuild, verification::run]}
  SECURITY_POLICY.never_export_classes: {enforced_by: [project::contract, paths::decide, upstream::prepare]}
  SECURITY_POLICY.secret_path_patterns: {enforced_by: [secrets::from_policies, indexer::rebuild]}
  SECURITY_POLICY.secret_content_patterns: {enforced_by: [secrets::from_policies, indexer::rebuild, cit::propose]}
  SECURITY_POLICY.on_secret_outside_secret_class: {enforced_by: [doctor::run]}
  SECURITY_POLICY.on_secret_in_export_payload: {enforced_by: [upstream::submit]}
  SECURITY_POLICY.agent_read_default_for_secret_class: {enforced_by: [project::contract, paths::decide]}
  # ---- TOOL_POLICY
  TOOL_POLICY.permission_classes: {informational: "enumeration validated by the tool-permissions schema"}
  TOOL_POLICY.tool_types: {enforced_by: [tools::install]}
  TOOL_POLICY.auto_install_conditions: {enforced_by: [tools::install]}
  TOOL_POLICY.approved_licences: {enforced_by: [tools::install]}
  TOOL_POLICY.health_check_required: {enforced_by: [tools::install]}
  TOOL_POLICY.mcp.registry_path: {enforced_by: [tools::generate_registry]}
  TOOL_POLICY.mcp.scope: {informational: "role/task scoping is implemented by generate_registry role_exposure"}
  # ---- MODEL_ROUTING_POLICY
  MODEL_ROUTING_POLICY.tiers.*: {enforced_by: [tasks::create, routing::route]}
  MODEL_ROUTING_POLICY.reasoning_levels: {enforced_by: [tasks::create]}
  MODEL_ROUTING_POLICY.task_class_minimum_tier.*: {enforced_by: [routing::tier_for_class]}
  MODEL_ROUTING_POLICY.radius_minimum_tier.*: {enforced_by: [routing::route]}
  MODEL_ROUTING_POLICY.record_evidence: {enforced_by: [routing::record]}
  # ---- CONTEXT_POLICY
  CONTEXT_POLICY.packet_blocks: {enforced_by: [verification::run]}
  CONTEXT_POLICY.deterministic_authority_fields: {enforced_by: [verification::run]}
  CONTEXT_POLICY.retrieved_fields: {enforced_by: [verification::run]}
  CONTEXT_POLICY.max_packet_chars: {enforced_by: [context::compile, verification::run]}
  CONTEXT_POLICY.max_retrieved_slices: {enforced_by: [context::compile]}
  CONTEXT_POLICY.fresh_agent_read_budget_files: {enforced_by: [verification::run]}
  CONTEXT_POLICY.reproducibility: {informational: "deterministic block hashing is unconditional; the suite family context_reproducibility verifies it"}
  # ---- HUMAN_GATE_POLICY
  HUMAN_GATE_POLICY.raise_for: {informational: "catalogue of situations; concrete triggers are CHANGE_POLICY.human_gate_triggers, budgets, tool installs, destructive migrations, framework updates"}
  HUMAN_GATE_POLICY.agent_resolvable_when.*: {enforced_by: [gates::answer]}
  HUMAN_GATE_POLICY.decision_package_fields: {enforced_by: [gates::build]}
  HUMAN_GATE_POLICY.prioritisation: {enforced_by: [gates::build]}
  HUMAN_GATE_POLICY.must_be_presented_in_chat: {enforced_by: [gates::answer]}
  HUMAN_GATE_POLICY.continue_independent_work: {enforced_by: [status::continue_work]}
  HUMAN_GATE_POLICY.batch_low_priority: {enforced_by: [gates::pending]}
  # ---- BUDGET_POLICY
  BUDGET_POLICY.governed: {informational: "catalogue; each governed quantity has a threshold in defaults"}
  BUDGET_POLICY.defaults.max_parallel_agents: {enforced_by: [tasks::claim, observability::summary]}
  BUDGET_POLICY.defaults.max_task_cost_usd: {enforced_by: [routing::record]}
  BUDGET_POLICY.defaults.max_daily_spend_usd: {enforced_by: [routing::record]}
  BUDGET_POLICY.defaults.max_install_cost_usd: {enforced_by: [tools::install]}
  BUDGET_POLICY.defaults.max_network_calls_per_task: {enforced_by: [observability::summary]}
  BUDGET_POLICY.on_threshold_exceeded: {enforced_by: [tasks::claim, routing::record]}
  # ---- CHECKPOINT_POLICY
  CHECKPOINT_POLICY.fields: {informational: "field list validated by the checkpoint schema"}
  CHECKPOINT_POLICY.mandatory_triggers: {enforced_by: [checkpoints::create, handoffs::create]}
  CHECKPOINT_POLICY.watchdog.context_utilisation_threshold: {enforced_by: [checkpoints::watchdog]}
  CHECKPOINT_POLICY.watchdog.max_operations_between_checkpoints: {enforced_by: [checkpoints::watchdog]}
  CHECKPOINT_POLICY.location: {enforced_by: [checkpoints::dir]}
  CHECKPOINT_POLICY.prose_summary_as_checkpoint: {enforced_by: [checkpoints::create]}
  # ---- TEST_POLICY
  TEST_POLICY.product_families: {enforced_by: [verification::run]}
  TEST_POLICY.governance_families: {enforced_by: [verification::run]}
  TEST_POLICY.independent_test_author_required_for: {enforced_by: [dag::compute, verification::run]}
  TEST_POLICY.implementation_task_requires: {enforced_by: [dag::compute]}
  TEST_POLICY.green_record_currency: {informational: "inputs-hash currency is the only mode implemented (verification::inputs_hash, tasks::close)"}
  TEST_POLICY.task_close_requires_tests_status: {enforced_by: [tasks::close]}
  # ---- LEARNING_POLICY
  LEARNING_POLICY.lesson_scopes: {informational: "enumeration validated by the lesson schema"}
  LEARNING_POLICY.lesson_lifecycle: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.corroboration_min_sources: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.upstream_eligible_scopes: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.upstream.approval: {enforced_by: [upstream::submit]}
  LEARNING_POLICY.upstream.allowed_payload: {enforced_by: [upstream::submit]}
  LEARNING_POLICY.upstream.aggregate_metrics_enabled: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.upstream.forbidden_paths: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.upstream.forbidden_content: {informational: "catalogue of the content classes the scans in upstream::prepare cover"}
  LEARNING_POLICY.upstream.max_code_lines_unless_synthetic: {enforced_by: [upstream::prepare]}
  LEARNING_POLICY.upstream.ledger: {enforced_by: [upstream::submit]}
  LEARNING_POLICY.release_triggers.*: {enforced_by: [lessons::cluster]}
  # ---- ARCHIVE_POLICY
  ARCHIVE_POLICY.archive_root: {enforced_by: [init::ensure_roots]}
  ARCHIVE_POLICY.archive_subdirs: {enforced_by: [init::ensure_roots]}
  ARCHIVE_POLICY.archive_when: {informational: "guidance applied by the migration planner's action rules"}
  ARCHIVE_POLICY.do_not_archive: {informational: "guidance: dead source is deleted from the active tree, not archived (planner)"}
  ARCHIVE_POLICY.unused_code_action: {enforced_by: [adopt::a3_map]}
  ARCHIVE_POLICY.default_retrieval_for_archive: {enforced_by: [project::contract, paths::decide]}
  ARCHIVE_POLICY.archive_mutation: {informational: "the overlay template's archive/** rule carries mutation: restricted"}
