policy: CHANGE_POLICY
version: 1.1.0
impact_radii: [R0, R1, R2, R3, R4, R5]
auto_approve_max_radius: R1
auto_simulate_triggers: [architecture_change, behaviour_change, interface_change, security_change, governance_change, infrastructure_cost, acceptance_criteria_change, data_migration]
human_gate_triggers: [architecture_change, security_change, governance_change, infrastructure_cost, data_migration, acceptance_criteria_change]
radius_rules:
  governance_paths_radius: R5
  cross_feature_threshold: 3     # affected features >= threshold -> R4
  cross_module_threshold: 2      # affected modules >= threshold -> R3
  interface_or_behaviour_radius: R2
  single_artifact_radius: R1
  editorial_radius: R0
graph_traversal_depth_by_radius: {R0: 0, R1: 1, R2: 2, R3: 3, R4: 4, R5: 5}
semantic_candidates_by_radius: {R0: 0, R1: 4, R2: 8, R3: 12, R4: 16, R5: 24}
# Materiality (which of the eight Contract v3:640-647 classes a change belongs to) is derived from what the change
# touches by cit::materiality (kernel floor); the declared trigger only adds to it. auto_simulate_triggers and
# human_gate_triggers apply to the effective triggers (declared + derived).
# ------------------------------------------------------------------------------------------------------------------
# Governed change classes (OD-P2-03 requirement 1). A change class whose human-gate rule an owner decision settles,
# rather than the radius and trigger rules above. The rule is DATA: `gov policy effective CHANGE_POLICY` shows it, an
# auditor reads it here, and it is never implicit in code. A transaction outside these classes is unaffected.
change_classes:
  # **A tool installation needs the human gate only when it expands authority.** Product owner, 2026-09-20: owner
  # decision OD-P2-03 ("gate only elevated installs"), answering owner gate HG-P2-0002; governed record
  # spec/decisions/D-0011.yaml. Contract v3 K3 makes a tool descriptor under governance/project/tools/ a material
  # governance AND security change, so every installation is carried out by a change transaction the OS proposes and
  # simulates; this rule decides only whether that transaction needs a human gate. It needs none when every
  # non_gated_condition below holds AND no authority_expansion_trigger fires. Ordinary network use already authorised
  # by project or tool policy (approved registries, allowlisted services) is not by itself an expansion. Every
  # installation is recorded with its security and CIT evidence, gated or not, and the transaction states which
  # branch applied and why (impact.change_class).
  tool_installation:
    owner_decision: OD-P2-03
    decision_record: D-0011
    # the one manifest operation this class covers; a transaction carrying anything else, or more than this one
    # operation, is gated by the ordinary radius and trigger rules
    manifest_op: install_tool
    subject_paths: ["governance/project/tools/**"]
    # The owner's non-gated conditions, each mapped to the TOOL_POLICY.auto_install_conditions entry that decides it
    # (`authority_envelope`: the envelope comparison below, not a TOOL_POLICY condition). A condition TOOL_POLICY does
    # not declare was never evaluated, so it cannot hold and the gate is required: this rule can never be satisfied by
    # shortening auto_install_conditions.
    non_gated_conditions:
      authenticated_and_pinned: version_pinned_and_recorded
      independently_governed_reviewed: licence_and_security_satisfied
      registered: tool_registered
      reversible: installation_reversible
      within_authorised_envelope: authority_envelope
    # Any of these expands authority and requires the human gate.
    authority_expansion_triggers:
      - privilege_escalation
      - broader_filesystem_or_project_access
      - new_secret_or_credential_access
      - host_level_authority
      - governance_or_security_policy_mutation
      - new_or_unrestricted_network_trust_boundary
    # The authorised side of the comparison is computed from trusted OS state alone; the descriptor's own
    # declarations are never part of it (Contract v3 F4 "descriptor cannot authorise itself"; BC-P2-39). What a
    # descriptor declares can only ADD to what the installation is taken to demand.
    envelope_sources:
      - TOOL_PERMISSIONS.yaml
      - AUTHORITY_POLICY
      - DATA_SENSITIVITY.yaml
      - SECURITY_POLICY
      - REPOSITORY_CONTRACT.yaml
      - TOOL_POLICY.installation_envelope
    # Fail closed and fail gated: a missing rule, a descriptor that cannot be derived, a condition that cannot be
    # evaluated, a review that is missing, self-attested or not bound to this installation, or a pin that cannot be
    # verified, all require the human gate and the installation does not proceed.
    fail_closed: true
propagation:
  mark_affected_tasks_retest: true
  mark_affected_tests_stale: true
  regenerate_derived_views: true
  refresh_index: true
  # BC-P2-04 (Contract v3 W6): propagation reaches completed work, its evidence, checkpoints, handoffs and packets
  revalidate_completed_tasks: true
  generate_revalidation_tasks: true
  mark_evidence_stale: true
  mark_checkpoints_stale: true
  invalidate_context_packets: true
  # round 3 (O-7): propagation outside CIT-E (a detected direct change) is recorded as a sealed system transaction
  # (origin: system) whose touched list and per-path writes cover the markers it wrote
# graph_integrity: no new dangling edge, and (round 3, WS-6 IP-R2-2) no new reversed, ill-typed or stale relationship
# declared by a record the manifest wrote, and no new supersession cycle (memory::integrity::check before and after)
verification_required: [schema_validation, graph_integrity, index_freshness]
rollback:
  snapshot_before_execute: true
  # snapshots are kept in the non-rebuildable OS store .governance-state/cit/ (BC-P2-31), never in the derived
  # runtime directory
  keep_snapshots: 20
