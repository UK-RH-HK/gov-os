policy: CHANGE_POLICY
version: 1.0.0
impact_radii: [R0, R1, R2, R3, R4, R5]
auto_approve_max_radius: R1
auto_simulate_triggers: [architecture_change, behaviour_change, interface_change, security_change, governance_change, infrastructure_cost, acceptance_criteria_change, data_migration]
human_gate_triggers: [architecture_change, security_change, governance_change, infrastructure_cost, data_migration, acceptance_criteria_change]
radius_rules:
  governance_paths_radius: R5
  cross_feature_threshold: 3     # affected features >= threshold -> R4
  cross_module_threshold: 2      # affected modules >= threshold -> R3
  interface_or_behaviour_radius: R2
  single_artifact_radius: R1
  editorial_radius: R0
graph_traversal_depth_by_radius: {R0: 0, R1: 1, R2: 2, R3: 3, R4: 4, R5: 5}
semantic_candidates_by_radius: {R0: 0, R1: 4, R2: 8, R3: 12, R4: 16, R5: 24}
# Materiality (which of the eight Contract v3:640-647 classes a change belongs to) is derived from what the change
# touches by cit::materiality (kernel floor); the declared trigger only adds to it. auto_simulate_triggers and
# human_gate_triggers apply to the effective triggers (declared + derived).
propagation:
  mark_affected_tasks_retest: true
  mark_affected_tests_stale: true
  regenerate_derived_views: true
  refresh_index: true
  # BC-P2-04 (Contract v3 W6): propagation reaches completed work, its evidence, checkpoints, handoffs and packets
  revalidate_completed_tasks: true
  generate_revalidation_tasks: true
  mark_evidence_stale: true
  mark_checkpoints_stale: true
  invalidate_context_packets: true
  # round 3 (O-7): propagation outside CIT-E (a detected direct change) is recorded as a sealed system transaction
  # (origin: system) whose touched list and per-path writes cover the markers it wrote
# graph_integrity: no new dangling edge, and (round 3, WS-6 IP-R2-2) no new reversed, ill-typed or stale relationship
# declared by a record the manifest wrote, and no new supersession cycle (memory::integrity::check before and after)
verification_required: [schema_validation, graph_integrity, index_freshness]
rollback:
  snapshot_before_execute: true
  # snapshots are kept in the non-rebuildable OS store .governance-state/cit/ (BC-P2-31), never in the derived
  # runtime directory
  keep_snapshots: 20
