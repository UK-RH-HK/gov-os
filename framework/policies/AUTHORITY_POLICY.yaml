policy: AUTHORITY_POLICY
version: 1.0.0
precedence:
  - human_approved_decision
  - constitutional_hard_invariant
  - active_structured_project_state
  - active_specification_and_interface_contract
  - active_architecture_workflow_decision
  - approved_task_contract_and_mutation_manifest
  - active_scenario_and_acceptance_criteria
  - current_verified_implementation_behaviour
  - research_evidence_and_execution_reports
  - historical_or_superseded_records
  - semantic_memory_retrieval
  - agent_inference
state_classes: [AUTHORITATIVE, DERIVED, NARRATIVE, EVIDENCE, HISTORICAL, UNKNOWN_OR_CONFLICTING]
lifecycle_statuses: [ACTIVE, PROVISIONAL, SUPERSEDED, LEGACY, HISTORICAL, REJECTED, DEPRECATED, RETIRED]
# Default state class by record type (overridable per record).
default_state_class_by_type:
  project: AUTHORITATIVE
  feature: AUTHORITATIVE
  requirement: AUTHORITATIVE
  decision: AUTHORITATIVE
  interface: AUTHORITATIVE
  scenario: AUTHORITATIVE
  architecture: AUTHORITATIVE
  workflow: AUTHORITATIVE
  task: AUTHORITATIVE
  test-obligation: AUTHORITATIVE
  human-gate: AUTHORITATIVE
  cit: AUTHORITATIVE
  handoff: DERIVED
  checkpoint: EVIDENCE
  report: EVIDENCE
  research: EVIDENCE
  experiment: EVIDENCE
  lesson: EVIDENCE
  audit: EVIDENCE
  legacy: HISTORICAL
  narrative: NARRATIVE
retrieval_default_excludes_statuses: [SUPERSEDED, HISTORICAL, REJECTED, RETIRED, LEGACY]
# Minimum authority level per operation class (framework §23). Enforced mechanically by runtime::authority::require
# on every executable path; unknown roles are rejected; a class missing here is treated as L3.
authority_levels_required:
  read: L0
  rebuild_memory: L0
  memory_benchmark: L2
  memory_select: L3
  create_task: L2
  mutate_task_status: L2
  claim_task: L1
  release_task: L1
  force_release_task: L3
  close_task: L1
  force_close_task: L3
  readiness_plan: L2
  checkpoint: L1
  create_handoff: L2
  return_handoff: L1
  create_gate: L2
  present_gate: L1
  answer_gate: L3            # relaying a human's answer; the `human` role (L5) answers directly; agents only within agent_resolvable_when
  revoke_gate: L4            # withdraw a gate and every approval derived from it
  grant_policy_exception: L4 # the authority a decision must carry to authorise a PROJECT_EXCEPTIONS entry
  override_kernel_integrity: L4 # proceed on an unverified installed kernel (plus a presented, answered gate)
  execute_plugin: L2         # trigger a governed capability plugin (plus TOOL_POLICY.plugins and the descriptor's approved_roles)
  register_plugin: L2        # plus TOOL_PERMISSIONS.install_authority_roles; elevated permissions raise a gate
  propose_cit: L2
  simulate_cit: L2
  approve_cit_auto: L3
  approve_cit_human: L3      # plus a presented, answered gate (INV-008)
  reject_cit: L3
  execute_cit: L3
  rollback_cit: L3
  emergency_control: L3      # pause / freeze writes / cancel agents
  resume_control: L4
  install_kernel: L4         # init, kernel reinstall
  update_apply: L4
  install_tool: L2           # plus TOOL_PERMISSIONS.install_authority_roles
  migrate_execute: L3        # adopt migrate / extract-legacy / rollback batch
  build_memory: L2
  upstream_prepare: L1
  upstream_submit: L3
  recover: L3
  sweep_claims: L3
  record_routing_evidence: L1
  retire_legacy_mechanism: L3
  mutate_governance_project_overlay: L3
  mutate_spec_decisions: L3
  mutate_spec_other: L2
  mutate_product_source: L1
  # G0 (BC-P2-08): every command that writes authoritative, governed, governed-test, derived or evidence state has a
  # class. The CLI maps every invocation to one class (orchestration::control::COMMAND_GUARDS); an invocation that
  # declares no role carries L0, and a declared `human` role carries L0 (human authority is owner-signed).
  record_audit: L0           # audit / verify governance / verify product / health run|product|close-check persist an EVIDENCE audit record (independent auditors are L0)
  replan_tasks: L2           # task replan rewrites READY/BLOCKED/WAITING_HUMAN on authoritative task records
  compile_context: L0        # context compile writes a derived, rebuildable packet cache
  regenerate_heldout_set: L3 # memory heldout-starter overwrites the governed retrieval held-out test set
  generate_adapters: L2      # adapters generate rewrites governance/generated/adapters
  generate_tool_registry: L2 # tools registry rewrites governance/generated/tool-registry.json
  emit_telemetry: L0         # telemetry emit appends observability evidence
  adoption_plan: L3          # adopt baseline / inventory / classify / map / plan / test-design
  adoption_review: L0        # adopt review / verify-migration / verify-memory / audit (independent L0 roles; a role must still be declared)
  record_skill_binding: L3   # health skills --record binds skill versions to content in governance/generated/skill-bindings.json (the level skills::record already applied as the undeclared-class default)
