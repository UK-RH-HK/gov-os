version: 1.0.0
# Human-facing minimal surface (section 34) and internal governance operations (section 35).
human_surface:
  - {command: status, operation: status, description: Reconstruct and print current governed project state}
  - {command: continue, operation: continue, description: Determine and present the correct next work}
  - {command: decide, operation: decide, description: Answer a pending Human Decision Gate}
  - {command: audit, operation: run_governance_suite, description: Run the governance verification suite and record an audit}
  - {command: pause, operation: pause, description: Emergency control - pause execution}
internal_operations:
  - {operation: discover, cli: "task create --class discovery"}
  - {operation: impact_simulate, cli: "cit simulate"}
  - {operation: approve, cli: "cit approve"}
  - {operation: reject, cli: "cit reject"}
  - {operation: compile_context, cli: "context compile"}
  - {operation: claim_task, cli: "task claim"}
  - {operation: release_task, cli: "task release"}
  - {operation: create_task, cli: "task create"}
  - {operation: close_task, cli: "task close"}
  - {operation: rebuild_memory, cli: "rebuild-memory"}
  - {operation: run_governance_suite, cli: "audit"}
  - {operation: run_product_suite, cli: "verify product"}
  - {operation: checkpoint, cli: "checkpoint create"}
  - {operation: resolve_skill, cli: "skills resolve"}
  - {operation: resolve_tool, cli: "tools resolve"}
  - {operation: install_tool, cli: "tools install"}
  - {operation: create_handoff, cli: "handoff create"}
  - {operation: replan, cli: "task dag"}
  - {operation: rollback_transaction, cli: "cit rollback"}
  - {operation: pause, cli: "pause"}
  - {operation: freeze_writes, cli: "freeze-writes"}
  - {operation: cancel_agents, cli: "cancel-agents"}
  - {operation: resume, cli: "resume"}
  - {operation: doctor, cli: "doctor"}
  - {operation: init, cli: "init"}
  - {operation: adopt, cli: "adopt"}
  - {operation: update_check, cli: "update --check"}
  - {operation: update_apply, cli: "update --apply"}
  - {operation: upstream_prepare, cli: "upstream prepare"}
  - {operation: upstream_submit, cli: "upstream submit"}
  - {operation: recover, cli: "recover"}
intent_patterns:
  # Deterministic natural-language routing (T0). Provider adapters may add an LLM intent parser in front.
  - {intent: DISCOVER, patterns: ["discover", "investigate", "find the best approach", "is it worthwhile", "tell me the impact"], plan: [create_discovery_task, research, candidate_change, impact_simulate, present_impact]}
  - {intent: APPROVE, patterns: ["approve", "go ahead", "accept option", "yes do it"], plan: [resolve_pending_proposal, record_decision, cit_execute, propagate, verify, continue]}
  - {intent: REJECT, patterns: ["reject", "don't do", "do not do", "decline"], plan: [resolve_pending_proposal, reject]}
  - {intent: STATUS, patterns: ["status", "where are we", "what is the state"], plan: [status]}
  - {intent: CONTINUE, patterns: ["continue", "carry on", "next", "what should we do next"], plan: [continue]}
  - {intent: PAUSE, patterns: ["pause", "stop", "hold"], plan: [pause]}
  - {intent: FREEZE, patterns: ["freeze", "no more writes"], plan: [freeze_writes]}
  - {intent: ROLLBACK, patterns: ["roll back", "rollback", "undo"], plan: [rollback_transaction]}
  - {intent: AUDIT, patterns: ["audit", "verify the repository", "health check"], plan: [run_governance_suite]}
  - {intent: DECIDE, patterns: ["option a", "option b", "option c", "i choose", "my decision"], plan: [decide]}
