version: 1.0.0
# An invocation that declares no role (neither --role nor GOV_ROLE) acts as `undeclared` with L0 authority: no spawned
# worker behaves as an orchestrator unless explicitly assigned that role (framework §23; BC-P2-08).
authority_levels:
  L0: {name: read-only analyst/auditor, mutation: none}
  L1: {name: worker, mutation: scoped source/document mutation}
  L2: {name: domain maintainer, mutation: scoped domain-state mutation}
  L3: {name: change controller, mutation: cross-artifact state transaction}
  L4: {name: orchestrator/CTO, mutation: planning, routing, dispatch and coordination}
  L5: {name: human/product owner, mutation: final authority at defined gates}
# Role groups referenced by MEMORY_POLICY.namespaces.<ns>.roles (namespace/role retrieval filter).
groups:
  engineering: [orchestrator, architecture-agent, frontend-engineer, backend-engineer, data-engineer, integration-engineer, ai-ml-engineer, devops-engineer, security-engineer, performance-engineer, independent-test-designer, test-execution-agent, integration-agent, change-controller, memory-engineer, tooling-engineer, independent-auditor, release-agent, migration-executor, migration-reviewer, migration-verifier, memory-verifier, human]
  product: [orchestrator, product-spec-agent, ux-agent, research-agent, data-author, routine-documentation, human]
roles:
  - {id: orchestrator, name: CTO / Senior Full-Stack Orchestrator, level: L4, minimum_tier: T3, default_reasoning: high}
  - {id: product-spec-agent, name: Product/Specification Agent, level: L2, minimum_tier: T2, default_reasoning: medium}
  - {id: research-agent, name: Research Agent, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: architecture-agent, name: Architecture Agent, level: L2, minimum_tier: T3, default_reasoning: high}
  - {id: ux-agent, name: UX Agent, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: frontend-engineer, name: Frontend Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: backend-engineer, name: Backend Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: data-engineer, name: Database/Data Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: integration-engineer, name: Integration/API Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: ai-ml-engineer, name: AI/ML Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: devops-engineer, name: DevOps/SRE Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: security-engineer, name: Security Engineer, level: L2, minimum_tier: T3, default_reasoning: high}
  - {id: performance-engineer, name: Performance Engineer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: data-author, name: Data Author, level: L1, minimum_tier: T1, default_reasoning: low}
  - {id: independent-test-designer, name: Independent Test Designer, level: L1, minimum_tier: T2, default_reasoning: medium}
  - {id: test-execution-agent, name: Test Execution Agent, level: L1, minimum_tier: T1, default_reasoning: low}
  - {id: integration-agent, name: Integration Agent, level: L2, minimum_tier: T2, default_reasoning: medium}
  - {id: change-controller, name: Change Controller, level: L3, minimum_tier: T3, default_reasoning: high}
  - {id: memory-engineer, name: Memory/Knowledge Engineer, level: L2, minimum_tier: T3, default_reasoning: high}
  - {id: tooling-engineer, name: Tooling/MCP Engineer, level: L2, minimum_tier: T2, default_reasoning: medium}
  - {id: independent-auditor, name: Independent Auditor, level: L0, minimum_tier: T3, default_reasoning: high}
  - {id: release-agent, name: Release Agent, level: L2, minimum_tier: T2, default_reasoning: medium}
  - {id: routine-documentation, name: Routine Documentation Agent, level: L1, minimum_tier: T1, default_reasoning: low}
  - {id: migration-executor, name: Migration/Adoption Executor, level: L3, minimum_tier: T3, default_reasoning: high}
  - {id: migration-reviewer, name: Independent Migration Reviewer & Test Author, level: L0, minimum_tier: T3, default_reasoning: high}
  - {id: migration-verifier, name: Independent Migration Verifier, level: L0, minimum_tier: T3, default_reasoning: high}
  - {id: memory-verifier, name: Independent Memory Verifier, level: L0, minimum_tier: T3, default_reasoning: high}
  # L5 is never conferred by a role declaration (--role / GOV_ROLE are caller claims, D-0007 T5): a declared `human`
  # role carries L0. Human answers and approvals are owner-signed documents verified against the
  # administrator-provisioned `human-gate` anchor (runtime human_channel; BC-P2-10).
  - {id: human, name: Human / Product Owner, level: L5, minimum_tier: none, default_reasoning: none}
