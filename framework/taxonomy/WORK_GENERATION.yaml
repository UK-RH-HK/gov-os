version: 1.0.0
# Governed work generated from events (BC-P2-24; Contract v3:571-583 "Tasks can be generated from: readiness gaps,
# failed tests, audit findings, research discoveries, human decisions, CIT effects, lessons, missing tools/skills,
# retrieval failures, security findings, performance regressions"; framework §43 "The WBS is therefore a continuously
# compiled execution graph, not a static plan"; frozen gate contract AC-5 "remediation/task generation").
#
# The engine is `runtime/src/orchestration/generation.rs`. For every source below it derives, from the governed
# records and recorded evidence the event left, one linked task per occurrence, in the same DAG as all other work:
# `derived_from` the source record(s) (a DERIVED_FROM edge), `generation: {source, subject, key, occurrence, ...}`, and
# the task class / designated role declared here. Generation is idempotent (one task per occurrence key; at most one
# open task per source subject) and runs when the event occurs — after every governed write command, and inside the
# task operations that pick or complete work. It never deletes anything and respects FREEZE_WRITES / PAUSE.
#
# `class` is the generated task's class; `role` its designated role (it binds who may claim and close it; null = any
# role); `paths` its allowed_paths (empty = the whole repository, i.e. an unrestricted mutation scope).
generated_by: gov work generation
# health, audit and security findings at or above this severity generate remediation work; lower ones are disclosures
severity_threshold: medium
sources:
  failed-tests: {class: repair, role: null, paths: [], contract: "Contract v3:574 failed tests"}
  audit-finding: {class: governance, role: change-controller, paths: ["spec/**"], contract: "Contract v3:575 audit findings; AC-5"}
  health-failure: {class: governance, role: change-controller, paths: ["spec/**"], contract: "Contract v3 O5 / AC-5 remediation from each health failure"}
  security-finding: {class: security, role: security-engineer, paths: [], contract: "Contract v3:582 security findings"}
  memory-health: {class: memory, role: memory-engineer, paths: ["spec/**", "governance/tests/memory/**"], contract: "Contract v3:575 audit findings (knowledge fabric)"}
  research-discovery: {class: discovery, role: product-spec-agent, paths: ["spec/**"], contract: "Contract v3:576 research discoveries"}
  proposed-decision: {class: decision-preparation, role: product-spec-agent, paths: ["spec/**"], contract: "Contract v3:576 research discoveries (proposed decisions)"}
  human-decision: {class: specification, role: product-spec-agent, paths: ["spec/**"], contract: "Contract v3:577 human decisions"}
  cit-effect: {class: validation, role: null, paths: [], contract: "Contract v3:578 CIT effects; :1134 revalidation/rework tasks are generated"}
  lesson: {class: governance, role: orchestrator, paths: ["spec/**"], contract: "Contract v3:579 lessons"}
  missing-tool: {class: tooling, role: tooling-engineer, paths: ["spec/**", "tools/**", "capabilities/**"], contract: "Contract v3:580 missing tools"}
  missing-skill: {class: tooling, role: tooling-engineer, paths: ["spec/**", "framework/skills/**", "governance/project/**"], contract: "Contract v3:580 missing skills"}
  retrieval-failure: {class: memory, role: memory-engineer, paths: ["spec/**", "governance/tests/memory/**"], contract: "Contract v3:581 retrieval failures; framework §18"}
  tool-failure: {class: tooling, role: tooling-engineer, paths: ["spec/**", "tools/**", "capabilities/**"], contract: "Contract v3:580 missing/failing tools; framework §11.8"}
  failure: {class: repair, role: null, paths: [], contract: "framework §11.8 failure memory (bug, failed approach, incorrect assumption, regression, migration failure)"}
  performance-regression: {class: performance, role: performance-engineer, paths: [], contract: "Contract v3:583 performance regressions"}
# health checks (scheduler catalogue ids) whose failures are security findings, and those of the knowledge fabric
security_checks: [secrets_sensitivity_indexing, os_binding_integrity, plugin_governance, installation_authenticity, D003, D011, D012, D029, D032, D033]
memory_checks: [index_content_coverage, memory_retrieval_regression, D025]
# a finding whose message names one of these is a security finding whichever check reported it
security_markers: ["secret", "credential", "private key", "password", "api key", "access key"]
# checks whose failures another source already turns into work (W7 orphan investigations; failed tests; failure
# memory), that only restate other checks (D031 active blocks; D021 evidence currency, re-established by the next
# health run), or that report the OS's own derived views lagging behind the records (index freshness, the derived
# runtime, framework.json, generated adapters): their remedy is the OS regenerating them (`gov rebuild-memory`,
# `gov adapters generate`), not governed work
excluded_checks: [lineage_orphans, product_test_health, D030, D031, D034, D021, index_freshness, D008, D009, D010, D020]
# checks whose remedy no project role can perform, with that remedy: the installation's trust posture belongs to the
# administrator domain (provision a Signed Release Root anchor, then reinstall from a release signed under it;
# OWNER-DECISION-P2-0002 admits a marked bootstrap installation meanwhile). Their failures stay reported by doctor,
# status and the health state, and appear in the generation report under `skipped` with this remedy; they generate no
# task that no agent could ever close
outside_project_checks:
  installation_authenticity: "administrator: gov trust provision --anchor <administrator root metadata>, then gov kernel reinstall --source <a release signed under that root> (OWNER-DECISION-P2-0002)"
# a doctor check and a governance-suite family that report the same condition generate one piece of work
same_condition: {D015: graph_integrity, D011: secrets_sensitivity_indexing, D012: secrets_sensitivity_indexing, D023: schema_invariants, D033: os_binding_integrity, D032: installation_authenticity}
# report / worker-return items that say there is nothing to follow up
trivial_items: ["", "none", "n/a", "na", "-", "nothing", "no", "none known", "no unknowns", "not applicable"]
# performance regressions: a measured value against a declared baseline, or against the median of earlier samples
performance:
  factor: 1.5
  min_delta_ms: 10
  min_samples: 5
  measures: [latency_ms, duration_ms, p95_ms, p99_ms, elapsed_ms]
  baselines: [baseline_ms, threshold_ms, budget_ms, baseline]
  # telemetry of the Governance OS itself is not product performance (its own SLOs are Gate U)
  own_namespaces: ["cli.", "audit", "retrieval", "health", "product.suite", "failure_memory", "work.generation"]
  # without a declared baseline, only these namespaces are compared with their own history
  history_namespaces: ["perf.", "performance.", "benchmark.", "product.perf"]
