  - {id: inputs, gap_task_class: specification, pre_implementation: true}
  - {id: data_model_schema, gap_task_class: data, pre_implementation: true}
  - {id: representative_test_data, gap_task_class: data, gap_task_role: data-author, pre_implementation: true}
  - {id: processing_algorithm, gap_task_class: research, pre_implementation: true}
