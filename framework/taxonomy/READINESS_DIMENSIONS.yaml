version: 1.0.0
cell_states: [PRESENT, MISSING, PROVISIONAL, BLOCKED, N/A_WITH_REASON]
# `gap_task_class` is the task class generated when the cell is MISSING;
# `gap_task_role` (optional) is the designated role of that generated task: the designated role binds who may claim and
# close it, so independent acceptance tests and representative test data are produced by roles independent of the
# implementer (Contract v3 H4, O3; BC-P2-34 task-role side);
# `pre_implementation` cells must be PRESENT (or N/A_WITH_REASON) before implementation tasks become READY.
dimensions:
  - {id: intent_outcome, gap_task_class: specification, pre_implementation: true}
