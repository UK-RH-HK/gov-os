# Executable checks for the validation scenarios of the kernel skills (Contract v3:401 "Skill regression is testable";
# framework §27). Read by the governance suite family `skill_regression` from the verified installed kernel.
#
# Each entry is bound to one kernel-skill scenario by (skill, scenario, statement_sha256), where statement_sha256 is
# the SHA-256 of the canonical JSON of the scenario's {given, expect}. If a skill's scenario statement changes, the
# entry no longer applies and the scenario is reported unexecutable until its check is revised.
#
# mode:
#   executable     `check.steps` run by the gov binary itself against a disposable copy of the project (never the
#                  live repository). Step kinds: `gov` (argv; optional role, expect, save), `write` (path + text|json),
#                  `yaml_set` (path + key path + value). A `gov` step without `expect` must succeed. Expectations:
#                  ok, error_code, equals, one_of, nonempty over dotted paths (`body.` = result, or error details).
#   agent          the expectation is about agent behaviour or agent-authored content; executed by the G6
#                  agent-qualification harness (Phase 4), never claimed by the governance suite.
#   qualification  needs a synthetic repository scenario (adoption, live migration); executed at G6.
#   deferred       product-checkable, but the executable form is not asserted yet; `reason` says why and who owns it.
version: 1.0.0
checks:
  - skill: SKL-TASK-CLOSE
    scenario: V1
    statement_sha256: 86138012cc33e98f8842155dc22cadeef4f8766ab187351d2fdf6f733508dad8
    mode: executable
    check:
      steps:
        - gov: [task, create, --class, validation, --objective, "skill scenario SKL-TASK-CLOSE V1", --allowed, "docs/**", --status, READY]
          save: {task: result.id}
        - gov: [task, claim, "${task}"]
        - write: {path: docs/skill-scenario-task-close.md, text: "written after the last index build\n"}
        - write:
            path: .governance-runtime/skill-scenario-report.json
            json: {work_completed: "skill scenario probe", files_changed: [docs/skill-scenario-task-close.md], tests: {status: not_applicable_with_reason, reason: "skill scenario"}}
        - gov: [task, close, "${task}", --report, "${root}/.governance-runtime/skill-scenario-report.json"]
          expect: {ok: false, error_code: INDEX_STALE}
  - skill: SKL-BACKEND-IMPL
    scenario: V1
    statement_sha256: 99b85e6fe364d2c20b8e24028d38b5ed729a64272a031371a4a55523792e8544
    mode: executable
    check:
      steps:
        - gov: [task, create, --class, refactor, --objective, "skill scenario SKL-BACKEND-IMPL V1", --allowed, "src/**", --status, READY]
          save: {task: result.id}
        - gov: [task, claim, "${task}"]
        - write: {path: governance/project/SKILL-SCENARIO-PROBE.md, text: "outside the task's allowed paths\n"}
        - write:
            path: .governance-runtime/skill-scenario-report.json
            json: {work_completed: "skill scenario probe", files_changed: [governance/project/SKILL-SCENARIO-PROBE.md], tests: {status: not_applicable_with_reason, reason: "skill scenario"}}
        - gov: [task, close, "${task}", --report, "${root}/.governance-runtime/skill-scenario-report.json"]
          expect: {ok: false, error_code: MUTATION_SCOPE_VIOLATION}
  - skill: SKL-BACKEND-IMPL
    scenario: V2
    statement_sha256: 05303ed379461263807bf69a5c1fd3fbc9f41f89d73b081f44f6cbf839bf5b9a
    mode: agent
    reason: "the expectation is the status an implementing agent reports for its own work; the product side (a failing product family is recorded, makes health UNHEALTHY and refuses the close of covered work) is checked by the product_test_health family"
  - skill: SKL-API-CONTRACT-REVIEW
    scenario: V1
    statement_sha256: a8479332a36ca99eeba648c2c9beff395f8faa7027d2e0e3c771a48b1f6980a9
    mode: executable
    check:
      steps:
        - write: {path: spec/interfaces/API-9901.yaml, text: "id: API-9901\ntype: interface\ntitle: Skill scenario interface\nstatus: ACTIVE\ncontract:\n  fields: [id, total_cents, currency]\n"}
        - gov: [cit, propose, --proposal, "remove field currency from API-9901 (breaking change)", --trigger, interface_change, --targets, API-9901]
          expect: {ok: true, one_of: {result.impact.radius: [R2, R3, R4, R5]}}
  - skill: SKL-DB-MIGRATION
    scenario: V1
    statement_sha256: 69f9c93a3df093222ea6fba5ee4d2069d8957b589378441de649b5d4117194c4
    mode: agent
    reason: "requires a project database and an agent-authored destructive migration; executed by the G6 agent-qualification harness"
  - skill: SKL-IMPACT-ANALYSIS
    scenario: V1
    statement_sha256: 36dbafb730dab117ab79909ab1b5f94a64ba6204bdfe0c4a3dbce090698dd230
    mode: deferred
    reason: "the executable form below (CIT-P on governance/project/PROJECT_POLICY.yaml must yield radius R5 with a human gate) was observed FALSE on 4.1.5 (radius R2); materiality from what a change touches is BC-P2-13 (WS-4). Enable it (mode: executable) when that repair lands."
    check:
      steps:
        - gov: [cit, propose, --proposal, "skill scenario SKL-IMPACT-ANALYSIS V1: change the project policy overlay", --targets, governance/project/PROJECT_POLICY.yaml]
          expect: {ok: true, equals: {result.impact.radius: R5}, nonempty: [result.human_gate]}
  - skill: SKL-LIVE-MIGRATION
    scenario: V1
    statement_sha256: d58f9b3e80a7e3241ff4c269960c52245c564eb055f0bf25972878931341be47
    mode: qualification
    reason: "needs a brownfield repository with a failing post-batch test; exercised by the G6 synthetic-repository adoption run"
  - skill: SKL-MEMORY-RECONSTRUCTION
    scenario: V1
    statement_sha256: 4924d74482872d64a898aa5f6f6011399f5e8c447cd59d927ecb80a9508b93be
    mode: executable
    check:
      steps:
        - write: {path: config/.env.skill-scenario, text: "AWS_SECRET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE\n"}
        - gov: [rebuild-memory]
        - gov: [doctor]
          expect: {equals: {"body.checks[id=D012].ok": true}}
  - skill: SKL-REPO-ADOPTION
    scenario: V1
    statement_sha256: edd84146a57ed1440e4bb8e24fc799b436e8fd3b5186ecfb1748f89bd3134425
    mode: qualification
    reason: "adoption stages run on a brownfield repository before installation; exercised by the G6 synthetic-repository adoption run"
  - skill: SKL-REPO-ADOPTION
    scenario: V2
    statement_sha256: a56ac5960a6e2c674557071fd9a3dfe9dc3593a9c59aa56155ed8a12b8a4ea9c
    mode: qualification
    reason: "adoption stages run on a brownfield repository before installation; exercised by the G6 synthetic-repository adoption run"
  - skill: SKL-RESEARCH-BENCHMARK
    scenario: V1
    statement_sha256: e50b4791495ea2887f6b98151f0fcc76d4cb965f02e002abb20e184b63a438b9
    mode: deferred
    reason: "the executable form below (a research record without method fails schema validation) was observed FALSE on 4.1.5 (research.schema.json requires only id/type/status/question); research completeness is BC-P2-47 (WS-10). Enable it (mode: executable) when that repair lands."
    check:
      steps:
        - write: {path: spec/research/RES-9901.yaml, text: "id: RES-9901\ntype: research\ntitle: Skill scenario research without method\nstatus: ACTIVE\nquestion: does the research record need a method?\n"}
        - gov: [audit, --no-persist, --family, schema_invariants]
          expect: {nonempty: ["body.findings[path=spec/research/RES-9901.yaml]"]}
  - skill: SKL-TEST-DESIGN
    scenario: V1
    statement_sha256: da35b2c12b4fd8bfb9b4717c871d06b05722f5e8adee6e1782307005d2dc16ad
    mode: agent
    reason: "the expectation concerns how a test-design agent records authorship and readiness; independence from recorded authorship is BC-P2-34"
  - skill: SKL-THREAT-MODEL
    scenario: V1
    statement_sha256: 178326a55e41ab8c1ca45674f7328d61312990e4170a3fc441eeba42d27cad91
    mode: agent
    reason: "the expectation concerns the content of an agent-authored threat model; executed by the G6 agent-qualification harness"
  - skill: SKL-TOOL-INSTALL
    scenario: V1
    statement_sha256: f86d803f0fb6cb22c15f3fb0da743f1092c667f55c4903db2cf6b27b34f406fb
    mode: executable
    check:
      steps:
        - write:
            path: .governance-runtime/skill-scenario-tool.json
            json: {tool_id: skill-scenario-tool, name: skill-scenario-tool, license: SSPL-1.0, reversible: true, version_pin: "1.0.0", install_command: ["true"], uninstall_command: ["true"], health_check: {kind: command, command: ["true"]}}
        - gov: [tools, install, --descriptor, "${root}/.governance-runtime/skill-scenario-tool.json"]
          expect: {one_of: {body.installed: [false, null]}, nonempty: [body.human_gate]}
