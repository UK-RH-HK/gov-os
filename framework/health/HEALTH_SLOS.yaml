# Framework-health SLOs (Contract v3 Gate U, lines 978-993 "Track and threshold"; framework §75) and the thirteen
# conditions of a HEALTHY repository (Contract v3:995-1008; framework §76). Read by the governance suite family
# `health_slos`, doctor D035 and `gov health status` (`verification::slo`); compiled into the runtime.
#
# Every SLO names its measure, its declared threshold and its `owner`: the check whose finding changes the health
# state when the threshold is crossed. Where a kernel policy already declares the threshold (`policy:`), the effective
# policy value is used (a project overlay may tighten it as POLICY_PRECEDENCE allows); the other thresholds are the
# framework defaults declared here. A rate SLO is judged once its population reaches `min_population` (a percentage of
# fewer items is reported, not judged). `severity` is the severity of the finding a crossing raises; `unmeasured` is
# the severity when the SLO applies but nothing has been recorded to measure it.
version: 1.0.0
slos:
  - id: governance_suite_freshness
    contract: "Contract v3:980"
    title: governance-suite freshness
    measure: the latest honoured green governance-suite record is current for every evidence input class (verification::currency)
    threshold: {policy: TEST_POLICY.green_record_currency, rule: current}
    owner: D021
    severity: medium
  - id: product_test_health
    contract: "Contract v3:981"
    title: product-test health
    measure: product test families whose latest recorded result (current for its inputs) failed (verification::product)
    threshold: {max_failing_families: 0}
    owner: product_test_health
    severity: high
  - id: retrieval_recall_at_k
    contract: "Contract v3:982"
    title: retrieval Recall@K
    measure: held-out retrieval regression recall@k of the latest memory_retrieval_regression result
    threshold: {policy: MEMORY_POLICY.regression.min_recall_at_k}
    owner: memory_retrieval_regression
    severity: high
  - id: stale_index_count
    contract: "Contract v3:983"
    title: stale-index count
    measure: governed artefacts whose index entry is stale, added or removed since the last build (memory::manifest::freshness)
    threshold: {policy: MEMORY_POLICY.freshness.max_stale_artifacts_on_task_close}
    owner: index_freshness
    severity: medium
  - id: orphan_graph_count
    contract: "Contract v3:984"
    title: orphan-graph count
    measure: current (ACTIVE) records whose purpose is to be implemented, validated, consumed or worked on (feature, requirement, scenario, test obligation, interface, task) and research/experiment evidence expected to feed a decision, that the relationship graph neither reaches nor leaves (graph::orphan_nodes). Decisions and architecture records govern the project as a whole and may stand alone; the project record, audit evidence and PROVISIONAL candidates awaiting review are not counted
    threshold: {max: 0}
    owner: health_slos
    severity: medium
  - id: unresolved_contradictions
    contract: "Contract v3:985"
    title: unresolved contradictions
    measure: contradictions between current authoritative records (context::contradictions), supersession conflicts and duplicate ids
    threshold: {max: 0}
    owner: authority_unambiguous
    severity: medium
  - id: unresolved_human_gates
    contract: "Contract v3:986"
    title: unresolved human gates
    measure: open (pending or presented, unanswered) Human Decision Gates, and the age of the oldest
    # more open human decisions than the parallel work streams BUDGET_POLICY allows means human decisions are the
    # bottleneck; a decision left open longer than three days is stale
    threshold: {max_open: {policy: BUDGET_POLICY.defaults.max_parallel_agents}, max_age_hours: 72}
    owner: health_slos
    severity: medium
  - id: task_traceability
    contract: "Contract v3:987"
    title: task traceability %
    measure: live tasks (generated remediation excluded) that declare the upstream authority they serve (feature, requirement, scenario, decision, interface, architecture or explicit input) and, when DONE under a traceability-required class, whose closing report traces what they implemented
    threshold: {min: 0.8, min_population: 3}
    owner: health_slos
    severity: medium
  - id: feature_readiness_coverage
    contract: "Contract v3:988"
    title: feature readiness coverage
    measure: mean readiness coverage (cells PRESENT or N/A with reason, orchestration::readiness) over active features
    threshold: {min_mean: 0.5, min_population: 1}
    owner: health_slos
    severity: medium
  - id: context_packet_size
    contract: "Contract v3:989"
    title: context packet size
    measure: the largest compiled context packet of a live task (characters)
    threshold: {policy: CONTEXT_POLICY.max_packet_chars}
    owner: health_slos
    severity: medium
  - id: tokens_per_completed_task
    contract: "Contract v3:990"
    title: tokens/completed task
    measure: model tokens (input + output) recorded for DONE tasks — closing-report `cost`, routing evidence, telemetry — per DONE task that recorded any
    threshold: {max: 2000000}
    owner: health_slos
    severity: medium
    unmeasured: low
  - id: first_pass_completion
    contract: "Contract v3:991"
    title: first-pass completion
    measure: closing reports whose outcome is success with no repair (repair_count 0)
    threshold: {min: 0.5, min_population: 1}
    owner: health_slos
    severity: medium
  - id: handoff_failure
    contract: "Contract v3:992"
    title: handoff failure
    measure: returned handoffs whose worker return failed or was blocked, violated its authority, or did not validate as a consumption receipt
    threshold: {max_rate: 0.5, min_population: 1}
    owner: health_slos
    severity: medium
  - id: memory_rebuild_success
    contract: "Contract v3:993"
    title: memory rebuild success
    measure: the tracked index manifest matches the live index; a deep run's two full rebuilds reproduce the manifest (recovery_rebuild)
    threshold: {rule: reproducible}
    owner: recovery_rebuild
    severity: medium
  - id: fresh_agent_reconstruction_success
    contract: "Contract v3:993"
    title: fresh-agent reconstruction success
    measure: a fresh agent reconstructs state within the read budget (fresh_agent_reconstruction)
    threshold: {policy: CONTEXT_POLICY.fresh_agent_read_budget_files}
    owner: fresh_agent_reconstruction
    severity: medium
# The thirteen conditions (Contract v3:996-1008). A condition holds when every owning check's latest outcome passed
# (families: the latest suite result; doctor checks: the latest doctor run); it fails when one failed, and it is
# unknown while none has been evaluated. The repository is HEALTHY only when all thirteen hold.
conditions:
  - {id: H1, contract: "Contract v3:996", title: authority unambiguous, owners: [D014, D027, D029, D003, schema_invariants, authority_unambiguous, authority_role_limits, policy_precedence, mutation_scope]}
  - {id: H2, contract: "Contract v3:997", title: no accidental legacy authority, owners: [D013, legacy_authority]}
  - {id: H3, contract: "Contract v3:998", title: deterministic state consistent, owners: [D002, D004, D016, D023, D026, change_control_integrity, concurrency_claims, os_binding_integrity, task_contract_integrity]}
  - {id: H4, contract: "Contract v3:999", title: graph/index freshness passes, owners: [D009, D010, D015, D025, graph_integrity, index_freshness, index_content_coverage, upstream_change_propagation]}
  - {id: H5, contract: "Contract v3:1000", title: retrieval meets thresholds, owners: [memory_retrieval_regression]}
  - {id: H6, contract: "Contract v3:1001", title: sensitive material isolated, owners: [D011, D012, path_map_compliance, secrets_sensitivity_indexing]}
  - {id: H7, contract: "Contract v3:1002", title: feature readiness explicit, owners: [feature_readiness]}
  - {id: H8, contract: "Contract v3:1003", title: task runnable/blocked state correct, owners: [graph_integrity, human_gate_integrity, concurrency_claims]}
  - {id: H9, contract: "Contract v3:1004", title: tests/traceability satisfy policy, owners: [D030, product_test_health, product_traceability, lineage_orphans, research_experiment_data_lifecycle]}
  - {id: H10, contract: "Contract v3:1005", title: governance suite current/green, owners: [D021]}
  - {id: H11, contract: "Contract v3:1006", title: no unresolved critical audit finding, owners: [unresolved_audit_findings], also: any evaluated check whose latest outcome carries a critical finding}
  - {id: H12, contract: "Contract v3:1007", title: fresh strong agent reconstructs state within budget, owners: [fresh_agent_reconstruction, continuity_checkpoint_handoff]}
  - {id: H13, contract: "Contract v3:1008", title: derived memory is rebuildable, owners: [D009, recovery_rebuild]}
