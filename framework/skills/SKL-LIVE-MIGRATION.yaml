id: SKL-LIVE-MIGRATION
name: Live path migration
version: 1.0.0
status: ACTIVE
model_agnostic: true
roles: [migration-executor]
task_classes: [migration]
purpose: "Execute an approved migration batch with checkpoint, reference updates, tests and rollback point."
required_permissions: [READ_REPO, WRITE_REPO_SCOPED, RUN_TESTS]
required_tools: [TOOL-FS-001, TOOL-GIT-001, TOOL-TEST-001]
inputs: [approved migration plan batch]
outputs: [migration ledger entry, evidence, checkpoint]
method:
  - {step: checkpoint, description: Create a checkpoint and snapshot rollback point.}
  - {step: execute, description: Apply only the batch's catalogued actions.}
  - {step: update-references, description: Rewrite links and imports for moved artefacts.}
  - {step: verify, description: Run independent-authored path/link/import tests and affected product tests.}
  - {step: ledger, description: Record evidence; on failure stop the dependency chain and roll back.}
validation_scenarios:
  - {id: V1, given: failing post-batch test, expect: batch rolled back and downstream batches not executed}
